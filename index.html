<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>소방기술사 복습</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#ea580c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="소방복습" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />

<style>
  :root{
    --bg:#0c0a09; --panel:#17140f; --panel2:#1c1814;
    --line:rgba(255,255,255,0.08); --line2:rgba(255,255,255,0.12);
    --text:#f5f2ee; --sub:#c9c2b8; --sub2:#a39c90;
    --orange:#ea580c; --orange-soft:rgba(234,88,12,0.15); --orange-line:rgba(234,88,12,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;}
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header{padding:calc(28px + env(safe-area-inset-top,0px)) 20px 20px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:8px;color:var(--orange);font-size:11px;font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;}
  h1{margin:8px 0 4px;font-size:24px;font-weight:800;letter-spacing:-0.02em;}
  .subtitle{margin:0;color:var(--sub);font-size:13.5px;}
  .cards{padding:20px;display:flex;flex-direction:column;gap:14px;}
  .card{display:flex;align-items:center;gap:16px;border-radius:18px;background:var(--panel);
    border:1px solid var(--line);padding:18px;text-decoration:none;color:var(--text);transition:.15s;}
  .card:active{background:var(--panel2);}
  .card .icon{font-size:30px;flex:0 0 auto;width:52px;height:52px;border-radius:14px;
    background:var(--orange-soft);border:1px solid var(--orange-line);display:flex;
    align-items:center;justify-content:center;}
  .card .label{margin:0 0 2px;font-size:16.5px;font-weight:700;}
  .card .desc{margin:0;font-size:12.5px;color:var(--sub2);}
  .card .arrow{margin-left:auto;color:var(--sub2);font-size:18px;flex:0 0 auto;}
  footer{margin-top:auto;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));
    color:var(--sub2);font-size:11px;text-align:center;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">🔥 FIRE ENGINEER</div>
    <h1>소방기술사 복습</h1>
    <p class="subtitle">마인드맵 · 복습노트 · 객관식 문제풀이</p>
  </header>

  <div class="cards">
    <a class="card" href="apps/mindmap.html">
      <div class="icon">🕸️</div>
      <div>
        <p class="label">통합 연결망 마인드맵</p>
        <p class="desc">전 챕터를 하나로 잇는 개념 지도</p>
      </div>
      <div class="arrow">›</div>
    </a>
    <a class="card" href="apps/notes.html">
      <div class="icon">📘</div>
      <div>
        <p class="label">복습노트</p>
        <p class="desc">주차 · 강별 개념 정리</p>
      </div>
      <div class="arrow">›</div>
    </a>
    <a class="card" href="apps/quiz.html">
      <div class="icon">📝</div>
      <div>
        <p class="label">객관식 문제풀이</p>
        <p class="desc">기출 기반 객관식 연습</p>
      </div>
      <div class="arrow">›</div>
    </a>
  </div>

  <footer>홈 화면에 추가하면 앱처럼 사용할 수 있습니다</footer>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (e) {
        console.warn('SW 등록 실패:', e);
      });
    });
  }
</script>
</body>
</html>
