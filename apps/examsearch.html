<!DOCTYPE html>
<html lang="ko">
<head>
<script src="../shell.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>기출문제 검색 — 소방기술사</title>
<style>
  :root{
    --bg:#f5f3ef; --panel:#ffffff; --panel2:#ece9e4;
    --line:rgba(0,0,0,0.08); --line2:rgba(0,0,0,0.12);
    --text:#1c1815; --sub:#57524c; --sub2:#8a847d;
    --orange:#ea580c; --orange-soft:rgba(234,88,12,0.12); --orange-line:rgba(234,88,12,0.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;}
  #app{max-width:720px;margin:0 auto;padding-bottom:40px;}
  header{padding:22px 18px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;}
  .brand{display:flex;align-items:center;gap:8px;color:var(--orange);font-size:11px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;}
  h1{margin:8px 0 4px;font-size:21px;font-weight:800;letter-spacing:-0.02em;}
  .subtitle{margin:0 0 14px;color:var(--sub);font-size:12.5px;}

  .mode-tabs{display:flex;gap:6px;margin-bottom:10px;}
  .mode-btn{flex:1;border:1px solid var(--line2);background:var(--panel);border-radius:10px;
    padding:9px 6px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;}
  .mode-btn.active{background:var(--orange);border-color:var(--orange);color:#fff;}

  .search-row{position:relative;}
  .search-input{width:100%;border:1px solid var(--line2);border-radius:12px;padding:12px 38px 12px 14px;
    font-size:14.5px;background:var(--panel);color:var(--text);}
  .search-input:focus{outline:none;border-color:var(--orange-line);}
  .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;
    color:var(--sub2);font-size:16px;padding:6px;cursor:pointer;display:none;}
  .search-clear.show{display:block;}

  .result-meta{padding:10px 18px 2px;font-size:12px;color:var(--sub2);}
  .results{padding:6px 14px 20px;display:flex;flex-direction:column;gap:10px;}

  .empty-state{padding:60px 24px;text-align:center;color:var(--sub2);font-size:13px;line-height:1.7;}

  .result-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;}
  .result-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:7px;}
  .session-badge{font-size:11px;font-weight:800;color:#9a6a1f;background:#fdf1e0;border:1px solid #e8c690;
    border-radius:7px;padding:3px 8px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .no-badge{font-size:10.5px;color:var(--sub2);background:var(--panel2);border-radius:6px;padding:2px 7px;white-space:nowrap;}
  .major-chip{font-size:10.5px;font-weight:700;color:#fff;border-radius:7px;padding:2px 8px;white-space:nowrap;}
  .minor-chip{font-size:10.5px;color:var(--sub);background:var(--panel2);border-radius:7px;padding:2px 8px;white-space:nowrap;}
  .page-chip{font-size:10.5px;color:#777;background:#f2f1ee;border-radius:6px;padding:2px 7px;
    font-variant-numeric:tabular-nums;white-space:nowrap;margin-left:auto;}
  .result-text{font-size:13.5px;line-height:1.55;color:#2a2622;margin-bottom:6px;white-space:pre-wrap;}
  .result-kw{font-size:11px;color:var(--sub2);}
  .result-kw b{color:var(--sub);font-weight:600;}

  .load-more{display:block;width:100%;margin:4px 0 0;border:1px solid var(--line2);background:var(--panel);
    border-radius:10px;padding:10px;font-size:12.5px;font-weight:700;color:var(--orange);cursor:pointer;}

  mark{background:#fde8c7;color:#6a3f08;border-radius:3px;padding:0 1px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">🔥 FIRE ENGINEER</div>
    <h1>🔎 기출문제 검색</h1>
    <p class="subtitle">60~140회 · 기출 2,380문항 · 엑셀 대신 여기서 바로 검색</p>

    <div class="mode-tabs">
      <button type="button" class="mode-btn active" data-mode="text" onclick="setMode('text')">문제별</button>
      <button type="button" class="mode-btn" data-mode="keyword" onclick="setMode('keyword')">키워드별</button>
      <button type="button" class="mode-btn" data-mode="page" onclick="setMode('page')">페이지별</button>
    </div>
    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="문제 내용으로 검색 (예: 환기지배형, 포소화약제)" oninput="runSearch()">
      <button type="button" class="search-clear" id="clearBtn" onclick="clearSearch()">✕</button>
    </div>
  </header>

  <div class="result-meta" id="resultMeta"></div>
  <div class="results" id="results"></div>
</div>

"pg":"p.306"},{"r":102,"s":1,"n":"7","t":"청정소화약제와 관련된 국내외 기준을 5개 이상 설명하시오.","maj":"가스계소화설비","min":"청정소화약제(할로겐화합물및불활성기체)","kw":"청정소화약제기준","pg":null},{"r":102,"s":1,"n":"8","t":"CO2 방사 시의 줄-톰슨효과(Joule-Thomson)와 운무현상을 설명하시오.","maj":"가스계소화설비","min":"이산화탄소소화설비","kw":"줄톰슨효과; 운무현상","pg":null},{"r":102,"s":1,"n":"9","t":"포소화설비에서 표면하주입식을 적용할 수 없는 경우에 대하여 설명하시오.","maj":"포소화설비","min":"포방출구·혼합방식","kw":"표면하주입식","pg":null},{"r":102,"s":1,"n":"10","t":"특별피난계단의 제연설비 설계순서를 설명하시오.","maj":"피난·제연설비","min":"부속실(특별피난계단)제연설비","kw":"제연설비설계순서","pg":null},{"r":102,"s":1,"n":"11","t":"두께가 l인 얇은재료(a)에서 입사 열유속(q_I)은 복사 또는 화염에 의한 것이고, 열손실유속(q_L)은 복사와 대류 모두에 기인된다. 재료의 상승온도(T)가 순 열유속(q), 가열시간(t), 재료의 밀도(ρ), 비열(C), 두께(l), 초기온도(T∞)와 어떠한 관계인지 설명하시오.","maj":"화재역학·연소이론","min":"화재역학","kw":"열유속; 재료온도상승","pg":null},{"r":102,"s":1,"n":"12","t":"특별피난계단의 급기가압제연 중인 부속실의 문을 열려고 한다. 얼마의 힘[N]이 필요한지 식으로 설명하고 계산하시오.(단, 문의 크기는 높이 1.8m×폭 1.2m, 차압 50Pa, 경첩과 자동폐쇄장치 등에 작용되는 힘은 40N이고 문손잡이와 출입문 끝단사이의 거리는 10cm)","maj":"피난·제연설비","min":"부속실(특별피난계단)제연설비","kw":"차압; 개방력계산","pg":"p.127"},{"r":102,"s":1,"n":"13","t":"유해화학물질 유출사고 중 최근에 누출된 불산을 제독하는 방법 중 화학적 방법과 물리적 방법으로 구분하여 설명하시오.","maj":"위험물","min":"위험물총론(분류·성질)","kw":"불산; 제독방법","pg":null},{"r":102,"s":2,"n":"1","t":"연소생성물의 성질은 연료의 구성과 화재 진행에 의해 결정된다. (1) 연소과정에 따른 연소생성물을 설명하시오 (2) 급기과잉-부족 상태의 정도를 당량비로 설명하시오 (3) 연소 시 생성되는 화학종 중 일산화탄소(CO)의 수율과의 관계를 설명하시오.","maj":"화재역학·연소이론","min":"연소생성물·독성","kw":"연소생성물; 당량비; 일산화탄소","pg":null},{"r":102,"s":2,"n":"2","t":"케이블트레이(cable tray)에는 일반적으로 여러개의 케이블(전력, 제어용 등)이 설치된다. 케이블트레이 주변에서 화재가 발생할 경우, 케이블과 케이블 상호간(inter-cable) 또는 다중케이블 내부(inter-cable)에서 전기적 고장을 일으킬 수 있다. (1)일반적인 전기화재 원인과는 달리 케이블트레이에 화재에서 발생할 수 있는 전기적 고장의 유형을 3가지를 적고 설명하시오 (2)전기적 고장으로 유발되는 부하설비와 전기패널(Panel)의 이상 현상을 설명하시오.","maj":"전기방재·방폭","min":"전기화재","kw":"케이블트레이; 전기적고장","pg":null},{"r":102,"s":2,"n":"3","t":"고층빌딩의 계단실은 연돌효과로 인하여 연기로 오염된다. 이 연돌효과를 상쇄시키는 풍속을 구하시오.(단, 대기와의 압력차는 Δp=0.71h[Pa], h:중성대로부터의 높이(m), 계단실의 수력지름은 3.33m. 계산 시 소수점 셋째자리에서 반올림)","maj":"피난·제연설비","min":"부속실(특별피난계단)제연설비","kw":"연돌효과; 풍속계산","pg":"p.206"},{"r":102,"s":2,"n":"4","t":"소방용 비상전원으로 활용할 수 있는 에너지 저장장치(Energy Storage System: ESS)의 개요, 구성, 활용효과에 대한 설명과 에너지 저장장치를 적용 할 경우 스프링클러설비의 화재안전기준(NFSC 103)에서 정한 비상전원의 출력용량에 대하여 설명하시오.","maj":"소방전기·비상전원설비","min":"비상전원(축전지·발전기)","kw":"ESS; 비상전원출력","pg":"p.122"},{"r":102,"s":2,"n":"5","t":"소방용수 수위가 펌프보다 낮은 경우 마중물(priming water)장치가 필요하다. 붙류트 펌프, 터빈펌프와 달리 마중물(priming water) 없이 작동되는 자흡식 펌프(Self-priming pump)의 개념과 작동원리를 설명하시오.","maj":"수계소화설비","min":"가압송수장치·펌프","kw":"자흡식펌프","pg":null},{"r":102,"s":2,"n":"6","t":"화재모델링에서 사용하는 존모델(zone model)과 전산유체역학모델(CFD model)에 대하여 (1)존모델과 전산유체역학모델의 주요 특성 및 차이점 (2)대표적인 존모델 및 전산유체역학모델의 유형을 각 2종류씩 예로 들고 설명하시오.","maj":"화재역학·연소이론","min":"화재역학","kw":"존모델; CFD모델","pg":null},{"r":102,"s":3,"n":"1","t":"누전에 의한 전기화재를 방지하기 위한 절연저항의 개념과 측정방법, 측정기 사용 시 주의사항 및 전기설비기술기준의 판단기준에 있는 저압전로의 절연저항 기준값을 설명하시오.","maj":"전기방재·방폭","min":"전기화재","kw":"절연저항","pg":"p.547"},{"r":102,"s":3,"n":"2","t":"화재 시 단위면적당 질량연소속도, 즉 질량연소속속(m˝)의 예측은 고체와 액체에 대하여 다르다. 그 이유는 연료표면에 대한 순 열유속(q˝) 및 기화열(L)과 관하여 설명하시오.","maj":"화재역학·연소이론","min":"화재역학","kw":"질량연소속도; 기화열","pg":"p.92"},{"r":102,"s":3,"n":"3","t":"미분무수 소화설비 시스템의 적용(system application), 노즐형식(Nozzle type), 시스템의 작동 방법(System operation method), 시스템 매체 종류(System media type) 등 4가지의 변수에 대하여 설명하시오.","maj":"수계소화설비","min":"미분무소화설비","kw":"미분무수소화설비변수","pg":null},{"r":102,"s":3,"n":"4","t":"오일러의 운동방정식 dP+ρgdZ+ρV·dV=0 에서 베르누이 정리식을 유도하시오.(단, dP:미소압력, ρ:유체의 밀도, g:중력가속도, dZ:미소수두, V:유속, dV:미소속도)","maj":"수계소화설비","min":"배관·수리계산","kw":"오일러방정식; 베르누이정리","pg":null},{"r":102,"s":3,"n":"5","t":"국내 위험물안전관리법과 NFPA Code 704에서 규정하고 있는 위험물 분류 기준 등을 상호 비교하여 설명하고, 국내 위험물의 분류체계, 식별체계, 위험등급 측면에서의 문제점과 개선사항에 대하여 설명하시오.","maj":"위험물","min":"위험물총론(분류·성질)","kw":"위험물분류기준; NFPA704","pg":"p.433"},{"r":102,"s":3,"n":"6","t":"과산화수소(H2O2)는 수용액 농도 36wt%(비중 약 1.137) 이상이 위험물에 속한다. 과산화수소에 대하여 (1)위험성 (2)저장 및 취급방법 (3)소화방법을 설명하시오.","maj":"위험물","min":"위험물총론(분류·성질)","kw":"과산화수소","pg":null},{"r":102,"s":4,"n":"1","t":"소방감리원은 소방공사 시공업체로부터 요청을 받은 경우 물가변동에 의한 계약금액 조정에 관하여 검토해야 한다. 이러한 물가변동에 의한 계약금액 조정의 요건, 지수 조정율과 품목조정율의 개요, 산출방법, 적용대상에 대하여 설명하시오.","maj":"소방법규·제도·성능위주설계","min":"감리·점검","kw":"물가변동계약금액조정","pg":null},{"r":102,"s":4,"n":"2","t":"초고층 건축물 화재 시에 대피를 위해 사용 가능하도록 조건을 갖춘 피난용승강기의 필요성 및 IBC(International Building Code)에 제정되어 있는 초고층 건축물의 피난용승강기 기준에서 제시된 동작상태, 승강장, 모니터, 전원에 대하여 설명하시오.","maj":"특수방재대상","min":"초고층건축물","kw":"피난용승강기; IBC기준","pg":"p.301"},{"r":102,"s":4,"n":"3","t":"특별피난계단부의 급기가압제연방식에 있어서 부속실의 방연풍속 측정방법에 대하여 1) 측정 전 조치사항 2) 방연풍속의 측정방법(예시도 포함) 3) 판정방법 4) 방연풍속의 부족원인을 설명하시오.","maj":"피난·제연설비","min":"부속실(특별피난계단)제연설비","kw":"방연풍속; 측정방법","pg":"p.318"},{"r":102,"s":4,"n":"4","t":"저압식 이산화탄소소화설비 소화약제는 저장용기에서 배관을 통한 다음 노즐을 통하여 방화지역(Fire zone)으로 방출된다. 이 과정에서 이산화탄소 소화약제는 2상(two-phase)유체의 거동 및 다양한 상변화를 갖는다. (1)이러한 흐름 과정을 온도-압력 선도의 상평형도(phase diagram)를 이용하여 설명하고 임계점 및 삼중점의 위치를 개략 표시하시오 (2)임계점에서 유체상태(고상,액상,기상)를 설명하고 삼중점에서 온도와 압력의 변화 시 고상(dry-ice)이 생성될 수 있는 과정을 설명하시오.","maj":"가스계소화설비","min":"이산화탄소소화설비","kw":"2상유체; 상평형도","pg":"p.6"},{"r":102,"s":4,"n":"5","t":"상사의 법칙(Affinity law)은 가하학적 상사인 수차의 유량(Q), 회전 속도(N), 양정(H)과 축동력(L) 사이의 수학적 관계를 나타내며 다음과 같이 표현된다. 상사의 법칙의 개념도를 그리고 연속의 정리, 회전차속도, 토리첼리의 정리, 축동력 등의 관계식을 이용하여 상사의 법칙들이 성립됨을 증명하여라.","maj":"수계소화설비","min":"가압송수장치·펌프","kw":"상사법칙; 펌프","pg":"p.52"},{"r":102,"s":4,"n":"6","t":"화재구역의 표준설계조건에서 화재성장속도의 관계식과 관련하여 (1)Q=αt^n에서 각 변수의 의미와 단위 및 온도-열량 그래프를 그리고 설명하시오 (2)n=2인 경우, 화재성장속도별(slow fire, medium fire, fast fire, ultra-fast fire) α값을 제시하시오 (3)n=2인 경우, ultra-fast fire 조건을 기준하여 화재발생 이후 30초가 경과할 때까지 총 발생열량을 계산하고 그 과정을 온도-열량 그래프를 이용하여 설명하시오.","maj":"화재역학·연소이론","min":"화재역학","kw":"화재성장속도; alpha t^2","pg":"p.366"},{"r":103,"s":1,"n":"1","t":"청정소화약제소화설비의 기동장치 설치기준을 설명하시오.","maj":"가스계소화설비","min":"가스계설비공통","kw":"기동장치설치기준","pg":null},{"r":103,"s":1,"n":"2","t":"피트 및 소공간에 설치 가능한 소화장치에 대하여 설명하시오.","maj":"가스계소화설비","min":"가스계설비공통","kw":"피트; 소공간소화장치","pg":null},{"r":103,"s":1,"n":"3","t":"간이스프링클러설비의 배관 및 밸브 등의 설치순서에 대하여 급수방식 종류별로 설명하시오.","maj":"수계소화설비","min":"스프링클러설비","kw":"간이스프링클러; 배관밸브순서","pg":nu <script>
  const EXAM_DB = JSON.parse(document.getElementById('examdb-data').textContent);
  const MAJOR_COLORS = {"화재역학·연소이론":"#e8734a","건축방화":"#3f8ea8","위험물":"#2f9e7a","수계소화설비":"#2f7ab8","포소화설비":"#4fae8a","가스계소화설비":"#3f7fa8","피난·제연설비":"#5a9c5a","경보설비":"#c9974f","소방전기·비상전원설비":"#5f7fb8","전기방재·방폭":"#c94f6d","특수방재대상":"#a8763f","소방법규·제도·성능위주설계":"#8a6bb8","내진설계":"#b8955f","계산문제":"#6b7280"};
  let mode = 'text';
  let renderLimit = 120;
  const PAGE_SIZE = 120;

  function setMode(m) {
    mode = m;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
    const input = document.getElementById('searchInput');
    input.placeholder = m === 'text'
      ? '문제 내용으로 검색 (예: 환기지배형, 포소화약제)'
      : m === 'keyword'
      ? '키워드로 검색 (예: ODP, 방폭구조)'
      : '적중 소방기술사 교재 페이지 번호로 검색 (예: 124)';
    renderLimit = PAGE_SIZE;
    runSearch();
  }

  function clearSearch() {
    const input = document.getElementById('searchInput');
    input.value = '';
    input.focus();
    renderLimit = PAGE_SIZE;
    runSearch();
  }

  function escapeHtml(s) {
    return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }

  function escapeRegex(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function pageNum(pg) {
    if (!pg) return Infinity;
    const m = pg.match(/\d+/);
    return m ? parseInt(m[0], 10) : Infinity;
  }

  function highlight(text, q) {
    const safe = escapeHtml(text);
    if (!q) return safe;
    const escQ = escapeRegex(escapeHtml(q));
    return safe.replace(new RegExp(escQ, 'gi'), m => '<mark>' + m + '</mark>');
  }

  function runSearch() {
    const input = document.getElementById('searchInput');
    const q = input.value.trim();
    document.getElementById('clearBtn').classList.toggle('show', q.length > 0);

    const metaEl = document.getElementById('resultMeta');
    const listEl = document.getElementById('results');

    if (!q) {
      metaEl.textContent = '';
      listEl.innerHTML = '<div class="empty-state">검색어를 입력하면 결과가 여기에 바로 나타납니다.<br>' +
        '"문제별"은 문제 전문, "키워드별"은 기출분석 키워드, "페이지별"은 적중 소방기술사 교재 페이지 기준으로 찾습니다.</div>';
      return;
    }

    const qLower = q.toLowerCase();
    const field = mode === 'text' ? 't' : mode === 'keyword' ? 'kw' : 'pg';
    const matches = EXAM_DB.filter(r => (r[field] || '').toLowerCase().includes(qLower));
    if (mode === 'page') {
      matches.sort((a, b) => (pageNum(a.pg) - pageNum(b.pg)) || (b.r - a.r));
    } else {
      matches.sort((a, b) => (b.r - a.r) || (b.s - a.s));
    }

    metaEl.textContent = '결과 ' + matches.length.toLocaleString() + '건';

    if (matches.length === 0) {
      listEl.innerHTML = '<div class="empty-state">일치하는 기출이 없습니다.</div>';
      return;
    }

    const shown = matches.slice(0, renderLimit);
    listEl.innerHTML = shown.map(r => renderCard(r, q)).join('') +
      (matches.length > shown.length
        ? '<button type="button" class="load-more" onclick="showMore()">더 보기 (' + (matches.length - shown.length).toLocaleString() + '건 남음)</button>'
        : '');
  }

  function showMore() {
    renderLimit += PAGE_SIZE;
    runSearch();
  }

  function renderCard(r, q) {
    const session = r.r + '-' + (r.s != null ? r.s : '?');
    const majors = (r.maj || '').split(',').map(s => s.trim()).filter(Boolean);
    const majorChips = majors.map(m => {
      const c = MAJOR_COLORS[m] || '#8a847d';
      return '<span class="major-chip" style="background:' + c + '">' + escapeHtml(m) + '</span>';
    }).join('');
    const pageChip = r.pg ? '<span class="page-chip">적중 ' + highlight(r.pg, mode === 'page' ? q : '') + '</span>' : '';
    return '<div class="result-card">' +
      '<div class="result-top">' +
        '<span class="session-badge">' + escapeHtml(session) + '</span>' +
        '<span class="no-badge">문제' + escapeHtml(String(r.n)) + '</span>' +
        majorChips +
        (r.min ? '<span class="minor-chip">' + escapeHtml(r.min) + '</span>' : '') +
        pageChip +
      '</div>' +
      '<div class="result-text">' + highlight(r.t, q) + '</div>' +
      (r.kw ? '<div class="result-kw"><b>키워드</b> ' + highlight(r.kw, q) + '</div>' : '') +
      '</div>';
  }

  runSearch();
</script>
</body>
</html>
