<!DOCTYPE html>
<html lang="ko">
<head>
<script src="../shell.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>소방기술사 복습노트</title>
<!-- PWA: 아래 태그들은 이 파일이 같은 폴더에 manifest.json / apple-touch-icon.png / icon-192.png / icon-512.png / sw.js 와 함께 있을 때 의미가 있습니다(형님이 전달받은 pwa 폴더 참고). 로컬 file:// 로 열 때는 대부분 브라우저가 제한하지만, 나중에 무료 호스팅(GitHub Pages 등)에 올리면 이 태그들 덕분에 바로 완전한 설치형 PWA로 동작합니다. -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#8b1515" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="소방복습노트" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<style>
  :root{
    --bg:#0c0a09; --panel:#17140f; --panel2:#1c1814;
    --line:rgba(255,255,255,0.08); --line2:rgba(255,255,255,0.12);
    --text:#f5f2ee; --sub:#c9c2b8; --sub2:#a39c90;
    --orange:#ea580c; --orange-soft:rgba(234,88,12,0.15); --orange-line:rgba(234,88,12,0.35);
    --green:#10b981; --amber:#f59e0b; --rose:#f43f5e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;}
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  .navbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:8px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line);}
  .navicon{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:0 0 44px;
    border-radius:14px;border:1px solid var(--line2);background:var(--panel);color:var(--text);
    font-size:22px;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .navicon:active{background:var(--panel2);}
  .navicon.disabled{opacity:.3;pointer-events:none;}
  .navhome{font-size:20px;}
  .navspacer{width:44px;flex:0 0 44px;}
  header{padding:22px 20px 16px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:8px;color:var(--orange);font-size:11px;font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;}
  .brand .flame{font-size:16px;}
  .brand-label{color:var(--sub);}
  h1{margin:6px 0 2px;font-size:22px;font-weight:800;letter-spacing:-0.02em;}
  .subtitle{margin:0;color:var(--sub);font-size:13.5px;}
  .backbtn{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--sub2);
    font-size:12.5px;cursor:pointer;padding:0 0 10px;}
  .backbtn:hover{color:var(--sub);}
  .tabs{display:flex;gap:8px;margin-top:16px;}
  .tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600;border:none;cursor:pointer;
    background:rgba(255,255,255,0.05);color:var(--sub);transition:.15s;}
  .tabs button.active{background:var(--orange);color:#fff;}
  .tabs button:hover:not(.active){background:rgba(255,255,255,0.09);}

  /* 홈 화면 */
  .section{padding:18px 20px 4px;}
  .section-head{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12px;margin-bottom:10px;}
  .deckcard{display:block;width:100%;text-align:left;border-radius:16px;background:rgba(255,255,255,0.04);
    border:1px solid var(--line);padding:14px 16px;margin-bottom:12px;cursor:pointer;transition:.15s;}
  .deckcard:hover{background:rgba(255,255,255,0.07);}
  .deckcard .row-top{display:flex;justify-content:space-between;align-items:center;}
  .deckcard .week{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);}
  .deckcard .pct{font-size:11px;color:var(--sub2);}
  .deckcard .label{margin:4px 0 1px;font-size:15.5px;font-weight:700;}
  .deckcard .sub{font-size:12px;color:var(--sub2);margin:0;}
  .miniprogress{margin-top:10px;height:6px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,0.06);
    display:flex;}
  .deckcard .footrow{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--sub2);}
  .deckcard .footrow .know{color:var(--green);}

  /* 주차/강 선택 그리드 (1.주차→2.강좌→3.개념/기출 3단 드릴다운) */
  .gridwrap{padding:16px 20px 8px;}
  .weekgrid, .lecturegrid{display:grid;grid-template-columns:repeat(auto-fill, minmax(72px,1fr));gap:10px;}
  .weekbtn, .lecturebtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;aspect-ratio:1/1;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid var(--line);
    cursor:pointer;padding:6px 4px;transition:.15s;}
  .weekbtn:hover, .lecturebtn:hover{background:rgba(255,255,255,0.08);border-color:var(--line2);}
  .weekbtn .num, .lecturebtn .num{font-size:19px;font-weight:800;color:var(--text);line-height:1.1;}
  .weekbtn .unit, .lecturebtn .unit{font-size:10px;color:var(--sub);}
  .weekbtn .pct, .lecturebtn .pct{font-size:9px;color:var(--orange);margin-top:1px;font-weight:700;}
  .weekbtn .ring, .lecturebtn .ring{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:99px;
    background:var(--green);opacity:0;}
  .weekbtn.complete .ring, .lecturebtn.complete .ring{opacity:1;}

  .typegrid{display:flex;flex-direction:column;gap:12px;padding:16px 20px;}
  .typecard{display:flex;align-items:center;gap:14px;border-radius:16px;background:rgba(255,255,255,0.04);
    border:1px solid var(--line);padding:16px;cursor:pointer;transition:.15s;text-align:left;}
  .typecard:hover{background:rgba(255,255,255,0.07);}
  .typecard .icon{font-size:26px;flex-shrink:0;}
  .typecard .info{flex:1;min-width:0;}
  .typecard .info .title{font-size:15.5px;font-weight:700;color:var(--text);}
  .typecard .info .desc{font-size:12px;color:var(--sub2);margin-top:2px;}
  .typecard .info .meta{font-size:11px;color:var(--sub2);margin-top:8px;}
  .typecard .chevron{color:var(--sub2);font-size:16px;flex-shrink:0;}

  /* 진행 통계 (덱 화면) */
  .stats{padding:14px 20px;}
  .stats-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .stats-label{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12px;}
  .filterbtn{font-size:11.5px;padding:5px 10px;border-radius:99px;border:1px solid var(--line2);
    background:none;color:var(--sub2);cursor:pointer;}
  .filterbtn.on{background:rgba(245,158,11,0.15);border-color:rgba(245,158,11,0.4);color:var(--amber);}
  .bar{height:8px;width:100%;border-radius:99px;overflow:hidden;background:rgba(255,255,255,0.06);display:flex;}
  .legend{margin-top:8px;display:flex;gap:12px;font-size:11px;color:var(--sub2);flex-wrap:wrap;}
  .legend .know{color:var(--green);} .legend .shaky{color:var(--amber);} .legend .unknown{color:var(--rose);}

  /* 카드 영역 */
  .cardwrap{flex:1;padding:0 20px 20px;display:flex;flex-direction:column;}
  .cardmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .cardmeta .count{font-size:12px;color:var(--sub2);}
  .badge{font-size:11px;padding:2px 9px;border-radius:99px;}
  .badge.know{background:rgba(16,185,129,0.15);color:var(--green);}
  .badge.shaky{background:rgba(245,158,11,0.15);color:var(--amber);}
  .badge.unknown{background:rgba(244,63,94,0.15);color:var(--rose);}

  .flashcard{flex:1;min-height:220px;border-radius:18px;border:1px solid var(--line2);
    background:linear-gradient(to bottom, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    padding:20px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;}
  .flashcard .kicker{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--sub2);margin-bottom:8px;}
  .flashcard .body{white-space:pre-line;line-height:1.65;}
  .flashcard .body.q{font-size:18px;font-weight:600;color:var(--text);}
  .flashcard .body.a{font-size:15px;color:#fed7aa;}
  .flashcard .hint{margin-top:14px;display:flex;align-items:center;gap:5px;color:#57534e;font-size:12px;}

  .navrow{display:flex;align-items:center;justify-content:space-between;margin-top:16px;}
  .navrow .circlebtn{width:38px;height:38px;border-radius:99px;border:none;background:rgba(255,255,255,0.06);
    color:var(--sub);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .navrow .circlebtn:hover{background:rgba(255,255,255,0.11);}
  .revealbtn{padding:11px 26px;border-radius:12px;background:var(--orange);color:#fff;font-weight:700;
    border:none;font-size:14px;cursor:pointer;}
  .revealbtn:hover{background:#f97316;}
  .markrow{display:flex;gap:8px;}
  .markrow button{display:flex;align-items:center;gap:5px;padding:10px 14px;border-radius:12px;border:none;
    font-size:13.5px;font-weight:600;cursor:pointer;}
  .markrow .b-unknown{background:rgba(244,63,94,0.15);color:var(--rose);}
  .markrow .b-shaky{background:rgba(245,158,11,0.15);color:var(--amber);}
  .markrow .b-know{background:rgba(16,185,129,0.15);color:var(--green);}
  .markrow button:hover{filter:brightness(1.25);}

  footer{padding:8px 20px 26px;}
  .resetbtn{background:none;border:none;color:var(--sub2);font-size:11.5px;cursor:pointer;
    display:flex;align-items:center;gap:5px;}
  .resetbtn:hover{color:var(--sub);}

  /* 노트(읽기) 뷰 */
  .notes{flex:1;overflow-y:auto;padding:4px 20px 30px;}
  .notes section{margin-bottom:22px;}
  .notes h3.sec-title{font-size:15px;font-weight:800;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);}
  .notes h4.h3{margin:14px 0 6px;font-size:13.5px;font-weight:700;color:#fdba74;}
  .notes p.p{font-size:14px;line-height:1.65;color:#d6d3d1;margin:0 0 8px;}
  .notes ul.ul{margin:0 0 8px;padding:0;list-style:none;}
  .notes ul.ul li{display:flex;gap:8px;font-size:14px;line-height:1.6;color:#d6d3d1;margin-bottom:5px;}
  .notes ul.ul li .bullet{color:var(--orange);flex-shrink:0;margin-top:1px;}
  .notes table{width:100%;border-collapse:collapse;font-size:13px;}
  .notes .tablewrap{margin-bottom:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;overflow-x:auto;}
  .notes th{text-align:left;padding:8px 10px;background:rgba(255,255,255,0.05);color:var(--sub);
    font-weight:600;white-space:nowrap;}
  .notes td{padding:8px 10px;color:#d6d3d1;border-top:1px solid var(--line);vertical-align:top;}
  .notes pre.code{margin:0 0 12px;background:rgba(0,0,0,0.35);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:12.3px;color:#6ee7b7;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;
    line-height:1.55;}
  .notes .callout{margin-bottom:12px;background:rgba(234,88,12,0.1);border:1px solid rgba(234,88,12,0.3);
    border-radius:10px;padding:9px 12px;font-size:13.5px;color:#fed7aa;}

  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(244,63,94,0.92);
    color:#fff;font-size:12px;padding:7px 14px;border-radius:99px;}
  .loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--sub2);font-size:14px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------------------------------------------------------------------------
// 데이터
// ---------------------------------------------------------------------------
const CONCEPT_DECK = {
  id: "concept-2wk-2gang",
  week: "2주차 2강",
  weekNum: 2,
  lectureNum: 2,
  type: "concept",
  label: "연소이론",
  sub: "가연물 조건 ~ 연소범위",
  notes: [
    { title: "1. 가연물이 되기 위한 조건", blocks: [
      { type:"table", headers:["조건","이유"], rows:[
        ["산소와 친화력이 클 것","산소와 잘 섞여야 가연성 혼합기가 형성됨"],
        ["활성화에너지가 작을 것","적은 에너지로도 착화가 시작됨"],
        ["열전도율이 작을 것","열이 축적되기 쉬워 발화점 도달이 빠름"],
        ["연소열이 클 것","연료 입장에서 유리 (화재 관점에서는 위험 요소)"],
        ["비표면적이 클 것","산소 접촉면이 넓어져 연소가 쉬워짐"],
        ["건조도가 높을 것(함수율↓)","함수율이 높으면 수분 증발에 에너지를 뺏겨 열분해가 늦어짐"]
      ]},
      { type:"callout", text:"➡ 결론: 연소율이 큰 물질이 가연물이 되는 조건이다." },
      { type:"h3", text:"가연물이 될 수 없는 조건" },
      { type:"ul", items:[
        "불활성 원소(8족): 최외각 전자가 이미 8개(안정)라 활성화가 안 됨",
        "흡열반응 물질: 산소와 반응해도 열을 내지 않고 흡수 → 소화약제로 활용",
        "불연성 물질(돌, 흙 등): 자체가 연소하지 않음"
      ]}
    ]},
    { title: "2. 산소공급원 · 농도 표기법", blocks: [
      { type:"p", text:"산소공급원: 공기, 산화제, 자기반응성 물질(=위험물), 지연성 가스 등" },
      { type:"ul", items:["부피비(volume %) — 가연성 혼합기체는 주로 이 방식으로 표현","중량비(weight %)"] }
    ]},
    { title: "3. 점화원의 종류 (앞머리만 암기)", blocks: [
      { type:"table", headers:["구분","종류"], rows:[
        ["기계적","나화, 마찰, 충격, 단열압축, 고온표면"],
        ["전기적","정전기, 전기불꽃(스파크·아크), 저항열(줄열)"],
        ["화학적","연소열, 분해열, 중합열, 산화열"],
        ["기타","복사열, 자연발화"]
      ]}
    ]},
    { title: "4. 연쇄반응 (Chain Reaction)", blocks: [
      { type:"p", text:"가연물이 활성화에너지를 받으면 분해된 가연성 가스가 활성 라디칼이 되고, 이 라디칼에 의해 연쇄적으로 연소가 지속되는 현상." },
      { type:"ul", items:[
        "활성화: 가연성가스(H₂)가 열을 받아 H 라디칼 생성",
        "분기반응: H + O₂ → OH + O (라디칼 1개 → 2개)",
        "전파반응: OH + H₂ → H₂O + H (라디칼 1개 → 1개, 발열 동반)"
      ]},
      { type:"callout", text:"암기: 가연물은 산소를 만나야 하고, 산소를 포함한 라디칼은 가연물을 만나야 반응이 이어진다." }
    ]},
    { title: "5. 연쇄반응 억제 (화학적 소화)", blocks: [
      { type:"p", text:"활성 라디칼을 붙잡아 반응계에서 제거 → 라디칼 포착이론 = 연쇄반응 억제(부촉매) 소화" },
      { type:"h3", text:"할론 1301(CF₃Br) 메커니즘" },
      { type:"ul", items:[
        "CF₃Br → CF₃ + Br (열분해)",
        "Br + H(라디칼) → HBr",
        "HBr + OH(라디칼) → Br + H₂O → 라디칼 소모로 연쇄반응 종료"
      ]},
      { type:"h3", text:"원소 주기율표와 반응성" },
      { type:"ul", items:[
        "최외각 전자 2개 또는 8개 → 안정(불활성)",
        "1족(예: H): 전자 1개, 7족(예: Br): 전자 7개 → 반응성 큼",
        "1족 계열 → 분말소화약제 / 7족(할로겐) 계열 → 할로겐화합물"
      ]},
      { type:"h3", text:"오존층 파괴 메커니즘 (참고)" },
      { type:"p", text:"Br이 대기 중으로 확산되면 오존 재생성에 필요한 O(라디칼)와 반응해버려 O₃가 재생성되지 않고 O₂만 남음 → 오존층 파괴. 할론은 소화 효과는 우수하나 환경 문제로 사용 제한." }
    ]},
    { title: "6. 연소범위 (Flammable Range)", blocks: [
      { type:"p", text:"가연성 혼합기에 점화했을 때 화염이 꺼지지 않고 계속 전파되는 가연성 가스의 농도 구간. 하한계=LFL, 상한계=UFL." },
      { type:"ul", items:[
        "LFL보다 낮음 → 가연성 가스 부족 → 착화 안 됨",
        "UFL보다 높음 → 산소 부족 → 착화 안 됨",
        "화학양론농도(Cst) 부근: 과부족 없이 완전반응"
      ]}
    ]},
    { title: "7. 연소범위 영향요소 — 삼불란PT", blocks: [
      { type:"table", headers:["요소","LFL","UFL"], rows:[
        ["산소농도 ↑","큰 변화 없음","현저히 증가"],
        ["불활성가스 ↑","약간 감소","크게 감소 (희석)"],
        ["압력 ↑","약간 증가","증가"],
        ["온도 ↑","감소","증가"],
        ["난류성 ↑","연소범위 넓어짐 (자주 출제)",""]
      ]},
      { type:"code", text:"농도(%) = (해당 기체 부피 / 전체 기체 부피) × 100" },

    { title: "2. 르샤틀리에 법칙 계산 예시", blocks: [
      { type:"p", text:"예: 가연성가스만 100%로 볼 때 메탄(LFL 5%) 20%, 프로판(LFL 2.1%) 80%가 섞여 있다면: 1/Lm = 20/5 + 80/2.1 → Lm 계산." },
      { type:"p", text:"만약 불연성가스(질소 등)가 섞여 전체가 100%가 안 되는 경우(예: 메탄 20%, 프로판 70%, 질소 10%)는, 가연성가스 성분들의 비율을 그대로 분모·분자에 넣어(정규화 없이) 그대로 대입해도 같은 결과를 얻을 수 있다 — 이 계산 방식이 100% 환산보다 간단하다." }
    ]},
    { title: "3. 화학양론조성(CST)의 정의와 계산", blocks: [
      { type:"p", text:"CST(화학양론조성비)란 가연성 혼합기체가 완전연소하는 데 필요한 연료:공기(또는 산소)의 농도 비율이다. Cst = 연료몰수 / (연료몰수 + 공기몰수) × 100 으로 계산한다." },
      { type:"p", text:"완전연소방정식을 세우려면 탄소수만큼 CO₂ 계수를, 수소수의 절반만큼 H₂O 계수를 맞추고 산소 계수를 마지막에 맞추면 된다. 예: 프로판(C₃H₈) + 5O₂ → 3CO₂ + 4H₂O — 1몰의 프로판이 완전연소하려면 5몰의 산소가 필요하다." },
      { type:"callout", text:"공기 중 산소는 약 21%이므로, 필요 산소몰수를 0.21로 나누면 필요 공기몰수가 된다. 이를 이용해 Cst를 계산한다." }
    ]},
    { title: "4. 몰비 = 부피비 = 질량비 = 분자수비", blocks: [
      { type:"p", text:"몰(mol)이란 물질의 양을 나타내는 단위다. 아보가드로 법칙: 0℃·1atm(표준상태)에서 모든 기체는 1몰일 때 부피가 22.4L로 동일하며, 1몰에는 6.023×10²³개의 분자(아보가드로 수)가 들어 있다." },
      { type:"callout", text:"따라서 몰비는 부피비이자 분자수비이며, 원자량(분자량)을 곱하면 질량비로도 환산된다 — 반응식의 계수는 이 네 가지를 모두 같은 비율로 나타낸다." }
    ]},
    { title: "5. 당량비(Equivalence Ratio, φ)", blocks: [
      { type:"p", text:"당량비(φ)는 실제 공급된 연공비를 이론(완전연소) 연공비로 나눈 값이다: φ = (실제 연료/공기) / (이론 연료/공기). 완전연소 상태일 때 φ=1이다." },
      { type:"table", headers:["당량비(φ)","의미","화재 양상"], rows:[
        ["φ < 1","이론 대비 연료가 부족(공기 과잉)","연료지배형 화재 (연료만 더 공급되면 완전연소 가능)"],
        ["φ = 1","연료·공기가 이론적으로 완전연소 비율","화학양론조성(CST) 상태, 연소가 가장 격렬"],
        ["φ > 1","이론 대비 연료가 과잉(공기 부족)","환기지배형 화재 (공기만 더 공급되면 완전연소 가능)"]
      ]}
    ]},
    { title: "6. 연료지배형 화재와 환기지배형 화재", blocks: [
      { type:"p", text:"연료지배형 화재: 산소는 충분한데 공급되는 가연성가스(열분해 산물)의 양이 부족해 화재 크기가 연료 공급량에 의해 좌우되는 상태. 주로 플래시오버 이전(성장기)에 나타난다." },
      { type:"p", text:"환기지배형 화재: 가연물은 충분한데 산소(환기량) 공급이 부족해 화재 크기가 환기량에 의해 좌우되는 상태. 주로 플래시오버 이후(최성기)에 나타난다." },
      { type:"callout", text:"플래시오버를 기점으로 화재 양상이 연료지배형에서 환기지배형으로 180도 전환된다 — 이후 대책(개구부 관리, 배연 등)의 초점도 달라져야 한다." }
    ]},
    { title: "7. 화재성장곡선: 성장기·최성기·감쇠기", blocks: [
      { type:"p", text:"발화 후 화재는 Q=αt²로 성장(성장기)하다가, 플래시오버가 일어나면 실내 모든 가연물 표면이 일순간에 발화하며 열방출률이 최고치에 도달한다(최성기 진입)." },
      { type:"p", text:"플래시오버 직후에는 주변 산소가 급격히 소모되어 산소 부족 상태가 되고, 이후로는 환기(문틈 등으로 들어오는 공기량)에 따라 타다 꺼지다를 반복하며 서서히 열방출률이 낮아진다(최성기 유지 후 감쇠기로 이행), 결국 가연물이 소진되면 자연소화된다." },
      { type:"table", headers:["단계","지배 요인","특징"], rows:[
        ["성장기","연료지배형","열분해·가연성가스 공급 속도가 화재 크기를 좌우"],
        ["최성기","환기지배형(플래시오버 이후)","열방출률 최고치, 개구부를 통한 환기량이 연소 속도를 좌우"],
        ["감쇠기","가연물 소진","탈 수 있는 가연물이 줄어들며 자연소화로 진행"]
      ]}
    ]},
    { title: "8. 백드래프트(Backdraft)", blocks: [
      { type:"p", text:"화재가 감쇠기로 가는 중(환기 부족·훈소 상태)에 문을 갑자기 열어 산소가 급격히 유입되면, 실내에 축적돼 있던 미연소 가연성가스가 순식간에 모두 발화하며 폭발적으로 연소한다 — 이를 백드래프트라 한다." },
      { type:"callout", text:"백드래프트는 산소 유입이 트리거이고 폭발적 연소(사실상 폭발) 형태라는 점에서, 가연물 온도 상승이 트리거인 플래시오버(실 전체 동시발화, 폭발은 아님)와 구분된다." }
    ]},
    { title: "9. 완전연소 여부와 연기·화염의 관계", blocks: [
      { type:"p", text:"완전연소가 되면 CO₂와 H₂O만 생성되는데, 이들은 기체 상태에서는 눈에 보이지 않는다(습도의 수증기가 안 보이는 것과 같은 원리). 그런데 화재 시 위로 검게 피어오르는 연기가 보인다는 것은, 완전연소되지 못한 미연소 입자(불완전연소 산물)가 존재한다는 뜻이다." },
      { type:"callout", text:"실제로 완전연소에 가까울수록 화염 자체도 옅어지고 잘 안 보인다 — 화염이 붉게 보이는 것도 완전연소가 안 된 상태의 발광(그을음 입자의 열복사)이기 때문이다. 이 미연소 입자가 천장 부근에 쌓이면 재점화(롤오버 등) 위험이 생긴다." }
    ]},
    { title: "10. 주요 가연성가스의 연소범위와 탄소수 규칙성", blocks: [
      { type:"callout", text:"암기어: '메·에·프·부·펜' → 메탄·에탄·프로판·부탄·펜탄 (탄소수 1~5, 순서대로 암기)" },
      { type:"p", text:"알칸계 탄화수소(CnH2n+2)는 탄소수가 하나 증가할 때마다 완전연소에 필요한 산소 몰수가 규칙적으로 1.5몰씩 증가한다(메탄 2몰 → 에탄 3.5몰 → 프로판 5몰 → 부탄 6.5몰…)." },
      { type:"ul", items:[
        "탄소수가 증가할수록 필요 공기량이 늘어나 CST(화학양론조성비)는 낮아진다",
        "CST가 낮아지면 LFL(=0.55×CST)도 완만히 낮아지고, UFL(=3.5×CST)은 더 급격히 낮아진다",
        "결과적으로 탄소수가 증가할수록 연소범위(UFL−LFL)는 좁아지는 경향을 보인다(단, 실험치 기준이며 완전히 규칙적이지는 않다)"
      ]},
      { type:"table", headers:["물질","위험 특징"], rows:[
        ["수소(H₂)","연소범위가 넓고(4~75%) LFL이 낮아 위험도가 매우 큼"],
        ["아세틸렌(C₂H₂)","연소범위 2.5~81%로 극히 넓고 LFL도 낮음, 3중결합 구조로 분해폭발 위험까지 있어 취급 시 가장 주의가 필요한 가스"]
      ]},
      { type:"p", text:"버제스-휠러(Burgess-Wheeler) 법칙: 대부분의 탄화수소는 산소 1g을 소모할 때 발생하는 연소열이 거의 일정(약 13kJ/g 부근)하며, 이로부터 LFL×ΔHc(연소열)가 대략 일정한 값(약 1050 부근)으로 수렴한다는 경험 법칙이 도출된다." }
    ]},
    { title: "11. 주요 물질의 연소범위 수치표 (교재 보충)", blocks: [

      { type:"h3", text:"기타 주요 가연성가스" },
      { type:"table", headers:["물질","LFL(%)","UFL(%)"], rows:[

  cards: [
    { q:"파라핀계 탄화수소 중 메탄·프로판·부탄의 연소범위(LFL~UFL)는?", a:"메탄 5~15%, 프로판 2.1~9.5%, 부탄 1.8~8.4% — 탄소수가 늘수록 LFL·UFL 모두 대체로 낮아진다." },
    { q:"수소·아세틸렌·일산화탄소의 연소범위는?", a:"수소 4~75%, 아세틸렌 2.5~80%, 일산화탄소 12.5~74% — 모두 연소범위가 매우 넓어 위험도가 큰 가스들이다." },
    { q:"르샤틀리에 법칙이란?", a:"여러 가연성가스가 섞인 혼합가스의 연소한계(LFL/UFL)를 각 성분가스의 단독 연소한계와 혼합비율로부터 구하는 법칙." },
    { q:"르샤틀리에 공식을 쓰면?", a:"1/Lm = C1/L1 + C2/L2 + ⋯ + Cn/Ln (Lm: 혼합가스의 연소한계, Ci: 성분 i의 부피비(%), Li: 성분 i 단독의 연소한계)" },
    { q:"혼합가스에 불연성가스(질소 등)가 섞여 있을 때 르샤틀리에 공식은 어떻게 적용하는가?", a:"가연성가스 성분들의 비율을 100%로 환산하지 않고, 각 성분의 원래 부피비를 그대로 분자에 대입해 계산해도 동일한 결과를 얻을 수 있다." },
    { q:"화학양론조성(CST)이란 무엇이며 계산식은?", a:"가연성 혼합기체가 완전연소하는 데 필요한 연료:공기의 농도 비율. Cst = 연료몰수 / (연료몰수 + 공기몰수) × 100." },
    { q:"완전연소방정식을 세우는 순서는?", a:"① 가연물의 탄소수만큼 CO₂ 계수를 맞춘다 ② 수소수의 절반만큼 H₂O 계수를 맞춘다 ③ 좌변의 산소 개수를 맞춰 산소 계수를 정한다. (예: C₃H₈ + 5O₂ → 3CO₂ + 4H₂O)" },
    { q:"몰비는 어떤 비율들과 같은가?", a:"몰비는 부피비(아보가드로 법칙: 표준상태에서 1몰=22.4L)이자 분자수비(1몰=6.023×10²³개)이며, 원자량을 곱하면 질량비로도 환산된다." },
    { q:"당량비(Equivalence Ratio, φ)의 정의는?", a:"실제 공급된 연공비를 이론(완전연소) 연공비로 나눈 값. φ = (실제 연료/공기) ÷ (이론 연료/공기)." },
    { q:"당량비가 1보다 작을 때(φ<1)와 클 때(φ>1)는 각각 어떤 화재 양상인가?", a:"φ<1은 연료가 부족(공기 과잉)한 상태로 연료지배형 화재, φ>1은 연료가 과잉(공기 부족)한 상태로 환기지배형 화재를 나타낸다." },
    { q:"연료지배형 화재와 환기지배형 화재의 차이는?", a:"연료지배형은 산소는 충분하나 가연성가스 공급량이 부족해 화재 크기가 연료량에 좌우되는 상태(주로 성장기)이고, 환기지배형은 가연물은 충분하나 산소(환기)가 부족해 화재 크기가 환기량에 좌우되는 상태(주로 최성기)이다." },
    { q:"화재성장곡선의 3단계(성장기·최성기·감쇠기)를 설명하면?", a:"성장기: Q=αt²로 화재가 커지며 연료지배형. 최성기: 플래시오버로 열방출률이 최고치에 도달하고 환기지배형으로 전환. 감쇠기: 가연물이 소진되며 열방출률이 서서히 낮아져 자연소화로 향함." },
    { q:"플래시오버를 기점으로 화재 양상이 어떻게 바뀌는가?", a:"연료지배형(성장기)에서 환기지배형(최성기)으로 180도 전환된다 — 이후 대책의 초점도 개구부·환기 관리 쪽으로 바뀌어야 한다." },
    { q:"백드래프트란?", a:"환기 부족(훈소) 상태로 미연소 가연성가스가 축적된 공간에 갑자기 문을 열어 산소가 급격히 유입되면, 축적된 가연성가스가 순식간에 폭발적으로 발화하는 현상." },

    { q:"[77회] 가연성가스의 불활성화(inerting)에 대해 설명하시오.", a:"불활성화란 폭발성 가연성가스가 존재하는 공간(용기·설비 등)에 질소·CO₂ 등 불활성가스를 주입해 산소농도를 MOC보다 낮은 목표농도(안전율 포함, 보통 MOC−4%p)로 제어함으로써, 화염이 전파되지 못하게 만드는 폭발 예방 조치다. 치환(퍼징) 방법으로 진공퍼지·압력퍼지·스위프퍼지·사이폰퍼지 등이 있다." },
    { q:"[62/80/134회] 한계산소지수(LOI, Limited Oxygen Index)를 설명하시오.", a:"LOI는 가연물이 연소를 지속하는 데 필요한 최소한의 산소 체적분율(%)이다. 시험장치에서 시료에 점화 후 3분 이상 또는 50mm 이상 연소가 지속되는 데 필요한 최소 산소농도를 측정하며, 재료의 난연성 비교 지표로 쓰인다(LOI 28 이상이면 난연 성능이 있다고 평가)." },
    { q:"[137회] 「불활성가스 치환에 관한 기술지침」상 화학설비의 점검·정비 시 화재·폭발 예방을 위한 불활성가스 치환(Purging)에 대해 설명하시오.", a:"화학설비 내부 가연성·폭발성 가스 혼합기를 제거하기 위해 질소 등 불활성가스로 치환하는 작업으로, 진공퍼지·압력퍼지·스위프퍼지·사이폰퍼지 등의 방법이 있다. 목표 산소농도(통상 MOC 이하 안전율 반영)에 도달할 때까지 반복 또는 연속 치환을 실시하며, 작업 전후 산소농도 측정으로 안전 여부를 확인한다." },
    { q:"[87회] 가스계 소화약제 A의 불꽃소화농도는 5%, B의 불꽃소화농도는 10%다. A가 20%(V%), B가 80%(V%)인 혼합 소화약제의 불꽃소화농도를 산출하시오.", a:"르샤틀리에 법칙과 유사한 혼합 원리를 적용한다: 1/Cm = (A비율/A소화농도) + (B비율/B소화농도) = (20/5)/100 + (80/10)/100 형태로 계산하여 혼합 소화약제의 유효 불꽃소화농도를 구한다(르샤틀리에식의 소화약제 버전으로 이해하면 된다)." },
    { q:"[118회] 프로판의 연소식을 적고 화학양론조성비, UFL, LFL, MOC를 구하고 각각의 의미를 설명하시오.", a:"C₃H₈+5O₂→3CO₂+4H₂O. Cst=1/(1+5/0.21)×100≈4.03%(완전연소 조성비), LFL=0.55×Cst≈2.2%(연소 가능한 최저 농도), UFL=3.5×Cst≈14.1%(연소 가능한 최고 농도), MOC=LFL×O₂몰수≈2.2×5≈11%(예혼합 연소가 전파 가능한 최소 산소농도)." }
  ]

    { q:"MESG가 화염 전파를 막는 원리(2가지)는?", a:"① 무염영역: 벽면 마찰로 유체 흐름이 정체돼 새로운 가연성혼합기가 형성되지 못함(물적조건 미충족) ② 소염: 벽면이 화염의 열을 빼앗아 냉각시켜 방열이 커지며 에너지조건이 미충족됨." },
    { q:"MESG 측정 방법과 표준 조건은?", a:"용기 내·외부에 가연성 혼합가스를 채우고 내부에서 점화한 뒤, 틈새를 점점 넓혀가며 외부가 점화되는 지점을 찾는다(그보다 좁은 값이 안전틈새). 표준 조건은 틈새 길이 1인치(25.4mm), 용기 내용적 8L." },
    { q:"MESG 값과 위험도의 관계는?", a:"MESG 값이 작을수록 좁은 틈새로도 화염이 전파될 수 있어 더 위험한 가스다. MESG가 낮은 물질은 대체로 발화온도·최소발화에너지도 낮은 경향을 보인다." },
    { q:"불꽃연소와 자결연소의 메커니즘 차이는?", a:"불꽃연소는 흡열→분해/증발→혼합→연소(불꽃)→배출 단계를 모두 거치는 반면, 자결연소는 흡열→분해→배출만 있고 혼합·연소(불꽃) 단계가 없다(가연성혼합기를 형성 못 함)." },
    { q:"연소의 세부 형태 5가지(분해·증발·자기·확산·예혼합연소)를 구분하면?", a:"분해연소(고체 열분해 연소), 증발연소(액체 증발 연소), 자기연소(물질 자체 산소 함유로 외부 산소 없이 연소), 확산연소(가연성가스·산소가 농도차로 확산되며 연소, 자연계 대부분), 예혼합연소(미리 혼합된 상태의 급격한 연소)." },
    { q:"불꽃연소와 자결연소는 화학적 소화(연쇄반응 억제) 가능 여부가 어떻게 다른가?", a:"불꽃연소는 연쇄반응(불꽃)이 있어 부촉매로 라디칼을 포착하는 화학적 소화가 가능하지만, 자결연소는 불꽃(화학반응 경로)이 없어 화학적 소화가 잘 통하지 않고 물리적 소화만 가능하다." },
    { q:"불꽃연소가 자결연소보다 화재 성장이 급격한 이유는?", a:"불꽃연소는 연소속도가 빠르고 열방출률이 커서 열분해를 다시 가속시키는 양의 되먹임이 강하게 작용해 화재가 급격히 성장한다(고강도 화재)." },
    { q:"불꽃연소와 자결연소의 연기 성분·입자 차이는?", a:"불꽃연소는 고온에서 완전분해에 가까워 CO₂ 비중이 높고 연기 입자가 작다. 자결연소는 불완전분해 산물이 화염을 거치지 않고 그대로 배출돼 CO 비중이 높고 연기 입자가 크다." },
    { q:"훈소(Smoldering)란?", a:"자결연소의 대표 형태로, 공기 중 산소와 고체 표면 사이에서 일어나는 느린 연소 현상. 표면에서 자결·탄화가 진행되며 열이 서서히 내부로 침투해 타 들어간다." },
    { q:"훈소가 불꽃연소로 전이될 수 있는 조건은?", a:"훈소 상태의 연료 표면으로 공기(산소) 유입이 증대되면 불꽃연소로 전이될 수 있다(아궁이 잔불에 부채질하면 불꽃이 다시 이는 원리)." },
    { q:"훈소화재의 특징을 정리한 암기어는?", a:"'느발연독단' — 느린 연소반응, 발생 연기량 많음, 연기 입자 큼, 독성물질 그대로 배출, 단층화 발생 가능." },
    { q:"훈소는 왜 저산소 환경(2~5%)에서도 연소가 지속되는가?", a:"느린 연소반응이라 산소 소요량이 적기 때문에, 불꽃연소가 꺼지는 산소농도(약 15% 이하)보다 훨씬 낮은 2~5% 수준에서도 연소를 지속할 수 있다." },
    { q:"훈소화재의 연기 발생량과 온도의 관계는?", a:"A−bt 형태의 관계식으로 표현되며, 온도가 낮은 화재(=훈소처럼 저강도인 화재)일수록 연기 발생량이 많아진다(불완전분해 산물이 그대로 다량 배출되기 때문)." },
    { q:"연기의 단층화(stratification)란?", a:"화재 크기가 작거나 층고가 매우 높은 공간에서, 부력으로 올라가던 연기가 냉각되며 특정 높이에서 더 이상 올라가지 못하고 정체되는 현상. 층고 20m 이상 장소를 스프링클러 설치 제외 기준으로 두는 이유와도 관련된다." },
    { q:"훈소화재에 물을 뿌려도 잘 꺼지지 않는 이유는?", a:"물은 표면장력이 커서 훈소가 내부로 침투해 타고 있는 가연물 안쪽까지 스며들지 못하기 때문이다 — 표면만 냉각될 뿐 내부의 열이 다시 표면을 가열해 재발화할 수 있다." },
    { q:"훈소화재를 효과적으로 소화하려면 물에 무엇을 섞어야 하는가?", a:"계면활성제(포 소화약제 등)를 섞어 표면장력을 낮춰야 물이 가연물 내부까지 침투해 냉각시킬 수 있다." },
    { q:"가스계소화설비로 훈소를 진압할 때 왜 설계농도유지시간이 훨씬 길어야 하는가?", a:"불꽃연소는 산소농도 15% 이하로만 낮춰도 꺼지지만, 훈소는 2% 미만까지 훨씬 낮은 산소농도를 오랫동안 유지해야 소화되기 때문이다." },
    { q:"NFPA 기준 심부화재(훈소)와 표면화재(불꽃연소)의 설계농도유지시간 차이는?", a:"심부화재(훈소)는 CO₂ 20분·기타 청정소화약제 10분 수준으로 요구되는 반면, 표면화재(불꽃연소)는 CO₂ 3분·기타 1분 수준으로 훨씬 짧다." },
    { q:"국내 기준은 가스계소화설비의 설계농도유지시간을 어떻게 규정하는가?", a:"구체적인 유지시간을 직접 규정하지 않고, 대신 소화시험에서 재발화 여부(통상 10분 이내 재발화되지 않을 것)로 갈음해 판단한다." }
  ]
};

      { type:"p", text:"두꺼운 재료의 발화시간(tig) 공식: tig = (π/4)·kρc·[(Tig-Ts)/q″]² 형태로, 열관성(kρc)이 클수록, 발화온도(Tig)가 높을수록, 순수 연료속(q″)이 작을수록 발화시간이 길어진다." },
      { type:"callout", text:"➡ 결론: 열관성이 낮을수록, 발화온도가 낮을수록, 순수 연료속이 클수록 발화시간은 짧아진다." }

    { title: "2. 순수 연료속(Net Fuel Flux)", blocks: [

      { type:"callout", text:"➡ 순수 연료속(q″_net) = 입사 연료속(q″_incident, 주로 화염으로부터의 복사) − 방사 연료속(q″_reradiated). 이 값이 클수록 열이 표면에 축적되어 발화·연소속도가 빨라진다." }

      { type:"callout", text:"➡ 즉, 다양한 가연물의 연소열을 개별적으로 측정하지 않아도 소모된 산소량만 측정하면 연소열을 추정할 수 있다는 원리." }

      { type:"table", headers:["구분","정의","사용처"], rows:[

        ["저위발열량(LHV)","고위발열량 − 수증기의 응축잠열 (실제 유효 열량)","화재역학·성능위주설계(PBD)의 열방출률 산정 기준"]

    { title: "9. 엔탈피(Enthalpy)와 열역학 제1법칙", blocks: [
      { type:"p", text:"엔탈피는 물질이 보유한 열에너지와 그 물질이 일을 수행하는 기계적 에너지를 합한 개념. 외부에서 준 에너지(Q)는 내부에너지 증가(ΔU)와 계가 한 일(W)로 손실 없이 모두 변환된다: Q = ΔU + W." },
      { type:"callout", text:"➡ 열역학 제1법칙(에너지보존의 법칙) = 엔탈피의 법칙: 열과 일은 서로 변환되며, 이 변환에는 손실이 없다고 보는 이상적(가역적) 관계." }
    ]},

        ["열역학 1법칙","엔탈피(에너지보존)의 법칙","열과 일은 서로 변환되며 그 총량은 손실 없이 보존된다(가역과정 가정)"],
        ["열역학 2법칙","엔트로피의 법칙","열은 높은 데서 낮은 데로만 흐르며(비가역), 일을 100% 열로 또는 열을 100% 일로 전환할 수 없다"],

    { title: "11. 저위발열량 공식, 산소소비법칙 계산 예, 목표물 수열식 (교재 보충)", blocks: [
      { type:"h3", text:"저위발열량 계산식" },
      { type:"code", text:"HL = HH − 600×(9H + W)" },
      { type:"p", text:"여기서 HL: 저위발열량, HH: 고위발열량, 600: 물이 수증기로 전환되는 데 필요한 열량(대략 상수), (9H+W): 연료 연소 시 발생한 수증기의 양(H: 수소 함유율, W: 수분 함유율)." },
      { type:"h3", text:"산소소비법칙(Thornton's Rule) 계산 예 — 프로판" },
      { type:"p", text:"C₃H₈ + 5O₂ → 3CO₂ + 4H₂O + 2,044kJ/mol. 프로판 1mol 완전연소 시 산소 5mol(=160g) 소모, 유효연소열 2,044kJ 발생." },
      { type:"code", text:"ΔH(O₂) = 2,044kJ / 5mol = 408.8kJ/mol ≈ 13kJ/g\nΔH(공기) = 2,044kJ / 23.8mol(공기) ≈ 85.9kJ/mol ≈ 2.97kJ/g" },
      { type:"callout", text:"이로부터 '소모된 산소 1g당 약 13kJ, 공기 1g당 약 3kJ의 연소열이 발생한다'는 산소소비법칙의 경험치가 도출된다." },
      { type:"h3", text:"목표물이 받는 복사열 (형태계수 적용식)" },
      { type:"code", text:"q″ = φ·ε·σ·T⁴" },
      { type:"p", text:"φ: 형태계수, ε: 방사능(방사율), σ: 스테판-볼츠만 상수, T: 화염의 절대온도. 형태계수가 클수록(화염에 가깝고 클수록) 목표물이 받는 복사열이 커진다." }
    ]}

  cards: [
    { q:"저위발열량을 고위발열량으로부터 구하는 공식은?", a:"HL = HH − 600×(9H+W). HH: 고위발열량, 600: 물의 수증기 전환 열량(상수), (9H+W): 연소 시 생성된 수증기량(H: 수소 함유율, W: 수분 함유율)." },
    { q:"산소소비법칙에 따르면 소모된 산소·공기 1g당 대략 얼마의 연소열이 발생하는가?", a:"산소 1g당 약 13kJ(13.1kJ), 공기 1g당 약 3kJ(2.97kJ)의 연소열이 발생한다(대부분의 가연물에 공통적으로 적용되는 경험치)." },
    { q:"프로판 1mol 완전연소 시 소모 산소량과 유효연소열은?", a:"C₃H₈+5O₂→3CO₂+4H₂O+2,044kJ/mol. 산소 5mol(160g) 소모, 유효연소열 2,044kJ/mol 발생 — 이를 산소 질량으로 나누면 산소 1g당 약 13kJ가 된다." },
    { q:"형태계수를 반영한 목표물의 복사 수열식은?", a:"q″ = φ·ε·σ·T⁴ (φ: 형태계수, ε: 방사능, σ: 스테판-볼츠만 상수, T: 화염의 절대온도)." },
    { q:"두꺼운 재료의 발화시간에 영향을 주는 3가지 요인은?", a:"열관성(kρc)이 클수록, 발화온도(Tig)가 높을수록, 순수 연료속(q″)이 작을수록 발화시간은 길어진다(반대로 작을수록·낮을수록·클수록 발화시간이 짧아짐)." },
    { q:"순수 연료속(Net Fuel Flux)이란?", a:"가연물 표면에 입사되는 열유속(주로 화염으로부터의 복사)에서, 물질 자신이 방사(재복사)하는 열유속을 뺀 값. 이 값이 임계 연료속보다 커지면 발화(착화)한다." },
    { q:"연소열과 기화열의 정의는?", a:"연소열은 단위 질량의 증발 연료가 화학반응(연소)할 때 발생하는 에너지이고, 기화열은 고체·액체 연료가 기화되는데 필요한 에너지이다." },
    { q:"연소열·기화열과 연소속도·열방출률의 관계는?", a:"연소속도(질량감소율)는 순수 연료속을 기화열로 나눈 값이며, 기화열이 작을수록 연소속도가 빨라진다. 열방출률(Q)은 연소속도×표면적×연소열이므로, 연소열이 크고 기화열이 작을수록 열방출률이 커진다." },
    { q:"형태계수(배치계수)에 영향을 주는 요소는?", a:"화염과 목표물 사이의 거리, 화염의 크기, 바람의 방향(화염 기울기), 화염과 목표물이 이루는 각도, 주변 온도·습도(열손실 정도)." },
    { q:"콘칼로리미터(Cone Calorimeter)란?", a:"원추형 히터로 시료에 복사열을 가해 착화시킨 뒤, 로드셀로 질량 감소를, 산소소비법칙으로 연소열을, 연기측정기로 발생 연기량을 동시에 측정하는 산소소비열량계." },
    { q:"콘칼로리미터의 측정원리(산소소비법칙)는?", a:"대부분의 가연물은 연소 시 소모된 산소 1g당 약 13.1kJ의 연소열을 발생시킨다는 원리(Thornton's Rule)를 이용해, 소모된 산소량만 측정해도 연소열을 추정할 수 있다." },
    { q:"콘칼로리미터로 측정·산출 가능한 항목은?", a:"질량감소율(연소속도), 연소열, 착화온도·착화시간, 열방출률(HRR), 연기발생량·유해가스 발생량." },

    { title:"5. 액체 화염확산 — 경질유(예혼합형)·중질유(예열형) 전파", blocks:[{ type:"table", headers:["구분","액온>인화점 (경질유)","액온<인화점 (중질유)"], rows:[["가연성혼합기 형성","상시 형성(예혼합)","형성 안 됨(예열 필요)"],["전파 형태","예혼합형 전파","예열형 전파 — 표면장력 구동류"],["전파속도","연속적, Vm = A·Su·√(ρu/ρf)","맥동적(정량화 불가)"]] },{ type:"p", text:"경질유는 액온이 인화점보다 높아 상시 가연성혼합기가 존재하므로 발화 즉시 층류 예혼합화염과 유사하게 연속적으로 전파(A≈2~3배)한다. 중질유는 액온이 인화점보다 낮아 예열이 필요하며, 표면장력 구동류(화염 근처 고온부는 표면장력↓→전방 이동, 먼 곳 저온부는 표면장력↑→부력 상실로 하강)에 의한 순환류로 열이 전달되어 맥동적으로(가속·감속 반복) 확산한다." },{ type:"callout", text:"➡ 전파속도는 액체온도가 높을수록 빨라지며, 증기농도가 화학양론조성비(Cst)에 도달했을 때 최대가 되고 그 이상 온도가 올라가도 속도는 더 이상 증가하지 않는다(산소 부족)." }] }
  ],
  cards: [
    { q:"고체·액체 연료의 발화를 결정하는 주요 변수와 발화시간의 정의는?", a:"주요 변수는 표면온도이며, 표면온도가 발화온도(Tig)에 도달하는 시점이 발화시간이다. 재료 두께 2mm를 기준으로 얇은 재료와 두꺼운 재료의 발화시간으로 나뉜다." },
    { q:"얇은 재료(l<2mm)의 발화시간 관계식과 특징은?", a:"tig = ρcl(Tig−T∞)/q″. 두께(l)와 열용량(ρc)에 비례하며, 얇아서 전체가 균일하게 가열되므로 열전도도(k)는 발화시간에 큰 의미가 없다." },
    { q:"두꺼운 재료(l≥2mm)의 발화시간 관계식과 특징은?", a:"tig = (π/4)·kρc·[(Tig−T∞)/q″]². 두께 자체는 의미가 없어지고, 열전도도·밀도·비열의 곱인 열관성(kρc)이 발화시간을 결정한다." },
    { q:"발화가 일어나기 위한 조건(임계열유속과 순수열유속의 관계)은?", a:"발화온도(Tig)에 도달하는 열유속을 임계열유속이라 하며, 순수열유속(q″)이 임계열유속보다 클 때 발화가 일어난다." },
    { q:"열관성(kρc)이 발화시간에 미치는 영향은?", a:"열관성이 클수록 표면온도 상승이 느려 발화시간이 길어지고, 열관성이 작을수록 표면에 열이 빨리 축적되어 발화시간이 짧아진다." },
    { q:"고체 표면 화염확산의 정의는?", a:"화염 자체가 확대되는 것이 아니라, 연료를 휘발시키거나 공급하는 영역(경계면)이 이동하는 과정이며 연소영역의 확대를 의미한다." },
    { q:"얇은 재료와 두꺼운 재료의 화염확산속도 관계식은?", a:"공통적으로 V=δf/tig 형태이며, 얇은 재료는 V=q″δf/[ρcl(Tig−T∞)], 두꺼운 재료는 V=Φδf (Φ=q″²/[kρc(Tig−T∞)²])이다." },
    { q:"화염확산속도를 결정하는 두 요소는?", a:"가열거리(δf)에 비례하고, 발화시간(tig)에 반비례한다. 즉 V=δf/tig." },
    { q:"상방향 화염확산이 하방향보다 빠른 이유 2가지는?", a:"① 부력으로 위쪽 가연물을 미리 가열하므로 가열거리(δf)가 길다 ② 부력에 의한 공기유입이 화염 진행방향과 같은 순풍으로 작용해 확산을 촉진한다." },
    { q:"하방향·역풍 화염확산이 느린 이유는?", a:"가열거리가 짧고, 부력에 의한 공기유입이 화염 진행방향과 반대인 역풍으로 작용해 확산을 방해하기 때문이다." },
    { q:"동일 재료 기준 화재확산 속도의 대소관계는?", a:"상방향(순풍) > 수평방향 > 하방향(역풍) 순으로 빠르다." },
    { q:"다공성 고체물질의 화염확산이 표면이 아닌 곳에서 일어나는 이유와 관계식은?", a:"다공성 물질은 내부에 빈 공간이 많아 화염이 내부에서 전파되며, 두께는 의미가 없고 V=q″/[ρb·c·(Tig−T∞)] (ρb: 용적밀도)로 표현된다." },
    { q:"다공성 고체물질이 비다공성보다 화염확산속도가 빠른 2가지 이유는?", a:"① 용적밀도(ρb)가 작아 확산속도가 용적밀도에 반비례하여 빨라짐 ② 내부에서 이미 연소 중이므로 순열유속(q″)이 커 확산속도가 빨라짐." },
    { q:"산불에서 지표화가 수관화로 전이되면 왜 진압이 어려워지는가?", a:"수관화는 다공성 연소 특성상 확산속도가 급격히 빨라지고 화염 크기 자체가 커져(불기둥이 옆 나무로 직접 튐) 접근·진화가 사실상 불가능해지기 때문이다." },
    { q:"경질유(액온>인화점)의 화염확산 형태와 이유는?", a:"예혼합형 전파. 상시 인화점보다 높은 액온으로 상부에 가연성혼합기가 항상 형성되어 있어, 발화 즉시 층류 예혼합화염과 유사하게 연속적으로 전파한다." },
    { q:"경질유의 최대 화염전파속도 관계식은?", a:"Vm = A·Su·√(ρu/ρp)  (A: 2~3, Su: 예혼합기 층류연소속도, ρu: 액온에서의 증기밀도, ρp: 화염온도에서의 증기밀도)." },
    { q:"중질유(액온<인화점)의 화염확산 형태와 열전달원은?", a:"예열형 전파. 가연성혼합기가 형성되어 있지 않아 인화점 이상으로 예열이 필요하며, 이때의 열전달원을 표면장력 구동류라 한다." },
    { q:"표면장력 구동류란?", a:"화염 근처의 표면은 온도가 높아 표면장력이 낮아지므로 화염 전방으로 이동하고, 화염에서 멀어진 곳은 온도가 낮아 표면장력이 높고 부력을 잃어 하강함으로써 형성되는 순환류. 이 흐름으로 열이 전방으로 전달되어 가연성혼합기를 형성시킨다." },
    { q:"중질유 화염확산속도가 맥동적(정량화 불가)인 이유는?", a:"표면장력 구동류라는 대류 열전달에 의해 국소적으로 가연성혼합기가 형성되면 그만큼만 화염이 이동하고 다시 예열을 기다려야 하므로, 가속과 감속을 반복하는 맥동적 형태를 가지기 때문이다." },
    { q:"액체 화염확산 전파속도가 최대가 되는 시점은?", a:"증기농도가 화학양론조성비(Cst)에 도달했을 때 최대가 되며, 그 이상 온도가 상승해도 산소가 부족해져 전파속도는 더 이상 빨라지지 않는다." }

};

    { q:"[133회] 고체연소에 영향을 주는 변수로서 1)표면적 대 질량비와의 관계 2)방향과의 관계 3)열관성과의 관계 4)난연재와의 관계를 설명하시오.", a:"① 표면적 대 질량비가 클수록(얇고 잘게 나뉠수록) 연소가 활발해짐 ② 상방향 확산이 하방향보다 빠름(가열거리·순풍효과) ③ 열관성(kρc)이 작을수록 표면온도 상승이 빨라 발화시간이 짧아짐 ④ 난연재는 발화온도를 높이거나 열분해속도를 늦춰 확산속도·발화시간에 불리하게 작용시킴." },
    { q:"[139회] 다공성 고체물질이 비다공성 고체물질보다 화염확산속도가 빠른 이유에 대하여 설명하시오.", a:"① 다공성 물질은 용적밀도(ρb)가 작아 V∝1/ρb 관계에 의해 확산속도가 빨라진다 ② 화염이 내부에서 진행되며 내부 순열유속(q″)이 커 표면 가연물에 순열류로 작용하기 때문에 확산속도가 빨라진다(V=q″/[ρb·c(Tig−T∞)])." },
    { q:"[72회] 화염 열류가 25kW/㎡일 때 3mm 두께의 합판을 발화하기 위한 시간을 구하시오.", a:"3mm는 2mm 이상이므로 두꺼운 재료 공식 tig=(π/4)kρc[(Tig−T∞)/q″]²을 적용해, 합판의 열관성(kρc)·발화온도(Tig)·초기온도(T∞) 값과 q″=25kW/㎡를 대입하여 계산한다(수치는 물성표 조건에 따라 산출)." },
    { q:"[93회] 액체에서의 표면화염확산은 고체의 표면화염 확산 메커니즘과 유사하나, 액체 내부의 움직임이 다르다. 정지된 공기 중 액면 위 화염확산에 대하여 설명하시오.", a:"고체는 열전도(kρc)에 의해 표면이 가열되어 발화온도에 이르지만, 액체는 표면장력 구동류(중질유, 예열형)나 상시 형성된 증기(경질유, 예혼합형)를 통해 확산하며, 내부에서 온도차에 따른 대류 순환이 함께 일어난다는 점이 다르다." },
    { q:"[90회] 열전도도(k)를 열확산계수(α)로 나눈 값을 열관성(kρc)이라 한다. 열관성이 발화·화염확산에 미치는 영향을 설명하시오.", a:"열관성(kρc)이 클수록 열이 표면에서 내부로 잘 전달돼 표면온도 상승이 느려 발화·화염확산이 늦어지고, 열관성이 작을수록 표면에 열이 축적되어 발화·확산이 빨라진다." },
    { q:"[101회] 다음 용어에 대하여 설명하시오. (1)드롭다운(drop down) (2)열관성(thermal inertia) (3)플래시 화재(flash fire)", a:"(1) 드롭다운: 화재로 인해 용융·연화된 물질(천장재 등)이 아래로 떨어져 낙하물화재를 유발하는 현상. (2) 열관성: kρc로 정의되며 표면온도 상승속도를 결정하는 물질 특성. (3) 플래시 화재: 예혼합된 가연성 가스운이 순간적으로 전체가 발화·연소하는 화재." },
    { q:"[108회] 다음 용어에 대하여 설명하시오. 1)불포화탄화수소 2)방향족탄화수소 3)열경화성 플라스틱 4)지환족탄화수소 5)발화시간", a:"발화시간은 재료 표면온도가 발화온도(Tig)에 도달하는 시간으로, 얇은 재료는 tig=ρcl(Tig−T∞)/q″, 두꺼운 재료는 tig=(π/4)kρc[(Tig−T∞)/q″]²로 산출한다." },
    { q:"[136회] 화재 발생 시 건축물에서 화염확산 경로와 방화벽 및 차연 시스템의 역할을 쓰고 설계 기준을 설명하시오.", a:"화염은 개구부·틈새·수직샤프트 등 경계면을 따라 확산되며, 방화벽은 화염확산의 경로를 차단(내화성능·구획), 차연시스템은 연기의 이동경로를 차단하여 화염·연기의 동시 확산을 억제하도록 설계한다." },
    { q:"[62회] 발화점에 대하여 쓰시오.", a:"발화점(자연발화점)은 외부 점화원 없이 가연물 스스로 열을 축적해 발화하는 최저온도이며, 표면온도가 이 온도에 도달하는 시점이 발화시간이다." },
    { q:"[83회] 발화점이 낮아지는 조건 5가지를 기술하시오.", a:"① 압력이 높을수록 ② 산소농도가 높을수록 ③ 열전도율(열관성)이 작을수록 ④ 발열량이 클수록 ⑤ 화학적 활성도(불포화도)가 클수록 발화점이 낮아진다." }
  ]
};

    { q:"Slop Over의 발생 메커니즘과 대책은?", a:"소방대 주수소화로 인해 열은 하강·물질은 상승하던 반대 흐름이 갑자기 열·물질이 같은 방향으로 바뀌며 열류층이 교란되어 탱크 밖으로 비산하는 현상이다. 대책은 방유제·보유공지 확보로 확대를 방지하는 것이다." },

    { q:"[125회] 천정열기류(Ceiling Jet)에 관한 계산 모델에서 정의, 화재플럼 중심축으로부터 거리 r만큼 떨어진 위치에서의 기류 온도와 속도 관계식을 설명하시오.", a:"Ceiling Jet Flow는 화재플럼이 천장에 막혀 수평으로 흐르는 가스흐름이며, 온도·속도는 각각 열방출률(Q)과 천장높이(H), 반경거리(r)의 함수로(Alpert식 등) 표현되어 r/H가 작을수록(중심축에 가까울수록) 온도·속도가 높다." },
    { q:"[99회] 고체 또는 액체의 연소 시 화재플룸(fire plume) 속도는 증발하는 연소가스의 출구 속도보다는 유입되는 공기에 지배되는 것으로 알려져 있다. 이유를 설명하시오.", a:"플럼의 상승속도는 부력에 의해 유입되는 다량의 주변 공기 흐름이 지배적이며, 연료 표면에서 증발하는 가스 자체의 분출속도는 상대적으로 매우 작아 플럼 전체의 속도에 미치는 영향이 미미하기 때문이다." },
    { q:"[106회/122회] 가솔린의 화재플룸(Fire Plume) 속도는 증발속도보다 100배 이상 빠르다. 그 이유를 설명하시오.", a:"플럼 속도는 부력에 의한 유입공기량에 지배되고 증발속도는 연료 표면에서의 국소적 물질전달속도이므로, 부력에 의한 대규모 공기유입 흐름이 훨씬 커서 플럼 속도가 증발속도를 압도적으로 상회한다." },
    { q:"[113회] 가솔린 화재에서 화재플룸(Fire Plume) 속도가 공기인입을 제어하는 이유를 설명하시오.", a:"플럼이 상승하며 주변 공기를 끌어들이는 유입(entrainment) 흐름이 플럼 자체의 상승속도에 의해 결정되므로, 플럼의 상승속도(부력에 의한)가 공기인입량과 속도를 지배(제어)하기 때문이다." },
    { q:"[124회] 화재플럼(fire plume)의 발생 메커니즘(mechanism)과 활용방안을 설명하시오.", a:"온도상승→밀도저하→부력 발생→상승기류 발생→주위 냉기 인입→희석·냉각→난류 발생의 메커니즘을 가지며, 화재시뮬레이션 입력값 제공, Ceiling Jet Flow 형성을 통한 감지기·스프링클러 설계 등에 활용된다." },
    { q:"[138회] 화재플럼(Fire Plume) 모델인 Zukoski, McCaffrey, Thomas 모델의 특징을 설명하시오.", a:"세 모델 모두 화재플럼의 온도·속도 분포를 열방출률과 높이의 함수로 표현하는 경험식으로, 적용 범위(연속화염역/간헐화염역/부력플럼역)와 실험조건에 따라 계수와 지수가 다르게 구성된다." },
    { q:"[120회/137회] 일반건축물 화재 시 Flame Over(Roll Over) 현상과 LNG저장탱크에서 발생하는 Roll Over 현상을 비교 설명하시오.", a:"건축물 Flame Over는 열분해된 미연소가스가 천장 하부에 층을 이루다 연소범위 도달 시 점화되어 화염이 구르듯 전파되는 현상이다. LNG 저장탱크의 Roll Over는 밀도차가 있는 LNG 층이 자연대류로 급격히 뒤섞이며 다량의 BOG(증발가스)가 순간 방출되는 현상으로, 화재현상이 아닌 물성(밀도) 역전에 의한 현상이라는 점에서 다르다." },
    { q:"[135회] 화염높이 계산(Heskestad식) 예: 쓰레기통 직경 1.0m, 최대연소속도 10g/s, 발생연소열 20kJ/g 조건에서 열방출률과 화염높이를 구하시오.", a:"Q=m″×ΔHc=10g/s×20kJ/g=200kW. Heskestad식 Lf=0.23Q^(2/5)−1.02D에 D=1.0m을 대입해 화염높이를 산출한다." },
    { q:"화재성장곡선이 감지기·스프링클러 설계에 활용되는 방식은?", a:"화재성장속도(Ultra Fast~Slow)에 따라 열방출률이 임계치에 도달하는 시간이 달라지므로, 빠르게 성장하는 화재가 예상되는 공간에는 감지기·헤드의 응답성을 높이거나 더 조밀하게 배치해야 한다." }
  ]
};

    { q:"연기 단층화의 문제점과 대책은?", a:"문제점은 감지기·스프링클러 헤드의 작동(감열개방) 지연·불능이다. 대책은 공기흡입형 감지기, 불꽃감지기, 일제살수식 스프링클러 설치이다." },

    { q:"열응력(여력)과 화상 발생 조건은?", a:"열응력은 신체 내부온도가 41℃에 달할 때부터 발생, 45℃에서 통증 유발, 통증 한계온도는 약 200℃이다. 화상은 약 4kW/㎡의 열류에서 발생한다." },
    { q:"마취성가스에 해당하는 물질과 인체에 미치는 영향은?", a:"CO, 고농도 CO2, 저농도 O2, HCN이 해당하며, 수면상태를 유도해 피난능력을 감퇴시키고 결국 사망에 이르게 한다." },

    { q:"CO 농도별 인체 영향(800ppm과 12,800ppm)은?", a:"800ppm에서는 2~3시간 내 사망, 12,800ppm에서는 1~3분 내 사망한다. 농도가 2배가 될 때마다 생존 가능시간이 약 절반으로 줄어든다." },

    { q:"저산소(O2) 농도 8%와 6%의 인체 영향은?", a:"8%에서 혼수상태, 6%에서 순간 실신·호흡정지·경련으로 단시간(약 5분) 내 사망한다." },
    { q:"축합중합반응과 첨가중합반응의 차이는?", a:"축합중합반응은 결합 시 단위체가 가진 작용기 일부가 외부로 빠져나가며 열경화성 수지를 만들고, 첨가중합반응은 다중(이중)결합이 단일결합으로 연결되며 열가소성 수지를 만든다." },
    { q:"열경화성 수지와 열가소성 수지의 화재위험성 차이는?", a:"열경화성 수지(멜라민·페놀·요소수지)는 한번 경화되면 재가열해도 잘 붙지 않지만 고온에서는 분해되어 발화할 수 있다. 열가소성 수지(폴리에틸렌·폴리스티렌·PVC)는 열을 가하면 녹아 액체 가연물화되어 상대적으로 화재위험이 크다." }

    { title:"2. 금속화재(D급)의 특성과 소화약제", blocks:[{ type:"p", text:"금속화재는 일반 가연성물질 화재보다 고온(1,500℃ 이상)에서 연소되며, 물을 사용할 수 없다. 고온의 물이 공유결합·수소결합이 파괴되며 H2+O2로 분해되어 화학적(수소)폭발, 또는 급격한 기화(약 1,700배 부피팽창)로 물리적(수증기)폭발을 유발할 수 있다." },{ type:"table", headers:["소화약제(Dry Powder)","주성분","소화효과"], rows:[["Na-X","Na2CO3 + 첨가제","연쇄반응억제(Na2CO3) + 피복질식(첨가제)"],["MET-L-X","NaCl + Ca3(PO4)2","냉각(NaCl) + 피복질식"],["G-1","흑연 입힌 코크스(유기인)","냉각(흑연 고열전도) + 피복질식(코크스의 방진작용)"],["TMB","B(OCH3)3(붕산트리메틸)","자신이 타서 유리(glass)상 피막 형성→피복질식"],["TEC","BaCl2, KCl, NaCl","피복질식(BaCl2, 낮은 융점 물질) + 연쇄반응억제(KCl·NaCl)"]] },{ type:"callout", text:"➡ 금속화재용 소화약제 구비조건(암기: 고냉피용) — 고온에 견딜 것, 냉각효과가 있을 것, 요철이 있는 금속표면을 피복할 수 있을 것, Na·K 등 용융 금속의 액면 위에 뜰 것. 국내는 마그네슘·나트륨 화재용 일부만 형식승인 기준이 있어 그 외에는 건조사·팽창질석 등으로 대응한다." }] },
    { title:"3. K급 화재(식용유 화재)와 소화방법", blocks:[{ type:"p", text:"K급 화재는 인화점과 발화점의 온도범위차가 좁아(발화점 약 288~385℃) 일반 B급 소화약제로는 소화가 어렵다. 화염을 제거해도 유온이 여전히 발화점 이상이므로 재발화가 쉽고, 후드를 타고 덕트화재로 전이될 수 있다." },{ type:"code", text:"강화액 소화약제:  K2CO3 + H2O → 2KOH + CO2  (연쇄반응 억제·냉각)\n비누화 반응:  유지(에스테르) + 3KOH → 3RCOOK(금속비누) + 글리세롤" },{ type:"callout", text:"➡ K+가 연쇄반응을 억제(K+ +OH→KOH, KOH+H→K+ +H2O)하고, 생성된 KOH가 유지와 반응해 금속비누(RCOOK)를 만들어 표면을 덮는 피복(비누화)·질식소화를 하며, CO2·H2O에 의한 냉각효과도 겸비한다. 중탄산나트륨(NaHCO3, 1종분말)도 같은 비누화 반응을 일으켜 적용 가능하다. 예방대책은 후드의 정기적 청소이다." }] },
    { title:"4. 화재패턴의 종류와 생성 메커니즘", blocks:[{ type:"p", text:"화재패턴은 ① 복사열 차등(열원에서 멀수록 복사열 약화) ② 온도차등·연소상승원리(고온가스는 상부로 이동) ③ 차단의 원리(벽·기둥 등 장애물에 의한 차단)로 생성된다." },{ type:"table", headers:["액체가연물 패턴","특징"], rows:[["Pour Pattern(푸어패턴)","액체가 바닥에 쏟아진 부분과 쏟아지지 않은 부분의 경계 흔적"],["Splash Pattern(스플래시패턴)","액체가 쏟아지며 주변으로 튀어 점처럼 연소된 흔적"],["Ghost Mark(고스트마크)","바닥타일 접착제에 액체가 스며들어 뒷면까지 강렬하게 연소된 흔적"],["틈새연소패턴","낮은 곳으로 흘러가 틈새에 고인 액체가 연소한 흔적"],["Doughnut Pattern(도넛패턴)","웅덩이 액체의 중심부는 기화열로 냉각, 가장자리가 더 많이 타는 도넛 형태"],["Trailer Pattern(트레일러패턴)","의도적으로 연소를 확대시키려 뿌려놓은 가연물의 흔적(방화 의심)"],["Rainbow Pattern(레인보우패턴)","소화수 위에 뜬 기름띠(무지개색) 흔적"]] }] },
    { title:"5. 화재조사의 절차와 발화부 추정 원칙", blocks:[{ type:"p", text:"화재조사는 발화원인·연소확대요인 규명, 통계·정책자료 활용, 책임규명, 기술개발을 목적으로 하며, 화재원인조사(발화원인·발견통보및초기소화상황·연소상황·피난상황)와 화재피해조사(인명·재산피해)로 구분된다." },{ type:"p", text:"조사순서: 현장관찰→관계자질문→소방관 협의→발화범위 결정→현장발굴·복원→발화지점 판정→발화원 검토→발화원 판정." },{ type:"callout", text:"➡ 발화부 추정 시 유의점(5원칙): ① 인접 가연물의 착화과정에 모순이 없을 것 ② 소손상황·환경조건 종합관찰의 타당성이 있을 것 ③ 과거 화재사례·경험과 모순이 없을 것 ④ 추정된 발화원 외 다른 발화원이 배제될 것 ⑤ 발화점의 소손상황에 모순이 없을 것." }] }
  ],
  cards: [
    { q:"A급~K급 화재를 각각의 정의와 함께 나열하면?", a:"A급(일반화재: 재가 남는 나무·섬유·종이 등), B급(유류화재: 재가 남지 않는 인화성·가연성 액체), C급(전기화재: 통전 중인 전기기기·배선), D급(금속화재: Mg·Ti·Zr·Na·K 등 가연성 금속), K급(주방화재: 조리용 동식물유 취급 기구에서 발생)." },
    { q:"금속화재가 일반화재보다 고온인 이유와 대략적 온도는?", a:"금속을 열분해(기화)시켜 가연성혼합기를 만드는 데 매우 많은 에너지가 필요하기 때문에 물질 자체의 온도가 높은 상태에서 연소하며, 대략 1,500℃ 이상의 고온으로 연소한다." },
    { q:"금속화재에 물을 사용할 수 없는 이유는?", a:"고온(약1,500℃)에 의해 물의 공유·수소결합이 파괴되면서 H2와 O2로 분해되어 화학적(수소)폭발을 일으키거나, 급격한 기화(약1,700배 부피팽창)로 물리적(수증기)폭발을 일으킬 수 있기 때문이다." },
    { q:"금속화재용 소화약제(Dry Powder)의 구비조건(고냉피용)은?", a:"① 고온에 견딜 것 ② 냉각효과가 있을 것 ③ 요철 있는 금속표면을 피복할 수 있을 것 ④ Na·K 등 용융되는 금속의 액면 위에 뜰 것." },
    { q:"Na-X, MET-L-X, G-1, TMB, TEC 소화약제의 주성분과 소화효과는?", a:"Na-X(Na2CO3+첨가제: 연쇄반응억제+피복질식), MET-L-X(NaCl+Ca3(PO4)2: 냉각+피복질식), G-1(흑연+코크스: 냉각+피복질식), TMB(B(OCH3)3: 유리상 피막 형성으로 피복질식), TEC(BaCl2·KCl·NaCl: 피복질식+연쇄반응억제)." },
    { q:"국내에서 형식승인을 받은 금속화재용 소화약제는 어느 정도까지 진행되어 있는가?", a:"마그네슘 화재용, 나트륨 화재용 일부만 형식승인 제품검사 기술기준이 마련되어 있으며, 리튬 등 그 외 금속은 아직 형식승인 기준이 없어 건조사·팽창질석 등으로 대응하는 상황이다." },
    { q:"K급 화재가 일반 B급 소화약제로 소화되지 않는 이유는?", a:"인화점과 발화점의 범위차가 좁아 유온이 발화점 근처를 넘으면 바로 발화하며, 화염을 제거해도 유온이 여전히 발화점 이상으로 남아있어 재발화가 쉽게 일어나기 때문이다." },
    { q:"강화액 소화약제의 주성분과 반응식은?", a:"K2CO3(탄산칼륨)와 H2O의 혼합물이며, K2CO3+H2O→2KOH+CO2 반응을 거쳐 K+가 연쇄반응을 억제하고 CO2·H2O가 냉각효과를 낸다." },
    { q:"K급 화재에서 비누화(saponification) 반응이란?", a:"강화액(KOH)이나 1종분말(NaHCO3, 비누화 시 NaOH)이 식용유(유지, 에스테르)와 반응하여 금속비누(RCOOK/RCOONa)를 생성하는 반응으로, 생성된 금속비누 거품이 유면을 덮어 질식소화 효과를 낸다." },
    { q:"K급 화재의 예방대책은?", a:"주방 후드의 정기적인 청소로 덕트화재로의 전이를 방지하는 것이 핵심 예방대책이다." },
    { q:"화재패턴이 생성되는 3가지 메커니즘은?", a:"① 복사열 차등(열원에서 멀수록 복사열 약화) ② 온도차등·연소상승원리(고온가스는 밀도차로 상부로 이동) ③ 차단의 원리(벽·기둥 등 장애물에 의해 열기류가 차단)." },
    { q:"Pour Pattern(푸어패턴)이란?", a:"액체가연물이 바닥에 쏟아졌을 때, 쏟아진 부분과 쏟아지지 않은 부분 사이에 생기는 경계 흔적." },
    { q:"Splash Pattern(스플래시패턴)이란?", a:"액체가연물이 쏟아지며 주변으로 튀거나 연소되면서 Pour Pattern 주변에 점처럼 연소된 흔적." },
    { q:"Ghost Mark(고스트마크)란?", a:"석유류 등 액체가연물이 바닥의 비닐타일 접착제에 스며들어 타일 뒷면까지 격렬하게 연소된 흔적으로, 플래시오버 같은 강렬한 화재열기 속에서 나타난다." },
    { q:"Doughnut Pattern(도넛패턴)이 생기는 이유는?", a:"가연성 액체가 웅덩이처럼 고여 연소할 때, 중심부는 액체 증발(기화열)로 냉각되어 온도가 낮고, 주변부(가장자리)가 상대적으로 더 많이 타서 도넛 모양의 패턴이 남기 때문이다." },
    { q:"Trailer Pattern(트레일러패턴)이란?", a:"의도적으로 한 장소에서 다른 장소로 연소를 확대시키기 위해 가연물(액체 등)을 뿌려놓은 흔적으로, 방화를 의심할 수 있는 패턴이다." },
    { q:"화재조사의 4가지 목적은?", a:"① 발화원인·연소확대요인 규명으로 예방대책 수립 ② 통계화하여 정책자료로 사용 ③ 방화·실화의 발화원인에 대한 책임 규명 ④ 화재원인에 따른 기술개발 연구." },
    { q:"화재조사의 현장조사 순서는?", a:"현장관찰→관계자질문→소방관 협의→발화범위 결정→현장발굴·복원→발화지점 판정→발화원 검토→발화원 판정." },
    { q:"발화부와 화원부의 차이는?", a:"발화부는 화재가 처음 시작된 곳이며, 화원부는 발화부를 포함하는 더 넓은 영역을 의미한다(예: 다수 가옥이 함께 연소했을 때 최초 발화 가옥을 판단하는 것이 발화부 판단에 우선한다)." },
    { q:"발화부 추정 시 유의할 5가지 원칙은?", a:"① 인접 가연물의 착화과정에 모순이 없을 것 ② 소손상황·발견상황·환경조건을 종합 관찰한 타당성이 있을 것 ③ 과거 화재사례·경험에 비춰 모순이 없을 것 ④ 추정된 발화원 이외의 다른 발화원이 사용상태·소손현황상 배제될 것 ⑤ 발화점으로 추정된 장소의 소손상황에 모순이 없을 것." },
    { q:"연소상황·소적 관찰방법의 종류(암기: 도연탄용, 균용박, 부변, 주연주염훈복)는?", a:"연소의 상승성, 도괴현상, 탄화심도, 용융흔, 균열흔, 박리흔, 부착흔, 변색흔, 주연흔(연기흔적), 주염흔(화염흔적), 훈소흔, 복사흔 등을 종합 관찰하여 발화부를 추정한다." }
  ]
};

    { q:"[71회] 화재의 분류를 국내기준과 미국방화협회(NFPA), 국제표준화기구(ISO)와 각각 비교 설명하시오.", a:"국내(소방시설법)와 NFPA10은 A(일반)·B(유류)·C(전기)·D(금속)·K(주방)급으로 분류하는 반면, ISO(7165 등)는 K급 대신 F급(식용유·지방 화재)으로 표기하는 등 세부 명칭에 차이가 있다." },
    { q:"[69회] 미국 방화협회(NFPA 10)에서는 K-급화재, 국제표준화기구(ISO 7165)에서는 F-급 화재로 분류되고 있는 화재에 대하여 설명하시오.", a:"동식물유(식용유) 등 가연성 튀김기름을 포함한 조리로 인한 화재로, 인화점·발화점 범위가 좁고 재발화가 쉬워 일반 B급 소화약제로는 소화가 어렵다. 강화액(K2CO3) 등 비누화 반응을 이용한 전용 소화약제·설비를 사용한다." },
    { q:"[109회] 상업용 주방 소화장치와 K급 화재에 대하여 설명하시오.", a:"K급 화재는 식용유의 좁은 인화점-발화점 범위로 재발화가 쉬우므로, 상업용 주방 소화장치는 강화액 등 비누화 반응 소화약제를 자동 감지·방출하여 질식·냉각 소화하고 동시에 가스밸브 차단 등 연동제어를 수행한다." },
    { q:"[126회] 상업용 조리시설의 식용유 화재에서 발생하는 스플래시(Splash)현상에 대하여 설명하시오.", a:"고온의 식용유에 물 등이 유입되면 급격한 비등·기화로 기름이 튀어오르는 현상으로, 화재 시 소화수 방사가 부적절하면 오히려 불붙은 기름이 비산해 연소를 확대시킬 수 있어 전용 소화약제 사용이 중요하다." },
    { q:"[63회] 금속화재 방지방법 4가지를 설명하시오.", a:"① 금속 저장 시 물·습기와의 접촉 차단 ② 분진 형태 저장 시 정전기·마찰 등 점화원 관리 ③ 불활성가스 분위기 저장 ④ 화재 시 마른 모래·팽창질석 등 전용 소화제 비치." },
    { q:"[94회] 금속화재 발생 시 화재진압 방법에 대하여 설명하시오.", a:"물 사용을 금지하고, 건조사·팽창질석·팽창진주암 또는 금속화재용 분말소화약제(Dry Powder)로 피복질식+냉각소화를 실시하며, 필요시 화재 확산 방지를 위한 격리·차단을 병행한다." },
    { q:"[82회] 마그네슘화재 시 소화약제로서 물과 이산화탄소를 사용할 수 없는 이유를 쓰고 화학반응식으로 표현하시오.", a:"Mg는 고온에서 물과 반응해 수소를 발생(Mg+2H2O→Mg(OH)2+H2↑)시켜 폭발 위험이 있고, CO2와도 반응(2Mg+CO2→2MgO+C 또는 Mg+CO2→MgO+CO)하여 오히려 연소를 촉진하므로 두 약제 모두 사용할 수 없다." },
    { q:"[116회] 나트륨(Na)에 관하여 물과의 반응식, 보호액의 종류와 사용 이유, 사용할 수 없는 소화약제를 쓰시오.", a:"반응식: 2Na+2H2O→2NaOH+H2↑. 보호액은 석유(등유·경유) 등 물과 반응하지 않는 액체로 공기·수분 차단을 위해 사용한다. 사용할 수 없는 소화약제는 물, CO2, 할로겐화합물 소화약제이다(Na와 반응해 위험 촉발)." },
    { q:"[61회/62회] 발화부 추정의 5원칙에 대하여 기술하시오.", a:"① 인접 가연물의 착화과정에 모순이 없을 것 ② 소손·발견상황·환경조건 종합관찰의 타당성 ③ 과거 화재사례·경험과 모순이 없을 것 ④ 추정된 발화원 이외 다른 발화원이 배제될 것 ⑤ 발화점 소손상황에 모순이 없을 것." },
    { q:"[94회] 화재조사 시 소실정도에 의한 화재를 분류하고, 발화부 추정원칙 6가지를 설명하시오.", a:"소실정도는 전소(70%이상)·반소(30~70%)·부분소(30%미만)로 분류된다. 발화부 추정원칙은 5원칙에 '연소는 상승하는 성질이 있다는 원리(고온가스가 상부로 이동)에 근거해 판단할 것'을 더해 6가지로 제시되기도 한다." },
    { q:"[76회] 화재사고의 원인조사를 실시하기 위해 필요한 기초지식, 사고조사 진행 순서 및 발화원의 존재유무에 따른 검토사항을 기술하시오.", a:"기초지식은 연소이론·전기공학·화학 등이 필요하며, 진행순서는 현장관찰→관계자질문→발화범위결정→현장발굴→발화지점판정→발화원검토→판정이다. 발화원이 잔존할 경우 물적증거로 직접 판정하고, 잔존하지 않을 경우 소손상황·정황증거를 종합해 타당성을 검토한다." },
    { q:"[104회] 화재패턴의 생성 메커니즘에 대하여 설명하시오.", a:"복사열 차등(열원에서 멀수록 복사열 약화), 온도차등·연소상승원리(고온가스가 밀도차로 상승), 차단의 원리(장애물에 의한 열기류 차단)의 3가지 메커니즘으로 화재패턴이 생성된다." },
    { q:"[91회] 화재패턴이 만들어지는 원인으로는 열변형, 소실(燒失), 연소생성물의 퇴적 등이 있는데, 어떤 원리에 의해 열원을 추적해 갈 수 있는지 설명하시오.", a:"복사열 차등·연소상승·차단원리에 따라 열원에 가까울수록 탄화심도가 깊고 손상이 크며, 이 손상 정도의 구배(gradient)를 역추적하면 발화부·열원의 위치를 특정할 수 있다." },
    { q:"[96회] 화재조사에서 화재패턴의 종류 중 도넛패턴(doughnut pattern)에 대하여 설명하시오.", a:"가연성 액체가 웅덩이처럼 고인 상태에서 연소할 때, 중심부는 기화열에 의해 냉각되고 가장자리(주변부)가 더 많이 타서 나타나는 도넛 모양의 연소흔적이다." },
    { q:"[110회] 화재원인조사 및 감식과정에서 트레일러패턴(Trailer pattern)과 고스트마크(Ghost mark)에 대하여 설명하시오.", a:"트레일러패턴은 방화 등 의도적으로 연소를 확대하려 액체가연물을 연속적으로 뿌려놓은 흔적이고, 고스트마크는 액체가연물이 바닥타일 접착제에 스며들어 타일 뒷면까지 강렬하게 연소된 흔적으로 강한 화재열기(F.O급) 하에서 나타난다." },
    { q:"[105회] 액체탄화수소의 일반적인 특성과 연소 후 특징적으로 나타나는 화재패턴(Fire Pattern)에 대하여 설명하시오.", a:"액체탄화수소는 인화점이 낮고 증발이 쉬운 특성이 있으며, 연소 후 Pour·Splash·Doughnut·Trailer·Ghost mark·Rainbow 등의 액체가연물 특유의 화재패턴을 남긴다." },
    { q:"[106회] 직경 1m인 시험체 표면적을 가진 가솔린화재 패턴이 동일 조건의 목재화재 패턴보다 비교적 손괴가 적은 이유를 설명하시오.", a:"화재패턴상 손괴 정도는 가연물 표면에 공급되는 순열유속(q″=m″×L)에 비례하는데, 가솔린은 열방출률(질량연소속도×연소열)은 크지만 기화열도 커 순열유속 자체는 목재보다 크지 않아 상대적으로 손괴가 적게 나타난다." },
    { q:"[134회] 화재 조사 시 V-Pattern, U-Pattern, Hourglass Pattern, Pointer and Arrow Pattern의 발생 원인을 설명하시오.", a:"V-Pattern은 벽면에서 발화점 위로 화염이 확산되며 생기는 V자형 흔적(연소상승원리), U-Pattern은 국부적 집중연소로 생기는 U자형, Hourglass Pattern은 상하부가 모두 소손되어 가운데가 잘록한 모래시계형, Pointer and Arrow Pattern은 화염이 진행한 방향을 가리키는 뾰족한 그을음·탄화흔적이다." },
    { q:"[135회] 화재감식에서 발화부를 암시하는 화재패턴 중 엘리게이터링(Alligatoring) 현상과 탄화심도 측정방법을 설명하시오.", a:"엘리게이터링은 목재 표면이 악어가죽처럼 각진 형태로 갈라지는 탄화흔적으로, 균열이 작고 각진 형태일수록 급격한 고온 연소를 의미한다. 탄화심도는 탐침을 이용해 탄화층의 깊이를 격자별로 측정하여 발화부에 가까울수록 깊게 나타나는 것을 확인한다." }
  ]
};

  notes:[
    { title:"1. 전기화재의 발생 메커니즘(줄열·스파크)", blocks:[{ type:"p", text:"전기화재는 전기에너지를 열원으로 하여 발생하는 화재로, 화재원인 통계상 원인미상 다음으로 많은 비중을 차지한다. 부주의 화재는 홍보·교육 외에 뚜렷한 공학적 대책을 세우기 어려운 반면, 전기화재는 메커니즘이 규명되어 있어 대책 수립이 가능하므로 시험에도 비중 있게 출제된다. 크게 줄열에 의한 발화와 스파크·아크에 의한 발화로 구분한다." }, { type:"table", headers:["구분", "발화 메커니즘", "관계식"], rows:[["줄열(Joule熱)", "도체에 전류 흐름→저항 증가→줄열 발생→발열>방열→발화", "H=I²Rt (H:발생열[J], I:전류[A], R:저항[Ω], t:통전시간[s])"], ["스파크·아크", "전기회로 개폐·퓨즈 용단·단락 시 스파크·아크 발생→점화원 작용", "공기 절연내력 3kV/mm 이상 시 방전현상 발생"]] }, { type:"p", text:"저항 R=ρL/A이므로 도체 길이가 길고 단면적이 작을수록 저항이 증가해 발열량이 커진다. 비닐절연전선은 정격의 200~300%에서 피복이 변질·변형되고 500~600%에서 용융되며, 이때 선간 단락이 일어나면 1,000A 이상의 대전류가 흘러 발화로 이어진다." }, { type:"code", text:"단락시 케이블이 소손되지 않는 허용 도체단면적:  S(mm²) = I√t / 134\n(I: 단락전류[A], t: 단락지속시간[s])" }, { type:"callout", text:"➡ 전기화재의 개별 원인(아산화동·은이동·트래킹·탄화현상 등)은 단독으로 작용하기보다 복합적으로 얽혀 최종적으로 '반열량>방열량'이 되어 발화에 이른다. 답안에서는 이를 하나씩 분해해 서술하는 것이 요령이다." }] },
    { title:"2. 전기화재 원인별 대책 총정리", blocks:[{ type:"table", headers:["종류", "개념", "원인", "대책"], rows:[["과열", "전류흐름>줄열>과열>열축적>발화", "장시간 사용, 부주의, 온도제어장치 결함, 과열 전기설비", "정기점검, 접촉 착화 방지, 교육"], ["트래킹", "도전로 형성>단락·발열>발화", "전원극 사이 이물질 축적", "지속적 교육·정기점검"], ["탄화현상", "목재·고무 절연체>스파크·아크 고온>미소전류 탄화심화>도전로 형성>발화", "차단기·스위치 성능 저하", "차단기·스위치 성능향상"], ["접촉저항 증가(아산화동)", "접속부 접촉불량>면적감소>저항증가>줄열>발화, 고온동체 아산화동 증식>발열>열축적", "단자·전선연결부 접촉불량, 고온·스파크에 의한 동체 산화", "정기점검, 완전한 결속, 접촉면 증가, 고유저항 낮은 재료 사용"], ["은이동 현상", "직류전압 인가>절연물 수분부착>은이동>도전로 형성>발화", "절연물의 흡습성, 고온다습 환경, 산화환원가스 존재", "습도관리, 산화환원가스 제거"], ["반단선", "코드 내 전선이 피복 내에서 끊어짐과 이어짐 반복>줄열, 스파크>아산화동 생성", "규격용량 코드 미준수", "규격용량 코드 사용, 배선·누전/과전류 차단기"], ["누전", "누전전류의 통로로 설계된 곳 이외로 전류가 흐르는 현상>줄열>발화", "절연파괴, 대전류", "누전차단기·누전경보기, 정기점검"], ["낙뢰", "구름과 대지간 방전현상, 공기절연내력 3kV/mm 초과 방전", "자연현상", "피뢰설비"], ["스파크(개폐)", "스위치 개폐 등에 의한 스파크·불꽃 발생>가연물과 착화", "개폐기 작동 시 스파크 발생", "단락전류 이상 배선, 누전·과전류 차단기, 정격용량 퓨즈"], ["지락", "1상 단락전류가 대지로 통하는 것>스파크>발화", "전선의 단선", "지락 발생 주의, 정기점검"], ["경년열화", "전기절연물이 시간 경과에 따라 성능 저하>절연특성 저하>발화", "장시간 사용", "수명·내구연한 고려 교체, 교육"], ["정전기", "도체는 접지·본딩, 부도체는 정전기 대전방지제·제전기 사용", "공기절연내력 3kV/mm 초과 방전", "도체(접지·본딩), 부도체(대전방지제·제전기), 인체(대전방지 작업복·접지)"]] }] },
    { title:"3. 피뢰설비의 구성과 수뢰부 설계법", blocks:[{ type:"p", text:"피뢰설비는 낙뢰 우려가 있거나 높이 20m 이상인 건축물·공작물, 위험물 저장·취급시설 등에 설치한다. 구성요소는 ① 수뢰부시스템(낙뢰를 포착하는 피뢰침·망상도체·가공지선) ② 인하도선시스템(뇌격전류를 접지시스템으로 흘리는 도체) ③ 환상도체(인하도선을 서로 접속하는 구조물 둘레의 루프) ④ 접지시스템(뇌격전류를 대지로 방출)이다." }, { type:"table", headers:["수뢰부 설계법", "개념", "장점", "단점"], rows:[["보호각법", "건물 높이에 따라 보호각을 차등적용, 높을수록 보호각을 줄여 피뢰침을 더 많이·높이 설치", "적용이 용이, 경제적", "60m 이하 건축물·간단한 형상에만 적용 가능, 측뢰 보호 불가"], ["회전구체법", "보호레벨에 따른 반경(R)의 구를 굴려 만나는 부분에 수뢰부 설치(직격뢰+유도뢰 대비)", "60m 초과·복잡한 건축물 적용 가능, 측뢰로부터 보호 가능", "적용이 어려움"], ["메쉬법", "건축물에 그물·케이지 형태로 수뢰부를 설계, 보호레벨에 따라 메쉬폭 차등", "60m 초과 건축물·측뢰 보호 가능", "굴곡없는 평지붕·경사지붕에 국한, 적용이 어려움"]] }, { type:"callout", text:"➡ 보호각법은 간단한 저층 건물, 회전구체법과 메쉬법은 고층·복잡한 형상 건물에 적용한다. 60m를 넘는 건축물은 높이의 4/5 지점부터, 150m 초과 시 120m 지점부터 최상단까지 측면 수뢰부를 추가 설치해야 한다." }] },
    { title:"4. 정전기 제전기의 원리와 종류", blocks:[{ type:"p", text:"제전이란 대전된 정전기에 이온(ion)을 이용하여 중화시키는 물리적 작업이다. 도체는 접지·본딩으로 처리하고, 부도체는 제전기를 이용한다. 제전기가 발생시킨 이온은 대전물체의 전하와 반대 극성이며 대전물체로 이동하여 전하와 결합, 공기절연내력 3kV/mm 이하로 낮춰 방전(재해)을 방지한다." }, { type:"table", headers:["종류", "원리", "특징"], rows:[["전압인가식", "약 7,000V 이상 고전압을 인가해 공기분자를 강제로 (+)(-) 이온으로 분리", "제전능력 크고 제전범위 넓음, 이동물체 적용 가능. 단, 고전압 자체가 점화원으로 작용할 위험, 접지 필요, 취급 복잡"], ["자기방전식", "대전물체 자체의 정전기(정전유도)를 이용해 반대극성 이온 유도·발생", "전원·접지 불필요, 안전성 우수, 방폭지역 가능, 취급 간단. 단, 제전능력·범위는 상대적으로 좁음"], ["방사선식", "방사성 물질의 전리작용으로 이온 발생", "구조 간단, 전원 불필요, 안전성 우수. 단, 제전능력·범위가 작아 고정물체에 적용, 방사선 인체접촉 방지 위한 차폐 필요"]] }, { type:"callout", text:"➡ 액티브(전원 투입형) vs 패시브(무전원형) 개념: 액티브 방식(전압인가식 제전기, 강제배연 송풍기, 승강기 등)은 효과는 크지만 전원차단 시 작동하지 않는 신뢰성 문제가 있고, 패시브 방식(자기방전식·방사선식 제전기, 자연배연창, 계단 등)은 효과는 상대적으로 낮지만 신뢰성이 높다. 이 대비구조는 재연설비·피난설비 등 앞으로 배울 모든 소방시스템 비교에 반복 적용되는 핵심 사고틀이다." }] },
    { title:"5. 사찰 및 목조문화재 건축물 화재", blocks:[{ type:"p", text:"목재의 주성분은 셀룰로오스(C6H10O5, 섬유소)로 화재에 매우 취약하다. 목조 건축물의 화재 진행: 목재가열→100℃ 수분 증발→220~260℃ 목재 분해(열분해, 가연성가스 발생)→300~350℃ 탄화 종료→420~470℃ 원격 발화(자연발화)." }, { type:"table", headers:["구분", "문제점"], rows:[["방재시설", "소화기 사용시 문화재 훼손 우려, 소화설비가 내부에 국한되어 외부화재 대응 미흡, 설치시설 노후화"], ["감시설비", "CCTV 등 정부주도 감시시설 미흡, 지정문화재 방재산업 소외"], ["소화용수", "산간지역 특성상 소화용수 절대부족"], ["주변환경", "방화선 구축 미흡, 소방차 진입로 부족, 특수방재시설(수막설비·방수총 등) 부족"], ["예산·인력", "국가예산 부족, 전문인력 미양성, 방염처리 미흡, 자체소방대 부재로 초기진압 취약"]] }, { type:"callout", text:"➡ 개선대책: ① 문화재 화재대응지침서 마련·연1회 정기점검 ② 수막설비·미분무소화설비·방수총·적외선센서·불꽃감지기 등 소방시설 설치 ③ 방화수림대(완충지대 15~20m) 조성 ④ 자연낙차 이용 시 옥외소화전 0.25MPa 이상, 25m 이상 높이에서 20분 이상 방사 가능한 수원 확보 ⑤ 상시점검체계·방재연구센터 설립." }] },
    { title:"6. 방화(放火) 판정", blocks:[{ type:"p", text:"화재란 사람의 의도에 반하거나 고의로 발생하는 연소현상으로 소화가 필요한 것을 말한다. 방화란 사람이 고의로 불을 질러 건조물·기타 물건을 소훼하는 행위다. 형태는 단일방화(인간관계에 기인)·연속방화(동일인이 2건 이상, 세상에 대한 불만 발산)·계획적 방화(알리바이 조작 등 실화 위장)로 구분되며, 원인은 보험사기·범죄은폐·선동목적·보복이 대표적이다." }, { type:"p", text:"화재는 리스크(위험)가 항상 싱글(단일 발화점)이라는 전제 하에 소방시설을 병렬 설계하지만, 방화는 여러 곳에서 동시다발적으로 발화할 수 있다는 점이 결정적 차이다." }, { type:"table", headers:["구분", "내용"], rows:[["3대 전제조건", "① 발화부위가 여러 곳(연소경로가 부자연스러움) ② 이상연소 잔해·연소흔적(가연물을 모아놓거나 인화성 물질 잔류) ③ 다른 발화원이 완전히 배제됨"], ["10대 요건", "① 여러곳에서 발화(발화점 2개소 이상) ② 연소촉진물의 존재 ③ 화재현장에 타 범죄 증거 ④ 화재발생위치(점화원·가연물 없는 장소) ⑤ 사고 화재원인 부존재 ⑥ 귀중품 사전 반출 ⑦ 수선중 화재(경쟁업자 방화 가능성) ⑧ 화재 이전 건물 손상(연소확대 통로 마련) ⑨ 같은 건물·장소 2차 화재 ⑩ 휴일·주말 화재(발견 지체)"]] }] }
  ],
  cards:[
    { q:"전기화재의 2대 발화 메커니즘은 무엇이며 각각의 관계식은?", a:"① 줄열에 의한 발화: 도체에 전류가 흐르면 저항이 증가하고 줄열이 발생해 발열이 방열을 초과하면 발화한다(H=I²Rt). ② 스파크·아크에 의한 발화: 전기회로 개폐·퓨즈용단·단락 시 스파크·아크가 점화원으로 작용한다(공기 절연내력 3kV/mm 이상에서 방전)." },
    { q:"저항 R=ρL/A 식에서 전기화재 발생과의 관계는?", a:"도체 길이가 길고 단면적이 작을수록 저항이 커지며, 반단선·접촉불량 등으로 실제 흐르는 단면적이 줄면 저항이 증가해 발열량이 늘어나 정격을 벗어난 과열·발화로 이어진다." },
    { q:"단락 시 케이블이 소손되지 않는 허용 도체단면적 공식은?", a:"S(mm²) = I√t / 134 (I: 단락전류[A], t: 단락지속시간[s])." },
    { q:"비닐절연전선은 정격전류의 몇 %에서 피복 변질·변형, 몇 %에서 용융되는가?", a:"200~300%에서 피복 변질·변형, 500~600%에서 용융되며 이때 선간 단락으로 1,000A 이상의 대전류가 흐를 수 있다." },
    { q:"트래킹 현상과 탄화현상의 차이는?", a:"트래킹은 전원극 사이 이물질(먼지·수분 등)이 축적되어 도전로가 형성되면서 단락·발열로 발화하는 현상이고, 탄화현상은 목재·고무 등 절연체가 스파크·아크의 고온에 의해 미소전류로 서서히 탄화되며 도전로가 형성되는 현상(그래파이트 현상)이다." },
    { q:"아산화동 발열현상의 메커니즘은?", a:"접속부 접촉불량으로 접촉면적이 감소해 접촉저항이 증가하고 줄열이 발생하며, 고온의 동체가 산화되어 아산화동(Cu2O)으로 증식하면서 열축적이 가속화되어 발화에 이르는 현상." },
    { q:"은이동 현상의 발생 메커니즘과 대책은?", a:"직류전압이 인가된 상태에서 절연물에 수분이 부착되면 은(Ag) 이온이 이동하여 도전로가 형성되고 발화에 이른다. 대책은 습도관리와 산화환원가스 제거이다." },
    { q:"반단선 현상이란?", a:"코드 내부의 전선이 완전히 끊어지지 않고 끊어짐과 이어짐을 반복하는 현상으로, 접촉 시마다 줄열과 스파크가 반복되어 아산화동이 생성되고 발화로 이어질 수 있다." },
    { q:"지락이란 무엇이며 전기적으로 어떻게 설명되는가?", a:"1상의 단락전류가 대지(중성)를 통해 흐르는 현상이다. 대지는 전기적으로 중성이므로, 전선이 끊어져 대지와 접촉하면 대전류가 대지로 흘러가는데 이를 지락전류라 한다." },
    { q:"전기화재 대책을 줄열/스파크로 나눠 요약하면(배차포기 암기법)?", a:"줄열 대책: 정격용량 이상 배선설계(단락전류 이상 배선설계 S=I√t/134), 차단기(누전·과전류·배선용), 규격용량 퓨즈, 유지관리. 스파크 대책: 방폭기기, 접지 및 본딩(정전기 대책과 동일한 맥락)." },
    { q:"피뢰설비의 설치대상은?", a:"낙뢰 우려가 있거나 높이 20m 이상인 건축물·공작물, 화약류·위험물 저장·취급시설(지정수량 10배 이상), TV 수신안테나, 낙뢰·강전류 접촉 우려가 있는 전기통신설비 등." },
    { q:"피뢰설비의 4대 구성요소는?", a:"① 수뢰부시스템(피뢰침·망상도체·가공지선으로 낙뢰 포착) ② 인하도선시스템(뇌격전류를 접지시스템으로 흘림) ③ 환상도체(인하도선을 서로 접속하는 루프) ④ 접지시스템(뇌격전류를 대지로 방류)." },
    { q:"수뢰부 설계법 3가지와 각각의 적용범위는?", a:"① 보호각법: 60m 이하, 간단한 형상 건물 ② 회전구체법: 60m 초과·복잡한 건물, 측뢰 보호 가능 ③ 메쉬법: 60m 초과 건물의 굴곡없는 평지붕·경사지붕, 측뢰 보호 가능." },
    { q:"보호각법의 원리는?", a:"건물 높이가 높아질수록 보호각을 줄여(즉, 보호범위를 좁혀) 피뢰침을 더 많이·더 높이 설치하는 방식이다." },
    { q:"제전기의 정의와 도체·부도체별 정전기 대책은?", a:"제전이란 대전된 정전기를 이온으로 중화시키는 작업이다. 도체는 접지·본딩으로, 부도체는 대전방지제 또는 제전기(전압인가식·자기방전식·방사선식)로 대책을 세운다." },
    { q:"전압인가식 제전기의 장단점은?", a:"장점: 약 7,000V의 고전압으로 이온을 강제 발생시켜 제전능력이 크고 제전범위가 넓다. 단점: 고전압 자체가 점화원으로 작용할 위험이 있어 별도 접지가 필요하고 취급이 복잡하다." },
    { q:"자기방전식 제전기의 원리와 장단점은?", a:"대전물체 자체의 정전기(정전유도 현상)를 이용해 반대극성 이온을 발생시킨다. 전원·접지가 불필요해 안전하고 방폭지역에도 적용 가능하지만, 제전능력·범위는 전압인가식보다 좁다." },
    { q:"액티브(active) 방식과 패시브(passive) 방식의 일반적 차이는?", a:"액티브 방식(전원 투입으로 작동)은 효과가 크지만 전원 차단 시 작동하지 않아 신뢰성이 낮고, 패시브 방식(전원 없이 항상 작동)은 효과는 상대적으로 낮지만 신뢰성이 높다. 이 개념은 제전기, 배연(자연배연 vs 기계배연), 피난수단(계단 vs 승강기) 등에 반복 적용된다." },
    { q:"목조 건축물 화재의 온도별 진행단계는?", a:"100℃ 수분 증발 → 220~260℃ 목재 열분해(가연성가스 발생) → 300~350℃ 탄화 종료 → 420~470℃ 원격(자연) 발화." },
    { q:"국내 목조문화재 방재의 주요 문제점 5가지는?", a:"① 소화기 사용 시 문화재 훼손 우려 및 노후 소화설비 ② CCTV 등 감시시설 미흡 ③ 산간지역 소화용수 부족 ④ 방화선·소방차 진입로·특수방재시설 부족 ⑤ 방재예산·전문인력 부족, 자체소방대 부재." },
    { q:"방화(放火)와 실화(과실화재)를 구분하는 근본 전제는?", a:"화재는 원인이 되는 위험(리스크)이 항상 단일(싱글)하다는 전제 하에 소방설계(병렬설계)를 하지만, 방화는 여러 곳에서 동시다발적으로 발화할 수 있다는 점에서 실화와 근본적으로 다르다." },
    { q:"방화 판정의 3대 전제조건은?", a:"① 발화부위가 여러 곳(연소경로가 부자연스러움) ② 이상연소 잔해·연소흔적(가연물을 모아놓았거나 인화성물질 잔류) ③ 다른 발화원이 완전히 배제됨." },
    { q:"방화 판정의 10대 요건 중 대표적인 것들을 나열하면?", a:"여러곳 발화, 연소촉진물 존재, 화재현장의 타 범죄증거, 가연물·점화원이 없는 위치에서의 발화, 사고원인 부존재, 귀중품 사전반출, 수선중 화재, 화재이전 건물손상, 같은 장소 2차 화재, 휴일·주말 화재." }
  ]
};

    { q:"[88회] 숭례문 화재 등 목조 문화재 건축물을 화재로부터 보호하기 위한 대책의 개념을 정립하고 방화 및 소방시스템을 설명하시오.", a:"방재시설 노후화·감시시설 미흡·소화용수 부족 등 문제점을 짚고, 수막설비·미분무소화설비·방수총·적외선센서·CCTV 설치, 방화수림대·방화선 구축, 자체소방대 편성, 상시점검체계를 대책으로 제시한다." },
    { q:"[103회] 목조문화재 소방시설에서 방수총설비 설치기준을 설명하시오.", a:"방수총은 문화재 주변에 방수구역을 조성해 화재 확산을 저지하는 설비로, 방수사거리·수원량·방수압력 기준에 맞춰 설치하며 원격 또는 자동 조작이 가능하도록 구성한다." },
    { q:"[61회] 방화의 특성과 예방대책에 대하여 기술하시오.", a:"방화는 단일방화·연속방화·계획적 방화로 구분되며 경제적 이익·범죄은폐·선동목적·보복이 주요 원인이다. 예방대책은 CCTV 등 감시강화, 취약지역 순찰, 화재감지시스템 조기경보, 법적 처벌 강화 등이다." },
    { q:"[85회/98회] 용접 작업 시 화재방지 및 작업자 안전을 위한 조치사항을 설명하시오.", a:"화기작업 허가제 운영, 불티비산방지막 설치, 소화기·소화전 비치, 화재감시자 상주(작업반경 11m 이내 가연물 존재 시), 밀폐공간 환기·산소농도 측정, 작업 후 현장 재점검 등을 시행한다." },
    { q:"[119회] 용접·용단 작업 시 화재 및 폭발사고의 비산불티 특징, 발화원인물질별 사고유형, 예방 안전대책을 설명하시오.", a:"비산불티는 고온(1,000℃ 이상)이며 최대 11m까지 비산할 수 있다. 목재분진·유증기·인화성물질이 발화원인물질이 되며, 대책은 화기작업 허가제, 불티비산방지막, 화재감시자 배치, 가연물 사전제거이다." },
    { q:"[129회] 용접용단작업의 비산불티 특성 및 비산거리 영향요소, 화재폭발 주요 발생원인과 대책을 설명하시오.", a:"영향요소는 풍속·작업각도·모재두께이며, 발생원인은 주변 가연물 존재·환기 부족·밀폐공간 가스체류이다. 대책은 화재감시자 배치기준(작업반경 11m)에 따른 감시, 불티비산방지막, 임시소방시설 설치이다." },
    { q:"[136회] 건설 현장 전기용접작업의 화재 예방을 위한 작업 전·중·후 안전조치 사항 및 임시소방시설의 종류를 설명하시오.", a:"작업 전 화기작업허가·가연물 제거, 작업 중 화재감시자 상주·불티비산방지막 설치, 작업 후 현장 재점검을 실시하며, 임시소방시설은 소화기·간이소화장치·비상경보장치·간이피난유도선 등이다." }

    { q:"건축법상 '거실'의 정의는?", a:"사람이 먹고 마시고 자고 일하며 활동하는 모든 공간(주거·업무·오락 등)을 말하며, 화재는 대부분 거실에서 발생하기 때문에 내장재의 불연화·난연화·방염이 중요하다." },
    { q:"내장재 불연화·난연화·방염의 관계는?", a:"내장재는 가급적 불연재·준불연재로 하고, 그렇지 않은 건축자재는 방염처리를 하여 화재 시 연소확대를 최소화한다." },
    { q:"계단(패시브)과 승강기(액티브) 중 신뢰도가 높은 피난수단은?", a:"계단이다. 전원이 끊겨도 이용 가능한 패시브 수단이므로 신뢰도가 높은 반면, 승강기는 전원에 의존하는 액티브 수단으로 정전 시 피난이 중단될 위험이 있어 원칙적으로 피난용도로 권장되지 않는다(단, 피난용승강기는 예외적으로 정전에도 작동)." },
    { q:"완전한 피난이란 어떤 상태를 말하는가?", a:"건물 내에서 어떤 수단으로든 아래로 내려와 건축물 밖으로 나가서, 공공의 도로 등 안전한 장소까지 도달한 상태를 말한다. 단순히 건물 내 안전구역에 머무는 것은 완전한 피난이 아니다." },
    { q:"이동식 피난과 체류식(머무름) 피난의 차이는?", a:"이동식 피난은 계단·승강기 등을 통해 건물 밖으로 완전히 빠져나가는 것이고, 체류식 피난은 건물이 커서 한 번에 대피가 불가능할 때 피난안전구역·대피공간 등에 임시로 머무르며 구조를 기다리는 것이다." },
    { q:"피난안전구역과 대피공간에 요구되는 기본 성능은?", a:"내화구조로 구획되고 출입문은 방화문을 사용하여, 외부(같은 층·건물)가 화염에 휩싸이더라도 내부는 안전하게 유지되어야 한다." },
    { q:"화재가혹도의 정의는?", a:"화재가 건축물이나 수용물에 입히는 피해의 정도로, 최고온도와 최고온도가 지속되는 시간의 곱(그래프의 적분값)으로 나타낸다." },
    { q:"화재가혹도의 2가지 구성요소는 각각 무엇에 의해 결정되는가?", a:"최고온도(화재강도)는 열축적률(연소열·비표면적·공기공급, 즉 '연비공단')에 의해, 지속시간(화재하중)은 화재실의 가연물 양과 환기요소에 의해 결정된다." },
    { q:"목조건축물과 철근콘크리트 건축물의 화재가혹도 양상 차이는?", a:"목조건축물은 공기유통이 원활해 상대적으로 고온·단시간형(약 30분 내 전소) 화재를 보이고, 철근콘크리트 건축물은 상대적으로 저온이지만 장시간 지속되는 화재 양상을 보인다. 어느 쪽 가혹도가 큰지는 온도-시간 그래프의 면적을 적분해 비교해야 한다." },
    { q:"화재가혹도와 내화성능·내화시간의 관계는?", a:"건축부재는 해당 화재가혹도(최고온도의 지속구간)를 견뎌내야 하며, 이 견디는 성능을 내화성능, 견딜 수 있는 시간을 내화시간이라 한다." },
    { q:"패시브적 내화 성능과 액티브적 소방설비의 상호관계는?", a:"패시브(내화구조·방화구획)는 플래시오버 이후 화재를 견디도록 하중지지력·차염성·차열성을 확보하는 것이고, 액티브(소화·경보설비)는 화재를 조기에 감지·제어·진압해 화재가혹도 자체를 낮춰줌으로써 패시브의 부담을 줄여주는 상호보완적 역할을 한다." },
    { q:"11층 이상 건축물에서 방화구획 기준이 강화되는 이유는?", a:"10층 이하는 바닥면적 1,000㎡마다 구획하지만 11층 이상은 200㎡로 구획기준이 강화되어, 위험도가 급격히 높아지는 층수 기준으로 취급되기 때문이다(다만 자동식소화설비 설치 시 완화 가능)." },
    { q:"건축만으로 넓은 공간(스카이라운지 등)을 만들 수 없는 이유와 대안은?", a:"방화구획 기준을 지키면 넓은 공간을 확보할 수 없기 때문에, 소방설비(스프링클러 등)로 화재를 제어할 수 있다는 전제 하에 건축과 소방이 협력하여 완화 규정을 적용받는 방식으로 넓은 공간을 실현한다." },
    { q:"용접·용단 작업의 3대 유해위험성은?", a:"① 화재·폭발(주변 가연물에 고열·불꽃 점화) ② 감전 ③ 인체 질식·독성(용접흄·유해가스·소음·고열, 밀폐공간에서 산소결핍)." }
  ]
};

    { q:"[138회] 화재가혹도(Fire severity)와 화재저항(Fire Resistance)의 개념을 정의하고, 구성요소가 소화설비 설계·내화저항 평가에 미치는 영향을 설명하시오.", a:"화재가혹도(최고온도×지속시간)가 클수록 요구되는 내화시간·소화설비의 방수량·방수시간이 늘어난다. 화재저항(내화성능)은 이 가혹도에 맞춰 설계되어야 하며, 표준시간-가열온도곡선을 이용한 내화시험으로 평가한다." }

    { q:"대부분의 철근콘크리트 구획실 화재가 환기지배형으로 전이되는 이유는?", a:"초기 진압에 실패하면 산소가 부족해지고 가연성가스는 축적되는데, 실이 밀폐 구조라 공기유입량(환기요소)이 화재 진행을 지배하게 되기 때문이다. 반면 통기가 좋은 목조건축물은 환기지배형으로 전이되지 않고 빠르게 전소될 수 있다." },

    { q:"연기유동 원인 중 가장 큰 비중을 차지하는 2가지는?", a:"연돌효과(항상 상존하는 온도차에 의한 압력차, 가장 큰 원인)와 피스톤효과(승강기 운행 시 발생, 두 번째로 큰 원인)이다." },
    { q:"부력에 의한 연기유동의 메커니즘은?", a:"화재로 연소가스의 온도가 상승하면 밀도(ρ=PM/RT)가 낮아져 부력이 발생하고, 이로 인해 고온의 연기가 상부로 이동하게 된다." },
    { q:"공기조화설비(공조)가 연기유동의 원인이 되는 이유는?", a:"공조설비는 일반적으로 외기를 약 30%만 도입하고 나머지 약 70%는 실내공기를 순환시키므로, 화재 시 연동정지가 되지 않으면 화재실의 연기가 완전히 배출되지 않고 덕트를 통해 다른 실로 전파될 수 있다." },
    { q:"바람에 의한 건물 내 압력분포 형성 메커니즘은?", a:"바람이 건물에 부딪히면 풍상측은 정압(양압)이, 풍하측·건물 상부는 유속 증가로 부압(동압↑, 정압↓)이 형성되며, 이 압력차가 건물 내부 연기의 이동방향에 영향을 준다(동압=½ρV²)." },

    { q:"연돌효과로 인한 대표적 문제점 3가지는?", a:"① 화염·연기의 급속 확산(화재확산) ② 계단실·부속실 오염에 의한 피난 안전성 저해 ③ 압력차로 인한 출입문 개폐 장애(피난문이 눌려 안 열리거나 급격히 열림)." },

    { q:"제연설비(부속실 급기가압)에서 연돌효과 때문에 풍량 조절이 어려운 이유는?", a:"중성대를 기준으로 위층과 아래층에서 나가려는 압력의 크기가 서로 다르기 때문에, 모든 층에서 동일한 40Pa 차압을 유지하려면 층별로 급배기 풍량을 다르게 세밀히 제어해야 하는데 이를 균일하게 상쇄시키는 것이 어렵다." },

    { q:"연돌효과의 건축측면 대책은?", a:"외벽 기밀화, 출입구·상층부 개구부를 최소화, 1층 출입구에 방풍실(전실)을 설치해 문을 직렬화, 승강로·계단실 등 수직공간을 층별로 쪼닝(구획)하여 유효 높이(H)를 낮춘다." },

    { q:"초고층건축물의 피난안전구역이 연돌효과 대책과 연관되는 이유는?", a:"피난안전구역을 거쳐야만 특별피난계단이 상·하로 연결되도록 만들어 수직공간을 쪼닝함으로써, 연돌효과의 유효높이(H)를 층 단위로 나누어 압력차를 낮추는 역할을 겸하기 때문이다." },

    { q:"고층건축물에서 냉난방 목적으로 설치되는 방풍실이 연돌효과 방지 목적도 겸하는 이유는?", a:"원래 방풍실은 냉난방 기운(에너지) 손실을 막기 위한 설비이지만, 문을 두 겹(직렬)으로 만들어 틈새면적을 줄이는 효과가 있어 부수적으로 연돌효과에 의한 외기 유입도 저감시킨다." }

  notes:[
    { title:"1. 중성대의 개념과 높이", blocks:[{ type:"p", text:"실내외 온도차로 밀도차가 생기면 실내공기의 상부는 배출되려 하고 하부는 유입되려 한다. 천장쪽은 실내압력이 실외보다 높고 바닥쪽은 실외압력이 실내보다 높은데, 그 사이 실내외 정압이 같아지는(나가려는 힘과 들어오려는 힘이 상쇄되는) 지점을 중성대(Neutral Plane)라 한다." }, { type:"code", text:"실(구획실) 중성대 높이:  Hn = 실높이 × (연기온도)/(연기온도+공기온도)  [약칭: '아싸' 암기]\n건물 중성대 높이(개구부 면적비 함수):  Hn = f(A상부², A하부²)  → 개구부가 큰 쪽으로 중성대가 이동" }, { type:"callout", text:"➡ 중성대는 개구부가 있는 쪽, 개구부가 더 큰 쪽으로 이동한다. 연기온도가 높을수록 팽창력이 커져 중성대가 아래로 내려오며, 중성대가 낮아질수록(=중성대로부터 상부 높이 H가 커질수록) 상부에서 나가려는 압력분포가 커져 연돌효과가 강해진다." }] },
    { title:"2. 부속실 제연 차압 40Pa의 근거", blocks:[{ type:"p", text:"최악조건(화재실 온도 1,000℃, 초기온도 20℃, 중성대로부터의 높이 H=3m로 가정)에서 연돌효과 압력차를 계산하면 약 28Pa가 산출된다. 여기에 안전율을 더해 부속실 제연설비의 차압 기준을 40Pa로 정한 것이다." }, { type:"callout", text:"➡ 40Pa는 약 1.0332kgf/㎠(대기압, ≈101,325Pa) 대비 매우 작은 값(약 0.0004배)으로, 실제 문을 여닫는 데 필요한 힘(개방력 110N 이하 기준)에 비해 크지 않은 수준이다. 즉 연기가 밀고 나오는 압력 자체는 생각보다 크지 않다는 것이 핵심 포인트다." }] },
    { title:"3. 플래시오버 예측 공식", blocks:[{ type:"p", text:"플래시오버는 천장의 고온가스 축적→복사강도 증가→국부연소가 전실화재(순발연소)로 전이되는 현상이다. 연기층 온도 약 500~600℃, 바닥 복사수열량 약 20~40kW/㎡가 되면 플래시오버가 발생한다고 알려져 있다. 이를 예측하는 3대 공식은 다음과 같다." }, { type:"table", headers:["공식", "제안자", "특징"], rows:[["QFO = 610(hk·At·AoH0^0.5)^0.5", "맥카프리(McCaffrey)", "개구부 인자와 실 표면적을 이용, 계산문제에 자주 출제"], ["QFO ∝ 함수(At, Ao, H0)", "토마스(Thomas)", "전표면적·개구부 조건 기반 예측식"], ["QFO = f(개구부, 벽 열특성)", "바브라스카스(Babrauskas)", "개구부·벽체 열특성을 반영한 예측식"]] }, { type:"callout", text:"➡ 세 공식 모두 개구부가 클수록(A√H가 클수록) 플래시오버에 필요한 열방출률(QFO)이 커진다는 공통점이 있다 — 즉 개구부가 지나치게 크면 플래시오버가 일어나지 않는다는 결론으로 이어진다." }] },
    { title:"4. 백드래프트의 메커니즘과 대책", blocks:[{ type:"p", text:"백드래프트는 밀폐된 공간에서 불완전연소로 고농도의 가연성가스가 천장부에 충분히 축적(훈소상태, 산소만 부족)된 상태에서 갑자기 문을 열어 산소가 유입되면 폭발적으로 연소하는 현상이다. 발생조건은 ① 실내에 점화원 이상의 충분한 고온 축적 ② 다량의 가연성가스 축적(산소만 부족)이다." }, { type:"table", headers:["구분", "플래시오버", "백드래프트"], rows:[["산소 상태", "충분(연료지배형→환기지배형 전환 시점)", "부족(훈소, 불완전연소 상태)"], ["발생 원인", "천장 고온가스의 복사열 축적", "산소 유입에 따른 폭발적 연소"], ["연소 형태", "순발연소(전실 동시연소)", "폭발적 연소(충격파 동반 가능)"]] }, { type:"callout", text:"➡ 백드래프트 대책(암기: 개천화 폭격소환): 개구부 제한(가연물의 양 제한), 천정환기구를 문 개방 전에 먼저 열어 가연성가스 배출, 화재하중 저감(가연물 양 제한), 폭발력 억제(급격한 개방 자제, 서서히 개방), 격리(상층·인접구역 확대방지), 소화(개방과 동시에 방수), 환기(출입문 개방 전 천장 환기구 선개방)." }] },
    { title:"5. 방화구획 구성요소의 성능기준", blocks:[{ type:"p", text:"방화구획은 내화구조의 벽·바닥으로 구성되며, 벽·바닥(주요구조부)에는 하중지지력·차염성·차열성 3가지 성능이 모두 요구된다. 그러나 사람이 드나드는 방화문, 냉난방 풍도의 방화댐퍼, 넓은 개구부의 방화셔터는 구조적으로 하중을 지지할 수 없으므로 하중지지력은 요구하지 않되, 최소한 화염을 차단하는 차염성(또는 차염+차열성)을 요구한다." }, { type:"table", headers:["부재", "요구 성능", "등급 예시"], rows:[["내화구조 벽·바닥", "하중지지력+차염성+차열성", "1시간·2시간·3시간 내화"], ["일반 방화문", "차염성만(비차열)", "비차열 1시간(60분+ 방화문의 '비차열')"], ["체류공간(피난) 출입문", "차염성+차열성 모두 요구", "60분+(60분 플러스) 방화문 — 아파트 대피공간 출입문 등"], ["방화댐퍼·방화셔터", "차염성(가연물 근접 금지)", "비차열, 온도퓨즈(방화댐퍼) 또는 연기감지 연동(방화셔터)"]] }, { type:"callout", text:"➡ 뒷면에 가연물이 있을 것으로 예상되면 차열성까지, 뒷면에 가연물이 없을 것으로 예상되면 차염성(비차열)만 요구한다. 아파트 대피공간 출입문이 국내에서 유일하게 60분+(차열까지 요구하는) 방화문 기준을 적용받는 대표 사례다." }] }
  ],
  cards:[
    { q:"중성대(Neutral Plane)의 정의는?", a:"건물 또는 구획실의 실내외 압력분포에서, 천장쪽 실내우세 압력과 바닥쪽 실외우세 압력이 서로 상쇄되어 실내외 정압이 같아지는 지점." },
    { q:"중성대는 개구부 조건에 따라 어느 쪽으로 이동하는가?", a:"개구부가 있는 쪽, 개구부의 면적이 더 큰 쪽으로 이동한다(상부 개구부가 크면 중성대는 위로, 하부 개구부가 크면 중성대는 아래로 이동)." },
    { q:"연기온도가 높아질수록 중성대의 위치는 어떻게 변하는가?", a:"연기의 팽창력이 커져 중성대가 아래로 내려온다(분모인 '공기온도+연기온도'가 커지므로 실 중성대 높이 산정식에서 비율이 낮아지는 효과)." },
    { q:"중성대가 낮아지면(=중성대로부터의 높이 H가 커지면) 연돌효과는 어떻게 변하는가?", a:"압력차(ΔP=3460×(1/To−1/Ti)×H)가 H에 비례하므로, 중성대가 낮아져 상부 유효높이 H가 커지면 연돌효과(나가려는 압력분포)가 더욱 커진다." },
    { q:"부속실 제연설비의 40Pa 차압 기준은 어떻게 산출되었는가?", a:"화재실 온도 1,000℃, 초기온도 20℃, 중성대로부터의 높이 3m(층고)를 최악조건으로 가정해 계산한 압력차가 약 28Pa이며, 여기에 안전율을 더해 40Pa로 설정하였다." },
    { q:"40Pa라는 차압이 실제로 큰 힘인가?", a:"대기압(약101,325Pa) 대비 매우 작은 값으로, 문 개방력 기준(110N 이하)에 준하는 수준이며 사람이 감당하기 어려운 큰 힘은 아니다." },
    { q:"플래시오버 발생 시점의 대표적 물리량 기준은?", a:"연기층(가스층) 온도 약 500~600℃, 바닥면 복사수열량 약 20~40kW/㎡가 되면 인접 가연물이 원격발화하여 전실화재(플래시오버)로 전이된다." },
    { q:"플래시오버를 예측하는 3대 공식(제안자)은?", a:"맥카프리(McCaffrey), 토마스(Thomas), 바브라스카스(Babrauskas)의 공식이다. 모두 개구부 조건(A√H)과 실의 표면적을 이용해 플래시오버에 필요한 열방출률(QFO)을 계산한다." },
    { q:"세 플래시오버 예측공식의 공통적 시사점은?", a:"개구부가 클수록(환기요소 A√H가 클수록) 플래시오버에 필요한 열방출률이 커지므로, 개구부가 지나치게 크면 화재실 온도상승이 제한되어 플래시오버가 일어나지 않는다는 점이다." },
    { q:"백드래프트(Back Draft)의 정의와 발생 메커니즘은?", a:"밀폐공간에서 불완전연소로 다량의 가연성가스가 고온상태로 축적되어 있다가(산소만 부족), 갑작스런 개구부 개방으로 산소가 유입되면 폭발적으로 연소하는 현상." },
    { q:"백드래프트 발생을 위한 2가지 필요조건은?", a:"① 점화원(자연발화)으로 작용할 만큼 충분한 고온 축적 ② 산소만 부족한 상태로 다량의 가연성가스가 축적되어 있을 것." },
    { q:"플래시오버와 백드래프트의 핵심 차이는?", a:"플래시오버는 산소가 충분한 상태에서 천장 고온가스의 복사열 축적으로 전실이 동시 연소하는 현상이고, 백드래프트는 산소가 부족한 상태에서 갑작스런 산소 유입으로 폭발적 연소가 일어나는 현상이다." },
    { q:"백드래프트 방지대책 6가지(암기: 개천화 폭격소환)는?", a:"① 개구부 제한(가연물 양 제한) ② 천정환기구를 문 개방 전에 먼저 열어 가스 배출 ③ 화재하중 저감(가연물 관리, 자동식소화설비 설치) ④ 폭발력 억제(급격한 개방 자제) ⑤ 상층·인접구역으로 확대 방지(격리) ⑥ 개방과 동시에 즉시 소화(방수)." },
    { q:"방화구획은 원칙적으로 무엇으로 구성되며 어떤 성능이 요구되는가?", a:"내화구조의 벽·바닥으로 구성되며, 하중지지력·차염성·차열성 3가지 성능이 모두 요구된다." },
    { q:"방화문에 왜 하중지지력을 요구하지 않는가?", a:"방화문은 사람의 출입을 위해 뚫은 개구부에 설치되는 것으로, 상부 하중을 지지하도록 요구하면 너무 두껍고 무거워져 문으로서 기능(개폐)을 할 수 없기 때문에 하중지지력은 요구하지 않고 최소한 차염성만 요구한다." },
    { q:"'비차열' 방화문과 '60분+(60분 플러스)' 방화문의 차이는?", a:"비차열 방화문은 화염 차단(차염성)만 요구되는 일반 방화문이고, 60분+ 방화문은 차염성뿐 아니라 차열성까지 요구되는 방화문으로, 뒷면(반대쪽)에 사람이 머무는 공간(예: 아파트 대피공간)이 있을 때 적용된다." },
    { q:"방화구획 구성요소 중 벽 대신 사용되는 부재들은?", a:"사람 출입용 방화문, 배관·전선 관통부의 내화충전재(Fire Stop), 냉난방 풍도의 방화댐퍼, 넓은 개구부의 방화셔터가 원래 벽·바닥의 역할을 대신한다." },
    { q:"방화댐퍼·방화셔터에 요구되는 성능은?", a:"하중지지력은 요구하지 않고 차염성(화염 차단)을 요구하며, 방화셔터가 내려오는 경로에 가연물이 있으면 소방법상 불법이다." },
    { q:"건축물 화재가 옆 실·옆 층으로 확산되었다면 무엇을 의미하는가?", a:"내화구조체(방화구획 구성요소)들이 자신의 성능(하중지지력·차염성·차열성)을 제대로 발휘하지 못했음을 의미하며, 일반적으로 건물 벽 자체가 무너지는 경우는 드물기 때문에 관통부·방화문·댐퍼 등 취약부의 성능 미달이 원인인 경우가 대부분이다." },
    { q:"연기층 축적과 백드래프트의 관계에서 '온도는 충분한데 불이 안 붙는' 이유는?", a:"환기지배형화재가 지속되면 산소가 부족해 가연성가스가 열분해는 되었지만 연소(산화)되지 못하고 고온상태로 계속 축적되기 때문이며, 산소만 공급되면 즉시 발화 가능한 조건을 갖추고 있는 상태이다." },
    { q:"방화구획의 기본 원칙(층별·면적별)은 어떻게 강화되는가?", a:"10층 이하 건축물은 넓은 면적(1,000㎡ 등) 기준으로 구획하지만 11층 이상은 200㎡ 등으로 기준이 대폭 강화되며, 이는 고층으로 갈수록 화재위험도가 급격히 커진다는 판단에 근거한다." }
  ]
};

  label:"중성대·플래시오버·백드래프트·방화구획 기출",
  sub:"중성대 개념과 높이 계산, 플래시오버·백드래프트의 차이와 예측·방지대책, 방화구획의 설치기준·완화규정 (5주차 5강 관련, 소방기술사 기출 분석.xlsm 기준)",
  notes:[
    { title:"답안 작성 전략", blocks:[{ type:"p", text:"플래시오버·백드래프트 비교문제는 반드시 산소 상태(충분/부족)를 기준으로 대비시켜 서술한다. 중성대·연돌효과 계산문제는 절대온도 환산과 ΔP=3460×(1/To−1/Ti)×H 공식을 정확히 적용해야 한다. 방화구획은 대상·기준·완화규정 3단 구조로 암기한다." }] }

  cards:[
    { q:"[114회] Normal Stack Effect와 Reverse Stack Effect에 의한 기류이동을 비교하고, 화재가 중성대 하부와 상부에 발생했을 때 각각의 연기흐름을 설명하시오.", a:"Normal Stack Effect(실내가 더 따뜻함)는 상승기류, Reverse(실외가 더 따뜻함)는 하강기류가 지배적이다. 화재가 중성대 하부에서 발생하면 연기가 상승하며 중성대를 통과해 상층부로 확산되고, 중성대 상부에서 발생하면 연기가 국소적으로 정체되거나 완만하게 확산된다." },
    { q:"[114회] 환기구가 있는 구획실의 화재 시, 연기 축진(Smoke Filling) 과정과 중성대 형성에 따른 화재실의 공기 및 연기유동을 3단계로 구분하여 설명하시오.", a:"① 초기: 연기가 천장부터 축적되며 중성대가 서서히 하강 ② 중기: 중성대가 안정화되며 상부는 유출, 하부는 유입되는 정상상태 형성 ③ 후기(환기지배형 전이): 산소부족으로 연소속도가 개구부에 지배받으며 중성대 위치가 재조정된다." },
    { q:"[116회] 계단실의 상·하부 개구부 면적, 유량계수, 높이, 내외기 온도 조건에서 중성대 높이 계산식 유도, 개구부 중심위치 차압 계산, 질량유량 계산, 차압 분포 도시, 개구부 면적변화에 따른 중성대 위치변화를 설명하시오.", a:"중성대 높이는 상·하부 개구부 면적비의 함수로 유도되며(개구부가 큰 쪽으로 중성대 이동), 각 개구부 중심에서의 차압은 ΔP=3460×(1/To−1/Ti)×(H−Hn)로 계산하고, 질량유량은 m=Cd·ρ·A·√(2ΔP/ρ)로 산정한다." },
    { q:"[132회] 중성대 개념과 연돌효과 관계, 중성대 높이 관계식 유도를 설명하시오.", a:"중성대는 실내외 정압이 같아지는 지점이며, 중성대로부터의 높이(H)가 클수록 연돌효과 압력차(ΔP=3460×(1/To−1/Ti)H)가 커진다. 개구부 면적비에 따라 중성대 위치가 결정되므로 개구부 설계가 연돌효과 크기를 좌우한다." },
    { q:"[102회] 고층빌딩 계단실의 연돌효과를 상쇄시키는 풍속을 구하시오(Δp=0.71h[Pa], 계단실 수력지름 3.33m).", a:"연돌효과 압력(Δp=0.71h)과 동압(Δp=½ρV²)을 같다고 놓아 V=√(2Δp/ρ)로 상쇄풍속을 산출하며, 이는 제연설비의 방연풍속 설계 근거가 된다." },
    { q:"[62회/68회/77회] 플래시오버와 백드래프트의 차이점을 설명하시오.", a:"플래시오버는 산소가 충분한 상태에서 천장 고온가스의 복사열 축적으로 전실이 동시연소하는 현상(순발연소)이고, 백드래프트는 산소가 부족한(훈소) 상태에서 갑작스런 산소유입으로 폭발적 연소가 일어나는 현상이라는 점이 근본적 차이다." },
    { q:"[75회] 백드래프트(backdraft)의 방지대책을 간단히 쓰시오.", a:"개구부 제한, 천정환기구 선(先)개방을 통한 가스배출, 화재하중 저감, 급격한 개방 자제(폭발력 억제), 상층·인접구역 확대방지(격리), 개방과 동시 즉시 방수(소화) — '개천화 폭격소환'으로 암기." },
    { q:"[93회] 플래쉬오버(flashover)를 정의하고, 발화공간에서 flashover를 억제할 수 있는 인자들과 flashover 시간에 영향을 주는 인자들을 열거하시오.", a:"정의: 국부화재가 복사열 축적으로 전실화재로 전이되는 현상. 억제인자: 화재하중 저감, 내장재 불연화, 자동식소화설비. 시간영향인자: 화원의 크기, 개구부 조건(A√H), 실의 크기·형상, 내장재의 열특성(열관성)." },
    { q:"[100회] 가로·세로·높이 10m×10m×5m 구획실에서 6MW 화재가 진행 중일 때, McCaffrey의 공식을 사용하여 플래시오버 발전 가능 여부를 판단하시오.", a:"QFO=610(hk·At·Ao√H0)^0.5 공식에 실의 표면적(At)과 개구부 조건(Ao, H0), 벽체 열특성(hk)을 대입해 계산한 QFO값과 주어진 화재크기(6MW)를 비교하여 화재크기가 QFO 이상이면 플래시오버로 발전한다고 판단한다." },
    { q:"[112회] 플래시오버(Flash Over)를 정의하고, 화원의 크기, 내장재료, 개구율과 플래시오버와의 관계를 설명하시오.", a:"화원이 클수록, 내장재가 가연성·저열관성일수록, 개구율(A√H)이 적정(과소·과대가 아닌)할수록 플래시오버 발생이 촉진된다. 개구부가 지나치게 작으면 산소부족으로, 지나치게 크면 열방산으로 플래시오버가 오히려 억제된다." },
    { q:"[134회] 플래시오버(Flash Over) 예측을 위한 계산식(3가지 이상)과 영향요소를 설명하시오.", a:"맥카프리(McCaffrey), 토마스(Thomas), 바브라스카스(Babrauskas) 공식이 대표적이며, 공통 영향요소는 실의 표면적, 개구부 면적·높이(환기요소), 벽체의 열전도특성(열관성)이다." },
    { q:"[137회] 구획실 화재에서 플래쉬오버(Flashover)를 예측하는 화재 수치모델링에 포함되는 요소를 설명하시오.", a:"열방출률(HRR) 곡선, 실의 형상·표면적, 개구부 조건, 내장재의 열물성(열전도율·비열·밀도), 환기조건 등을 포함하는 구역모델(Zone Model) 또는 전산유체역학(CFD) 모델을 활용한다." },
    { q:"[87회 계열] 구획화재에서 flash over와 back draft의 관계에 대해 5가지 이상 기술하시오.", a:"① 둘 다 구획화재의 특이현상 ② 플래시오버는 산소충분, 백드래프트는 산소부족 상태에서 발생 ③ 플래시오버는 성장기→최성기 전이, 백드래프트는 최성기 이후 감쇠기(훈소)에서 주로 발생 ④ 플래시오버는 화재확대, 백드래프트는 폭발적 연소(충격파 동반 가능) ⑤ 둘 다 개구부(산소) 조건이 핵심 변수." },
    { q:"[61회] 방화구획의 기준에 대하여 기술하시오.", a:"주요구조부가 내화구조인 건축물에서 층수·면적 기준(10층 이하 1,000㎡, 11층 이상 200㎡ 등)에 따라 바닥면적별·층별·용도별로 구획하며 자동식소화설비 설치 시 완화된다." },
    { q:"[96회] 건축부재내화시험방법(KS F 2257-1)에서 규정하고 있는 내화성능기준 및 방화구획 완화 적용기준을 설명하시오.", a:"내화성능기준은 하중지지력·차염성·차열성을 표준시간-가열온도곡선에 따라 측정하며, 방화구획은 스프링클러 등 자동식소화설비 설치 시 구획면적을 최대 3배까지 완화 적용할 수 있다." },
    { q:"[112회] 건축물에서 방화구획 시공 시 사전확인 사항에 대하여 설명하시오.", a:"주요구조부의 내화구조 인정 여부, 방화문·방화댐퍼·내화충전재의 성능인정서 확인, 관통부 처리계획, 방화셔터 하강경로의 가연물 적치 여부 등을 시공 전 확인한다." },
    { q:"[127회] 제연풍도가 방화구획을 통과할 경우 고려할 사항을 설명하시오.", a:"방화구획을 관통하는 풍도에는 방화댐퍼를 설치하여 화재 시 자동으로 폐쇄되도록 하고, 관통부 틈새는 내화충전재로 마감하여 방화구획의 하중지지력·차염성·차열성이 저하되지 않도록 해야 한다." }
  ]
};

  notes:[
    { title:"1. 방화구획의 목적과 구성요소", blocks:[{ type:"p", text:"방화구획은 건축물 내부에서 화재가 발생한 공간으로부터 다른 공간으로 화염이 확산되는 것을 방지하기 위해 내화구조의 벽·바닥으로 구획하는 것이다. 방화구획이 완전하게 형성되어 있고 각 구성요소가 자기 성능(하중지지력·차염성·차열성)을 정상적으로 발휘한다면, 화재는 플래시오버 이후에도 발화한 구획 내부에서 한정되고 다른 구획으로 넘어가지 않는다." }, { type:"p", text:"벽·바닥만으로 건물이 구성될 수는 없으므로, 사람이 드나드는 곳에는 방화문, 배관·전선이 지나가는 곳에는 관통부 내화충전, 냉난방 풍도가 지나가는 곳에는 방화댐퍼, 넓은 공간이라 벽을 세우지 못하는 곳에는 자동방화셔터를 설치해 벽·바닥의 역할을 대신하게 한다." }, { type:"table", headers:["구획해야 할 장소", "이유"], rows:[["소방시설(수신기·펌프실·송풍기실 등)", "화재 시에도 정상 작동해야 하는 설비가 화재 피해를 입으면 안 됨"], ["가스계 약제 저장실", "소화약제 저장실 자체가 불타면 정작 소화에 사용할 수 없게 됨"], ["피난·인명보호가 필요한 공간", "화재로부터 재실자를 보호해야 하는 공간"]] }, { type:"callout", text:"➡ 건물 내부에서 화재가 확산되었다는 것은 결국 방화구획 구성요소(벽·바닥·방화문·댐퍼·셔터·관통부충전)가 제 역할(하중지지력·차염성·차열성)을 하지 못했다는 의미다." }] },
    { title:"2. 방화구획 설치기준 (면적·층별)", blocks:[{ type:"p", text:"건축물의 피난·방화구조 등의 기준에 관한 규칙에 따라 내화구조 또는 불연재료로 된 건축물은 다음 기준에 따라 바닥면적별로 구획한다. 10층 이하 층은 1,000㎡마다, 11층 이상 층은 200㎡마다 구획하며 자동식소화설비(스프링클러 등)를 설치한 경우 3배까지 완화된다." }, { type:"table", headers:["구분", "기본 기준", "자동식소화설비 설치 시", "비고"], rows:[["10층 이하", "1,000㎡ 마다", "3,000㎡ 마다(3배)", "매 층마다 수직 구획"], ["11층 이상(내장재 불연재료 아님)", "200㎡ 마다", "600㎡ 마다(3배)", "화재위험도가 높아 기준 대폭 강화"], ["11층 이상(내장재 불연재료)", "500㎡ 마다", "1,500㎡ 마다(3배)", "내장재가 불연재료면 완화"]] }, { type:"p", text:"필로티 및 이와 비슷한 구조로 주차장 용도로 사용하는 부분은 다른 부분과 반드시 구획해야 한다. 또한 층마다 구획하는 것이 원칙이며(수직방향 구획), 각 층 내에서는 위 표의 면적 기준(수평방향 구획)이 함께 적용된다." }, { type:"code", text:"암기 이미지화: 10층 기준선 아래=1,000㎡ / 위(11층~)=200㎡\n불연내장재면 200→500㎡, 자동식소화설비 있으면 항상 ×3배" }] },
    { title:"3. 방화문·관통부·방화댐퍼·자동방화셔터·하향식 피난구", blocks:[{ type:"p", text:"방화구획을 구성하는 개구부·관통부 처리 기준은 다음과 같다." }, { type:"table", headers:["구성요소", "기준 요지"], rows:[["방화문", "60분+방화문 또는 60분방화문 사용, 항상 닫힌 상태 유지 또는 연기·불꽃 감지 시 자동폐쇄(불가하면 온도감지 자동폐쇄)"], ["관통부(급수관·배전관·전선 등)", "내화충전성능이 인정된 구조로 메움(내화채움구조)"], ["방화댐퍼", "냉난방 풍도가 방화구획을 관통하는 경우 적합한 댐퍼 설치, 화재 시 연기·불꽃 감지로 자동폐쇄(주방 등은 온도감지 가능)"], ["자동방화셔터", "피난 가능한 60분+/60분 방화문으로부터 3m 이내 별도 설치, 불꽃·연기 감지 시 일부폐쇄(재형 경계벽 역할), 열 감지 시 완전폐쇄"], ["하향식 피난구", "덮개는 비차열 1시간 이상, 개구부 직경 60cm 이상(약칭: 덮개아이경조사)"]] }, { type:"callout", text:"➡ 자동방화셔터가 연기·불꽃을 감지하면 일부만 떨어뜨리는 이유는 재형 경계벽 역할을 하여 연기의 급격한 이동을 막고 제연설비가 작동할 시간을 벌어주기 위함이며, 열을 감지하면 이미 피난이 끝난 시점이므로 완전폐쇄하여 화염 확산을 차단한다." }] },
    { title:"4. 방화구획 설치 제외·완화 조건 (암기: 문제갹주단일)", blocks:[{ type:"p", text:"다음 각 호에 해당하는 건축물의 부분은 방화구획 규정을 적용하지 않거나 완화 적용한다. 앞머리를 따서 반복 암기하는 것이 효율적이다." }, { type:"ul", items:["① 문화·집회·종교·운동시설 등 시선 확보를 위해 불가피한 부분", "② 물품 제조·가공·보관·운반을 위해 고정식 대형기기 설치가 불가피한 부분(=연소할 우려가 있는 개구부)", "③ 계단실·복도·승강기의 승강로 등", "④ 최상층 또는 피난층의 회의장·강당·스카이라운지 등 피난안전구역으로 사용하기 위해 불가피한 부분", "⑤ 복층형 공동주택의 세대 간 층별 바닥 부분", "⑥ 주요구조부가 내화구조·불연재료인 주차장·단독주택·교정시설·군사시설 등", "⑦ 1층과 2층의 일부를 동일 용도로 사용하면서 다른 부분과 구획되어 있는 부분"] }, { type:"callout", text:"➡ 암기법: '문제갹(=②) 주(=계단실)단일' 등 자신만의 두문자를 만들어 여러 번 반복하며 앞머리로 떠올리는 훈련을 한다. 눈으로만 봐서는 답안을 쓸 수 없고, 직접 써봐야 인출이 된다." }] },
    { title:"5. 창고시설의 개구부 완화 및 공동주택 대피공간", blocks:[{ type:"p", text:"창고시설 중 방화구획을 적용하지 않거나 완화 적용하는 부분에는 개구부·비개구부 구분에 따라 추가 설비를 설치해야 한다: 개구부는 수막을 형성하는 설비, 개구부가 아닌 부분(벽 자체가 없는 대공간)은 화재를 조기 진화할 수 있는 스프링클러(ESFR 등)를 설치한다." }, { type:"p", text:"공동주택(아파트) 4층 이상 층에서 각 세대가 직통계단을 2개 이상 사용할 수 없는 경우(계단형 아파트) 발코니에 인접세대 공동 또는 세대별 대피공간을 1개 이상 설치해야 한다. 대피공간은 바깥공기와 접하고 실내 다른 부분과 방화구획되어야 하며, 바닥면적은 공동설치 시 3㎡, 세대별 설치 시 2㎡ 이상이어야 한다." }, { type:"table", headers:["대피공간 면제 조건", "내용"], rows:[["경계벽 파괴 용이", "인접세대와 경계벽이 파괴하기 쉬운 경량구조인 경우"], ["인접세대 피난구", "경계벽에 피난구를 설치한 경우"], ["하향식 피난구", "발코니 바닥에 하향식 피난구를 설치한 경우"], ["동일 성능 인정", "중앙건축위원회 심의를 거쳐 동일 이상 성능이 인정된 구조·시설을 설치한 경우"]] }, { type:"callout", text:"➡ 요양병원·정신병원·장애인시설 등 자력피난이 어려운 시설은 계단 대신 각 층별 별도 구획된 대피공간, 노대(외부 콘크리트 구조물)에 접한 거실, 또는 연결통로·경사로를 설치해 수평 피난을 유도한다." }] }
  ],
  cards:[
    { q:"방화구획의 근본 목적은 무엇인가?", a:"화재가 발생한 구획으로부터 다른 구획(공간)으로 화염(및 열·연기)이 확산되는 것을 방지하는 것으로, 플래시오버 이후까지도 화재를 발화 구획 내로 한정시켜야 한다." },
    { q:"방화구획이 완전할 때 화재는 어떻게 진행되는가?", a:"구성요소(벽·바닥의 하중지지력·차염성·차열성)가 정상 발휘되면 화재는 발화한 한 공간 안에서 시작되고 끝나며 다른 구획으로 넘어가지 않는다." },
    { q:"방화구획을 반드시 해야 하는 대표적 장소 3가지는?", a:"① 수신기·펌프실·송풍기실 등 소방시설이 설치된 곳 ② 가스계 소화약제 저장실 ③ 화재로부터 사람이 보호되어야 하는 공간." },
    { q:"10층 이하 층의 방화구획 기준 면적과 자동식소화설비 설치 시 완화 면적은?", a:"기본 1,000㎡ 마다 구획하며, 자동식소화설비(스프링클러 등) 설치 시 3배인 3,000㎡ 마다로 완화된다." },
    { q:"11층 이상 층의 방화구획 기준 면적은(내장재 조건별)?", a:"기본 200㎡ 마다 구획하되, 내부 마감을 불연재료로 한 경우 500㎡까지 완화되며, 자동식소화설비를 설치하면 각각 3배(600㎡, 1,500㎡)까지 완화된다." },
    { q:"필로티 등을 주차장으로 사용하는 경우 방화구획 원칙은?", a:"그 부분은 다른 부분과 반드시 구획해야 한다." },
    { q:"방화문의 기본 요구사항은?", a:"60분+방화문 또는 60분방화문을 사용하며, 언제나 닫힌 상태를 유지하거나 화재로 인한 연기·불꽃을 감지해 자동으로 닫히는 구조여야 한다(불가한 경우 온도감지로 자동폐쇄 가능)." },
    { q:"방화구획 관통부(급수관·배전관·전선 등)는 어떻게 처리해야 하는가?", a:"내화충전성능이 인정된 구조(내화채움구조)로 관통부의 틈을 메워야 하며, 벽과 벽, 벽과 바닥, 방화구획과 외벽 사이 접합부의 틈도 동일하게 처리한다." },
    { q:"냉난방 풍도가 방화구획을 관통할 때의 처리 기준은?", a:"적합한 방화댐퍼를 설치해야 하며, 화재로 인한 연기·불꽃을 감지해 자동으로 닫히는 구조로 한다(다만 반도체공장 등 풍도 주위에 스프링클러 설치 시 예외, 주방 등 상시 연기 발생부는 온도감지로 폐쇄 가능)." },
    { q:"자동방화셔터의 설치 위치 기준은?", a:"피난이 가능한 60분+방화문 또는 60분방화문으로부터 3m 이내에 별도로 설치해야 한다." },
    { q:"자동방화셔터가 불꽃·연기 감지 시와 열 감지 시 작동이 다른 이유는?", a:"불꽃·연기 감지 시에는 일부만 폐쇄되어 재형 경계벽 역할(연기 이동 지연, 제연설비 작동 여건 확보)을 하고, 열을 감지한 시점은 이미 피난이 끝났어야 하는 시점이므로 완전 폐쇄하여 화염 확산을 차단한다." },
    { q:"하향식 피난구의 핵심 성능 기준(약칭 덮개아이경조사)을 설명하라.", a:"덮개(비차열 1시간 이상 내화성능), 개구부(직경 60cm 이상, 아래층에서 위층 개구부를 열 수 없음), 이격(상하층 간 15cm 이상), 경보(덮개 개방 시 경보음), 조명(예비전원에 의한 조명설비), 사다리(아래층 바닥면으로부터 50cm 이하까지 내려오는 길이)." },
    { q:"피난구 개구부를 60cm(또는 50cm 내접원)로 잡는 이유는?", a:"일반적인 성인이 무리 없이 통과할 수 있는 최소 크기로, 무창층 판정기준(지름 50cm 원 내접)과 같은 맥락의 기준이다." },
    { q:"창고시설에서 방화구획이 완화·제외되는 개구부의 화재안전기준은?", a:"개구부에는 화재안전기준을 충족하는 설비로서 수막을 형성해 화재확산을 방지하는 설비를 설치하고, 개구부가 아닌 부분(벽 자체가 없는 부분)에는 화재를 조기에 진화할 수 있도록 설계된 스프링클러(ESFR 등)를 설치한다." },
    { q:"건축법상 방화구획 규정의 적용 대상은?", a:"주요구조부가 내화구조 또는 불연재료로 된 건축물로서 연면적이 1,000㎡를 넘는 건축물은 방화구획을 해야 한다." },

    { q:"30분방화문이 허용되는 위치는?", a:"특별피난계단의 부속실이 먼저 방재 성능을 커버하고 있는 계단실 출입문에 한해 허용되며, 부속실이 없는 일반 피난계단 출입문에는 사용할 수 없다." },

    { q:"방화문 내화시험(차염성)에서 판정하는 4가지 항목은?", a:"① 면패드 착화 여부 ② 6mm 균열게이지 관통 후 150mm 이상 이동 여부 ③ 25mm 균열게이지 관통 여부 ④ 이면에 10초 이상 지속되는 화염 유무 — 모두 기준을 만족해야 차염성이 있다고 판정한다." },
    { q:"방화문 내화시험(차열성)의 온도 판정기준은?", a:"이면(비가열면) 평균온도가 초기온도보다 140K를 초과 상승하지 않고, 최고온도가 초기온도보다 180K를 초과 상승하지 않아야 한다(문틀 설치 열전대는 360K 기준)." },
    { q:"방화문 내화시험은 표준시간-가열온도곡선의 무엇을 근거로 하는가?", a:"KS F 2257-1(내화시험방법)에 따른 표준시간-가열온도곡선으로 한쪽 면을 표준시간에 맞춰 가열하며 시간에 따른 온도상승을 재현한다." },
    { q:"방화문의 차연성시험은 내화시험과 목적이 어떻게 다른가?", a:"내화(가열)시험은 화염·열의 차단 성능(차염성·차열성)을 보는 반면, 차연성시험은 문을 닫은 상태에서 실제 연기(공기) 누설량을 측정해 연기 차단 성능을 평가한다." },
    { q:"방화문 차연성시험을 양쪽 방향 모두 측정하는 이유는?", a:"화재실에서 복도로 연기가 새는 경우와, 반대로 복도에 찬 연기가 실내로 유입되는 경우를 모두 막아야 하기 때문에 방향을 바꿔가며 측정한다." },
    { q:"방화문 차연성시험에서 문을 10회 개폐하는 이유는?", a:"제조사가 누설을 줄이기 위해 틈새를 없애면 문이 열리지 않을 수 있으므로, 실제로 원활하게 개폐되는지 작동 이상 유무를 먼저 확인하기 위함이다." },
    { q:"자동방화셔터를 설치할 수 있는 위치 요건은?", a:"피난이 가능한 60분+방화문 또는 60분방화문으로부터 3m 이내에 별도로 설치해야 한다." },
    { q:"자동방화셔터에 반드시 설치해야 하는 감지기는?", a:"불꽃감지기 또는 연기감지기 중 하나, 그리고 열감지기를 함께 설치해야 한다." },
    { q:"자동방화셔터가 불꽃·연기 감지 시 일부만 폐쇄하는 이유는?", a:"완전 폐쇄 시 아직 피난 중인 사람들이 당황할 수 있으므로, 재형 경계벽 역할로 연기의 급격한 이동을 지연시키고 제연설비가 작동할 여건을 확보하기 위함이다." },
    { q:"자동방화셔터 상부에 틈새가 있을 경우 어떻게 처리해야 하는가?", a:"상층 바닥에 직접 닿지 않아 틈새가 생기면 방화구획에 준하여 처리해야 하며, 내화충전구조로 메우거나 벽에 완전히 밀착시켜 연기·화염의 이동 통로가 되지 않도록 해야 한다." },
    { q:"자동방화셔터의 성능시험은 어떤 방법을 따르는가?", a:"방화문과 동일하게 표준시간-가열온도곡선으로 가열하는 내화시험을 통해 차염성을 확인하며, 시험체가 3m×3m를 초과하면 가열로 규격상 3m×3m까지만 시험한다." },
    { q:"방화문·방화셔터 뒤에 가연물을 적치했을 때의 문제는 법의 결함인가?", a:"아니다. 비차열이라는 성능 자체가 열차단을 요구하지 않는 것이므로, 뒤편에 가연물을 두면 복사열로 화염이 전파될 수 있는 것은 법의 문제가 아니라 뒷면에 물건을 적치한 관리상의 문제로 봐야 한다." }
  ]
};

    { q:"방화댐퍼 방연시험의 압력조건과 측정 방식은?", a:"시험체를 압력상자에 부착하고 닫은 상태에서 전후 압력차 10, 20, 30, 50Pa 조건으로 누설량(통기량)을 측정하며, 기류방향을 바꿔가며 3회 실시한다." },
    { q:"방화댐퍼의 방연 성능 판정 기준값은?", a:"20℃, 20Pa 조건에서 통기량이 5㎥/㎡·min 이하일 것." },
    { q:"연소할 우려가 있는 개구부의 정의는?", a:"방화구획을 관통하여 물품을 이송하기 위한 컨베이어·에스컬레이터 또는 이와 유사한 시설의 주위로서 방화구획을 할 수 없는 부분(방화구획 완화조건 중 물품 제조·가공·운반의 고정식 대형기기 설치 불가피 부분과 동일 대상)." },
    { q:"연소할 우려가 있는 개구부에 스프링클러를 설치할 때의 헤드 배치 기준은?", a:"개구부 상하좌우에 2.5m 간격(2.5m 미만이면 중앙에 1개)으로 설치하며, 개구부 내측면으로부터 직선거리 15cm 이하로 설치한다." },
    { q:"통행에 지장이 있는 경우 스프링클러 완화 기준은?", a:"개구부 상부·측면에 1.2m 간격으로 설치할 수 있으며, 이는 개구부 폭이 9m 이하인 경우에만 허용된다." },
    { q:"스프링클러 대신 드렌처설비를 설치할 때의 기준은?", a:"개구부 위측에 2.5m마다 설치하며, 제어밸브는 바닥에서 0.8~1.5m 높이, 수원은 설치개수×1.6㎥(헤드 1개당 80L/min×20분), 방수압력 0.1MPa 이상, 방수량 80L/min 이상이다." },
    { q:"개구부인 경우와 개구부가 아닌 경우(벽 자체가 없는 경우)의 창고시설 설비 기준 차이는?", a:"개구부(막힌 부분이 일부 있는 경우)는 화재안전기준에 따라 수막을 형성하는 설비를 설치하고, 개구부가 아닌 부분(벽이 아예 없는 대공간)은 화재를 조기에 진화할 수 있는 스프링클러(ESFR 등, 반드시 ESFR로 한정하지 않음)를 설치한다." },
    { q:"'연소할 우려가 있는 개구부'와 '연소할 우려가 있는 부분'은 어떻게 다른가?", a:"'연소할 우려가 있는 개구부'는 방화구획 내 물품이송시설 주위로 구획을 할 수 없는 부분을 말하고, '연소할 우려가 있는 부분'은 인접 대지경계선·도로중심선 등으로부터 1층 3m, 2층 이상 5m 이내에 있는 건축물의 부분을 말하는 전혀 다른 개념이다." },
    { q:"연소할 우려가 있는 부분의 거리 기준은(층별)?", a:"1층은 인접 대지경계선·외벽 중심선으로부터 3m 이내, 2층 이상은 5m 이내에 있는 건축물의 각 부분이다(동간 최소거리는 각각 6m, 10m)." },
    { q:"연소할 우려가 있는 부분이 주로 적용되는 건축물은?", a:"주요구조부가 목조 등으로 되어 화재가 쉽게 옮겨붙을 수 있는 건축물(특히 연면적 1,000㎡ 이상의 대규모 목적건축물)이며, 철근콘크리트조 등 불연 건축물은 대상이 아니다." },
    { q:"방화지구 내 창문 설치 기준은?", a:"인접대지경계선에 접하는 외벽의 창문 등 연소할 우려가 있는 부분에는 60분+/60분/30분 방화문을 설치하거나 드렌처설비를 설치해야 한다." },
    { q:"방화지구 내 환기구멍의 처리 기준은?", a:"불연재료로 된 방화커버 또는 그물눈 2mm 이하인 금속망을 설치해야 한다." },
    { q:"방화지구 내 대규모 목적건축물(연면적 1,000㎡ 이상)의 외벽·지붕 기준은?", a:"창문뿐 아니라 외벽 및 처마는 방화구조로, 지붕은 불연재료로 시공해야 한다." },
    { q:"소방 관련 법령이 원칙적으로 소급적용되지 않는 이유는?", a:"기존 건축물 전체에 새 기준을 소급 적용할 경우 기계실 등 설치공간이 없는 건물까지 전면 재시공이 필요해 막대한 사회적 비용이 발생하기 때문이며, 예외적으로 일부 대상만 소급적용된다." }
  ]
};

const CONCEPT_DECK_6WK_4GANG = {
  id: "concept-6wk-4gang",
