    { q:"가스계소화설비에서 전역방출방식이 필요한 이유는?", a:"국소 침투로는 완전 소화가 어려우므로 방호구역 전체를 약제로 채워야 하며, 이를 위해 방호구역의 밀폐성이 매우 중요하다." },
    { q:"설계농도유지시간(Soaking Time)의 정의는?", a:"약제를 방사해 설계농도에 도달한 뒤, 재발화가 일어나지 않는 완전한 소화를 달성할 때까지 설계농도를 유지해야 하는 시간이다." },
    { q:"가스계소화설비를 물 대신 사용하는 대표적 대상 화재는?", a:"물을 직접 방사할 수 없는 B급(유류)·C급(전기) 화재에 주로 적용한다." },
    { q:"스프링클러 설비에서 물의 방사속도와 연소속도의 관계는?", a:"약제(물)의 방사속도가 연소 확산속도보다 반드시 커야 불을 끌 수 있으며, 방사속도가 작으면 화재가 계속 확산되어 진화가 불가능하다." }

};

    { q:"[80회] 원자력발전소의 화재방호 특성을 기술하고, 화재위험도 분석 절차를 설명하시오.", a:"원전 화재방호는 심층방호 개념을 반영해 방화지역별 원자로 손상 가능성을 최소화하도록 설계한다. 화재위험도분석(FHA)은 화재 발생 시 원자로 안전정지 능력을 확보하고 있는지, 안전정지에 필요한 심층방호 요소들의 적합성을 확인하고 문제점·대책을 도출하는 절차로 진행된다." },
    { q:"[108회] 원자력발전소의 심층화재방어(Fire defense-in-depth)를 간단히 설명하고, 일반산업계와 원자력산업계의 화재방호 전략상 차이점을 3개 이상 기술하시오.", a:"심층화재방어는 물리적 다중방벽과 다단계 방어로 방사성 물질의 외부 유출을 방지하는 개념이다. 차이점은 ①목표(인명재산보호 vs 원자로 안전정지·방사능유출방지) ②설계기준(화재하중 기반 vs 결정론적+확률론적 안전성평가 병행) ③평가체계(단순 소방시설 성능 vs FHA·SSA·PSA 3단계 평가) 등이다." },
    { q:"[115회] 원자력발전소의 심층화재방어의 개념에 대하여 설명하시오.", a:"화재 예방, 조기 감지·소화, 화재영향 완화(방사성 물질 유출 방지)를 위해 물리적 5중 방호벽과 5단계 다단계 방어체계를 결합한 방호개념이다." },
    { q:"[132회] 원자력발전소 화재심층방어(Defense-In-Depth)에 대해 설명하시오.", a:"원전 화재심층방어는 물리적 다중방벽(핵연료-피복관-압력용기-격납용기 내벽-외벽)과 5단계 다단계 방어(예방-제어감시-사고제외-사고확대방지-소외비상대응)로 방사성 물질의 외부 유출을 방지하는 방호개념이다." },
    { q:"[65회] 스프링클러헤드의 소화성능에 영향을 주는 RTI, RDD, ADD의 정의 및 상호관계를 설명하시오.", a:"RTI(반응시간지수)는 헤드의 열감도(작동 속도)를, ADD(실제전달밀도)는 헤드가 실제로 화재에 전달하는 물의 양을, RDD(필요전달밀도)는 화재를 진압하는 데 필요한 물의 양을 의미한다. ADD가 RDD보다 크거나 같아야(ADD≥RDD) 소화(진압)가 성립하며, RTI가 작을수록 조기작동해 소화 성공 가능성이 높아진다." },
    { q:"[65회] 미분무(water mist)설비의 기술동향, 장·단점, system 구성요소에 대하여 논하시오.", a:"미분무는 물방울 지름 1000μm 이하로 살수해 기상냉각·질식·복사열차단 효과를 내는 설비다. 장점은 소량의 물로 소화가 가능해 수손피해가 적고 전기·유류화재에도 적용 가능한 점, 단점은 화재규모가 크면 진압력이 부족할 수 있는 점이다. 구성요소는 저장용기·가압장치·배관·노즐(1·2·3등급)이다." },
    { q:"[65회] 물분무소화설비에서 물 방사 시 20℃ 물 1mol이 전부 수증기로 되었다. 수증기의 부피와 팽창비를 구하시오.", a:"이상기체상태방정식(PV=nRT)을 이용해 100℃·1atm 기준 수증기 부피를 구하고, 물(액체) 1mol의 부피(약 18mL)와 비교하면 약 1,700배 팽창한다. 이 팽창력으로 주변 산소를 희석시켜 질식소화 효과를 낸다." },
    { q:"[66회] 화재확대방지시스템 중 워터커튼의 노즐 종류 및 그 특징을 설명하시오.", a:"워터커튼은 개방형 노즐을 연속 배치해 물의 막(수막)을 형성, 복사열 차단 및 화재확대 방지 목적으로 사용하며 드렌처설비 등에 적용된다." },
    { q:"[71회] 전역방출방식의 가스계소화설비에서 설계농도유지시간을 설명하고, 국내 소방기술기준규칙상 개구부에 따른 추가 약제가산과의 관련성·문제점·대안을 설명하시오.", a:"설계농도유지시간은 약제 방사 후 재발화가 일어나지 않도록 설계농도를 유지해야 하는 시간이다. 개구부가 있으면 약제가 누출되어 설계농도 유지가 어려우므로 개구부 면적에 비례한 추가 약제량을 가산하는데, 이는 실제 누출속도와 무관하게 일률적으로 산정되는 문제가 있어 Door Fan Test 등 정밀 누설시험을 병행하는 것이 대안으로 제시된다." },
    { q:"[71회] 가스계소화설비(전역방출방식)의 과압배출구 설계 시 고려사항을 설명하시오.", a:"약제 방출 시 급격한 압력상승으로 인한 방호구역 벽체·개구부 손상을 방지하기 위해 과압배출구(Pressure Relief Vent)를 설치하며, 최대허용압력과 방출유량을 고려해 배출구 면적을 산정한다." },
    { q:"[84회] 건축물 내부(enclosure)의 기체누설 정도를 판단하기 위한 도어팬테스트(Door Fan Test)의 실시목적, 총누출면적, 하강경계층, 최소높이, 유지시간을 설명하시오.", a:"목적은 방호구역의 밀폐성능(약제 보유능력)을 확인하는 것이며, 총누출면적(누설틈새의 합)을 측정해 설계농도유지시간을 예측한다. 약제 방사 후 상부의 청정공기층이 하강하는 경계면(하강경계층)이 방호대상물의 최소높이 아래로 내려가지 않아야 하며, 그 유지시간이 기준시간 이상이어야 적합 판정된다." },
    { q:"[61회] Soaking time에 대하여 설명하시오.", a:"가스계소화설비에서 약제 방사 후 설계농도를 유지해 재발화가 일어나지 않는 완전한 소화상태를 확보하는 데 필요한 시간으로, 도어팬테스트를 통해 검증한다." },
    { q:"[63회] Twin agent system에 대하여 설명하시오.", a:"포(foam)와 분말(dry chemical) 등 서로 다른 두 종류의 소화약제를 동시 또는 순차 방출하여 소화 상승효과(냉각+질식+부촉매)를 얻는 시스템으로, 유류저장탱크·항공기격납고 등에 활용된다." },
    { q:"[68회] 가스계 소화설비의 배관 내 약제비중의 기준을 국내소방법규와 NFPA의 경우를 들어 설명하시오.", a:"배관 내 약제(액상)의 평균비중이 기준(국내 규정치)을 초과하지 않도록 배관 구경·저장용기 수량을 설계하며, NFPA는 별도의 이론적 비중 산정식을 통해 저압식/고압식 CO2 시스템별 배관설계기준을 제시한다." },
    { q:"[76회] 가스계 소화설비에서 소화약제 방출 시 각 분사노즐로부터 방사되는 가스량이 불균등하게 되는 원인 및 설계 시 고려사항을 설명하시오.", a:"원인은 배관 분기·마찰손실 차이로 인한 압력강하 불균형이며, 설계 시에는 관경·분기점 배치를 균등화하고 유량계산 프로그램으로 각 노즐의 방출량 편차를 5% 이내로 관리해야 한다." },
    { q:"[60회] 저압식 이산화탄소소화시스템을 고압식과 비교하여 설명하시오.", a:"저압식은 -18℃ 저온·2.1MPa 저압으로 대용량 저장(냉동기 필요)이 가능해 대형 방호구역에 적합하고, 고압식은 상온·5.3MPa 고압으로 저장용기가 다수 필요하지만 설비가 단순하다." }
  ]
};

    { title:"1. 단위계와 차원", blocks:[{ type:"p", text:"단위는 어떤 물리량의 대소를 비교하기 위한 기준이다. 절대단위(MKS 단위계, SI 단위)는 길이(m)·질량(kg)·시간(s)을 기본단위로 하며, 힘은 뉴턴(N)을 사용한다. 공학단위는 길이(m)·중량(kgf)·시간(s)을 기본단위로 사용하는 체계로, 질량 대신 중량(force)을 기준으로 삼는다." }, { type:"table", headers:["물리량", "정의", "단위 유도"], rows:[["힘(N)", "1kg의 질량에 1m/s²의 가속도를 만드는 힘", "N = kg·m/s² (F=ma)"], ["에너지·일(J)", "힘을 주어 거리를 이동시킨 물리량(힘×거리)", "J = N·m"], ["일률(W)", "단위시간당 한 일의 양", "W = J/s"], ["압력(Pa)", "면에 수직으로 작용하는 단위면적당 힘", "Pa = N/m²"]] }, { type:"p", text:"1kgf(1kg중)는 지구 중력가속도(9.8m/s²)를 곱한 힘이므로 1kgf = 9.8N이다. SI 기본단위는 길이(m)·질량(kg)·시간(s)·전류(A)·온도(K)·물질량(mol)·광도(cd)로 구성된다(약칭: MKS 광양운전)." }, { type:"h3", text:"차원(MLT계)" }, { type:"p", text:"차원식은 물리량을 질량(M)·길이(L)·시간(T)의 지수승 조합으로 표현한 것이다. 어떤 수의 0차원 값은 1이므로 무차원수는 단위(차원)가 사라진 값이며, 물리현상을 단위변환 없이 빠르게 해석하기 위해 사용한다." }, { type:"table", headers:["물리량", "MLT 차원", "비고"], rows:[["속도(m/s)", "LT⁻¹", ""], ["힘(N=kg·m/s²)", "MLT⁻²", ""], ["압력(Pa=N/m²)", "ML⁻¹T⁻²", "힘의 차원(MLT⁻²)을 L²으로 나눔"], ["점성계수 μ(Pa·s)", "ML⁻¹T⁻¹", "전단응력(ML⁻¹T⁻²)×시간(T)"]] }] },
    { title:"2. 유체의 정의와 점성, 밀도·비중량", blocks:[{ type:"p", text:"유체는 어떤 힘(전단응력)에 의해 변형되기 쉬운 성질을 가진 액체·기체를 말하며, 정의상 전단응력하에서 연속적으로 변형되는 물질이다. 고체는 힘을 주면 형상을 유지한 채 이동하지만, 유체는 파이프 내에서 흐를 때 벽면과의 마찰로 인해 속도 기울기(속도구배)가 연속적으로 변하는 흐름을 형성한다." }, { type:"h3", text:"경계층과 전단응력" }, { type:"p", text:"유체가 고체 벽면 근처를 흐를 때 벽면과의 마찰력에 영향을 받는 영역을 경계층이라 하고, 그 바깥의 완전히 자유로운 영역을 자유흐름이라 한다. 경계층 내에서는 벽면에서 멀어질수록 마찰의 영향이 줄어들어 속도가 빨라지는 속도구배(du/dy)가 형성된다. 이 속도구배에 의해 유체 내부에는 흐름을 방해하는 전단응력(τ)이 발생한다." }, { type:"table", headers:["구분", "정의", "예"], rows:[["뉴턴유체", "속도구배(전단속도)가 변해도 점성계수(μ)가 일정한 유체", "물, 공기 등 대부분의 유체"], ["비뉴턴유체", "속도구배에 따라 점성계수가 변하는 유체", "혈액, 페인트, 타르 등"]] }, { type:"p", text:"점성이 클수록(끈적할수록) 전단응력이 크게 걸려 유체가 잘 흐르지 못하며, 이는 곧 마찰손실이 커진다는 의미다. 압축성 유무에 따라 압축성 유체(기체)·비압축성 유체(액체로 가정)로, 점도 유무에 따라 점성유체(실제유체)·비점성유체(이상화)로 구분한다." }, { type:"h3", text:"밀도·비중량·비체적·비중" }, { type:"table", headers:["물리량", "정의", "단위·값(물, 4℃)"], rows:[["밀도(ρ)", "단위체적당 질량", "kg/m³ — 물은 4℃에서 1,000kg/m³ (최대)"], ["비중량(γ)", "단위체적당 중량 = ρ·g", "N/m³ 또는 kgf/m³ — 물은 9,800N/m³(=1,000kgf/m³)"], ["비체적(v)", "단위질량당 체적(밀도의 역수)", "m³/kg"], ["비중(S)", "기준물질(물) 대비 밀도(또는 비중량)의 비율(무차원)", "물의 밀도·비중량을 기준으로 산출"]] }, { type:"callout", text:"➡ 단위 변환 문제는 감마(비중량)와 로(밀도)를 헷갈리지 않도록 γ=ρg 관계를 먼저 적어두고, 압력식의 단위(Pa=N/m² 또는 kgf/m²)에 맞춰 γ값(9,800 또는 1,000)을 선택해 대입한다." }] }
  ],
  cards:[
    { q:"절대단위(MKS)와 공학단위의 차이는?", a:"절대단위는 길이(m)·질량(kg)·시간(s)을 기본단위로 하며 힘을 N으로 표현하고, 공학단위는 길이(m)·중량(kgf)·시간(s)을 기본단위로 하여 중량(힘)을 기준으로 질량을 표현한다." },

    { q:"SI 기본단위 7가지는?", a:"길이(m)·질량(kg)·시간(s)·전류(A)·온도(K)·물질량(mol)·광도(cd)이다." },

    { q:"일률(W, 와트)의 정의는?", a:"단위시간당 한 일의 양으로, W = J/s이다." },
    { q:"압력(Pa)의 정의와 단위 유도는?", a:"면에 수직으로 작용하는 단위면적당 힘으로, Pa = N/m²이다." },

    { q:"유체의 정의는?", a:"전단응력하에서 연속적으로 변형되는 물질(고체가 아닌 액체·기체)을 말한다." },

    { q:"[109회] 임야화재의 연소과정을 3단계로 구분하여 설명하시오.", a:"①지표화: 지표의 낙엽·잔가지가 연소해 비교적 진화가 쉬움 ②수간화: 나무 줄기(수간)가 타올라 상방향으로 확산 ③수관화(Crown Fire): 나무 상단부가 불기둥을 이루며 연소, 복사열이 커 사람 접근이 어렵고 비화로 급속 확산된다." },
    { q:"[61회] 산림화재와 소화방법에 대하여 기술하시오.", a:"산림화재는 지표화·수간화·수관화 3단계로 진행되며, 지표화 단계는 사람이 직접 진화 가능하나 수관화 단계는 접근성이 떨어져 헬기 공중진화가 필요하다. 소화방법은 방화선(방화대) 구축, 인공강우, 맞불(역화) 등이 있다." },
    { q:"[77회] 산불의 형태 중 표면화재(surface fire)와 심부화재(crown fire)에 대하여 설명하시오.", a:"표면화재는 지표면의 낙엽·잡초 등이 낮게 연소하는 형태이고, 심부화재(수관화)는 나무 상단부까지 불이 옮아 붙어 불기둥을 형성하며 급속히 확산되는 형태로 진화 난이도가 훨씬 높다." },
    { q:"[98회] 산림지역 지표가연성물질의 종류와 산불양상에 대하여 설명하시오.", a:"지표가연성물질은 낙엽·마른풀·고사목·낙지 등이며, 이들의 함수율(습도)이 낮을수록 산불이 쉽게 발생하고 확산속도가 빨라진다." },
    { q:"[116회] 산불화재에서 Crown fire와 화학공정에서 Blow down을 설명하시오.", a:"Crown fire(수관화)는 나무 상단부가 불기둥을 이루며 연소하는 산불의 최종단계이고, Blow down은 화학플랜트에서 비상시 공정 내 가연성 물질을 안전한 곳으로 신속히 방출·감압하는 안전조치를 말한다." },
    { q:"[121회] 임야화재에서 대표적인 발화원인과 화재원인별 조사방법을 설명하시오.", a:"발화원인은 입산자 실화, 논·밭두렁 소각, 담뱃불, 방화 등이며, 조사방법은 발화지점의 탄화 형태·V자 패턴 분석, 목격자 진술, CCTV 확인 등을 종합해 판단한다." },
    { q:"[120회] 인체의 열 스트레스 조건에서 상대습도와 인내 한계시간과의 관계를 설명하시오.", a:"상대습도가 높을수록 땀의 증발이 어려워져 체온조절 능력이 저하되므로, 동일 온도에서도 상대습도가 높을수록 인체의 열 인내 한계시간이 짧아진다." },
    { q:"[94회] 100℃ 물 1g이 표준대기압 상태에서 100% 수증기로 증발하였을 때 체적을 계산하시오.", a:"이상기체상태방정식(PV=nRT)에 T=373K, P=101,325Pa, n=1/18mol을 대입하면 V≈1.7×10⁻³m³(약 1,700cc)이며, 액체 물 1g(1cc) 대비 약 1,700배 팽창한다." },
    { q:"[101회] 25℃, 0.85atm에서 산소의 밀도(g/L)를 구하시오(이상기체로 가정).", a:"PV=nRT에서 ρ=PM/RT (M:분자량 32g/mol)를 이용하면 ρ=(0.85×32)/(0.082×298)≈1.11g/L이다." },
    { q:"[108회] 어떤 기체가 이상기체 거동을 하기 위한 조건(가정)을 설명하고, 이상기체상태방정식 PV=nRT를 유도하시오.", a:"가정은 ①분자 자체의 부피 무시 ②분자 간 인력·반발력 무시 ③분자운동은 무질서 ④분자 충돌은 완전탄성충돌 ⑤운동에너지는 절대온도에 비례이다. 보일의 법칙(V∝1/P)과 샤를의 법칙(V∝T)을 결합하고 아보가드로 법칙(V∝n)을 적용해 비례상수 R을 도입하면 PV=nRT가 유도된다." },
    { q:"[114회] 보일의 법칙과 샤를의 법칙을 비교하여 물질의 상태에 대한 물리적 의미를 설명하시오.", a:"보일의 법칙(온도 일정 시 부피∝1/압력)은 분자 간 충돌빈도 변화를, 샤를의 법칙(압력 일정 시 부피∝온도)은 분자운동에너지 증가에 따른 팽창을 나타낸다." },
    { q:"[122회] 이상기체 운동론의 5가지 가정과 보일·샤를·게이뤼삭의 법칙을 설명하시오.", a:"5가지 가정은 분자부피 무시·인력반발력 무시·무질서 운동·완전탄성충돌·운동에너지 절대온도 비례이다. 보일의 법칙(V∝1/P, 온도일정), 샤를의 법칙(V∝T, 압력일정), 게이뤼삭의 기체반응법칙(반응기체 부피 간 정수비 성립)이 이상기체상태방정식으로 통합된다." },
    { q:"[83회] 아보가드로의 법칙(Avogadro's Law)을 간단히 기술하시오.", a:"0℃, 1atm(STP)에서 모든 기체 1몰의 부피는 22.4L이며, 이때 분자의 개수는 6.023×10²³개(아보가드로수)로 동일하다는 법칙이다." },
    { q:"[79회] STP(표준온도압력상태)에서 1kmol의 공기 온도가 273℃로 증가한 경우 체적은 몇 배로 증가하는지 계산하시오.", a:"샤를의 법칙(V∝T)에 따라 절대온도비를 구하면 (273+273)/273=2배이므로 체적은 2배로 증가한다." },
    { q:"[123회] 열감지기의 동작원리 중 샤를의 법칙(Charles' law)을 활용한 감지기의 작동원리를 설명하시오.", a:"차동식 감지기(공기실식)는 화재 시 온도상승으로 공기실 내부 공기가 샤를의 법칙에 따라 팽창하며, 이 팽창압이 다이어프램을 밀어 접점을 접촉시켜 화재신호를 발생시킨다." }
  ]
};

  notes:[
    { title:"1. 연속방정식과 베르누이방정식", blocks:[{ type:"p", text:"연속방정식은 질량보존의 법칙으로, 배관 내 어느 지점에서나 단위시간당 유입 질량과 유출 질량이 같다는 원리다. 질량유량 ṁ = ρ₁A₁V₁ = ρ₂A₂V₂이며, 비압축성(밀도 변화 없음)일 경우 체적유량 Q = A₁V₁ = A₂V₂로 단순화된다(연속의 원리)." }, { type:"h3", text:"베르누이방정식(에너지보존의 법칙)" }, { type:"p", text:"베르누이방정식은 유체의 에너지보존 법칙으로, 유선을 따라 흐르는 정상류·비압축성·마찰이 없는 이상유체를 전제로 한다. 위치에너지(mgz)·운동에너지(½mV²)·압력에너지(PV)는 서로 변환되며 그 합은 일정하다." }, { type:"table", headers:["표현 형태", "식", "단위"], rows:[["에너지형", "½mV² + mgz + PV = const", "J"], ["수두형", "V²/2g + z + P/γ = const", "m (수두)"], ["압력형", "ρV²/2 + ρgz + P = const", "Pa"]] }, { type:"p", text:"실제 유체는 마찰손실이 존재하므로 두 지점 사이에 마찰손실수두(hL)를 더한 수정 베르누이방정식을 사용한다. 에너지선(전수두를 나타내는 선)은 마찰손실만큼 흐름 방향으로 낮아지며, 동수경사선은 에너지선에서 속도수두(V²/2g)만큼 아래에 위치한다 — 동수경사선의 기울기가 급할수록(유속이 빠를수록) 마찰손실이 커진다." }, { type:"h3", text:"토리첼리 정리" }, { type:"p", text:"수조 측면의 작은 구멍(오리피스)에서 유출되는 유체의 속도는 v = √(2gh)이며, 베르누이방정식에서 양쪽이 모두 대기압이고 수조가 커서 수위 하강속도를 무시할 수 있을 때 유도된다. 환기지배형 화재에서 개구부를 통한 공기 유입속도(V=0.5A√H 형태)도 이 토리첼리 원리에 기반한다." }] },
    { title:"2. 파스칼의 원리와 운동량방정식(노즐 반동력)", blocks:[{ type:"p", text:"파스칼의 원리는 밀폐된 공간의 유체에 압력을 가하면 그 압력이 모든 면에 동일하게 직각으로 작용한다는 원리다. F=PA 관계에서 단면적을 크게 하면 작은 압력으로도 큰 힘을 얻을 수 있다. 소방에서는 건식밸브의 클래퍼 설계에 응용되며, 수압이 작용하는 면적(A1)보다 공기압이 작용하는 면적(A2)을 크게 하여 상대적으로 낮은 공기압으로도 큰 수압을 지탱하도록 한다(공기압을 최소화해야 헤드 개방 시 클래퍼가 신속히 열림)." }, { type:"h3", text:"운동량방정식과 옥내소화전 노즐 반동력" }, { type:"p", text:"운동량방정식(ΣF = ρQΔV)은 연속방정식·베르누이방정식·뉴턴 제2법칙(F=ma)을 조합해 유도한다. 옥내소화전 노즐처럼 관경이 축소되며 대기 중으로 방사되는 경우, 1지점(관 내부)과 2지점(대기 방출부) 사이의 힘의 합이 운동량 변화와 같다는 관계로 반동력(Fx)을 구한다." }, { type:"ul", items:["기본식: P₁A₁ - P₂A₂ - Fx = ρQ(V₂-V₁) (P₂는 대기압이므로 게이지압 기준 0)", "P₁은 알 수 없으므로 베르누이방정식으로 치환, Q=A₁V₁=A₂V₂ 관계로 V를 면적·유량으로 치환해 최종 반동력식을 유도", "옥내소화전 노즐(13mm) 기준 관계자 1인이 감당 가능한 반발력은 20kgf 이하로 제한 → 방수압 0.7MPa 이하로 제한하는 근거가 됨"] }, { type:"p", text:"옥내소화전 방수압은 0.17~0.7MPa로 규정된다. 하한(0.17MPa)은 방수거리 확보(화점까지 도달)를 위한 것이고, 상한(0.7MPa)은 노즐 반동력이 관계자 1인이 감당 가능한 20kgf를 초과하지 않도록 하기 위한 것이다." }] },

  notes:[
    { title:"1. 그라쇼프수와 자연대류·강제대류 판별", blocks:[{ type:"p", text:"그라쇼프수(Gr)는 부력과 점성력의 비로 나타내는 무차원수로, 자연대류의 지배 정도를 판단하는 데 사용된다. 자연대류·강제대류·복합대류 중 어떤 대류로 열전달이 이루어지는지 판단할 때, 표면장력 구동류의 해석 등에도 활용된다." }, { type:"table", headers:["Gr/Re² 값", "지배 현상", "설명"], rows:[["10보다 클 때", "부력 지배 → 자연대류", "관성력은 무시되고 부력이 주된 역할, 뜨거운 물체 주변의 열기류가 부력으로 상승"], ["0.1보다 작을 때", "관성 지배 → 강제대류", "부력은 무시되고 관성이 지배적, 선풍기 등 외력에 의해 열기류가 강제로 이동"], ["1에 가까울 때", "복합대류", "관성과 부력이 함께 작용하여 열전달이 이루어짐"]] }, { type:"p", text:"표면장력 구동류(Marangoni 대류)는 액면 위 액체화재에서 고온부의 표면장력이 낮아지고 저온부의 표면장력이 높아지며 발생하는 순환류로, 대류 열전달의 동력원이 표면장력인 경우다." }] },
    { title:"2. 베나 콘트랙타와 경계층 박리", blocks:[{ type:"h3", text:"베나 콘트랙타(Vena Contracta)" }, { type:"p", text:"오리피스를 통과하는 유체는 유선을 따라 흐르며 단면적이 최소가 되는 지점을 지나는데, 이 지점을 베나 콘트랙타라 부른다. 오리피스 직경 d 기준으로 약 d/2 지점에서 나타나며, 이 지점에서 유속이 최대·동압이 최대·정압이 최소(0에 가까움)가 되어 동압이 곧 전압이 되는 공간이다." }, { type:"table", headers:["계수", "정의", "값"], rows:[["수축계수(축류계수) Ca", "오리피스 단면적에 대한 베나 콘트랙타 단면적의 비", "약 0.61~0.66"], ["속도계수 Cv", "베나 콘트랙타에서의 이론속도 대비 실제속도의 비", "약 0.99(거의 100%)"], ["유량계수 C", "C = Ca × Cv", "약 0.6~0.65(오리피스 유량계 신뢰도, 손실 35~40%를 보정)"]] }, { type:"p", text:"오리피스 유량식 Q=0.6597CD²√P에 속도계수(0.99)를 반영하면 옥내소화전 방수량 계산에 쓰이는 Q=0.653D²√P가 유도된다. 스프링클러 헤드의 K-factor도 K=0.6597CD²의 관계로, K값이 클수록 오리피스 구경이 커서 물방울 크기와 방사량(유량)이 커진다(표준형 헤드 K≈80, ESFR은 K≈200~360)." }, { type:"h3", text:"경계층 박리(Boundary Layer Separation)" }, { type:"p", text:"경계층은 유체가 점성의 영향을 받아 속도 변화가 생기는 얇은 층으로, 점성이 클수록 두꺼워지고 유속이 빠를수록 얇아진다. 유체가 물체 표면을 따라 흐르다가 속도 구배가 0이 되는 지점에서 역압력 구배가 발생해 표면으로부터 유체가 떨어져 나오는 현상이 경계층 박리다. 정체점(전압 형성) 이후 가속되며 정압이 감소하다가, 일정 각도(예: 원주형 물체는 90°) 지점부터 감속하며 정압이 회복(증가)되고, 이 역압력 구배 때문에 유선을 이탈한다." }] },
    { title:"3. 관의 급확대·급축소와 부차적 손실의 3가지 표현법", blocks:[{ type:"p", text:"경계층 박리는 관의 급확대·급축소, 밸브의 개폐도가 작을 때, 관내 유속이 급변할 때 발생하며, 이는 마찰손실 중 부차적 손실(주손실이 아닌 손실)로 나타난다. 부차적 손실이 커지면 마찰손실 증가 → 규정 방사압·방사량 미달 → 소화 실패로 이어질 수 있다." }, { type:"table", headers:["표현법", "방법", "비고"], rows:[["상당(등가) 배관길이법", "엘보·티 등 관부속을 직관에 상당하는 길이로 환산해 직관길이에 더함", "제조사가 제공하는 값(예: 90° 엘보=직관 몇 m 상당)"], ["손실계수법(K값)", "hL=K·V²/2g (다르시-바이스바흐 hL=f·L/D·V²/2g 형태)", "돌연확대 시 K=(1-A1/A2)², 손실계수는 레이놀즈수·장애물 크기 등에 영향받음"], ["유량계수법", "제조사가 부차적 손실을 계산해 제공하는 값", "펌프·밸브 등 제품별 데이터로 제공"]] }, { type:"callout", text:"➡ 부차적 손실 감소대책: 급격한 관경 변경 방지(편심 레듀샤 사용), 급확대·급축소·급격한 굴곡 지양, 버터플라이 밸브는 완전 개방해도 디스크 중심축이 유로에 남아 경계층 박리를 유발하므로 특정 위치(펌프 흡입측)에는 사용을 지양한다." }] }

  cards:[
    { q:"그라쇼프수(Gr)의 정의와 의미는?", a:"부력과 점성력의 비로, 자연대류가 열전달을 지배하는 정도를 판단하는 데 사용되는 무차원수다." },

    { q:"표면장력 구동류란?", a:"액면 위 액체화재에서 고온부는 표면장력이 낮아지고 저온부는 표면장력이 높아지며 발생하는 순환류로, 동력원이 표면장력인 대류 열전달이다." },
    { q:"베나 콘트랙타(Vena Contracta)란?", a:"오리피스를 통과한 유체가 유선을 따라 흐르며 단면적이 최소가 되는 지점으로, 유속이 최대·정압이 최소가 되는 공간이며 대략 오리피스 직경의 1/2 지점에서 나타난다." },
    { q:"수축계수(Ca)와 속도계수(Cv)의 정의는?", a:"수축계수는 오리피스 단면적 대비 베나 콘트랙타 단면적의 비(약 0.61~0.66), 속도계수는 이론속도 대비 실제속도의 비(약 0.99)이며 유량계수 C=Ca×Cv이다." },
    { q:"오리피스 유량계의 신뢰도가 떨어지는 이유는?", a:"베나 콘트랙타에서 유체 일부가 유선을 이탈해 맴돌아 유량 측정값이 실제보다 35~40% 손실되므로, 유량계수(0.6~0.65)로 보정해야 한다." },
    { q:"옥내소화전 방수량식 Q=0.653D²√P는 어떻게 유도되는가?", a:"오리피스 유량식 Q=0.6597CD²√P에 속도계수 Cv≈0.99를 반영해 정리하면 Q=0.653D²√P가 된다." },

    { q:"경계층(Boundary Layer)이란?", a:"유체가 물체 표면을 흐를 때 점성의 영향을 받아 속도변화가 생기는 얇은 층으로, 점성이 클수록 두꺼워지고 유속이 빠를수록 얇아진다." },
    { q:"경계층 박리(separation)의 발생 메커니즘은?", a:"유체가 물체 표면을 따라 흐르다 속도 구배가 0이 되는 지점에서 역압력 구배가 발생해, 유체가 표면으로부터 떨어져 나오는 현상이다." },
    { q:"경계층 박리가 발생하는 대표적 소방배관 상황 3가지는?", a:"관의 급격한 확대·급격한 축소, 밸브 개폐도가 너무 작을 때(오리피스화), 관내 유속이 급변할 때 발생한다." },
    { q:"부차적 손실을 나타내는 3가지 방법은?", a:"①상당(등가) 배관길이법(관부속을 직관 길이로 환산) ②손실계수법(hL=K·V²/2g) ③유량계수법(제조사 제공값)이다." },

    { q:"부차적 손실이 소방설비에 미치는 영향은?", a:"마찰손실 증가로 규정 방사압·방사량이 부족해질 수 있고, 전양정 증가로 펌프·수전·비상발전기 용량이 커져야 하는 문제가 생긴다." },
    { q:"부차적 손실 감소 대책은?", a:"급격한 관경 변경을 방지(편심 레듀샤 사용), 급확대·급축소·급격한 굴곡 지양, 관내 유속을 적정하게 유지하고 밸브를 완전 개방한다." },
    { q:"펌프 흡입측 배관에 버터플라이 밸브 설치를 지양하는 이유는?", a:"완전 개방 시에도 디스크 회전축(힌지)이 유로 중심에 남아 경계층 박리를 유발, 마찰손실 증가로 펌프 흡입압력이 낮아져 캐비테이션을 유발할 수 있기 때문이다." },
    { q:"관마찰계수 f를 이용한 다르시-바이스바흐 부차적 손실 표현은?", a:"hL=f·(L/D)·V²/2g 형태로, 부차적 손실도 등가길이 L로 환산해 이 식에 반영할 수 있다." },
    { q:"베나 콘트랙타 지점에서 정압·동압·전압의 관계는?", a:"유속이 최대가 되어 동압이 최대, 정압은 0에 가까워지며(최소), 동압이 곧 전압이 되는 공간이다." },
    { q:"경계층이 점성과 유속에 따라 변하는 방식은?", a:"점성이 클수록 경계층은 두꺼워지고, 유속이 빠를수록 경계층은 얇아진다." },
    { q:"무차원수 답안 작성 팁은?", a:"정의(무엇과 무엇의 비율인지)를 먼저 서술하고, 값의 크기에 따른 지배 현상(예: Gr/Re²가 크면 자연대류)을 함께 제시하면 부분점수 확보에 유리하다." }

    { q:"[69회] 유체의 박리현상(separation)이 일어나는 조건에 대하여 기술하시오.", a:"유체가 곡면·확대관 등을 흐를 때 속도 구배가 0이 되는 지점에서 역압력 구배가 발생하면, 유체가 표면 유선을 이탈하며 박리현상이 발생한다." },
    { q:"[100회] 유체의 박리현상에 대한 정의와 발생 조건 및 소방시설에 미치는 영향에 대하여 설명하시오.", a:"정의·발생조건은 역압력 구배에 의한 유선 이탈이며, 소방시설에는 부차적 손실(마찰손실) 증가로 규정 방사압력·방사량 확보 곤란, 캐비테이션 유발 등의 영향을 미친다." },
    { q:"[66회] 관 내에 흐르는 물의 마찰손실 이외의 부차적 손실(minor loss)에 대하여 설명하시오.", a:"부차적 손실은 관의 급확대·급축소, 엘보·밸브 등 관부속에 의한 손실로, 상당길이법·손실계수법(hL=K·V²/2g)·유량계수법으로 정량화한다." },
    { q:"[126회] 유체(물)가 흐르는 배관에서 발생하는 부차적 손실(Minor Loss)에 대하여 설명하시오.", a:"부차적 손실은 배관 길이에 비례하는 주손실과 달리 관경 변화·관부속에서 발생하는 손실로, 상당길이·손실계수·유량계수의 3가지 방법으로 정량화해 다르시-바이스바흐식에 반영한다." },
    { q:"[128회] 부차적손실(Minor Loss) 정량적 표현방법 3가지를 설명하시오.", a:"①상당(등가) 배관길이법 ②손실계수법(K값, hL=K·V²/2g) ③유량계수법(제조사 제공 데이터 이용)이다." },
    { q:"[121회] 수계 배관에서 돌연확대 및 돌연축소 되는 관로에서의 부차적 손실계수(k)를 증명하시오.", a:"돌연확대는 연속방정식·운동량방정식으로 속도차를 유도해 k=(1-A1/A2)²로, 돌연축소는 베나 콘트랙타의 수축계수를 이용해 유사한 형태로 유도한다." },
    { q:"[68회] 관지름 D=200mm의 관내 유량 Q=65L/s의 물이 흐를 때, 버터플라이 밸브(유심각 30°, 손실계수=3.91)에 의한 손실수두를 구하시오.", a:"유속 V=Q/A를 구한 뒤 hL=K·V²/2g(K=3.91)에 대입해 손실수두를 산출한다." },
    { q:"[77회] 소화배관의 마찰손실 값을 구하는 헤이전-윌리엄스(Hazen-William)식을 배관길이 1m당 마찰손실압력 ΔP(kgf/cm²)/m으로 변환한 식으로 나타내시오.", a:"ΔP=6.053×10⁴×Q^1.85/(C^1.85×D^4.87)×L 형태의 하젠-윌리엄스식에서 L=1m로 두면 단위길이당 마찰손실압력 식이 된다." },
    { q:"[88회] 상당길이 L=30m, 관 내경 D=65mm, 조도계수 C=100, 유량 Q=1,500lpm일 때의 압력손실(kgf/cm²)을 계산하시오.", a:"하젠-윌리엄스식 ΔP=6.053×10⁴×C^-1.85×D^-4.87×Q^1.85×L에 각 값을 대입해 계산한다." },
    { q:"[81회] 유체유동시 마찰손실에 큰 영향을 미치는 점성계수(μ)의 차원을 구하고, hL=λl/d·v²/2g 식에 의한 실험결과와 증명된 내용을 기술하시오.", a:"점성계수의 차원은 [M L⁻¹ T⁻¹]이며, 다르시-바이스바흐식(hL=λl/d·v²/2g)은 층류에서 λ=64/Re로 이론적으로 증명되고, 난류에서는 무디선도 등 실험적 방법으로 구한다." },
    { q:"[81회] 유동해석에 이용하는 무차원수 중 Nusselt number와 Prantle(Prandtl) number에 대하여 각각 설명하시오.", a:"누셀수는 대류/전도 열전달의 비로 값이 클수록 대류가 지배적이며, 프란틀수는 운동량 확산(동점성계수)과 열 확산(열확산계수)의 비로 유체의 열-운동량 확산 상대속도를 나타낸다." },
    { q:"[135회] 무차원수 중 공동수(Cavitation number), 프란틀 수, 에케르트 수, 비열비를 설명하시오.", a:"공동수는 압력강하와 동압의 비로 공동현상(캐비테이션) 발생 가능성을 판단하며, 프란틀수는 운동량/열 확산비, 에케르트수는 운동에너지/엔탈피비로 점성소산 효과를 나타내고, 비열비(k)는 정압비열/정적비열이다." },
    { q:"[92회] 원형덕트내부 공기 통과시 직관부분 마찰저항손실 계산식(Darcy Weisbach)을 설명하시오.", a:"hL=f·(L/D)·V²/2g의 다르시-바이스바흐식으로 마찰저항손실을 계산하며, 관마찰계수 f는 레이놀즈수와 상대조도의 함수(무디선도)로 구한다." },
    { q:"[94회] 소방호스 내 마찰손실에 영향을 주는 요소들을 설명하시오.", a:"호스의 내경·재질(조도계수)·길이·연결부(커플링) 형태, 유량(유속), 굴곡 여부 등이 마찰손실에 영향을 준다." }
  ]
};

  cards:[
    { q:"소화펌프와 충압펌프의 목적 차이는?", a:"소화펌프는 화재 시 소화수를 가압 공급하는 것이 목적이고, 충압펌프는 화재가 아닌 배관 누설 시 압력을 유지해 소화펌프의 빈번한 기동을 방지하는 것이 목적이다." },

    { q:"[105회] 옥내소화전 4개, 정격토출압력 0.7MPa 펌프의 성능시험결과(체절 0.94MPa, 정격 0.75MPa, 과부하 0.43MPa)의 적정성을 판단하시오.", a:"체절압력비 0.94/0.7=134%(140% 이하 만족), 정격압력비 0.75/0.7=107%(100% 이상 만족), 과부하압력비 0.43/0.7=61%(65% 이상 미달)이므로 150% 유량 기준을 만족하지 못해 부적합하다." },
    { q:"[123회] 소방펌프 체절운전(무부하 운전) 시험방법과 NFPA 25에서 전기모터·디젤 펌프의 최소 구동시간 이유를 설명하시오.", a:"체절운전은 토출밸브를 잠근 상태로 펌프를 기동해 압력 상승을 확인하는 시험이며, NFPA 25는 전기모터 펌프 10분, 디젤 펌프 30분을 최소 구동시간으로 규정하는데 이는 각각 열 안정화·엔진 워밍업 등을 확인하기 위함이다." },
    { q:"[134회] NFPA 25의 소방펌프 체절운전 점검주기 및 최소운전시간 구동 이유를 설명하시오.", a:"체절운전 점검은 주기적으로(연 1회 등) 실시하며, 최소운전시간은 펌프·모터의 열적 안정 상태에서의 성능을 확인하기 위함이다." },
    { q:"[99회] 펌프의 비속도를 구하는 식에서 비속도의 정의를 설명하고, 연속의 원리·토리첼리정리·회전차의 식을 이용해 증명하시오.", a:"비속도는 상사인 가상펌프가 단위유량·단위양정을 내는 데 필요한 회전수(Ns=N√Q/H^(3/4))로 정의되며, 연속의 원리(Q=AV)·토리첼리정리(v=√2gh)·회전차 이론(원심력에 의한 양정)을 결합해 유도한다." },

    { q:"[111회] 펌프의 비속도(Specific speed) 개념과 특성, 비속도가 펌프 효율과 동력에 미치는 영향을 설명하시오.", a:"비속도는 상사 가상펌프의 회전수로 정의되는 펌프 고유값이며, 값이 클수록 대유량·저양정, 작을수록 저유량·고양정 특성을 가지고, 정격점을 벗어난 운전에서 효율·동력의 변화 정도가 달라진다." },
    { q:"[119회] 펌프의 비속도 및 상사법칙에 대하여 설명하시오.", a:"비속도는 형상이 상사인 펌프군의 특성을 나타내는 값이며, 상사법칙은 회전수비에 대해 유량은 1승, 양정은 2승, 동력은 3승에 비례한다는 법칙이다." },
    { q:"[135회] 원심펌프와 관련해 비속도(Specific Speed), 유효흡입수두(NPSHav), 특성곡선을 설명하시오.", a:"비속도는 상사펌프의 회전수, 유효흡입수두는 현장이 펌프에 제공하는 에너지(대기압+낙차-마찰손실-증기압), 특성곡선은 유량에 따른 양정·효율·동력의 관계 곡선이다." }

    { title:"2. A급·B급·C급·K급 소화기 능력단위 시험", blocks:[{ type:"table", headers:["구분", "시험 방법", "핵심 기준"], rows:[["A급(목재화재)", "제1모형(144개)·제2모형(90개) 목재 더미를 쌓아 휘발유로 착화 후 3분 뒤 소화 시작", "무풍(0.5m/s 이하)·방화복 미착용, 방사 후 2분 이내 재연 없으면 완전소화(제1모형 2개 소화=2단위)"], ["B급(유류화재)", "휘발유+물을 채운 원형 용기(모형번호 1~20)로 제2·3소화시험", "착화 1분 후 소화 시작, 방사 후 1분 이내 재발화 없으면 소화(능력단위=제2·3소화시험 완전소화 모형번호의 평균치)"], ["C급(전기화재)", "소화시험 없음, 전기전도성 시험만 실시", "이격거리 350mm, 시험전압 3,500±10%V에서 통전전류 0.5mA 이하"], ["K급(주방화재)", "튀김기름(대두유)을 260℃까지 가열 후 자연발화시켜 소화·스플래시 시험", "1m 이상 거리에서 방사, 20분간 재연 없고(기름온도가 실온+35℃ 이하) 비산 액적 5mm 이내"]] }, { type:"p", text:"K급 화재는 발화점과 인화점의 온도차가 작은 튀김기름의 특성상, 표면만 냉각해서는 기름 전체 온도가 이미 발화점을 넘어 재발화하므로 냉각소화가 필수적이다(유류화재는 표면만 발화점에 도달하는 것과 대비된다)." }] },

  cards:[
    { q:"대형소화기의 능력단위 기준(A급·B급)은?", a:"A급은 10단위 이상, B급은 20단위 이상이며, 이 기준 미만은 소형소화기다." },
    { q:"소화기 설치기준(보행거리)은?", a:"소형소화기는 보행거리 20m마다, 대형소화기는 보행거리 30m마다 층별로 설치한다." },
    { q:"터널의 소화기 설치기준은?", a:"능력단위 3단위 이상의 소화기를 차량 진행방향 50m마다 2개씩 설치한다." },
    { q:"A급 화재 소화시험의 제1모형·제2모형은?", a:"건조한 소나무·오리나무를 각각 144개(제1모형), 90개(제2모형) 쌓아 만든 목재더미로, 휘발유로 착화 후 3분 뒤 소화를 시작한다." },
    { q:"A급 소화기 능력단위 산정방법은?", a:"제1모형 S개를 소화하면 2S단위, 추가로 제2모형 1개를 소화하면 +1단위로 산정한다(예: 제1모형 2개+제2모형 1개=5단위)." },
    { q:"A급·B급 소화시험 공통 조건 2가지는?", a:"무풍상태(풍속 0.5m/s 이하)에서 실시하며, 소화기 조작자는 방화복을 착용하지 않는다." },
    { q:"A급 소화시험에서 완전소화 판정 기준은?", a:"약제 방사 후 2분 이내에 재연소하지 않으면 완전히 소화된 것으로 본다." },
    { q:"B급 소화시험(제2·3소화시험)의 개요는?", a:"휘발유와 물을 채운 원형 용기(모형번호 1~20)를 이용하며, 착화 1분 후 소화를 시작하고 방사 후 1분 이내 재발화하지 않으면 소화된 것으로 본다." },
    { q:"B급 소화기 능력단위 산정방법은?", a:"제2소화시험과 제3소화시험에서 각각 완전히 소화한 모형번호 수치의 평균치를 능력단위로 하며, 평균치 계산 시 1 미만의 수는 버린다." },
    { q:"C급 소화기의 시험 방식은?", a:"C급은 화재를 소화하는 시험이 아니라 감전 여부를 판단하는 전기전도성 시험만 실시한다(이격거리 350mm, 시험전압 3,500±10%V에서 통전전류 0.5mA 이하)." },

    { q:"K급 소화기 소화성능시험의 가열조건은?", a:"대두유(식용유)를 모형 상단에서 75mm가 되도록 부은 뒤 260℃까지 가열(튀김요리 최적온도)하고, 이후 분당 5±2℃ 속도로 추가 가열해 자연발화시킨다." },
    { q:"K급 소화기 소화성능 판정 기준은?", a:"방사 완료 후 완전 소화되고, 20분 동안 기름온도가 실온보다 35℃ 이상 높은 상태에서 재연소하지 않아야 하며, 방사는 1m 이상 거리에서 실시한다." },
    { q:"K급 소화기 스플래시(비산) 시험의 판정 기준은?", a:"기름온도 175~190℃에서 2m 이내 거리로 방사 시, 중탄산나트륨이 도포된 표면에 비산된 기름 액적 크기가 5mm 이내여야 한다." },
    { q:"물의 삼중점 조건은?", a:"0.01℃, 약 0.006atm(0.6kPa)이며, 고체·액체·기체 3상이 동시에 공존하는 점이다." },
    { q:"물의 임계점 조건과 의미는?", a:"374℃, 218atm이며, 이 온도 이상에서는 압력을 아무리 높여도 액화되지 않는(액체·기체 구분이 사라지는) 초임계 상태가 된다." },
    { q:"물의 상평형도가 삼중점에서 좌측으로 기울어지는 이유는?", a:"고체-액체 경계선(융해곡선)이 음의 기울기를 갖기 때문으로, 물이 얼면 부피가 팽창하는 특이성(밀도 이상현상)에 기인한다." },
    { q:"물 소화약제의 최대 장점은?", a:"화염을 뚫고 가연물 표면까지 도달해 표면을 냉각(표면냉각)시켜 가연물 온도를 인화점 이하로 낮춤으로써 재발화 우려를 없애는 것이다." },
    { q:"삼중점~임계점 사이에서 압력·온도 변화에 따른 상변화는?", a:"압력을 높이거나 온도를 낮추면 액화되고, 압력을 낮추거나 온도를 높이면 기화된다." },
    { q:"K급 화재와 일반 유류화재의 소화 방식 차이는?", a:"일반 유류화재는 표면만 발화점에 도달해 있어 질식소화가 가능하지만, K급 화재는 기름 전체가 발화점 부근이므로 반드시 냉각소화가 필요하다." }
  ]
};

  sub:"RTI=τ√u 공식과 헤드별 RTI·C값·표시온도(표준형·주거형·CMSA·ESFR), ADD(실제침투밀도)·RDD(소요살수밀도)의 정의와 ADD>RDD 진압조건, 시간경과에 따른 ADD 감소·RDD 증가 관계, ESFR 설치기준(층고 13.7m·천장기울기 1/168·보 간격 등), 스프링클러 설치제외 조건(개통발병 2105 냉고 불태)",
  notes:[
    { title:"1. RTI·표시온도·열전도계수 C", blocks:[{ type:"p", text:"RTI(반응시간지수, Response Time Index)는 τ=MC/(hA)(τ:시정수, M:감열체 질량, C:열용량, h:대류열전달계수, A:감열면적)를 바탕으로 RTI=τ√u(u:기류속도)로 정의되며, RTI가 작을수록 헤드가 빨리 작동한다. 시험은 203×203mm 각형 풍동에서 헤드를 설치하고 가스온도의 63%(시정수 τ)에 도달하는 시간을 측정한다." }, { type:"table", headers:["구분", "RTI", "C값", "목적"], rows:[["표준형", "80~350", "2", "화재제어"], ["주거형", "50 이하(조기반응형)", "1", "피난시간 연장"], ["CMSA", "80~350(표준형과 동일)", "2", "화재제어(고강도 화재)"], ["ESFR", "20~36(가장 조기 반응)", "1", "화재진압"]] }, { type:"p", text:"표시온도는 헤드가 개방되는 감열체 작동온도로, 설치장소 최고 주위온도가 39℃ 이하면 표시온도 79℃ 미만 헤드(통상 72℃)를 사용한다. 열전도계수 C는 스프링클러 주위에서 전달된 열이 배관·물 등으로 방출(손실)되는 비율로, 표준형은 2, 특수반응형·조기반응형은 1이다(C가 작을수록 열손실이 적어 조기 작동)." }] },
    { title:"2. ADD·RDD와 헤드 종류별 비교", blocks:[{ type:"p", text:"ADD(Actual Delivered Density, 실제침투밀도)는 스프링클러에서 분사된 물 중 화염을 뚫고 가연물 상단에 실제 도달한 물의 양을 표면적으로 나눈 값이고, RDD(Required Delivered Density, 소요살수밀도)는 화재를 진압하는 데 필요한 물의 양을 표면적으로 나눈 값이다. ADD>RDD이면 화재진압이 가능하다." }, { type:"p", text:"화재는 시간에 따라 α·t²로 성장하므로 시간이 지날수록 RDD(필요량)는 증가하고, 화재 부력이 커져 물방울이 화심을 뚫기 어려워지므로 ADD(도달량)는 감소한다. RTI가 낮을수록 헤드가 조기 작동해 ADD는 커지고 RDD는 작아져 진압조건을 만족하기 쉬워진다." }, { type:"table", headers:["헤드 종류", "목적", "K-factor", "비고"], rows:[["표준형", "화재제어(Control)", "80", "일반 가연물"], ["주거형", "피난시간 연장", "표준형과 유사", "연층 하강 지연, 벽면 1.8m 이상 냉각이 목적(소화 목적 아님)"], ["CMSA", "화재제어(고강도 화재)", "160(표준형의 2배)", "감지특성은 표준형과 동일, 물방울 크기·유량만 2배"], ["ESFR", "화재진압(Early Suppression)", "200~360", "가장 낮은 RTI로 조기감지, ADD>RDD를 형성하도록 설계"]] }] },
    { title:"3. ESFR 설치기준과 스프링클러 설치제외 조건", blocks:[{ type:"table", headers:["항목", "기준"], rows:[["층고", "13.7m 이하(초과 시 조기감지 실패)"], ["천장기울기", "1/168 이하(초과 시 반자를 두고 1렬 수평 설치)"], ["천장 돌출부(철제·목재 트러스)", "102mm 이하"], ["보 간격", "0.9~2.3m(2.3m 초과 시 보 구획 천장·반자 면적 28㎡ 이하)"], ["저장물 간격", "모든 방향 150mm 이상"]] }, { type:"p", text:"ESFR은 사류위험물·인화성액체(유류화재), 타이어·두루마리·종이 등 화염전파속도가 스프링클러 개방속도보다 빠른 가연물에는 설치할 수 없다(화재가 헤드보다 먼저 확산되면 조기진압이라는 목적 자체가 성립하지 않기 때문)." }, { type:"callout", text:"스프링클러 설치제외 조건 암기 앞머리: '개통발병 2105 냉고 불태' — 계단실, 통신기계실·전자실, 발전실·변전실·변압기실, 병원 수술실·응급처치실, 천장·반자 사이 2m/1m/0.5m 미만(불연재 조건별), 펌프실·냉동창고, 불연성 물품 저장창고, 테니스장 등 실내 부속시설." }] }

  cards:[
    { q:"RTI 공식과 의미는?", a:"RTI=τ√u(τ:시정수=MC/hA, u:기류속도)이며, 값이 작을수록 헤드가 조기 작동한다." },
    { q:"RTI가 클수록 헤드 작동 속도는 어떻게 되는가?", a:"RTI가 크면 감열체가 열을 늦게 흡수해 헤드가 늦게 작동한다(열용량이 커서 온도가 잘 안 변함)." },
    { q:"표준형·특수반응형(조기반응형) 헤드의 C값은?", a:"표준형 C=2, 특수반응형·조기반응형 C=1이다(작을수록 열손실이 적어 조기 작동)." },
    { q:"RTI 시험장치의 구성과 측정방식은?", a:"203×203mm 각형 풍동에 송풍기·히터·유속계·열전대를 설치하고 시험헤드를 부착, 가스온도의 63%(시정수 τ)에 도달하는 시간을 측정한다." },
    { q:"표시온도의 정의와 대표값은?", a:"헤드가 개방되는 감열체 작동온도로, 설치장소 최고주위온도 39℃ 이하 시 표시온도 79℃ 미만(통상 72℃) 헤드를 사용한다." },
    { q:"ADD와 RDD의 정의는?", a:"ADD(실제침투밀도)는 화염을 뚫고 가연물 상단에 도달한 물의 양/표면적, RDD(소요살수밀도)는 화재진압에 필요한 물의 양/표면적이다." },
    { q:"화재진압이 성립하는 조건은?", a:"ADD > RDD, 즉 스프링클러로부터 방사된 물이 화재진압에 필요한 물의 양보다 많이 가연물 표면에 도달해야 한다." },
    { q:"시간 경과에 따른 ADD·RDD의 변화 경향은?", a:"화재는 α·t²로 성장하므로 RDD(필요량)는 시간이 갈수록 증가하고, 화재 부력 증가로 ADD(도달량)는 감소한다." },
    { q:"표준형 스프링클러의 목적과 K-factor는?", a:"화재제어(Control) 목적이며 K=80이다." },
    { q:"주거형 스프링클러의 목적은?", a:"화재진압·제어가 아니라 재실자의 피난시간 연장(연층 하강 지연, 벽면 1.8m 이상 냉각)이 목적이며 RTI는 조기반응형(50 이하) 수준이다." },
    { q:"CMSA(특수제어모드용) 스프링클러의 특징은?", a:"라지드롭 헤드에 제어모드를 더한 헤드로 감지특성은 표준형과 동일(RTI 80~350, C=2)하며, K=160(표준형의 2배 방수량)으로 팰릿 적재창고 등 고강도 화재장소에 사용한다." },
    { q:"ESFR 스프링클러의 목적과 특징은?", a:"조기진압(Early Suppression Fast Response) 목적으로, RTI 20~36(가장 낮음)·K=200~360(가장 큼)을 가지며 ADD>RDD를 형성하도록 설계된다." },
    { q:"ESFR의 층고 제한은?", a:"해당 층 높이 13.7m 이하이다(초과 시 헤드가 화재를 조기 감지하지 못한다)." },
    { q:"ESFR의 천장기울기·돌출부 제한은?", a:"천장기울기 1/168 이하, 철제·목재 트러스 돌출부 102mm 이하이다." },
    { q:"ESFR의 보(빔) 관련 설치기준은?", a:"보 간격 0.9~2.3m이며, 2.3m 초과 시 보로 구획된 천장·반자 면적을 28㎡ 이하로 제한한다(포켓구간 최소화)." },
    { q:"ESFR의 설치제외 대상은?", a:"사류위험물·인화성 액체와, 타이어·두루마리·종이 등 화염전파속도가 헤드 개방속도보다 빠른 가연물이다." },
    { q:"스프링클러 설치제외 조건 중 천장-반자 이격거리 기준은?", a:"양쪽 불연재이면 2m 미만, 한쪽 불연재이면 1m 미만, 양쪽 불연재이고 가연물이 없으면 0.5m 미만일 때 설치를 제외한다." },
    { q:"K-factor와 방수량의 관계식은?", a:"Q=K√P(또는 Q=0.6597·D²·√P)이며, K가 클수록 동일 압력에서 방수량이 증가한다." },
    { q:"라지드롭(CMSA)형 헤드가 표준형과 다른 점은?", a:"오리피스 구경을 크게 해 물방울 크기와 방수량을 표준형의 2배로 만들어 고강도 화재의 화심 침투력을 높인다(K=160)." },
    { q:"ADD·RDD와 RTI의 관계는?", a:"RTI가 낮을수록 헤드가 조기작동해 ADD는 커지고 RDD는 작아져 조기진압 조건(ADD>RDD)을 만족하기 쉬워진다." }
  ]
};

    { q:"[78회] 수계 소화배관에 사용할 수 있는 물용 감압밸브의 특성과 직렬·병렬 설치에 대하여 논하시오.", a:"감압밸브는 설정압력 이상을 차단해 과압을 방지하며, 직렬 설치는 단계별 감압으로 큰 압력차를 안전하게 낮출 때, 병렬 설치는 유량 분산 및 예비계통 확보 시 사용한다." },
    { q:"[93회] 옥상수조 가압방식 옥내소화전에서 수조 바닥면적 50㎡·저수면 높이 6m 조건의 방수구 압력 계산방법은?", a:"수조 바닥부터 최상층 방수구까지의 낙차를 환산압력(0.1MPa/10m)으로 계산하고, 마찰손실수두를 차감한 뒤 규정 방수압(0.17MPa 이상) 확보 여부를 판정한다." },
    { q:"[104회] 소화배관에서 기존 감압밸브의 문제점과 균압방지용 감압밸브 시스템에 대하여 설명하시오.", a:"기존 감압밸브는 유량변화에 따라 2차측 압력이 불안정한 문제가 있어, 균압방지형(파일럿 제어 등)으로 유량 변동과 무관하게 2차측 압력을 일정하게 유지하는 시스템을 사용한다." },
    { q:"[105회] 옥내소화전 노즐 방수압력 0.7MPa 초과 시 설치하는 감압변(감압오리피스)의 감압원리는?", a:"오리피스 통과 시 베르누이 정리에 의해 유속(동압) 상승분만큼 정압이 감소하는 원리를 이용해 방수압을 규정치 이하로 낮춘다." },
    { q:"[108회] 소방시설의 내진설계 기준 중 가압송수장치의 세부 설치기준을 설명하시오.", a:"가압송수장치는 지진 시 이탈·손상을 방지하기 위해 내진스토퍼·플렉시블조인트 등을 설치하고, 기초를 앵커볼트로 고정하는 기준을 규정한다." },
    { q:"[114회] 기존의 옥내소화전을 호스릴 옥내소화전으로 변경하는 경우 발생할 수 있는 문제점과 대책을 설명하시오.", a:"건축적(벽체 폭 증가·내화구조 성능저하), 기계적(배관구경 축소로 마찰손실 증가), 전기적(펌프·전동기·비상전원 용량 증가) 문제가 발생하며, 각각 구조보강·펌프재산정·수전용량 증설로 대응한다." },
    { q:"[118회] 호스릴 소화전의 도입배경과 설치기준 및 특징·문제점에 대하여 설명하시오.", a:"노약자·1인도 용이하게 사용할 수 있도록 개발되었으며, 배관경 25mm로 압력손실이 크고 가격이 비싼 문제점이 있으나 현재 공동주택·노유자시설에서 필수 채택되고 있다." },
    { q:"[122회] 옥내소화전설비에서 압력챔버(Chamber) 설치기준과 역할에 대하여 설명하시오.", a:"압력챔버는 배관 내 압력변화를 감지해 펌프를 자동기동·정지시키는 기동용수압개폐장치로, 통상 100L 이상 용량에 압력스위치를 내장해 레인지·디프값에 따라 펌프를 제어한다." },
    { q:"[122회] 소화배관의 과압발생 시 감압방법의 종류와 각각의 특징에 대하여 설명하시오.", a:"전용배관방식, 부스터펌프방식, 고가수조방식, 감압장치(오리피스)방식이 있으며, 감압장치방식이 시스템이 단순하고 가격이 저렴해 가장 널리 사용된다." },
    { q:"[125회] Q=0.6597×d²×√P를 유도하고, 옥내소화전과 스프링클러설비의 K-factor에 대하여 설명하시오.", a:"연속방정식과 베르누이 정리로 오리피스 유량식을 유도하며, K=0.6597·C·d²(C: 유량계수)로 정의되고 옥내소화전 K는 배관경에 따라, 스프링클러 K는 헤드 종류(표준형 80~ESFR 360)에 따라 다르다." },
    { q:"[126회] 옥내소화전 펌프 토출 측 주배관의 유속을 4m/s 이하로 제한하는 이유는?", a:"유속이 과도하면 마찰손실과 수격작용(워터해머)이 커지고 배관 침식·소음이 발생하므로 이를 방지하기 위해 유속을 제한한다." },
    { q:"[129회] 초고층건축물 고가수조방식에서 저층부 과압 발생 시 해결방안은?", a:"고층부·저층부용 고가수조를 분리하거나, 저층부 배관에 감압밸브(오리피스)를 설치해 저층부 방수압을 규정치 이하로 낮춘다." },
    { q:"[132회] 고가수조·압력수조·펌프·가압수조 방식과 고가수조·옥상수조의 차이점은?", a:"고가수조는 가압송수장치 그 자체(자연낙차압으로 규정방수량 확보)이고, 옥상수조는 펌프 고장 시를 대비해 유효수량의 1/3을 옥상에 별도 저장하는 예비수원이라는 점에서 목적이 다르다." }
  ]
};

  cards:[
    { q:"[65회] 스프링클러헤드의 소화성능에 영향을 주는 RTI, RDD, ADD의 정의 및 상호관계를 설명하시오.", a:"RTI는 헤드의 반응시간지수(작을수록 조기작동), RDD는 진압에 필요한 살수밀도, ADD는 실제 화심에 도달한 살수밀도로, RTI가 작을수록 ADD는 커지고 RDD는 작아져 ADD>RDD(진압조건)를 만족하기 쉬워진다." },
    { q:"[77회] ESFR(early suppression fast-response) 스프링클러헤드가 표준형보다 화재발생초기에 작동하는 이유는?", a:"ESFR은 RTI가 20~36으로 표준형(80~350)보다 훨씬 낮아 감열체가 열을 빨리 흡수하여 조기에 작동한다." },

    { q:"[84회] 화재 조기진압용 스프링클러 헤드의 조기진압특성(열감도·소요밀도·실제침투밀도)을 설명하시오.", a:"열감도는 RTI로 표현되는 조기 작동 능력, 소요밀도는 RDD(화재진압에 필요한 물의 양), 실제침투밀도는 ADD(실제 도달한 물의 양)이며, ADD가 RDD보다 커야 조기진압이 가능하다." },
    { q:"[87회] ESFR 스프링클러설비의 개발배경과 개발이론 3가지(RTI, ADD, RDD)를 설명하시오.", a:"표준형 스프링클러로는 살수밀도가 부족해 랙크식 창고 등 고강도 화재를 제어만 하고 진압하지 못하는 한계를 극복하기 위해, RTI를 낮춰 조기감지하고 K-factor를 키워 ADD가 RDD를 초과하도록 설계했다." },
    { q:"[91회] 화재조기진압용 스프링클러헤드의 정의·적용범위 및 설치규정, 살수분포 장애물 상·하 헤드 설치기준은?", a:"ESFR은 조기진압을 목적으로 층고 13.7m 이하에 설치하며, 폭 1.2m 초과 장애물이 있으면 그 하부에도 헤드를 추가 설치해 살수 사각지대를 방지한다." },
    { q:"[94회] 스프링클러의 RDD, ADD의 정의를 설명하시오.", a:"RDD는 화재진압에 필요한 물의 양을 가연물 상단 표면적으로 나눈 값, ADD는 화염을 뚫고 실제 가연물에 도달한 물의 양을 표면적으로 나눈 값이다." },
    { q:"[98회] 화재조기진압용 스프링클러설비의 화재안전기준에서 정하는 헤드 선단의 최소방사압력은?", a:"K-factor와 층고·저장높이 조건에 따라 0.28MPa 또는 0.36MPa 등으로 규정되며, 저장물 최대높이가 높을수록 더 높은 방사압력이 요구된다." },
    { q:"[107회] 197℃, 2.56m/s 열기류가 흐르는 풍동에서 RTI를 계산하는 방법은?", a:"가스온도의 63%(시정수 τ)에 도달하는 시간을 측정한 뒤 RTI=τ√u(u: 기류속도)로 계산한다." },
    { q:"[109회] ESFR 스프링클러설비 수원의 양(랙창고 높이 12m, 최상단물품높이 10m 조건)을 구하는 방법은?", a:"K-factor와 층고·저장높이에 따른 표에서 필요 방사압력을 확인한 뒤, Q=K√10P를 이용해 헤드 1개당 방수량을 구하고, 가장 먼 가지배관 3개에서 각 4개(12개) 헤드가 60분간 동시 방사하는 것으로 계산한다." },
    { q:"[115회] NFSC 103에서 천장과 반자 사이의 거리 및 재료에 따른 스프링클러헤드의 설치제외 기준은?", a:"천장·반자 양쪽이 불연재이면 2m 미만, 한쪽이 불연재이면 1m 미만, 양쪽 불연재이고 가연물이 없으면 0.5m 미만일 때 설치를 제외한다." },
    { q:"[117회] ESFR 수원의 양을 구하는 계산문제(랙창고 조건)의 접근방법은?", a:"K-factor·층고·저장높이 표에서 방사압력을 선정하고 Q=K√10P로 헤드당 방수량을 산정한 뒤, 가장 먼 3개 가지배관의 각 4개 헤드(12개)가 60분간 동시방사하는 수량으로 계산한다." },
    { q:"[120회] ESFR 스프링클러헤드가 화재를 조기진압하는 것을 결정하는 3가지 특성요소는?", a:"RTI(조기 감지), ADD(실제침투밀도), RDD(소요살수밀도)이며, RTI가 낮아 ADD가 RDD보다 커야 조기진압이 가능하다." },
    { q:"[121회] 화재조기진압용 스프링클러의 설치제외와 물분무헤드의 설치제외를 설명하시오.", a:"ESFR은 사류위험물·인화성액체 및 타이어·두루마리 등 화염전파가 빠른 가연물에 설치제외되며, 물분무헤드는 물과 격렬히 반응하는 물질·고온물질(260℃ 이상) 저장 장소에 설치가 제외된다." },
    { q:"[122회] 스프링클러헤드의 RTI와 헤드 감도시험방법에 대해서 설명하시오.", a:"RTI=τ√u이며, 시험은 203×203mm 각형 풍동에 헤드를 설치하고 일정 기류온도·속도 조건에서 가스온도의 63%에 도달하는 시간(τ)을 측정해 산정한다." },

    { q:"[87회] 물분무소화설비의 헤드(5종)와 소화효과(4가지)에 대해 각각 설명하시오.", a:"헤드는 충돌형·분사형·선회류형·디플렉터형·슬리트형 등으로 구분되며, 소화효과는 냉각효과·질식효과·유화효과·희석효과 4가지이다." },
    { q:"[93회] 물분무소화설비의 ①설치대상 ②수원양 ③스프링클러설비와 장단점을 비교 설명하시오.", a:"설치대상은 주차장·발전실·변전실 등이며 수원은 대상별 살수밀도(10~20L/min·㎡)×20분으로 산정하고, 스프링클러보다 전기·유류화재 적응성이 좋으나 표면냉각 능력은 상대적으로 약하다." },
    { q:"[95회] 물분무등 소화설비를 설치하여야 하는 특정소방대상물을 기술하고, 물분무소화설비의 소화원리를 설명하시오.", a:"설치대상은 항공기격납고·주차장·발전실·변전실 등이며, 소화원리는 미세한 물입자에 의한 냉각·질식·유화·희석 작용이다." },
    { q:"[99회] 부압식(진공식) 스프링클러의 구조와 주요 구성요소, 시스템의 동작흐름을 설명하시오.", a:"진공펌프·프리액션밸브·감지기·제어반으로 구성되며, 평상시 2차측을 진공펌프로 부압 유지하다가 감지기 작동 시 진공펌프 정지→프리액션밸브 개방→가압송수장치 기동 순으로 작동한다." },
    { q:"[100회] 물분무소화설비, 이산화탄소소화설비, 분말소화설비의 소화원리 및 장·단점에 대하여 설명하시오.", a:"물분무는 냉각·질식(전기 비전도성 확보), CO2는 질식·냉각(밀폐공간 유효, 질식 위험), 분말은 부촉매·질식(속효성이나 재발화 우려)이 각각의 소화원리이다." },
    { q:"[103회] 스프링클러설비, 물분무소화설비 및 미분무소화설비에 대해서 ①특성 ②소화효과 ③적응성을 설명하시오.", a:"스프링클러(물방울 大, 표면냉각, A급 위주)·물분무(중간크기, 냉각+질식, A·B·C급)·미분무(0.4~1mm, 질식 위주, A·B·C급 모두 적응)로 물입자 크기가 작아질수록 질식효과 비중이 커진다." },
    { q:"[115회] 스프링클러헤드의 로지먼트(Lodgement) 현상에 대하여 설명하시오.", a:"헤드 개방 시 분해된 감열체 부품이 디플렉터 등에 걸려 살수패턴이 왜곡되는 헤드 자체의 결함 현상으로, 걸림작동시험을 통해 방지한다." },
    { q:"[116회] 물분무소화설비(water spray system) 작동·분무 시 물입자의 동적 특성 및 소화 메카니즘을 설명하시오.", a:"고압으로 방사된 물입자가 운동량(운동모멘트)을 가지고 화염을 통과하며, 표면냉각·기상냉각(질식)·유화(유류표면 피막 형성)·산소희석의 복합작용으로 소화한다." },
    { q:"[121회] 국가화재안전기준에서 정하는 화재조기진압용 스프링클러의 설치제외와 물분무헤드의 설치제외를 설명하시오.", a:"ESFR은 화염전파속도가 빠른 가연물(타이어·두루마리 등)에 설치제외되며, 물분무헤드는 물과 격렬히 반응하거나 고온(260℃ 이상)인 물질을 저장하는 장소에 설치가 제외된다." },
    { q:"[125회] 물분무소화설비의 소화원리, 적응·비적응장소, 수원의 저수량 기준을 설명하시오.", a:"소화원리는 냉각·질식·유화·희석이며, 비적응장소는 물과 반응하는 물질·고온물질(260℃ 이상) 저장소이고, 수원은 대상별 살수밀도(10~20L/min·㎡)에 20분을 곱해 산정한다." },
    { q:"[128회] 스프링클러설비·물분무설비·미분무설비 특징 비교 및 소화효과·적응성을 설명하시오.", a:"물입자 크기가 스프링클러>물분무>미분무 순으로 작아지며, 소화효과는 표면냉각 위주에서 질식 위주로 이동하고, 적응화재도 A급 위주에서 A·B·C급 전체로 확대된다." },
    { q:"[131회] 스프링클러헤드 로지먼트 현상과 시험방법은?", a:"로지먼트는 분해부품의 걸림으로 인한 살수패턴 왜곡 현상이며, 걸림작동시험(0.1~1.2MPa에서 그리드/가지배관 방식으로 방사해 부품 걸림·반사판 변형 여부 확인)으로 검증한다." },
    { q:"[136회] 물분무소화설비의 배수설비 설치기준과 설치 이유는?", a:"물분무 방사 후 고인 물을 신속히 배출해 전기설비 감전·수손피해를 방지하기 위해 배수구·집수정·기름분리장치 등을 설치하도록 규정한다." },
    { q:"[137회] 스프링클러설비의 습식·준비작동식·부압식에 대한 구조, 동작원리, 특징을 비교 설명하시오.", a:"습식은 2차측이 항상 가압수로 즉시방수, 준비작동식은 2차측 대기압으로 감지기+헤드 작동 시 방수, 부압식은 2차측을 진공펌프로 부압 유지해 오동작 시에도 수손피해가 없는 것이 특징이다." }
  ]
};

  notes:[
    { title:"1. 물분무소화설비의 소화원리와 용도", blocks:[{ type:"p", text:"물방울 입자가 작아지면 가연물 표면까지 침투하기 어려워져, 냉각은 표면냉각이 아닌 기상냉각 위주로 바뀐다. 기화가 빠른 만큼 비열·잠열로 열을 흡수해 냉각하지만, 표면을 직접 식히는 효과(표면냉각)는 스프링클러 적상방수보다 떨어진다. 표면까지 물을 도달시키려면 압력을 높여 물방울에 운동(중력)모멘트를 부여해야 한다." }, { type:"p", text:"기화가 빠르므로 질식도 빠르다. 0℃ 물 1g이 100℃ 수증기로 변하면 약 1,700배 팽창하여 주위 산소를 밀어내는 희석질식 효과를 낸다. 유화작용은 중질유 표면에 미세한 물방울이 고압·속도로 충돌해 유화층(에멀전)을 형성, 증기 발생을 억제하여 질식을 돕는 작용이다. 희석은 물입자가 가연성 가스·액체의 농도를 낮추는 작용이다." }, { type:"table", headers:["용도", "내용"], rows:[["화재제어", "연소속도·열방출률을 제어해 소화·재발화 방지(ESFR과 달리 화재진압이 아닌 제어 목적)"], ["노출부분 방호", "위험물저장탱크 등의 둘레에 설치해, 인접 화재의 열로부터 가열되지 않도록 보호"], ["출화의 예방", "미연소 가연물을 미리 적셔 인화성가스 농도를 낮추고 화재 확산(출화)을 저지"]] }] },

    { q:"물분무 미분화 방법 5가지는?", a:"디플렉터(살수판) 충돌, 선회류에 의한 확산, 직선류 충돌, 슬리트(좁은 틈새) 수류 방출, 유수 간 충돌·고압분사이다." },
    { q:"물분무 차고·주차장 배수설비의 경계턱 높이 기준은?", a:"차량이 주차하는 적당한 곳에 높이 10cm 이상의 경계턱으로 배수구를 설치한다." },
    { q:"물분무 유분리장치(집수관·소화피트)의 설치간격은?", a:"40m마다 집수관, 소화피트, 유분리장치를 설치해 물과 기름을 분리한다." },
    { q:"물분무 설비의 배수구 기울기 기준은?", a:"바닥은 배수구를 향하여 2/100 이상의 기울기를 두어야 한다." },
    { q:"고압방사 시 물분무헤드가 비전도성을 가지는 원리는?", a:"고압으로 방사되면 물방울 간 이격거리가 벌어져 절연층이 형성되며(공기 절연층은 1mm당 약 3kV 필요), 이격거리가 커질수록 절연내력이 커진다." },
    { q:"미분무(Water Mist)의 정의를 수치로 설명하시오.", a:"최소 설계압력에서 헤드로부터 방출되는 물입자 중 99%의 누적체적분포(Dv0.99)가 400㎛ 이하로 분무되고 A·B·C급 화재 적응성을 갖는 소화설비이다." },
    { q:"SFPE 클래스1(Class 1) 미분무의 물방울 크기 기준과 적응성은?", a:"Dv0.9가 200㎛ 이하로 가장 미세하며, B급(유류) 화재에 적합하나 A급 적응성은 상대적으로 낮다." },
    { q:"물방울이 커질수록(Class 1→2→3) 적응성이 어떻게 변하는가?", a:"A급(고체) 화재 적응성은 점점 높아지고, B급(유류) 화재 적응성은 점점 낮아진다." },
    { q:"미분무 수원의 양 산정식은?", a:"수원의 양 = N(헤드개수)×D(설계유량)×T(방사시간)+V(배관 내 잔류체적)이며, 안전율 1.2 이상을 곱한다." },
    { q:"미분무 수원 산정 시 스프링클러와 다른 점은?", a:"스프링클러처럼 헤드별 표준 방수량 테이블이 없어 안전율(1.2 이상)을 별도로 곱하고, 배관 체적(V)을 추가로 더해야 한다." },
    { q:"미분무의 국내 사용압력 구분 기준은?", a:"저압은 1.2MPa 미만, 중압은 1.2~3.5MPa, 고압은 3.5MPa 초과로 구분한다(NFPA 12~35bar 기준과 동일)." },
    { q:"미분무 설계절차의 암기법과 순서는?", a:"'목과공모유방비' — 목표설정→가연물의 종류→공간의 특성→운동모멘트→미분무 생성방법(입자크기)→유속밀도(살수밀도)→방사시간→비용 순이다." },
    { q:"미분무의 소화효과(질식·희석·기상냉각·복사차단) 중 주된 효과는?", a:"희석질식이 주된 소화효과이며, 물의 1,700배 체적팽창으로 산소를 밀어내는 질식과 증기 희석이 결합된 형태이다." },
    { q:"미분무의 표면적이 물분무보다 커서 얻는 장점은?", a:"총 표면적이 커 증발이 빠르고 팽창비(질식효과)가 커지며, 램버트-비어 법칙에 따라 복사열 차단 효과도 커진다." },
    { q:"미분무의 시스템 경량화 장점이 응용되는 대표 사례는?", a:"물탱크·배관이 작아져 시스템이 경량화되므로 선박·항공기·차량 엔진룸 등 협소한 공간에 물기반 이송시스템으로 적용할 수 있다." },
    { q:"미분무가 가스계(할론 등) 소화설비를 대체할 수 있는 이유는?", a:"물입자가 작아 기체처럼 행동하며 불활성기체 대용, C급 정전기·전기설비, 박물관·도서관 등 물에 민감한 장소의 한론 대체 용도로 사용 가능하다." },
    { q:"미분무의 치명적인 단점과 그 이유는?", a:"불이 꺼지는지 여부(살수밀도-소화성능 상관관계)에 대한 표준화된 데이터가 없어, 실물화재시험을 통해 설계자가 직접 성능을 증명해야 하는 성능설계 방식이라는 점이다." },
    { q:"미분무설비를 적용할 수 있는 장소의 전제조건은?", a:"실물화재시험으로 검증된 조건과 동일하게 실 구조·가연물 배치가 변경되지 않는 장소에만 적용 가능하다." }
  ]
};

    { q:"수막설비 노즐 3종(봉상·분무상·막상) 중 복사열차단 효과가 가장 큰 것은?", a:"막상노즐이다. 부채꼴로 얇게 넓게 퍼져 복사열차단 효과가 최대이나 바람 영향을 크게 받고 방수높이가 낮다." },
    { q:"수막설비에서 봉상노즐을 선택하는 경우는?", a:"방수높이가 높아 보호대상물의 높이가 높거나 바람이 많이 부는 장소에 유리하다(복사열차단 효과는 상대적으로 낮음)." },
    { q:"포의 구성 원리는?", a:"물(약 97%)과 포원액(약 3%)의 수용액에 공기를 주입해 형성하며, 안에는 공기, 바깥에는 물+약제로 구성되어 유면보다 가벼워 액면 위에 뜬다." },
    { q:"포소화약제의 주된 소화효과와 부수적 효과는?", a:"주된 효과는 질식(액면을 뒤덮어 산소공급 차단)이며, 물(97%)에 의한 냉각이 부수적 효과이다." },
    { q:"수성막포의 정의와 표면장력 수준은?", a:"계면활성제로 물의 표면장력을 12~20dyne/cm까지 낮춰 유류 표면에 얇은 수성막을 형성해 소화하는 약제이다(일반 포는 약 30dyne/cm)." },
    { q:"수성막포의 장단점은?", a:"표면장력이 낮아 확산력이 좋아 초기소화가 빠르나(유동성 우수), 표면장력이 약해 파포되기 쉬워 내열성이 떨어진다는 단점이 있다." },
    { q:"라인 프로포셔너의 혼합원리와 한계는?", a:"펌프-발포기 사이 혼합기의 벤추리 작용만으로 약제를 흡입하며, 압력손실이 커 흡입높이가 1.8m로 제한되고 혼합범위·속도가 낮아 소규모 탱크에만 사용한다." },
    { q:"펌프 프로포셔너 방식의 특징과 주 사용처는?", a:"펌프 토출측 바이패스를 혼합기로 보내 벤추리로 흡입 후 펌프로 재유입시키는 방식으로, 사이즈가 작아 화학소방차 전용으로 사용하며 포전용 펌프가 필요하다." },
    { q:"프레저 프로포셔너의 압입식과 압상식의 차이는?", a:"압입식은 다이어프럼(경막)으로 약제와 물을 분리해 재사용이 가능하고, 압상식은 경막 없이 물이 약제탱크를 직접 가압해 사용 후 잔량을 모두 비워야 한다." },
    { q:"프레저사이드 프로포셔너의 특징은?", a:"별도의 포약제 압입용 펌프로 강제 압입하는 방식으로 혼합범위·속도가 가장 크고 압력손실이 최소이며 장기보관이 가능하나, 설치비와 시설 규모가 가장 크다." },
    { q:"프레저사이드 프로포셔너에서 포약제 압입펌프의 토출압력 조건은?", a:"포약제 압입용 펌프의 토출압력이 급수(물) 펌프의 토출압보다 높아야 약제가 관내로 유입될 수 있다." },
    { q:"혼합범위·혼합속도가 가장 우수한 방식부터 순서대로 나열하면?", a:"프레저사이드 프로포셔너 > 프레저 프로포셔너(압입식) > 펌프 프로포셔너 > 라인 프로포셔너 순이다." }
  ]
};

    { q:"고정포방출구 Ⅲ형(표면하주입식)의 특징과 제약은?", a:"탱크 저부에서 포를 주입해 부력으로 떠오르는 방식으로 기름과 섞이지 않아야 하고(친수성 약제), 저장액체가 저점도여야 하며, 액체압을 이길 고배율 발포기가 필요하다." },
    { q:"고정포방출구 특형의 적용대상과 특징은?", a:"FRT 전용으로 굽도리판-실 사이 환상부에만 포를 방출하며, 화재부위가 한정돼 안전성이 높으나 탱크가 가열되면 파포가 잘 일어난다." },
    { q:"가지배관 방식의 단점 2가지는?", a:"테이블에 의한 설계로 여유율이 커 비경제적이며, 작동면적 내 압력·유량 편차가 크고, 헤드 소량 증설 시에도 배관을 대량 교체해야 한다." },
    { q:"그리드배관 방식이 압력손실을 줄이는 원리는?", a:"여러 경로로 유량이 분배되어 각 배관을 흐르는 유량이 작아지고(하젠-윌리엄스식 Q^1.85∝ΔP), 그만큼 마찰손실·압력손실이 감소한다." },
    { q:"그리드배관 방식을 건식·준비작동식에 사용하지 못하는 이유는?", a:"배관이 복잡하게 연결되어 헤드 개방 시 방수 도달까지 시간지연이 발생하기 때문에, 배관에 상시 물이 차 있는 습식에만 적용한다." },
    { q:"루프배관 방식과 그리드배관 방식의 차이는?", a:"루프배관은 교차배관끼리만 연결하고 가지배관은 서로 연결하지 않지만, 그리드배관은 교차배관과 가지배관을 모두 상호 연결해 경로가 3개 이상 존재한다." },
    { q:"고정포방출구 Ⅳ형(반표면하주입식)이 Ⅲ형과 다른 점은?", a:"특수호스가 담긴 호스컨테이너를 이용해 포에 밀려 액면까지 떠올라 방출하므로, 저장액체와의 친화성(섞임 여부)과 무관하게 적용할 수 있다." },
    { q:"가연성 액체가 인화점보다 높은 온도로 저장되어 기상부에 상시 가연성 혼합기를 형성하는 탱크는?", a:"CRT(콘루프탱크)이며, 경질유(인화점보다 저장온도가 높은 휘발성 액체)를 저장하는 경우 상시 가연성 혼합기가 형성된다." }
  ]
};

    { q:"배관이음 효율(E)값을 이음방식별로 쓰시오.", a:"무이음관 1.0, 전기저항용접 0.85, 가열맞대기용접 0.60이다." },

    { q:"CPVC의 LOI(한계산소지수) 값과 의미는?", a:"LOI가 60으로 일반 공기 중 산소농도(21%)보다 훨씬 높아 잘 타지 않고, 연소되더라도 산소 공급이 부족해 자연소화되는 난연성을 갖는다." },
    { q:"CPVC가 강관보다 우수한 소화배관 특성은?", a:"관 조도가 높아(C=150, 강관 C=120) 스케일이 거의 없고, 유연성이 좋아 충격·수격작용·지진에 대한 배관 파손 우려가 적다." },

    { q:"[88회] 건식벨브내의 프라이밍 워터(priming water)가 필요한 이유에 대하여 기술하시오.", a:"클래퍼 상하 압력차를 안정적으로 유지하고 클래퍼의 급격한 개방 충격을 완화하며, 클래퍼 시트의 밀폐를 보조해 오작동을 방지하기 위해 필요하다." },
    { q:"[88회] 소화배관내의 임의 지점을 통과하는 체적유량 또는 노즐로부터의 방출유량을 계산하는데 사용하는 식 Q=0.6597d²√p의 유도과정을 기술하시오.", a:"연속방정식과 베르누이 정리로 유속을 구한 뒤 오리피스 단면적(πd²/4)을 곱하고 유량계수·단위환산을 반영하면 Q=0.6597d²√P(K=0.6597Cd²) 형태로 정리된다." },
    { q:"[90회] 소화설비의 배관 내경이 10cm인 관로 상에 지름 2cm인 오리피스가 설치되었을 때 오리피스 전후의 압력수두 차이가 120mm일 경우의 유량을 계산하는 방법은?", a:"연속방정식으로 단면적비를 구하고 베르누이정리에 압력수두차를 대입해 유속을 산정한 뒤 오리피스 면적을 곱해 유량 Q=CA√(2gΔh)로 계산한다." },
    { q:"[99회] 기동용 수압 개폐장치 중 전자식 압력스위치의 특성 및 구조를 설명하고, 압력 챔버방식과 전자식 압력스위치 방식을 비교하여 설명하시오.", a:"전자식은 디지털 압력센서로 배관압력을 직접 감지해 정확도가 높고 응답이 빠르며, 압력챔버방식은 기계식 압력스위치와 챔버의 공기쿠션으로 맥동을 흡수하나 상대적으로 응답이 느리고 별도 공간이 필요하다." },
    { q:"[104회] 소화배관에서 기존 감압밸브의 문제점과 균압방지용 감압밸브 시스템에 대하여 설명하시오.", a:"기존 감압밸브는 유량 변화에 따라 2차측 압력이 불안정해지는 문제가 있어, 균압방지형(파일럿 제어 등)으로 유량 변동과 무관하게 2차측 압력을 일정하게 유지하도록 개선한다." },
    { q:"[111회] 수계소화설비에서 일반적으로 사용되는 밸브의 종류, 기능 및 사용처에 대하여 설명하시오.", a:"게이트밸브(개폐표시형, 공급차단), 글로브밸브(유량조절, 성능시험배관), 체크밸브(역류방지, 펌프토출측), 감압밸브(과압방지), 릴리프밸브(시스템 보호) 등으로 구분된다." },
    { q:"[114회] 스윙 체크밸브(Swing Check Valve)와 스모렌스키 체크밸브(Smolensky Check Valve)의 차이점과 용도는?", a:"스윙체크밸브는 단순 힌지구조로 역류만 방지하고, 스모렌스키체크밸브는 스프링 완충구조가 추가되어 밸브 폐쇄 시 수격작용을 방지하므로 펌프 토출측에 주로 사용한다." },
    { q:"[118회] 차압식 유량계의 유속측정 원리에 대하여 식을 유도하고 설명하시오.", a:"오리피스·벤추리 등으로 유로를 축소시켜 발생하는 전후 압력차를 베르누이 정리에 대입해 유속 V=√(2gΔP/γ)를 구하고, 이를 단면적에 곱해 유량을 산출하는 원리이다." },
    { q:"[122회] 소화설비의 배관에서 사용하는 게이트(Gate)밸브, 글로브(Globe)밸브, 체크(Check)밸브의 특징에 대하여 설명하시오.", a:"게이트밸브는 완전개방 시 손실이 적어 공급·차단용, 글로브밸브는 유량조절이 정밀해 성능시험용, 체크밸브는 역류방지용으로 각각 사용된다." },
    { q:"[126회] 스프링클러설비의 배관 경 설계에 적용하는 살수밀도-방호구역 면적 그래프에 대하여 설명하시오.", a:"위험도(경급·중급·상급)별로 살수밀도(세로축)와 방호(작동)구역 면적(가로축)의 관계를 나타낸 그래프로, 방호면적이 커질수록 요구 살수밀도는 낮아지는 경향을 가지며 수리계산 설계의 기초자료로 사용한다." },
    { q:"[129회] 옥내소화전 피토게이지 유량계산식 Q=0.653d²√10p를 유도하시오.", a:"베르누이정리와 연속방정식으로 유속을 구하고 방수구 단면적을 곱한 뒤, 유량계수와 단위(MPa)환산 상수를 반영하면 Q=0.653d²√10P 형태로 정리된다." },
    { q:"[129회] 스프링클러헤드 수평거리 3.2m/2.6m 조건에서 살수밀도를 계산하고 NFPA 등급을 고려한 적정성을 판단하는 방법은?", a:"S=2r·cosθ로 헤드간 거리를 구해 살수면적(S×S)을 산출한 뒤, 헤드 방수량을 살수면적으로 나누어 살수밀도를 계산하고, NFPA 위험등급별 요구 살수밀도 기준과 비교해 적정성을 판단한다." },
    { q:"[133회] 소방설비의 수계소화설비 등에 적용되는 감압방식에 대하여 ①감압이 필요한 이유 ②감압방식의 종류 및 특징 ③일반적으로 많이 사용하는 방식을 설명하시오.", a:"과압으로 인한 조기 소진·조작 곤란·배관 손상을 막기 위해 감압이 필요하며, 방식은 전용배관·부스터펌프·고가수조·감압밸브(오리피스)가 있고, 이 중 구조가 단순하고 저렴한 감압밸브(오리피스)방식이 가장 널리 사용된다." },
    { q:"[138회] KS B 2361 주강플랜지형밸브에서 밸브 호칭이 10K와 20K인 경우 최고허용압력은?", a:"10K는 약 1.0~1.6MPa 수준, 20K는 그 2배 수준인 약 2.0~3.2MPa 범위의 최고허용압력을 가지며, 호칭압력(K)이 클수록 배관 두께·플랜지 강도가 커진다." }
  ]
};

    { title:"2. 위험용도(화재가혹도) 분류와 면적밀도 표", blocks:[{ type:"p", text:"위험용도는 양적 요인(가연물의 양=화재하중, 적재높이)과 열적 요인(가연성 정도, 열방출률, 인화성·가연성 액체 존재 여부)을 함께 고려해 경급·중급1·중급2·상급으로 나눈다. 적재높이가 높을수록 가연물 표면과 천장 사이 거리가 가까워져 실링젯 온도가 높아지므로 더 위험한 용도로 분류된다." }, { type:"table", headers:["위험용도", "특징"], rows:[["경급(Light)", "가연물의 양·가연성 정도·열방출률이 모두 낮음"], ["중급1(OH-1)", "가연물 양·가연성 정도가 중간이며 적재높이 2.3m 이하"], ["중급2(OH-2)", "중급1보다 위험도가 높고 적재높이 3.7m 이하"], ["상급(Extra Hazard)", "가연물 양·가연성 정도·열방출률이 모두 높고, 인화성·가연성 액체를 다량 저장"]] }, { type:"p", text:"면적밀도 그래프는 2022년 개정으로 폐지되고, 위험용도별 두 점(낮은 작동면적-높은 살수밀도 / 높은 작동면적-낮은 살수밀도) 중 하나만 선택하는 면적밀도 표로 바뀌었다. 최고 작동면적은 280㎡이며, 나머지는 140~230㎡ 구간에서 결정된다. 가연성 은폐공간(천장 위·벽체 안쪽 등 헤드 살수범위 밖에서 가연물이 존재할 수 있는 공간)이 있는 경우에는 살수밀도를 낮추더라도 작동면적을 넓히는 점을 선택하고, 없으면 살수밀도를 높이고 작동면적을 좁히는 점을 선택한다. 두 점만 남긴 이유는 설계자가 임의로 경제적인 점만 골라 설계하는 것을 방지하기 위함이다." }] },
    { title:"3. 수리계산 절차 (배관·헤드 배치)", blocks:[{ type:"ul", items:["① 위험용도 결정(경급·중급1·중급2·상급) → 면적밀도 표에서 살수밀도·작동면적 선택", "② 설계면적 형태 결정: 장변 = 1.2×√A(A=작동면적)인 직사각형", "③ 설계면적 내 헤드수 산출: 설계면적 ÷ 헤드 1개 방호면적(헤드간거리×가지배관간거리)", "④ 길이방향 헤드수 = 장변길이 ÷ 헤드간거리, 폭 = 작동면적 ÷ 실제 길이", "⑤ 첫(말단) 헤드 유량 Q = A(헤드 1개 방호면적) × D(살수밀도)", "⑥ 첫 헤드 압력: Q = K√P → P 산출", "⑦ 말단 헤드~다음 헤드 사이 하젠윌리엄스 마찰손실 계산 → 다음 헤드 압력(P1+ΔP1) → 유량 재계산", "⑧ 교차배관 좌우 헤드수가 다르면 유량비 Q1/Q2 = √(P1/P2)로 보정", "⑨ 이 과정을 가압송수장치(펌프) 또는 시수 연결부까지 반복 후 낙차(높이)를 보정하여 최종 필요 양정을 산출"] }, { type:"callout", text:"현재는 컴퓨터 프로그램으로 계산하므로 시험에서 전체 수계산 문제는 출제되지 않지만, 계산 절차 자체(각 단계의 논리)는 서술형으로 자주 출제된다." }] },
    { title:"4. 분말소화약제 구비조건과 종류별 반응식", blocks:[{ type:"p", text:"분말은 고체이므로 비중이 기체보다 무거워 뿌리면 가라앉는다. 따라서 분말이 표면 아래로 가라앉기 전에 소화를 완료해야 하며, 이를 넉다운 효과의 전제조건이라 한다. 이를 위해 미세도(입자가 작을수록 표면적 증가로 소화 증대), 내습성(수분을 흡수하면 입자끼리 뭉쳐 유동성이 감소하므로 습기에 강해야 함), 유동성(균일하게 혼합·방사), 비고화성(약제통 내에서 굳지 않아야 함), 낮은 겉보기비중(=미세함), 무독성, 비침강성(침강시험)의 구비조건을 갖춰야 한다." }, { type:"table", headers:["종류", "주성분", "적응화재", "분해반응식(핵심)"], rows:[["1종분말", "NaHCO3(중탄산나트륨)", "B·C급", "270℃: 2NaHCO3→Na2CO3+CO2+H2O / 850℃: 2NaHCO3→Na2O+2CO2+H2O"], ["2종분말", "KHCO3(중탄산칼륨)", "B·C급", "1종과 동일 구조(Na→K), 더 낮은 온도에서 분해되어 소화가 빠르고 부촉매효과가 1종보다 1.5~2배 우수하나 고가라 잘 쓰이지 않음"], ["3종분말", "NH4H2PO4(제1인산암모늄)", "A·B·C급", "166℃: NH4H2PO4→NH3+H3PO4(올소인산) / 216℃: 2H3PO4→H4P2O7(피로인산)+H2O / 360℃: H4P2O7→2HPO3(메타인산)+H2O"]] }, { type:"p", text:"소화효과는 공통적으로 부촉매(연쇄반응억제: Na가 OH라디칼과 결합해 NaOH, 다시 H라디칼과 결합해 Na+H2O로 반응 종료), 질식(CO2·H2O 방출로 산소차단), 냉각(H2O 증발잠열), 희석, 넉다운효과(불꽃을 입체적으로 포위해 10~20초 내 소화)를 갖는다. 3종분말만 A급 적응성을 갖는 이유는 탄화탈수효과(올소인산이 목재 주성분인 셀룰로오스를 불연성 탄소와 물로 분해)와 방진작용(최종 생성물인 메타인산이 유리상 피막을 형성해 숯 표면을 덮어 산소 공급을 차단, 재연소 방지)에 있다." }] },
    { title:"5. 주기율표에 기반한 소화 메커니즘 이해", blocks:[{ type:"p", text:"주기율표의 족(세로)은 물질의 특성(최외각 전자수)을, 주기(가로)는 전자껍질수(=전기음성도와 반비례)를 나타낸다. 1족(알칼리금속)·7족(할로겐)은 최외각 전자가 부족해 반응성이 좋고, 8족(불활성기체)은 최외각 전자가 안정(2개 또는 8개)되어 반응하지 않는다. 주기가 짧을수록(위쪽, F·Cl 등) 전자껍질이 적어 전기음성도가 높고 결합력이 세므로 물리적 냉각소화가 주된 소화효과이며, 주기가 길수록(아래쪽, Br·I 등) 전자껍질이 많아 결합력이 약해 화학적 연쇄반응억제(라디칼 포착이론)가 주된 소화효과가 된다. 분말의 Na·K도 1족 알칼리금속으로서 화점에서 라디칼과 결합해 연쇄반응을 종료시키는 부촉매 소화가 주된 효과이다." }] }
  ],
  cards:[
    { q:"규약배관 방식과 수리계산 방식의 가장 근본적인 설계개념 차이는?", a:"규약배관은 표준화재를 가정해 헤드 개수별로 미리 정해진 테이블(표)로 배관경을 결정하지만, 수리계산은 화재가혹도(위험용도)를 먼저 정량적으로 산정한 뒤 유량·압력·배관경을 계산으로 결정한다." },
    { q:"규약배관 방식의 대표적인 단점 두 가지는?", a:"시방위주로 여유율을 과다하게 두어 비경제적이며, 화재가혹도가 큰 장소에서는 스키핑이 발생할 수 있고, 헤드를 소규모로 증설해도 배관 전체를 교체해야 하는 경우가 생긴다." },
    { q:"수리계산 방식에서 위험용도를 결정하는 요인은 무엇인가?", a:"양적 요인(가연물의 양=화재하중, 적재높이)과 열적 요인(가연성 정도, 열방출률, 인화성·가연성 액체 존재 여부)을 종합해 경급·중급1·중급2·상급으로 구분한다." },
    { q:"중급1과 중급2를 구분하는 적재높이 기준은?", a:"중급1은 적재높이 2.3m 이하, 중급2는 3.7m 이하이며, 적재높이가 높을수록 가연물 표면과 천장 간 거리가 가까워 실링젯 온도가 높아지므로 더 위험하게 분류된다." },
    { q:"면적밀도 그래프가 면적밀도 표로 바뀐 이유는?", a:"설계자가 임의로 경제적인 지점만 골라 설계(살수밀도를 낮추고 작동면적을 좁히는 방향)하는 것을 방지하기 위해, 위험용도별로 두 점(높은 살수밀도-좁은 작동면적 / 낮은 살수밀도-넓은 작동면적) 중 하나만 선택하도록 제한했다." },
    { q:"가연성 은폐공간이 있을 때 면적밀도 표에서 어느 점을 선택해야 하는가?", a:"천장 위·벽체 안쪽 등 헤드 살수범위 밖에 가연물이 존재할 수 있으므로, 살수밀도는 낮추더라도 작동면적을 넓히는 점을 선택해 더 넓은 범위에 스프링클러가 작동하도록 한다." },
    { q:"수리계산 방식에서 설계면적의 형태는 어떻게 결정되는가?", a:"한쪽 면이 긴 직사각형 형태로 결정되며, 장변의 길이는 1.2×√A(A는 작동면적)이다." },
    { q:"수리계산 절차에서 첫(말단) 헤드의 유량은 어떻게 계산하는가?", a:"Q = A × D (A는 헤드 1개가 방호하는 면적, D는 면적밀도 표에서 결정된 살수밀도)로 계산한다." },
    { q:"수리계산에서 헤드 간 마찰손실은 무엇으로 계산하며, 순서는 어떻게 되는가?", a:"하젠윌리엄스식으로 계산하며, 말단 헤드의 유량·압력을 먼저 구한 뒤 다음 헤드까지의 마찰손실을 더해 압력을 구하고, 그 압력으로 다음 헤드의 유량을 다시 계산하는 과정을 펌프(또는 시수연결부)까지 반복한다." },
    { q:"교차배관을 사이에 두고 좌우 헤드수가 다를 때 유량은 어떻게 보정하는가?", a:"Q=K√P 관계에서 Q1/Q2=√(P1/P2)의 비례관계를 이용해 유량을 보정한다." },
    { q:"수리계산 방식이 화재안전 측면에서 갖는 장점과 실무상 단점은?", a:"정량적·경제적 설계와 건물 특성 반영으로 신뢰도가 높다는 장점이 있으나, 설계자의 노하우와 컴퓨터 프로그램이 필요하고 설계시간이 많이 소요되는 단점이 있다." },
    { q:"분말소화약제의 구비조건 중 미세도와 겉보기비중의 관계는?", a:"겉보기비중이 작을수록 분말 입자가 미세하다는 뜻이며, 미세할수록 표면적이 커져 소화효과가 증대된다." },
    { q:"분말이 내습성을 갖춰야 하는 이유는?", a:"수분을 흡수하면 입자끼리 서로 달라붙어 유동성이 감소하고 균일한 방사가 어려워지기 때문이다." },
    { q:"1종분말(NaHCO3)의 270℃ 분해반응식은?", a:"2NaHCO3 → Na2CO3 + CO2 + H2O" },
    { q:"3종분말(NH4H2PO4)의 3단계 분해반응식을 온도순으로 쓰시오.", a:"166℃: NH4H2PO4→NH3+H3PO4(올소인산), 216℃: 2H3PO4→H4P2O7(피로인산)+H2O, 360℃: H4P2O7→2HPO3(메타인산)+H2O" },
    { q:"3종분말이 A급 화재에 적응성을 갖는 이유는?", a:"탄화탈수효과(올소인산이 셀룰로오스를 불연성 탄소와 물로 분해해 연소를 차단)와 방진작용(메타인산이 유리상 피막을 형성해 숯 표면을 덮어 산소 공급을 차단)이 결합되어 A급 화재에도 소화·재연소방지 효과를 낸다." },
    { q:"1종분말과 2종분말의 소화력 차이 및 2종분말이 널리 쓰이지 않는 이유는?", a:"2종분말(KHCO3)이 1종분말보다 부촉매효과가 1.5~2배 우수하지만 가격이 비싸 실제로는 3종분말이 더 널리 쓰인다." },
    { q:"분말소화약제의 넉다운효과란 무엇인가?", a:"화염 주위에 약제를 방사해 불꽃을 입체적으로 포위하고 연쇄반응억제(주된 효과)와 냉각·질식(부수적 효과)에 의해 10~20초 이내에 순식간에 소화하는 현상이다." },
    { q:"주기율표에서 전자껍질수가 적을수록(주기가 짧을수록) 소화 메커니즘이 어떻게 달라지는가?", a:"전기음성도가 높아 결합력이 세지므로 화학반응을 통한 연쇄반응억제가 어려워지고, 대신 물리적인 냉각소화가 주된 소화효과가 된다." },
    { q:"라디칼 포착이론이란 무엇인가?", a:"1족·7족처럼 최외각 전자가 부족한 원소가 연소 중인 라디칼(OH·H 등)과 결합해 반응을 안정화시킴으로써 연쇄반응을 종료시키는 소화 메커니즘이다." },
    { q:"분말소화약제가 3종분말을 주로 사용하는 이유를 종합하면?", a:"3종분말(NH4H2PO4)만 A·B·C급 전 화재에 적응성을 가지며(탄화탈수·방진작용), 1·2종분말은 B·C급에 국한되고 2종은 고가이기 때문에 범용 소화기·소화설비는 대부분 3종분말을 사용한다." }
  ]
};

  type:"concept",
  label:"분말소화약제 비누화현상·CDC(트윈에이전트) 소화약제, 이산화탄소 소화설비 상평형도(승화점·삼중점)·고압식/저압식 액상저장 비교, 줄톰슨효과·운상현상·저온손상, CO2 소화특성 및 안전시설",
  sub:"분말의 비누화현상(유지화재 금속비누·글리세롤 생성)과 CDC(트윈에이전트, 3종분말+수성막포) 소화약제의 원리·적용대상, 이산화탄소 상평형도의 승화점(-79℃/1atm)·삼중점(-56.5℃/5.1atm)과 고압식(20℃/6MPa)·저압식(-18℃/2.1MPa) 저장방식 비교, 줄톰슨효과(단열교축팽창)에 의한 온도급강하와 운상현상(드라이아이스 재결정)·저온손상, CO2의 질식·냉각 소화특성과 인체위험성(자체흡입·질식·저온), 음향경보·부취제·시간지연장치 등 안전시설",
  notes:[
    { title:"1. 분말 비누화현상과 CDC(트윈에이전트) 소화약제", blocks:[{ type:"p", text:"비누화 현상은 유지(기름)화재에서 알칼리금속(Na·K)이 지방산과 반응해 금속비누와 글리세롤을 생성하는 반응이며, 이 금속비누가 유지 표면에 피막을 형성해 산소 공급을 차단하는 질식소화 효과를 낸다." }, { type:"p", text:"CDC(Compatible Dry Chemical)는 두 가지 약제를 함께 사용하는 트윈 에이전트 시스템으로, 대표적으로 트윈 20/20(3종분말 20kg + 수성막포 20L)이 있다. 수성막포의 낮은 표면장력에 의한 빠른 유동성(화점 신속 도달)과 3종분말의 빠른 소화력(연쇄반응억제)을 결합해, 소화가 빠르면서도 포가 쉽게 깨지지 않는(파포지연) 장점을 갖는다. 화학적 소화(연쇄반응억제)와 질식·냉각·방진·탈탄 효과를 모두 가지며, 유출류화재·항공기 불시착 화재 등에 사용되나 최근은 독성 문제로 잘 쓰이지 않는다." }, { type:"callout", text:"분말 방출을 위한 정압작동장치에는 압력스위치식(설정압력 도달 시 밸브 개방)·시한릴레이식(설정시간 후 개방)·기계식(기계적 힘으로 개방)이 있다." }] },
    { title:"2. 이산화탄소의 상평형도와 저장방식", blocks:[{ type:"p", text:"CO2는 -79℃·1atm에서 승화점을 가져 대기압 상태에서는 고체(드라이아이스)와 기체만 존재하고 액체 상태를 볼 수 없다. -56.5℃·5.1atm의 삼중점에서는 고체·액체·기체가 상존한다. 소화설비의 약제통을 작게 유지하려면 액체로 저장해야 하므로, 압력을 가해 액화 저장한다." }, { type:"table", headers:["구분", "고압식", "저압식"], rows:[["저장조건", "20℃에서 6MPa(60배) 압력으로 액상 저장", "-18℃에서 2.1MPa(21배) 압력으로 액상 저장"], ["저장용기", "68L 용기에 45kg 충전, 여러 병을 병렬로 배치", "대형 탱크 1개(냉동장치 필요)"], ["설치 제한", "방호구역이 다수·다량일 때 용기 저장실 제한 없이 적용", "저장실 설치가 제한적(대형 소방대상물용)"], ["장점", "관리·설치 용이, 이동·재충전 편리, 방출거리 김, 냉동기 불필요", "스케줄40 배관(저압배관) 사용 가능, 대량저장 시 부자재비 절감, 저장고 바닥면적 작음"], ["단점", "고압배관(스케줄80) 필요, 저장고 바닥면적 큼", "냉동장치 필요(영하 18℃ 유지), 방출거리 짧음, 이동·재충전 불편, 유지관리 어려움"]] }] },
    { title:"3. 줄톰슨효과와 운상현상", blocks:[{ type:"p", text:"압축·액화 저장된 CO2가 좁은 구멍(노즐)을 통해 대기 중으로 방출되면 단열교축팽창(줄톰슨효과)에 의해 온도가 급격히 떨어진다. 고압식은 약 -63℃, 저압식은 약 -46℃까지 하강한다. 이후 액체가 기화되며 주변 열을 추가로 빼앗아 최종적으로 -83℃ 부근까지 온도가 떨어진다." }, { type:"p", text:"이렇게 급강하한 CO2 중 일부는 기화되지 못하고 드라이아이스(고체)로 재결정화되어 눈처럼 하얗게 보이는데, 이를 운상현상이라 한다. 고압식은 약 25%, 저압식은 약 45% 정도가 드라이아이스로 변한다. 운상현상의 문제점은 시야(가시도)가 확보되지 않아 피난·소화활동에 지장을 준다는 점이다. 이러한 저온 방출은 인체에 저온손상(동상)을 유발할 수 있어 안전상 유의해야 한다." }] },
    { title:"4. CO2 소화특성과 인체위험성·안전시설", blocks:[{ type:"p", text:"CO2는 질식소화(설계농도 34~75%, 산소농도를 15% 이하로 저하시켜 소화)와 냉각소화(승화 시 주변 열량을 흡수)를 주된 소화효과로 한다. 방사 후 잔유물이 남지 않아 청정성이 있으나, 냉각효과가 상대적으로 약해 재발화 우려가 있고 전기 비전도성이라 C급 화재에 적응성이 있다." }, { type:"table", headers:["위험 구분", "인체 영향"], rows:[["자체흡입효과", "CO2 농도 2%에서 불쾌감, 10%에서 의식상실, 20%에서 단시간 사망"], ["질식효과", "산소농도가 6~14%까지 저하, 산소 6%에서는 5분 이내 사망"], ["저온손상", "줄톰슨효과·기화잠열로 인해 -83℃까지 급강하하여 인체 동상 위험"]] }, { type:"p", text:"이 때문에 CO2는 사람이 상주하는 곳에는 설치할 수 없으며(최대허용설계농도 개념 자체가 존재하지 않음), 방출 시 음향경보장치·위험경고표지·부취제(무취가스에 냄새를 첨가해 누설 인지)·시간지연장치(약 30초~1분, 대피시간 확보)를 반드시 설치해야 한다." }] }
  ],
  cards:[
    { q:"비누화 현상의 메커니즘과 소화효과는?", a:"유지화재에서 알칼리금속(Na·K)이 지방산과 반응해 금속비누와 글리세롤을 생성하며, 생성된 금속비누가 유지 표면에 피막을 형성해 산소 공급을 차단하는 질식소화 효과를 낸다." },
    { q:"CDC(트윈에이전트) 소화약제의 구성과 장점은?", a:"3종분말과 수성막포를 함께 사용하는 방식(예: 트윈20/20)으로, 수성막포의 빠른 유동성과 3종분말의 빠른 소화력을 결합해 신속한 소화와 파포지연의 장점을 동시에 갖는다." },
    { q:"CDC 소화약제의 주요 적용대상은?", a:"유출류화재, 항공기 불시착 화재 등 신속한 소화와 재발화방지가 모두 필요한 장소이나, 독성 문제로 최근은 잘 사용되지 않는다." },
    { q:"CO2의 승화점과 삼중점 조건은?", a:"승화점은 -79℃·1atm(고체↔기체, 드라이아이스), 삼중점은 -56.5℃·5.1atm(고체·액체·기체 공존)이다." },
    { q:"CO2 고압식과 저압식의 저장조건은?", a:"고압식은 20℃에서 6MPa(60배)로, 저압식은 -18℃에서 2.1MPa(21배)로 각각 액상 저장한다." },
    { q:"CO2 저압식이 대형 소방대상물에 적합한 이유는?", a:"대형 탱크 1개로 대량 저장이 가능해 저장고 바닥면적이 작고 스케줄40 저압배관을 쓸 수 있어 대량 저장 시 부자재비가 절감되기 때문이다." },
    { q:"CO2 저압식의 단점은 무엇인가?", a:"-18℃를 유지하기 위한 별도 냉동장치가 필요하고, 방출거리가 짧으며, 이동·재충전이 불편하고 유지관리가 어렵다." },
    { q:"줄톰슨효과란 무엇이며 CO2 방출 시 온도는 얼마나 떨어지는가?", a:"압축된 기체가 좁은 구멍을 통해 대기 중으로 급격히 방출될 때 단열교축팽창에 의해 온도가 급강하하는 현상으로, 고압식은 약 -63℃, 저압식은 약 -46℃까지 떨어진다." },
    { q:"운상현상이란 무엇이며 발생 비율은?", a:"방출된 CO2 중 일부가 기화하지 못하고 드라이아이스로 재결정화되어 하얗게 보이는 현상으로, 고압식은 약 25%, 저압식은 약 45%가 드라이아이스로 변한다." },
    { q:"운상현상의 문제점은?", a:"방출된 CO2가 하얗게 보이면서 가시도(시야)가 저하되어 피난 및 소화활동에 지장을 줄 수 있다." },
    { q:"CO2 방출 시 최종 도달 온도와 그 원인은?", a:"줄톰슨효과에 의한 압력강하와 액체가 기화하며 주변 열을 빼앗는 기화잠열 흡수가 결합되어 약 -83℃까지 온도가 급강하한다." },
    { q:"CO2의 주된 소화효과 두 가지는?", a:"질식소화(설계농도 34~75%로 산소농도를 15% 이하로 저하)와 냉각소화(승화 시 주변 열량 흡수)이다." },
    { q:"CO2 자체흡입효과에서 농도별 인체 영향은?", a:"2%에서 불쾌감, 10%에서 의식상실, 20%에서 단시간 사망에 이른다." },
    { q:"CO2 질식효과에서 산소농도 6%에 노출되면 어떻게 되는가?", a:"산소농도가 6%까지 저하되면 5분 이내에 사망할 수 있다." },
    { q:"CO2가 사람이 상주하는 곳에 설치될 수 없는 이유는?", a:"질식효과가 소화의 기반 메커니즘이라 방출 시 산소농도가 급격히 낮아지므로, 최대허용설계농도라는 개념 자체가 존재하지 않고 사람이 있는 곳에는 사용할 수 없다." },
    { q:"CO2 소화설비의 시간지연장치는 왜 필요한가?", a:"약제 방출 전 방호구역 내 사람이 대피할 수 있는 충분한 시간(약 30초~1분)을 확보하기 위해 설치한다." },
    { q:"CO2 소화설비에 부취제가 필요한 이유는?", a:"CO2는 원래 무취가스이므로, 냄새를 첨가해 방호구역 내 약제 누설을 후각으로 인지할 수 있도록 하기 위해서이다." },
    { q:"CO2 소화설비의 청정성이 갖는 의미는?", a:"방사 후 잔유물이 남지 않아 정밀기계·전기장비 등을 분해·세척할 필요가 없다는 뜻이며, 분말소화약제와 대비되는 장점이다." },
    { q:"CO2 소화의 냉각효과가 상대적으로 약한 이유가 갖는 실무적 의미는?", a:"가연물을 인화점 이하로 충분히 냉각시키지 못해 재발화 우려가 있으므로, 긴 설계농도 유지시간을 확보해 재발화를 방지해야 한다." },
    { q:"CO2 소화설비의 저온손상 위험이 발생하는 원리는?", a:"줄톰슨효과에 의한 단열교축팽창과 액체의 기화잠열 흡수가 복합적으로 작용해 방호구역 온도가 -83℃ 부근까지 급강하하면서 인체에 동상을 일으킬 수 있다." }
  ]
};

  sub:"CO2 저장용기 설치기준(40℃이하·3cm간격·체크밸브)과 자동·수동 기동장치(가스압력식 니들밸브/전기식 솔레노이드), 교차회로방식의 목적(비화재보 시 설비 오동작방지)과 축적기능 감지기 금지 이유, 베이퍼딜레이타임(저압식 CO2의 액상방출 지연)의 영향인자와 대책, 표면화재·심부화재 약제량 산정식(체적당 약제량 체감·개구부가산)과 누설약제량 산출관계식, 할론1301(CF3Br)의 연쇄반응억제·오존파괴 메커니즘과 몬트리올의정서·할론뱅크제",
  notes:[
    { title:"1. CO2 저장용기 설치기준과 기동장치", blocks:[{ type:"ul", items:["방호구역 외의 장소에 설치(부득이할 경우 피난구 부근)", "온도 40℃ 이하, 온도 변화가 적은 곳", "직사광선·빗물 침투 우려가 없는 곳", "방화문으로 구획된 실에 설치, 설치장소 표지 부착", "점검에 지장 없도록 3cm 이상 간격 유지", "저장용기와 집합관을 연결하는 배관에는 체크밸브 설치(역류 방지)"] }, { type:"p", text:"기동장치는 자동기동(교차회로방식 감지기 연동)과 수동기동을 모두 갖춰야 한다. 가스압력식은 기동용가스용기(내압시험압력 25MPa 이상, 내용적 5L 이상, 질소 등 비활성기체를 6MPa 이상 충전)의 가스가 솔레노이드밸브 작동으로 방출되어 선택밸브를 열고, 이어 각 저장용기의 니들밸브를 밀어 개방시키는 방식이다. 전기식은 약제통에 직접 솔레노이드밸브를 부착해 전기신호로 개방하는 방식으로, 한 병의 약제가 나머지 병을 열어줄 힘이 부족할 수 있어 최소 2병 이상에 솔레노이드밸브를 설치해야 한다." }, { type:"callout", text:"교차회로방식의 목적은 비화재보(단일 감지기 오작동)를 막는 것이 아니라, A·B 두 감지기가 모두 작동해야만 설비(약제방출 등)가 연동되게 함으로써 설비의 오동작을 방지하는 것이다. 두 회로가 모두 작동해야 하므로 시간지연이 불가피해, 축적기능이 있는 감지기를 사용하면 안 된다." }] },
    { title:"2. 베이퍼 딜레이 타임(Vapor Delay Time)", blocks:[{ type:"p", text:"저압식 CO2는 저장온도(-18℃)와 배관(상온) 간 온도차, 그리고 방출 시작점의 압력강하로 인해 배관 전방에서 일부 약제가 먼저 증기(vapor)로 변한다. 이 증기가 부피를 키워 마찰손실을 증가시키므로, 뒤따라오는 액상 약제의 방출이 지연되는데 이를 베이퍼 딜레이 타임이라 한다." }, { type:"table", headers:["영향인자", "베이퍼 딜레이 타임에 미치는 영향"], rows:[["배관의 중량·비열(열용량)", "클수록 길어짐"], ["배관의 온도", "높을수록 길어짐"], ["저장된 CO2의 온도", "낮을수록(배관과 온도차가 클수록) 길어짐"], ["2차측 배관 내용적", "클수록 길어짐"], ["설계 유량", "작을수록 길어짐(유량이 클수록 짧아짐)"]] }, { type:"p", text:"문제점은 초기 액상 방출이 지연되어 초기 냉각·질식효과가 떨어지고, 단위시간당 초기 약제량이 부족해져 균일한 설계농도에 빨리 도달하기 어렵다는 점이다. 압력드롭 자체는 저압 저장방식을 유지하는 한 피할 수 없으므로 대책이 될 수 없고, 대신 배관 단열재 시공·이중관 설치·2차측 배관 내용적 축소 등 배관-약제 간 온도차를 줄이는 방향으로 대책을 세운다." }] },
    { title:"3. CO2 약제량 산정: 표면화재·심부화재", blocks:[{ type:"p", text:"물을 뿌리는 설비(스프링클러 등)는 바닥면적×단위방사량으로 약제량을 계산하지만, CO2는 부력을 이기지 못해 침투소화가 불가능하므로 방호공간 전체를 기체로 채워야 한다. 따라서 약제량 W = 방호구역 체적(V) × 체적당 약제량 + 개구부가산량으로 산정한다." }, { type:"table", headers:["방호구역 체적", "체적당 약제량(경향)"], rows:[["45㎥ 미만", "1.0kg/㎥(최소 45kg 이상, 약제 1병 기준)"], ["체적 증가", "215㎥, 1,450㎥ 구간을 지나며 0.9 → 0.8 → 0.75kg/㎥로 점차 감소"]] }, { type:"p", text:"체적이 커질수록 체적당 약제량이 줄어드는 이유는, 단위체적당 표면적비(면적/체적)가 커질수록 벽면에 붙어있는 개구부의 면적비가 상대적으로 작아지기 때문이다(정육면체 한 변이 커질수록 부피 대비 표면적 비율이 감소하는 것과 같은 원리). 개구부가 상대적으로 작아지면 누설 약제량도 적어지므로 체적당 필요 약제량이 줄어든다." }, { type:"p", text:"개구부가 자동폐쇄되지 않아 차단이 불가능한 경우, 표면화재는 5kg/㎡, 심부화재는 10kg/㎡을 개구부 면적에 곱해 추가로 가산한다. 누설 약제량 산출관계식은 토리첼리 정리(V=√2gH)에서 유도되며, 질량유량 = ρ×A×V의 형태로 정리된다." }] },
    { title:"4. 할론1301 개요와 오존파괴, 할론뱅크제", blocks:[{ type:"p", text:"할론1301(CF3Br)은 화재 시 열에너지를 받아 CF3와 Br로 분해되며, Br이 H라디칼을 포착해 HBr이 되고 다시 HBr이 OH라디칼을 포착해 Br + H2O로 반응이 종료되는 연쇄반응억제(부촉매)가 주된 소화 메커니즘이다." }, { type:"p", text:"문제는 이 Br의 반응성이 매우 좋아 성층권에서 오존(O3)과 반응해 BrO를 생성하고, BrO가 다시 산소원자(O)를 포착해 Br과 O2로 분리되는 반응을 촉매처럼 반복하면서 오존이 재생성되지 못하게 방해한다는 점이다(오존층 파괴). 이 때문에 몬트리올의정서에 따라 할론의 신규 생산이 금지되었다." }, { type:"p", text:"기존에 설치된 할론은 회수하여 분석 후, 재사용이 가능하면 필수 사용처(불가피한 항공기·군사시설 등)에 재사용하고, 재사용이 불가능하면 대기 중 폐기(오존층 파괴) 대신 저장(짱박아 두기)하는데, 이 저장 제도를 할론뱅크제라 한다. 기존 할론을 회수한 자리에는 할로겐화합물·불활성기체·미분무소화설비 등 대체 소화설비를 설치한다." }] }
  ],
  cards:[
    { q:"CO2 저장용기의 설치 온도 기준은?", a:"40℃ 이하이고 온도 변화가 적은 곳에 설치해야 한다." },
    { q:"CO2 저장용기와 집합관 연결배관에 체크밸브를 설치하는 이유는?", a:"방출된 약제가 다른 저장용기 쪽으로 역류하지 않고 집합관을 거쳐 방호구역으로만 흐르도록 하기 위해서이다." },
    { q:"가스압력식 기동장치의 작동 순서는?", a:"감지기 작동 → 솔레노이드밸브가 기동용가스용기의 봉판을 뚫어 기동용가스 방출 → 기동용가스가 선택밸브를 개방 → 저장용기의 니들밸브를 밀어 약제 방출." },
    { q:"전기식 기동장치에서 최소 2병 이상에 솔레노이드밸브를 설치해야 하는 이유는?", a:"전기식은 약제 자체의 압력으로 나머지 저장용기를 개방시키는데, 저장용기 수가 많으면 한 병만으로는 나머지를 모두 열 힘이 부족하므로 최소 2병 이상에 솔레노이드밸브를 설치한다." },
    { q:"교차회로방식의 진짜 목적은 무엇인가?", a:"단일 감지기의 비화재보를 막는 것이 아니라, A·B 두 감지기가 모두 작동해야만 소방설비가 연동되게 하여 설비 자체의 오동작을 방지하는 것이다." },
    { q:"교차회로방식에서 축적기능이 있는 감지기를 사용하면 안 되는 이유는?", a:"이미 두 회로가 모두 작동해야 하는 구조로 시간지연이 발생하는데, 축적기능까지 더해지면 지연시간이 과도하게 길어지기 때문이다." },
    { q:"베이퍼 딜레이 타임이란 무엇인가?", a:"저압식 CO2에서 배관 전방에 증기(vapor)가 생성되어 부피가 늘어나면서 마찰손실이 커져, 뒤따르는 액상 약제의 방출이 지연되는 시간이다." },
    { q:"베이퍼 딜레이 타임이 길어지는 조건 세 가지는?", a:"배관의 중량·비열이 클수록, 배관 온도가 높을수록, 저장된 CO2 온도가 낮을수록(배관과 온도차가 클수록) 길어진다." },
    { q:"베이퍼 딜레이 타임의 대책으로 압력드롭 감소를 제시할 수 없는 이유는?", a:"저압 저장방식 자체를 유지하는 한 방출 시 압력강하는 불가피하므로, 압력드롭 감소는 근본 대책이 될 수 없고 배관-약제 간 온도차를 줄이는 방향의 대책만 유효하다." },
    { q:"베이퍼 딜레이 타임의 대책 세 가지는?", a:"배관 단열재 시공, 이중관 설치, 2차측 배관 내용적 축소이다." },
    { q:"CO2 약제량 산정식의 기본 골격은?", a:"약제량 W = 방호구역 체적(V) × 체적당 약제량 + 개구부가산량(자동폐쇄되지 않는 개구부 면적 × 표면화재 5kg/㎡ 또는 심부화재 10kg/㎡)." },
    { q:"방호구역 체적이 커질수록 체적당 약제량이 작아지는 이유는?", a:"체적이 커질수록 단위체적당 표면적(개구부가 위치하는 벽면) 비율이 상대적으로 작아지므로, 개구부를 통한 누설 약제량 비율도 작아지기 때문이다." },
    { q:"표면화재와 심부화재의 개구부 가산량 기준은?", a:"표면화재는 5kg/㎡, 심부화재는 10kg/㎡을 개구부 면적에 곱해 가산한다." },
    { q:"CO2 누설 약제량 산출관계식은 어떤 원리에서 유도되는가?", a:"토리첼리 정리(유출속도 V=√2gH)에서 유도되며, 질량유량은 ρ×A×V의 형태로 정리된다." },
    { q:"할론1301의 화학식과 주된 소화 메커니즘은?", a:"CF3Br이며, 화점에서 CF3와 Br로 분해된 뒤 Br이 H라디칼을, 다시 HBr이 OH라디칼을 포착해 연쇄반응을 종료시키는 부촉매(연쇄반응억제) 소화가 주된 메커니즘이다." },
    { q:"할론1301이 오존층을 파괴하는 메커니즘은?", a:"방출된 Br이 성층권에서 오존(O3)과 반응해 BrO를 생성하고, BrO가 다시 산소원자를 포착해 Br과 O2로 재분리되는 반응을 촉매처럼 반복하며 오존의 재생성을 방해한다." },
    { q:"할론 생산·사용을 규제한 국제협약은?", a:"몬트리올의정서이며, 이에 따라 오존층 파괴물질인 할론의 신규 생산이 금지되었다." },
    { q:"할론뱅크제란 무엇인가?", a:"기존에 설치된 할론 용기를 회수해 분석한 뒤, 재사용이 가능하면 필수 사용처에 재사용하고 불가능하면 대기 중 폐기 대신 저장(뱅크)하여 오존층 파괴를 방지하는 제도이다." },
    { q:"할론을 철거한 자리에는 어떤 소화설비로 대체하는가?", a:"할로겐화합물 소화설비, 불활성기체 소화설비, 미분무소화설비 등으로 대체한다." }
  ]
};

  sub:"할로겐화합물 명명법(탄소-수소-불소 순서 표기)과 불활성기체 IG계열(질소·아르곤·이산화탄소 조성비) 구성, 치환·무유출(전농도 단시간 방사)·자유출(고농도 장시간 방사) 개념 구분, 할로겐화합물 무유출 약제량 산정식(W=V/S×C/(100-C))과 불활성기체 자유출 약제량 산정식(W=2.303×V/S×log[100/(100-C)]) 유도 과정, 선형상수 S=K1+K2t(아보가드로법칙·샤를법칙) 유도, NOAEL·LOAEL 동물실험에 기반한 최대허용설계농도 설정원리",
  notes:[
    { title:"1. 할로겐화합물 명명법과 불활성기체(IG) 계열", blocks:[{ type:"p", text:"할로겐화합물의 명명은 탄소-수소-불소(탄수불) 순서로 숫자를 배정한다. 예를 들어 FC-3-1-10은 탄소 3에 1을 더해 4개, 수소는 1에서 1을 빼 0개, 불소는 그대로 10개가 되어 C4F10이 된다. HFC-227ea는 탄소 2에 1을 더해 3개, 수소 2에서 1을 빼면... 처럼 숫자 배정 규칙(첫자리+1=탄소수, 둘째자리-1=수소수, 셋째자리=불소수)을 적용해 분자식을 유도할 수 있으며, 정확한 분자식을 모르면 이 탄수불 규칙만으로도 부분점수를 받을 수 있다." }, { type:"table", headers:["불활성기체(IG)", "조성(질소/아르곤/이산화탄소)"], rows:[["IG-01", "아르곤 100%"], ["IG-100", "질소 100%"], ["IG-55", "질소 50% / 아르곤 50%"], ["IG-541", "질소 52% / 아르곤 40% / 이산화탄소 8%"]] }, { type:"p", text:"F·Cl은 원자번호가 작고 전기음성도가 높아 결합력이 세므로 물리적 냉각소화가 주된 소화효과이며, Br·I는 전기음성도가 낮아 결합력이 약해 화학적 연쇄반응억제가 주된 소화효과이다(14주차 1강의 주기율표 원리와 동일). 저장기준은 할로겐화합물·불활성기체 공통으로 55℃ 이하(CO2는 40℃), 손실기준은 할로겐화합물이 약제손실 5% 또는 압력손실 10% 초과 시, 불활성기체는 압력손실 5% 초과 시 재충전·교체한다. 기동장치는 CO2와 대부분 동일하나, 수동기동장치는 50N 이하의 힘으로 기동 가능한 구조여야 한다는 기준이 추가로 있다(CO2에는 없음)." }] },
    { title:"2. 치환·무유출·자유출 개념", blocks:[{ type:"table", headers:["구분", "정의", "해당 약제"], rows:[["치환", "방호공간 내 산소를 빼내고 그 자리를 불활성기체로 대체", "일반 개념"], ["무유출(No Efflux)", "전농도(고농도)를 단시간에 방사, 액상 약제가 노즐에서 기화·팽창하며 공기를 밀어내되 약제 자체는 유출되지 않는다고 가정", "할로겐화합물(10초 초방출)"], ["자유출(Free Efflux)", "장시간 고농도로 방사, 기체 상태로 방출되어 처음부터 공기와 혼합되며 압력상승에 따라 약제도 함께 유출된다고 가정", "이산화탄소·불활성기체(분방출)"]] }, { type:"p", text:"할로겐화합물은 소화력이 뛰어나 낮은 농도·짧은 시간에 소화가 가능하므로 무유출 관점(농도변화 없이 계산)으로 약제량을 산정하고, CO2·불활성기체는 질식 기반으로 높은 농도를 오래 유지해야 하므로 자유출 관점(누설을 감안한 계산)으로 산정한다." }] },
    { title:"3. 약제량 산정식 유도와 선형상수", blocks:[{ type:"p", text:"[할로겐화합물 무유출식] 농도 C(%) = ν/(V+ν)×100 (ν=방사된 약제의 기체 체적, V=방호구역 체적). 할로겐화합물은 액상 저장이므로 ν = S×W(S=비체적, W=약제 질량[kg])를 대입하고 W에 대해 정리하면 W = V/S × C/(100-C) 형태로 유도된다." }, { type:"p", text:"[불활성기체 자유출식] 실험식 2^x = 100/(100-C)에서 출발해 양변에 자연로그를 취하면 x = ln[100/(100-C)] = 2.303×log10[100/(100-C)]가 되고, 이는 방호구역 1㎥당 필요 약제량에 해당한다. 여기에 방호구역 전체 체적(V)과 비체적(S)을 곱해 W = 2.303 × (V/S) × log10[100/(100-C)]로 정리된다." }, { type:"p", text:"선형상수 S = K1 + K2t는 방호구역 온도에 따른 기체 체적 변화를 보정하는 계수이다. K1 = 22.4/M(M=분자량)은 아보가드로 법칙(0℃·1atm에서 모든 기체 1몰=22.4L)에서, K2 = K1/273은 샤를의 법칙(1℃ 오를 때마다 0℃ 부피의 1/273씩 증가)에서 유도된다. 계산 시 t는 신부화재 10℃, 표면화재 30℃를 적용하며, 문제에서 화재 유형이 직접 주어지지 않으면 대상물(전자제품창고=신부화재 등)로부터 판단해야 한다." }, { type:"callout", text:"불활성기체는 기체 상태로 저장하므로 저장 시점(20℃)에서 이미 갖고 있는 부피를 별도로 나눠주는 스탠더드 비체적(VS) 보정이 추가로 필요하다. 할로겐화합물은 액상 저장이라 이 보정이 필요 없다." }] },
    { title:"4. NOAEL·LOAEL과 최대허용설계농도", blocks:[{ type:"table", headers:["구분", "정의"], rows:[["NOAEL(No Observed Adverse Effect Level)", "농도를 점점 높여갈 때, 심장(할로겐화합물)·질식(불활성기체) 등 이상반응이 나타나지 않는 최대 농도"], ["LOAEL(Lowest Observed Adverse Effect Level)", "농도를 점점 낮춰갈 때, 이상반응이 나타나는 최저 농도"]] }, { type:"p", text:"동물실험(개에게 아드레날린을 투여해 활동성을 높인 뒤 약제 농도를 노출시키는 방식)을 통해 심장에 영향이 나타나지 않는 최대치를 NOAEL로, 영향이 나타나는 최저치를 LOAEL로 규정한다. 최대허용설계농도는 반드시 NOAEL(불활성기체는 No Effect Level) 이내로 설정해야 하며, LOAEL을 넘는 농도는 사람이 상주하는 곳에 사용할 수 없다." }, { type:"p", text:"CO2는 질식이 소화의 기반 메커니즘이라 최대허용설계농도 개념 자체가 존재하지 않아(사람이 상주하는 곳에는 애초에 사용 불가), 할로겐화합물·불활성기체와 달리 취급된다. 불활성기체(IG-541)의 설계농도는 37.5~43%이며 이는 산소농도를 12~13%까지 저하시키는 수준(현훈·경련 직전 단계)으로 설정된 것이다." }] }
  ],
  cards:[
    { q:"할로겐화합물 명명법의 탄수불 원칙은?", a:"숫자를 탄소-수소-불소 순서로 배정하며, 첫자리 숫자에 1을 더하면 탄소수, 둘째자리 숫자에서 1을 빼면 수소수, 셋째자리 숫자가 그대로 불소수가 된다." },
    { q:"IG-541의 조성비는?", a:"질소 52%, 아르곤 40%, 이산화탄소 8%이다." },
    { q:"IG-01과 IG-100의 조성 차이는?", a:"IG-01은 아르곤 100%, IG-100은 질소 100%이다." },
    { q:"불활성기체 소화설비의 수동기동장치가 CO2 소화설비와 다른 점은?", a:"50N 이하의 힘으로 기동할 수 있는 구조여야 한다는 기준이 추가로 있다." },
    { q:"할로겐화합물과 불활성기체의 저장온도 기준 차이는?", a:"할로겐화합물·불활성기체는 55℃ 이하, 이산화탄소는 40℃ 이하이다." },
    { q:"치환·무유출·자유출의 개념을 각각 설명하시오.", a:"치환은 산소를 빼내고 불활성기체로 대체하는 것, 무유출은 전농도 단시간 방사로 약제 유출이 없다고 가정하는 것, 자유출은 장시간 고농도 방사로 약제도 함께 유출된다고 가정하는 것이다." },
    { q:"할로겐화합물이 무유출로, CO2·불활성기체가 자유출로 계산되는 이유는?", a:"할로겐화합물은 소화력이 강해 낮은 농도·짧은 시간에 소화되지만, CO2·불활성기체는 질식 기반이라 높은 농도를 오래 유지해야 하므로 누설을 감안한 자유출 방식으로 계산한다." },
    { q:"할로겐화합물 무유출 약제량 산정식은?", a:"W = V/S × C/(100-C) (V=방호구역 체적, S=비체적, C=설계농도[%])이다." },
    { q:"불활성기체 자유출 약제량 산정식은?", a:"W = 2.303 × (V/S) × log10[100/(100-C)] (V=방호구역 체적, S=비체적, C=설계농도[%])이다." },
    { q:"불활성기체 자유출식이 실험식 2^x=100/(100-C)에서 어떻게 유도되는가?", a:"양변에 자연로그를 취하면 x=ln[100/(100-C)]이 되고, 자연로그를 상용로그로 바꾸면 x=2.303×log10[100/(100-C)]로 정리되어 방호구역 1㎥당 약제량이 산출된다." },
    { q:"선형상수 S=K1+K2t에서 K1과 K2는 각각 무엇을 뜻하는가?", a:"K1=22.4/M(분자량 M)은 아보가드로 법칙에서 유도된 0℃ 시점의 비체적, K2=K1/273은 샤를의 법칙에서 유도된 온도 1℃당 부피증가율이다." },
    { q:"선형상수 계산 시 t(방호구역 온도)는 얼마를 적용하는가?", a:"신부화재는 10℃, 표면화재는 30℃를 적용한다." },
    { q:"불활성기체 약제량 계산에서 스탠더드 비체적(VS) 보정이 추가로 필요한 이유는?", a:"불활성기체는 기체 상태로 저장하므로 이미 저장 시점(20℃)에서 부피를 갖고 있어, 이 부피를 별도로 나눠 이중계산되지 않도록 보정해야 하기 때문이다(할로겐화합물은 액상 저장이라 불필요)." },
    { q:"NOAEL과 LOAEL의 차이는?", a:"NOAEL은 농도를 높여갈 때 이상반응이 나타나지 않는 최대 농도이고, LOAEL은 농도를 낮춰갈 때 이상반응이 나타나는 최저 농도이다." },
    { q:"최대허용설계농도는 NOAEL과 LOAEL 중 어디에 맞춰 설정하는가?", a:"NOAEL(불활성기체는 No Effect Level)에 맞춰 설정하며, LOAEL을 넘는 농도는 사람이 상주하는 곳에 사용할 수 없다." },
    { q:"CO2는 왜 최대허용설계농도 개념이 존재하지 않는가?", a:"질식이 소화의 기반 메커니즘이라 애초에 사람이 상주하는 곳에는 사용할 수 없으므로, '허용 가능한 최대 농도'라는 개념 자체가 성립하지 않는다." },
    { q:"불활성기체(IG-541)의 설계농도와 그에 대응하는 산소농도는?", a:"설계농도는 37.5~43%이며, 이는 산소농도를 약 12~13%까지 저하시키는 수준(현훈·경련 직전 단계)이다." },
    { q:"NOAEL·LOAEL을 결정하는 실험 방법은?", a:"개에게 아드레날린을 투여해 활동성(심장 반응성)을 높인 뒤 소화약제 농도에 노출시켜 심장에 이상반응이 나타나는지 관찰하는 동물실험을 통해 결정한다." },
    { q:"할로겐화합물이 냉각소화보다 연쇄반응억제 소화가 주된 효과인 이유(원자 구조 관점)는?", a:"Br·I는 전자껍질수가 많아 전기음성도가 낮고 결합력이 약해, 화학반응(라디칼 포착)을 통한 연쇄반응억제가 주된 소화 메커니즘이 되기 때문이다." }
  ]
};

const CONCEPT_DECK_14WK_5GANG = {

  sub:"이산화탄소·할로겐화합물·불활성기체의 설치제외장소(3류·5류 위험물, 활성금속 등) 비교, 화재감지~설계농도도달 타임라인과 방사시간 제한이유(분노유직: 분해부산물최소화·노즐효과·유량균일·직접피해최소화), 설계농도=소화농도×안전율(A급1.2·B급1.3·C급1.35)과 별도독립배관방식(배관내용적비 1.5 미만), 도어팬테스트의 디센드인터페이스모드·믹싱모드 측정원리와 연장방출(Extended Discharge), 과압배출구 설계식(A=2.39Q/√P)",

    { title:"2. 화재감지~설계농도도달 타임라인과 방사시간", blocks:[{ type:"p", text:"화재 발생 → 감지기 응답 → 대피시간 확보(약 30초 지연) → 방호구역 밀폐(자동폐쇄장치 작동, 환기장치 정지) → 약제 방사 → 설계농도 도달 → 설계농도 유지의 순서로 진행된다." }, { type:"table", headers:["약제", "방사시간", "방출 형태"], rows:[["할로겐화합물", "10초", "초방출(전농도 단시간 방사)"], ["이산화탄소", "표면화재 1분 / 심부화재 7분", "분방출"], ["불활성기체", "A·C급 2분 / B급 1분", "분방출"]] }, { type:"p", text:"방사시간을 짧게 제한하는 이유는 ①약제 방출속도가 연소속도보다 빨라야 소화가 가능하고, ②배관 내 액상·기상 흐름을 균일하게 유지해(베이퍼딜레이타임 없이) 노즐에서 방사유량을 극대화하며, ③이를 통해 신속히 설계농도에 도달시켜 물적·인적 피해를 최소화하고, ④(특히 할로겐화합물은) 500℃ 이상에서 열분해 생성물(독성 가스)이 늘어나므로 방출시간을 늘리면 안 되기 때문이다." }] },

    { title:"4. 도어팬테스트와 과압배출구", blocks:[{ type:"table", headers:["측정방식", "적용 약제(비중)", "측정원리", "영향인자"], rows:[["디센드 인터페이스 모드(Descending Interface Mode)", "공기보다 무거운 약제(CO2 등)", "약제층이 방호구역 상단에서 보호대상 장비 높이까지 가라앉는 데 걸리는 시간을 측정", "장비의 높이, 방어구역 면적, 약제 농도, 개구부 크기·위치"], ["믹싱 모드(Mixing Mode)", "공기와 비중이 비슷한 약제(불활성기체 등)", "균일하게 혼합된 후 누설로 농도가 서서히 낮아지는 시간을 측정", "방호구역 체적, 약제 농도, 개구부 크기(장비 높이는 무관)"]] }, { type:"p", text:"도어팬테스트는 문짝을 떼고 도어팬을 설치해 가압한 뒤, 설계농도 유지시간을 실측한다. 확보되지 않으면 스모크펜슬 등으로 누설부위를 찾아 밀봉한 뒤 재시험하며, 그래도 확보되지 않는 보이지 않는 누설틈새가 있다면 그 누설량만큼 추가로 약제를 방출하는데 이를 연장방출(Extended Discharge)이라 한다. 케이블 액세스플로어처럼 근본적으로 차단이 불가능한 개구부는 인접 위험지역까지 함께 확대 방호해 별도 약제량을 동시 방출한다." }, { type:"p", text:"과압배출구는 약제 방출 시 방호구역 내 급격한 압력상승(CO2는 초기 부압 후 상승, 불활성기체는 초기부터 압력 상승)으로부터 건물 구조체를 보호하기 위해 설치한다. 설계식은 A(㎠) = 2.39×Q/√P (Q=배관 내 약제 흐름률[kg/min], P=실이 허용하는 강도[kPa], 예: 경량구조 1.2·일반구조 2.4·철근콘크리트구조 4.8kPa)이며, 디센드 인터페이스 모드는 약제가 아닌 공기가 배출되도록 상부에, 믹싱 모드는 위치와 무관하게 설치하고, 두 경우 모두 노즐에서 먼 쪽에 설치해 약제 누설을 최소화한다." }] }

    { q:"도어팬테스트의 디센드 인터페이스 모드는 어떤 약제에 적용하며 무엇을 측정하는가?", a:"공기보다 무거운 약제(CO2 등)에 적용하며, 약제층이 상단에서 보호대상 장비 높이까지 가라앉는 데 걸리는 시간을 측정한다." },

    { q:"[95회] 가스계소화설비 및 분말소화설비에 사용하는 선택밸브의 구조 및 기능에 대하여 기술하시오.", a:"선택밸브는 여러 방호구역이 저장용기를 공용으로 사용할 때 화재가 발생한 구역으로만 약제가 흐르도록 하는 밸브로, 기동용가스 압력 또는 전기신호로 개방되는 구조를 가진다." },

    { q:"[106회] 분말소화약제의 방진효과와 탈수탄화효과에 대하여 설명하시오.", a:"탈수탄화효과는 올소인산이 셀룰로오스를 불연성 탄소와 물로 분해하는 작용, 방진효과는 메타인산이 표면에 유리상 피막을 형성해 산소 공급을 차단하는 작용이다." },

    { q:"[136회] 분말소화약제의 구비조건, 종류별 주성분·적응화재·소화작용, 침강시험, 비누화 현상을 설명하시오.", a:"구비조건은 미세도·내습성·유동성·비고화성 등이며, 1종(NaHCO3, B·C급)·2종(KHCO3, B·C급)·3종(NH4H2PO4, A·B·C급)으로 구분되고, 침강시험은 약제가 방치 시 가라앉지 않는지 확인하는 시험, 비누화현상은 유지화재에서 알칼리금속이 지방산과 반응해 금속비누를 형성하는 질식소화 메커니즘이다." }

    { q:"[80회] 이산화탄소, 할론1301 소화약제의 임계온도를 설명하고, 액화가스레벨메타를 이용한 약제량 측정 시 관련사항을 설명하시오.", a:"CO2의 임계온도는 약 31.1℃, 할론1301은 약 67℃이며, 이 온도 이상에서는 액화가 불가능하므로 액화가스레벨메타는 임계온도 이하에서 액상 높이를 측정해 잔량을 확인하는 데 사용된다." },
    { q:"[81회] 이산화탄소 소화설비의 구성요소, 원리, 수동조작 방법을 기술하시오.", a:"구성요소는 저장용기·기동장치·선택밸브·배관·헤드이며, 질식·냉각 원리로 소화하고, 수동조작은 방호구역 출입구 부근 수동기동장치의 방출용스위치를 조작해 솔레노이드밸브를 작동시키는 방식이다." },
    { q:"[82회] 마그네슘화재시 소화약제로서 물과 이산화탄소를 사용할 수 없는 이유를 쓰고 화학반응식으로 표현하시오.", a:"물은 Mg+2H2O→Mg(OH)2+H2로 가연성 수소가스를 발생시키고, CO2는 2Mg+CO2→2MgO+C로 반응해 가연성 탄소를 생성하므로 오히려 화재를 격화시킨다." },
    { q:"[83회] CO2의 상평형도를 그리고 열역학적 특성에 대하여 기술하시오.", a:"삼중점(-56.5℃·5.1atm)에서 고체·액체·기체가 공존하고, 임계점(31.1℃·7.38MPa) 이상에서는 액상이 존재할 수 없으며, 대기압(1atm)에서는 -79℃에서 승화하므로 상온 대기압 상태의 액체 CO2는 존재하지 않는다." },
    { q:"[83회] 이산화탄소 소화설비 소화약제의 저장용기 설치기준과 설치기준에 적합한 장소에 대해서 기술하시오.", a:"40℃ 이하·온도변화 적은 방화구획된 실에 3cm 이상 간격으로 설치하며, 직사광선·빗물 침투가 없고 점검이 용이한 장소가 적합하다." },
    { q:"[90회] 저압식 이산화탄소소화설비의 저장용기 설치기준에 대하여 설명하시오.", a:"냉동장치를 갖춘 대형 저장탱크를 설치하며 안전밸브와 압력경보장치를 반드시 설치하고, 액면계·압력계를 통해 상시 저장상태를 확인할 수 있어야 한다." },
    { q:"[96회] 이산화탄소약제의 열역학적 상태도와 열역학적 특성 및 저장·방사 시 나타나는 현상에 대하여 설명하시오.", a:"상태도상 삼중점·임계점을 가지며, 방사 시 줄톰슨효과(단열교축팽창)에 의한 온도급강하와 이로 인한 운상현상(드라이아이스 재결정)이 나타난다." },
    { q:"[98회] 고압식에 비해 저압식 이산화탄소소화설비가 대규모 소화설비에 적용되는 경우가 많은 이유와 설계방법은?", a:"대형 탱크 1개로 대량 저장이 가능해 저장고 면적과 부자재비를 줄일 수 있기 때문이며, 설계는 필요 약제량 산정 후 저압 저장탱크 용량·냉동장치 용량·배관경을 결정하는 순서로 진행한다." },
    { q:"[99회] 이산화탄소 소화설비의 저장용기 등 설치 장소 기준과 현실적으로 보완이 필요한 사항은?", a:"설치장소 기준은 방화구획·온도관리·3cm 간격 등이며, 보완 필요사항으로는 소규모 건물의 설치공간 부족, 오작동 방지대책 강화 등이 지적된다." },
    { q:"[107회] 물과 이산화탄소의 압력-온도상태도를 각각 작도하고 삼중점·임계점의 온도·압력을 설명하시오.", a:"물은 삼중점 0.01℃·0.6kPa, 임계점 374℃·22.1MPa이며, CO2는 삼중점 -56.5℃·5.1atm, 임계점 31.1℃·7.38MPa로 CO2가 훨씬 낮은 온도·압력에서 상변화가 일어난다." },
    { q:"[114회] 이산화탄소소화설비의 저장방식 및 방출방식에 따른 분류에 대해 설명하시오.", a:"저장방식은 고압식·저압식으로, 방출방식은 전역방출방식·국소방출방식·호스릴방식으로 분류된다." },
    { q:"[116회] 나트륨(Na)에 관하여 물과의 반응식, 보호액의 종류와 사용 이유, 사용할 수 없는 소화약제를 쓰시오.", a:"2Na+2H2O→2NaOH+H2로 격렬히 반응하며, 보호액으로 석유·경유 등을 사용해 공기·수분과의 접촉을 차단한다. 사용할 수 없는 소화약제는 이산화탄소(2Na+CO2→Na2O+CO+C)이다." },
    { q:"[117회] NFPA 12에서 정하는 이산화탄소의 적응성, 비적응성 및 나트륨(Na)과 CO2의 반응식을 설명하시오.", a:"적응성은 B·C급 화재이며 비적응성은 3류·5류 위험물, 활성금속화재이다. 나트륨과의 반응식은 2Na+CO2→Na2O+CO+C로 가연성 CO·C를 생성해 사용할 수 없다." },
    { q:"[120회] 이산화탄소 소화설비의 소화약제 저장용기 등의 설치장소에 관한 기준을 서술하고 근거를 설명하시오.", a:"40℃ 이하로 온도 관리를 하는 이유는 CO2 저장압력의 급상승을 방지하기 위함이며, 방화구획하는 이유는 인접 화재로부터 약제통을 보호하기 위함이다." },
    { q:"[122회] 이산화탄소 소화설비 호스릴방식의 설치장소 및 설치기준에 대하여 설명하시오.", a:"지상 1층·2층으로 개방된 부분이 있는 장소 등 전역방출이 곤란한 곳에 설치하며, 수평거리 15m 이내마다 호스릴을 배치하고 표시등·표지를 설치한다." }
  ]
};

    { q:"[87회] 이산화탄소 소화약제의 저장량 산정방법을 표면화재와 심부화재로 구분하여 기술하시오.", a:"표면화재는 W=방호구역체적×체적당 약제량+개구부면적×5kg/㎡, 심부화재는 개구부가산량을 10kg/㎡으로 적용하며 소화약제 방사시간도 표면화재 1분, 심부화재 7분으로 다르게 적용한다." },
    { q:"[87회] NFPA 12의 'free efflux'를 설명하고 방출 후 방호구역의 단위체적당 약제량(kg/m3), 농도(Vol%), 비체적(m3/kg) 관계식을 유도하시오.", a:"자유유출은 장시간 고농도 방사로 기체가 공기와 혼합되며 압력상승에 따라 약제도 함께 유출된다고 보는 관점으로, W=2.303×(V/S)×log10[100/(100-C)]로 유도된다(W=단위체적당 약제량, V=방호구역체적, S=비체적, C=농도)." },
    { q:"[92회] 이산화탄소소화설비의 과압배출구에 대한 NFPA 12의 내용과 경량구조물 전자제품창고 과압배출구 면적 계산법은?", a:"NFPA 12는 방호구역 내 압력상승으로부터 구조체를 보호하기 위해 과압배출구를 요구하며, 면적은 A(㎠)=2.39Q/√P(경량구조 P=1.2kPa)로 계산한다." },
    { q:"[93회] 이산화탄소 소화설비의 전역방출방식에 적용되는 과압배출구의 면적과 설계시 고려사항은?", a:"면적은 A=2.39Q/√P로 산정하며, 설치 시 실의 허용강도 확인, 약제가 아닌 공기가 배출되도록 상부 설치, 즉시 개방되는 구조, 노즐에서 먼 위치 선정을 고려해야 한다." },
    { q:"[97회] 바닥면적 100㎡·높이 2.5m 통신기기실에 CO2 소화설비를 전역방출방식으로 설치할 때 저장용기수와 방출 후 농도 산정 절차는?", a:"방호구역 체적(250㎥)에 체적당 약제량을 곱해 필요 약제량을 구한 뒤 1병당 충전량(45kg)으로 나눠 저장용기수를 결정하고, 방출된 총 약제량을 방호구역 체적과 함께 대입해 최종 CO2 농도를 검산한다." },
    { q:"[102회] 저압식 CO2 소화약제의 2상유체 거동과 상평형도, 임계점·삼중점에서의 상태를 설명하시오.", a:"임계점(31.1℃·7.38MPa)에서는 액상과 기상의 구분이 사라지고, 삼중점(-56.5℃·5.1atm)에서 온도·압력이 변화하면 고상(드라이아이스)이 생성될 수 있다." },
    { q:"[105회] 저압 이산화탄소 소화설비의 상태도, Vapor Delay Time 정의, 영향인자를 설명하시오.", a:"베이퍼 딜레이 타임은 배관 전방에 생성된 증기로 인해 액상 방출이 지연되는 시간이며, 배관의 중량·비열·온도가 클수록, 저장 CO2 온도가 낮을수록, 설계유량이 작을수록 길어진다." },
    { q:"[108회] 이산화탄소 소화설비의 설계농도 도달을 위한 방사시간과 방사압력을 표면화재·심부화재로 구분해 설명하시오.", a:"표면화재는 방사시간 1분(방사압력 고압식 2.1MPa 이상, 저압식 1.05MPa 이상), 심부화재는 방사시간 7분(설계농도의 30%에 2분 이내 도달)이다." },
    { q:"[108회] 이산화탄소·청정소화약제소화설비의 자동폐쇄장치 설치기준과 과압배출구 설치 목적은?", a:"자동폐쇄장치는 약제 방출 전 개구부·환기장치를 자동으로 폐쇄해 설계농도 누설을 막기 위해 설치하며, 과압배출구는 방출 시 급격한 압력상승으로부터 건물 구조체를 보호하기 위해 설치한다." },
    { q:"[109회] 전기실 CO2 전역방출 시 자유유출 상태의 단위체적당 약제량(w)·농도(C)·비체적(S) 관계식 유도와 계산은?", a:"w=2.303×log10[100/(100-C)]/S로 유도되며, 체적 300㎥·30℃·1기압에서 270kg이 방출되면 비체적 S를 구해 대입한 뒤 log 역산으로 방출 후 CO2 농도(%)를 계산한다." },
    { q:"[112회] 이산화탄소소화설비의 설계농도 34%의 산출과정과 의미는?", a:"산소농도를 15%까지 저하시키는 소화농도(21-15)/21×100≈28.6%에 20% 안전율을 곱하면 약 34%가 되며, 이는 대부분의 가연물이 소화되는 최저 설계기준점을 의미한다." },

    { title:"답안 작성 전략", blocks:[{ type:"p", text:"도어팬테스트 문제는 실시목적(설계농도유지시간 검증)→절차(가압 후 누설량 측정)→판정(하강경계층모드는 보호대상 장비높이까지, 믹싱모드는 누설로 인한 농도저하 기준)의 순서로 답하고, 확보 실패 시 스모크펜슬로 누설부 탐색·밀봉 후 재시험, 그래도 안되면 연장방출(Extended Discharge)로 마무리하는 흐름을 표준 답안으로 암기해둔다. 설치기준류(저장용기·기동장치) 문제는 CO2 소화설비 기준과의 차이점(예: 수동기동장치 50N 이하, 저장온도 55℃)을 함께 언급하면 변별력 있는 답안이 된다." }] }

  cards:[
    { q:"[65회] 가스소화설비의 성능 확인을 위한 door fan test와 soaking time과의 관계를 설명하시오.", a:"도어팬테스트는 방호구역의 누설량을 실측하는 시험이며, 그 결과로 산출된 누설량이 화재안전기준에서 요구하는 설계농도유지시간(soaking time)을 만족하는지를 검증하는 데 사용된다." },
    { q:"[66회] 가스계 소화설비에서 pressure venting을 설명하시오.", a:"약제 방출 시 방호구역 내 급격한 압력상승으로부터 건물 구조체를 보호하기 위해 설치하는 과압배출구(pressure venting) 시스템으로, 실의 허용강도에 맞춰 배출면적을 산정한다." },
    { q:"[68회] 가스계 소화설비의 배관 내 약제비중의 기준을 국내소방법규와 NFPA의 경우를 들어 설명하시오.", a:"국내는 배관 내 약제(액상)의 비중 기준을 명시하지 않는 경우가 많으나, NFPA는 배관 내 약제가 80% 이상 액상(liquid full)을 유지하도록 요구하여 원활한 방출 흐름을 보장한다." },
    { q:"[71회] 가스계소화설비(전역방출방식)의 과압배출구 설계시 고려사항을 설명하시오.", a:"실이 허용하는 압력강도, 배관 내 약제흐름률(Q), 설치위치(하강경계층모드는 상부, 믹싱모드는 무관), 노즐에서 먼 위치 선정, 즉시 개방되는 구조 등을 고려해야 한다." },
    { q:"[76회] 가스계 소화설비에서 분사노즐로부터 방사되는 가스량이 불균등하게 되는 원인 및 설계시 고려사항은?", a:"배관경·배관길이 차이에 따른 마찰손실 불균형, 헤드 위치별 압력차가 원인이며, 설계 시 배관을 대칭적으로 배치하거나 오리피스 크기를 조정해 유량 분배를 균등화해야 한다." },
    { q:"[78회] 가스계 소화설비가 작동시 화재감지에서 설계농도가 도달하기까지 필요한 시간을 구분하여 설명하시오.", a:"감지기 응답시간→대피(지연)시간→방호구역 밀폐시간→약제 방사시간→설계농도 도달시간의 순서로 구분되며, 각 단계가 누적되어 총 소요시간을 구성한다." },
    { q:"[84회] 도어 팬 테스트에 대하여 실시목적, 총누출면적, 하강경계층, 최소높이, 유지시간을 설명하시오.", a:"실시목적은 방호구역의 밀폐성능을 검증해 설계농도유지시간을 확보하는 것이며, 총누출면적은 가압테스트로 산출한 등가누설면적, 하강경계층은 무거운 약제층이 가라앉는 경계, 최소높이는 보호대상장비 상단, 유지시간은 약제층이 그 높이까지 도달하는 시간이다." },
    { q:"[86회] 청정소화약제소화설비의 분사헤드 설치 및 성능기준에 대하여 설명하시오.", a:"분사헤드는 방호구역 전체에 균일하게 약제가 분사되도록 배치하며, 분사각도·설치높이·방호면적당 개수 기준을 만족해야 하고 오리피스 크기는 설계약제량·시간에 맞춰 산정한다." },
    { q:"[87회] 청정소화약제의 저장용기 설치장소 기준과 ISO 14520의 'liquid full'을 설명하시오.", a:"저장용기는 55℃ 이하·온도변화 적은 방화구획 실에 설치하며, liquid full은 저장용기에서 노즐까지 배관 내부가 가스가 아닌 액상 약제로 가득 찬 상태를 유지해 방출 초기 균일한 유동을 확보하는 것을 의미한다." },
    { q:"[90회] 가스계소화설비의 소화능력에 영향을 미치는 soaking time과 discharge time을 각각 설명하시오.", a:"discharge time(방사시간)은 노즐에서 설계농도 도달까지 약제를 방출하는 시간이고, soaking time(설계농도유지시간)은 재발화 방지를 위해 설계농도를 일정시간 이상 유지해야 하는 시간이다." },
    { q:"[91회] 청정소화약제 소화설비에서 소화약제의 방출시간에 대하여 설명하시오.", a:"할로겐화합물은 10초 이내 초방출, 불활성기체는 A·C급 2분·B급 1분 이내 분방출로 규정되며, 이는 배관 내 유동 균일화와 신속한 소화를 위한 기준이다." },
    { q:"[98회] 가스계 소화설비의 프리엔지니어드(pre-engineered)·엔지니어드(engineered)·모듈러(modular) 방식을 설명하시오.", a:"프리엔지니어드는 표준화된 소용량 설계, 엔지니어드는 방호구역별로 개별 수리계산하는 대용량 설계, 모듈러는 저장용기와 헤드를 하나의 유닛으로 구성해 배관 없이 방호구역에 개별 설치하는 방식이다." },
    { q:"[103회] 청정소화약제소화설비의 기동장치 설치기준을 설명하시오.", a:"자동기동(교차회로방식 감지기 연동)과 수동기동을 모두 갖춰야 하며, 수동기동장치는 방호구역마다 출입구 부근 0.8~1.5m 높이에 50N 이하의 힘으로 작동 가능한 구조로 설치한다." },
    { q:"[107회] 청정소화약제소화설비의 소화약제 방사시간 기준과 방사시간을 제한하는 목적을 설명하시오.", a:"할로겐화합물 10초, 불활성기체 1~2분 이내로 제한하며, 목적은 방출속도를 연소속도보다 빠르게 하고 배관 내 유동을 균일화해 신속한 소화와 열분해생성물 최소화를 달성하기 위함이다." },
    { q:"[111회] 가스계 소화설비의 과압배출구(Pressure vent)의 정의, CO2·Inergen 소화설비의 과압배출, 설계 시 고려사항, 방호구역 최대·최저압력 결정요소를 설명하시오.", a:"정의는 약제방출 시 급격한 압력변화로부터 구조체를 보호하는 배출구이며, CO2는 초기 부압 후 상승, Inergen(불활성기체)은 초기부터 상승하는 압력변화를 보이므로 각각의 최대·최저압력을 고려해 배출구를 설계해야 한다." },
    { q:"[119회] 할로겐화합물 및 불활성기체 소화설비의 배관 압력등급을 선정하는 방법은?", a:"저장압력, 방출 시 최대 배관 내압, 온도조건을 고려해 배관의 스케줄(두께)을 선정하며, 불활성기체는 고압 저장으로 할로겐화합물보다 높은 압력등급의 배관이 요구된다." },
    { q:"[122회] 할로겐화합물 및 불활성기체소화설비 저장용기 설치장소 기준과 소화약제 구비조건은?", a:"설치장소는 55℃ 이하·방화구획된 실이며, 구비조건은 소화성능이 우수하고 독성이 낮으며 오존파괴지수(ODP)가 0에 가깝고 전기 비전도성이며 저장안정성이 높아야 한다." },
    { q:"[128회] 가스계소화설비 설계농도유지시간(Soaking Time) 영향요소 및 방호구역밀폐시험은?", a:"영향요소는 방호구역 체적·약제농도·개구부 크기이며(장비높이는 하강경계층모드에서만 영향), 방호구역밀폐시험은 도어팬테스트로 실시해 누설량과 유지시간을 검증한다." },
    { q:"[134회] 가스계소화설비의 설계농도유지시간 확보방법(3가지), 설비운영(연동)방법, 하강모드·혼합모드 비교는?", a:"확보방법은 개구부 밀폐 강화, 연장방출(Extended Discharge), 배관·노즐 재배치이며, 하강모드(공기보다 무거운 약제)는 장비높이·개구부가, 혼합모드(비중이 비슷한 약제)는 방호구역체적·개구부가 주요 영향요소이다." },
    { q:"[139회] 가스계 소화설비의 과압·부압 발생 원인과 영향, 과압 배출장치 및 설계 시 고려사항은?", a:"CO2는 줄톰슨효과로 초기 부압 후 압력상승, 불활성기체는 방출 즉시 압력상승이 발생하며, 과도한 압력은 구조체 손상을 유발하므로 과압배출구를 실의 허용강도에 맞게 설계해야 한다." }
