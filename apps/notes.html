function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); return true; }
  catch(e){ showToast("저장 실패 — 이 기기/브라우저에만 저장됩니다"); return false; }
}
let progress = loadProgress();

function showToast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2500);
}

// ---------------------------------------------------------------------------
// 상태
// ---------------------------------------------------------------------------
let state = {
  view: "weeks",       // "weeks" | "week" | "lecture" | "deck"
  weekNum: null,
  lectureNum: null,
  deckId: null,
  tab: "notes",        // "notes" | "quiz"
  cardIdx: 0,
  revealed: false,
  filterRetry: false,
};

function deckStats(deck){
  const dp = progress[deck.id] || {};
  const total = deck.cards.length;
  let know=0, shaky=0, unknown=0;
  deck.cards.forEach((_, i)=>{
    const s = dp[i];
    if(s===STATUS.KNOW) know++;
    else if(s===STATUS.SHAKY) shaky++;
    else if(s===STATUS.UNKNOWN) unknown++;
  });
  return { total, know, shaky, unknown };
}

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ---------------------------------------------------------------------------
// 주차/강 단위 헬퍼 (1.주차 → 2.강좌 → 3.개념/기출 3단 드릴다운)
// ---------------------------------------------------------------------------
function weeksList(){
  return [...new Set(DECKS.map(d=>d.weekNum))].sort((a,b)=>a-b);
}
function lecturesForWeek(w){
  return [...new Set(DECKS.filter(d=>d.weekNum===w).map(d=>d.lectureNum))].sort((a,b)=>a-b);
}
function decksForWeekLecture(w,l){
  return DECKS.filter(d=>d.weekNum===w && d.lectureNum===l);
}
function scopePct(decksArr){
  let total=0, done=0;
  decksArr.forEach(d=>{
    const s = deckStats(d);
    total += s.total;
    done += s.know+s.shaky+s.unknown;
  });
  return total ? Math.round(done/total*100) : 0;
}

// ---------------------------------------------------------------------------
// 렌더러
// ---------------------------------------------------------------------------
function goBack(){
  if(state.view === "week") state.view = "weeks";
  else if(state.view === "lecture") state.view = "week";
  else if(state.view === "deck") state.view = "lecture";
  render();
}
function goHome(){
  state.view = "weeks";
  state.weekNum = null;
  state.lectureNum = null;
  state.deckId = null;
  render();
}
function renderNavBar(){
  const backDisabled = state.view === "weeks" ? "disabled" : "";
  const homeDisabled = state.view === "weeks" ? "disabled" : "";
  return `
    <div class="navbar">
      <button class="navicon ${backDisabled}" id="navBack" title="뒤로">←</button>
      <button class="navicon navhome ${homeDisabled}" id="navHome" title="처음으로">⌂</button>
      <span class="navspacer"></span>
    </div>`;
}
function bindNavBar(){
  const back = document.getElementById("navBack");
  const home = document.getElementById("navHome");
  if(back) back.addEventListener("click", goBack);
  if(home) home.addEventListener("click", goHome);
}

function render(){
  const app = document.getElementById("app");
  if(state.view === "weeks"){
    app.innerHTML = renderNavBar() + renderWeeks();
    bindNavBar();
    bindWeeksEvents();
  } else if(state.view === "week"){
    app.innerHTML = renderNavBar() + renderWeekLectures();
    bindNavBar();
    bindWeekEvents();
  } else if(state.view === "lecture"){
    app.innerHTML = renderNavBar() + renderLectureTypes();
    bindNavBar();
    bindLectureEvents();
  } else {
    app.innerHTML = renderNavBar() + renderDeck();
    bindNavBar();
    bindDeckEvents();
  }
}

function renderWeeks(){
  const weeks = weeksList();
  const items = weeks.map(w=>{
    const decksInWeek = DECKS.filter(d=>d.weekNum===w);
    const pct = scopePct(decksInWeek);
    return `
      <button class="weekbtn ${pct===100?'complete':''}" data-week="${w}">
        <span class="ring"></span>
        <span class="num">${w}</span>
        <span class="unit">주차</span>
        <span class="pct">${pct}%</span>
      </button>`;
  }).join("");

  return `
    <header>
      <div class="brand"><span class="flame">🔥</span><span class="brand-label">소방기술사 복습</span></div>
      <h1>주차를 선택하세요</h1>
      <p class="subtitle">강의가 끝날 때마다 새 주차·강이 여기 쌓입니다.</p>
    </header>
    <div class="gridwrap">
      <div class="weekgrid">${items}</div>
    </div>
  `;
}

function bindWeeksEvents(){
  document.querySelectorAll(".weekbtn").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.view = "week";
      state.weekNum = Number(el.dataset.week);
      render();
    });
  });
}

function renderWeekLectures(){
  const lectures = lecturesForWeek(state.weekNum);
  const items = lectures.map(l=>{
    const decksIn = decksForWeekLecture(state.weekNum, l);
    const pct = scopePct(decksIn);
    return `
      <button class="lecturebtn ${pct===100?'complete':''}" data-lecture="${l}">
        <span class="ring"></span>
        <span class="num">${l}</span>
        <span class="unit">강</span>
        <span class="pct">${pct}%</span>
      </button>`;
  }).join("");

  return `
    <header>
      <button class="backbtn" id="backBtn">← 주차 목록으로</button>
      <div class="brand"><span class="flame">🔥</span><span class="brand-label">소방기술사 복습</span></div>
      <h1>${state.weekNum}주차</h1>
      <p class="subtitle">강을 선택하세요.</p>
    </header>
    <div class="gridwrap">
      <div class="lecturegrid">${items}</div>
    </div>
  `;
}

function bindWeekEvents(){
  const back = document.getElementById("backBtn");
  if(back) back.addEventListener("click", ()=>{ state.view="weeks"; render(); });
  document.querySelectorAll(".lecturebtn").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.view = "lecture";
      state.lectureNum = Number(el.dataset.lecture);
      render();
    });
  });
}

function renderLectureTypes(){
  const decksIn = decksForWeekLecture(state.weekNum, state.lectureNum);
  const typeCard = (d) => {
    const s = deckStats(d);
    const donePct = Math.round(((s.know+s.shaky+s.unknown)/s.total)*100);
    const isConcept = d.type === "concept";
    return `
      <button class="typecard" data-deck="${d.id}">
        <span class="icon">${isConcept ? "📘" : "📜"}</span>
        <span class="info">
          <span class="title">${isConcept ? "개념정리" : "기출문제"} · ${esc(d.label)}</span>
          <span class="desc">${esc(d.sub)}</span>
          <span class="meta">${s.total}문항 · ${donePct}% 진행</span>
        </span>
        <span class="chevron">›</span>
      </button>`;
  };

  return `
    <header>
      <button class="backbtn" id="backBtn">← ${state.weekNum}주차 강 목록으로</button>
      <div class="brand"><span class="flame">🔥</span><span class="brand-label">소방기술사 복습</span></div>
      <h1>${state.weekNum}주차 ${state.lectureNum}강</h1>
      <p class="subtitle">개념정리 또는 기출문제를 선택하세요.</p>
    </header>
    <div class="typegrid">${decksIn.map(typeCard).join("")}</div>
  `;
}

function bindLectureEvents(){
  const back = document.getElementById("backBtn");
  if(back) back.addEventListener("click", ()=>{ state.view="week"; render(); });
  document.querySelectorAll(".typecard").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.view = "deck";
      state.deckId = el.dataset.deck;
      const deck = DECKS.find(d=>d.id===state.deckId);
      state.tab = deck.notes ? "notes" : "quiz";
      state.cardIdx = 0;
      state.revealed = false;
      state.filterRetry = false;
      render();
    });
  });
}

function renderNoteBlock(b){
  switch(b.type){
    case "h3": return `<h4 class="h3">${esc(b.text)}</h4>`;
    case "p": return `<p class="p">${esc(b.text)}</p>`;
    case "ul": return `<ul class="ul">${b.items.map(it=>`<li><span class="bullet">›</span><span>${esc(it)}</span></li>`).join("")}</ul>`;
    case "table": return `
      <div class="tablewrap"><table>
        <thead><tr>${b.headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
        <tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>`;
    case "code": return `<pre class="code">${esc(b.text)}</pre>`;
    case "callout": return `<div class="callout">${esc(b.text)}</div>`;
    default: return "";
  }
}

function renderNotes(deck){
  return `<div class="notes">${deck.notes.map(sec => `
    <section>
      <h3 class="sec-title">${esc(sec.title)}</h3>
      ${sec.blocks.map(renderNoteBlock).join("")}
    </section>
  `).join("")}</div>`;
}

function getVisibleCards(deck){
  const dp = progress[deck.id] || {};
  const all = deck.cards.map((c,i)=>({...c, idx:i, status: dp[i] || STATUS.UNSEEN}));
  if(!state.filterRetry) return all;
  const retry = all.filter(c=>c.status===STATUS.SHAKY || c.status===STATUS.UNKNOWN);
  return retry.length ? retry : all;
}

function renderQuiz(deck){
  const visible = getVisibleCards(deck);
  const idx = Math.min(state.cardIdx, visible.length-1);
  const s = deckStats(deck);
  const kw=(s.know/s.total)*100, sw=(s.shaky/s.total)*100, uw=(s.unknown/s.total)*100;
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;

  let cardHtml;
  if(!visible.length){
    cardHtml = `<div class="flashcard" style="cursor:default;align-items:center;"><p class="p" style="text-align:center;color:#78716c;">문항이 없습니다.</p></div>`;
  } else {
    const c = visible[idx];
    const badge = c.status !== STATUS.UNSEEN ? `<span class="badge ${c.status}">${STATUS_LABEL[c.status]}</span>` : "";
    cardHtml = `
      <div class="cardmeta">
        <span class="count">${idx+1} / ${visible.length}</span>
        ${badge}
      </div>
      <div class="flashcard" id="flashcard">
        <p class="kicker">${state.revealed ? "정답 / 풀이" : "질문 · 탭하여 정답 보기"}</p>
        <p class="body ${state.revealed ? "a":"q"}">${esc(state.revealed ? c.a : c.q)}</p>
        ${!state.revealed ? `<div class="hint">❓ 탭해서 확인</div>` : ""}
      </div>
      <div class="navrow">
        <button class="circlebtn" id="prevBtn">‹</button>
        ${state.revealed ? `
          <div class="markrow">
            <button class="b-unknown" data-mark="unknown">✕ 모름</button>
            <button class="b-shaky" data-mark="shaky">? 헷갈림</button>
            <button class="b-know" data-mark="know">✓ 안다</button>
          </div>
        ` : `<button class="revealbtn" id="revealBtn">정답 보기</button>`}
        <button class="circlebtn" id="nextBtn">›</button>
      </div>
    `;
  }

  return `
    <div class="stats">
      <div class="stats-top">
        <span class="stats-label">📊 ${todayStr} 진행률</span>
        <button class="filterbtn ${state.filterRetry?'on':''}" id="filterBtn">${state.filterRetry ? "전체 보기로" : "헷갈림·모름만 보기"}</button>
      </div>
      <div class="bar">
        <div style="width:${kw}%;background:#10b981;"></div>
        <div style="width:${sw}%;background:#f59e0b;"></div>
        <div style="width:${uw}%;background:#f43f5e;"></div>
      </div>
      <div class="legend">
        <span class="know">안다 ${s.know}</span>
        <span class="shaky">헷갈림 ${s.shaky}</span>
        <span class="unknown">모름 ${s.unknown}</span>
        <span>· 총 ${s.total}문항</span>
      </div>
    </div>
    <div class="cardwrap">${cardHtml}</div>
    <footer><button class="resetbtn" id="resetBtn">↺ 이 세트 진행상황 초기화</button></footer>
  `;
}

function renderDeck(){
  const deck = DECKS.find(d=>d.id===state.deckId);
  const tabsHtml = deck.notes ? `
    <div class="tabs">
      <button id="tabNotes" class="${state.tab==='notes'?'active':''}">📘 읽기</button>
      <button id="tabQuiz" class="${state.tab==='quiz'?'active':''}">📜 테스트</button>
    </div>` : "";

  return `
    <header>
      <button class="backbtn" id="backBtn">← ${state.weekNum}주차 ${state.lectureNum}강으로</button>
      <div class="brand"><span class="flame">🔥</span><span class="brand-label">${esc(deck.week)}</span></div>
      <h1>${esc(deck.label)}</h1>
      <p class="subtitle">${esc(deck.sub)}</p>
      ${tabsHtml}
    </header>
    ${deck.notes && state.tab==='notes' ? renderNotes(deck) : renderQuiz(deck)}
  `;
}

function bindDeckEvents(){
  const deck = DECKS.find(d=>d.id===state.deckId);

  const back = document.getElementById("backBtn");
  if(back) back.addEventListener("click", ()=>{ state.view="lecture"; render(); });

  const tabNotes = document.getElementById("tabNotes");
  const tabQuiz = document.getElementById("tabQuiz");
  if(tabNotes) tabNotes.addEventListener("click", ()=>{ state.tab="notes"; render(); });
  if(tabQuiz) tabQuiz.addEventListener("click", ()=>{ state.tab="quiz"; state.cardIdx=0; state.revealed=false; render(); });

  if(state.tab !== "quiz" && deck.notes) return; // 노트 뷰면 퀴즈 이벤트 바인딩 불필요

  const filterBtn = document.getElementById("filterBtn");
  if(filterBtn) filterBtn.addEventListener("click", ()=>{
    state.filterRetry = !state.filterRetry; state.cardIdx=0; state.revealed=false; render();
  });

  const flashcard = document.getElementById("flashcard");
  if(flashcard) flashcard.addEventListener("click", ()=>{ state.revealed = !state.revealed; render(); });

  const revealBtn = document.getElementById("revealBtn");
  if(revealBtn) revealBtn.addEventListener("click", (e)=>{ e.stopPropagation(); state.revealed = true; render(); });

  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const visible = getVisibleCards(deck);
  if(prevBtn) prevBtn.addEventListener("click", ()=>{
    state.revealed=false;
    state.cardIdx = state.cardIdx-1>=0 ? state.cardIdx-1 : visible.length-1;
    render();
  });
  if(nextBtn) nextBtn.addEventListener("click", ()=>{
    state.revealed=false;
    state.cardIdx = state.cardIdx+1<visible.length ? state.cardIdx+1 : 0;
    render();
  });

  document.querySelectorAll("[data-mark]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const mark = btn.dataset.mark;
      const cur = visible[Math.min(state.cardIdx, visible.length-1)];
      if(!cur) return;
      if(!progress[deck.id]) progress[deck.id] = {};
      progress[deck.id][cur.idx] = mark;
      saveProgress(progress);
      state.revealed=false;
      const newVisible = getVisibleCards(deck);
      state.cardIdx = state.cardIdx+1<newVisible.length ? state.cardIdx+1 : 0;
      render();
    });
  });

  const resetBtn = document.getElementById("resetBtn");
  if(resetBtn) resetBtn.addEventListener("click", ()=>{
    if(!confirm("이 세트의 진행상황을 초기화할까요?")) return;
    progress[deck.id] = {};
    saveProgress(progress);
    state.cardIdx=0; state.revealed=false;
    render();
  });
}

render();

// PWA: 서비스워커 등록 시도 (http/https로 호스팅된 경우에만 정상 동작하며,
// file://로 로컬에서 열었을 때는 브라우저 정책상 대부분 등록이 안 되지만
// 앱 실행에는 전혀 지장 없도록 조용히 무시하게 처리함)
if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
