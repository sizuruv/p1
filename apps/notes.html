  label:"표준시간-가열온도곡선·시방위주 vs 성능위주 설계·내장재 성능기준",
  sub:"표준시간-가열온도곡선의 개념·한계, 시방위주설계와 성능위주설계의 차이, 내장재(불연·준불연·난연재료)의 시험방법과 판정기준, 복합자재(샌드위치패널) 실물모형시험과 가스유해성시험",
  notes:[
    { title:"1. 표준시간-가열온도곡선의 개념과 한계", blocks:[{ type:"p", text:"표준시간-가열온도곡선은 과거의 화재조사·실험 데이터를 바탕으로 일반적인 건축물 화재의 시간에 따른 온도상승 특성을 표준화한 곡선이다(약 30분 845℃, 1시간 945℃, 2시간 1,050℃ 수준). 방화문·방화댐퍼·방화셔터를 포함한 모든 내화시험은 이 곡선을 기준으로 한쪽 면을 가열하여 성능(하중지지력·차염성·차열성)을 판정한다." }, { type:"code", text:"온도(°C) = 345·log10(8t+1) + 20   (t: 분)\n예: t=30분 → 약 840℃, t=60분 → 약 945℃" }, { type:"p", text:"이 곡선은 화재 초기 급격한 성장(∝t²) 이후 산소 부족으로 성장률이 완만해지는 환기지배형 전이 양상을 대변한다. 표준화된 화재를 가정하므로 별도의 화재크기 산정 없이도 일반적인 화재에 안전측으로 대응할 수 있어 접근성이 매우 좋다는 장점이 있다." }, { type:"callout", text:"➡ 그러나 표준시간-가열온도곡선은 실제 가연물의 종류·양·연소속도를 반영하지 못하는 한계가 있다. 가연물 하중이 크고 연소속도가 빠른 화재는 표준곡선보다 온도가 더 빨리, 더 높게 상승할 수 있어 낮은 안전측(미달) 문제가, 반대의 경우 지나친 여유(과설계) 문제가 발생할 수 있다." }] },
    { title:"2. 시방위주설계 vs 성능위주설계", blocks:[{ type:"p", text:"시방위주(Prescriptive-based)설계는 화재크기를 표준화된 값으로 미리 정해놓고, 그 표준값에 대응하도록 설계기준을 그대로 적용하는 방식이다(예: 표준형 스프링클러 헤드 간격을 용도별로 이미 정해진 수평거리로 그대로 적용). 성능위주(Performance-based)설계는 실제 화재크기(설계화재)를 직접 산정하여 그에 맞춰 설비 성능을 설계하는 방식이다." }, { type:"table", headers:["구분", "시방위주설계", "성능위주설계"], rows:[["기준", "표준화된 화재(테이블 값)", "실제(설계) 화재크기를 직접 산정"], ["접근성·설계속도", "쉽고 빠름", "데이터·해석이 많이 필요해 느림"], ["경제성", "여유율 반영으로 과설계 발생 가능", "화재크기에 맞춘 경제적·공학적 설계"], ["한계", "실제 화재를 반영하지 못해 과설계/미달 영역 혼재", "설계비용·전문성 요구 높음"]] }, { type:"p", text:"성능위주 피난설계는 실제 화재가 위험 수준(ASET, 허용피난시간)에 도달하는 시간과 재실자의 실제 피난완료시간(RSET)을 비교하는 방식으로 이루어진다. 설계화재(설계 열방출률)가 실제 화재보다 소방시설의 성능여유를 더 키운 것이면 성능위주 내화설계가 유효하다고 본다." }, { type:"callout", text:"➡ 시방위주·성능위주설계의 가장 큰 차이는 '불의 크기(화재 사이즈)를 미리 정해놓고 시작하는가, 직접 찾아서 시작하는가'이다." }] },
    { title:"3. 내장재의 분류(불연·준불연·난연)와 시험기준", blocks:[{ type:"p", text:"내장재는 화재 시 화염이 얼마나 빨리 확산되는지에 따라 불연재료·준불연재료·난연재료로 구분한다. 피난경로는 1차 안전구역(복도·통로)→2차 안전구역(계단실·부속실)→건물 밖 순으로 안전도가 높아지므로, 안전도가 높아야 하는 공간일수록 더 엄격한 내장재 등급을 요구한다." }, { type:"table", headers:["설치 위치", "허용 마감재료"], rows:[["거실의 벽·반자 등 실내 접하는 부분", "불연재료·준불연재료·난연재료 모두 인정"], ["복도·계단(일반)", "불연재료 또는 준불연재료(난연재료 불인정)"], ["피난계단·특별피난계단", "불연재료만 인정(준불연재료도 불인정)"], ["다중이용업소·문화집회시설의 다중이용 부분, 지하층", "불연재료 또는 준불연재료(난연재료 불인정)"]] }, { type:"table", headers:["시험 항목", "불연재료", "준불연재료", "난연재료"], rows:[["실 평균온도 유지시간(불연성시험)", "10분간 750±5℃ 유지", "-", "-"], ["가열개시 후 20분간 최고온도 상승", "최종 평형온도 대비 20K 초과 불가", "-", "-"], ["가열 후 질량감소율", "30% 이하", "-", "-"], ["가스유해성시험 실험용쥐 평균행동정지시간", "9분 이상", "9분 이상", "5분 이상"], ["열방출률시험 가열강도·시간", "-", "50kW/㎡, 10분간", "50kW/㎡, 10분간"], ["총방출열량", "-", "8MJ/㎡ 이하", "동일 항목, 시간만 5분"], ["최대 열방출률(10초 이상 연속)", "-", "200kW/㎡ 이하", "동일"]] }, { type:"callout", text:"➡ 불연재료·준불연재료·난연재료 모두 가스유해성시험은 공통이며, 준불연재료·난연재료의 차이는 사실상 '가열시간'(준불연 10분, 난연 5분) 하나뿐이라는 점이 시험기준 암기의 핵심이다." }] },
    { title:"4. 복합자재(샌드위치패널) 실물모형시험과 가스유해성시험", blocks:[{ type:"p", text:"강판과 심재로 이루어진 복합자재(샌드위치패널)는 개별 재료시험 외에 실물모형시험을 추가로 받아야 한다(대형 냉동창고·공장 화재사고를 계기로 도입). 내부 마감재료로 쓸 경우 국토교통부장관이 고시하는 복합자재 실물모형시험 기준에 합격해야 하며, 그라스울·미네랄울을 심재로 사용하고 가스유해성시험을 만족하면 열방출률시험을 생략할 수 있다." }, { type:"ul", items:["시험체 개구부 등에서 외부로 불꽃이 발생하지 않을 것", "시험체 상부 천장의 평균온도가 650℃를 초과하지 않을 것", "시험체 바닥의 복사열량계 열량이 25kW/㎡를 초과하지 않을 것", "시험체 바닥의 신문지 뭉치에 착화되지 않을 것(상부 화염이 낙하물로 바닥을 착화시키지 않는지 확인)", "화재성장단계에서 급격한 화염분출이 없을 것"] }, { type:"p", text:"가스유해성시험은 실험용 쥐(생쥐)를 이용해 연소가스의 독성을 평가하는 시험이다. 30℃로 유지되는 피검상자에 회전바구니(쥐 8마리)를 넣고, 가열로에서 시험체(220mm×220mm, 25mm 구멍 3개, 두께 최대 150mm)를 LP가스로 3분, 전열로 3분(총 6분) 가열해 연소가스를 발생시킨다." }, { type:"table", headers:["구분", "값"], rows:[["피검상자 온도", "30℃ 유지"], ["가열 시간", "LP가스 3분 + 전열 3분 = 총 6분"], ["공기공급", "1차 3L/min, 2차 25L/min (가열 중에만 배기구 개방)"], ["측정", "가열 개시 후 15분 이내 실험용 쥐의 행동정지시간 측정, 8마리 평균 산출(표준편차 보정)"], ["판정", "평균 행동정지시간이 9분 이상(난연재료는 5분 이상)이면 합격"]] }, { type:"callout", text:"➡ 가열시간 6분+행동정지 관찰 9분=15분이라는 시간 구조를 기억하면 '가열 6분 동안 배기구 개방 → 가열 종료 후 배기구 폐쇄(연기 축적) → 9분간 행동정지시간 관찰'의 시험 절차 전체가 자연스럽게 연결된다." }] }

    { q:"표준시간-가열온도곡선의 온도 산정식은?", a:"온도(℃) = 345·log10(8t+1) + 20 (t는 분 단위)." },
    { q:"표준시간-가열온도곡선의 형태가 대변하는 화재 양상은?", a:"초기 급격한 성장(연료지배형, ∝t²) 이후 산소부족으로 성장률이 완만해지는 환기지배형 전이 양상을 대변하는 곡선이다." },
    { q:"표준시간-가열온도곡선의 가장 큰 한계는?", a:"실제 가연물의 종류·양·연소속도에 따른 화재크기 차이를 반영하지 못하므로, 실제 화재가 표준곡선보다 더 크면 위험측(미달), 더 작으면 과설계가 될 수 있다." },
    { q:"내화시험에서 '제하중시험'과 '비제하중시험'의 차이는?", a:"제하중시험은 주요구조부(기둥 등)처럼 하중을 지지하는 부재에 실제 하중을 걸고 가열해 하중지지력을 평가하고, 비제하중시험은 비내력벽처럼 하중지지를 요구하지 않는 부재를 하중 없이 가열시험한다." },
    { q:"시방위주설계와 성능위주설계의 가장 근본적인 차이는?", a:"불의 크기(화재 사이즈)를 표준값으로 미리 정해놓고 시작하는가(시방위주), 실제 화재 크기를 직접 산정하여 시작하는가(성능위주)의 차이다." },
    { q:"시방위주설계의 장점과 단점은?", a:"장점은 접근성이 좋고 설계가 쉽고 빠르다는 것이며, 단점은 실제 화재를 반영하지 못해 여유율이 커 과설계(비경제적)가 되거나, 반대로 특정 시나리오에서는 성능 미달이 될 수 있다는 점이다." },
    { q:"성능위주설계의 핵심 개념(설계화재)이란?", a:"실제 화재보다 소방시설의 성능을 더 키운 값을 설계화재(설계 열방출률)로 설정하고, 건축의 내화성능이 이 설계화재 시간보다 크면 성능위주 내화설계가 유효하다고 판단하는 방식이다." },

    { q:"다중이용업소·지하층의 내장재 기준은?", a:"불연재료 또는 준불연재료만 인정되며 난연재료는 인정되지 않는다." },

    { q:"준불연재료와 난연재료 시험기준의 실질적 차이는?", a:"시험 항목과 판정기준은 거의 동일하며, 가열시간만 준불연재료 10분, 난연재료 5분으로 다르다." },
    { q:"가스유해성시험의 목적과 공통 적용 대상은?", a:"연소 시 발생하는 가스의 독성(유해성)을 평가하는 시험으로, 불연재료·준불연재료·난연재료 모두에 공통으로 적용된다." },
    { q:"가스유해성시험의 시험체 규격과 가열 절차는?", a:"시험체는 220mm×220mm, 25mm 구멍 3개 뚫음, 두께는 실제와 같되 최대 150mm까지이며, LP가스로 3분+전열로 3분(총 6분) 가열한다." },
    { q:"가스유해성시험 판정 기준(불연·준불연 vs 난연재료)은?", a:"실험용 쥐 8마리의 평균 행동정지시간이 9분 이상이면 불연재료·준불연재료 합격, 난연재료는 5분 이상이면 합격이다." },
    { q:"복합자재(샌드위치패널)에 실물모형시험을 별도로 요구하는 이유는?", a:"과거 샌드위치패널을 마감재로 쓴 대형 냉동창고·공장 등의 화재사고가 크게 발생했음에도 이를 규율할 별도 기준이 없었기 때문에, 강판·심재 구성의 복합자재 전용 실물모형시험 기준을 신설한 것이다." },
    { q:"복합자재 실물모형시험의 주요 판정 항목은?", a:"개구부에서 외부로 불꽃 미발생, 상부 천장 평균온도 650℃ 이하, 바닥 복사열량계 열량 25kW/㎡ 이하, 바닥 신문지뭉치 미착화, 화재성장단계 급격한 화염분출 없음." }
  ]

    { q:"[93회] 건축물 실내마감재는 불연성능에 따라 KS에 의한 성능시험을 통해 불연재료, 준불연재료, 난연재료로 분류할 수 있다. 불연재료와 난연재료의 시험항목을 비교하여 설명하시오.", a:"불연재료는 불연성시험(750±5℃ 10분 유지, 질량감소율 30% 이하)과 가스유해성시험(행동정지 9분 이상)을 받고, 난연재료는 열방출률시험(50kW/㎡, 5분, 총방출열량 8MJ/㎡ 이하)과 가스유해성시험(행동정지 5분 이상)을 받는다." },
    { q:"[101회] 불연재료와 준불연재료가 갖추어야 할 각각의 성능기준에 대하여 설명하고 성능판정을 위한 시험체 및 시험횟수 등 관련 기준을 시험규격별로 설명하시오.", a:"불연재료는 불연성시험(750±5℃ 10분)·가스유해성시험(9분 이상), 준불연재료는 열방출률시험(50kW/㎡ 10분, 8MJ/㎡ 이하)·가스유해성시험(9분 이상)을 받으며, 시험체는 3개(각 1회씩 3회) 또는 복합자재는 심재별로 시험한다." },
    { q:"[136회] 건축물 내부 마감재료 중 불연재료와 난연재료에 대한 성능 기준을 설명하시오.", a:"불연재료는 750±5℃ 10분 유지·질량감소율 30% 이하·가스유해성 9분 이상, 난연재료는 50kW/㎡ 5분 가열·총방출열량 8MJ/㎡ 이하·가스유해성 5분 이상을 만족해야 한다." },
    { q:"[79회] 국내건축법 및 미국 방화기준(NFPA)에 의한 불연성 내장재 분류등급의 내용 및 성능 기준을 설명하시오.", a:"국내는 불연·준불연·난연 3등급(가열시간 차등)으로 분류하고, NFPA(ASTM E84 Class A/B/C 등)는 화염확산지수(Flame Spread Index)와 연기발생지수(Smoke Developed Index)를 기준으로 등급을 나눈다는 점이 다르다." },
    { q:"[84회] 건축물의 화재예방을 위하여 건축관계법에 규정된 내장재의 건축용도별 적용규모 및 부위별 방화재료의 적용기준에 대하여 기술하시오.", a:"거실은 불연·준불연·난연재료 모두 인정, 복도·계단은 불연·준불연재료만, 피난계단·특별피난계단은 불연재료만 인정되며 다중이용업소·지하층은 난연재료가 제외된다." },
    { q:"[112회] 플래시오버(Flash Over)를 정의하고, 화원의 크기, 내장재료, 개구율과 플래시오버와의 관계에 대하여 설명하시오.", a:"내장재가 가연성·저열관성일수록 화재확산이 빨라 플래시오버 발생을 촉진하며, 불연·준불연재료로 마감할수록 내장재를 통한 화염전파가 억제되어 플래시오버 발생시간이 지연된다." },
    { q:"[118회] 건축물 실내 내장재의 방염의 원리·방염대상물품·방염성능 기준과 방염의 문제점 및 해결방안에 대하여 설명하시오.", a:"방염은 가연물 표면에 난연 처리를 하여 착화·연소확산을 지연시키는 원리이며, 카펫·커튼·전시용 합판 등이 대상물품이다. 문제점은 방염성능 시간 경과에 따른 저하·유지관리 미흡이며, 정기 성능시험과 인증 갱신 제도로 보완한다." },
    { q:"[121회] 건축법령상 건축물 실내에 접하는 부분의 마감재료(내장재)를 난연성능에 따라 구분하고, 마감재료의 성능기준과 시험방법에 대하여 설명하시오.", a:"불연재료(불연성시험+가스유해성시험), 준불연재료(열방출률시험 10분+가스유해성시험), 난연재료(열방출률시험 5분+가스유해성시험)로 구분되며 각 시험방법은 KS 기준에 따른다." },
    { q:"[86회] 최근 샌드위치판넬을 사용한 이천 냉동창고와 서울 은평구 유흥업소 화재로 대형 인명피해가 발생하였다. 샌드위치판넬의 재료별 특성 및 화재위험성에 대하여 설명하시오.", a:"우레탄폼·EPS 등 유기계 심재는 착화가 쉽고 유독가스를 다량 발생시켜 화재위험성이 매우 크며, 그라스울·미네랄울 등 무기계 심재는 상대적으로 안전해 가스유해성시험을 만족하면 열방출률시험을 면제받을 수 있다." },
    { q:"[92회] 샌드위치 판넬 4가지에 대한 재료별 특성에 대하여 설명하시오.", a:"우레탄폼(단열성 우수, 착화 쉬움), EPS(경량, 가연성 높음), 그라스울(불연성, 단열성능 상대적으로 낮음), 미네랄울(불연성, 내열성 우수)로 구분되며 화재위험성은 유기계(우레탄·EPS)가 무기계(그라스울·미네랄울)보다 훨씬 높다." },
    { q:"[88회] 피난·방화규칙(복합자재 사용이 가능한 공장용도)에 따른 소규모 공장용도 건축물의 조건과 내부마감재료 등에 기술하시오.", a:"일정 규모 이하의 소규모 공장용도 건축물은 완화된 조건으로 복합자재(샌드위치패널) 사용이 가능하나, 내부마감재료는 실물모형시험 등 국토교통부 고시 기준을 만족해야 한다." },
    { q:"[128회] 건축자재품질인정관리기준 복합자재외벽마감재료 불연재료성능기준 및 실물모형시험기준을 설명하시오.", a:"외벽 마감재료로 복합자재를 사용할 경우 불연성시험·가스유해성시험을 만족하고, 추가로 국토교통부 고시 실물모형시험(개구부 화염 미발생, 상부 650℃ 이하, 바닥 복사열량 25kW/㎡ 이하 등)에 합격해야 한다." }
  ]
};

  notes:[
    { title:"1. 방화구조 vs 내화구조", blocks:[{ type:"p", text:"방화구조는 화재의 확산을 일정 시간 저지해주는 구조로, 하중지지력을 요구하지 않으며 몇 시간까지 견뎌야 한다는 명확한 시간적 성능기준도 없다. 화재의 성장기(플래시오버 이전) 단계에서 옆으로의 연소 확대를 늦추는 역할에 그친다." }, { type:"table", headers:["방화구조 기준(두문자 '철석회시심산')", "두께"], rows:[["철망모르타르 바르기", "2cm 이상"], ["석고판 위에 시멘트모르타르·회반죽을 바른 것", "2.5cm 이상"], ["시멘트모르타르 위에 타일을 붙인 것", "2.5cm 이상"], ["심벽에 흙으로 맞벽치기 한 것", "두께 무관(구조 자체 인정)"], ["산업표준화법에 따른 방화 2급 이상 재료", "해당 표준 기준"]] }, { type:"p", text:"내화구조는 화재 시 건축물의 강도·성능(하중지지력·차염성·차열성)을 일정 시간 유지할 수 있는 구조로, 철근콘크리트조·연와조 등이 대표적이다. 주요구조부(벽·기둥·바닥·보·지붕·주계단)에 적용되며, 화재 확산 방지뿐 아니라 건물 붕괴 방지까지 목적으로 한다." }, { type:"callout", text:"➡ 방화구조=시간 관점 없이 옆으로의 화재 확산만 방지(하중지지력 불요, 플래시오버 이전 대응). 내화구조=하중지지력·차염성·차열성을 정해진 시간 동안 모두 유지(포스트플래시오버 이후까지 대응, 붕괴 방지 포함)." }] },
    { title:"2. 내화시험의 방법과 판정기준", blocks:[{ type:"p", text:"내화시험은 실제 크기(3m×3m을 넘으면 3m×3m까지만) 시험체를 표준시간-가열온도곡선(345·log10(8t+1)+20)으로 한쪽 면만 가열하며, 부재의 유형(수직 내력구획부재·수평구획부재·기둥·보·수직 비내력구획부재)별로 가열로 규격과 하중 재하 여부가 달라진다." }, { type:"table", headers:["부재 유형", "가열로 규격", "시험방식", "판정 성능"], rows:[["수직 내력구획부재(내력벽)", "3m×3m", "제하가열시험", "하중지지력·차염성·차열성"], ["수평구획부재(바닥)", "4m×3m", "제하가열시험", "하중지지력·차염성·차열성"], ["기둥", "3m×3m", "제하가열시험", "하중지지력만(차염성·차열성 무의미)"], ["보", "4m 수평가열로", "제하가열시험", "하중지지력만"], ["기둥·보 비제하가열시험", "동일", "비제하가열시험", "강재 평균온도 538℃·최고 649℃ 이하"], ["수직 비내력구획부재(비내력벽)", "4m×3m", "제하가열시험", "차염성·차열성만(하중지지력 불요)"]] }, { type:"p", text:"판정기준은 하중지지력(내력부재 변형량·변형률이 규정 범위를 초과하지 않을 것: 수평부재 처짐 L/400㎜, 처짐률 L²/9000D㎜, 축방향부재 수축률 등), 차염성(면패드 미착화, 이면에 10초 이상 지속되는 화염이 없을 것, 6㎜ 균열게이지가 150㎜ 이동하며 관통하지 않을 것, 25㎜ 균열게이지가 관통하지 않을 것), 차열성(이면 평균온도상승 140K 이하, 최고온도상승 180K 이하)으로 구성된다." }, { type:"callout", text:"➡ 세 성능은 인과적으로 연결된다. 하중지지력을 만족하지 못하면(부재가 무너지면) 차염성·차열성 판정은 의미가 없고, 차염성을 만족하지 못하면(화염이 이면으로 넘어가면) 차열성 판정도 의미가 없다." }] },
    { title:"3. 일반구조·인정구조와 요구내화시간", blocks:[{ type:"p", text:"요구내화시간은 건축물의 용도·규모·부위별로 이미 법령(건축물의 피난·방화구조 등의 기준에 관한 규칙 별표)에 정해져 있다. 대체로 기둥·보(건물을 떠받치는 주요부재)가 가장 크고, 그다음 벽·바닥, 지붕이 가장 작다(예: 3-2-1 시간 체계)." }, { type:"p", text:"일반구조는 별도 시험 없이도 내화성능이 있다고 오랜 경험적으로 인정된 구조다(예: 철근콘크리트조로서 두께 10㎝ 이상인 벽체는 별도 시험 없이 내화구조로 인정). 인정구조는 실제로 표준시간-가열온도곡선에 따른 가열시험을 거쳐 성능(하중지지력·차염성·차열성이 확보되는 시간)을 확인받은 구조다." }, { type:"callout", text:"➡ 플로차트: 용도·규모·부위별 요구내화시간이 정해져 있고, 인정구조는 표준시간가열시험으로 확인한 내화성능이 이 요구내화시간보다 크면 내화구조로 인정된다. 일반구조는 애초에 성능 확인 절차 자체가 생략된다." }] },
    { title:"4. 성능위주 내화설계의 흐름", blocks:[{ type:"p", text:"시방위주 내화설계는 화재크기를 표준화된 값으로 고정하고 요구내화시간표를 그대로 적용하는 방식이다. 반면 성능위주 내화설계는 실제 설계화재(비표면적·연소열·화재하중·최고온도·공기공급·지속시간 등 화재가혹도 데이터)를 근거로 실제 시간-온도 곡선을 산정하고, 이를 기준으로 내화성능을 도출·비교하는 방식이다." }, { type:"ul", items:["재료의 열전도계수·기계적 성질(강도저하 특성) 등 열적 특성 데이터", "구조체 단면 구성(철근 배근·피복두께·골재 종류 등) 데이터", "과거 화재실험으로 축적된 데이터베이스"] }, { type:"callout", text:"➡ 성능위주 내화설계가 성립하려면 '내화성능 > 설계화재시간'이어야 한다. 시방위주보다 경제적·정밀한 설계가 가능하지만, 방대한 데이터와 고도의 전문성을 필요로 하므로 설계 과정이 복잡하다." }] }

    { q:"방화구조의 기준(두문자 '철석회시심산')을 나열하면?", a:"철망모르타르 바르기(2㎝ 이상), 석고판 위 시멘트모르타르·회반죽(2.5㎝ 이상), 시멘트모르타르 위 타일 붙임(2.5㎝ 이상), 심벽에 흙으로 맞벽치기, 산업표준화법 방화2급 이상 재료." },

    { q:"기둥·보의 비제하가열시험 판정 기준은?", a:"내화피복·내화도료 등을 시공한 상태에서 하중 없이 가열하며, 강재의 평균온도가 538℃, 최고온도가 649℃를 넘지 않아야 한다." },

    { q:"요구내화시간이란 무엇인가?", a:"건축물의 용도·규모·부위별로 법령의 별표에 미리 정해져 있는, 주요구조부가 갖추어야 할 최소 내화 견딤 시간이다." },
    { q:"요구내화시간의 부위별 중요도 순서는?", a:"기둥·보(건물을 직접 떠받치는 부재)가 가장 크고, 그다음 벽·바닥, 지붕이 가장 낮다(대략 3-2-1 시간 체계)." },

    { q:"시방위주 내화설계와 성능위주 내화설계의 근본적 차이는?", a:"시방위주는 화재크기를 표준값으로 고정하고 요구내화시간표를 그대로 적용하고, 성능위주는 실제 설계화재(화재가혹도)를 직접 산정해 그에 맞춰 내화성능을 설계한다." },
    { q:"성능위주 내화설계에 필요한 데이터는?", a:"재료의 열전도계수·기계적 성질 등 열적 특성 데이터, 구조체 단면 구성(철근 배근·피복두께·골재) 데이터, 과거 화재실험 데이터베이스가 방대하게 필요하다." },
    { q:"성능위주 내화설계가 성립하는 조건과 장단점은?", a:"내화성능이 설계화재시간보다 커야 성립하며, 화재크기에 맞춘 경제적·정밀한 설계가 가능한 장점이 있지만 데이터·전문성 요구가 매우 높아 설계가 복잡하다는 단점이 있다." }
  ]

    { q:"중성화가 철근에 미치는 영향은?", a:"알칼리 환경이 형성하던 부동태피막이 파괴되어 철근이 부식되고, 부식에 따른 부피 팽창이 콘크리트를 밀어내 구조물 붕괴로 이어질 수 있다." },
    { q:"온도별 콘크리트 내부 물질 변화(100℃, 300℃, 400℃, 600~800℃)는?", a:"100℃에서 자유공극수 기화 시작(1700배 팽창), 300℃에서 시멘트 화학적 변질 시작, 400℃에서 화학적 결합수 방출, 600~800℃에서 콘크리트 파열 시작이다." },
    { q:"폭렬(스폴링)의 3가지 원인은?", a:"① 수증기압에 의한 폭렬 ② 열응력(재료별 열팽창 차이)에 의한 폭렬 ③ 중성화에 따른 철근 부식·팽창에 의한 폭렬이며, 실제로는 세 가지가 복합적으로 작용한다." },
    { q:"고강도 콘크리트에서 폭렬이 더 잘 일어나는 이유는?", a:"밀도가 매우 높아 내부에서 발생한 수증기가 빠져나갈 통로가 없어 압력이 그대로 축적되기 때문이다." },
    { q:"폭렬이 건물 붕괴로 이어지는 과정은?", a:"폭렬로 유효 단면적이 감소해 응력이 집중되고, 노출된 철근이 고열에 직접 노출되어(538℃에서 잔존강도 약 1/2) 인장강도가 급격히 저하되며 결국 하중지지력이 저하된다." },
    { q:"섬유혼입 콘크리트란?", a:"폴리프로필렌 섬유를 콘크리트에 혼입해 열을 받으면 섬유가 녹아 미세한 배출 통로가 생기게 함으로써 수증기압을 빠져나가게 하는 폭렬 방지 콘크리트다." },
    { q:"폭렬 방지대책을 요약하면?", a:"섬유혼입콘크리트·다공질골재 사용(수증기 배출 통로 확보), 콘크리트 강도 향상·충분한 양생(자체 강도 강화), 부착력 큰 재질로 감싸 탈락 방지, 자동식소화설비로 화재 저감, 성능위주설계로 내화성능을 설계화재시간보다 크게 확보하는 5가지로 정리된다." },
    { q:"방화지구란 무엇인가?", a:"화재 위험을 예방하기 위해 국토교통부·지방자치단체가 지정하는 지구로, 도시정비 미흡으로 건축물이 밀집되었거나 소방차 접근이 곤란한 지역, 화재·폭발·유독가스 발생 우려가 큰 지역이 대상이다." },
    { q:"방화지구 안 건축물의 구조 기준은?", a:"주요구조부·외벽은 내화구조, 지붕은 불연재료로 해야 하며, 연소우려 부분의 창문에는 갑종방화문 또는 드렌처설비를 설치해야 한다." },
    { q:"화재예방강화지구란?", a:"화재예방 및 안전관리에 관한 법률에 따라 시·도지사가 지정하는 지구로, 노후·불량 건축물 밀집지역·산업단지·물류단지·소방서장이 필요성을 인정한 지역 등이 대상이다." },
    { q:"둘 이상의 소방대상물을 별개로 보는 대표 요건은?", a:"개구부가 없는 내화구조의 바닥·벽으로 완전히 구획되어 있거나, 화재 감지와 연동해 자동으로 폐쇄되는 방화셔터·갑종방화문 또는 드렌처설비가 설치되어 있는 경우다." },
    { q:"둘 이상의 소방대상물을 하나로 보는 대표 요건은?", a:"벽이 없는 내화구조 연결통로가 6m 이하, 벽이 있으면 10m 이하인 경우, 또는 내화구조가 아닌 연결통로·컨베이어·배관·지하가로 연결된 경우다." },
    { q:"연결통로의 벽 유무에 따라 6m·10m로 기준이 다른 이유는?", a:"벽이 없으면 열·연기가 바로 옆 건물로 개방된 채 전파될 수 있어 더 짧은 거리(6m)로 엄격히 보고, 벽이 있으면 화염이 벽을 타고 돌아가야 하므로 더 긴 거리(10m)까지 허용한다." },
    { q:"복합건축물에서 공동주택과 위락시설을 함께 설치할 때 필요한 안전대책은?", a:"출입구 별도 설치(보행거리 30m 이상 이격), 승강기 완전 분리, 내화구조 바닥·벽으로 구획, 주요구조부 내화구조, 복도·계단 준불연재료 이상, 피난계단·특별피난계단 불연재료 이상을 갖춰야 한다." },
    { q:"완화 기준에도 불구하고 절대 함께 설치할 수 없는 용도 조합은?", a:"아동관련시설·노인복지시설과 도매시장, 그리고 다중주택·다가구주택·공동주택·조산원·산후조리원·다중생활시설은 서로 절대 분리해야 한다." },
    { q:"동일 건축물 안에 함께 설치할 수 없는 대표 용도는?", a:"의료시설·아동관련시설·노인복지시설·공동주택·장례식장 등과 위락시설·위험물저장처리시설·공장·자동차정비공장은 원칙적으로 함께 설치할 수 없다." },
    { q:"공장과 기숙사가 같은 건물에 있는 경우는 어떻게 처리되는가?", a:"원칙적으로 함께 설치가 제한되는 조합이지만 예외적으로 인정되는 사례이다." },
    { q:"복합건축물 안전대책에서 피난계단·특별피난계단의 마감재 기준이 복도·계단보다 엄격한 이유는?", a:"피난안전구역에 가까울수록(2차 안전구역) 화재로부터의 안전도가 더 확보되어야 하므로 불연재료만 인정하는 등 더 엄격한 기준을 적용한다." }
  ]
};

  notes:[
    { title:"1. 외벽 마감재료 규제와 화재확산방지구조", blocks:[{ type:"p", text:"상업지역 내 일정 용도·규모의 건축물, 3층 이상 또는 높이 9m 이상 건축물, 필로티 주차장 건축물, 공장·창고 등은 외벽 마감재료를 불연재료 또는 준불연재료로 사용해야 한다. 다만 화재확산방지구조를 설치하면 난연재료까지 완화해 인정한다(단, 필로티처럼 벽 자체가 없는 구조에는 화재확산방지구조를 적용할 수 없어 대상에서 제외된다)." }, { type:"p", text:"커튼월(Curtain Wall) 타입은 콘크리트가 아닌 유리 등으로 외벽을 마감하는 방식이며 외단열 공법(단열재를 건물 외부에 부착)과 함께 쓰이는 경우가 많다. 외단열재는 화재 시 위층으로 화염이 타고 올라가는 경로가 될 수 있으므로, 외벽마감재와 외벽마감재 지지구조 사이 공간을 매층 최소 높이 400㎜ 이상 화재확산방지재료로 밀실하게 채워야 한다(5층 이하·높이 22m 미만 건축물은 2개층마다 1회 채움으로 완화)." }, { type:"table", headers:["화재확산방지재료의 종류", "규격"], rows:[["방화석고보드", "12.5㎜ 이상 또는 15mm 이상(2겹)"], ["석고시멘트판·평형시멘트판", "6㎜ 이상"], ["미네랄울 보온판", "2호 이상"], ["내화성능시험 대체", "15분 차염성 및 이면온도 120K 이상 상승하지 않는 재료"]] }, { type:"callout", text:"➡ 외단열은 화재가 외벽 안쪽(구조체 사이 공간)을 타고 올라가는 것을, 커튼월은 외벽마감재·지지구조 사이 공간을 타고 올라가는 것을 각각 막기 위한 구조이며, 두 구조 모두 400㎜ 밀실 충전이라는 동일한 원리를 사용한다." }] },
    { title:"2. 창을 통한 상층연소확대와 코안다 효과", blocks:[{ type:"p", text:"발코니를 확장한 최근 아파트는 화재 시 창을 통해 위층으로 불이 바로 옮겨붙는 위험성이 커졌다. 과거에는 콘크리트 구조체(스팬드럴)가 상하층 창 사이를 막아주었지만, 발코니 확장으로 그 완충 콘크리트가 사라졌기 때문이다." }, { type:"p", text:"코안다 효과(Coanda effect)는 유체가 만곡면을 흐를 때 표면에 밀착되어 흐르려는 성질이다. 창을 통해 분출되는 화염의 분출력보다 벽면과의 부착력(코안다 효과)이 크면, 화염은 벽면을 타고 위층으로 신장되어 상층 연소확대를 일으킨다. 개구부(창) 높이가 낮을수록 분출압력이 낮아져 분출력이 약해지고 상대적으로 부착력이 우세해지므로, 종장창보다 횡장창(가로로 넓은 창)이 상층연소확대에 더 취약하다." }, { type:"table", headers:["연소확대 경로", "정의"], rows:[["코안다 효과(Coanda effect)", "분출 화염이 벽면에 부착되어 흐르며 신장되어 상층으로 확대되는 현상"], ["리프노(Leapfrogging)", "화염이 개구리처럼 층을 건너뛰어 확산되는 현상(예: 2층 화재가 4층으로)"], ["포어스루(Poke-through)", "관통부 내화충전구조가 탈락되어 그 틈으로 연소가 확대되는 현상"]] }, { type:"ul", items:["건축적 대책: 스팬드럴(콘크리트 구조체) 또는 캔틸레버(콘크리트를 발코니 길이만큼 외부로 돌출) 설치", "재료적 대책: 방화유리·방화판 설치", "설비적 대책: 창문형 스프링클러(윈도우 스프링클러) 설치로 유리 전면을 물로 피복", "화재크기 저감: 가연물량 제한, 자동식소화설비 설치"] }] },
    { title:"3. 페일세이프·풀프루프 피난설계 원칙", blocks:[{ type:"p", text:"풀프루프(Fool-proof) 원칙은 화재 시 패닉 상태(이성적 판단 저해)에서도 인간 본능에 따라 피난할 수 있도록 설계하는 것이다. 피난동선을 단순·명확하게 만들고 막다른 부분을 제한하는 것이 핵심이다." }, { type:"p", text:"페일세이프(Fail-safe) 원칙은 하나의 피난 수단이 실패하더라도 다른 수단으로 안전하게 피난할 수 있도록 병렬 시스템을 구성하는 것이다. 소방에서는 주펌프+예비펌프, 옥상수조(페일세이프 수원), 50층 이상 건축물의 수직배관 2계통 이상+각 계통 유수검지장치 설치, 양방향 피난 확보(직통계단 2개소 이상) 등으로 구현된다." }, { type:"callout", text:"➡ 옥내소화전 호스를 방수구에 결합된 상태로 두는 것도 풀프루프의 예다. 화재 패닉 상태에서 손이 떨려도 밸브만 열면 물이 나오도록 만든 것이다." }] },
    { title:"4. 피난층·직통계단·공용이용통로·막다른 부분", blocks:[{ type:"p", text:"피난층은 건물에서 문을 열고 나가면 바로 지상(건물 바깥 지면)이 나오는 층으로, 반드시 1층일 필요는 없으며(경사지에 지은 건물은 방향에 따라 여러 개일 수 있음) '직접 지상으로 통하는 출입구가 있는 층'으로 정의된다. 직통계단은 피난층이 아닌 층에서 피난층 또는 지상으로 계속 이어져 내려가는(중간에 다른 층 복도를 거치지 않는) 계단이다." }, { type:"table", headers:["기준", "일반", "내화구조·불연재료"], rows:[["거실 각 부분→직통계단 보행거리", "30m 이하", "50m 이하(16층 이상 공동주택 40m)"], ["자동화 생산시설(스프링클러 등 설치)", "75m 이하", "무인화공장 100m 이하"]] }, { type:"p", text:"공용이용통로는 피난자가 피난통로나 분기점에 도달할 때까지 다른 방향을 선택할 여지 없이 한 방향으로만 이동해야 하는 비상구 접근로이다. 막다른 부분은 피난 중 통과했다가 막혀 있어 다시 돌아 나와야 하는 구간을 말한다. 국내 법령에는 이들의 길이 제한 규정이 없지만, NFPA는 공용이용통로를 스프링클러 설치 시 30m·미설치 시 23m, 막다른 부분을 스프링클러 설치 시 15m·미설치 시 6.1m까지로 제한한다." }] }

    { q:"페일세이프(Fail-safe) 원칙이란?", a:"하나의 피난 수단이 실패해도 다른 수단으로 안전하게 피난할 수 있도록 병렬 시스템(양방향 피난 등)으로 구성하는 설계 원칙이다." },

    { q:"직통계단이란 무엇인가?", a:"피난층이 아닌 층에서 피난층 또는 지상까지 중간에 다른 층 복도를 거치지 않고 곧바로 이어지는 계단이다." },

    { q:"공용이용통로와 막다른 부분의 차이는?", a:"공용이용통로는 피난통로·분기점까지 한 방향으로만 이동할 수밖에 없는 비상구 접근로이고, 막다른 부분은 피난 중 진입했다가 막혀 있어 되돌아 나와야 하는 구간이다." },
    { q:"NFPA에서 정하는 공용이용통로·막다른 부분의 길이 제한은?", a:"공용이용통로는 스프링클러 설치 시 30m·미설치 시 23m, 막다른 부분은 스프링클러 설치 시 15m·미설치 시 6.1m로 제한한다(국내에는 별도 제한 규정이 없다)." }

    { q:"계단실 바깥쪽 창문과 건물 다른 부분 창문 사이의 이격거리는?", a:"2m 이상 이격해야 한다(연기·화염이 창을 통해 계단실로 침투하는 것을 방지하기 위함)." },
    { q:"옥외 피난계단에 예비전원 조명설비·내부 마감재료 기준이 없는 이유는?", a:"이미 외기에 개방되어 있어 외부 불빛으로 계단이 잘 보이고 마감할 벽체 자체가 없기 때문이다." },

    { q:"2개소 이상 직통계단 배치 시 이격거리 기준은?", a:"가장 멀리 위치한 두 계단 출입구 간 직선거리가 건축물 평면 최대 대각선 길이의 1/2 이상이어야 한다(자동소화설비 설치 시 1/3로 완화)." },
    { q:"무창층의 정의는?", a:"지상층 중 피난·구조에 유효한 개구부 면적의 합계가 해당 층 바닥면적의 1/30 이하인 층이다." },
    { q:"무창층의 유효한 개구부 요건(두문자 '도피파개')은?", a:"도로 또는 차량 진입 가능 공지를 향할 것, 쉽게 피난할 수 있도록 장애물이 없을 것, 내·외부에서 쉽게 파괴 가능할 것, 지름 50㎝ 이상 원이 내접하고 바닥에서 높이 1.2m 이내일 것." },
    { q:"무창층의 화재위험성 3가지는?", a:"열축적이 빨라 온도상승이 빠르고, 연기가 배출되지 않아 연층하강시간이 빠르며, 피난·외부구조가 모두 어렵다는 점이다." },
    { q:"무창층에서 옥내소화전 설치기준이 어떻게 강화되는가?", a:"일반적으로 연면적 3,000㎡ 이상이면 설치하지만, 무창층은 바닥면적 600㎡ 이상이면 설치해야 한다(약 5배 강화)." },
    { q:"지하무창층 영화상영관에서 스프링클러 설치기준은?", a:"무대부는 300㎡마다, 그 외 부분은 500㎡마다 스프링클러 설비를 설치해야 한다." },
    { q:"무창층 소방시설 강화기준을 요약하는 두문자는?", a:"'소옥수경조재'(소화기구·옥내소화전·수신기·경보설비·비상조명등·제연설비)로 정리해 암기한다." },
    { q:"피난용승강기·비상용승강기 승강장의 공통 기본 요건은?", a:"건물 다른 부분과 내화구조 벽·바닥으로 구획, 출입구는 60분+/60분 방화문, 실내 마감재료는 불연재료, 예비전원에 의한 조명설비를 갖추어야 한다." },
    { q:"승강로의 구획 기준은?", a:"건물 다른 부분과 내화구조로 구획하되, 승강로는 바닥으로 막을 수 없으므로(계단과 마찬가지로) 벽으로만 구획하며 각 층에서 피난층까지 단일 구조로 연결된다." },
    { q:"승강기 기계실(권상기실)에 예비전원 조명·마감재료 기준이 없는 이유는?", a:"기계실은 피난 경로나 대피 공간이 아니므로 화재안전상 그러한 기준이 요구되지 않지만, 출입구가 있는 경우 방화문 설치 원칙은 동일하게 적용된다." },
    { q:"5층 이상 문화집회시설 등의 바닥면적이 2,000㎡를 넘을 때 규정은?", a:"2,000㎡마다 피난계단 또는 특별피난계단을 1개소씩 추가로 설치해야 한다." },
    { q:"5층 이상 층의 바닥면적이 200㎡ 이하이거나 200㎡마다 방화구획된 경우는?", a:"피난계단·특별피난계단 설치가 면제된다." }
  ]
};

  notes:[
    { title:"1. 피난용승강기의 세부 제어기준", blocks:[{ type:"p", text:"피난용승강기는 화재 시 통제자의 직접 조작 아래에서만 사용 가능해야 하며, 구동기·제어패널은 최상층 승강장보다 높은 위치에 두어 살수로부터 보호해야 한다. 전기장치는 IPX3 이상의 방수·방진 등급을 갖추고, 주전원은 물론 예비전원(초고층 2시간 이상, 준초고층 1시간 이상)까지 모두 상실되면 가장 가까운 피난안전구역 또는 피난층으로 자동 이동하여 문을 열고 대기하는 제어시스템을 갖춘다." }, { type:"p", text:"피난용으로 전환되면 승강장·카 내부의 기존 호출 등록은 모두 취소되고, 지정층에서 멀어지는 방향으로 운행 중이던 카는 지정층으로 복귀한다. 이후에는 카 내 조작패널을 통한 통제자의 조작으로만 운전이 이루어진다." }, { type:"table", headers:["구분", "기준"], rows:[["출입문", "카문과 승강장문이 연동되는 자동수평 개폐식"], ["폭·정격하중", "900㎜ 이상, 1,000kg 이상(의료시설은 침상 크기에 맞춤)"], ["문이 2개인 경우", "미사용 문은 65℃ 초과 온도·연기로부터 보호"], ["전기장치 등급", "IPX3 이상"]] }] },
    { title:"2. 비상용승강기의 설치대상과 승강장 구조", blocks:[{ type:"p", text:"높이 31m를 넘는 건축물에는 비상용승강기를 설치해야 하며, 각층 최대 바닥면적이 1,500㎡ 이하이면 1대, 1,500㎡를 넘으면 1대에 더해 3,000㎡마다 1대씩 추가한다. 다만 각층을 거실 외 용도로 쓰거나, 5개층 이하이면서 바닥면적 합계 500㎡ 이하(방화구획 시 완화)인 경우 등은 설치가 면제된다." }, { type:"p", text:"비상용승강기 승강장은 출입구를 제외한 부분을 내화구조 벽·바닥으로 구획하고, 출입구에는 60분+/60분 방화문(피난층은 제외 가능)을 설치하며, 채광창 또는 예비전원 조명설비, 노대 또는 배연설비를 갖추어야 한다. 피난층 승강장 출입구부터 공지(도로)까지 30m 이하여야 한다." }] },

    { title:"4. 피난기구의 종류·적응성과 ASET·RSET 성능위주설계", blocks:[{ type:"p", text:"피난기구는 두문자 '미·피·상·구·간·완·공·다·승'(미끄럼대·피난사다리·피난용트랩·구조대·간이완강기·완강기·공기안전매트·다수인피난장비·승강식피난기)으로 정리한다. 노유자시설·의료시설처럼 자력 이동이 어려운 대상에는 사다리·완강기처럼 신체적 동작이 필요한 기구는 부적합하고, 다수인피난장비·구조대·피난용트랩처럼 스스로 움직이지 않아도 되는 기구가 적합하다." }, { type:"p", text:"성능위주설계의 인명안전기준은 호흡선(바닥에서 1.8m) 기준 열·연기·독성·가시거리가 일정 수준(온도 60℃, CO 1,400ppm, CO₂ 5%, O₂ 15%, 가시거리 집회·판매시설 10m·고휘도유도등 7m·기타 5m)에 도달하는 시점까지를 인명안전 확보 시간으로 본다." }, { type:"table", headers:["용도(사상기호병)", "특성", "피난 시작 지연 요인"], rows:[["사무실", "상시 깨어있음, 피난로 익숙", "지연 요인 적음"], ["상점", "상시 깨어있음, 피난로 낯설음", "피난로 인지에 시간 소요"], ["기숙사", "피난로 익숙, 취침 가능", "경보 인지·각성에 시간 소요"], ["호텔", "피난로 낯설음, 취침 가능", "가장 지연이 큼(인지+동선 파악 모두 소요)"], ["병원(요보호자)", "자력피난 곤란", "구조자 도움 필요, 개시 자체가 지연"]] }, { type:"p", text:"경보방식은 신뢰도 순서로 W1(방재센터 훈련된 요원의 육성방송)>W2(사전 녹음된 방송)>W3(단순 경종·사이렌)이며, 신뢰도가 높을수록 재실자가 더 빨리 실제 화재로 인지하고 피난을 개시한다. ASET(허용피난시간, 위험 도달시간)>RSET(소요피난시간)이면 안전한 설계로 판단하며, RSET은 감지시간+경보 후 피난지연시간+이동시간으로 구성된다." }, { type:"callout", text:"➡ ASET을 늘리려면 화재크기 제한·불연화·소화설비 설치 등으로 화재성장을 늦추고, RSET을 줄이려면 감지속도가 빠른 감지기 사용·출입구 다변화(피난용량 증대)·신뢰도 높은 경보방식(W1) 채택 등을 고려한다." }] }

    { title:"답안 작성 전략", blocks:[{ type:"p", text:"ASET·RSET 문제는 정의(허용피난시간 vs 소요피난시간)와 안전판정식(ASET>RSET)을 먼저 제시한 뒤, RSET의 구성요소(감지시간+피난지연시간+이동시간)를 분해해 설명하는 순서가 표준적이다. 피난기구 문제는 설치장소의 재실자 특성(자력 이동 가능 여부)과 기구의 적응성을 연결지어 서술하면 논리적 감점을 피할 수 있다." }] }
  ],
  cards:[
    { q:"[74회] 피난수단으로 승강기 사용에 대하여 논하시오.", a:"전통적으로 승강기는 정전·오작동 우려로 피난수단에서 제외되었으나, 최근 예비전원·통제시스템을 갖춘 피난용승강기가 도입되어 고층건축물의 수직피난 시간을 단축하는 보조 피난수단으로 활용되고 있다." },
    { q:"[75회] 고층건물화재시 피난을 위해 건축법령이 규정한 옥상광장과 헬리포트 설치기준을 각각 쓰시오.", a:"옥상광장은 5층 이상 특정용도 건축물에 설치하며, 헬리포트는 11층 이상·바닥면적 1만㎡ 이상 건축물의 옥상(평지붕)에 길이·너비 22m(부족시 15m)로 설치한다." },
    { q:"[96회] 초고층 건축물의 피난을 위해 제시되고 있는 피난용 승강기의 성능기준을 설명하시오.", a:"통제자 전용조작, IP X3 이상 전기장치 보호, 예비전원 확보(초고층 2시간·준초고층 1시간), 정전 시 피난안전구역·피난층 자동복귀, 문 2개소 시 미사용문 열보호 등의 성능기준이 요구된다." },
    { q:"[98회] 건축관계법규에서 규정하는 옥상광장의 설치기준과 헬리포트 및 구조공간의 설치기준을 설명하시오.", a:"옥상광장은 5층 이상 위락·판매시설 등에 설치하고, 헬리포트(22m, 부족시 15m)와 구조공간(직경 10m 이상, 헬기 미착륙 구조바구니 방식)은 11층 이상·1만㎡ 이상 건축물에 설치한다." },
    { q:"[102회] 초고층 건축물 화재 시 대피를 위한 피난용승강기의 필요성 및 IBC 기준을 설명하시오.", a:"고층에서 계단 피난만으로는 노약자·장애인의 신속한 대피가 어려워 피난용승강기가 필요하며, IBC(국제건축코드)는 화재 시 통제된 운행·예비전원·연기침투 방지 등 세부 안전기준을 규정하고 있다." },
    { q:"[104회] 피난용승강기 설치기준을 기술하고 비상용승강기 설치기준과의 차이점을 비교 설명하시오.", a:"비상용승강기는 높이 31m 초과 건축물의 소방활동용이고, 피난용승강기는 고층건축물 승용승강기 중 1대 이상을 재실자 피난전용으로 지정하는 것으로, 피난용은 통제자 조작·예비전원 자동복귀 등 인명대피 특화기능이 추가된다." },
    { q:"[113회] 피난용승강기의 설치대상 및 세부기준, 피난용승강기 안전검사기준에 따른 추가요건을 설명하시오.", a:"고층건축물에 1대 이상 설치하며, 세부기준은 IPX3 전기장치 보호·예비전원 자동복귀·통제자 조작이고, 안전검사 추가요건은 구동기 위치(승강장보다 높게), 문 열보호(65℃), 카·승강장 IPX3 등이다." },
    { q:"[117회] 피난용승강기의 설치대상 및 설치기준을 설명하시오.", a:"고층건축물(30층 이상)의 승용승강기 중 1대 이상을 피난용으로 지정하며, 승강장·승강로 내화구조 구획, 예비전원(2시간/1시간), 통제자 조작, 정전시 피난안전구역 자동복귀 기준을 따른다." },
    { q:"[125회] 피난용 승강기의 필요성 및 설치대상, 설치 기준·구조·설비를 설명하시오.", a:"고층화에 따른 계단피난의 한계를 보완하기 위해 필요하며, 고층건축물 승용승강기 중 1대 이상을 지정해 내화구조 승강로·60분+방화문·예비전원·통제시스템을 갖춘다." },
    { q:"[131회] 피난용승강기 안전성능검증방안을 설명하시오.", a:"정기적인 예비전원 작동시험, 자동복귀 기능 시험, IPX3 방수·방진 성능시험, 통제반 연동시험 등을 통해 화재 시 실제 작동 여부를 검증한다." },
    { q:"[62회] 고층 병원에서 피난기구와 비상용 엘리베이터의 상관관계와 각 층에 설치하는 피난기구를 기술하시오.", a:"병원은 요보호자가 많아 자력 이동 곤란자 비율이 높으므로 완강기·사다리 등 신체동작이 필요한 기구는 부적합하고, 구조대·다수인피난장비 등 도움을 받아 이동 가능한 기구와 비상용 엘리베이터·피난용승강기의 병행 활용이 요구된다." },
    { q:"[77회] 피난기구의 종류와 설치기준에 대해 기술하시오.", a:"미끄럼대·피난사다리·피난용트랩·구조대·간이완강기·완강기·공기안전매트·다수인피난장비·승강식피난기의 9종이며, 설치개수·층수·용도별 적응성이 화재안전기술기준(NFTC 301)에 규정되어 있다." },
    { q:"[110회] 특정소방대상물에 피난기구를 설치할 때 감면조건을 설명하시오.", a:"주요구조부가 내화구조이고 직통계단 2개소 이상이 각각 규정에 적합하게 설치된 경우, 옥상광장·피난안전구역이 있는 경우 등 일정 조건을 만족하면 피난기구 설치를 감면할 수 있다." },
    { q:"[116회] 노유자시설·다중이용업소의 설치장소별 층별 적응성 있는 피난기구를 설명하시오.", a:"노유자시설은 구조대·피난교·다수인피난장비·승강식피난기 등 자력이동 없이 사용 가능한 기구가 적응성이 있고, 다중이용업소는 완강기·간이완강기·피난사다리 등 신체동작형 기구도 함께 적응성을 갖는다." },
    { q:"[72회] 건축물 화재시 거주 가능 조건(tenable condition)을 설명하시오.", a:"재실자가 스스로 안전하게 피난활동을 지속할 수 있는 한계조건으로, 호흡선(1.8m) 기준 온도·독성가스농도(CO·CO₂·O₂)·가시거리가 인체에 위해를 주지 않는 범위를 말한다." },
    { q:"[78회] 건축물의 성능기준 피난설계 시 피난시간(RSET)의 구성요소를 상술하시오.", a:"RSET(소요피난시간)은 감지시간(화재감지기 작동까지)+경보 후 피난개시 지연시간(재실자 인지·반응)+이동시간(실제 계단·통로 이동)의 합으로 구성된다." },
    { q:"[79회] 인명안전 평가시 사용되는 RSET과 ASET을 설명하시오.", a:"RSET(Required Safe Egress Time, 소요피난시간)은 재실자가 실제 피난을 완료하는 데 걸리는 시간이고, ASET(Available Safe Egress Time, 허용피난시간)은 화재가 인명안전기준에 도달하는 시간이며 ASET>RSET이어야 안전하다." },
    { q:"[83회] 성능위주 소방설계에서 고려해야 할 거주가능조건(tenable conditions)을 요약하고 ASET·RSET을 비교하시오.", a:"거주가능조건은 열·가시거리·독성가스농도가 인명에 위해를 주지 않는 범위이며, ASET(위험도달시간)이 RSET(피난완료시간)보다 커야 성능위주설계상 안전하다고 판정한다." },
    { q:"[94회] 피난안정성 평가방법인 time-line 분석법에서 RSET·ASET의 인자 및 평가방법을 설명하시오.", a:"RSET은 감지-인지-반응-이동의 4단계 인자를, ASET은 화재시뮬레이션으로 산출한 온도·가시거리·독성가스 도달시점 인자를 각각 타임라인에 배치하여 ASET>RSET 여부로 안전성을 평가한다." },
    { q:"[126회] 피난안전성 평가에 사용되는 RSET와 ASET의 개념을 설명하시오.", a:"RSET은 화재 인지부터 피난 완료까지 실제 소요되는 시간, ASET은 화재로 인한 위험이 인명안전기준에 도달하는 한계시간이며, RSET이 ASET보다 작아야 안전하게 피난이 완료된다." },
    { q:"[136회] 피난안전성평가 시 ASET과 RSET의 개념 및 산정방법을 설명하시오.", a:"ASET은 화재·연기시뮬레이션으로 인명안전기준(온도·CO·가시거리) 도달시점을 산정하고, RSET은 감지시간+피난지연시간(경보방식별 W1·W2·W3에 따라 다름)+이동시간을 합산해 산정한다." }
  ]
};

const CONCEPT_DECK_8WK_1GANG = {
  id: "concept-8wk-1gang",

  label:"피난·화재 시뮬레이션(패스파인더·FDS·CFAST)과 ASET·RSET, 피난안내도",
  sub:"피난시뮬레이션(Pathfinder)·화재시뮬레이션의 커플링/세미커플링 개념, 존모델(CFAST)과 필드모델(FDS)의 비교, ASET·RSET의 구성과 단축 대책, 피난안내도 설치대상·표기내용",
  notes:[
    { title:"1. 피난시뮬레이션(패스파인더)과 화재시뮬레이션의 커플링", blocks:[{ type:"p", text:"패스파인더(Pathfinder)는 건축도면을 불러와 출입문·계단·에스컬레이터·엘리베이터를 생성하고, 실별 용도에 따른 재실밀도로 거주자를 배치한 뒤 피난거동을 수행시켜 전원 피난완료 시각을 산출하는 피난시뮬레이션 프로그램이다. 재실자는 남녀노소별 신체크기·어깨너비·보행속도를 다르게 부여할 수 있고, 최근접 출구로 이동하되 병목이 생기면 다른 출구를 자동 선택하도록 알고리즘이 구성된다." }, { type:"p", text:"화재시뮬레이션(FDS 등)과 피난시뮬레이션을 함께 활용하는 방식은 결과 비교 방식에 따라 언커플링·세미커플링·커플링으로 나뉜다. 언커플링은 두 시뮬레이션을 별도로 수행해 각각의 완료시간만 비교하고, 세미커플링은 화재시뮬레이션 결과(온도·가스농도 분포)를 참고자료로만 활용하며, 커플링은 동일 공간·시간축에서 두 결과를 중첩시켜 피난자가 실제로 처한 온도·독성가스 조건까지 직접 확인한다. 최근 성능위주설계에서는 커플링 방식 적용을 권장한다." }, { type:"table", headers:["방식", "특징"], rows:[["언커플링(Un-coupling)", "화재·피난 시뮬레이션을 독립적으로 수행 후 시간만 비교"], ["세미커플링(Semi-coupling)", "화재시뮬레이션 결과(온도·CO 등)를 별도로 확인만 함"], ["커플링(Coupling)", "동일 공간에서 피난자의 위치별 온도·독성가스를 실시간 중첩 비교, 최근 권장 방식"]] }] },
    { title:"2. 화재시뮬레이션: 존모델(CFAST/CFAST계열 시패스트)과 필드모델(FDS)", blocks:[{ type:"p", text:"시패스트(CFAST)는 구획실 화재의 검사체적을 고온의 상층부와 저온의 하층부 두 구역(2-zone)으로만 단순화해 해석하는 존모델이다. 질량보존·에너지보존·이상기체상태방정식·연도방정식을 이용해 해석하며, 계산이 빠르지만 상층부 온도가 약 600℃(플래시오버 수준)를 넘으면 층 구분 자체가 무너져 데이터 신뢰도가 급격히 떨어진다. 해석 가능한 실의 형상이 정사각형·직사각형으로 제한되고, 실의 개수도 통상 3개 이하로 제한된다." }, { type:"p", text:"FDS(Fire Dynamics Simulator)는 검사체적을 10만~수백만 개의 격자로 세분화해 나비에-스토크스 방정식으로 해석하는 필드모델이다. 시뮬레이션 공간 크기에 제한이 없고 난류 해석이 가능하며, 스모크뷰(Smokeview)와 함께 구동하면 연기 유동·온도분포·가시거리·CO 등 연소생성물의 시간에 따른 변화를 3차원으로 시각화할 수 있다. 다만 저속유동만 해석 가능해 폭발과 같은 고속유동 해석은 불가능하고, 플래시오버 이후 환기지배화재에서는 정확도가 떨어진다." }, { type:"table", headers:["구분", "CFAST(존모델)", "FDS(필드모델)"], rows:[["해석 관점", "거시적(2-zone)", "미시적(격자 기반)"], ["지배방정식", "질량·에너지보존, 이상기체상태방정식", "나비에-스토크스 방정식(질량·에너지·운동량보존)"], ["결과 표현", "2차원적(상·하층)", "3차원 시각화(Smokeview 연동)"], ["계산 시간", "짧음", "김(격자 수에 비례)"], ["적용 한계", "다수실(3개 초과)·600℃ 이상에서 신뢰도 급락, 플래시오버 이후 부적합", "저속유동만 해석, 폭발(고속유동) 해석 불가"], ["활용", "플래시오버 발생시점·감지기/스프링클러 작동시간 예측, 피난계획 자료 제공", "동일 목적, 다수실·전실화재까지 폭넓게 적용"]] }] },
    { title:"3. ASET·RSET과 피난안내도", blocks:[{ type:"p", text:"ASET(Available Safe Egress Time, 허용피난시간)은 화재로부터의 위험이 인명안전기준(호흡선 1.8m 기준 열·독성가스·가시거리)에 도달하는 시간으로, FDS 등 화재시뮬레이션으로 산정한다. RSET(Required Safe Egress Time, 소요피난시간)은 감지시간+지연시간(피난개시 가능시간)+이동시간으로 구성되며, 이동시간은 피난시뮬레이션(패스파인더)으로, 감지시간은 감지기 특성으로, 지연시간은 용도별 사상기호(W1·W2·W3 등)를 반영한 테이블 값으로 결정된다. 안전한 피난설계는 ASET>RSET을 만족해야 한다." }, { type:"p", text:"ASET을 늘리는 대책은 패시브(불연화·난연화, 방화구획·내화구조로 화재 확산 저지)와 액티브(자동식소화설비 설치로 화재크기 억제, 조기감지 헤드·제연설비로 위험도달시간 지연)로 나뉜다. RSET을 줄이는 대책 중 지연시간은 테이블로 고정되어 직접 조정이 어려우므로, 실질적으로는 이동시간(피난용량) 확대에 집중한다. 즉 비상구 수 증가, 계단폭·출입문 개수 확대, 코어(수직 피난공간) 배치 최적화, 거주밀도 하향 조정(용도 제한) 등이다." }, { type:"p", text:"피난안내도는 학원·노래연습장·목욕장(100인 이상)·게임제공업 등 다중이용업소에 설치하며, 상영 가능한 스크린이 있는 업종은 피난안내영상물로 대체할 수 있다. 표시 내용은 현위치, 대피 방향(피난동선), 비상구 위치, 소화기 위치이며 크기는 B4 이상(바닥면적 400㎡ 이상은 A3 이상), 쉽게 훼손되지 않는 재질에 한글과 외국어 1개 이상을 병기한다." }, { type:"callout", text:"➡ 피난안내도는 출제빈도가 낮으므로 암기노트에서 비중을 낮추되, 만약 출제되면 현위치·피난동선·비상구위치·소화기위치의 4요소만은 빠짐없이 답안에 반영해 부분점수를 확보한다." }] }
  ],
  cards:[
    { q:"패스파인더(Pathfinder) 시뮬레이션의 수행 절차는?", a:"건축도면 불러오기→출입문·계단·에스컬레이터·엘리베이터 생성→평면 간 연결→용도별 재실밀도에 따른 거주자 배치(남녀노소 구분)→시뮬레이션 수행→피난완료시간 분석의 순서로 진행된다." },
    { q:"패스파인더에서 병목현상이 발생하면 어떻게 처리되는가?", a:"재실자는 기본적으로 최근접 출구로 이동하지만, 해당 출구가 혼잡(병목)해지면 프로그램이 다른 출구를 자동으로 선택하도록 알고리즘이 구성된다." },
    { q:"언커플링·세미커플링·커플링의 차이는?", a:"언커플링은 화재·피난시뮬레이션을 완전히 별도로 수행해 시간만 비교하고, 세미커플링은 화재시뮬레이션 결과를 참고자료로만 확인하며, 커플링은 두 결과를 동일 공간·시간축에서 중첩시켜 피난자의 실제 노출 온도·가스농도까지 직접 비교한다." },
    { q:"최근 성능위주설계에서 권장하는 화재·피난시뮬레이션 결합 방식은?", a:"커플링(Coupling) 방식이다. 피난자의 위치별 온도·독성가스 조건을 실시간으로 비교해 실제 피난 가능성을 더 정밀하게 판단할 수 있기 때문이다." },
    { q:"CFAST(존모델)의 검사체적 구분 방식은?", a:"화재가 발생한 구획실을 고온의 상층부와 저온의 하층부 2개 구역(2-zone)으로만 단순화해 해석한다." },
    { q:"CFAST의 데이터 신뢰도가 급격히 떨어지는 조건은?", a:"상층부 온도가 약 600℃에 도달해 플래시오버(전실화재)가 발생하면 상·하층 구분 자체가 무의미해져 신뢰도가 급락한다." },
    { q:"CFAST 해석에 적용되는 실의 개수·형상 제한은?", a:"해석 가능한 실의 형상은 정사각형·직사각형으로 제한되며, 실의 개수는 통상 3개 이하일 때만 신뢰도가 확보된다." },
    { q:"FDS(필드모델)의 지배방정식과 격자 규모는?", a:"나비에-스토크스 방정식(질량·에너지·운동량 보존)을 이용하며, 검사체적을 10만~수백만 개의 격자로 세분화해 해석한다." },
    { q:"FDS와 스모크뷰(Smokeview)를 함께 구동하면 무엇을 확인할 수 있는가?", a:"연기의 유동상태, 화재공간의 온도분포, 가시거리, CO 등 연소생성물의 시간에 따른 변화를 3차원으로 시각화해 볼 수 있다." },
    { q:"FDS의 근본적인 해석 한계는?", a:"저속유동만 해석 가능하므로 폭발과 같은 고속유동 현상은 해석할 수 없고, 플래시오버 이후 환기지배화재에서는 정확도가 상대적으로 떨어진다." },
    { q:"ASET의 정의와 산정 방법은?", a:"화재로부터의 위험이 인명안전기준(호흡선 1.8m 기준)에 도달하는 시간이며, FDS 등 화재시뮬레이션으로 산정한다." },
    { q:"RSET의 3가지 구성요소는?", a:"감지시간+지연시간(피난개시 가능시간)+이동시간이다." },
    { q:"RSET의 이동시간·감지시간·지연시간은 각각 무엇으로 결정되는가?", a:"이동시간은 피난시뮬레이션(패스파인더)으로, 감지시간은 감지기의 감지특성으로, 지연시간은 용도별 사상기호(W1·W2·W3)를 반영한 테이블 값으로 결정된다." },
    { q:"안전한 피난설계의 판정 조건은?", a:"ASET>RSET을 만족해야 안전한 피난이 확보된 것으로 판단한다." },
    { q:"ASET을 늘리는 패시브 대책은?", a:"불연재·난연재 사용으로 가연물량을 줄이고, 방화구획·내화구조로 화재 확산과 연소확대를 지연시키는 것이다." },
    { q:"ASET을 늘리는 액티브 대책은?", a:"자동식소화설비 설치로 화재크기 자체를 억제하고, RTI가 낮은 속동형 헤드·조기감지형 감지기, 제연설비로 위험 도달시간을 지연시키는 것이다." },
    { q:"RSET의 지연시간을 직접 줄이기 어려운 이유는?", a:"지연시간은 감지기 특성이 아니라 용도별 사상기호(W1·W2·W3) 테이블로 이미 고정되어 있어, 설계자가 임의로 조정할 수 없기 때문이다." },
    { q:"RSET의 이동시간을 줄이는 실질적 대책 4가지는?", a:"비상구 수 증가, 계단폭·출입문 개수 확대, 코어(수직 피난공간)의 적정 배치, 거주밀도 하향 조정(건물 용도 제한)이다." },
    { q:"피난안내도의 설치 대상과 표시 내용은?", a:"학원·노래연습장·목욕장(100인 이상)·인터넷컴퓨터게임시설제공업 등 다중이용업소에 설치하며, 현위치·피난동선·비상구위치·소화기위치를 표시한다." },
    { q:"피난안내도의 규격과 재질 기준은?", a:"기본 크기는 B4 이상이며 바닥면적 400㎡ 이상인 경우 A3 이상으로 하고, 쉽게 훼손되지 않는 재료를 사용하며 한글과 외국어 1개 이상을 함께 표기한다." }
  ]
};

  cards:[
    { q:"[78회] 건축물의 성능기준 피난설계 시, 피난시간(RSET)의 구성요소에 대하여 상술하시오.", a:"RSET은 감지시간+지연시간(피난개시 가능시간)+이동시간으로 구성되며, 감지시간은 감지기 특성, 지연시간은 용도별 사상기호(W1·W2·W3) 테이블, 이동시간은 피난시뮬레이션으로 각각 산정한다." },
    { q:"[79회] 피난설계를 위한 인명안전 평가시 사용되는 RSET과 ASET에 대한 정의, 구성요소를 설명하시오.", a:"ASET(허용피난시간)은 화재로부터의 위험이 인명안전기준에 도달하는 시간, RSET(소요피난시간)은 감지+지연+이동시간의 합이며 ASET>RSET일 때 안전한 설계로 판정한다." },
    { q:"[83회] 피난시뮬레이션 프로그램인 simulex와 exodus의 특징을 비교 분석하시오.", a:"Simulex는 개인 보행행태 기반의 셀 자동자 모델로 계산이 빠르고, exodus는 재실자 행동·상호작용(사회적 요인)까지 반영하는 행위기반 모델로 더 정교하지만 계산부하가 크다는 차이가 있다." },
    { q:"[83회] 성능위주소방설계에서 거주가능조건(tenable conditions)을 요약하고, ASET·RSET의 개념을 설명하시오.", a:"거주가능조건은 열·독성가스·가시거리가 인명안전기준을 벗어나지 않는 상태를 말하며, ASET은 이 조건에 도달하는 시간, RSET은 실제 피난에 소요되는 시간이다." },
    { q:"[87회] 화재시뮬레이션에 이용되는 존모델(zone model) CFAST의 장점과 단점을 기술하시오.", a:"장점은 계산이 빠르고 간단한 구획실 해석에 적합한 점이며, 단점은 실을 3개 이하로 제한하고 상층부 온도 600℃(플래시오버) 이상에서는 신뢰도가 급락한다는 점이다." },
    { q:"[90회] 피난유도선의 정의, 작동원리, 설치장소를 설명하고 광원점등식 피난유도선의 성능기준을 설명하시오.", a:"피난유도선은 화재 시 연기 속에서도 피난방향을 안내하는 저위치 표시선으로, 축광식·광원점등식으로 구분되며 광원점등식은 휘도·식별도 성능기준(예: 편측 20m 이상 식별)을 만족해야 한다." },
    { q:"[91회] 초고층 건축물의 정의와 피난안전구역 설치기준을 설명하시오.", a:"초고층 건축물은 50층 이상 또는 높이 200m 이상인 건축물이며, 피난안전구역은 매 30개층마다 1개소 이상, 면적은 위층 재실자수×0.5×0.28㎡ 이상으로 설치한다." },
    { q:"[95회] 화재시뮬레이션 실시 시 주요 입력요소 및 세부요소에 대하여 설명하시오.", a:"공간정보(실 크기·개구부), 가연물 정보(HRR 곡선·재질), 화재시나리오(발화위치·성장속도), 환경조건(온도·환기)이 주요 입력요소다." },
    { q:"[96회] 화재 및 피난시뮬레이션의 시나리오 작성 기준 및 성능위주설계 보고서 제출 서류를 설명하시오.", a:"시나리오는 최악의 상황을 가정한 다수 시나리오로 구성하며, 제출서류에는 건축개요·화재하중·시뮬레이션 입력값·결과분석·ASET-RSET 비교표 등이 포함된다." },
    { q:"[97회] 화재 및 피난시뮬레이션 수행 시 인명안전적용기준을 설명하시오.", a:"호흡선(1.8m) 기준 온도 60℃, CO 1,400ppm, CO₂ 5%, O₂ 15%, 가시거리(5~10m, 용도별) 중 어느 하나라도 초과하면 인명안전기준 초과로 판정한다." },
    { q:"[98회] 초고층 및 준초고층 건축물의 피난안전구역과 직통계단 연결기준을 설명하시오.", a:"피난안전구역은 직통계단(특별피난계단)을 통해 상하층으로 이동 가능한 구조로 연결하며, 계단을 이용하려면 반드시 피난안전구역을 거쳐야 하는 구조(수직 조닝)로 설계한다." },
    { q:"[103회] 화재시뮬레이션에 이용되는 CFAST 모델과 FDS 모델의 특성과 제한사항을 비교 설명하시오.", a:"CFAST는 2-zone 거시적 존모델로 빠르지만 다수실·고온 조건에서 신뢰도가 낮고, FDS는 격자기반 필드모델로 정밀하지만 계산시간이 길고 폭발 등 고속유동은 해석할 수 없다." },
    { q:"[104회] 성능위주설계 신고 서류와 화재·피난시뮬레이션 시나리오의 인명안전기준·피난가능시간 기준을 설명하시오.", a:"제출서류는 사전검토신청서·기본설계도서·시뮬레이션결과보고서 등이며, 인명안전기준은 호흡선 기준 열·가스·가시거리 초과 여부, 피난가능시간 기준은 ASET(위험도달시간)이 RSET(소요피난시간)보다 커야 한다는 것이다." },
    { q:"[108회] 피난안전구역의 면적 산정기준을 설명하시오.", a:"(피난안전구역 위층의 재실자 수)×0.5×0.28㎡로 산정하며, 재실자수는 형태별 재실밀도와 해당 용도 바닥면적을 곱해 산출한다." },
    { q:"[112회] 초고층 건축물의 피난안전구역, 지하연계복합건축물의 선큰(Sunken) 설치기준을 설명하시오.", a:"피난안전구역은 매 30개층마다 설치하며 내화구조 구획·급수전·방화문 등을 갖추고, 선큰은 지하공간을 외기에 개방한 구조로 직통계단(폭 1.8m 이상) 또는 경사로(1:8 이하)로 지상과 연결한다." },
    { q:"[119회] 건축물 화재시 안전한 피난을 위한 피난시간 계산의 필요성·절차·평가방법을 설명하시오.", a:"화재로 인한 인명피해를 사전에 예측·예방하기 위해 필요하며, 절차는 화재시나리오 설정→ASET 산정(화재시뮬레이션)→RSET 산정(피난시뮬레이션)→비교평가의 순서로 진행된다." },
    { q:"[126회] 피난안전성 평가에 사용되는 RSET과 ASET에 대하여 설명하시오.", a:"RSET(소요피난시간)은 감지+지연+이동시간의 합이고 ASET(허용피난시간)은 위험이 인명안전기준에 도달하는 시간으로, RSET<ASET을 만족해야 안전하다고 판정한다." },
    { q:"[132회] 화재피난시뮬레이션 커플링(Coupling) 실시 필요 이유를 설명하시오.", a:"화재시뮬레이션과 피난시뮬레이션을 별도로 수행하면 피난자가 실제 처한 열·가스 노출조건을 알 수 없으므로, 두 결과를 동일 공간·시간축에서 중첩해 실제 안전성을 정밀 평가하기 위해 커플링을 실시한다." }
  ]
};

  notes:[
    { title:"1. 가치공학(VE)·CM·책임감리·BIM", blocks:[{ type:"p", text:"가치공학(Value Engineering)은 관계식 V=F/C(가치=기능/비용)로 표현되며, 발주자가 설계안에 대해 VE를 의뢰하면 설계자가 자료를 제출하고 검토를 거쳐 기능은 동등 이상을 유지하면서 비용을 절감하는 대안을 재설계·납품하는 절차로 진행된다. 기대효과는 두문자 '신기가노화신'(신뢰성 향상·기업이익 창출·가치 향상·노하우 축적·신기술신공법 적용 원활)으로 정리한다." }, { type:"p", text:"CM(건설사업관리)은 발주자를 대리해 기획·설계·발주·시공·완공 후 운영까지 전 과정을 총괄하는 제도다. CM at Risk는 CM이 시공사를 직접 선정하고 공사비·공기에 대한 계약적 책임(리스크)까지 부담하는 형태이고, CM for Fee는 발주자가 시공사를 직접 선정하므로 CM이 공사비·공기에 대한 계약적 책임을 지지 않는 형태다. 책임감리는 감리업자가 시공단계의 품질관리를 주 업무로 수행하는 제도로, 대규모·특수공사에 적용되는 CM과 달리 시공 이후 단계에 국한된다." }, { type:"table", headers:["구분", "CM", "책임감리"], rows:[["주체", "건설사업관리 회사", "감리업자(감리회사)"], ["업무범위", "기획~시공~운영까지 전 단계 총괄", "시공단계 품질관리가 주 업무"], ["적용대상", "복잡공사·특별관리 요하는 대규모 공사", "일반 소방공사(상주감리·일반감리)"], ["리스크", "CM at Risk는 공사비·공기 계약책임을 CM이 부담", "해당 없음(품질검사 위주)"]] }, { type:"p", text:"소방공사 감리업무는 두문자 '적합성과 적법성'으로 정리한다: 소방시설 설치계획표의 적법성, 피난시설·방화시설의 적법성, 실내장식물의 불연화·방염물품의 적법성, 설계도서의 적합성, 설계변경사항의 적법성, 소방용 기계·기구의 위치·규격 및 사용자재의 적합성, 시공상세도면의 적합성, 완공된 소방시설의 성능시험(완공검사) 등이다. BIM(Building Information Modeling)은 컴퓨터상에서 건물의 시공 시 생성되는 정보를 모델링화한 설계 프로그램으로, 물량 자동산출과 공종 간 간섭 사전파악을 통해 재시공 손실 감소·공기단축·설계-시공 매칭 최적화 효과를 준다." }] },
    { title:"2. BTO·BTL·BOO 민간투자방식, 임시소방시설", blocks:[{ type:"table", headers:["방식", "건설·소유·운영", "적용사례", "수익구조"], rows:[["BTO(Build-Transfer-Operate)", "민간건설→소유권 정부이전→운영권 민간", "민자도로·철도·터널", "이용료 직접 환수, 수익률 높지만 수요변동 리스크를 민간이 부담"], ["BTL(Build-Transfer-Lease)", "민간건설→소유권 정부이전→임대권 정부, 민간은 임대료 수취", "주민자치센터·체육시설 등 공공시설", "정부의 장기 임대료로 안정적 수익, 수익률은 낮지만 안정적"], ["BOO(Build-Own-Operate)", "민간건설→민간소유→민간운영", "통신망(이동통신사)", "민간이 요금제 등 운영을 자율적으로 결정"]] }, { type:"p", text:"임시소방시설은 소방시설이 정식 설치되기 전 공사현장의 화재 위험에 대비해 설치하는 시설로, 두문자 '소경피용활'(소화기·경보설비·간이피난유도선·용접용단 작업장 방화포·비상조명등) 계열로 정리하며, 인화성 물품을 취급하는 등 대통령령으로 정하는 작업(용접·용단 등 화기·불꽃을 발생시키거나 가연성 가스를 취급하는 작업)이 있는 공사현장에 설치대상이 정해진다. 소화기는 능력단위 3단위 이상 2개 이상을, 작업지점 5m 이내에는 대형소화기 1개를 추가 배치한다." }] },

    { title:"1. 피난안전구역과 선큰(Sunken)", blocks:[{ type:"p", text:"초고층 건축물(50층 이상)은 지상층 매 30개층마다 피난안전구역을 1개소 이상 설치하고, 준초고층 건축물(16층 이상 29층 이하로 지하연계 복합건축물인 경우)은 전체 층수의 1/2에 해당하는 층으로부터 상하 5개층 이내에 1개층을 피난안전구역으로 설치한다. 지상층 거주밀도가 1.5명/㎡를 초과하는 층이 있으면 해당 층 바닥면적의 1/10 이상을 피난안전구역으로 설치해야 한다." }, { type:"p", text:"피난안전구역의 면적은 (피난안전구역 위층의 재실자 수)×0.5×0.28㎡로 산정하며, 지하층이 문화집회·판매·업무·의료시설 등 밀집용도인 경우에는 해당 지하층에도 피난안전구역을 설치하거나 선큰(Sunken)을 설치해야 한다. 선큰은 지하공간을 외기에 노출시켜 놓은 개방형 공간으로, 지상 또는 피난층으로 통하는 직통계단(폭 1.8m 이상) 또는 경사로(경사도 12.5%=1:8 이하)를 설치해야 한다." }, { type:"table", headers:["시설", "핵심 기준"], rows:[["피난안전구역 구조", "내화구조로 다른 부분과 구획, 급수전·비상연락장치·예비전원 조명설비, 방화문, 높이 2.1m 이상, 단열재(위·아래층) 설치"], ["선큰 설치면적", "공연장·집회장·관람장은 해당 면적의 7% 이상, 판매시설은 7% 이상, 그 밖의 용도는 3% 이상"], ["선큰 침수·제연 대책", "차수판·집수정 등 빗물 침수방지시설, 거실과 접하는 부분에 제연설비 설치(단 공조설비가 화재 시 제연설비로 전환되면 별도 설치 면제)"]] }] },
    { title:"2. 소방관 진입창, 종합방재실", blocks:[{ type:"p", text:"소방관 진입창은 제천 목욕탕 화재 이후 소방관이 외부에서 신속히 진입할 수 있는 창을 식별하도록 법제화되었다. 모든 건축물의 2층 이상 11층 이하 층에 각 층마다 1개 이상 설치하되, 직접 지상으로 통하는 출구가 있는 층이나 높이 44m를 초과하는 층(고가사다리차 도달 불가), 대피공간·비상용승강기를 설치한 아파트는 설치가 제외된다. 창은 40m 이내 간격으로 배치하고 야간 식별을 위해 red 도색·타격지점을 표시하며, 바닥에서 창까지 높이는 80㎝(난간 설치 시 1.2m) 이하로 한다." }, { type:"p", text:"종합방재실은 방재업무를 24시간 상주 근무로 수행하는 장소로, 규모에 따라 수위실·관리사무소·종합방재실로 구분되며 100층 이상 등 초고층 건축물에서는 종합방재실을 반드시 설치한다. 수신기·제어반·CCTV 등 방재설비 외에도 근무자의 냉난방·환기설비를 함께 갖추어야 한다는 점이 출제 포인트다." }] },
    { title:"3. 다중이용업소 화재위험평가·성능위주소방설계·건축허가동의", blocks:[{ type:"p", text:"소방청장·소방본부장·소방서장은 필요시 화재위험평가를 할 수 있으며, 대상은 두문자 '합천5'로 정리한다: 2,000㎡ 지역 내 다중이용업소 50개 이상, 5층 이상 건축물에 다중이용업소 10개 이상, 하나의 건축물에 다중이용업소 바닥면적 합계 1,000㎡ 이상. 평가점수(80점 이상 A등급~59점 이하 D·E등급)는 화재예방·감지·경보·피난·소화설비·건축방재 항목별로 소방청장 고시기준 충족 여부를 평가하며, A등급은 일부 안전시설 설치 면제·소방안전교육/화재안전조사 면제, D·E등급은 사용금지·제한, 공사정지 등 행정명령 대상이 된다." }, { type:"p", text:"성능위주소방설계는 연면적 20만㎡ 이상 등 특정소방대상물에 적용하며, 건축허가동의 절차는 건축주가 관할 허가관청에 건축허가를 신청하면 관할 소방서에 소방시설 등에 대한 동의를 요청하고, 소방서가 검토 후 동의하면 허가가 이루어지는 순서로 진행된다. 완공검사는 원칙적으로 감리결과보고서로 갈음하되, 문화집회·판매시설 등 다중이용시설(11층 이상 또는 연면적 1만㎡ 이상 스프링클러·물분무등소화설비 설치대상, 가연성가스 탱크 1,000톤 이상 등)은 소방관이 직접 현장확인을 할 수 있다." }, { type:"callout", text:"➡ 초고층 관련 주제(피난안전구역·선큰·진입창·종합방재실·다중이용업소평가)는 8주차 3강에서 가장 출제빈도가 높은 영역이므로, 수치(면적 산정식·설치대상 층수·시설별 규격)를 정확히 암기해야 한다." }] }
  ],
  cards:[
    { q:"초고층·준초고층 건축물의 피난안전구역 설치대상은?", a:"초고층(50층 이상)은 지상층 매 30개층마다 1개소, 준초고층(16~29층 지하연계복합건축물)은 전체층수 1/2에 해당하는 층 상하 5개층 이내 1개층에 설치한다." },
    { q:"피난안전구역의 면적 산정식은?", a:"(피난안전구역 위층의 재실자 수)×0.5×0.28㎡로 산정한다." },
    { q:"초고층 건축물에서 지하층에 피난안전구역 또는 선큰을 설치해야 하는 조건은?", a:"지하층이 문화집회시설·판매시설·업무시설·의료시설 등이 하나 이상 있는 경우, 해당 지하층에 피난안전구역을 설치하거나 선큰을 설치해야 한다." },
    { q:"선큰(Sunken)의 정의는?", a:"건물의 지하공간을 외기에 노출시켜 태양광이 유입되도록 만든 개방형 지하 공간으로, 화재 시 지상으로 대피할 수 있는 경로 역할을 한다." },
    { q:"선큰 설치 시 지상으로 통하는 계단·경사로 기준은?", a:"폭 1.8m 이상의 직통계단 또는 경사도 12.5%(1:8) 이하의 경사로를 설치해야 한다." },
    { q:"선큰의 용도별 설치면적 기준은?", a:"공연장·집회장·관람장·판매시설은 해당 면적의 7% 이상, 그 밖의 용도는 3% 이상이다." },
    { q:"피난안전구역의 단열재·마감재·높이 기준은?", a:"위·아래층에 단열재를 설치하고 내부 마감재료는 불연재료로 하며, 높이는 2.1m 이상으로 한다." },
    { q:"소방관 진입창의 설치대상 층수와 간격은?", a:"모든 건축물의 2층 이상 11층 이하 층에 각층마다 1개 이상 설치하되, 40m 이내 간격으로 배치한다." },
    { q:"소방관 진입창의 설치가 제외되는 경우는?", a:"직접 지상으로 통하는 출구가 있는 층, 높이 44m를 초과하는 층, 대피공간 또는 비상용승강기를 설치한 아파트다." },

    { q:"다중이용업소 화재위험평가 대상을 정리하는 두문자와 내용은?", a:"'합천5'로, 2,000㎡ 지역 내 다중이용업소 50개 이상, 5층 이상 건축물에 다중이용업소 10개 이상, 하나의 건축물에 다중이용업소 바닥면적 합계 1,000㎡ 이상이다." },
    { q:"다중이용업소 화재안전등급과 조치사항은?", a:"80점 이상 A등급~59점 이하 D·E등급으로 구분되며, A등급은 안전시설 일부 면제·소방안전교육 및 화재안전조사 면제, D·E등급은 사용금지·제한·공사정지 등 행정명령 대상이 된다." },
    { q:"화재위험평가의 점수 산정 항목은?", a:"화재예방, 감지·경보, 피난, 소화설비, 건축방재 항목별로 소방청장이 고시하는 기준의 충족 여부를 평가해 점수를 산정한다." },

    { q:"건축허가동의의 절차는?", a:"건축주가 허가관청에 건축허가 신청→허가관청이 관할 소방서에 소방동의 요청→소방서가 소방시설 등 적정성을 검토 후 동의→허가관청이 건축허가 처리의 순서로 진행된다." },
    { q:"완공검사를 감리결과보고서로 갈음할 수 없는(현장확인 대상) 특정소방대상물은?", a:"문화집회·종교·판매·노유자시설 등 다중이용, 스프링클러·물분무등소화설비가 설치되는 연면적 1만㎡ 이상 또는 11층 이상 특정소방대상물, 가연성가스 탱크 저장용량 1,000톤 이상 시설 등이다." },
    { q:"완공검사가 감리결과보고서로 원칙적으로 갈음되는 이유는?", a:"감리가 시공 전 과정에서 품질관리를 수행했으므로 소방관이 별도로 현장을 재확인하지 않아도 감리결과보고서로 완공검사를 대체할 수 있도록 한 것이다." },

    { q:"피난안전구역에 적용되는 차압·제연 강화기준은?", a:"일반 특별피난계단 부속실 차압 40Pa와 달리, 피난안전구역은 50Pa(스프링클러 설치 시 12.5Pa)로 강화되며, 피난안전구역의 한쪽 면이 외기에 개방되어 있으면 제연설비를 설치하지 않을 수 있다." }

    { q:"[98회] 초고층 및 준초고층 건축물에서 피난안전구역과 직통계단의 연결기준 및 설치기준을 설명하시오.", a:"피난안전구역을 거쳐야만 상하층으로 이동 가능하도록 특별피난계단과 연결하며(수직 조닝), 이는 화재 시 재실자가 반드시 안전구역을 경유하도록 강제하기 위함이다." },
    { q:"[108회] 건축물 피난방화 구조등의 기준에 관한 규칙에 따른 피난안전구역의 면적 산정기준을 설명하시오.", a:"(피난안전구역 위층 재실자수)×0.5×0.28㎡로 산정하며, 재실자수는 형태별 재실밀도와 용도별 바닥면적을 곱해 구한다." },
    { q:"[111회] 초고층 및 지하연계 복합건축물 재난관리에 관한 특별법에 따른 피난안전구역의 면적 산정기준을 설명하시오.", a:"특별법에서도 동일하게 위층 재실자수×0.5×0.28㎡을 기본 산정식으로 하되, 지하층은 수용인원×0.1×0.28㎡(용도가 둘 이상이면 합산)로 별도 산정한다." },
    { q:"[112회] 초고층건축물의 피난안전구역 설치기준, 지하연계복합건축물의 선큰(Sunken) 설치기준, 피난안전구역에 설치하는 소방시설을 설명하시오.", a:"피난안전구역은 매 30개층마다, 선큰은 지하공간을 외기에 개방하고 직통계단(1.8m 이상)·경사로(1:8 이하)로 연결하며, 소방시설은 '소옥스경자방공유비재무'(소화기·옥내소화전·스프링클러·경보설비·방열복·공기호흡기·인공소생기·유도등/표지·비상조명등·재연설비·무선통신보조설비)다." },
    { q:"[120회] 초고층 및 지하연계 복합건축물 재난관리에 관한 특별법 시행령에서 규정하고 있는 피난안전구역 설치기준 등을 설명하시오.", a:"건축물 규모별(초고층·준초고층) 설치층 기준, 면적산정기준, 내부 설치기준(구획·마감재료·조명·급수전 등)이 시행령에 규정되어 있다." },
    { q:"[125회] 초고층 및 지하연계 복합건축물 재난관리에 관한 특별법과 관련하여 피난안전구역 소방시설, 면적산정기준을 설명하시오.", a:"소방시설은 '소옥스경자방공유비재무' 계열이며, 면적은 위층 재실자수×0.5×0.28㎡(지하층은 수용인원×0.1×0.28㎡)로 산정한다." },
    { q:"[121회] 건축법령에서 정하는 소방관 진입창의 설치기준을 설명하시오.", a:"2층 이상 11층 이하 각 층에 40m 이내 간격으로 1개 이상 설치하며, 야간 식별을 위한 표시(적색)와 타격지점을 표기하고 바닥에서 창까지 높이는 80㎝(노대 설치시 1.2m) 이하로 한다." },
    { q:"[134회] 소방관 진입창의 설치대상·설치제외대상과 설치기준을 설명하시오.", a:"설치제외는 직접 지상통로가 있는 층, 높이 44m 초과 층, 대피공간·비상용승강기 설치 아파트이며, 설치기준은 40m 간격·붉은색 표시·타격지점·높이 80㎝ 이하 등이다." },
    { q:"[66회] 방재센터(종합방재실)의 설치목적, 위치, 갖추어야 하는 설비 및 기능을 설명하시오.", a:"화재 등 재난상황을 총괄 감시·통제하는 목적으로 설치하며, 수신기·제어반·CCTV 등 방재설비와 근무자용 냉난방·환기설비를 갖추고 24시간 상주근무 체제로 운영한다." },
    { q:"[97회] 초고층 및 지하연계 복합건축물의 종합방재실 설치기준을 설명하시오.", a:"1개소 이상(둘 이상 관리주체 시 관리주체별 설치 가능), 1층 또는 피난층에 설치, 면적 20㎡ 이상, 각종 소방·방재설비와의 연동 기능을 갖추어야 한다." },
    { q:"[111회] 초고층 및 지하연계 복합건축물 재난관리에 관한 특별법 시행규칙에 따른 종합방재실의 개수·위치·구조 및 면적·설비 등 설치기준을 설명하시오.", a:"개수는 1개소 이상, 위치는 1층 또는 피난층, 구조는 내화구조로 구획, 면적은 20㎡ 이상, 설비는 조명설비·급배기설비·전용회선 등을 갖춘다." },
    { q:"[79회] 다중이용업소의 안전관리에 관한 특별법의 제정이유와 주요내용(정의·정기점검·화재위험평가·안전관리우수업소 혜택)을 설명하시오.", a:"다중이용업소 화재로 인한 대형 인명피해를 예방하기 위해 제정되었으며, 정기점검·화재위험평가 제도와 안전관리 우수업소에 대한 규제 완화 혜택을 규정한다." },
    { q:"[124회] 다중이용업소의 안전관리에 관한 특별법령에 따른 다중이용업소 화재위험평가의 정의, 대상, 화재위험유발지수를 설명하시오.", a:"화재위험평가는 다중이용업소 밀집지역의 화재위험도를 평가하는 제도로, 대상은 '합천5'(2,000㎡ 내 50개 이상, 5층 이상에 10개 이상, 바닥면적 합계 1,000㎡ 이상)이며 화재위험유발지수는 평가점수를 등급화한 지표다." },
    { q:"[76회] 현행 관계법령 및 행정절차상 요구되는 건축허가등의 소방동의 대상물 5가지를 설명하시오.", a:"연면적·층수·용도 기준(연면적 400㎡ 이상, 6층 이상 건축물, 지하층/무창층 있는 건축물, 노유자시설·수련시설 등 특정용도, 위험물저장·처리시설) 등이 대상이다." },
    { q:"[108회] 건축허가 동의를 받아야 할 대상과 제외 대상, 건축허가를 받기 위한 절차를 설명하시오.", a:"동의대상은 연면적 400㎡ 이상 등 특정소방대상물이며, 제외대상은 소규모 건축물 등이고, 절차는 건축주 허가신청→소방서 동의요청→검토·동의→허가처리 순으로 진행된다." }
  ]
};

const CONCEPT_DECK_8WK_4GANG = {
  id: "concept-8wk-4gang",
  week:"8주차 4강",
  weekNum:8,
  lectureNum:4,
  type:"concept",
  label:"Pool Fire·중질유 탱크재해(Boil/Slop/Froth Over)·LNG Rollover·BLEVE·물리적/화학적 폭발·VCE/UVCE",
  sub:"액면화재(Pool Fire)의 영향인자, 경질유·중질유 탱크화재 특성과 Boil Over·Slop Over·Froth Over, LNG 저장탱크 Rollover 발생 메커니즘, 물리적 폭발과 화학적 폭발의 구분, BLEVE(액격·취성파괴) 메커니즘과 대책, VCE·UVCE 비교",
  notes:[
    { title:"1. Pool Fire와 경질유·중질유 탱크화재", blocks:[{ type:"p", text:"Pool Fire(액면화재)는 용기·저장조처럼 치수가 정해진 액면에서 발생하는 화재로, 액면 면적(화염 둘레)이 커질수록 층류에서 난류로 전이되며 복사율(엡실론)이 흑체(1)에 가까워져 열방출률·복사피해가 커진다. 화염 높이가 높을수록, 바람에 의한 화염 경사각(θ)이 커질수록 목표물과의 근접거리가 늘어나 피해가 증가한다. 방지대책은 점화원 제거 또는 누출·방류·체류 방지(물적 조건 제어)이다." }, { type:"p", text:"경질유(비점이 낮은 가연성 액체)는 상온에서 항상 가연성 혼합기를 형성해 인화 위험성이 높고 예혼합형 화염전파 특성을 가지며, 재해 유형으로 VCE(밀폐공간 증기운폭발)·UVCE(개방공간 증기운폭발)·BLEVE가 있다. 중질유(비점이 높은 액체)는 상온에서 가연성 혼합기를 형성하지 않아 인화점 이상으로 예열해야 인화되는 예열형 화염전파 특성을 가지며, 재해 유형으로 Boil Over·Slop Over·Froth Over가 있다." }, { type:"table", headers:["현상", "메커니즘", "방지대책"], rows:[["Boil Over", "고온의 열류층이 탱크 저부의 물과 접촉→물의 수소결합 파괴로 급격히 기화→부피팽창하며 유류가 탱크 밖으로 분출·연소", "물분무로 열류층 냉각, 열류층 기계적 교반, 탱크 저부 수층 생성 방지, Boil Over 발생 전 조기 소화"], ["Slop Over", "소방대 주수 시 열류층이 교란되어 탱크 밖으로 비산·연소(열↑물질↑ 방향이 같아지며 발생)", "방유제 설치, 보유공지 확보로 피해 확산 방지"], ["Froth Over", "고점도 유류 아래 소량의 물이 고온 물질(아스팔트 등) 주입으로 비등하며 탱크 밖으로 물·기름이 비산(연소는 수반하지 않음)", "탱크 저부 수층 생성 방지"]] }] },
    { title:"2. LNG 저장탱크의 Rollover 현상", blocks:[{ type:"p", text:"LNG 저장탱크에 조성이 다른(고밀도·고열량의 중질 LNG와 저밀도·저열량의 경질 LNG) LNG를 함께 저장하면 밀도차로 상부에 경질층, 하부에 중질층이 형성된다. 이 상태에서 외부 열이 전달되면 상부 경질층은 가벼운 성분이 먼저 증발하며 점차 밀도가 높아지고, 하부 중질층은 증발하지 못한 채 열을 계속 축적하며 밀도가 서서히 낮아진다. 두 층의 밀도가 같아지는 시점에 급격히 혼합(단시간 내 상하 혼합)되면서 하부에 축적됐던 열에너지가 순간적으로 비등기화가스(BOG)를 대량 발생시켜 탱크 내압이 급상승하는 현상이 Rollover이다." }, { type:"p", text:"Rollover는 탱크가 견디면 압력방출로 다량의 가연성 가스가 누출되어 개방공간 증기운폭발(UVCE)로 이어질 수 있고, 견디지 못하면 탱크 파열(폭발)로 이어질 수 있다. 방지대책은 LNG 조성 범위를 제한해 경질·중질을 각각 별도 저장(주입구 상하 분리), 탱크 내 순환·교반시켈 통한 층 형성 방지, 단열 처리로 열전달 저감, 벤트·릴리프 장치 설치 등이다." }, { type:"callout", text:"➡ Rollover는 건축물 화재의 천장부 화염이 구르듯 확산되는 '플레임오버(구획실 롤오버)'와 이름이 같아 혼동하기 쉽다. 둘의 정의를 명확히 구분해 서술해야 한다." }] },
    { title:"3. 물리적 폭발과 화학적 폭발, BLEVE, VCE·UVCE", blocks:[{ type:"p", text:"폭발은 압력의 급격한 발생 또는 해방으로 파괴·폭발음을 수반하는 현상이며, 원인계와 생성계의 물질이 동일하면(상변화만 수반) 물리적 폭발, 물질이 달라지면(화학반응 수반) 화학적 폭발로 구분한다. 물리적 폭발은 수증기폭발·과열액체증기폭발(BLEVE)·고상간전이폭발·전선폭발·감압폭발 등이 있고, 화학적 폭발은 가스폭발·분무폭발·분진폭발·분해폭발 등이 있다." }, { type:"p", text:"BLEVE(Boiling Liquid Expanding Vapor Explosion)는 가연성 액화가스 저장탱크가 외부 화재에 노출되어 온도가 상승하며(액온 상승) 탱크 강도가 저하되어 균열이 발생하면, 내부 압력이 급격히 낮아지며 포화증기곡선상 비점이 하강해 액체가 순간 재비등(플래시 증발)하는 현상이다. 급격히 발생한 증기가 탱크 벽면을 때리는 액격현상으로 취성파괴가 일어나 탱크가 파열되며, 저장량이 1톤 이상이면 파이어볼(Fire Ball)을 형성한다. 이를 '평형파탄형 폭발'이라고도 부른다." }, { type:"table", headers:["대책 분류(내외방폭감)", "내용"], rows:[["내(내압강도 향상)", "탱크벽 두께 증대 등 용기 강도 자체를 높임"], ["외(외력 방지)", "방액제 내부 기초 경사화(누설액 이격 저류), 폭발방지장치 설치"], ["방(열전달 차단)", "탱크 내벽 열전도 좋은 물질 설치, 단열공사, 물분무설비로 냉각, 지하매설"], ["감(내압 감압)", "벤트·릴리프 등 압력 방출장치로 내압 급상승 방지"]] }, { type:"p", text:"증기운폭발은 발생 공간에 따라 VCE(밀폐공간 증기운폭발)와 UVCE(개방공간 증기운폭발)로 구분한다. VCE는 저장탱크 내부 기상부에 형성된 가연성 증기운이 점화원에 착화되어 압력 상승 후 폭발하는 현상으로 밀폐공간 불활성화(질소 등으로 산소농도를 MOC 이하로 낮춤)가 대책의 핵심이며, UVCE는 대기 중 누설된 가연성 가스·증기가 구름을 형성해 점화원에서 폭발하는 현상으로 누설·방류·체류 방지(누방체)가 대책의 핵심이다. 두 폭발 모두 물적 조건(폭발범위 내 농도, 충분한 증기운 크기)과 에너지 조건(최소점화에너지 이상)이 동시에 만족되어야 발생한다." }] }
  ],
  cards:[
    { q:"Pool Fire의 화재크기에 영향을 주는 요소는?", a:"불타는 액면적(둘레)이 커질수록 복사율(엡실론)이 흑체(1)에 가까워지고, 화염 높이·바람에 의한 화염 경사각이 클수록 열방출과 복사피해가 커진다." },
    { q:"경질유와 중질유의 화염전파 특성 차이는?", a:"경질유는 상온에서 항상 가연성 혼합기를 형성해 예혼합형 화염전파를, 중질유는 인화점 이상으로 예열해야 인화되는 예열형 화염전파 특성을 갖는다." },
    { q:"경질유 탱크와 중질유 탱크의 대표 재해 유형은?", a:"경질유 탱크는 VCE·UVCE·BLEVE, 중질유 탱크는 Boil Over·Slop Over·Froth Over가 대표적이다." },
    { q:"Boil Over의 발생 메커니즘은?", a:"고온의 열류층과 탱크 저부의 물이 접촉→물의 수소결합 파괴로 급격히 기화→부피팽창→유류가 탱크 밖으로 분출·연소하는 현상이다." },
    { q:"Slop Over의 발생 조건과 대책은?", a:"소방대의 주수 소화 시 열류층이 교란되어 탱크 밖으로 비산·연소하며, 방유제 설치와 보유공지 확보로 피해 확산을 방지한다." },
    { q:"Froth Over가 다른 두 현상과 구별되는 특징은?", a:"연소를 수반하지 않고 고점도 유류 아래의 소량의 물이 고온 물질 주입으로 비등하며 탱크 밖으로 물·기름이 넘치는 현상이다." },
    { q:"LNG 저장탱크 Rollover의 발생 조건은?", a:"조성이 다른 경질·중질 LNG가 층을 이루고 있는 상태에서 외부 열에 의해 상부는 증발로 밀도가 높아지고 하부는 열을 축적하며 밀도가 낮아져, 두 층 밀도가 같아지면 급격히 혼합되며 발생한다." },
    { q:"Rollover 시 탱크 내압이 급상승하는 이유는?", a:"하부에 축적되어 있던 열에너지를 가진 액체가 상부 기상부와 만나며 순간적으로 대량 기화(BOG 급증)되기 때문이다." },
    { q:"Rollover의 방지대책은?", a:"LNG 조성 범위 제한(경질·중질 별도 저장), 탱크 내 순환·교반, 단열 처리, 벤트·릴리프 장치 설치다." },
    { q:"물리적 폭발과 화학적 폭발의 근본적 구분 기준은?", a:"원인계와 생성계의 물질이 동일하면(상변화만 발생) 물리적 폭발, 화학반응으로 물질이 달라지면 화학적 폭발이다." },
    { q:"BLEVE의 발생 메커니즘(액온·액격)은?", a:"외부 화재로 액온이 상승→기상부 증발로 압력 상승, 탱크 강도 저하로 균열 발생→내압 급강하로 비점 하강→액체 순간 재비등(플래시 증발)→기화 증기가 탱크벽을 때리는 액격현상→취성파괴로 탱크 파열이다." },
    { q:"BLEVE가 '평형파탄형 폭발'로 불리는 이유는?", a:"정상 상태에서는 액체의 기화와 액화가 평형을 이루고 있는데, 외부 화재로 이 평형이 깨지면서 폭발이 일어나기 때문이다." },
    { q:"BLEVE 저장량이 1톤 이상일 때 형성되는 현상은?", a:"파이어볼(Fire Ball)이 형성되며, 화염 둘레가 매우 커 복사율이 흑체(1)에 근접해 강력한 복사열 피해를 일으킨다." },
    { q:"BLEVE 방지대책을 정리하는 두문자는?", a:"'내외방감'으로, 내(내압강도 향상)·외(방액제 경사·폭발방지장치)·방(열전달 차단·단열·물분무·지하매설)·감(벤트·릴리프로 내압 감압)이다." },
    { q:"VCE와 UVCE의 공간적 차이는?", a:"VCE(밀폐공간 증기운폭발)는 저장탱크 등 밀폐공간 내부에서, UVCE(개방공간 증기운폭발)는 누설된 가스가 대기 중(개방공간)에서 폭발하는 현상이다." },
    { q:"VCE의 대책 핵심과 UVCE의 대책 핵심 차이는?", a:"VCE는 밀폐공간이므로 불활성기체 치환으로 산소농도를 MOC 이하로 낮추는 불활성화가 핵심이고, UVCE는 개방공간이므로 누설·방류·체류를 막는 것(누방체)이 핵심이다." },
    { q:"증기운폭발(VCE·UVCE) 발생에 공통으로 요구되는 조건은?", a:"물적 조건(가연성 혼합기 농도가 폭발범위 내, 충분한 크기의 증기운 형성)과 에너지 조건(최소점화에너지 이상의 점화원 존재)이 동시에 만족되어야 한다." },
    { q:"증기운폭발의 점화원 관련 공통 대책은?", a:"최소점화에너지 미만으로 에너지원을 제어, 정전기 제거, 전기설비 방폭화 등이다." },
    { q:"경질유·중질유 탱크에서 CRT탱크(원추형 지붕)와 FRT탱크(부상지붕)의 활용 차이는?", a:"경질유는 기상공간이 없는 FRT탱크에 저장하거나 불활성화를 통해 저장하며, 중질유는 상온에서 가연성 혼합기를 형성하지 않아 CRT탱크 저장이 가능하다." },
    { q:"풀파이어(Pool Fire) 방지의 근본 원칙은?", a:"점화원을 제거하거나 누출·방류·체류(물적 조건)를 방지해 액면화재가 발생할 조건 자체를 없애는 것이다." }
  ]
};

  cards:[
    { q:"[66회] 대형저장용기에서 pool fire시 알콜이 휘발유나 등유보다 연소속도가 느려서 화재지속시간이 긴 이유를 설명하시오.", a:"알코올은 완전 예혼합에 가까운 청염 연소로 복사열 재유입이 적어 증발속도(질량연소속도)가 느리고, 그 결과 단위시간당 소비되는 액체량이 적어 동일 저장량 기준 화재지속시간이 길어진다." },
    { q:"[72회] 화학공장에서 화재 위험성을 평가하기 위한 화재 모델링(pool fire, jet fire, BLEVE 등)에 대하여 논하시오.", a:"Pool Fire는 액면이 정해진 액체화재, Jet Fire는 고압 누출가스가 점화되어 제트형 화염을 이루는 분출화재, BLEVE는 가연성 액화가스 탱크의 과열액체 증기폭발이며, 각각 별도의 열유속·화염길이 모델식으로 위험성을 평가한다." },
    { q:"[107회] 위험물 저장탱크에서 중유 화재 시 나타날 수 있는 슬롭오버(Slop Over)와 보일오버(Boil Over)를 설명하시오.", a:"슬롭오버는 소방대 주수 시 열류층이 교란되어 탱크 밖으로 비산·연소하는 현상이고, 보일오버는 열류층과 탱크 저부의 물이 접촉해 급격히 기화·팽창하며 유류가 탱크 밖으로 분출·연소하는 현상이다." },
    { q:"[78회] 화재에 의한 비등액체 증기운폭발(BLEVE)의 발생단계 및 예방대책을 기술하시오.", a:"발생단계는 외부화재 노출→액온상승·기상부 증발로 내압상승→탱크강도저하·균열발생→급격한 감압으로 비점하강·순간재비등(플래시증발)→액격현상에 의한 취성파괴→탱크파열(파이어볼)이며, 예방대책은 '내외방감'(강도향상·경사방액제·단열/냉각·벤트감압)이다." },
    { q:"[84회] 100kg의 프로판(LPG)이 누출 인화되어 BLEVE가 발생하였을 때 Fire ball의 최대직경 등을 계산식으로 구하시오.", a:"파이어볼 최대직경은 D=6.48×M^0.325(m), 지속시간은 t=0.852×M^0.26(s) 등 TNO 계산식을 이용해 저장량 M(kg)을 대입하여 산정한다." },
    { q:"[77회] LNG 저장시설에서 LNG가 대량 누출될 때 옥외 증기운폭발(UVCE)이 일어날 수 있는 원인과 방지방법을 논하시오.", a:"원인은 저온 LNG가 대기 중 누설되어 급격히 기화하며 가연성 증기운을 형성한 뒤 점화원과 만나는 것이며, 방지방법은 누설감지·긴급차단밸브 설치, 방류둑·방액제 설치, 점화원 관리, 안전거리 확보다." },
    { q:"[78회] 증기운폭발(VCE)에 영향을 주는 변수를 설명하시오.", a:"증기운의 크기(누출량), 가연성 혼합기 농도(화학양론비 근접도), 점화 지연시간, 대기 확산조건(풍속·안정도), 점화원의 위치와 에너지가 주요 변수다." },
    { q:"[107회] 이동저장탱크에서 위험물 유출로 화재·폭발 발생 시 UVCE에 대하여 설명하시오.", a:"이동탱크의 내부칸막이·방호틀·방파판이 파손되어 위험물이 대량 유출되면 대기 중 가연성 증기운을 형성하고, 점화원과 접촉 시 개방공간에서 폭발하는 UVCE로 이어질 수 있다." },
    { q:"[일반원리] BLEVE에서 '액격현상'과 '취성파괴'의 관계를 설명하시오.", a:"급격한 감압으로 액체가 순간 재비등(플래시증발)하면서 발생한 증기가 탱크 벽면을 강하게 때리는 것이 액격현상이며, 이미 강도가 저하된 탱크 벽이 액격의 충격을 견디지 못해 파괴되는 것이 취성파괴다." },
    { q:"[일반원리] 경질유 탱크와 중질유 탱크의 재해 유형이 다른 이유는?", a:"경질유는 상온에서 항상 가연성 혼합기를 형성해 VCE·UVCE·BLEVE 위험이 크고, 중질유는 상온에서 혼합기를 형성하지 않지만 화재 시 열류층이 형성되어 물과 접촉하면 Boil Over 등이 발생한다." },
    { q:"[일반원리] VCE와 UVCE의 방지대책이 서로 다른 이유는?", a:"VCE는 밀폐공간(탱크 내부)에서 발생하므로 불활성가스 치환으로 산소농도를 낮추는 불활성화가 핵심 대책이고, UVCE는 개방공간(대기 중)에서 발생하므로 누설·방류·체류 자체를 막는 것이 핵심 대책이다." },
    { q:"[일반원리] Pool Fire의 화염 둘레가 커질수록 복사율(엡실론)이 1에 가까워지는 이유는?", a:"화염 둘레가 커지면 화염층이 두꺼워져 빛(복사)이 화염 자체에 흡수·재방사되며 흑체에 가까운 복사 특성을 나타내기 때문이다." },
    { q:"[일반원리] Boil Over 방지대책 4가지는?", a:"탱크 외벽 물분무로 열류층 냉각, 열류층 기계적 교반, 탱크 저부 수층 생성 방지, Boil Over 발생 전 조기 소화다." },
    { q:"[일반원리] Froth Over가 Boil Over·Slop Over와 다른 핵심 차이는?", a:"Froth Over는 연소(화재)를 수반하지 않고 고온 물질 주입에 의한 저부 수층의 비등만으로 유류·물이 넘치는 현상이라는 점이 다르다." },
    { q:"[일반원리] LNG 탱크 Rollover와 구획실 화재의 '롤오버(플레임오버)'를 구분하는 방법은?", a:"LNG Rollover는 저장탱크 내 밀도차 층이 급격히 혼합되며 내압이 급상승하는 현상이고, 구획실 롤오버(플레임오버)는 천장부 미연소 가연성가스가 화염을 따라 구르듯 확산되는 연소현상으로 발생 장소와 메커니즘이 전혀 다르다." }
  ]
};

const CONCEPT_DECK_8WK_5GANG = {
  id: "concept-8wk-5gang",

  label:"분진폭발 메커니즘·영향인자·폭발성지수, 분해폭발, 반응폭주(IPL·PFD·SIL), 폭발방지·방호대책, 폭발위험장소 분류",
  sub:"분진폭발의 2·3차 폭발 전이 메커니즘과 가스폭발 대비 특징, 폭발성지수(발화도·폭발강도)와 하우스키핑, 아세틸렌 분해폭발, 반응폭주와 독립방호계층(IPL)·안전도(SIL), 봉쇄·차단·폭발억제·방산공, 0종·1종·2종 폭발위험장소 구분",
  notes:[
    { title:"1. 분진폭발의 메커니즘과 가스폭발 대비 특징", blocks:[{ type:"p", text:"분진폭발은 가연성 고체 미세입자가 공중에 부유한 상태에서 외부 열을 받아 열분해되어 표면 주변에 가연성 혼합기(기체)를 형성하고, 점화원에 의해 착화되어 1차 폭발이 일어난 뒤 그 폭발에너지가 주변 입자를 재차 비산·분해시켜 2차·3차 폭발로 전이되는 흡염배 메커니즘을 갖는다. 고체이므로 완전 분해가 되지 않아 폭발 후에도 미연소 잔재(찌꺼기)가 남으며, 이 잔재가 피부에 부착되면 심한 화상을 유발한다." }, { type:"table", headers:["구분", "가스폭발", "분진폭발"], rows:[["초기 연소속도·폭발압력", "빠름·큼", "느림·작음(1차는 상대적으로 작음)"], ["폭발 진행", "일시에 완결(눈으로 구분 안 될 만큼 빠름)", "2차·3차 폭발로 전이되며 피해면적 확대"], ["연소시간", "짧음", "길게 나타남"], ["파괴력·발열량 총합", "상대적으로 작음", "2·3차 전이로 파괴력·화흐름이 더 크게 나타남"], ["인체 피해", "화상", "심한 탄화·화상(미연소 잔재), CO 다량발생으로 가스중독 위험"]] }, { type:"p", text:"분진폭발에 영향을 주는 인자는 화학적 성질과 조성(휘발분이 높을수록 폭발 용이), 입도 및 입도분포(입경이 작고 비표면적이 클수록 폭발 용이), 입자의 형상과 표면상태, 수분(많을수록 폭발 억제), 부유성(클수록 체류시간이 길어 위험 증가), 그리고 온도·압력·산소농도·가연성 가스농도(화학양론농도에 가까울수록 폭발위력 증대) 등이다." }] },
    { title:"2. 폭발성지수·하우스키핑, 분해폭발, 반응폭주", blocks:[{ type:"p", text:"분진의 폭발위험성 지수는 발화도(Ignition Sensitivity)와 폭발강도(Explosion Severity)로 나뉜다. 발화도는 표준 석탄분진을 기준(분모)으로 측정분진의 최소발화에너지(MIE)·폭발하한계(LFL)·발화온도(AIT, 단위계 MLT)가 작을수록 커지고, 폭발강도는 표준분진을 기준(분모)으로 측정분진의 최대폭발압력과 최대폭발압력상승속도(PV, 단위 N/m²·m/s)가 클수록 커진다. 두 지수를 곱한 폭발성지수로 위험등급(약함~아주 강함)을 분류한다." }, { type:"p", text:"분진폭발의 가장 대표적인 예방대책은 하우스키핑(주기적 청소)이다. 청소상태는 양호(누출등급과 무관하게 분진층이 거의 없음)·보통(1교대 주기 내 분진층이 잠깐 존재)·불량(다음 청소주기까지 분진층이 계속 존재)으로 구분하며, 청소는 횟수보다 매회 청소 시 분진운을 형성할 만큼의 잔류물을 남기지 않는 상태(수준)가 더 중요하다." }, { type:"p", text:"분해폭발은 산소 없이도 발열분해에 의해 폭발하는 현상으로, 아세틸렌(C₂H₂)이 대표적이다. 아세틸렌의 연소범위는 산소 존재 시 2.5~80%이지만, 분해폭발의 폭발한계는 가연성가스 단독 100%(2.5~100%)까지 확대된다. 배관 중 아세틸렌은 폭연에서 폭굉으로 전이되기 쉽다. 반응폭주는 화학공정의 발열반응(반열)이 방열을 초과해 반응속도가 통제 불능으로 상승하는 현상으로, 원인은 원조(원재료)·혼합·냉각·계장(제어시스템)의 4가지로 정리하며, 대책은 원재료 공급 차단, 내용물 긴급 방출·이송, 연쇄반응 억제제(불활성가스) 투입, 냉각수 긴급 공급이다." }, { type:"p", text:"반응폭주 방지를 위한 계장시스템(센서-로직솔버-최종제어요소)의 각 구성요소는 독립방호계층(IPL, Independent Protection Layer)이라 부르며, 각 IPL의 작동실패확률(PFD)을 분석해 병렬로 설치하면 시스템 전체의 안전도(SIL, Safety Integrity Level, 1~4등급)가 향상된다. SIL 4등급은 원자력발전소 수준의 안전도에 해당한다." }] },
    { title:"3. 폭발 방지·방호대책과 폭발위험장소 분류", blocks:[{ type:"p", text:"폭발 방지대책은 물적 조건(가연물 제어) 또는 에너지 조건(점화원 제어) 중 하나 이상을 제어하는 것이며, 방호대책(발생 이후 피해 최소화)은 봉쇄(장치·건물이 폭발압력을 견디도록 충분한 강도 확보)·차단(화염이 다른 곳으로 전파되지 않도록 자동 차단)·폭발억제(파괴적 압력 도달 전 연쇄반응 억제제를 빠르게 분사해 화염을 죽임)·방산공(약한 부분을 미리 만들어 그쪽으로 압력을 방출)·안전거리 확보로 구성된다." }, { type:"p", text:"폭발위험장소는 가연성 혼합기가 형성되는(폭발분위기를 형성하는) 장소로, 국내는 0종·1종·2종의 3단계로 구분하고 NFPA는 Division 1·2의 2단계로 구분한다. 선정절차는 인화성 액체(NFPA 30 기준 인화점 100°F=약 38℃ 미만)를 저장·취급하는 대상 선정→관련정보(설계도면·설비이력) 수집→누출원 판단(누출량 약 10~20L/min 이상)→누출빈도(위험성)에 따라 등급 결정의 순서로 진행된다." }, { type:"table", headers:["구분", "정의", "시간기준(연간)", "비고"], rows:[["0종", "설비가 정상 운전 상태에서도 폭발분위기가 장기간 또는 빈번히 존재(예: 저장탱크 상부 기상공간)", "약 1,000시간 이상", "본질안전방폭구조만 사용 가능"], ["1종", "정상 운전 중 폭발분위기가 가끔 생성되는 장소(예: 벤트·펌프·밸브 주변)", "약 10~1,000시간", "비점화방폭구조를 제외한 나머지 방폭구조 사용 가능"], ["2종", "정상 상태에서는 폭발분위기가 형성되지 않고, 이상상태·오조작 시에만 생성되는 장소", "약 1~10시간", "모든 방폭구조 사용 가능"]] }, { type:"p", text:"폭발위험장소를 정하는 변수는 누출량·누출확률뿐 아니라 가스의 비중(공기보다 무겁거나 가벼운지), LFL 이상 형성 여부, 환기 상태(개방공간에서 바람에 의한 분산 여부), 기후·지형 조건 등이 함께 고려된다." }, { type:"callout", text:"➡ 분진폭발은 8주차 5강에서 가장 출제빈도가 높은 폭발 주제이므로 메커니즘·특징·영향인자·폭발성지수를 확실히 암기하고, 반응폭주와 폭발위험장소 분류는 최소한 정의와 구분기준만이라도 서술할 수 있도록 준비한다." }] }
  ],
  cards:[
    { q:"분진폭발의 메커니즘 5단계는?", a:"공중 부유→외부 열에 의한 열분해→분해가스와 산소의 가연성 혼합기 형성→점화원에 의한 1차 폭발→그 에너지가 주변 입자를 재분해시켜 2·3차 폭발로 전이된다." },
    { q:"분진폭발 후 미연소 잔재가 남는 이유와 그 피해는?", a:"고체입자는 완전히 분해되지 않고 남으므로, 이 잔재가 인체에 부착되면 심한 화상과 탄화를 유발한다." },
    { q:"분진폭발이 가스폭발보다 파괴력과 화흐름이 더 크게 나타나는 이유는?", a:"초기 폭발은 가스폭발보다 작지만 2차·3차 폭발로 계속 전이되며 피해면적을 넓혀가기 때문에, 누적된 파괴력과 화흐름이 더 크게 나타난다." },
    { q:"분진폭발 시 CO(일산화탄소)가 다량 발생하는 이유는?", a:"고체 입자의 불완전연소로 인해 CO가 다량 발생하며, 이로 인해 가스중독의 위험성이 높아진다." },
    { q:"분진폭발에 영향을 주는 인자 5가지는?", a:"화학적 성질과 조성(휘발분), 입도 및 입도분포, 입자의 형상·표면상태, 수분함량, 부유성이다." },
    { q:"입경이 작을수록 분진폭발이 잘 일어나는 이유는?", a:"입경이 작을수록 비표면적이 커져 산소와의 접촉면이 넓어지고 열분해가 빨라지기 때문이다." },
    { q:"발화도(Ignition Sensitivity)를 구성하는 3가지 요소(MLT)는?", a:"최소발화에너지(M)·폭발하한계(L)·발화온도(T)이며, 표준 석탄분진 대비 측정분진의 값이 작을수록 발화도가 커진다." },
    { q:"폭발강도(Explosion Severity)를 구성하는 요소는?", a:"측정분진의 최대폭발압력과 최대폭발압력상승속도(PV)이며, 표준분진 대비 값이 클수록 폭발강도가 커진다." },
    { q:"분진폭발의 가장 대표적인 예방대책은?", a:"주기적인 청소(하우스키핑)로, 분진운을 형성할 만큼의 분진이 쌓이지 않도록 관리하는 것이다." },
    { q:"청소상태의 3등급(양호·보통·불량) 구분은?", a:"양호는 분진층이 거의 없는 상태, 보통은 1교대 주기 내 분진층이 잠깐 존재하는 상태, 불량은 다음 청소주기까지 분진층이 계속 존재하는 상태다." },
    { q:"분해폭발의 정의와 대표 물질은?", a:"산소 없이도 발열분해에 의해 폭발하는 현상으로, 아세틸렌(C₂H₂)이 대표적이다." },
    { q:"아세틸렌 분해폭발의 폭발한계가 연소범위(2.5~80%)보다 넓은 이유는?", a:"산소가 없어도 자체 발열분해로 폭발할 수 있으므로, 폭발한계가 가연성가스 단독 100%(2.5~100%)까지 확대되기 때문이다." },
    { q:"반응폭주의 정의는?", a:"화학공정에서 발열반응(반열)이 방열을 초과해 반응속도가 통제 불가능하게 상승하는 현상이다." },
    { q:"반응폭주의 4대 발생원인은?", a:"원조(원재료 배합비율 이상), 혼합(혼합·혼촉 위험물질의 잘못된 혼합), 냉각(냉각능력 부족·정지), 계장(제어시스템 오동작)이다." },
    { q:"반응폭주 방지를 위한 계장시스템의 3요소는?", a:"센서(이상 감지)-로직솔버(판단·명령)-최종제어요소(원료 차단 등 실제 작동)이며, 이를 통칭해 독립방호계층(IPL)이라 부른다." },
    { q:"독립방호계층(IPL)을 병렬로 설치하면 얻는 효과는?", a:"각 계층의 작동실패확률(PFD)이 곱해져 전체 시스템의 실패확률이 크게 낮아지고, 그 결과 안전도(SIL)가 향상된다." },
    { q:"폭발 방호대책 중 봉쇄·차단·폭발억제·방산공의 차이는?", a:"봉쇄는 폭발압력을 견디도록 강도를 높이는 것, 차단은 화염의 타 구역 전파를 자동 차단하는 것, 폭발억제는 파괴압력 도달 전 억제제를 분사해 화염을 죽이는 것, 방산공은 약한 부분을 미리 만들어 그쪽으로 압력을 방출하는 것이다." },
    { q:"국내 폭발위험장소의 0종·1종·2종 구분 기준은?", a:"0종은 정상 운전 상태에서도 폭발분위기가 장기간·빈번히 존재(연간 약 1,000시간 이상), 1종은 정상 운전 중 가끔 생성(약 10~1,000시간), 2종은 이상상태·오조작 시에만 생성(약 1~10시간)되는 장소다." },
    { q:"0종 장소에 사용 가능한 방폭구조는?", a:"본질안전방폭구조만 사용할 수 있다." },
    { q:"폭발위험장소 선정 시 인화성 액체의 판단기준(NFPA 30)은?", a:"인화점이 100°F(약 38℃) 미만인 액체를 인화성 액체로 구분하며, 별도의 가열 없이도 상온에서 가연성 혼합기를 형성할 수 있는 장소를 대상으로 한다." }
  ]
};

    { q:"[97회] 국내에서 적용되는 가스폭발 위험장소설정(hazardous area classification)의 주요변수를 설명하시오.", a:"누출원의 누출량·누출빈도, 가스의 비중과 확산특성, 환기 상태(자연·기계환기), 폭발범위(LFL~UFL) 형성 여부가 주요 변수다." },
    { q:"[104회] 방폭(폭발방지) 및 위험지역 분류기준에 대해 방폭의 정의, 폭발의 요소·점화원의 종류, 국내외 위험지역 분류기준을 비교 설명하시오.", a:"방폭은 폭발성 분위기에서 전기설비가 점화원이 되지 않도록 하는 것이며, 국내는 0종·1종·2종(3단계), 미국 NFPA는 Division 1·2(2단계)로 분류해 서로 대응관계를 이룬다." },

  notes:[
    { title:"1. 방폭구조의 종류와 선정 원칙", blocks:[{ type:"p", text:"방폭이란 폭발위험장소에서 물적 조건(가연성가스·증기에 의한 예혼합기)이 이미 형성되어 있음을 전제로, 에너지 조건(전기불꽃·고온부 등 점화원)을 제어하여 점화를 방지하는 것을 말한다. 전기방폭구조는 압력방폭구조(p, 용기 내부에 신선한 공기·질소 등 보호기체를 압입하여 외부보다 높은 압력을 유지시켜 가연성가스·증기의 침입을 방지), 유입방폭구조(o, 전기불꽃·아크·고온발생부를 절연유 속에 넣어 유면 위쪽의 폭발성가스에 인화되지 않도록 함), 내압방폭구조(d, 용기가 내부 폭발압력에 견디고 접합부·개구부를 통해 화염이 외부로 전파되지 않도록 함), 몰드방폭구조(m, 컴파운드로 밀폐), 충전방폭구조(q, 충전물질로 충전하여 폭발을 방지), 안전증방폭구조(e, 정상운전 중 전기적·기계적으로 안전도를 증가시켜 폭발성가스에 인화되지 않도록 함), 본질안전방폭구조(i, 정상 시 및 사고 시 발생하는 전기불꽃·고온부가 폭발성가스를 점화시키지 않음이 시험을 통해 입증된 구조)의 7종으로 구분되며, 이 중 내압방폭구조와 본질안전방폭구조가 산업현장에서 가장 널리 사용된다." }, { type:"table", headers:["구분", "정의", "사용가능 방폭구조"], rows:[["0종 장소", "폭발성가스 분위기가 정상 운전 중에도 연속적 또는 장시간(연간 약 1,000시간 이상) 존재", "본질안전방폭구조(ia)만 사용 가능"], ["1종 장소", "정상 운전 중 폭발분위기가 가끔(연간 약 10~1,000시간) 생성될 수 있는 장소", "비점화방폭구조를 제외한 나머지 방폭구조 사용 가능"], ["2종 장소", "정상 상태에서는 폭발분위기가 형성되지 않고 이상상태·오조작 시에만(연간 약 1~10시간) 생성", "모든 방폭구조 사용 가능"]] }, { type:"p", text:"방폭구조 선정 시 고려사항은 ①폭발위험장소 구분(0종·1종·2종) ②가스의 폭발등급(최대안전틈새 MESG 또는 최소점화전류비 MIC) ③발화도(용기 표면온도등급 T1~T6) ④주변환경(습도·표고·주위온도)이다. 표면온도등급은 최고표면온도를 기준으로 T1(450℃ 이하)부터 T6(85℃ 이하)까지 6단계로 구분한다." }] },
    { title:"2. 내압방폭구조·본질안전방폭구조 원리 심화", blocks:[{ type:"p", text:"내압방폭구조(d)의 성립 원리는 3단계로 구성된다. ①용기의 내압강도가 내부 폭발압력보다 커야 하며(용기가 폭발압력에 견딤) ②최대안전틈새(MESG)를 통해 화염이 외부로 일주하지 않아야 하고(냉각작용에 의한 소염과 부착력에 의한 무염영역의 원리) ③폭발로 상승한 용기 표면온도가 외부 가연성가스의 발화점 미만이어야 한다. 이 세 조건이 모두 만족되어야 내부에서 폭발이 일어나더라도 외부 가연성가스 분위기에 영향을 주지 않는다." }, { type:"p", text:"본질안전방폭구조(i)의 원리는 최소점화전류비(MIC, Minimum Igniting Current ratio, 메탄의 최소점화전류를 기준 1로 한 비율)에 기반한다. 대상가스의 MIC가 0.45 미만이면 IIC(가장 위험, 최소 에너지로도 점화), 0.45 이상 0.8 이하이면 IIB, 0.8 초과이면 IIA로 폭발등급을 구분한다. 비위험장소에서 위험장소로 흐르는 전압·전류를 폭발이 일어나지 않는 수준까지 제한·차단하는 회로설계 방식에는 제너베리어(Zener barrier) 방식과 아이솔레이터(Isolated barrier) 방식이 있다." }, { type:"table", headers:["구분", "제너베리어(Zener Barrier) 방식", "아이솔레이터(Isolated Barrier) 방식"], rows:[["전류 차단소자", "제너다이오드 + 저항 + 퓨즈", "변압기 + 광전소자 + 릴레이"], ["접지(본딩)", "반드시 필요", "불필요"], ["구조·가격", "간단·저렴", "복잡·고가"], ["재사용성·신뢰도", "퓨즈 단선 시 재사용 불가, 신뢰도 상대적으로 낮음", "재사용 가능, 신뢰도 상대적으로 높음"]] }, { type:"p", text:"제너다이오드는 정전압을 유지시켜 과전압을 제한하고, 저항은 전류량을 감소시키며, 퓨즈는 과전압이 발생하면 회로를 차단하는 역할을 한다. 아이솔레이터는 변압기로 전압을 강압시켜 넘기므로 접지가 불필요하고 신뢰도가 더 높지만, 구조가 복잡하고 고가라는 단점이 있다." }] },
    { title:"3. 화염전파방지장치·폭발억제장치·IP등급", blocks:[{ type:"p", text:"화염전파방지기(flame arrestor)는 인화성액체 저장탱크의 통기관 끝에 설치하여, 외부 화염이 다수의 미세한 틈새로 구성된 소염소자를 통과하며 냉각작용과 무염영역의 원리(MESG의 원리와 동일)에 의해 소염되도록 하는 장치로, 소염식(다수의 미세한 틈새·판)과 액봉식(액체에 담가 냉각)으로 구분된다." }, { type:"p", text:"폭발억제장치는 폭발 초기에 불꽃감지기로 화염을 감지하고 제어부가 소화약제부에 신호를 보내 연쇄반응 억제 소화약제를 순간적으로 방출하여, 폭발압력이 최대폭발압력의 약 30% 수준에 도달하기 전(약 0.1~0.3초 이내)에 반응을 정지시키는 장치이다. 연쇄반응 억제소화는 냉각·질식소화보다 소화속도가 훨씬 빨라 초단시간 소화에 사용되며, 감지기·신호선·소화약제부는 방폭·내화·내열성과 고도의 신뢰성을 갖춰야 한다." }, { type:"p", text:"IP등급(International Protection Rating)은 전기기기 외함에 대한 고체·액체 이물질 침투 보호등급을 IPXX 형식으로 표기하며, 앞자리는 고체(0~6, 7단계), 뒷자리는 액체(0~8, 9단계)를 나타낸다. 고체는 0(보호없음)부터 6(완전방진)까지, 액체는 0(보호없음)부터 8(연속침수에도 유해한 영향 없음)까지이며, 예를 들어 IP24는 직경 12.5mm 이상 고체(손가락 등)의 침투 방지와 모든 방향에서 분사되는 물에 대한 보호를 의미한다." }, { type:"callout", text:"➡ 방폭구조는 종류별 원리(3대 조건, MIC 등급)를 도식화해 암기하고, IP등급은 박스(고체 7단계·액체 9단계)를 통으로 외워 IPXX 문제에 즉시 대응할 수 있도록 준비한다." }] }
  ],
  cards:[
    { q:"전기방폭구조 7종을 기호와 함께 나열하면?", a:"압력방폭구조(p), 유입방폭구조(o), 내압방폭구조(d), 몰드방폭구조(m), 충전방폭구조(q), 안전증방폭구조(e), 본질안전방폭구조(i)이다." },
    { q:"방폭의 기본 원리는?", a:"폭발위험장소는 물적조건(가연성가스·증기)이 이미 형성되어 있으므로, 에너지조건(점화원)을 제어하여 폭발을 방지하는 것이다." },
    { q:"압력방폭구조(p)의 원리는?", a:"용기 내부에 신선한 공기·불활성기체를 압입해 외부보다 높은 압력(약 50Pa)을 유지시켜 외부 가연성가스의 침입을 차단한다." },
    { q:"유입방폭구조(o)의 원리는?", a:"전기불꽃·아크·고온발생부를 절연유에 침적시켜 유면 위쪽의 가연성가스에 인화되지 않게 한다." },
    { q:"내압방폭구조의 3대 성립조건은?", a:"①용기 내압강도 > 내부 폭발압력 ②MESG를 통한 화염 비일주 ③용기 표면온도 < 가스 발화점이다." },
    { q:"본질안전방폭구조의 정의는?", a:"정상 시 및 사고 시 발생하는 전기불꽃·고온부가 폭발성가스에 점화되지 않음이 시험으로 입증된 구조이다." },

    { q:"제너베리어와 아이솔레이터의 핵심 차이는?", a:"제너베리어는 제너다이오드·저항·퓨즈로 차단하며 접지가 필수이고, 아이솔레이터는 변압기·광전소자·릴레이로 차단하며 접지가 불필요하고 신뢰도가 더 높다." },
    { q:"0종·1종·2종 장소에서 사용 가능한 방폭구조는?", a:"0종은 본질안전방폭구조(ia)만, 1종은 비점화방폭구조를 제외한 나머지 전부, 2종은 모든 방폭구조 사용이 가능하다." },
    { q:"방폭구조 선정 시 고려사항 4가지는?", a:"폭발위험장소 구분, 가스의 폭발등급(MESG·MIC), 발화도(표면온도등급 T1~T6), 주변환경(습도·표고·온도)이다." },
    { q:"표면온도등급 T1~T6의 범위는?", a:"T1 450℃ 이하부터 T6 85℃ 이하까지 6단계로 구분된다." },
    { q:"화염전파방지기의 설치목적과 원리는?", a:"저장탱크 통기관에 설치하며, 소염소자 틈새의 냉각작용과 무염영역 원리로 외부화염이 탱크 내부 가연성혼합기에 인화되지 않도록 방지한다." },
    { q:"화염전파방지기의 두 가지 방식은?", a:"소염식(다수의 미세한 틈새로 소염)과 액봉식(액체에 담가 냉각)이다." },
    { q:"폭발억제장치의 작동 목표시간은?", a:"최대폭발압력의 약 30% 수준(약 0.1~0.3초 이내)에 도달하기 전 소화약제를 방사하여 반응을 정지시켜야 한다." },
    { q:"폭발억제장치가 연쇄반응 억제소화제를 사용하는 이유는?", a:"냉각·질식소화보다 반응속도가 훨씬 빨라 초단시간 내에 화염을 제거할 수 있기 때문이다." },
    { q:"IP등급 표기체계는?", a:"IPXX 형식으로, 앞자리는 고체이물 보호등급(0~6, 7단계), 뒷자리는 액체(물) 보호등급(0~8, 9단계)을 나타낸다." },
    { q:"IP24가 의미하는 바는?", a:"직경 12.5mm 이상 고체(손가락 등)의 침투 방지와 모든 방향에서 분사되는 물에 대한 보호를 의미한다." },
    { q:"안전증방폭구조(e)의 원리는?", a:"정상운전 중 전기적·기계적으로 안전도를 증가시켜 폭발성가스에 인화되지 않도록 하는 구조이다." },
    { q:"폭발위험장소 선정절차는?", a:"대상선정(인화성액체 저장·취급 장소)→설비검토(이력)→누출원 파악(약 12~20L/min 이상)→누출확률 평가→위험성평가(누출원×누출확률)→0/1/2종 분류 순으로 진행한다." },

    { q:"[61회] 방폭전기기구의 종류, 설명, 도시기호, 의미에 대하여 기술하시오.", a:"압력(p)·유입(o)·내압(d)·몰드(m)·충전(q)·안전증(e)·본질안전(i)의 7종이며, 도시기호는 방폭구조 기호+가스그룹(IIA/B/C)+온도등급(T1~T6)으로 표기한다(예: Ex d IIB T4)." },
    { q:"[77회] 화염일주한계 및 실험방법에 대하여 설명하시오.", a:"화염일주한계(MESG)는 예혼합 연소에서 화염이 전파되지 않는 최대 틈새로, 내용적 규정 시험용기 내부에서 폭발시킨 화염이 외부의 표준혼합가스에 점화되지 않는 최대 틈새를 측정하여 결정한다." },
    { q:"[77회] 방폭형 전기기기의 발화도·최대표면온도 분류와 폭발성가스 위험등급을 한국과 IEC 기준으로 비교하시오.", a:"발화도는 표면온도등급 T1~T6(450℃~85℃)로, 폭발성가스 위험등급은 MESG·MIC 기준 IIA/IIB/IIC(국내)와 Group A/B/C/D(북미) 등으로 분류되며 국내는 IEC 60079 체계를 준용한다." },
    { q:"[86·87회] 국내 및 국제규격(IEC/IECEx/IP/NFPA 등)에 규정된 전기설비 방폭구조 5가지를 열거하고 설명하시오.", a:"내압방폭구조(d), 압력방폭구조(p), 유입방폭구조(o), 안전증방폭구조(e), 본질안전방폭구조(i)의 5가지가 대표적이며, 각각 폭발압력 저항, 압입, 절연유 침적, 안전도 증가, 저에너지 회로설계로 폭발을 방지한다." },
    { q:"[90회] 방폭전기기기 선정 시 고려사항과 위험 장소별 선정원칙을 설명하시오.", a:"폭발위험장소(0/1/2종) 구분, 가스 폭발등급(MESG·MIC), 발화도(표면온도등급), 주변환경을 고려하며, 0종은 본질안전만, 1종은 비점화구조 제외 전부, 2종은 전 구조 사용이 원칙이다." },
    { q:"[91회] 본질안전 방폭구조의 개요, 원리, 장단점, 종류, isolated barrier 및 barrier 선택 시 유의사항을 설명하시오.", a:"최소점화전류비(MIC)에 근거해 회로에너지를 제한하는 구조로, 신뢰성이 가장 높으나 적용 가능한 부하용량이 제한적이며, 제너베리어(간단·저가·접지필요)와 아이솔레이터(복잡·고가·접지불필요·고신뢰도) 중 설치환경과 접지 가능여부를 고려해 선택한다." },
    { q:"[93회] 폭발 위험 장소의 각 위험 장소별 배선 종류와 방폭 전기배선 공사 방법을 설명하시오.", a:"0종·1종 장소는 금속관공사·케이블공사 등 방폭구조 배선을 원칙으로 하며 전선관 접속부는 실링피팅으로 밀봉하고, 2종 장소는 제한적으로 안전증 배선공사가 허용된다." },
    { q:"[97회] 인화성액체의 증기 또는 가연성가스로 인한 화재폭발위험 장소를 국내 적용기준으로 구분하시오.", a:"국내는 0종(연속·장기간 존재)·1종(정상운전 중 가끔 생성)·2종(이상상태에서만 생성)의 3단계로 구분하며 각 장소별 사용가능 방폭구조가 다르다." },
    { q:"[103회] 가연성가스, 산소 및 질소로 이루어지는 3성분계 혼합가스의 폭발범위도를 도시하고 설명하시오.", a:"삼각좌표 위에 가연성가스·산소·질소 조성을 표시하고, 폭발범위 영역과 LOC(한계산소농도) 직선, 화학양론선을 함께 도시하여 불활성화 설계에 활용한다." },
    { q:"[103회] 가연성 가스검지기의 검지방식과 검출부 설치기준을 설명하시오.", a:"검지방식은 접촉연소식·반도체식·적외선식 등이 있으며, 검출부는 공기보다 무거운 가스는 바닥 가까이, 가벼운 가스는 천장 가까이 설치하는 것이 기준이다." },
    { q:"[104회] 방폭(폭발 방지) 및 위험지역 분류기준에 대해 방폭의 정의, 점화원의 종류, 국내외 위험지역 분류기준을 비교 설명하시오.", a:"방폭은 폭발성 분위기에서 전기설비가 점화원이 되지 않도록 하는 것이며, 국내는 0종·1종·2종(3단계), NFPA는 Division 1·2(2단계)로 분류해 서로 대응관계를 이룬다." },
    { q:"[109회] 방폭지역별 사용 가능한 방폭전기기기의 선정원칙을 설명하시오.", a:"0종은 본질안전방폭구조(ia)만, 1종은 비점화방폭구조를 제외한 모든 구조, 2종은 모든 방폭구조를 사용할 수 있다는 원칙에 따라 선정한다." },
    { q:"[111회] 소염거리와 최대시험안전틈새(MESG)를 설명하시오.", a:"소염거리는 화염이 전파되지 못하고 꺼지는 한계 거리이며, MESG는 내부폭발이 외부로 전파되지 않는 최대 접합부 틈새로 방폭구조 설계·화염전파방지기 설계의 기초가 된다." },
    { q:"[111회] 방폭전기설비 중 폭발위험분위기의 빈도와 시간에 따른 위험장소를 분류하시오.", a:"빈도·지속시간을 기준으로 0종(연속·장기간)·1종(가끔·단기간)·2종(이상시에만)으로 분류하며 각 종별로 구체적 대표 장소(저장탱크 상부, 밸브 주변, 환기구 등)를 예시로 든다." },
    { q:"[112회] 0종 및 1종 방폭지역에서의 금속전선관 공사 시 전선관 실링(sealing) 방법을 설명하시오.", a:"전선관 접속부·인입부에 실링피팅을 설치하고 컴파운드를 충전하여 가스가 전선관을 통해 다른 구역으로 전파되지 않도록 밀봉한다." },
    { q:"[115회] 한국산업표준(KS C IEC 60079-10-1)에 따른 폭발위험장소 구분 규정을 설명하시오.", a:"인화성 증기·가스의 누출등급(연속등급·1차등급·2차등급)과 환기 정도를 조합하여 0종·1종·2종 장소를 결정하는 절차를 규정한다." },
    { q:"[123회] 방폭형 소방 전기 기기의 Ex d ⅡB T4 표기의 의미를 설명하시오.", a:"Ex d는 내압방폭구조, ⅡB는 폭발등급(가스그룹), T4는 최고표면온도 135℃ 이하를 의미한다." },
    { q:"[126회] 본질안전 방폭구조에서 Zener Barrier 및 Isolated Barrier 방식을 그림으로 설명하시오.", a:"Zener Barrier는 제너다이오드·저항·퓨즈로 구성되어 접지가 필요하고, Isolated Barrier는 변압기·광전소자·릴레이로 구성되어 접지가 불필요하며 신뢰도가 더 높다." }
  ]
};

  notes:[
    { title:"1. TNT당량과 스케일링(3승근) 법칙", blocks:[{ type:"p", text:"TNT당량은 어떤 물질이 폭발할 때 방출하는 폭발에너지를, 동일한 에너지를 방출하는 TNT의 중량으로 환산한 값이다. TNT 1kg이 폭발할 때 약 1,120kJ의 열량이 발생하며, 이를 기준으로 대상 폭발물의 폭발효율(연소효율)을 곱해 TNT당량을 산출한다." }, { type:"p", text:"스케일링법칙(3승근의 법칙)은 환산거리(폭심으로부터의 거리 ÷ TNT당량의 1/3승)가 같으면 폭발물의 양과 무관하게 충격파의 특성값(과압)이 동일하다는 원리이다. 계산 절차는 ①TNT가 아닌 물질의 폭발에너지를 TNT당량으로 환산 ②환산된 TNT당량으로 스케일링(3승근)법칙에 따라 환산거리 산출 ③환산거리-과압 도표를 이용해 과압 추산 ④과압-손상 도표로 폭풍 피해를 추정하는 순서로 진행된다." }, { type:"table", headers:["과압(kPa)", "예상 피해"], rows:[["약 0.3", "유리창 파손"], ["약 1", "가옥 부분 파손"], ["약 4~7", "사람 사망, 가옥 전파"], ["약 10", "빌딩 붕괴"]] }, { type:"p", text:"폭발성 물질의 위력은 산소평형(OB, Oxygen Balance)과도 관련되며, OB가 0(완전연소·완전폭발)에 가까울수록 폭발위력이 최대가 된다. 산소가 부족(OB<0)하거나 남는(OB>0) 경우 위력은 감소한다." }] },
    { title:"2. 국내 위험물 유별 분류(유가반 체계)", blocks:[{ type:"p", text:"국내 위험물안전관리법은 위험물을 성질이 유사한 것끼리 1류~6류로 분류(류별 분류)한다. 각 유별의 성질은 유독성·가연성·반응성(물과의 반응성)의 3가지 축(유가반)으로 요약할 수 있다." }, { type:"table", headers:["유별", "명칭", "유독성", "가연성(자체 연소)", "물과의 반응성", "핵심 취급"], rows:[["1류", "산화성고체", "없음", "없음(조연성)", "무기과산화물은 격렬히 반응(산소 방출)", "점화원 관리, 주수소화 가능(알칼리금속 과산화물 제외)"], ["2류", "가연성고체", "있음", "있음", "철분·마그네슘·금속분은 반응", "점화원 관리, 1류·6류와 혼재금지"], ["3류", "자연발화성·금수성물질", "없음", "자연발화", "물과 반응(격렬)", "공기·수분 차단, 보호액 속 보관"], ["4류", "인화성액체", "있음(특수인화물)", "있음", "대체로 미반응", "증기체류 방지, 접지·방폭 전기설비"], ["5류", "자기반응성물질", "없음", "있음(자체산소 보유)", "대체로 미반응", "점화원 관리, 폭발 방어대책 중요"], ["6류", "산화성액체", "있음", "없음(조연성)", "격렬히 반응", "독성·접촉주의, 밀폐보관"]] }, { type:"p", text:"NFPA 30은 인화성액체(Flammable Liquid, 인화점 100°F=약 37.8℃ 미만)와 가연성액체(Combustible Liquid, 인화점 100°F 이상)로 구분하며, 인화성액체는 다시 Class 1A(인화점<73°F, 비점<100°F), Class 1B(인화점<73°F, 비점≥100°F), Class 1C(73°F≤인화점<100°F)로, 가연성액체는 Class 2(100°F≤인화점<140°F), Class 3A·3B로 세분한다." }] },
    { title:"3. NFPA 704, 특수인화물과 무기/유기과산화물", blocks:[{ type:"p", text:"NFPA 704는 위험물을 유독성(청색)·가연성(적색)·반응성(황색)의 3축으로 0~4등급 표시하며, 백색 칸에는 물반응성(W) 등 특이사항을 기재한다. 예: 불화수소(HF)는 NFPA 704에서 4-0-1로 표시되며(청4-맹독성, 적0-불연성, 황1-물과 약한 반응), 국내 코사(KOSHA) 기준 TLV-TWA는 0.5ppm이다." }, { type:"p", text:"특수인화물(4류 중 최상위 위험군, 예: 디에틸에테르·이황화탄소·아세트알데히드·산화프로필렌)은 인화점 -20℃ 이하, 비점 40℃ 이하로 정의되며, 인화점·비점이 낮을수록 상온에서도 가연성혼합기를 신속히 형성해 연소·폭발 위험이 매우 높다." }, { type:"p", text:"무기과산화물(1류)과 유기과산화물(5류)은 모두 과산화수소(H₂O₂)에서 수소 원자가 금속(무기) 또는 알킬기(유기)로 치환된 구조로, 결합력이 약한 페록시기(-O-O-)를 함유해 불안정하다. 무기과산화물(예: Na₂O₂)은 물·이산화탄소와 반응하여 반응성이 큰 활성산소를 방출하는 조연성 물질로 자체는 연소하지 않으나, 유기과산화물은 알킬기가 자체 가연성을 가져 스스로도 연소하며 페록시기의 산소를 함께 방출해 반응성·연소성이 모두 크다." }, { type:"callout", text:"➡ 위험물 각론은 유가반(유독성·가연성·반응성) 프레임으로 정리하면 시험장에서 빠르게 답안을 구성할 수 있다. TNT당량·산소평형은 완전연소(폭발) 반응식의 몰수 맞추기를 반드시 연습해 둔다." }] }

    { q:"무기과산화물의 페록시기 반응 특성은?", a:"결합력이 약한 페록시기(-O-O-)가 외부 에너지(충격·마찰·가열)에 의해 분해되며 반응성이 큰 활성산소를 방출하는 조연성 역할을 한다." },

    { q:"불화수소(HF)의 NFPA 704 표시와 국내 TLV-TWA는?", a:"NFPA 704는 4-0-1(맹독성-불연성-물과 약한 반응)로 표시되며, 국내 코사(KOSHA) TLV-TWA 기준은 0.5ppm이다." },

    { q:"1류 위험물이 위험물로 분류되는 이유(자체 불연성인데도)는?", a:"자체는 타지 않지만 조연성 물질로서 산소를 공급해 주변 가연물의 연소를 촉진시키기 때문이다." },
    { q:"산소평형(OB) 계산 시 기준 단위는?", a:"완전연소(폭발) 반응식을 세워 몰수를 맞춘 뒤, 분자량 대비 과부족 산소량을 TNT 100g 기준으로 환산한 값(%)으로 표현한다." },

    { title:"1. GHS와 MSDS", blocks:[{ type:"p", text:"GHS(Globally Harmonized System)는 화학물질의 분류와 표지(라벨링)를 세계적으로 공통화한 시스템으로, 물리적 위험성 17가지·건강 유해성 10가지·환경 유해성 2가지로 화학물질을 분류하고, 그림문자(붉은색 테두리의 마름모꼴, 예: 화염-인화성, 해골-독성, 부식성-피부부식)와 문자체계(신호어·유해위험문구)로 표시한다. 표지에는 제품정보·그림문자·신호어·유해위험문구·예방조치문구·공급자정보가 포함되어야 한다." }, { type:"p", text:"MSDS(물질안전보건자료)는 GHS 분류대상 물질에 대해 제조·수입·저장·취급·운송·폐기의 전 과정에서 관계자(근로자 등)에게 유해성 정보를 제공하는 자료로, GHS보다 상세한 정보를 담는다. 제조·판매·양도 시 함께 전달되어야 하며 산업안전보건법상 사업주는 근로자에게 MSDS 교육을 의무적으로 실시해야 한다." }, { type:"p", text:"MSDS는 16개 구분 항목(화학제품과 회사에 관한 정보, 유해성·위험성, 구성성분의 명칭 및 함유량, 응급조치요령, 폭발·화재 시 대처방법, 누출사고 시 대처방법, 취급 및 저장방법, 노출방지 및 개인보호구, 물리화학적 특성, 안정성 및 반응성, 독성에 관한 정보, 환경에 미치는 영향, 폐기 시 주의사항, 운송에 필요한 정보, 법적 규제현황, 그 밖의 참고사항)로 구성된다." }] },
    { title:"2. 급성독성·만성독성 지표(LD50/LC50/TLV/ERPG)", blocks:[{ type:"p", text:"급성독성은 LD50(Lethal Dose 50%, 실험동물 50%를 치사시키는 물질의 양, mg/kg, 경구·경피 투여)과 LC50(Lethal Concentration 50%, 실험동물 50%를 치사시키는 물질의 농도)으로 평가하며, 용량을 증가시키며 사망률을 측정하는 도수-용량반응곡선(dose-response curve)으로 산출한다. 산업안전보건법상 경구 LD50 300mg/kg, 경피 LD50 1,000mg/kg를 위험물질 기준으로 삼는다." }, { type:"table", headers:["지표", "정의", "비고"], rows:[["TLV-TWA", "하루 8시간, 주 40시간 정상근무 시 노출되어도 유해영향이 없는 최고 평균농도", "시간가중평균농도"], ["TLV-STEL", "15분간 단시간 노출되어도 자극·비가역적 조직손상·혼수 등이 나타나지 않는 최고농도(60분 간격, 1일 4회 이내)", "단시간노출허용농도"], ["TLV-C", "단 한 순간도 초과해서는 안 되는 최고허용한계농도", "최고허용농도"]] }, { type:"p", text:"ERPG(Emergency Response Planning Guideline)는 1시간 노출을 기준으로 한 대기 중 최대허용농도 지표로, ERPG-1(경미한 건강영향·악취 없음)·ERPG-2(자기방어행위에 지장을 줄 수 있는 건강영향)·ERPG-3(생명에 지장을 줄 수 있는 영향)의 3단계로 구분한다." }] },
    { title:"3. FED(유효복용분량)", blocks:[{ type:"p", text:"FED(Fractional Effective Dose)는 실험동물을 죽이지 않고, 기존에 측정된 LC50 데이터를 이용해 일정 농도를 일정 시간 흡입한 양의 비(농도×시간의 누적)로 독성을 평가하는 방법이다. FED=1이면 사망에 이르는 수준이며, 일반적으로 FED 0.3 정도에서 무능화(행동불능)가 발생하고 0.8이 사망 직전 한계로 알려져 있다." }, { type:"p", text:"혼합독성가스는 각 성분가스의 FED를 합산해 평가하며, 대표적으로 일산화탄소·이산화탄소·저산소·시안화수소(HCN)·할로겐화수소(HCl·HBr) 등에 대해 측정한다. NFPA 101에서는 유해 판단기준값을 0.8 이상으로 보며, 무능화 노출값은 약 0.3 수준이다. 독성 효과가 나타나는 것은 실제 시간에 따른 f값의 누적합이 1에 도달하는 시점으로 예측하며, 이를 하버의 법칙(Haber's Rule)이라 부른다." }, { type:"callout", text:"➡ TLV-TWA·STEL·C와 ERPG의 정의를 표로 정리하고, FED는 하버의 법칙(농도×시간 누적)이라는 핵심 개념 한 줄로 답안을 시작하면 감점 없이 서술할 수 있다." }] }
  ],
  cards:[
    { q:"GHS의 정의는?", a:"화학물질의 분류와 표지(라벨링)를 세계적으로 공통화한 시스템으로, 물리적 위험성 17가지·건강 유해성 10가지·환경 유해성 2가지로 분류한다." },
    { q:"GHS 표지에 포함되어야 하는 항목은?", a:"제품정보·그림문자·신호어·유해위험문구·예방조치문구·공급자정보이다." },
    { q:"MSDS의 정의와 목적은?", a:"화학물질의 제조부터 폐기까지 전 과정에서 관계자에게 유해성 정보를 제공하는 자료로, 근로자의 알권리 충족과 직업병 예방, 신속한 사고대처가 목적이다." },
    { q:"MSDS 16개 구분 항목 중 앞부분 5가지는?", a:"화학제품과 회사에 관한 정보, 유해성·위험성, 구성성분의 명칭 및 함유량, 응급조치요령, 폭발·화재 시 대처방법이다." },
    { q:"LD50의 정의는?", a:"실험동물의 50%를 치사시킬 수 있는 독성물질의 양(mg/kg)으로, 경구·경피 투여 기준으로 측정한다." },
    { q:"LC50의 정의는?", a:"실험동물의 50%를 치사시킬 수 있는 독성물질의 농도(ppm 등)이다." },
    { q:"LD50·LC50의 평가방법은?", a:"용량(또는 농도)을 점점 증가시키며 사망률을 측정하는 도수-용량반응곡선을 이용해 50% 치사 지점을 산출한다." },
    { q:"산업안전보건법상 경구·경피 LD50 위험물질 기준은?", a:"경구 LD50 300mg/kg, 경피 LD50 1,000mg/kg이다." },
    { q:"TLV-TWA의 정의는?", a:"하루 8시간, 주 40시간 정상근무 시 노출되어도 유해영향을 미치지 않는 최고 평균농도(시간가중평균농도)이다." },
    { q:"TLV-STEL의 정의는?", a:"15분간 단시간 노출되어도 자극·비가역적 손상·혼수상태 등이 나타나지 않는 최고농도로, 60분 간격을 두고 1일 4회 이내로 제한된다." },
    { q:"TLV-C의 정의는?", a:"단 한 순간도 초과해서는 안 되는 최고허용한계농도이다." },
    { q:"ERPG 1·2·3의 구분은?", a:"ERPG-1은 경미한 건강영향·악취 없음, ERPG-2는 자기방어행위에 지장을 줄 수 있는 건강영향, ERPG-3은 생명에 지장을 줄 수 있는 영향을 기준으로 한 1시간 노출 최대허용농도이다." },
    { q:"FED(유효복용분량)의 정의는?", a:"기존에 측정된 LC50 데이터를 이용해 일정 농도를 일정 시간 흡입한 양의 누적비(농도×시간)로 독성을 평가하는 방법이다." },
    { q:"FED가 1에 도달하면 어떤 의미인가?", a:"독성의 효과가 나타나 사망에 이를 수 있는 수준에 도달했음을 의미한다." },
    { q:"무능화(행동불능)와 사망 직전 FED 값은?", a:"무능화는 FED 약 0.3, 사망 직전 한계는 FED 약 0.8 수준으로 본다." },
    { q:"혼합독성가스 FED 평가 시 고려하는 대표 가스는?", a:"일산화탄소·이산화탄소·저산소·시안화수소(HCN)·할로겐화수소(HCl·HBr) 등이다." },
    { q:"NFPA 101의 유해 판단기준값(FED)은?", a:"0.8 이상을 유해로 판단한다." },
    { q:"하버의 법칙(Haber's Rule)의 핵심은?", a:"독성의 효과는 농도와 시간의 곱(누적 f값)이 1에 도달할 때 나타난다는 법칙이다." },
    { q:"불화수소(HF)의 국내 TLV-TWA·TLV-C 기준은?", a:"TLV-TWA는 0.5ppm, TLV-C는 3ppm(2.5mg/m³)이다." },
    { q:"MSDS와 GHS 표지의 관계는?", a:"GHS 표지는 제품 외부에 부착하는 요약된 경고표시이고, MSDS는 그보다 상세한 취급·저장·폐기 전 과정의 정보를 담은 문서로 상호 보완관계다." }
  ]
};

  cards:[
    { q:"[65회] 유해물질의 독성에 노출 시 손상을 입지 않는 농도 표시인 TLV(threshold limit values)를 설명하시오.", a:"TLV는 근로자가 반복 노출되어도 건강상 악영향이 없다고 인정되는 허용농도로, 시간가중평균(TWA)·단시간노출(STEL)·최고허용(C)의 3가지로 세분된다." },
    { q:"[68회] 가스를 1시간 흡입했을 때 실험동물의 반수가 사망하는 가스농도(ppm)를 뜻하는 LC50의 원어는?", a:"Lethal Concentration 50%(치사농도 50%)이다." },
    { q:"[85회] 위험물안전관리법, UN수송규칙 및 GHS의 화학물질 분류 체계를 비교 설명하시오.", a:"위험물안전관리법은 국내 저장·취급 규제를 위한 류별 분류이며, UN수송규칙은 운송 중 위험성에 초점을 둔 클래스 분류, GHS는 국제 공통의 유해성·위험성 분류·표지 체계로 세 체계는 목적과 분류축이 다르다." },
    { q:"[85·109·117·126회] MSDS에 기재되어야 하는 위험 유해성 정보(작성항목)를 설명하시오.", a:"화학제품 정보, 유해성·위험성, 구성성분, 응급조치, 폭발화재 대처, 누출사고 대처, 취급·저장방법, 노출방지·개인보호구, 물리화학적 특성, 안정성·반응성, 독성정보, 환경영향, 폐기·운송·법적규제·기타 등 16개 항목이다." },
    { q:"[90회] 화학공장 화재폭발 시 독성물질 누출·확산피해를 예측하는 화학 물질폭로영향지수(CEI)와 ERPG를 설명하시오.", a:"CEI(Chemical Exposure Index)는 누출량·거리를 반영한 지수로 위험도를 정량화하며, ERPG는 1시간 노출 기준 최대허용농도(1·2·3단계)로 피해범위를 산정하는 데 활용된다." },
    { q:"[92회] 산업안전기준에 규정된 독성물질 구분기준항목 LD50(경구,쥐)/LD50(경피,토끼 또는 쥐)/LC50(쥐,4시간 흡입) 기준을 설명하시오.", a:"경구 LD50 300mg/kg 이하, 경피 LD50 1,000mg/kg 이하, 4시간 흡입 LC50 2,500ppm 이하이면 독성물질로 구분한다." },
    { q:"[94·111·133회] GHS(세계조화시스템)의 화학물질 유해·위험성 분류와 경고표시 기재사항을 설명하시오.", a:"물리적 위험성 17종·건강 유해성 10종·환경 유해성 2종으로 분류하며, 경고표시에는 그림문자·신호어·유해위험문구·예방조치문구·제품/공급자정보가 포함된다." },
    { q:"[99·103회] TLV(허용한계농도) 및 TLV-TWA·TLV-STEL·TLV-C를 설명하시오.", a:"TLV-TWA는 하루 8시간 정상근무 시 유해영향이 없는 평균농도, TLV-STEL은 15분 단시간(1일 4회, 60분 간격) 노출 허용농도, TLV-C는 한순간도 초과해선 안 되는 최고농도이다." },
    { q:"[101·117·126회] 물질안전 보건제도(MSDS)의 필요성과 구성항목, 확인사항을 설명하시오.", a:"화학물질 급증·안전의식 증대·산업재해 예방을 위해 필요하며, 16개 구성항목을 통해 근로자가 취급 물질의 위험성을 사전에 인지하도록 한다." },

    { q:"[92회] 다중이용업소 안전관리에 관한 특별법에서 정하는 화재위험성평가의 정의, 권한자, 대상을 설명하시오.", a:"화재위험성평가는 다중이용업소의 화재위험 요인을 조사·분석·평가하는 것으로 소방청장·소방본부장·소방서장이 권한을 가지며, 대통령령으로 정하는 다중이용업소 밀집지역 등이 대상이다." },
    { q:"[96회] 위험성평가기법의 종류와 특징을 설명하시오.", a:"정성적 기법(체크리스트·What-If·HAZOP)은 전문가 토의 기반으로 신속하나 주관적이며, 정량적 기법(FTA·ETA·CA)은 확률·결과로 객관화되나 시간과 전문성이 많이 필요하다." },
    { q:"[105회] 건축물의 화재위험성평가 중 FREM(Fire Risk Evaluation Method)을 설명하시오.", a:"영국에서 시작된 건축물 화재위험도 평가법으로, 화재위험(잠재·활성)과 방어대책(기본·특별·내화)의 비를 통해 위험등급을 산정하며 보험료 산정 등에 활용된다." },
    { q:"[116회] 도로터널에 화재위험성평가를 적용하는 경우 이벤트트리(ETA)와 F-N곡선을 설명하시오.", a:"초기 화재사건에서 배연·피난·소화설비 작동 성공/실패를 분기해 최종 사상자수 확률을 산출(ETA)하고, 이를 빈도-사상자수 관계인 F-N곡선으로 표현해 위험도 허용여부를 판단한다." },
    { q:"[119회] 화학공장의 위험성평가 목적과 정성적 평가와 정량적 평가 방법을 설명하시오.", a:"목적은 잠재위험 사전 파악과 손실 예방이며, 정성적 평가는 체크리스트·HAZOP 등 확률·결과 미산정 방식, 정량적 평가는 FTA·ETA·CA 등 확률·결과 산정 방식이다." },
    { q:"[122회] 스프링클러·자동알람 시스템으로 보호되는 빌딩의 화재진압 실패확률을 결함수분석으로 계산하시오.", a:"스프링클러 작동실패확률과 알람시스템 작동실패확률을 각 요소의 고장확률로 산정한 후, 논리기호(AND/OR)에 따라 곱하거나 더해 전체 화재진압 실패확률을 산출한다." },
    { q:"[123·126회] 사업장 위험성평가에 관한 지침에 따른 위험성평가방법 및 절차(5단계)를 설명하시오.", a:"①사전준비 ②유해위험요인 파악 ③위험성 추정 ④위험성 결정 ⑤위험성 감소대책 수립·실행의 5단계로 진행된다." },
    { q:"[137회] 위험성평가 방법 중 빈도·강도법, 체크리스트법, 위험성 수준 3단계 판단법을 설명하시오.", a:"빈도·강도법은 발생가능성과 중대성을 곱해 위험성을 산정하고, 체크리스트법은 사전에 정한 항목별 준수 여부를 점검하며, 3단계 판단법은 허용불가/조건부허용/허용가능으로 위험성을 구분한다." },
    { q:"[138회] 산소평형(Oxygen Balance)을 설명하고 TNT의 산소평형을 구하시오.", a:"산소평형은 완전연소 시 산소의 과부족을 분자량 대비 백분율로 나타낸 값이며, TNT(C₇H₅N₃O₆)는 완전연소식의 몰수를 맞춰 계산 시 산소가 부족한 음(-)의 값을 갖는다." }
  ]
};

  notes:[
    { title:"1. 위험 표현 방법과 LOPA", blocks:[{ type:"table", headers:["표현방법", "축", "장점", "단점"], rows:[["위험도매트릭스(Risk Matrix)", "빈도×가혹도(결과크기)", "물적 피해 표현에 유리", "인적 피해 표현에 불리"], ["FN커브(F-N Curve)", "빈도(F)×사상자수(N)", "인적 피해 표현에 유리, 사회적 허용범위(ALARP존) 설정 가능", "물적 피해 표현에 불리"], ["위험등고선", "위험발생지점으로부터의 거리별 위험도", "특정 장소별 위험 정도 파악, 대피·방어대책 수립에 유리", "정량적 비교가 상대적으로 어려움"]] }, { type:"p", text:"FN커브는 무시가능(Negligible)·허용가능(ALARP, As Low As Reasonably Practicable)·허용불가(Unacceptable)의 3개 영역으로 위험도를 구분하며, 원전 사고의 위험은 연간 약 10⁻⁶ 수준으로 알려져 있다." }, { type:"p", text:"LOPA(Layer Of Protection Analysis, 독립방호계층분석)는 반정량적 위험성평가 기법으로, 센서-로직솔버-최종제어요소로 구성된 안전제어시스템(SCS)의 각 구성요소인 독립방호계층(IPL)의 작동실패확률(PFD)만을 찾아 분석하며, 결과(피해크기)는 평가하지 않는다. PFD는 총 작동요구횟수분의 작동실패횟수로 정의되며, 시스템의 안전도(SIL, Safety Integrity Level)는 PFD의 음의 로그값(-log PFD)으로 산출된다(예: PFD=0.01이면 SIL 2등급)." }, { type:"table", headers:["SIL 등급", "작동실패확률(PFD) 범위", "적용 예"], rows:[["SIL 1", "10⁻¹ ~ 10⁻²(10회~100회 중 1회)", "일반 산업설비"], ["SIL 2", "10⁻² ~ 10⁻³(100회~1,000회 중 1회)", "산업 공정설비"], ["SIL 3", "10⁻³ ~ 10⁻⁴(1,000회~10,000회 중 1회)", "일반 산업계 최고 안전등급"], ["SIL 4", "10⁻⁴ ~ 10⁻⁵(10,000회~100,000회 중 1회)", "원자력발전소·항공기 등 중요기기"]] }] },
    { title:"2. HAZOP·FRAME·휴먼에러", blocks:[{ type:"p", text:"HAZOP(Hazard and Operability Study, 하잡)은 전체 공정을 노드(단위공정)로 분할한 뒤, 각 노드에 공정변수(유량·압력·온도·조성 등)와 가이드워드(No, More, Less, Reverse, As well as 등)를 조합 적용해 공정상의 위험요소와 운전상의 문제점을 도출하는 정성적 위험성평가 기법이다. 장점은 공정의 위험요소와 운전 문제점을 체계적으로 도출해 객관화된 보고서를 만들 수 있다는 것이며, 단점은 다분야 전문가가 모여 토의해야 하므로 시간이 많이 소요되고 비판적 토론으로 매너리즘에 빠질 수 있다는 것이다." }, { type:"p", text:"FRAME(FRM, Fire Risk Evaluation Method)은 건축물의 화재위험(방화)과 방어대책(기네틱특말: 기본대책·특별대책·내화(구조적)대책)의 비로 위험도 등급(보통위험~매우높은위험)을 산정하는 위험성평가로, 유럽 보험업계에서 화재보험료 산정 목적으로 시작되었다. 화재위험은 잠재위험(화재하중·연소속도 등)과 활성위험(점화원 존재·건물 복잡성 등)으로 구성되고, 방어대책은 기본대책(소화기·소화전·교육)·특별대책(자동화재탐지·자동식소화설비)·내화대책(방화구획·건물 내화도)으로 구성된다." }, { type:"p", text:"휴먼에러는 생략에러·순서에러·시간에러·과잉행동에러 등으로 구분되며, 개인특성·교육훈련·작업환경·설계상 문제가 원인이 된다. 방지대책은 3E(Engineering-공학적 대책, 예: 주유구 형상을 다르게 설계, Education-교육, Enforcement-법적 규제)로 요약되며, 환경(Environment)을 더해 4E로 확장하기도 한다." }] },
    { title:"3. 안전거리와 방화상 유효한 담", blocks:[{ type:"p", text:"산업안전보건법상 안전거리는 한 공장(사업장) 내 위험물 장소·물질 간의 이격거리(온사이트)를 의미하며, 예를 들어 플레어스택-단위공정 10m, 위험물저장탱크-단위공정 20m 등으로 규정된다. 위험물안전관리법상 안전거리는 위험물 제조소등과 주변 다른 건축물·시설(오프사이트) 사이의 거리로, 문화재 50m, 학교·병원 등 30m, 고압가스·도시가스시설 20m, 주거용 건축물 10m, 특고압선(7,000~35,000V) 5m, 사용전압 35,000V 초과 3m 이상을 확보해야 한다." }, { type:"table", headers:["대상", "안전거리(기본)", "방화상 유효한 담 설치 시 단축(지정수량 10배 미만)"], rows:[["주거용 건축물", "10m 이상", "6.5m 이상"], ["학교·병원 등", "30m 이상", "20m 이상"], ["문화재", "50m 이상", "35m 이상"]] }, { type:"p", text:"방화상 유효한 담의 높이(h)는 건물높이(H)·거리(D, d)·계수(p)를 이용해 산정하며, 건물의 내화성능이 높을수록(목조<방화구조<내화구조, 개구부에 갑종방화문 설치 시) 계수 p가 작아져 담의 높이가 낮아도 되거나 담 설치를 생략할 수 있다(내화구조+갑종방화문이면 무한대, 즉 담 불필요). 계산된 담 높이가 2m 미만이면 2m로, 4m 이상이면 4m로 하되 초과분은 소화설비를 보강(대형소화기 증설 등)한다." }, { type:"callout", text:"➡ LOPA의 PFD·SIL 계산공식(SIL=-log PFD)은 숫자 예시(100번 중 1번 실패→SIL2)로 암기하고, 안전거리는 '단풀위사장'(단위공정 상호간), '문병가주고고특(5321·53)'(제조소-외부시설) 두 숫자 세트를 구분해 암기한다." }] }

    { title:"3. 소화의 제어와 진압, 스프링클러·가스계소화", blocks:[{ type:"p", text:"제어(Control)는 수손피해를 최소화하면서 적정량의 물을 방사해 화재의 확산속도를 늦추는 것이고, 진압(Suppression)은 수손피해를 감수하더라도 다량의 물을 일시에 방사해 화재를 신속히 진화하는 것이다. 어느 쪽을 선택할지는 가연물의 연소속도·화재하중이 결정한다." }, { type:"table", headers:["설비", "소화 메커니즘", "특징"], rows:[["표준형 스프링클러(제어형)", "표면냉각(냉각소화)", "물방울이 화염을 뚫고 침투해 가연물 표면을 인화점 이하로 냉각 — 재발화 우려가 거의 없음. 기준개수(10~30개) 이내 헤드 개방으로 진화되도록 설계"], ["ESFR(조기진압형, 진압형)", "표면냉각 극대화", "큰 물방울로 연소속도보다 빠르게 다량 방사해 조기에 진압(Early Suppression Fast Response) — 수손피해를 감수"], ["물분무·미분무", "기상냉각+질식(수증기 팽창에 의한 산소 희석)", "물방울을 작게 만들어 순간기화량을 늘림 — 표면 침투·냉각효과는 감소하지만 질식효과가 커져 유류·전기·K급·D급 등 물 직접 방사가 곤란한 장소에 적용"]] }, { type:"p", text:"가스계소화설비는 기체 약제이므로 가연물 표면을 뚫고 침투하지 못해 냉각효과가 낮고 재발화 우려가 있다. 따라서 방호구역을 전역방출·밀폐시켜 설계농도를 일정 시간 유지함으로써 완전한 소화(재발화가 일어나지 않는 상태)를 달성해야 하며, 이때 필요한 시간을 설계농도유지시간(Soaking Time)이라 한다." }] }
  ],
  cards:[
    { q:"원자력발전소 심층방호(Defense-in-Depth)의 정의는?", a:"화재 예방·조기감지·조기소화뿐 아니라 방사성 물질의 외부 유출 방지(영향 최소화)를 목표로, 물리적 다중방벽과 다단계 방어체계를 결합한 방호개념이다." },

    { q:"후쿠시마 원전사고의 근본 원인은?", a:"지진으로 냉각수 공급펌프가 고장나 원자로 안전정지(핵분열 차단·잔열 제거)에 실패, 노심이 용융되고 격납용기가 파손되어 방사능이 외부로 유출되었다." },
    { q:"원전 화재안전성 평가의 3요소는?", a:"화재위험도분석(FHA), 안전정지분석(SSA), 확률론적안전성분석(PSA)이다." },

    { q:"표준형 스프링클러의 소화 메커니즘은?", a:"물방울이 화염을 뚫고 침투해 가연물 표면을 인화점 이하로 냉각시키는 표면냉각(냉각소화)이며, 재발화 우려가 거의 없다." },
    { q:"ESFR(조기진압형 스프링클러)의 특징은?", a:"Early Suppression Fast Response의 약자로, 큰 물방울을 이용해 화재의 연소속도보다 빠르게 다량 방사하여 조기 진압을 목표로 하며 수손피해를 감수한다." },

    { q:"물분무·미분무는 표준형 스프링클러 대비 냉각효과가 어떻게 달라지는가?", a:"물방울이 작아질수록 표면 침투력이 약해져 표면냉각(냉각소화) 효과는 감소하지만, 기상냉각과 질식효과는 커진다." },
