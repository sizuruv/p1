<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="소방기술사 복습">
<title>소방기술사 기출 복습</title>
<script src="../shell.js"></script>
<style>
:root{
  --bg:#15181a;
  --surface:#1d2225;
  --surface-2:#262c2f;
  --ink:#eceeec;
  --ink-soft:#9aa39d;
  --border:#333a3d;
  --ember:#e2793f;
  --ember-ink:#1a1008;
  --ember-soft:#3a2416;
  --smoke:#8fa4ac;
  --focus:#e2793f;
  --correct:#5cb87d;
  --correct-soft:#173423;
  --wrong:#e08683;
  --wrong-soft:#3a1e1e;
  --tag-gong:#8fb1d8;
  --tag-gong-soft:#22303e;
  --tag-gisa:#7fc4ae;
  --tag-gisa-soft:#1c332c;
  --tag-gwal:#cd97c4;
  --tag-gwal-soft:#33222f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -10px rgba(0,0,0,.5);
  --radius:14px;
  --font-ui:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-num:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#15181a;--surface:#1d2225;--surface-2:#262c2f;--ink:#eceeec;--ink-soft:#9aa39d;
  --border:#333a3d;--ember:#e2793f;--ember-ink:#1a1008;--ember-soft:#3a2416;--smoke:#8fa4ac;--focus:#e2793f;
  --correct:#5cb87d;--correct-soft:#173423;--wrong:#e08683;--wrong-soft:#3a1e1e;
  --tag-gong:#8fb1d8;--tag-gong-soft:#22303e;--tag-gisa:#7fc4ae;--tag-gisa-soft:#1c332c;--tag-gwal:#cd97c4;--tag-gwal-soft:#33222f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -10px rgba(0,0,0,.5);
}
:root[data-theme="light"]{
  --bg:#eef0ec;--surface:#ffffff;--surface-2:#e3e7e1;--ink:#1b201d;--ink-soft:#5b655e;
  --border:#d4d9d0;--ember:#bd431c;--ember-ink:#ffffff;--ember-soft:#f6ded2;--smoke:#3f5a63;--focus:#bd431c;
  --correct:#2e7a49;--correct-soft:#dcefe1;--wrong:#ab3535;--wrong-soft:#f6dcdc;
  --tag-gong:#4d6f97;--tag-gong-soft:#dde6f0;--tag-gisa:#3f8574;--tag-gisa-soft:#dcede8;--tag-gwal:#8a4f80;--tag-gwal-soft:#eeddec;
  --shadow:0 1px 2px rgba(20,20,15,.06),0 6px 20px -8px rgba(20,20,15,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;
  /* Without this, iOS holds every fresh tap/pencil-down for ~300-1000ms to
     see if a second tap follows (double-tap-to-zoom disambiguation) — that
     shows up as "the pencil doesn't draw for a second" on every new stroke. */
  touch-action:manipulation;
}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
}
button,input,select{font-family:inherit;color:inherit;}
h1,h2,h3,p{margin:0;text-wrap:balance;}
.app{
  display:flex;
  min-height:100vh;
  width:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
/* A resting palm while writing with Apple Pencil can land on ordinary text
   nearby; without this, iOS reads that incidental touch as a text-selection
   drag and throws up a selection block on whatever it landed on. Inputs
   still need normal text selection so re-enable it there explicitly. */
.app input,.app textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;}
/* ---- Nav ---- */
.nav{
  display:flex;
  flex-direction:column;
  gap:2px;
  width:220px;
  flex:none;
  padding:20px 12px;
  border-right:1px solid var(--border);
  background:var(--surface);
  overflow:hidden;
  white-space:nowrap;
  transition:width .22s ease, padding .22s ease, opacity .18s ease;
}
body.nav-collapsed .nav{
  width:0;
  padding-left:0;
  padding-right:0;
  border-right:none;
  opacity:0;
  pointer-events:none;
}
.nav-collapse-btn{
  flex:none;margin-left:auto;border:none;background:none;color:var(--ink-soft);
  cursor:pointer;padding:6px;border-radius:8px;display:flex;
}
.nav-collapse-btn:hover{background:var(--surface-2);color:var(--ink);}
.nav-collapse-btn svg{width:17px;height:17px;}
.nav-expand-btn{
  position:fixed;top:18px;left:14px;z-index:30;
  border:1px solid var(--border);background:var(--surface);color:var(--ink-soft);
  border-radius:10px;padding:9px;display:none;align-items:center;justify-content:center;
  box-shadow:var(--shadow);cursor:pointer;
}
.nav-expand-btn svg{width:17px;height:17px;display:block;}
body.nav-collapsed .nav-expand-btn{display:flex;}
body.nav-collapsed .main{padding-top:64px;}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 10px 22px;
}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(155deg,var(--ember),#8a2f10);
  display:flex;align-items:center;justify-content:center;
  color:#fff;flex:none;
}
.brand-text{font-weight:700;font-size:.92rem;line-height:1.25;}
.brand-text small{display:block;font-weight:500;font-size:.72rem;color:var(--ink-soft);}
.nav-btn{
  display:flex;align-items:center;gap:12px;
  padding:11px 12px;
  border:none;background:none;border-radius:10px;
  color:var(--ink-soft);font-size:.92rem;font-weight:600;
  cursor:pointer;text-align:left;width:100%;
}
.nav-btn svg{width:19px;height:19px;flex:none;}
.nav-btn:hover{background:var(--surface-2);color:var(--ink);}
.nav-btn.active{background:var(--ember-soft);color:var(--ember);}
.nav-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.nav-spacer{flex:1;}
.nav-count{
  margin-left:auto;font-size:.72rem;font-weight:700;
  background:var(--surface-2);color:var(--ink-soft);
  border-radius:999px;padding:2px 7px;
  font-variant-numeric:tabular-nums;
}
.nav-btn.active .nav-count{background:var(--ember);color:var(--ember-ink);}

/* ---- Main ---- */
.main{
  flex:1;
  min-width:0;
  padding:28px 32px 90px;
  max-width:1180px;
}
.view-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;margin-bottom:20px;flex-wrap:wrap;
}
.view-head h1{font-size:1.5rem;font-weight:800;letter-spacing:-.01em;}
.view-head p{color:var(--ink-soft);font-size:.88rem;margin-top:4px;}

/* ---- Cards / shared ---- */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.pad-lg{padding:22px;}
.pad-md{padding:16px 18px;}

.stat-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;
}
.stat-card{padding:16px 18px;}
.stat-card .num{font-family:var(--font-num);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.stat-card .label{font-size:.78rem;color:var(--ink-soft);font-weight:600;margin-top:2px;}
.stat-card.accent .num{color:var(--ember);}
.stat-card.good .num{color:var(--correct);}
.stat-card.bad .num{color:var(--wrong);}

.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px;}
.btn{
  appearance:none;border:1px solid var(--border);background:var(--surface);
  color:var(--ink);font-weight:700;font-size:.88rem;
  padding:12px 18px;border-radius:11px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;
}
.btn:hover{background:var(--surface-2);}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.btn:disabled{opacity:.42;cursor:not-allowed;}
.btn-primary{background:var(--ember);border-color:var(--ember);color:var(--ember-ink);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink);}
.btn-sm{padding:7px 12px;font-size:.8rem;border-radius:9px;}
.btn-danger{color:var(--wrong);}

.section-title{font-size:1rem;font-weight:800;margin:30px 0 12px;}
.chapter-title{
  font-size:.72rem;font-weight:800;letter-spacing:.03em;color:var(--ember);
  text-transform:uppercase;margin:26px 0 10px;padding-bottom:6px;
  border-bottom:1px solid var(--border);
}
.chapter-title:first-child{margin-top:0;}
.section-title:first-child{margin-top:0;}

.cat-row{
  display:flex;align-items:center;gap:14px;padding:14px 16px;
  border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--surface);
}
.cat-tag{
  flex:none;width:78px;text-align:center;font-size:.78rem;font-weight:800;
  padding:5px 0;border-radius:8px;
}
.cat-tag.gongmuwon{background:var(--tag-gong-soft);color:var(--tag-gong);}
.cat-tag.gisa{background:var(--tag-gisa-soft);color:var(--tag-gisa);}
.cat-tag.gwallisa{background:var(--tag-gwal-soft);color:var(--tag-gwal);}
.cat-row .cat-name{font-weight:700;font-size:.9rem;min-width:150px;}
.cat-row .bar-wrap{flex:1;}
.cat-row .cat-pct{
  flex:none;width:52px;text-align:right;font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums;
}

.unit-row{
  display:flex;align-items:center;gap:14px;padding:13px 14px;width:100%;
  border:1px solid var(--border);border-radius:12px;margin-bottom:9px;background:var(--surface);
  cursor:pointer;text-align:left;font-family:inherit;
}
.unit-row:hover{border-color:var(--ember);background:var(--ember-soft);}
.unit-badge{
  flex:none;width:46px;text-align:center;font-size:.74rem;font-weight:800;
  padding:5px 0;border-radius:8px;background:var(--surface-2);color:var(--ink-soft);
  font-family:var(--font-num);font-variant-numeric:tabular-nums;
}
.unit-name{font-weight:700;font-size:.88rem;min-width:0;flex:1 1 150px;}
.unit-sub{font-weight:500;color:var(--ink-soft);font-size:.76rem;margin-top:2px;}
.unit-row .cat-pct{flex:none;width:44px;text-align:right;font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums;}
.unit-arrow{flex:none;width:16px;height:16px;color:var(--ink-soft);}
.unit-active-chip{
  display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:700;
  background:var(--ember-soft);color:var(--ember);border:1px solid var(--ember);
  border-radius:999px;padding:5px 6px 5px 12px;flex:none;
}
.unit-active-chip button{
  border:none;background:var(--ember);color:var(--ember-ink);border-radius:50%;
  width:16px;height:16px;font-size:.62rem;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

.bar-track{
  height:9px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex;
  border:1px solid var(--border);
}
.bar-seg{height:100%;}
.bar-seg.correct{background:var(--correct);}
.bar-seg.wrong{background:var(--wrong);}
.bar-legend{display:flex;gap:16px;margin-top:10px;font-size:.78rem;color:var(--ink-soft);flex-wrap:wrap;}
.bar-legend span{display:inline-flex;align-items:center;gap:6px;}
.dot{width:9px;height:9px;border-radius:50%;flex:none;}
.dot.correct{background:var(--correct);}
.dot.wrong{background:var(--wrong);}
.dot.unseen{background:var(--surface-2);border:1px solid var(--border);}

.tip-box{
  border:1px dashed var(--border);border-radius:12px;padding:14px 16px;
  color:var(--ink-soft);font-size:.83rem;line-height:1.6;background:var(--surface-2);
}

/* ---- Filter bar ---- */
.nav-search{
  display:flex;align-items:center;gap:6px;
  border:1px solid var(--border);border-radius:8px;
  padding:7px 9px;background:var(--surface-2);
  margin:0 10px 14px;
}
.nav-search svg{width:13px;height:13px;color:var(--ink-soft);flex:none;}
.nav-search input{
  flex:1;border:none;background:none;font-size:.8rem;font-weight:600;
  color:var(--ink);outline:none;min-width:0;
}
.nav-search input::placeholder{color:var(--ink-soft);font-weight:500;}
.nav-search input::-webkit-search-cancel-button{display:none;}
.search-clear{
  flex:none;border:none;background:var(--surface);color:var(--ink-soft);
  cursor:pointer;font-size:.65rem;font-weight:700;border-radius:999px;
  width:16px;height:16px;align-items:center;justify-content:center;
  border:1px solid var(--border);
  display:none;
}
.search-clear.show{display:flex;}
.filter-summary{
  flex:none;font-size:.8rem;font-weight:700;color:var(--ink-soft);
  display:flex;align-items:center;gap:6px;cursor:pointer;position:relative;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;
}
.filter-summary:hover{background:var(--surface-2);}
.filter-summary svg{width:14px;height:14px;}
.filter-dot{width:6px;height:6px;border-radius:50%;background:var(--ember);flex:none;}
.filter-panel{
  display:none;flex-wrap:wrap;gap:18px;width:100%;
  padding:14px 16px;margin-bottom:16px;
  border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);
}
.filter-panel.open{display:flex;}
.filter-group{display:flex;flex-direction:column;gap:8px;}
.filter-group .fg-label{font-size:.72rem;font-weight:800;color:var(--ink-soft);letter-spacing:.02em;}
.chip-set{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  border:1px solid var(--border);background:var(--surface);border-radius:999px;
  padding:6px 12px;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--ink-soft);
}
.chip.on{background:var(--ember-soft);border-color:var(--ember);color:var(--ember);}
.filter-panel select{
  border:1px solid var(--border);background:var(--surface);border-radius:9px;
  padding:7px 10px;font-size:.82rem;font-weight:600;
}

/* ---- Study layout ---- */
/* Deliberately NOT locked to 100dvh/viewport height: some containers this
   runs inside (OneDrive's in-app viewer, etc.) add their own toolbars and
   misreport the real visible height, which clipped the bottom of the card.
   The page just scrolls normally instead — never clips, in any host. */
.study-grid{display:grid;grid-template-columns:1fr;gap:18px;}
.study-grid.single{max-width:640px;}
.progress-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.progress-row .ptext{font-family:var(--font-num);font-size:.82rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:none;}
.progress-row .ptrack{flex:1;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;}
.progress-row .pfill{height:100%;background:var(--ember);}

.qcard{padding:22px;}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.qmeta .cat-tag{width:auto;padding:4px 10px;}
.qmeta .round{font-family:var(--font-num);font-size:.78rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.qmeta .qnum{font-family:var(--font-num);font-size:.78rem;color:var(--ink-soft);}
.qmeta .flag-btn{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:4px;}
.qmeta .flag-btn svg{width:18px;height:18px;}
.qmeta .flag-btn.on{color:var(--ember);}

.qtext{font-size:1.08rem;line-height:1.65;font-weight:600;margin-bottom:16px;}
.warn-box{
  background:var(--wrong-soft);color:var(--wrong);border-radius:10px;padding:10px 12px;
  font-size:.8rem;font-weight:600;margin-bottom:16px;line-height:1.5;
}

.choices{display:flex;flex-direction:column;gap:9px;}
.choice{
  display:flex;align-items:flex-start;gap:11px;
  border:1.5px solid var(--border);border-radius:11px;
  padding:12px 14px;cursor:pointer;background:var(--surface);
  font-size:.94rem;line-height:1.5;text-align:left;width:100%;
}
.choice:hover{border-color:var(--ink-soft);}
.choice:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.choice .cnum{
  flex:none;width:23px;height:23px;border-radius:50%;
  background:var(--surface-2);color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;
  font-size:.78rem;font-weight:800;margin-top:1px;
}
.choice.picked{border-color:var(--ink-soft);}
.choice.is-correct{border-color:var(--correct);background:var(--correct-soft);}
.choice.is-correct .cnum{background:var(--correct);color:#fff;}
.choice.is-wrong{border-color:var(--wrong);background:var(--wrong-soft);}
.choice.is-wrong .cnum{background:var(--wrong);color:#fff;}
.choice.disabled{cursor:default;}
.choice.dim{opacity:.55;}

.result-row{
  display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:16px;
  border-top:1px solid var(--border);flex-wrap:wrap;
}
.result-badge{font-weight:800;font-size:.88rem;display:flex;align-items:center;gap:6px;}
.result-badge.ok{color:var(--correct);}
.result-badge.no{color:var(--wrong);}
.result-row .spacer{flex:1;}

.nav-buttons{display:flex;gap:10px;margin-top:18px;}
.nav-buttons .btn{flex:1;justify-content:center;}

/* ---- Scratchpad (memo pad, lives outside #main so it survives re-renders) ---- */
#padPanel{
  display:none;flex-direction:column;
  flex:1;min-width:320px;margin:28px 32px 28px 0;
  position:sticky;top:28px;
  height:calc(100vh - 56px);overflow:hidden;
}
body.has-pad #padPanel{display:flex;}
body.has-pad .main{flex:0 1 660px;padding-right:16px;}
.pad-panel{padding:0;overflow:hidden;}
.pad-head{
  display:flex;align-items:center;gap:8px;padding:12px 14px;
  border-bottom:1px solid var(--border);-webkit-user-select:none;user-select:none;
}
.pad-head h3{font-size:.84rem;font-weight:800;}
.pad-head .spacer{flex:1;}
.pad-tool{
  border:1px solid var(--border);background:var(--surface);border-radius:8px;
  padding:5px 9px;font-size:.76rem;font-weight:700;color:var(--ink-soft);cursor:pointer;
}
.pad-tool.on{color:var(--ember);border-color:var(--ember);background:var(--ember-soft);}
.pad-canvas-wrap{
  position:relative;flex:1;min-height:220px;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  background:repeating-linear-gradient(var(--surface) 0 27px, var(--surface-2) 27px 28px);
}
.pad-canvas-wrap.expanded{min-height:58vh;}
.pad-canvas-wrap canvas{
  position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.pad-placeholder{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);font-size:.82rem;text-align:center;padding:20px;pointer-events:none;line-height:1.6;
}

/* ---- Stats view ---- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;}
table{width:100%;border-collapse:collapse;font-size:.85rem;min-width:560px;}
thead th{
  text-align:left;padding:10px 14px;font-size:.72rem;font-weight:800;color:var(--ink-soft);
  border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;
}
tbody td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
td.num,th.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;}
.weak-chip{
  display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);
  border-radius:10px;padding:8px 12px;margin:0 8px 8px 0;font-size:.8rem;background:var(--surface);
}
.weak-chip b{font-family:var(--font-num);color:var(--wrong);}
.history-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.hist-dot{
  width:15px;height:15px;border-radius:5px;flex:none;
}
.hist-dot.correct{background:var(--correct);}
.hist-dot.wrong{background:var(--wrong);}
.empty-note{color:var(--ink-soft);font-size:.86rem;padding:18px;text-align:center;}

/* ---- Settings ---- */
.settings-row{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.settings-row:last-child{border-bottom:none;}
.settings-row .st-label{font-weight:700;font-size:.9rem;}
.settings-row .st-desc{font-size:.8rem;color:var(--ink-soft);margin-top:3px;max-width:46ch;}

/* ---- Bottom nav (mobile) ---- */
@media (max-width:860px){
  .app{flex-direction:column;}
  .nav{
    position:fixed;bottom:0;left:0;right:0;width:auto;flex-direction:row;
    border-right:none;border-top:1px solid var(--border);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));

 소방학개론","catShort":"공무원","round":"2020-06-20","num":11,"q":"폭발에 대한 설명으로 옳지 않은 것은?","c":["증기폭발은 폭발물질의 물리적 상태에 따른 분류 중 기상폭발에 해당한다.","폭굉은 연소반응으로 발생한 화염의 전파 속도가 음속보다 빠른 것을 말한다.","블레비(BLEVE)는 액화가스저장탱크 등에서 외부열원에 의해 과열되어 급격한 압력 상승의 원인으로 파열되는 현상이며, 폭발의 분류 중 물리적 폭발에 해당한다.","폭발은 물리적, 화학적 변화의 결과로 발생된 급격한 압력 상승에 의한 에너지가 외계로 전환되는 과정에서 파열, 폭음 등을 동반하는 현상을 말한다."],"a":1,"inc":false,"unit":"1-20"},{"id":"gongmuwon-2020-06-20-15","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2020-06-20","num":15,"q":"고발포인 제2종 기계포의 팽창비에 해당하는 것은?","c":["10배 이상 20배 이하","100배 이상 200배 이하","300배 이상 400배 이하","500배 이상 600배 이하"],"a":3,"inc":false,"unit":"5-2"},{"id":"gongmuwon-2020-06-20-16","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2020-06-20","num":16,"q":"바닥 면적이 200 m2인 구획된 창고에 의류 1,000 ㎏, 고무 2,000 ㎏이 적재되어 있을 때 화재하중은 약 몇 ㎏/m2인가? (단, 의류, 고무, 목재의 단위 발열량은 각각 5,000 ㎉/㎏, 9,000 ㎉/㎏, 4,500 ㎉/㎏이고, 창고 내 의류 및 고무 외의 기타 가연물은 존재하지 않으며, 화재 시 완전연소로 가정한다.)","c":["15.56","20.56","25.56","30.56"],"a":3,"inc":false,"unit":"1-12"},{"id":"gongmuwon-2020-06-20-17","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2020-06-20","num":17,"q":"화재가혹도에 관한 설명으로 옳지 않은 것은?","c":["화재가혹도란 화재발생으로 당해 건물과 내부 수용재산 등을 파괴하거나 손상을 입히는 정도를 말한다.","최고온도는 화재가혹도의 질적 개념으로 화재강도와 관련이 있다.","지속시간은 화재가혹도의 양적 개념으로 화재하중과 관련이 있다.","화재가혹도에 영향을 미치는 환기요소는 개구부 면적의 제곱근에 비례하고 개구부 높이에 비례한다."],"a":4,"inc":false,"unit":"1-12"},{"id":"gongmuwon-2020-06-20-19","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2020-06-20","num":19,"q":"연소에 대한 설명으로 옳지 않은 것은?","c":["액체가연물의 인화점은 액면에서 증발된 증기의 농도가 연소하한계에 도달하여 점화되는 최저온도이다.","연소하한계가 낮고 연소범위가 넓을수록 가연성 가스의 연소위험성이 증가한다.","액체가연물의 연소점은 점화된 이후 점화원을 제거하여도 자발적으로 연소가 지속되는 최저온도이다.","파라핀계 탄화수소화합물의 경우 탄소수가 적을수록 발화점이 낮아진다."],"a":4,"inc":false,"unit":"1-1"},{"id":"gongmuwon-2021-04-03-3","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2021-04-03","num":3,"q":"소화설비에 대한 설명으로 옳은 것은?","c":["산⋅알칼리 소화기는 가스계 소화기로 분류된다.","CO2 소화설비는 화재감지기, 선택밸브, 방출표시등, 압력스위치 등으로 구성된다.","슈퍼바이저리패널(supervisory panel)은 습식스프링클러설비의 구성요소이다.","순환배관은 옥내소화전설비의 펌프 체절운전 시 수온하강 방지를 위해 설치한다."],"a":2,"inc":false,"unit":"4-6"},{"id":"gongmuwon-2021-04-03-5","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2021-04-03","num":5,"q":"백드래프트(back draft)에 대한 설명으로 옳은 것은?","c":["불완전 연소에 의해 발생된 일산화탄소가 가연물로 작용하여 폭발하는 현상이다.","화재 진압 시 지붕 등 상부를 개방하는 것보다 출입문을 먼저 개방하는 것이 효과적인 전술이다.","밀폐된 실내에서 발생되는 현상으로, 출입문을 한 번에 완전히 개방하여 연기를 일순간에 배출해야 폭발력을 억제할 수 있다.","연료지배형화재가 진행되고 있는 공간에 산소가 일시적으로 다량 공급됨에 따라 가연성가스가 폭발적으로 연소하는 현상이다."],"a":1,"inc":false,"unit":"1-12"},{"id":"gongmuwon-2021-04-03-6","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2021-04-03","num":6,"q":"위험물의 종류에 따른 소화 방법으로 옳지 않은 것은?","c":["제1류 위험물인 알칼리금속의 과산화물은 물을 사용한다.","제2류 위험물인 마그네슘은 건조사를 사용한다.","제3류 위험물인 알킬알루미늄은 건조사를 사용한다.","제4류 위험물인 알코올은 내알코올포(泡, foam)를 사용한다."],"a":1,"inc":false,"unit":"3-2"},{"id":"gongmuwon-2021-04-03-7","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2021-04-03","num":7,"q":"「화재조사 및 보고규정」상 특수화재에 해당하지 않는 것은?","c":["외국공관 및 그 사택의 화재","이재민 100명 이상 발생 화재","특수사고, 방화 등 화재원인이 특이하다고 인정되는 화재","철도, 항구에 매어 둔 외항선, 항공기, 발전소 및 변전소의 화재"],"a":2,"inc":false,"unit":"1-17"},{"id":"gongmuwon-2021-04-03-10","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2021-04-03","num":10,"q":"블레비(BLEVE : Boiling Liquid Expanding Vapor Explosion) 현상의 특징으로 옳지 않은 것은?","c":["액화가스 저장탱크에서 일어날 수 있다는 점에서는 증기운 폭발과 같다.","액화가스 저장탱크에서 물리적 폭발이 순간적으로 화학적 폭발로 이어지는 현상이다.","블레비의 규모는 파열 시 액체의 기화량에는 차이가 있으나 탱크의 용량에 따른 차이는 없다.","직접 열을 받은 부분이 액화가스 저장탱크의 인장 강도를 초과할 경우 기상부에 면하는 지점에서 파열하게 된다."],"a":3,"inc":false,"unit":"1-21"},{"id":"gongmuwon-2021-04-03-13","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2021-04-03","num":13,"q":"최소산소농도(MOC : Minimum Oxygen Concentration)에 대한 설명으로 옳지 않은 것은?","c":["연소상한계에 의해 최소산소농도가 결정된다.","연소할 때 화염이 전파되는 데 필요한 임계산소농도를 말한다.","완전연소반응식의 산소 몰수에 의해 최소산소농도가 결정된다.","프로판(C3H8) 1몰(mol)이 완전 연소하는 데 필요한 최소산소농도는 10.5 %이다."],"a":1,"inc":false,"unit":"1-4"},{"id":"gongmuwon-2021-04-03-16","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2021-04-03","num":16,"q":"폭발에 대한 설명으로 옳지 않은 것은?","c":["폭연은 폭굉보다 폭발압력이 낮다.","분해폭발은 산소에 관계없이 단독으로 발열 분해반응을 하는 물질에서 발생한다.","물리적 폭발은 물질의 상태(기체, 액체, 고체)가 변하거나 온도, 압력 등 조건의 변화에 따라 발생한다.","중합폭발은 가연성 액체의 무적(霧滴, mist)이 일정 농도 이상으로 조연성 가스 중에 분산되어 있을 때 착화하여 발생한다."],"a":4,"inc":false,"unit":"1-20"},{"id":"gongmuwon-2021-04-03-18","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2021-04-03","num":18,"q":"물소화약제에 대한 설명으로 옳은 것은?","c":["질식소화 작용은 기대하기 어렵다.","분무상으로 방사 시 B급화재 및 C급화재에도 적응성이 있다.","물은 비열과 기화열 값이 작아 냉각소화 효과가 우수하다.","수용성 가연물질인 알코올, 에테르, 에스테르 등으로 인한 화재에는 적응성이 없다."],"a":2,"inc":false,"unit":"6-1"},{"id":"gongmuwon-2022-04-09-1","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2022-04-09","num":1,"q":"소방기관에서 실시하는 화재조사에 대한 일반적인 설명으로 옳지 않은 것은?","c":["화재조사는 관계 공무원이 화재사실을 인지하는 즉시 실시한다.","화재조사는 강제성을 지니며, 프리즘식으로 진행한다.","화재조사 시 건축･구조물 화재의 소실정도는 입체면적에 대한 비율을 적용하여 구분한다.","화재원인조사에는 소방･방화시설의 조사는 포함되지 않는다."],"a":4,"inc":false,"unit":"1-17"},{"id":"gongmuwon-2022-04-09-4","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2022-04-09","num":4,"q":"화재가혹도(fire severity)에 대한 설명으로 옳지 않은 것은? (A는 개구부의 면적, H 는 개구부의 높이이다.)","c":["화재가혹도의 크기는 화재강도와 화재하중의 영향을 받는다.","화재실의 최고온도와 지속시간은 화재가혹도를 판단하는 중요한 인자이다.","화재실의 환기요소(A√H)는 화재가혹도에 영향을 준다.","화재가혹도는 화재실이나 화재구획의 단열성에 영향을 받지 않는다."],"a":4,"inc":false,"unit":"1-12"},{"id":"gongmuwon-2022-04-09-5","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2022-04-09","num":5,"q":"메틸알코올(CH3OH)의 최소산소농도(MOC : Minimum Oxygen Concentration, %)로 옳은 것은? (CH3OH의 연소상한계는 37 %, 연소범위의 상･하한 폭은 30 %이다.)","c":["5.0","8.5","10.5","14.0"],"a":3,"inc":false,"unit":"1-4"},{"id":"gongmuwon-2022-04-09-6","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2022-04-09","num":6,"q":"폭발에 대한 일반적인 설명으로 옳은 것은?","c":["아세틸렌과 산화에틸렌은 분해폭발을 일으키기 쉬운 물질이다.","상온에서 탱크에 저장된 중유가 유출되면 자유공간 증기운폭발이 일어난다.","밀폐공간에서 조연성가스가 폭발범위를 형성하면 점화원에 의해 가스폭발이 일어난다.","다량의 고온물질이 물속에 투입되었을 때 물의 갑작스러운 상변화에 의한 폭발현상을 반응폭주라 한다."],"a":1,"inc":false,"unit":"1-23"},{"id":"gongmuwon-2022-04-09-7","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2022-04-09","num":7,"q":"가연성 물질의 화재 시 소화방법으로 옳은 것은?","c":["탄화칼슘은 물을 분무하여 소화한다.","아세톤은 알콜형포 소화약제로 소화한다.","나트륨은 할론 소화약제로 소화한다.","마그네슘은 이산화탄소 소화약제로 소화한다."],"a":2,"inc":false,"unit":"3-1"},{"id":"gongmuwon-2022-04-09-8","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2022-04-09","num":8,"q":"위험물에 대한 일반적인 설명으로 옳은 것은?","c":["제1류 위험물 중 질산염류는 연소속도가 빨라 폭발적으로 연소한다.","제3류 위험물 중 황린은 가열, 충격, 마찰에 의해 분해되어 산소가 발생하므로 가연물과의 접촉을 피한다.","제4류 위험물 중 제1석유류는 인화점 및 연소하한계가 낮아 적은 양으로도 화재의 위험이 있다.","제5류 위험물 중 유기과산화물은 공기 중에 노출되거나 수분과 접촉하면 발화의 위험이 있다."],"a":3,"inc":false,"unit":"3-2"},{"id":"gongmuwon-2022-04-09-12","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2022-04-09","num":12,"q":"800 ℃, 1기압에서 황(S) 1 kg이 공기 중에서 완전 연소할 때 발생되는 이산화황의 발생량(m3)은? (단, 황(S)의 원자량은 32, 산소(O)의 원자량은 16이며, 이상기체로 가정한다.)","c":["2.00","2.35","2.50","2.75"],"a":4,"inc":false,"unit":"14-2"},{"id":"gongmuwon-2022-04-09-15","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2022-04-09","num":15,"q":"가연성 물질의 화재 위험성에 대한 설명으로 옳은 것은?","c":["비열, 연소열, 비점이 작거나 낮을수록 위험하다.","증발열, 연소열, 연소속도가 크거나 빠를수록 위험하다.","표면장력, 인화점, 발화점이 작거나 낮을수록 위험하다.","비중, 압력, 융점이 크거나 높을수록 위험하다."],"a":3,"inc":false,"unit":"2-3"},{"id":"gongmuwon-2022-04-09-18","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2022-04-09","num":18,"q":"할로겐화합물 소화약제가 갖추어야 할 일반적인 조건으로 옳지 않은 것은?","c":["독성이 적을수록 좋다.","지구 온난화에 끼치는 영향이 적을수록 좋다.","대기 중에 잔존 시간이 길수록 좋다.","오존층 파괴에 끼치는 영향이 적을수록 좋다."],"a":3,"inc":false,"unit":"6-3"},{"id":"gongmuwon-2022-04-09-19","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2022-04-09","num":19,"q":"포(foam)에 대한 일반적인 설명으로 옳은 것은?","c":["불화단백포 및 수성막포는 표면하 주입방식에 사용할 수 있다.","불소를 함유하고 있는 합성계면활성제포는 친수성이므로 유동성과 내유성이 좋다.","단백포는 유동성은 좋으나, 내화성은 나쁘다.","알콜형포 사용 시 비누화현상이 일어나면 소화능력이 떨어진다."],"a":1,"inc":false,"unit":"5-1"},{"id":"gongmuwon-2023-03-18-5","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2023-03-18","num":5,"q":"가연성 혼합기의 최소발화(점화)에너지(MIE, Minimum Ignition Energy)에 영향을 주는 요인에 관한 설명으로 옳지 않은 것은?","c":["온도가 상승하면 최소발화에너지는 작아진다.","압력이 상승하면 최소발화에너지는 작아진다.","열전도율이 낮아지면 최소발화에너지는 커진다.","화학양론비 부근에서 최소발화에너지는 최저가 된다."],"a":3,"inc":false,"unit":"1-1"},{"id":"gongmuwon-2023-03-18-6","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2023-03-18","num":6,"q":"가연성 액체의 연소현상에 관한 설명으로 옳지 않은 것은?","c":["가연성 액체의 연소와 관련된 온도는 발화점, 연소점, 인화점 순으로 높다.","인화점과 발화점이 가까운 액체일수록 재점화가 어렵고 냉각에 의한 소화활동이 용이하다.","인화점과 연소점의 차이는 외부 점화원을 제거했을 경우 화염 전파의 지속성 여부에 따라 구분된다.","연소반응은 열생성률(heat production rate)이 외부로의 열손실률(heat loss rate)보다 큰 조건에서 지속된다."],"a":2,"inc":false,"unit":"3-1"},{"id":"gongmuwon-2023-03-18-7","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2023-03-18","num":7,"q":"소방펌프 및 관로에서 발생되는 수격현상(water hammering)의 방지책으로 옳지 않은 것은?","c":["수격을 흡수하는 수격방지기를 설치한다.","관로에 서지 탱크(surge tank)를 설치한다.","플라이휠(flywheel)을 부착하여 펌프의 급격한 속도 변화를 억제한다.","관경의 축소를 통해 유체의 유속을 증가시켜 압력 변동치를 감소시킨다."],"a":4,"inc":false,"unit":"4-4"},{"id":"gongmuwon-2023-03-18-8","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2023-03-18","num":8,"q":"화재 시 연소생성물에 관한 설명으로 옳지 않은 것은?","c":["황화수소는 썩은 달걀과 비슷한 냄새가 난다.","연기로 인한 빛의 감소를 나타내는 감광계수는 가시거리와 반비례한다.","일산화탄소는 산소와 헤모글로빈의 결합을 방해하여 질식에 이르게 할 수 있다.","TLV(Threshold Limit Value)로 측정한 독성가스의 허용농도는 불화수소, 시안화수소, 암모니아, 포스겐 순으로 높다."],"a":4,"inc":false,"unit":"1-14"},{"id":"gongmuwon-2023-03-18-11","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2023-03-18","num":11,"q":"분진폭발에 영향을 미치는 인자에 관한 설명으로 옳지 않은 것은?","c":["분진의 발열량이 클수록 폭발하기 쉽다.","분진의 부유성이 클수록 폭발이 용이해진다.","분진폭발은 분진의 입자직경에 영향을 받는다.","분진의 단위체적당 표면적이 작아지면 폭발이 용이해진다."],"a":4,"inc":false,"unit":"1-22"},{"id":"gongmuwon-2023-03-18-12","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2023-03-18","num":12,"q":"전기화재(C급화재) 및 주방화재(K급화재)에 관한 설명으로 옳지 않은 것은?","c":["주방화재의 가연물 중 하나인 식용유의 발화점은 비점보다 낮다.","도체 주위의 자기장 변화에 의해 발생된 유도전류는 전기화재의 점화원으로 작용할 수 있다.","식용유로 인한 화재 시 유면상의 화염을 제거하면 복사열에 의한 기화를 차단하여 재발화를 방지할 수 있다.","전기화재의 발생 원인 중 누전은 전류가 전선이나 기구에서 절연 불량 등의 원인으로 정해진 전로(배선) 밖으로 흐르는 현상이다."],"a":3,"inc":false,"unit":"1-17"},{"id":"gongmuwon-2023-03-18-13","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2023-03-18","num":13,"q":"화재 시 구획실에서 발생하는 현상에 관한 설명으로 옳은 것은?","c":["개구부의 크기는 플래시오버 발생과 관련이 없다.","구획실의 창문과 문손잡이의 온도로 백드래프트의 발생 가능성을 예측할 수 없다.","준불연성이나 불연성의 내장재를 사용할 경우 플래시오버 발생까지의 소요시간이 길어진다.","구획실 내의 산소가 부족하여 훈소 상태에서 공기가 갑자기 다량 공급될 때 가연성 가스가 순간적으로 폭발하듯 발화하는 현상은 플래시오버이다."],"a":3,"inc":false,"unit":"3-1"},{"id":"gongmuwon-2023-03-18-15","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2023-03-18","num":15,"q":"구획실 화재에 관한 설명으로 옳지 않은 것은?","c":["플래시오버 이후에는 연료지배형 화재보다 환기지배형 화재가 지배적이다.","환기가 잘되지 않으면 환기지배형 화재에서 연료지배형 화재로 바뀌며 연기 발생이 줄어든다.","연료지배형 화재는 구획실 내 가연물의 연소에 필요한 산소가 충분히 공급되는 조건의 화재이다.","성장기에는 천장 부분에서 축적된 뜨거운 가스층이 발화원으로부터 떨어져 있는 가연성 물질에 복사열을 공급하여 플래시오버를 초래할 수 있다."],"a":2,"inc":false,"unit":"1-12"},{"id":"gongmuwon-2023-03-18-17","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2023-03-18","num":17,"q":"위험물의 유별 소화방법으로 옳지 않은 것은?","c":["탄화칼슘 화재 시 다량의 물로 냉각소화할 수 있다.","수용성 메틸알코올 화재에는 내알코올포를 사용한다.","알킬알루미늄은 마른모래, 팽창질석, 팽창진주암으로 소화한다.","적린은 다량의 물로 냉각소화하며, 소량의 적린인 경우에는 마른모래나 이산화탄소 소화약제도 일시적인 효과가 있다."],"a":1,"inc":false,"unit":"6-2"},{"id":"gongmuwon-2023-03-18-18","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2023-03-18","num":18,"q":"｢화재조사 및 보고규정｣에 관한 내용으로 옳지 않은 것은?","c":["건물의 소실면적 산정은 소실 입체면적으로 산정한다.","건물의 소실정도에서의 반소는 건물의 30% 이상 70% 미만이 소실된 것을 말한다.","건물 등 자산에 대한 최종잔가율은 건물･부대설비･구축물･가재도구는 20%로 하며, 그 이외의 자산은 10%로 정한다.","발화일시의 결정은 관계인등의 화재발견 상황통보(인지)시간 및 화재발생 건물의 구조, 재질 상태와 화기취급 등의 상황을 종합적으로 검토하여 결정한다. 다만, 자체진화 등 사후인지 화재로 그 결정이 곤란한 경우에는 발화시간을 추정할 수 있다."],"a":1,"inc":false,"unit":"1-17"},{"id":"gongmuwon-2023-03-18-20","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2023-03-18","num":20,"q":"분말소화약제에 관한 설명으로 옳지 않은 것은?","c":["제2종 분말소화약제의 주성분은 KHCO3이다.","제1･2･3종 분말소화약제는 열분해 반응에서 CO2가 생성된다.","NaHCO3이 주된 성분인 분말소화약제는 B･C급 화재에 사용하고 분말 색상은 백색이다.","NH4H2PO4이 주된 성분인 분말소화약제는 A･B･C급 화재에 유효하고 비누화현상이 일어나지 않는다."],"a":2,"inc":false,"unit":"6-1"},{"id":"gongmuwon-2023-03-18-21","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2023-03-18","num":21,"q":"할로겐화합물 및 불활성기체 소화약제에 관한 설명으로 옳지 않은 것은?","c":["IG-01, IG-55, IG-100, IG-541 중 질소를 포함하지 않은 약제는 IG-100이다.","할로겐화합물 소화약제 중 HFC-23(트리플루오르메탄)의 화학식은 CHF3이다.","부촉매 소화효과는 불활성기체 소화약제에는 없으나 할로겐화합물 소화약제는 있다.","할로겐화합물 소화약제는 불소, 염소, 브롬 또는 요오드 중 하나 이상의 원소를 포함하고 있는 유기화합물을 기본성분으로 하는 소화약제를 말한다."],"a":1,"inc":false,"unit":"6-3"},{"id":"gongmuwon-2023-03-18-23","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2023-03-18","num":23,"q":"차동식 분포형 감지기의 종류에 해당하지 않는 것은?","c":["공기관식","열전대식","열반도체식","광전식"],"a":4,"inc":false,"unit":"8-3"},{"id":"gongmuwon-2024-03-30-5","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2024-03-30","num":5,"q":"연소에 관한 설명으로 옳은 것은?","c":["작열연소 : 화염이 없는 표면연소이다.","분해연소 : 유황이나 나프탈렌이 열분해되면서 일어나는 연소이다.","증발연소 : 액체에서만 발생하는 연소형태로서 액면에서 비등하는 기체에서 발생한다.","자기연소 : 제3류 위험물과 같이 물질 자체 내의 산소를 소모하는 연소로서 연소속도가 빠르다."],"a":1,"inc":false,"unit":"1-6"},{"id":"gongmuwon-2024-03-30-6","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2024-03-30","num":6,"q":"블레비(BLEVE)에 관한 설명으로 옳지 않은 것은?","c":["가연물이 비점 이상으로 가열될 때 발생한다.","저장탱크의 기계적 강도 이상의 압력이 형성될 때 발생한다.","저장탱크 균열로 인한 액상, 기상의 동적 평형 상태가 유지된다.","저장탱크의 외부 표면에 열전도성이 작은 물질로 단열 조치하여 예방한다."],"a":3,"inc":false,"unit":"1-21"},{"id":"gongmuwon-2024-03-30-7","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2024-03-30","num":7,"q":"실내 일반화재 진행 과정에 관한 설명으로 옳은 것은?","c":["화재 초기에는 실내 온도가 급격하게 상승하기 시작한다.","성장기에는 급속한 연소 진행으로 환기지배형 화재 양상이 나타난다.","최성기에는 실내 화염이 최고조에 도달하나 실내 산소 부족으로 연소속도가 느려진다.","감쇠기에는 화염의 급격한 소멸로 훈소 상태가 되어 백드래프트(back draft)의 위험이 없다."],"a":3,"inc":false,"unit":"1-12"},{"id":"gongmuwon-2024-03-30-9","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2024-03-30","num":9,"q":"｢위험물안전관리법｣ 및 같은 법 시행령, 시행규칙상 위험물의 지정수량과 위험등급의 연결이 옳지 않은 것은?","c":["황린—20kg—Ⅰ등급","마그네슘—500kg—Ⅲ등급","유기과산화물—10kg—Ⅰ등급","과염소산—300kg—Ⅱ등급"],"a":4,"inc":false,"unit":"3-2"},{"id":"gongmuwon-2024-03-30-10","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2024-03-30","num":10,"q":"가연물의 발화온도와 발화에너지에 관한 설명으로 옳은 것은?","c":["점화원에 의해서 가연물이 발화하기 시작하는 최저 온도를 발화점(ignition point)이라고 한다.","점화원을 제거해도 자력으로 연소를 지속할 수 있는 최저 온도를 연소점(fire point)이라고 한다.","가연물의 최소발화에너지가 클수록 더 위험하다.","가연물의 연소점은 발화점보다 높다."],"a":2,"inc":false,"unit":"1-1"},{"id":"gongmuwon-2024-03-30-15","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2024-03-30","num":15,"q":"구획실 화재에 관한 설명으로 옳은 것은?","c":["플래시오버(flash over)는 최성기와 감쇠기 사이에서 발생하며 충격파를 수반한다.","굴뚝효과가 발생할 때는 개구부에 형성된 중성대 상부에서 공기가 유입되고, 중성대 하부에서 연기가 유출된다.","연료지배형 화재는 환기지배형 화재보다 산소 공급이 원활하고 연소속도가 빠르다.","화재플룸(fire plume)은 실내 공기의 압력 차이로 가연성 가스가 천장을 따라 화재가 발생하지 않은 복도 쪽으로 굴러다니는 것처럼 뿜어져 나오는 현상이다."],"a":3,"inc":false,"unit":"1-12"},{"id":"gongmuwon-2024-03-30-18","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2024-03-30","num":18,"q":"소방시설 중 경보설비에 관한 설명으로 옳지 않은 것은?","c":["시각경보기는 청각장애인에게 점멸 형태로 시각경보를 하는 장치이다.","R형 수신기는 감지기 또는 발신기에서 1 : 1 접점방식으로 전송된 신호를 수신한다.","비상방송설비는 수신기에 화재신호가 도달하면 방송으로 화재 사실을 알리는 설비이다.","이온화식 감지기와 광전식 감지기는 연기를 감지하여 화재신호를 발하는 장치이다."],"a":2,"inc":false,"unit":"3-10"},{"id":"gongmuwon-2024-03-30-20","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2024-03-30","num":20,"q":"이산화탄소 소화약제의 특징으로 옳은 것은?","c":["무색, 무취로 전도성이며 독성이 있다.","질식소화 효과와 기화열 흡수에 의한 냉각효과가 있다.","제3류 위험물, 제5류 위험물의 소화에 사용한다.","자체 증기압이 매우 낮아 별도의 가압원이 필요하다."],"a":2,"inc":false,"unit":"6-2"},{"id":"gongmuwon-2024-03-30-21","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2024-03-30","num":21,"q":"할론(Halon) 소화약제에 관한 설명으로 옳은 것은?(문제 오류로 가답안 발표시 4번으로 발표되었지만 확정답안 발표시 모두 정답처리 되었습니다. 여기서는 가답안인 4번을 누르면 정답 처리 됩니다.)","c":["지방족 탄화수소, 메테인, 에테인 등의 수소 원자 일부 또는 전부가 할로젠 원소(F, Cl, Br, I)로 치환된 화합물이며 메테인, 에테인과 물리･화학적 성질이 비슷하다.","Halon 1301과 Halon 1211은 모두 상온, 상압에서 기체로 존재하며 유류화재, 전기화재, 금속의 수소화합물, 유기과산화물에 적응성이 있다.","Halon 2402는 상온, 상압에서 액체로 존재하며 자체적인 독성은 없지만 열분해 시 독성가스를 발생시킨다.","Halon 1211은 자체 증기압이 낮아 저장용기에 저장할 때 소화약제의 원활한 방출을 위해 질소가스로 가압한다."],"a":4,"inc":false,"unit":"3-2"},{"id":"gongmuwon-2024-03-30-22","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2024-03-30","num":22,"q":"포 소화약제에 관한 설명으로 옳지 않은 것은?","c":["불화단백포 소화약제는 불소계 계면활성제를 첨가하여 단백포 소화약제의 단점인 유동성을 보완하였다.","알콜형포 소화약제는 케톤류, 알데히드류, 아민류 등 수용성용제의 소화에 사용할 수 있다.","단백포 소화약제는 단백질을 가수분해 한 것을 주원료로 하며 내유성이 뛰어나 소화속도가 빠르다.","합성계면활성제포 소화약제는 유동성과 저장성이 우수하며 저팽창포부터 고팽창포까지 사용할 수 있다."],"a":3,"inc":false,"unit":"5-1"},{"id":"gongmuwon-2025-03-29-9","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2025-03-29","num":9,"q":"고체 가연물인 피크르산(Picric Acid)의 연소 형태로 옳은 것은?","c":["훈소","자기연소","표면연소","증발연소"],"a":2,"inc":false,"unit":"1-5"},{"id":"gongmuwon-2025-03-29-10","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2025-03-29","num":10,"q":"푸리에(Fourier)의 열전도법칙에 따라 물질을 통해 전달되는 열량에 대한 설명으로 옳지 않은 것은?","c":["물질의 두께에 비례한다.","물질의 전열면적에 비례한다.","물질 양면의 온도차에 비례한다.","물질의 열전도율에 비례한다."],"a":1,"inc":false,"unit":"1-7"},{"id":"gongmuwon-2025-03-29-11","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2025-03-29","num":11,"q":"연소 시 발생하는 황화수소(H2S)에 대한 설명으로 옳은 것은?","c":["계란 썩는 냄새가 나는 가연성가스이다.","폴리염화비닐 등이 연소할 때 발생되는 맹독성가스이다.","청산가스라고도 하며 동물의 털이 불완전연소할 때 발생한다.","황(S)을 포함하고 있는 유기화합물이 완전연소할 때 발생한다."],"a":1,"inc":false,"unit":"3-1"},{"id":"gongmuwon-2025-03-29-13","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2025-03-29","num":13,"q":"내화구조물의 화재가혹도 판단을 위한 주요 요소 중 화재지속시간을 산정하기 위한 인자로 옳지 않은 것은? (단, 환기지배형 화재로 가정한다.)","c":["화재실의 바닥면적","화재실의 최고온도","화재실의 개구부 높이","화재실의 개구부 면적"],"a":2,"inc":false,"unit":"1-12"},{"id":"gongmuwon-2025-03-29-15","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2025-03-29","num":15,"q":"위험물의 성질 및 품명의 정의로 옳지 않은 것은?","c":["“인화성고체”라 함은 고형알코올 그 밖에 1기압에서 인화점이 섭씨 40도 미만인 고체를 말한다.","“제1석유류”라 함은 아세톤, 휘발유 그 밖에 1기압에서 인화점이 섭씨 21도 미만인 것을 말한다.","“특수인화물”이라 함은 이황화탄소, 디에틸에테르 그 밖에 1기압에서 발화점이 섭씨 100도 이하인 것 또는 인화점이 섭씨 영하 20도 이하이고 비점이 섭씨 40도 이하인 것을 말한다.","“자연발화성물질 및 금수성물질”이라 함은 고체 또는 액체로서 공기 중에서 발화의 위험성이 있거나 산과 접촉하여 발화하거나 고압 수증기를 발생하는 위험성이 있는 것을 말한다."],"a":4,"inc":false,"unit":"1-1"},{"id":"gongmuwon-2025-03-29-18","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2025-03-29","num":18,"q":"소방의 화재조사 시 소방관서장이 화재합동조사단의 단원으로 임명 또는 위촉할 수 있는 사람에 해당하지 않는 것은?","c":["화재조사관","화재조사 업무에 관한 경력이 4년인 소방공무원","국가기술자격의 직무분야 중 안전관리 분야에서 기능사자격을 취득한 사람","｢고등교육법｣ 제2조에 따른 학교 또는 이에 준하는 교육기관에서 화재 조사, 소방 또는 안전관리 등 관련 분야에 조교수로 4년 재직한 사람"],"a":3,"inc":false,"unit":"1-17"},{"id":"gongmuwon-2025-03-29-21","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2025-03-29","num":21,"q":"제3종 분말소화약제의 열분해 결과로 생성되는 물질의 소화효과로 옳지 않은 것은?","c":["H2O : 냉각작용","HPO3 : 방진작용","NH3 : 부촉매작용","H3PO4 : 탈수탄화작용"],"a":3,"inc":false,"unit":"6-1"},{"id":"gongmuwon-2026-03-07-9","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2026-03-07","num":9,"q":"K급 화재(주방화재)에 관한 설명으로 옳지 않은 것은?","c":["주방에서 동･식물유를 취급하는 조리기구에서 일어나는 화재를 말한다.","비누화 반응을 일으키는 NaHCO3를 주성분으로 하는 소화약제를 사용할 수 있다.","K급 화재(주방화재)용 소화기의 소화성능시험은 B급 화재(유류화재)용 소화기의 소화성능시험에 따른다.","식용유에 의한 화재 시 식용유의 발화점이 끓는점보다 낮아 화염을 제거한 후에도 재발화할 수 있다."],"a":3,"inc":false,"unit":"1-17"},{"id":"gongmuwon-2026-03-07-12","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2026-03-07","num":12,"q":"연소와 관련된 설명으로 옳지 않은 것은?","c":["연기(smoke)는 연소과정에서 발생하는 고체, 액체, 기체상태의 미립자와 화학물질의 복합체로, 공기 중에 떠다니는 특성을 가진다.","대류는 유체의 이동을 통해 열이 전달되는 현상이며, 대류열전달의 크기는 주로 뉴턴의 냉각법칙으로 표현된다.","정촉매 작용은 촉매가 활성화에너지를 낮추는 새로운 반응경로를 제공하여 연소반응이 더 쉽게 일어나게 하며, 촉매는 반응이 끝나도 소모되지 않는 특징이 있다.","가스의 분해폭발은 가연성 가스와 공기 또는 조연성 가스가 적정한 비율로 혼합된 가연성 혼합기가 발화원에 의하여 착화될 때 발생하고, 화재 현장에서 가장 많이 발생하는 폭발 유형이다."],"a":4,"inc":false,"unit":"1-7"},{"id":"gongmuwon-2026-03-07-15","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2026-03-07","num":15,"q":"펜테인(C5H12)의 최소산소농도 계산값으로 옳은 것은? (단, 25 ℃, 1기압 조건이고, 대기 중 산소농도는 20 vol%로 가정하며, 각 단계의 계산결과는 모두 소수점 첫째 자리에서 반올림함)","c":["6 vol%","8 vol%","88 vol%","104 vol%"],"a":2,"inc":false,"unit":"1-4"},{"id":"gongmuwon-2026-03-07-17","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2026-03-07","num":17,"q":"폭발에 관한 설명으로 옳지 않은 것은? (단, 문제에서 제시한 사항 외의 것은 고려하지 않음)","c":["화학적 폭발의 한 종류인 산화 폭발에는 가스폭발, 분무폭발, 그리고 분진폭발이 포함된다.","증기운폭발(UVCE)은 개방된 대기에 다량의 가연성 가스가 서서히 지속적으로 누출되면서 대기 중에 구름 형태로 모여 점화 시 순간적으로 모든 가스가 동시에 폭발하는 현상으로 급격한 화학적 변화에 의한 폭발이다.","증기폭발은 액화가스 등이 분출될 때 급격한 기화와 함께 비등 현상이 나타나므로 밀폐된 공간 속의 액체 물질이 빠르게 기화하면서 다량의 증기가 발생하고, 이에 따라 증기압이 높아져 용기 등의 내압을 초과하여 파열되는 폭발이다.","분진폭발은 먼저, 입자 표면에 마찰 등으로 열에너지가 발생하여 표면온도가 상승하여 발화된다. 그 후, 열분해로 가연성 기체가 발생해 공기와 혼합되며, 주변의 열전파로 주위 분진이 추가로 열분해되어 가연성 기체가 연쇄적으로 확산된다. 이어서, 압력이 상승하면서 폭발이 일어나고, 폭발 이후 2차･3차 폭발이 발생한다."],"a":4,"inc":false,"unit":"1-21"},{"id":"gongmuwon-2026-03-07-18","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2026-03-07","num":18,"q":"연소 생성물의 특성에 관한 설명으로 옳지 않은 것은?","c":["이산화질소 가스는 독성이 매우 커서 대체로 200~700 ppm 정도의 농도에 단시간 노출되기만 해도 인체에 치명적일 수 있다.","암모니아 가스는 상･공업용의 냉동시설에서 냉매로 널리 사용되기 때문에 화재 발생 시 누출되면 큰 위험을 초래할 수 있다.","황화수소 가스는 약 0.04 % 농도에서도 30분 이상 호흡하면 위험하며, 0.08 % 정도의 농도에서는 치명적인 위험 상태에 빠질 수가 있다.","일산화탄소의 농도가 2 vol%가 되면 호흡 심도는 1.5배 정도 증가하고, 3 vol%의 농도에 이르면 약 2배 정도의 호흡심도를 보여주는 것으로 알려져 있다."],"a":4,"inc":false,"unit":"4-5"},{"id":"gongmuwon-2026-03-07-20","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2026-03-07","num":20,"q":"가스계 소화설비 소화약제와 관련된 용어에 관한 설명으로 옳지 않은 것은? (단, 다툼이 있는 경우 화재안전기술기준에 따름)","c":["“불활성기체소화약제”란 헬륨, 네온, 아르곤 또는 질소가스 중 하나 이상의 원소를 기본성분으로 하는 소화약제를 말한다.","“할로겐화합물소화약제”란 불소, 염소, 브롬 또는 요오드 중 하나 이상의 원소를 포함하고 있는 유기화합물을 기본성분으로 하는 소화약제를 말한다.","“고체에어로졸화합물”이란 불연성물질의 혼합물로서 화재를 소화하는 비전도성의 미세입자인 에어로졸을 만드는 고체화합물을 말한다.","“고체에어로졸”이란 고체에어로졸화합물의 연소과정에 의해 생성된 직경 10 μm 이하의 고체 입자와 기체 상태의 물질로 구성된 혼합물을 말한다."],"a":3,"inc":false,"unit":"6-3"},{"id":"gongmuwon-2026-03-07-21","cat":"gongmuwon","catLabel":"소방공무원 · 소방학개론","catShort":"공무원","round":"2026-03-07","num":21,"q":"특별피난계단의 부속실 제연설비가 설치된 다층 건물의 1개 층에서 제연설비 수동기동장치를 조작할 경우, 이와 연동하는 장치의 작동으로 옳지 않은 것은? (단, 다툼이 있는 경우 화재안전성능기준에 따르며, 문제에서 제시한 사항 외의 것은 고려하지 않음)","c":["전 층의 배출댐퍼 또는 개폐기의 개방","전 층의 제연구역에 설치된 급기댐퍼의 개방","급기송풍기 및 유입공기의 배출용 송풍기의 작동","개방･고정된 모든 출입문(제연구역과 옥내 사이의 출입문에 한한다)의 개폐장치의 작동"],"a":1,"inc":false,"unit":"7-8"},{"id":"gisa-2015-09-19-2","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2015-09-19","num":2,"q":"건축물 화재에서 플래시 오버(Flash over) 현상이 일어나는 시기는?","c":["초기에서 성장기로 넘어가는 시기","성장기에서 최성기로 넘어가는 시기","최성기에서 감쇠기로 넘어가는 시기","감쇠기에서 종기로 넘어가는 시기"],"a":2,"inc":false,"unit":"1-13"},{"id":"gisa-2015-09-19-3","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2015-09-19","num":3,"q":"비수용성 유류의 화재 시 물로 소화할 수 없는 이유는?","c":["인화점이 변하기 때문","발화점이 변하기 때문","연소면이 확대되기 때문","수용성으로 변하여 인화점이 상승하기 때문"],"a":3,"inc":false,"unit":"1-1"},{"id":"gisa-2015-09-19-4","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2015-09-19","num":4,"q":"위험물의 유별에 따른 대표적인 성질의 연결이 옳지 않은 것은?","c":["제1류 : 산화성 고체","제2류 : 가연성 고체","제4류 : 인화성 액체","제5류 : 산화성 액체"],"a":4,"inc":false,"unit":"3-1"},{"id":"gisa-2015-09-19-5","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2015-09-19","num":5,"q":"다음 물질 중 공기에서 위험도(H)가 가장 큰 것은?","c":["에테르","수소","에틸렌","프로판"],"a":1,"inc":false,"unit":"1-23"},{"id":"gisa-2015-09-19-6","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2015-09-19","num":6,"q":"할로겐화합물 소화약제에서 구성 원소가 아닌 것은?","c":["염소","브롬","네온","탄소"],"a":3,"inc":false,"unit":"6-3"},{"id":"gisa-201 5,"q":"온도가 T인 유체가 정압이 P인 상태로 관속을 흐를 때 공동현상이 발생하는 조건으로 가장 적절한 것은? (단, 유체 온도 T에 해당하는 포화증기압을 Ps 라 한다.)","c":["P >Ps","P >2 X Ps","P <Ps","P <2 X Ps"],"a":3,"inc":false,"unit":"4-4"},{"id":"gisa-2015-09-19-36","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2015-09-19","num":36,"q":"반지름 r인 뜨거운 금속 구를 실에 매달아 선풍기 바람으로 식힌다. 표면에서의 평균 열전달 계수를 h, 공기와 금속의 열전도계수를 ka 와 kb 라고 할 때, 구의 표면 위치에서 금속에서의 온도 기울기와 공기에서의 온도 기울기 비는?","c":["ka : kb","kb : ka","(rh - ka): kb","ka : (kb - rh)"],"a":1,"inc":false,"unit":"1-7"},{"id":"gisa-2015-09-19-38","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2015-09-19","num":38,"q":"동점성계수가 0.1x10-5 m2/s 인 유체가 안지름 10cm 인 원관 내에 1m/s로 흐르고 있다. 관의 마찰계수가 f = 0.022 이며 등가길이가 200m 일 때의 손실수두 몇 m 인가? (단, 비중량은 9800 N/m3 이다.)","c":["2.24","6.58","11.0","22.0"],"a":1,"inc":false,"unit":"4-1"},{"id":"gisa-2015-09-19-41","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2015-09-19","num":41,"q":"일반음식점에서 조리를 위해 불을 사용하는 설비를 설치할 때 지켜야 할 사항의 기준으로 옳지 않은 것은?","c":["주방시설에는 동물 또는 식물의 기름을 제거할 수 있는 필터 등을 설치할 것","열을 발생하는 조리기구는 반자 또는 선반에서 50cm 이상 떨어지게 할 것","주방설비에 부속된 배기덕트는 0.5mm 이상의 아연도금강판 또는 이와 동등 이상의 내식성 불연재료로 설치할 것","열을 방생하는 조리기구로부터 15cm 이내의 거리에 있는 가연성 주요구조부는 석면판 또는 단열성이 있는 불연재료로 덮어 씌울 것"],"a":2,"inc":false,"unit":"3-1"},{"id":"gisa-2015-09-19-43","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2015-09-19","num":43,"q":"소방시설 중 연결살수설비는 어떤 설비에 속하는가?","c":["소화설비","구조설비","피난설비","소화활동설비"],"a":4,"inc":false,"unit":"8-7"},{"id":"gisa-2015-09-19-51","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2015-09-19","num":51,"q":"다음 중 특수가연물에 해당되지 않는 것은?","c":["사류 1000kg","면화류 200kg","나무껍질 및 대팻밥 400kg","넝마 및 종이부스러기 500kg"],"a":4,"inc":false,"unit":"3-2"},{"id":"gisa-2015-09-19-53","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2015-09-19","num":53,"q":"소방시설 중 화재를 진압하거나 인명구조활동을 위하여 사용하는 설비로 정의되는 것은?","c":["소화활동설비","피난설비","소화용수설비","소화설비"],"a":1,"inc":false,"unit":"8-7"},{"id":"gisa-2015-09-19-56" . 층류로 흐를 수 있는 최대 량은 약 얼마인가? (단, 임계레이놀즈수는 2100으로 한다.)","c":["16.5 cm3/s","33 cm3/s","49.5 cm3/s","66 cm3/s"],"a":1,"inc":false,"unit":"4-3"},{"id":"gisa-2016-03-06-33","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-03-06","num":33,"q":"관의 단면적이 0.6m2 에서 0.2m2로 감소하는 수평 원형 축소관으로 공기를 수송하고 있다. 관 마찰손실은 없는 것으로 가정하고 7.26N/s의 공기가 흐를 때 압력 감소는 몇 Pa 인가? (단, 공기 밀도는 1.23kg/m3이다.)","c":["4.96","5.58","6.20","9.92"],"a":1,"inc":false,"unit":"4-3"},{"id":"gisa-2016-03-06-37","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-03-06","num":37,"q":"기체의 체적탄성계수에 관한 설명으로 옳지 않은 것은?","c":["체적탄성계수는 압력의 차원을 가진다.","체적탄성계수가 큰 기체는 압축하기가 쉽다.","체적탄성계수의 역수를 압축률이라 한다.","이상기체를 등온압축 시킬 때 체적탄성계수는 절대압력과 같은 값이다."],"a":2,"inc":false,"unit":"14-2"},{"id":"gisa-2016-03-06-39","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-03-06","num":39,"q":"직경 2m 인 구 형태의 화염이 1MW의 발열량을 내고 있다. 모두 복사로 방출될 때 화염의 표면 온도는? (단, 화염은 흑체로 가정하고, 주변온도는 300K 스테판-볼츠만 상수는 5.67X10-8 W/m2K4)","c":["1090K","2619K","3720K","6240K"],"a":1,"inc":false,"unit":"1-8"},{"id":"gisa-2016-03-06-51","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-03-06","num":51,"q":"소방기본법상 소방용수시설·소화기구 및 설비등의 설치명령을 위반한 자의 과태료는?","c":["100만원 이하","200만원 이하","300만원 이하","500만원 이하"],"a":2,"inc":false,"unit":"4-5"},{"id":"gisa-2016-03-06-52","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-03-06","num":52,"q":"가연성가스를 저장·취급하는 시설로서 1급 소방안전관리대상물의 가연성가스 저장·취급 기준으로 옳은 것은?","c":["100톤 미만","100톤 이상 ~ 1000톤 미만","500톤 이상 ~ 1000톤 미만","1000톤 이상"],"a":4,"inc":false,"unit":"3-1"},{"id":"gisa-2016-03-06-53","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-03-06","num":53,"q":"연면적이 500m2 이상인 위험물 제조소 및 일반취급소에 설치하여야 하는 경보설비는?","c":["자동화재탐지설비","확성장치","비상경보설비","비상방송설비"],"a":1,"inc":false,"unit":"3-10"},{"id":"gisa-2016-03-06-62","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-03-06","num":62,"q":"스프링클러헤드의 감도를 반응시간지수(RTI)값에 따라 구분할 때 RTI값이 51 초과 80 이하일 때의 헤드 감도는?","c":["Fast response","Speical response","Standard response","Quick response"],"a":2,"inc":false,"unit":"4-7"},{"id":"gisa-2016-03-06-63","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-03-06","num":63,"q":"물분무소화설비 가압송수장치의 1분당 토출량에 대한 최소기준으로 옳은 것은? (단, 특수가연물 저장 취급하는 특정소방대상물 및 차고 주차장의 바닥면적은 50m2이하인 경우는 50m2를 적용한다.)","c":["차고 또는 주차장의 바닥면적 1m2 당 10L를 곱한 양 이상","특수가연물을 저장·취급하는 특정소방대상물의 바닥면적 1m2 당 20L를 곱한 양 이상","케이블 트레이, 케이블 덕트는 투영된 바닥면적 1m2 당 10L를 곱한 양 이상","절연유 봉입 변압기는 바닥면적을 제외한 표면적을 합한 면적 1m2당 10L를 곱한 양 이상"],"a":4,"inc":false,"unit":"4-10"},{"id":"gisa-2016-03-06-64","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-03-06","num":64,"q":"펌프의 토출관에 압입기를 설치하여 포소화약제 압입용펌프로 포 소화약제를 압입시켜 혼합하는 방식은?","c":["라인 푸로포셔너방식","펌프 푸로포셔너방식","프레져 푸로포셔너방식","프레져사이드 프로포셔너방식"],"a":4,"inc":false,"unit":"5-1"},{"id":"gisa-2016-03-06-69","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-03-06","num":69,"q":"분말소화설비에서 사용하지 않는 밸브는?","c":["드라이밸브","클리닝밸브","안전밸브","배기밸브"],"a":1,"inc":false,"unit":"6-1"},{"id":"gisa-2016-03-06-70","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-03-06","num":70,"q":"스프링클러설비 또는 옥내소화전설비에 사용되는 밸브에 대한 설명으로 옳지 않은 것은?","c":["펌프의 토출측 체크밸브는 배관 내 압력이 가압송수장치로 역류되는 것을 방지한다.","가압송수장치의 후드밸브는 펌프의 위치가 수원의 수위보다 높을 때 설치한다.","입상관에 사용하는 스윙체크밸브는 아래에서 위로 송수하는 경우에만 사용된다.","펌프의 흡입측배관에는 버터플라이밸브의 개폐표시형밸브를 설치하여야 한다."],"a":4,"inc":false,"unit":"4-6"},{"id":"gisa-2016-03-06-73","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-03-06","num":73,"q":"이산화탄소 소화설비에서 방출되는 가스압력을 이용하여 배기덕트를 차단하는 장치는?","c":["방화셔터","피스톤릴리져댐퍼","가스체크밸브","방화댐퍼"],"a":2,"inc":false,"unit":"6-2"},{"id":"gisa-2016-03-06-74","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-03-06","num":74,"q":"피난기구의 설치 및 유지에 관한 사항 중 옳지 않은 것은?","c":["피난기구를 설치하는 개구부는 서로 동일직선상의 위치에 있을 것","설치장소에는 피난기구의 위치를 표시하는 발광식 또는 축광식 표지와 그 사용방법을 표시한 표지를 부착할 것","피난기구는 소방대상물의 기둥 바닥 보 기타 구조상 견고한 부분에 볼튼조임·매입·용접 기타의 방법으로 견고하게 부착할 것","피난기구는 계단·피난기구 기타 피난시설로부터 적당한 거리에 있는 안전한 구조로 된 피난 또는 소화활동상 유효한 개구부에 고정하여 설치할 것"],"a":1,"inc":false,"unit":"7-3"},{"id":"gisa-2016-03-06-75","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-03-06","num":75,"q":"특고압의 전기시설을 보호하기 위한 수계소화설비로 물분무소화설비의 사용이 가능한 주된 이유는?","c":["물분무소화설비는 다른 물 소화설비에 비해서 신속한 소화를 보여주기 때문이다.","물분무소화설비는 다른 물 소화설비에 비해서 물의 소모량이 적기 때문이다.","분무상태의 물은 전기적으로 비전도성이기 때문이다.","물분무입자 역시 물이므로 전기전도성이 있으나 전기 시설물을 젖게 하지 않기 때문이다."],"a":3,"inc":false,"unit":"4-10"},{"id":"gisa-2016-03-06-76","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-03-06","num":76,"q":"포소화약제의 저장량 계산 시 가장 먼 탱크 까지의 송액관에 충전하기 위한 필요량을 계산에 반영하지 않는 경우는?","c":["송액관의 내경이 75mm 이하인 경우","송액관의 내경이 80mm 이하인 경우","송액관의 내경이 85mm 이하인 경우","송액관의 내경이 100mm 이하인 경우"],"a":1,"inc":false,"unit":"5-1"},{"id":"gisa-2016-03-06-78","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-03-06","num":78,"q":"분말소화설비 배관의 설치기준으로 옳지 않은 것은?","c":["배관은 전용으로 할 것","배관은 모두 스케쥴 40 이상으로 할 것","동관을 사용할 경우는 고정압력 또는 최고사용압력의 1.5배 이상의 압력에 견딜 수 있는 것으로 할것","밸브류는 개폐위치 또는 개폐방향을 표시한것으로 할것"],"a":2,"inc":false,"unit":"6-1"},{"id":"gisa-2016-03-06-79","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-03-06","num":79,"q":"스프링클러설비 배관의 설치기준으로 틀린 것은?","c":["급수배관의 구경은 25mm 이상으로 한다.","수직배수관의 구경은 50mm 이상으로 한다.","지하매설배관은 소방용 합성수지 배관으로 설치할 수 있다.","교차배관의 최소구경은 65mm 이상으로 한다."],"a":4,"inc":false,"unit":"4-7"},{"id":"gisa-2016-05-08-4","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-05-08","num":4,"q":"알킬알루미늄 화재에 적합한 소화약제는?","c":["물","이산화탄소","팽창질석","할로겐화합물"],"a":3,"inc":false,"unit":"6-3"},{"id":"gisa-2016-05-08-5","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-05-08","num":5,"q":"제1종 분말 소화약제의 열분해 반응식으로 옳은 것은?","c":["2NaHCO3 → Na2CO3 + CO2 +H2O","2KHCO3 → K2CO3 + CO2 +H2O","2NaHCO3 → Na2CO3 + 2CO2 +H2O","2KHCO3 → K2CO3 + 2CO2 +H2O"],"a":1,"inc":false,"unit":"6-1"},{"id":"gisa-2016-05-08-7","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-05-08","num":7,"q":"화재의 종류에 따른 표시 색 연결이 틀린 것은?","c":["일반화재 - 백색","전기화재 - 청색","금속화재 - 흑색","유류화재 - 황색"],"a":3,"inc":false,"unit":"1-17"},{"id":"gisa-2016-05-08-8","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-05-08","num":8,"q":"화재 및 폭발에 관한 설명으로 틀린 것은?","c":["메탄가스는 공기보다 무거우므로 가스탐지부는 가스기구의 직하부에 설치한다.","옥외저장탱크의 방유제는 화재 시 화재의 확대를 방지하기 위한 것이다.","가연성 분진이 공기 중에 부유하면 폭발할 수도 있다.","마그네슘의 화재 시 주수 소화는 화재를 확대할 수 있다."],"a":1,"inc":false,"unit":"3-1"},{"id":"gisa-2016-05-08-9","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-05-08","num":9,"q":"굴뚝효과에 관한 설명으로 틀린 것은?","c":["건물내ㆍ외부의 온도차에 따른 공기의 흐름 현상이다.","굴뚝효과는 고층건물에서는 잘 나타나지 않고 저층건물에서 주로 나타난다.","평상시 건물 내의 기류분포를 지배하는 중요요소이며 화재 시 연기의 이동에 큰 영향을 미친다.","건물외부의 온도가 내부의 온도보다 높은 경우 저층부에서는 내부에서 외부로 공기의 흐름이 생긴다."],"a":2,"inc":false,"unit":"1-15"},{"id":"gisa-2016-05-08-11","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-05-08","num":11,"q":"연쇄반응을 차단하여 소화하는 약제는?","c":["물","포","할론 1301","이산화탄소"],"a":3,"inc":false,"unit":"1-5"},{"id":"gisa-2016-05-08-14","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-05-08","num":14,"q":"위험물에 관한 설명으로 틀린 것은?","c":["유기금속화합물인 사에틸납은 물로 소화할 수 없다.","황린은 자연발화를 막기 위해 통상 물속에 저장한다.","칼륨, 나트륨은 등유 속에 보관한다.","유황은 자연발화를 일으킬 가능성이 없다."],"a":1,"inc":false,"unit":"1-1"},{"id":"gisa-2016-05-08-15","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-05-08","num":15,"q":"블레비(BLEVE) 현상과 관계가 없는 것은?","c":["핵분열","가연성액체","화구(Fire ball)의 형성","복사열의 대량 방출"],"a":1,"inc":false,"unit":"1-21"},{"id":"gisa-2016-05-08-16","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-05-08","num":16,"q":"소화기구는 바닥으로부터 높이 몇 m 이하의 곳에 비치하여야 하는가? (단, 자동소화장치를 제외한다.)","c":["0.5","1.0","1.5","2.0"],"a":3,"inc":false,"unit":"4-5"},{"id":"gisa-2016-05-08-17","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-05-08","num":17,"q":"제4류 위험물의 화재 시 사용되는 주된 소화방법은?","c":["물을 뿌려 냉각한다.","연소물을 제거한다.","포를 사용하여 질식 소화한다.","인화점 이하로 냉각한다."],"a":3,"inc":false,"unit":"1-1"},{"id":"gisa-2016-05-08-18","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-05-08","num":18,"q":"증발잠열을 이용하여 가연물의 온도를 떨어뜨려 화재를 진압하는 소화방법은?","c":["제거소화","억제소화","질식소화","냉각소화"],"a":4,"inc":false,"unit":"1-5"},{"id":"gisa-2016-05-08-19","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-05-08","num":19,"q":"분말소화약제 중 담홍색 또는 황색으로 착색하여 사용하는 것은?","c":["탄산수소나트륨","탄산수소칼륨","제1인산암모늄","탄산수소칼륨과 요소와의 반응물"],"a":3,"inc":false,"unit":"6-1"},{"id":"gisa-2016-05-08-22","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-05-08","num":22,"q":"펌프 입구의 진공계 및 출구의 압력계 지침이 흔들리고 송출유량도 주기적으로 변화하는 이상 현상은?","c":["공동현상(cavitation)","수격작용(water hammering)","맥동현상(surging)","언밸런스(unbalance)"],"a":3,"inc":false,"unit":"4-4"},{"id":"gisa-2016-05-08-31","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-05-08","num":31,"q":"표면적이 2 m2이고 표면 온도가 60℃인 고체 표면을 20℃의 공기로 대류 열전달에 의해서 냉각한다. 평균 대류 열전달계수가 30W/m2ㆍK라고 할 때 고체표면의 열손실은 몇 W 인가?","c":["600","1200","2400","3600"],"a":3,"inc":false,"unit":"1-7"},{"id":"gisa-2016-05-08-36","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-05-08","num":36,"q":"부차적 손실계수가 5인 밸브가 관에 부착되어 있으며 물의 평균유속 4m/s 인 경우, 이 밸브에서 발생하는 부차적 손실수두는 몇 m 인가?","c":["61.3","6.13","40.8","4.08"],"a":4,"inc":false,"unit":"4-3"},{"id":"gisa-2016-05-08-37","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-05-08","num":37,"q":"지름의 비가 1 : 2인 2개의 모세관을 물 속에 수직으로 세울 때 모세관현상으로 물이 관속으로 올라가는 높이의 비는?","c":["1 : 4","1 : 2","2 : 1","4 : 1"],"a":3,"inc":false,"unit":"4-5"},{"id":"gisa-2016-05-08-43","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-05-08","num":43,"q":"다음 중 그 성질이 자연발화성 물질 및 금수성 물질인 제3류 위험물에 속하지 않는 것은?","c":["황린","황화린","칼륨","나트륨"],"a":2,"inc":false,"unit":"1-1"},{"id":"gisa-2016-05-08-44","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-05-08","num":44,"q":"다음 중 자동화재탐지설비를 설치해야 하는 특정소방대상물은?","c": ":"2016-10-01","num":28,"q":"부차적 손실계수 K = 40인 밸브를 통과할 때의 수두손실이 2m 일 때, 이 밸브를 지나는 유체의 평균 유속은 약 몇 m/s인가?","c":["0.49","0.99","1.98","9.81"],"a":2,"inc":false,"unit":"4-3"},{"id":"gisa-2016-10-01-29","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":29,"q":"두 개의 견고한 밀폐용기 A, B가 밸브로 연결되어 있다. 용기 A에는 온도 300K, 압력 100kPa의 공기 1m3, 용기 B에는 온도 300K, 압력 330kPa의 공기 2m3가 들어 있다. 밸브를 열어 두 용기 안에 들어있는 공기 (이상기체)를 혼합한 후 장시간 방치하였다. 이 때 주위 온도는 300K로 일정하다. 내부 공기의 최종압력은 약 몇 kPa 인가?","c":["177","210","215","253"],"a":4,"inc":false,"unit":"14-2"},{"id":"gisa-2016-10-01-33","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":33,"q":"화씨온도 200°F 섭씨온도(℃)로 약 얼마인가?","c":["93.3℃","186.6℃","279.9℃","392℃"],"a":1,"inc":false,"unit":"4-1"},{"id":"gisa-2016-10-01-34","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":34,"q":"공동현상(Cavitation)의 발생 원인과 가장 관계가 먼 것은?","c":["관내의 수온이 높을 때","펌프의 흡입 양정이 클 때","펌프의 설치 위치가 수원보다 낮을 때","관내의 물의 정압이 그때의 증기압보다 낮을 때"],"a":3,"inc":false,"unit":"4-4"},{"id":"gisa-2016-10-01-35","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":35,"q":"소화펌프의 회전수가 1450rpm일 때 양정이 25m, 유량이 5m3/min 이었다. 펌프의 회전수를 1740rpm으로 높일 경우 양정(m)과 유량(m3/min)은? (단, 회전차의 직경은 일정하다.)","c":["양정 : 17 유량 : 4.2","양정 : 21 유량 : 5","양정 : 30.2 유량 : 5.2","양정 : 36 유량 : 6"],"a":4,"inc":false,"unit":"4-4"},{"id":"gisa-2016-10-01-38","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":38,"q":"절대온도와 비체적이 각각 T, v인 이상기체 1kg이 압력이 P로 일정하게 유지되는 가운데 가열되어 절대온도가 6T까지 상승되었다. 이 과정에서 이상기체가 한 일은 얼마인가?","c":["Pv","3Pv","5Pv","6Pv"],"a":3,"inc":false,"unit":"14-2"},{"id":"gisa-2016-10-01-46","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":46,"q":"소방용수시설 중 소화전과 급수탑의 설치기준으로 틀린 것은?","c":["소화전은 상수도와 연결하여 지하식 또는 지상식의 구조로 할 것","소방용호스와 연결하는 소화전의 연결금속구의 구경은 65mm로 할 것","급수탑 급수배관의 구경은 100mm 이상으로 할 것","급수탑의 개폐밸브는 지상에서 1.5m 이상 1.8m 이하의 위치에 설치할 것"],"a":4,"inc":false,"unit":"4-11"},{"id":"gisa-2016-10-01-48","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":48,"q":"소화난이도등급 Ⅰ의 제조소등에 설치해야 하는 소화설비기준 중 유황만을 저장 · 취급하는 옥내탱크저장소에 설치해야 하는 소화설비는?","c":["옥내소화전설비","옥외소화전설비","물분무소화설비","고정식 포소화설비"],"a":3,"inc":false,"unit":"3-10"},{"id":"gisa-2016-10-01-49","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":49,"q":"고형알코올 그 밖에 1기압 상태에서 인화점이 40℃ 미만인 고체에 해당하는 것은?","c":["가연성고체","산화성고체","인화성고체","자연발화성물질"],"a":3,"inc":false,"unit":"1-1"},{"id":"gisa-2016-10-01-53","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":53,"q":"정기점검의 대상인 제조소등에 해당하지 않는 것은?","c":["이송취급소","이동탱크저장소","암반탱크저장소","판매취급소"],"a":4,"inc":false,"unit":"3-9"},{"id":"gisa-2016-10-01-57","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":57,"q":"하자보수 대상 소방시설 중 하자보수 보증기간이 2년이 아닌 것은?","c":["유도표지","비상경보설비","무선통신보조설비","자동화재탐지설비"],"a":4,"inc":false,"unit":"8-7"},{"id":"gisa-2016-10-01-61","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":61,"q":"항공기 격납고 포헤드의 1분당 방사량은 바닥면적 1m2당 최소 몇 L 이상이어야 하는가? (단, 수성막포 소화약제를 사용한다.)","c":["3.7","6.5","8.0","10"],"a":1,"inc":false,"unit":"5-1"},{"id":"gisa-2016-10-01-65","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":65,"q":"분말소화설비의 자동식 기동장치의 설치기준 중 틀린 것은? (단, 자동식 기동장치는 자동화재탐지설비의 감지기와 연동하는 것이다.)","c":["기동용 가스용기의 충전비는 1.5 이상으로 할 것","자동식 기동장치에는 수동으로도 기동할 수 있는 구조로 할 것","전기식 기동장치로서 3병 이상의 저장용기를 동시에 개방하는 설비는 2병 이상의 저장용기에 전자개방밸브를 부착할 것","기동용 가스용기에는 내압시험압력의 0.8배 내지 내압시험압력 이하에서 작동하는 안전장치를 설치할 것"],"a":3,"inc":false,"unit":"6-1"},{"id":"gisa-2016-10-01-67","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":67,"q":"물분무소화설비를 설치하는 주차장의 배수설비 설치기준 중 차량이 주차하는 바닥은 배수구를 향하여 얼마 이상의 기울기를 유지해야 하는가?","c":["1/100","2/100","3/100","5/100"],"a":2,"inc":false,"unit":"4-10"},{"id":"gisa-2016-10-01-68","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":68,"q":"물분무소화설비 송수구의 설치기준 중 틀린 것은?","c":["송수구에는 이물질을 막기 위한 마개를 씌울 것","지면으로부터 높이가 0.8m 이상 1.5m 이하의 위치에 설치할 것","송수구의 가까운 부분에 자동배수밸브 및 체크밸브를 설치할 것","송수구는 하나의 층의 바닥면적이 3000m2를 넘을 때마다 1개(5개를 넘을 경우에는 5개로 한다) 이상을 설치할 것"],"a":2,"inc":false,"unit":"4-10"},{"id":"gisa-2016-10-01-69","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":69,"q":"전역방출방식 고발포용 고정포방출구의 설치기준으로 옳은 것은? (단, 해당 방호구역에서 외부로 새는 양 이상의 포수용액을 유효하게 추가하여 방출하는 설비가 있는 경우는 제외한다.)","c":["고정포방출구는 바닥면적 600m2마다 1개 이상으로 할 것","고정포방출구는 방호대상물의 최고부분보다 낮은 위치에 설치할 것","개구부에 자동폐쇄장치를 설치할 것","특정소방대상물 및 포의 팽창비에 따른 종별에 관계없이 해당 방호구역의 관포체적 1m3에 대한 1분당 포수용액 방출량은 1L 이상으로 할 것"],"a":3,"inc":false,"unit":"5-2"},{"id":"gisa-2016-10-01-70","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":70,"q":"모피창고에 이산화탄소 소화설비를 전역방출 방식으로 설치할 경우 방호구역의 체적이 600m3라면 이산화탄소 소화약제의 최소 저장량은 몇 kg 인가? (단, 설계농도는 75%이고, 개구부 면적은 무시한다.)","c":["780","960","1200","1620"],"a":4,"inc":false,"unit":"6-2"},{"id":"gisa-2016-10-01-72","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":72,"q":"근린생활시설 지하층에 적응성이 있는 피난기구는? (단, 입원실이 있는 의원·산후조리원·접골원·조산소는 제외한다.)","c":["피난사다리","미끄럼대","구조대","피난교"],"a":1,"inc":false,"unit":"7-3"},{"id":"gisa-2016-10-01-74","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":74,"q":"분말소화설비 분말소화약제 1kg당 저장용기의 내용적 기준으로 틀린 것은?","c":["제1종 분말 : 0.8L","제2종 분말 : 1.0L","제3종 분말 : 1.0L","제4종 분말 : 1.8L"],"a":4,"inc":false,"unit":"6-1"},{"id":"gisa-2016-10-01-75","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":75,"q":"특수가연물을 저장 또는 취급하는 랙크식 창고의 경우에는 스프링클러헤드를 설치하는 천장 · 반자 · 천장과 반자사이 · 덕트 · 선반 등의 각 부분으로부터 하나의 스프링클러헤드까지의 수평거리 기준은 몇 m 이하인가? (단, 성능이 별도로 인정된 스프링클러헤드를 수리계산에 따라 설치하는 경우는 제외한다.)","c":["1.7","2.5","3.2","4"],"a":1,"inc":false,"unit":"3-2"},{"id":"gisa-2016-10-01-76","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2016-10-01","num":76,"q":"옥내소화전설비 배관의 설치기준 중 틀린 것은?","c":["옥내소화전방수구와 연결되는 가지배관의 구경은 40mm 이상으로 한다.","연결송수관설비의 배관과 겸용할 경우 주배관의 구경은 100mm 이상으로 한다.","펌프의 토출 측 주배관의 구경은 유속이 4m/s 이하가 될 수 있는 크기 이상으로 한다.","주배관중 수직배관의 구경은 15mm 이상으로 한다."],"a":4,"inc":false,"unit":"4-6"},{"id":"gisa-2017-03-05-1","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":1,"q":"분말소화약제 중 탄산수소칼륨(KHCO3)과 요소(CO(NH2)2)와의 반응물을 주성분으로 하는 소화약제는?","c":["제1종 분말","제2종 분말","제3종 분말","제4종 분말"],"a":4,"inc":false,"unit":"6-1"},{"id":"gisa-2017-03-05-3","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":3,"q":"유류 저장탱크의 화재에서 일어날 수 있는 현상이 아닌 것은?","c":["플래시 오버(Flash Over)","보일 오버(Boil Over)","슬롭 오버(Slop Over)","후로스 오버(Froth Over)"],"a":1,"inc":false,"unit":"1-18"},{"id":"gisa-2017-03-05-6","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":6,"q":"A급, B급, C급 화재에 사용이 가능한 제3종 분말 소화약제의 분자식은?","c":["NaHCO3","KHCO3","NH4H2PO4","Na2CO3"],"a":3,"inc":false,"unit":"6-1"},{"id":"gisa-2017-03-05-9","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":9,"q":"물질의 연소범위와 화재 위험도에 대한 설명으로 틀린 것은?","c":["연소범위의 폭이 클수록 화재 위험이 높다.","연소범위의 하한계가 낮을수록 화재 위험이 높다.","연소범위의 상한계가 높을수록 화재 위험이 높다.","연소범위의 하한계가 높을수록 화재 위험이 높다"],"a":4,"inc":false,"unit":"1-3"},{"id":"gisa-2017-03-05-13","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":13,"q":"가연물의 제거와 가장 관련이 없는 소화방법은?","c":["촛불을 입김으로 불어서 끈다.","산불 화재 시 나무를 잘라 없앤다.","팽창 진주암을 사용하여 진화한다.","가스화재 시 중간밸브를 잠근다."],"a":3,"inc":false,"unit":"1-5"},{"id":"gisa-2017-03-05-15","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":15,"q":"다음 중 가연성 가스가 아닌 것은?","c":["일산화탄소","프로판","아르곤","수소"],"a":3,"inc":false,"unit":"3-1"},{"id":"gisa-2017-03-05-17","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":17,"q":"고층 건축물 내 연기거동 중 굴뚝효과에 영향을 미치는 요소가 아닌 것은?","c":["건물 내 · 외의 온도차","화재실의 온도","건물의 높이","층의 면적"],"a":4,"inc":false,"unit":"1-15"},{"id":"gisa-2017-03-
