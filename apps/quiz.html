설비가 아닌 것은?","c":["통합감시시설","가스누설경보기","비상콘센트설비","자동화재속보설비"],"a":3,"inc":false,"unit":"3-10"},{"id":"gisa-2020-06-06-54","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-06-06","num":54,"q":"화재예방, 소방시설 설치ㆍ유치 및 안전관리에 관한 법률상 소방시설 등에 대한 자체점검 중 종합정밀점검 대상인 것은?","c":["제연설비가 설치되지 않은 터널","스프링클러설비가 설치된 연면적이 5,000m2이고 12층인 아파트","물분무등소화설비가 설치된 연면적이 5,000m2인 위험물 제조소","호스릴 방식의 물분무등소화설비만을 설치한 연면적 3,000m2인 특정소방대상물"],"a":2,"inc":false,"unit":"4-7"},{"id":"gisa-2020-06-06-56","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-06-06","num":56,"q":"위험물안전관리법령상 제조소등의 경보설비 설치기준에 대한 설명으로 틀린 것은?","c":["제조소 및 일반취급소의 연면적이 500m2 이상인것에는 자동화재탐지설비를 설치한다.","자동신호장치를 갖춘 스프링클러설비 또는 물분무등소화설비를 설치한 제조소등에 있어서는 자동화재탐지설비를 설치한 것으로 본다.","경보설비는 자동화재탐지설비ㆍ비상경보설비(비상벨장치 또는 경종 포함)ㆍ확성장치(휴대용확성기 포함) 및 비상방송설비로 구분한다.","지정수량의 10배 이상의 위험물을 저장 또는 취급하는 제조소등(이동탱크저장소를 포함한다)에는 화재발생 시 이를 알릴 수 있는 경보설비를 설치하여야 한다."],"a":4,"inc":false,"unit":"3-10"},{"id":"gisa-2020-06-06-61","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-06-06","num":61,"q":"분말소화설비의 화재안전기준상 차고 또는 주차장에 설치하는 분말소화설비의 소화약제는?","c":["인산염을 주성분으로 한 분말","탄산수소칼륨을 주성분으로 한 분말","탄산수소칼륨과 요소가 화합된 분말","탄산수소나트륨을 주성분으로 한 분말"],"a":1,"inc":false,"unit":"6-1"},{"id":"gisa-2020-06-06-62","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-06-06","num":62,"q":"할론소화설비의 화재안전기준상 축압식 할론소화약제 저장용기에 사용되는 축압용가스로서 적합한 것은?","c":["질 소","산 소","이산화탄소","불활성 가스"],"a":1,"inc":false,"unit":"6-3"},{"id":"gisa-2020-06-06-63","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-06-06","num":63,"q":"물분무소화설비의 화재안전기준에 따른 물분무소화설비의 설치 장소별 1m2당 수원의 최소 저수량으로 맞는 것은?","c":["차고 : 30L/min×20분×바닥면적","케이블트레이 : 12L/min×20분×투영된 바닥면적","컨베이어 벨트 : 37L/min×20분×벨트부분의 바닥면적","특수가연물을 취급하는 특정소방대상물 : 20L/min×20분×바닥면적"],"a":2,"inc":false,"unit":"4-10"},{"id":"gisa-2020-06-06-65","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-06-06","num":65,"q":"피난기구를 설치하여야 할 소방대상물 중 피난기구의 2분의 1을 감소할 수 있는 조건이 아닌 것은?","c":["주요구조부가 내화구조로 되어 있다.","특별피난계단이 2 이상 설치되어 있다.","소방구조용(비상용) 엘리베이터가 설치되어 있다.","직통계단인 피난계단이 2 이상 설치되어 있다."],"a":3,"inc":false,"unit":"7-3"},{"id":"gisa-2020-06-06-67","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-06-06","num":67,"q":"포소화설비의 화재안전기준에 따라 바닥면적이 180m2인 건축물 내부에 호스릴 방식의 포소화설비를 설치할 경우 가능한 포소화약제의 최소 필요량은 몇 L인가? (단, 호스 접결구 : 2개, 약제 농도 : 3%)","c":["180","270","650","720"],"a":2,"inc":false,"unit":"5-1"},{"id":"gisa-2020-06-06-69","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-06-06","num":69,"q":"스프링클러설비의 화재안전기준에 따라 개방형스프링클러설비에서 하나의 방수구역을 담당하는 헤드 개수는 최대 몇 개 이하로 설치하여야 하는가?","c":["30","40","50","60"],"a":3,"inc":false,"unit":"4-7"},{"id":"gisa-2020-06-06-72","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-06-06","num":72,"q":"난방설비가 없는 교육장소에 비치하는 소화기로 가장 적합한 것은? (단, 교육장소의 겨울 최저온도는 –15℃ 이다)","c":["화학포소화기","기계포소화기","산알칼리 소화기","ABC 분말소화기"],"a":4,"inc":false,"unit":"4-5"},{"id":"gisa-2020-06-06-73","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-06-06","num":73,"q":"스프링클러설비의 화재안전기준에 따라 연소할 우려가 있는 개구부에 드렌처설비를 설치한 경우 해당 개구부에 한하여 스프링클러헤드를 설치하지 아니할 수 있다. 관련 기준으로 틀린 것은?","c":["드렌처헤드는 개구부 위 측에 2.5m 이내마다 1개를 설치할 것","제어밸브는 특정소방대상물 층마다에 바닥면으로부터 0.5m 이상 1.5m 이하의 위치에 설치할 것","드렌처헤드가 가장 많이 설치된 제어밸브에 설치된 드렌처헤드를 동시에 사용하는 경우에 각 헤드 선단의 방수압력은 0.1MPa 이상이 되도록 할 것","드렌처헤드가 가장 많이 설치된 제어밸브에 설치된 드렌처헤드를 동시에 사용하는 경우에 각 헤드선단의 방수량은 80L/min 이상이 되도록 할 것"],"a":2,"inc":false,"unit":"2-2"},{"id":"gisa-2020-06-06-75","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-06-06","num":75,"q":"분말소화설비의 화재안전기준에 따라 분말소화약제의 가압용가스 용기에는 최대 몇 MPa 이하의 압력에서 조정이 가능한 압력조정기를 설치하여야 하는가?","c":["1.5","2.0","2.5","3.0"],"a":3,"inc":false,"unit":"6-1"},{"id":"gisa-2020-06-06-77","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-06-06","num":77,"q":"이산화탄소소화설비의 화재안전기준에 따른 이산화탄소소화설비 기동장치의 설치기준으로 맞는 것은?","c":["가스압력식 기동장치 기동용가스용기의 용적은 3L 이상으로 한다.","수동식 기동장치는 전역방출방식에 있어서 방호대상물마다 설치한다.","수동식 기동장치의 부근에는 소화약제의 방출을 지 ,"1.5","2","2.5"],"a":2,"inc":false,"unit":"6-1"},{"id":"gisa-2020-08-22-67","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-08-22","num":67,"q":"소화기의 형식승인 및 제품검사의 기술기준상 A급 화재용 소화기의 능력단위 산정을 위한 소화능력시험의 내용으로 틀린 것은?","c":["모형 배열 시 모형 간의 간격은 3m 이상으로 한다.","소화는 최초의 모형에 불을 붙인 다음 1분 후에 시작한다.","소화는 무풍상태(풍속 0.5m/s 이하)와 사용상태에서 실시한다.","소화약제의 방사가 완료된 때 잔염이 없어야 하며, 방사완료 후 2분 이내에 다시 불타지 아니한 경우 그 모형은 완전히 소화된 것으로 본다."],"a":2,"inc":false,"unit":"4-5"},{"id":"gisa-2020-08-22-72","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-08-22","num":72,"q":"스프링클러설비의 화재안전기준상 스프링클러헤드를 설치하는 천장·반자·천장과 반자사이·덕트·선반 등의 각 부분으로부터 하나의 스프링클러헤드까지의 수평거리 기준으로 틀린 것은? (단, 성능이 별도로 인정된 스프링클러헤드를 수리계산에 따라 설치하는 경우는 제외한다.)","c":["무대부에 있어서는 1.7m 이하","공동주택(아파트) 세대 내의 거실에 있어서는 3.2m 이하","특수가연물을 저장 또는 취급하는 장소에 있어서는 2.1m 이하","특수가연물을 저장 또는 취급하는 랙크식 창고의 경우에는 1.7m 이하"],"a":3,"inc":false,"unit":"4-7"},{"id":"gisa-2020-08-22-73","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-08-22","num":73,"q":"이산화탄소소화설비의 화재안전기준상 전역방출방식의 이산화탄소소화설비의 분사헤드 방사압력은 저압식인 경우 최소 몇 MPa 이상이어야 하는가?","c":["0.5","1.05","1.4","2.0"],"a":2,"inc":false,"unit":"6-2"},{"id":"gisa-2020-08-22-75","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-08-22","num":75,"q":"스프링클러설비의 화재안전기준상 스프링클러설비의 교차배관에서 분기되는 지점을 기점으로 한쪽 가지배관에 설치되는 헤드의 개수는 최대 몇 개 이하인가? (단, 방호구역 안에서 칸막이 등으로 구획하여 헤드를 증설하는 경우와 격자형 배관방식을 채택하는 경우는 제외한다.)","c":["8","10","12","15"],"a":1,"inc":false,"unit":"4-11"},{"id":"gisa-2020-08-22-78","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-08-22","num":78,"q":"이산화탄소소화설비의 화재안전기준상 저압식 이산화탄소 소화약제 저장용기에 설치하는 안전밸브의 작동압력은 내압시험압력의 몇 배에서 작동해야 하는가?","c":["0.24 ~ 0.4","0.44 ~ 0.6","0.64 ~ 0.8","0.84 ~ 1"],"a":3,"inc":false,"unit":"6-2"},{"id":"gisa-2020-08-22-79","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-08-22","num":79,"q":"소화기구 및 자동소화장치의 화재안전기준상 노유자시설은 당해용도의 바닥면적 얼마 마다 능력단위 1단위 이상의 소화기구를 비치해야 하는가?","c":["바닥면적 30m2 마다","바닥면적 50m2 마다","바 catShort":"기사","round":"2020-09-26","num":57,"q":"소방기본법령상 특수가연물의 품명과 지정수량 기준의 연결이 틀린 것은?","c":["사류 - 1000㎏ 이상","볏짚류 - 3000㎏ 이상","석탄·목탄류 - 10000㎏ 이상","합성수지류 중 발포시킨 것 - 20m3 이상"],"a":2,"inc":false,"unit":"3-2"},{"id":"gisa-2020-09-26-59","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-09-26","num":59,"q":"화재예방, 소방시설 설치·유지 및 안전관리에 관한 법령상 정당한 사유 없이 피난시설, 방화구획 및 방화시설의 유지·관리에 필요한 조치 명령을 위반한 경우 이에 대한 벌칙 기준으로 옳은 것은?(문제 오류로 가답안 발표시 4번으로 발표되었지만 확정답안 발표시 모두 정답처리 되었습니다. 여기서는 가답안인 4번을 누르면 정답 처리 됩니다.)","c":["200만원 이하의 벌금","300만원 이하의 벌금","1년 이하의 징역 또는 1000만원 이하의 벌금","3년 이하의 징역 또는 1500만원 이하의 벌금"],"a":4,"inc":false,"unit":"2-1"},{"id":"gisa-2020-09-26-62","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-09-26","num":62,"q":"분말소화설비의 화재안전기준에 따른 분말소화설비의 배관과 선택밸브의 설치기준에 대한 내용으로 틀린 것은?","c":["배관은 겸용으로 설치할 것","선택밸브는 방호구역 또는 방호대상물마다 설치할 것","동관은 고정압력 또는 최고사용압력의 1.5배 이상의 압력에 견딜 수 있는 것을 사용할 것","강관은 아연도금에 따른 배관용탄소강관이나 이와 동등 이상의 강도·내식성 및 내열성을 가진 것을 사용할 것"],"a":1,"inc":false,"unit":"6-1"},{"id":"gisa-2020-09-26-63","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-09-26","num":63,"q":"피난기구의 화재안전기준에 따라 숙박시설·노유자시설 및 의료시설로 사용되는 층에 있어서는 그 층의 바닥면적이 몇 m2 마다 피난기구를 1개 이상 설치해야하는가?","c":["300","500","800","1000"],"a":2,"inc":false,"unit":"7-3"},{"id":"gisa-2020-09-26-65","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-09-26","num":65,"q":"소화기구 및 자동소화장치의 화재안전기준에 따른 캐비닛형자동소화장치 분사헤드의 설치 높이 기준은 방호구역의 바닥으로부터 얼마이어야 하는가?(관련 규정 개정전 문제로 여기서는 기존 정답인 4번을 누르면 정답 처리됩니다. 자세한 내용은 해설을 참고하세요.)","c":["최소 0.1m 이상 최대 2.7m 이하","최소 0.1m 이상 최대 3.7m 이하","최소 0.2m 이상 최대 2.7m 이하","최소 0.2m 이상 최대 3.7m 이하"],"a":4,"inc":false,"unit":"4-5"},{"id":"gisa-2020-09-26-66","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2020-09-26","num":66,"q":"할로겐화합물 및 불활성기체소화설비의 화재안전기준에 따른 할로겐화합물 및 불활성기체소화설비의 수동식 기동장치의 설치기준에 대한 설명으로 틀린 것은?","c":["5㎏ 이상의 힘을 가하여 기동할 수 있는 구조로 할 것","전기를 사용하는 기동장치에는 전원표시등을 설치할 것","기동장치의 방출용스위치는 음향경보장치와 연동하여 조작될 수 있는 것으로 할 것","해 m이고 열전도율 4W(m·K)인 벽의 내부 표면온도는 20℃이고, 외부 벽은 -10℃인 공기에 노출되어 있어 대류열전달이 일어난다. 외부의 대류열전달계수가 20W/(m2·K) 일 때, 정상상태에서 벽의 외부표면온도(℃)는 얼마인가? (단, 복사열전달은 무시한다.)","c":["5","10","15","20"],"a":1,"inc":false,"unit":"1-7"},{"id":"gisa-2021-03-07-29","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-03-07","num":29,"q":"베르누이 방정식을 적용할 수 있는 기본 전제조건으로 옳은 것은?","c":["비압축성 흐름, 점성 흐름, 정상 유동","압축성 흐름, 비점성 흐름, 정상 유동","비압축성 흐름, 비점성 흐름, 비정상 유동","비압축성 흐름, 비점성 흐름, 정상 유동"],"a":4,"inc":false,"unit":"4-2"},{"id":"gisa-2021-03-07-42","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-03-07","num":42,"q":"위험물안전관리법령상 인화성액체위험물(이황화탄소를 제외)의 옥외탱크저장소의 탱크 주위에 설치하여야 하는 방유제의 기준 중 틀린 것은?","c":["방유제의 용량은 방유제안에 설치된 탱크가 하나인 때에는 그 탱크 용량의 110% 이상으로 할 것","방유제의 용량은 방유제안에 설치된 탱크가 2기 이상인 때에는 그 탱크 중 용량이 최대인 것의 용량의 110% 이상으로 할 것","방유제는 높이 1m 이상 2m 이하, 두께 0.2m 이상, 지하매설깊이 0.5m 이상으로 할 것","방유제내의 면적은 80000m2 이하로 할 것"],"a":3,"inc":false,"unit":"3-9"},{"id":"gisa-2021-03-07-43","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-03-07","num":43,"q":"소방시설공사업법령상 공사감리자 지정대상 특정소방대상물의 범위가 아닌 것은?","c":["물분무등소화설비(호스릴 방식의 소화설비는 제외)를 신설·개설하거나 방호·방수 구역을 증설할 때","재연설비를 신설·개설하거나 제연구역을 증설할 때","연소방지설비를 신설·개설하거나 살수구역을 증설할 때","캐비닛형 간이스프링클러설비를 신설·개설 하거나 방호·방수 구역을 증설할 때"],"a":4,"inc":false,"unit":"4-7"},{"id":"gisa-2021-03-07-45","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-03-07","num":45,"q":"화재예방, 소방시설 설치·유치 및 안전관리에 관한 법령상 대통령령 또는 화재안전기준이 변경되어 그 기준이 강화되는 경우 기존 특정소방대상물 소방시설 중 강화된 기준을 적용하여야 하는 소방시설은?","c":["비상경보설비","비상방송설비","비상콘센트설비","옥내소화전설비"],"a":1,"inc":false,"unit":"4-6"},{"id":"gisa-2021-03-07-46","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-03-07","num":46,"q":"화재예방, 소방시설 설치·유지 및 안전관리에 관한 법령상 지하가는 연면적이 최소 몇 m2이상이어야 스프링클러설비를 설치하여야 하는 특정소방대상물에 해당하는가? (단, 터널은 제외한다.)","c":["100","200","1000","2000"],"a":3,"inc":false,"unit":"4-7"},{"id":"gisa-2021-03-07-47","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-03-07","num":47,"q":"화재 예방, 소방시설 설치·유지 및 안전관리에 관한 법령상 특정소방대상물의 관계인이 수행하여야 하는 소방안전관리 업무가 아닌 것은?","c":["소방훈련의 지도·감독","화기(火氣) 취급의 감독","피난시설, 방화구획 및 방화시설의 유지·관리","소방시설이나 그 밖의 소방 관련 시설의 유지·관리"],"a":1,"inc":false,"unit":"2-1"},{"id":"gisa-2021-03-07-50","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-03-07","num":50,"q":"소방기본법령상 화재조사의 종류 중 화재원인조사에 해당하지 않는 것은?","c":["발화원인 조사","인명피해 조사","연소상황 조사","소방시설 등 조사"],"a":2,"inc":false,"unit":"1-17"},{"id":"gisa-2021-03-07-52","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-03-07","num":52,"q":"화재예방, 소방시설 설치·유지 및 안전관리에 관한 법령상 소방안전관리대상물의 소방계획서에 포함되어야 하는 사항이 아닌 것은?","c":["소방시설·피난시설 및 방화시설의 점검·정비계획","위험물안전관리법에 따라 예방규정을 정하는 제조소등의 위험물 저장·취급에 관한 사항","특정소방대상물의 근무자 및 거주자의 자위소방대 조직과 대원의 임무에 관한 사항","방화구획, 제연구획, 건축물의 내부 마감 재료(불연재료·준불연재료 또는 난연재료로 사용된 것) 및 방염물품의 사용현황과 그 밖의 방화구조 및 설비의 유지·관리계획"],"a":2,"inc":false,"unit":"2-3"},{"id":"gisa-2021-03-07-56","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-03-07","num":56,"q":"소방기본법령상 소방용수시설의 설치기준 중 급수탑의 급수배관의 구경은 최소 몇mm 이상이어야 하는가?","c":["100","150","200","250"],"a":1,"inc":false,"unit":"4-11"},{"id":"gisa-2021-03-07-61","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-03-07","num":61,"q":"스프링클러설비의 화재안전기준상 폐쇄형 스프링클러헤드의 방호구역·유수검지장치에 대한 기준으로 틀린 것은?","c":["하나의 방호구역에는 1개 이상의 유수검지장치를 설치하되, 화재발생시 접근이 쉽고 점검하기 편리한 장소에 설치할 것","하나의 방호구역에는 2개 층에 미치지 아니하도록 할 것. 다만, 1개 층에 설치되는 스프링클러헤드의 수가 10개 이하인 경우와 복층형구조의 공동주택에는 3개 층 이내로 할 수 있다.","송수구를 통하여 스프링클러헤드에 공급되는 물은 유수검지장치 등을 지나도록 할 것","조기반응형 스프링클러헤드를 설치하는 경우에는 습식유수검지장치 또는 부압식스프링클러설비를 설치할 것"],"a":3,"inc":false,"unit":"4-7"},{"id":"gisa-2021-03-07-62","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-03-07","num":62,"q":"스프링클러설비의 화재안전기준상 조기반응형 스프링클러헤드를 설치해야 하는 장소가 아닌 것은?","c":["수련시설의 침실","공동주택의 거실","오피스텔의 침실","병원의 입원실"],"a":1,"inc":false,"unit":"4-7"},{"id":"gisa-2021-03-07-63","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-03-07","num":63,"q":"스프링클러설비의 화재안전기준상 스프링클러설비를 설치하여야 할 특정소방대상물에 있어서 스프링클러헤드를 설치하지 아니할 수 있는 장소 기준으로 틀린 것은?","c":["천장과 반자 양쪽이 불연재료로 되어 있고 천장과 반자사이의 거리가 2.5m 미만인 부분","천장 및 반자가 불연재료 외의 것으로 되어 있고 천장과 반자사이의 거리가 0.5m 미만인 부분","천장·반자 중 한쪽이 불연재료로 되어 있고 천장과 반자사이의 거리가 1m 미만인 부분","현관 또는 로비 등으로서 바닥으로부터 높이가 20m 이상인 장소"],"a":1,"inc":false,"unit":"4-7"},{"id":"gisa-2021-03-07-64","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-03-07","num":64,"q":"물분무소화설비의 화재안전기준상 배관의 설치 기준으로 틀린 것은?","c":["펌프 흡입측 배관은 공기고임의 생기지 않는 구조로 하고 여과장치를 설치한다.","펌프의 흡입측 배관은 수조가 펌프보다 낮게 설치된 경우에는 각 펌프(충압펌프를 포함한다)마다 수조로부터 별도로 설치한다.","연결송수관설비의 배관과 겸용할 경우의 주배관은 구경 100mm 이상으로 한다.","연결송수관설비의 배관과 겸용할 경우 방수구로 연결되는 배관의 구경은 65mm 이하로 한다."],"a":4,"inc":false,"unit":"4-10"},{"id":"gisa-2021-03-07-65","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-03-07","num":65,"q":"분말소화설비의 화재안전기준상 배관에 관한 기준으로 틀린 것은?","c":["배관은 전용으로 할것","배관은 모두 스케줄 40 이상으로 할 것","동관을 사용하는 경우의 배관은 고정압력 또는 최고사용압력의 1.5배 이상의 압력에 견딜 수 있는 것을 사용할 것","밸브류는 개폐위치 또는 개폐방향을 표시한 것으로 할 것"],"a":2,"inc":false,"unit":"6-1"},{"id":"gisa-2021-03-07-66","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-03-07","num":66,"q":"물분무소화설비의 화재안전기준상 수원의 저수량 설치 기준으로 틀린 것은?","c":["특수가연물을 저장 또는 취급하는 특정소방대상물 또는 그 부분에 있어서 그 바닥면적(최대 방수구역의 바닥면적을 기준으로 하며, 50m2 이하인 경우에는 50m2) 1m2에 대하여 10 ℓ/min로 20분간 방수할 수 있는 양 이상으로 할 것","차고 또는 주차장은 그 바닥면적(최대방수구역의 바닥면적을 기준으로 하며, 50m2 이하인 경우에는 50m2) 1 m2에 대하여 20 ℓ/min로 20분간 방수할 수 있는 양 이상으로 할 것","케이블트레이, 케이블덕트 등은 투영된 바닥면적 1m2에 대하여 12ℓ/min로 20분간 방수할 수 있는 양 이상으로 할 것","콘베이어 벨트 등은 벨트부분의 바닥면적 1m2에 대하여 20 ℓ/min로 20분간 방수할 수 있는 양 이상으로 할 것"],"a":4,"inc":false,"unit":"4-10"},{"id":"gisa-2021-03-07-67","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-03-07","num":67,"q":"분말소화설비의 화재안전기준상 제1종 분말을 사용한 전역방출방식 분말소화설비에서 방호구역의 체적 1m3에 대한 소화약제의 양은 몇 kg인가?","c":["0.24","0.36","0.60","0.72"],"a":3,"inc":false,"unit":"6-1"},{"id":"gisa-2021-03-07-68","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-03-07","num":68,"q" ","기동장치의 조작부는 바닥으로부터 높이 0.8m 이상 1.5m 이하의 위치에 설치하고, 보호판 등에 따른 보호장치를 설치할 것","기동장치의 방출용 스위치는 음향경보장치와 연동하여 조작될 수 있는 것으로 할 것"],"a":1,"inc":false,"unit":"6-2"},{"id":"gisa-2021-05-15-69","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-05-15","num":69,"q":"옥내소화전설비의 화재안전기준상 옥내소화전펌프의 후드밸브를 소방용 설비외의 다른 설비의 후드밸브보다 낮은 위치에 설치한 경우의 유효수량으로 옳은 것은? (단, 옥내소화전설비와 다른 설비 수원을 저수조로 겸용하여 사용한 경우이다.)","c":["저수조의 바닥면과 상단 사이의 전체 수량","옥내소화전설비 후드밸브와 소방용 설비외의 다른 설비의 후드밸브 사이의 수량","옥내소화전설비의 후드밸브와 저수조 상단 사이의 수량","저수조의 바닥면과 소방용 설비 외의 다른 설비의 후드밸브 사이의 수량"],"a":2,"inc":false,"unit":"4-6"},{"id":"gisa-2021-05-15-70","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-05-15","num":70,"q":"포소화설비의 화재안전기준상 포소화설비의 배관 등의 설치기준으로 옳은 것은?","c":["포워터스프링클러설비 또는 포헤드설비의 가지 배관의 배열은 토너먼트방식으로 한다.","송액관은 겸용으로 하여야 한다. 다만, 포소화전의 기동장치의 조작과 동시에 다른 설비의 용도에 사용하는 배관의 송수를 차단할 수 있거나, 포소화설비의 성능에 지장이 없는 경우에는 전용으로 할 수 있다.","송액관은 포의 방출 종료 후 배관안의 액을 배출하기 위하여 적당한 기울기를 유지하도록 하고 그 낮은 부분에 배액밸브를 설치하여야 한다.","연결송수관설비의 배관과 겸용할 경우의 주배관은 구경 65 mm 이상, 방수구로 연결되는 배관의 구경은 100 mm 이상의 것으로 하여야 한다."],"a":3,"inc":false,"unit":"4-7"},{"id":"gisa-2021-05-15-71","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-05-15","num":71,"q":"물분무소화설비의 화재안전기준상 송수구의 설치기준으로 틀린 것은?","c":["구경 65mm 의 쌍구형으로 할 것","지면으로부터 높이가 0.5m 이상 1m 이하의 위치에 설치할 것","송수구는 하나의 층의 바닥면적이 1500m2를 넘을 때마다 1개(5개를 넘을 경우에는 5개로 한다) 이상을 설치할 것","가연성가스의 저장・취급시설에 설치하는 송수구는 그 방호대상물로부터 20m 이상의 거리를 두거나 방호대상물에 면하는 부분이 높이 1.5m 이상, 폭 2.5m 이상의 철근콘크리트 벽으로 가려진 장소에 설치할 것"],"a":3,"inc":false,"unit":"4-10"},{"id":"gisa-2021-05-15-74","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-05-15","num":74,"q":"포소화설비의 화재안전기준상 펌프의 토출관에 압입기를 설치하여 포 소화약제 압입용 펌프로 포 소화약제를 압입시켜 혼합하는 방식은?","c":["라인 푸로포셔너 방식","펌프 푸로포셔너 방식","프레져 푸로포셔너 방식","프레져사이드 푸로포셔너 방식"],"a":4,"inc":false,"unit":"5-1"},{"id":"gisa-2021-05-15-77","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-05-15","num":77,"q":"소화기구 및 자동소화장치의 화재안전기준에 따른 용어에 대한 정의로 틀린 것은?","c":["\"소화약제\"란 소화기구 및 자동소화장치에 사용되는 소화성능이 있는 고체・액체 및 기체의 물질을 말한다.","\"대형소화기”란 화재 시 사람이 운반할 수 있도록 운반대와 바퀴가 설치되어 있고 능력 단위가 A급 20단위 이상, B급 10단위 이상인 소화기를 말한다.","\"전기화재(C급 화재)”란 전류가 흐르고 있는 전기기기, 배선과 관련된 화재를 말한다.","\"능력단위\"란 소화기 및 소화약제에 따른 간이소화용구에 있어서는 소방시설법에 따라 형식승인 된 수치를 말한다."],"a":2,"inc":false,"unit":"4-5"},{"id":"gisa-2021-05-15-78","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-05-15","num":78,"q":"옥내소화전설비의 화재안전기준상 배관 등에 관한 설명으로 옳은 것은?","c":["펌프의 토출측 주배관의 구경은 유속이 5m/s 이하가 될 수 있는 크기 이상으로 하여야 한다.","연결송수관설비의 배관과 겸용할 경우의 주배관은 구경 80mm 이상, 방수구로 연결되는 배관의 구경은 65mm 이상의 것으로 하여야 한다.","성능시험배관은 펌프의 토출측에 설치된 개폐밸브 이전에서 분기하여 설치하고, 유량측정장치를 기준으로 전단 직관부에 개폐밸브를 후단 직관부에는 유량조절밸브를 설치하여야 한다.","가압송수장치의 체절운전 시 수온의 상승을방지하기 위하여 체크밸브와 펌프사이에서 분기한 구경 20mm 이상의 배관에 체절압력 이상에서 개방되는 릴리프밸브를 설치하여야 한다."],"a":3,"inc":false,"unit":"4-6"},{"id":"gisa-2021-05-15-79","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-05-15","num":79,"q":"소화전함의 성능인증 및 제품검사의 기술기준상 옥내 소화전함의 재질을 합성수지 재료로 할 경우 두께는 최소 몇 mm 이상이어야 하는가?","c":["1.5","2.0","3.0","4.0"],"a":4,"inc":false,"unit":"4-6"},{"id":"gisa-2021-09-12-1","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":1,"q":"소화기구 및 자동소화장치의 화재안전기준에 따르면 소화기구(자동확산소화기는 제외)는 거주자 등이 손쉽게 사용할 수 있는 장소에 바닥으로부터 높이 몇 m 이하의 곳에 비치하여야 하는가?","c":["0.5","1.0","1.5","2.0"],"a":3,"inc":false,"unit":"4-5"},{"id":"gisa-2021-09-12-6","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":6,"q":"물리적 소화방법이 아닌 것은?","c":["연쇄반응의 억제에 의한 방법","냉각에 의한 방법","공기와의 접촉 차단에 의한 방법","가연물 제거에 의한 방법"],"a":1,"inc":false,"unit":"1-5"},{"id":"gisa-2021-09-12-8","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":8,"q":"마그네슘의 화재에 주수하였을 때 물과 마그네슘의 반응으로 인하여 생성되는 가스는?","c":["산소","수소","일산화탄소","이산화탄소"],"a":2,"inc":false,"unit":"6-2"},{"id":"gisa-2021-09-12-9","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":9,"q":"제2종 분말소화약제의 주성분으로 옳은 것은?","c":["NaH2PO4","KH2PO4","NaHCO3","KHCO3"],"a":4,"inc":false,"unit":"6-1"},{"id":"gisa-2021-09-12-10","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":10,"q":"조연성가스로만 나열되어 있는 것은?","c":["질소, 불소, 수증기","산소, 불소, 염소","산소, 이산화탄소, 오존","질소, 이산화탄소, 염소"],"a":2,"inc":false,"unit":"6-2"},{"id":"gisa-2021-09-12-12","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":12,"q":"건축물 화재에서 플래시 오버(Flash over) 현상이 일어나는 시기는?","c":["초기에서 성장기로 넘어가는 시기","성장기에서 최성기로 넘어가는 시기","최성기에서 감쇠기로 넘어가는 시기","감쇠기에서 종기로 넘어가는 시기"],"a":2,"inc":false,"unit":"1-13"},{"id":"gisa-2021-09-12-13","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":13,"q":"물과 반응하였을 때 가연성 가스를 발생하여 화재의 위험성이 증가하는 것은?","c":["과산화칼슘","메탄올","칼륨","과산화수소"],"a":3,"inc":false,"unit":"3-1"},{"id":"gisa-2021-09-12-15","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":15,"q":"다음 중 공기에서의 연소범위를 기준으로 했을 때 위험도(H) 값이 가장 큰 것은?","c":["디에틸에테르","수소","에틸렌","부탄"],"a":1,"inc":false,"unit":"1-3"},{"id":"gisa-2021-09-12-16","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":16,"q":"소화약제로 사용되는 이산화탄소에 대한 설명으로 옳은 것은?","c":["산소와 반응 시 흡열반응을 일으킨다.","산소와 반응하여 불연성 물질을 발생시킨다.","산화하지 않으나 산소와는 반응한다.","산소와 반응하지 않는다."],"a":4,"inc":false,"unit":"6-2"},{"id":"gisa-2021-09-12-18","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":18,"q":"물리적 폭발에 해당하는 것은?","c":["분해 폭발","분진 폭발","중합 폭발","수증기 폭발"],"a":4,"inc":false,"unit":"1-20"},{"id":"gisa-2021-09-12-22","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":22,"q":"표면장력에 관련된 설명 중 옳은 것은?","c":["표면장력의 차원은 힘/면적이다.","액체와 공기의 경계면에서 액체분자의 응집력보다 공기분자와 액체분자 사이의 부착력이 클 때 발생된다.","대기 중의 물방울은 크기가 작을수록 내부압력이 크다.","모세관현상에 의한 수면 상승 높이는 모세관의 직경에 비례한다."],"a":3,"inc":false,"unit":"4-5"},{"id":"gisa-2021-09-12-28","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":28,"q":"열역학 관련 설명 중 틀린 것은?","c":["삼중점에서는 물체의 고상, 액상, 기상이 공존한다.","압력이 증가하면 물의 끓는점도 높아진다.","열을 완전히 일로 변환할 수 있는 효율이 100%인 열기관은 만들 수 없다.","기체의 정적비열은 정압비열보다 크다."],"a":4,"inc":false,"unit":"1-8"},{"id":"gisa-2021-09-12-30","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":30,"q":"밀도가 10kg/m3 인 유체가 지름 30cm인 관내를 1m3/s 로 흐른다. 이때의 평균유속은 몇 m/s 인가?","c":["4.25","14.1","15.7","84.9"],"a":2,"inc":false,"unit":"4-1"},{"id":"gisa-2021-09-12-31","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":31,"q":"초기 상태에서 압력 100kPa, 온도 15℃인 공기가 있다. 공기의 부피가 초기 부피의 1/20이 될 때까지 가역단열 압축할 때 압축 후의 온도는 약 몇 ℃인가? (단, 공기의 비열비는 1.4 이다.)","c":["54","348","682","912"],"a":3,"inc":false,"unit":"10-5"},{"id":"gisa-2021-09-12-38","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":38,"q":"펌프 운전 시 발생하는 캐비테이션의 발생을 예방하는 방법이 아닌 것은?","c":["펌프의 회전수를 높여 흡입 비속도를 높게 한다.","펌프의 설치높이를 될 수 있는 대로 낮춘다.","입형펌프를 사용하고, 회전차를 수중에 완전히 잠기게 한다.","양흡입 펌프를 사용한다."],"a":1,"inc":false,"unit":"4-4"},{"id":"gisa-2021-09-12-51","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":51,"q":"위험물안전관리법령상 정기점검의 대상인 제조소등의 기준으로 틀린 것은?","c":["지하탱크저장소","이동탱크저장소","지정수량의 10배 이상의 위험물을 취급하는 제조소","지정수량의 20배 이상의 위험물을 저장하는 옥외탱크저장소"],"a":4,"inc":false,"unit":"3-9"},{"id":"gisa-2021-09-12-54","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":54,"q":"화재예방, 소방시설 설치·유지 및 안전관리에 관한 법령상 분말형태의 소화약제를 사용하는 소화기의 내용연수로 옳은 것은? (단, 소방용품의 성능을 확인받아 그 사용기한을 연장하는 경우는 제외한다.)","c":["3년","5년","7년","10년"],"a":4,"inc":false,"unit":"4-5"},{"id":"gisa-2021-09-12-58","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":58,"q":"소방기본법령상 특수가연물의 수량 기준으로 옳은 것은?","c":["면화류 : 200kg 이상","가연성고체류 : 500kg 이상","나무껍질 및 대팻밥 : 300kg 이상","넝마 및 종이부스러기 : 400kg 이상"],"a":1,"inc":false,"unit":"3-2"},{"id":"gisa-2021-09-12-59","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":59,"q":"위험물안전관리법령상 위험물을 취급함에 있어서 정전기가 발생할 우려가 있는 설비에 설치할 수 있는 정전기 제거설비 방법이 아닌 것은?","c":["접지에 의한 방법","공기를 이온화하는 방법","자동적으로 압력의 상승을 정지시키는 방법","공기 중의 상대습도를 70% 이상으로 하는 방법"],"a":3,"inc":false,"unit":"10-5"},{"id":"gisa-2021-09-12-61","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":61,"q":"특별피난계단의 계단실 및 부속실 제연설비의 화재안전기준상 수직풍도에 따른 배출기준 중 각층의 옥내와 면하는 수직풍도의 관통부에 설치하여야 하는 배출댐퍼 설치기준으로 틀린 것은?","c":["화재층의 옥내에 설치된 화재감지기의 동작에 따라 당해층의 댐퍼가 개방될 것","풍도의 배출댐퍼는 이·탈착구조가 되지 않도록 설치할 것","개폐여부를 당해 장치 및 제어반에서 확인할 수 있는 감지기능을 내장하고 있을 것","배출댐퍼는 두께 1.5mm 이상의 강판 또는 이와 동등 이상의 성능이 있는 것으로 설치하여야 하며 비 내식성 재료의 경우에는 부식방지 조치를 할 것"],"a":2,"inc":false,"unit":"7-8"},{"id":"gisa-2021-09-12-63","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":63,"q":"스프링클러설비 본체내의 유수현상을 자동적으로 검지하여 신호 또는 경보를 발하는 장치는?","c":["수압계폐장치","물올림장치","일제개방밸브장치","유수검지장치"],"a":4,"inc":false,"unit":"4-7"},{"id":"gisa-2021-09-12-64","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":64,"q":"옥내소화전설비 화재안전기준에 따라 옥내소화전설비의 표시등 설치기준으로 옳은 것은?","c":["가압송수장치의 기동을 표시하는 표시등은 옥내소화전함의 상부 또는 그 직근에 설치한다.","가압송수장치의 기동을 표시하는 표시등은 녹색등으로 한다.","자체소방대를 구성하여 운영하는 경우 가압송수장치의 기동표시등을 반드시 설치해야 한다.","옥내소화전설비의 위치를 표시하는 표시등은 함의 하부에 설치하되, 「표시등의 성능인증 및 제품검사의 기술기준」에 적합한 것으로 한다."],"a":1,"inc":false,"unit":"4-6"},{"id":"gisa-2021-09-12-65","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":65,"q":"소화기구 및 자동소화장치의 화재안전기준상 건축물의 주유구조부가 내화구조이고, 벽 및 반자의 실내에 면하는 부분이 불연재료로 된 바닥 면적이 600m2인 노유자시설에 필요한 소화기구의 능력단위는 최소 얼마 이상으로 하여야 하는가?","c":["2단위","3단위","4단위","6단위"],"a":2,"inc":false,"unit":"2-3"},{"id":"gisa-2021-09-12-66","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":66,"q":"분말소화설비의 화재안전기준에 따라 분말소화설비의 자동식 기동장치의 설치기준으로 틀린 것은? (단, 자동식 기동장치는 자동화재탐지설비의 감지기의 작동과 연동하는 것이다.)","c":["기동용 가스용기의 충전비는 1.5 이상으로 할 것","자동식 기동장치에는 수동으로도 기동할 수 있는 구조로 할 것","전기식 기동장치로서 3병 이상의 저장용기를 동시에 개방하는 설비는 2병 이상의 저장용기에 전자개방밸브를 부착할 것","기동용 가스용기에는 내압시험압력의 0.8배 내지 내압시험압력 이하에서 작동하는 안전장치를 설치할 것"],"a":3,"inc":false,"unit":"6-1"},{"id":"gisa-2021-09-12-68","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":68,"q":"스프링클러설비의 화재안전기준에 따라 스프링클러헤드를 설치하지 않을 수 있는 장소로만 나열된 것은?","c":["계단실, 병실, 목욕실, 냉동창고의 냉동실, 아파트(대피공간 제외)","발전실, 병원의 수술실·응급처치실, 통신기기실, 관람석이 없는 실내 테니스장(실내 바닥·벽 등이 불연재료)","냉동창고의 냉동실, 변전실, 병실, 목욕실, 수영장 관람석","병원의 수술실, 관람석이 없는 실내 테니스장(실내 바닥·벽 등이 불연재료), 변전실, 발전실, 아파트(대피공간 제외)"],"a":2,"inc":false,"unit":"4-7"},{"id":"gisa-2021-09-12-69","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":69,"q":"포소화설비의 화재안전기준에 따라 포소화설비에 소방용 합성수지배관을 설치할 수 있는 경우로 틀린 것은?","c":["배관을 지하에 매설하는 경우","다른 부분과 내화구조로 구획된 덕트 또는 피트의 내부에 설치하는 경우","동결방지조치로 하거나 동결의 우려가 없는 경우","천장과 반자를 불연재료 또는 준불연재료로 설치하고 그 내부에 습식으로 배관을 설치하는 경우"],"a":3,"inc":false,"unit":"4-11"},{"id":"gisa-2021-09-12-70","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":70,"q":"다음 중 피난기구의 화재안전기준에 따라 피난기구를 설치하지 아니하여도 되는 소방대상물로 틀린 것은?","c":["발코니 등을 통하여 인접세대로 피난할 수 있는 구조로 되어 있는 계단실형 아파트","주요구조부가 내화구조로서 거실의 각 부분으로 직접 복도로 피난할 수 있는 학교(강의실 용도로 사용되는 층에 한함)","무인공장 또는 자동창고로서 사람의 출입이 금지된 장소","문화집회 및 운동시설·판매시설 및 영업시설 또는 노유자시설의 용도로 사용되는 층으로서 그 층의 바닥면적이 1000m2 이상인 것"],"a":4,"inc":false,"unit":"7-3"},{"id":"gisa-2021-09-12-72","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":72,"q":"소화기구 및 자동소화장치의 화재안전기준상 소화기구의 소화약제별 적응성 중 C급 화재에 적응성이 없는 소화약제는?","c":["마른 모래","할로겐화합물 및 불활성기체 소화약제","이산화탄소 소화약제","중탄산염류 소화약제"],"a":1,"inc":false,"unit":"4-5"},{"id":"gisa-2021-09-12-73","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":73,"q":"이산화탄소소화설비 및 할론소화설비의 국소방출방식에 대한 설명으로 옳은 것은?","c":["고정식 소화약제 공급장치에 배관 및 분사헤드를 설치하여 직접 화점에 소화약제를 방출하는 방식이다.","고정된 분사헤드에서 밀폐 방호구역 공간 전체로 소화약제를 방출하는 방식이다.","호스 선단에 부착된 노즐을 이동하여 방호대상물에 직접 소화약제를 방출하는 방식이다.","소화약제 용기 노즐 등을 운반기구에 적재하고 방호대상물에 직접 소화약제를 방출하는 방식이다."],"a":1,"inc":false,"unit":"6-2"},{"id":"gisa-2021-09-12-74","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":74,"q":"특고압의 전기시설을 보호하기 위한 소화설비로 물분무소화설비를 사용한다. 그 주된 이유로 옳은 것은?","c":["물분무 설비는 다른 물 소화설비에 비해서 신속한 소화를 보여주기 때문이다.","물분무 설비는 다른 물 소화설비에 비해서 물의 소모량이 적기 때문이다.","분무상태의 물은 전기적으로 비전도성이기 때문이다.","물분무입자 역시 물이므로 전기전도성이 있으나 전기 시설물을 젖게 하지 않기 때문이다."],"a":3,"inc":false,"unit":"4-10"},{"id":"gisa-2021-09-12-75","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":75,"q":"물분소화설비의 화재안전기준에 따라 물분무소화설비를 설치하는 차고 또는 주차장이 배수설비 설치기준으로 틀린 것은?","c":["차량이 주차하는 바닥은 배수구를 향해 1/100 이상의 기울기를 유지할 것","배수구에서 새어나온 기름을 모아 소화할 수 있도록 길이 40m 이하마다 집수관·소화핏트 등 기름분리장치를 설치할 것","차량이 주차하는 장소의 적당한 곳에 높이 10cm 이상이 경계턱으로 배수구를 설치할 것","배수설비는 가압송수장치의 최대송수능력이 수량을 유효하게 배수할 수 있는 크기 및 기울기로 할 것"],"a":1,"inc":false,"unit":"4-10"},{"id":"gisa-2021-09-12-77","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2021-09-12","num":77,"q":"스프링클러설비의 화재안전기준에 따라 폐쇄형스프링클러헤드를 최고 주위온도 40℃인 장소(공장 및 창고 제외)에 설치할 경우 표시온도는 몇 ℃의 것을 설치하여야 하는가?","c":["79℃ 미만","79℃ 이상 121℃ 미만","121℃ 이상 162℃ 미만","162℃ 이상"],"a":2,"inc":false,"unit":"4-7"},{"id":"gisa-2022-03-05-1","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":1,"q":"동식물유류에서 “요오드값이 크다”라는 의미를 옳게 설명한 것은?","c":["불포화도가 높다.","불건성유이다.","자연발화성이 낮다.","산소와의 결합이 어렵다."],"a":1,"inc":false,"unit":"1-1"},{"id":"gisa-2022-03-05-2","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":2,"q":"화재에 관련된 국제적인 규정을 제정하는 단체는?","c":["IMO(International Maritime Organization)","SFPE(Society of Fire Protection Engineers)","NFPA(Nation Fire Protection Association)","ISO(International Organization for Standardization) TC 92"],"a":4,"inc":false,"unit":"3-1"},{"id":"gisa-2022-03-05-3","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":3,"q":"위험물의 유별에 따른 분류가 잘못된 것은?","c":["제1류 위험물: 산화성 고체","제3류 위험물: 자연발화성 물질 및 금수성 물질","제4류 위험물: 인화성 액체","제6류 위험물: 가연성 액체"],"a":4,"inc":false,"unit":"1-1"},{"id":"gisa-2022-03-05-4","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":4,"q":"상온·상압의 공기중에서 탄화수소류의 가연물을 소화하기 위한 이산화탄소 소화약제의 농도는 약 몇 % 인가? (단, 탄화수소류는 산소농도가 10%일 때 소화된다고 가정한다.)","c":["28.57","35.48","49.56","52.38"],"a":4,"inc":false,"unit":"6-2"},{"id":"gisa-2022-03-05-7","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":7,"q":"소화약제의 형식승인 및 제품검사의 기술기준상 강화액 소화약제의 응고점은 몇 ℃ 이하이어야 하는가?","c":["0","-20","-25","-30"],"a":2,"inc":false,"unit":"6-4"},{"id":"gisa-2022-03-05-8","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":8,"q":"소화원리에 대한 설명으로 틀린 것은?","c":["억제소화: 불활성기체를 방출하여 연소범위 이하로 낮추어 소화하는 방법","냉각소화: 물의 증발잠열을 이용하여 가연물의 온도를 낮추는 소화방법","제거소화: 가연성 가스의 분출화재 시 연료공급을 차단시키는 소화방법","질식소화: 포소화약제 또는 불연성기체를 이용해서 공기 중의 산소공급을 차단하여 소화하는 방법"],"a":1,"inc":false,"unit":"5-1"},{"id":"gisa-2022-03-05-9","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":9,"q":"단백포 소화약제의 특징이 아닌 것은?","c":["내열성이 우수하다.","유류에 대한 유동성 이 나쁘다.","유류를 오염시킬 수 있다.","변질의 우려가 없어 저장 유효기간의 제한이 없다."],"a":4,"inc":false,"unit":"5-1"},{"id":"gisa-2022-03-05-10","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":10,"q":"고층 건축물 내 연기거동 중 굴뚝효과에 영향을 미치는 요소가 아닌 것은?","c":["건물 내·외의 온도차","화재실의 온도","건물의 높이","층의 면적"],"a":4,"inc":false,"unit":"1-15"},{"id":"gisa-2022-03-05-11","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":11,"q":"전기불꽃, 아크 등이 발생하는 부분을 기름 속에 넣어 폭발을 방지하는 방폭구조는?","c":["내압방폭구조","유입방폭구조","안전증방폭구조","특수방폭구조"],"a":2,"inc":false,"unit":"10-1"},{"id":"gisa-2022-03-05-12","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":12,"q":"건축물의 피난·방화구조 등의 기준에 관한 규칙상 방화구획의 설치기준 중 스프링클러를 설치한 10층 이하의 층은 바닥면적 몇 m2 이내마다 방화구획을 구획하여야 하는가?","c":["1000","1500","2000","3000"],"a":4,"inc":false,"unit":"2-1"},{"id":"gisa-2022-03-05-13","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":13,"q":"과산화수소 위험물의 특성이 아닌 것은?","c":["비수용성이다.","무기화합물이다.","불연성 물질이다.","비중은 물보다 무겁다."],"a":1,"inc":false,"unit":"4-5"},{"id":"gisa-2022-03-05-14","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":14,"q":"이산화탄소 소화약제의 임계온도는 약 몇 ℃ 인가?","c":["24.4","31.4","56.4","78.4"],"a":2,"inc":false,"unit":"6-2"},{"id":"gisa-2022-03-05-15","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":15,"q":"이산화탄소 소화약제의 주된 소화효과는?","c":["제거소화","억제소화","질식소화","냉각소화"],"a":3,"inc":false,"unit":"6-2"},{"id":"gisa-2022-03-05-16","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":16,"q":"백열전구가 발열하는 원인이 되는 열은?","c":["아크열","유도열","저항열","정전기열"],"a":3,"inc":false,"unit":"10-5"},{"id":"gisa-2022-03-05-17","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":17,"q":"화재의 정의로 옳은 것은?","c":["가연성물질과 산소와의 격렬한 산화반응이다.","사람의 과실로 인한 실화나 고의에 의한 방화로 발생하는 연소현상으로서 소화할 필요성이 있는 연소현상이다.","가연물과 공기와의 혼합물이 어떤 점화원에 의하여 활성화되어 열과 빛을 발하면서 일으키는 격렬한 발열반응이다.","인류의 문화와 문명의 발달을 가져오게 한 근본 존재로서 인간의 제어수단에 의하여 컨트롤 할 수 있는 연소현상이다."],"a":2,"inc":false,"unit":"1-5"},{"id":"gisa-2022-03-05-18","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":18,"q":"물에 황산을 넣어 묽은 황산을 만들 때 발생되는 열은?","c":["연소열","분해열","용해열","자연발열"],"a":3,"inc":false,"unit":"1-8"},{"id":"gisa-2022-03-05-19","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":19,"q":"자연발화의 방지방법이 아닌 것은?","c":["통풍이 잘 되도록 한다.","퇴적 및 수납 시 열이 쌓이지 않게 한다.","높은 습도를 유지한다.","저장실의 온도를 낮게 한다."],"a":3,"inc":false,"unit":"1-1"},{"id":"gisa-2022-03-05-21","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":21,"q":"30℃에서 부피가 10L인 이상기체를 일정한 압력으로 0℃로 냉각시키면 부피는 약 몇 L로 변하는가?","c":["3","9","12","18"],"a":2,"inc":false,"unit":"14-2"},{"id":"gisa-2022-03-05-22","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":22,"q":"비중이 0.6이고 길이 20m, 폭 10m, 높이 3m인 직육면체 모양의 소방정 위에 비중이 0.9인 포소화약제 5톤을 실었다. 바닷물의 비중이 1.03일 때 바닷물 속에 잠긴 소방정의 깊이는 몇 m인가","c":["3.54","2.5","1.77","0.6"],"a":3,"inc":false,"unit":"5-1"},{"id":"gisa-2022-03-05-26","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":26,"q":"포화액-증기 혼합물 300g이 100kPA의 일정한 압력에서 기화가 일어나서 건도가 10%에서 30%로 높아진다면 혼합물의 체적 증가량은 약 몇 m3인가? (단, 100kPa에서 포화액과 포화증기의 비체적은 각각 0.00104m3/kg 과 1.694 m3/kg 이다.)","c":["3.386","1.693","0.508","0.102"],"a":4,"inc":false,"unit":"4-1"},{"id":"gisa-2022-03-05-27","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":27,"q":"비중량 및 비중에 대한 설명으로 옳은 것은?","c":["비중량은 단위부피당 유체의 질량이다.","비중은 유체의 질량 대 표준상태 유체의 질량비이다.","기체인 수소의 비중은 액체인 수은의 비중보다 크다.","압력의 변화에 대한 액체의 비중량 변화는 기체 비중량 변화보다 작다."],"a":4,"inc":false,"unit":"4-1"},{"id":"gisa-2022-03-05-28","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":28,"q":"물분무 소화설비의 가압송수장치로 전동기 구동형 펌프를 사용하였다. 펌프의 토출량 800L/min, 전양정 50m, 효율 0.65, 전달계수 1.1인 경우 적당한 전동기 용량은 몇 kW인가?","c":["4.2","4.7","10.0","11.1"],"a":4,"inc":false,"unit":"4-10"},{"id":"gisa-2022-03-05-30","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":30,"q":"부차적 손실계수 K가 2인 관 부속품에서의 손실 수두가 2m이라면 이때의 유속은 약 몇 m/s 인가?","c":["4.43","3.14","2.21","2.00"],"a":1,"inc":false,"unit":"4-3"},{"id":"gisa-2022-03-05-31","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":31,"q":"관내에 흐르는 유체의 흐름을 구분하는 데 사용되는 레이놀즈 수의 물리적인 의미는?","c":["관성력/중력","관성력/점성력","관성력/탄성력","관성력/압축력"],"a":2,"inc":false,"unit":"4-3"},{"id":"gisa-2022-03-05-33","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":33,"q":"펌프와 관련된 용어의 설명으로 옳은 것은?","c":["캐비테이션 : 송출압력과 송출유량이 주기적으로 변하는 현상","서징 : 액체가 포화 증기압 이하에서 비등하여 기포가 발생하는 현상","수격작용 : 관을 흐르던 물이 갑자기 정지할 때 압력파에 의해 이상음(異常音)이 발생하는 현상","NPSH : 펌프에서 상사법칙을 나타내기 위한 비속도"],"a":3,"inc":false,"unit":"4-4"},{"id":"gisa-2022-03-05-37","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2022-03-05","num":37,"q":"수평 배관 설비에서 상류 지점인 A지점의 배관을 조사해 보니 지름 100mm, 압력 0.45MPa, 평균 유속 1m/s이었다. 또, 하류의 B지점을 조사해 보니 지름 50mm, 압력 0.4MPa이었다면 두 ","불꽃감지기"],"a":2,"inc":false,"unit":"7-2"},{"id":"gwallisa-2010-09-05-104","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2010-09-05","num":104,"q":"다음 중 백화점에 설치하는 휴대용 비상조명등의 설치기준으로 적합한 것은?","c":["수평거리 25[m] 이내마다 2개 이상 설치","보행거리 25[m] 이내마다 3개 이상 설치","수평거리 50[m] 이내마다 2개 이상 설치","보행거리 50[m] 이내마다 3개 이상 설치"],"a":4,"inc":false,"unit":"8-7"},{"id":"gwallisa-2010-09-05-105","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2010-09-05","num":105,"q":"천장의 높이가 2[m] 이하인 회의실에 청각장애인용 시각경보장치를 설치하고자 한다. 시각경보장치는 천장으로부터 몇[m] 이내에 설치하여야 하는가?","c":["0.1[m]","0.15[m]","1.2[m]","0.25[m]"],"a":2,"inc":false,"unit":"8-7"},{"id":"gwallisa-2010-09-05-106","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2010-09-05","num":106,"q":"누전경보기의 변류기(ZRC)는 경계전로에 정격전류를 흘리는 경우 그 경계전로의 전압강하는 몇 [V] 이하이어야 하는가? (단, 경계전로의 전선을 그 변류기에 관통시키는 것은 제외한다.)","c":["0.3[V]","0.5[V]","1.0[V]","3.0[V]"],"a":2,"inc":false,"unit":"9-2"},{"id":"gwallisa-2010-09-05-107","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2010-09-05","num":107,"q":"다음 중 무선통신보조설비의 주회로 전원이 정상인지 여부를 확인하기 위해 증폭기 전면에 설치하는 것은?","c":["전압계 및 전류계","전압계 및 표시등","회로시험계","전류계"],"a":2,"inc":false,"unit":"8-7"},{"id":"gwallisa-2010-09-05-110","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2010-09-05","num":110,"q":"계단, 경사로(엘리베이터 경사로 포함)에 대하여 별도로 경계구역을 설정하되, 하나의 경계구역의 높이는 몇[m] 이하로 하여야 하는가?","c":["15[m]","30[m]","45[m]","50[m]"],"a":3,"inc":false,"unit":"7-2"},{"id":"gwallisa-2010-09-05-111","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2010-09-05","num":111,"q":"물분무 소화설비에서 차량이 주차하는 장소의 바닥면은 배수구를 향하여 얼마 이상의 기울기를 유지하 여야 하는가?","c":["1/100","2/100","3/100","5/100"],"a":2,"inc":false,"unit":"4-10"},{"id":"gwallisa-2010-09-05-112","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2010-09-05","num":112,"q":"할로겐화합물 소화약제의 저장용기는 어떠한 장소에 설치, 유지하여야 하는가?","c":["온도에 무관하니까 아무 곳이나 좋다.","0℃ 이상인 장소는 다 적당하다.","상온 이하이면 다 좋다.","온도가 40℃ 이하이고, 온도변화가 적은 곳이 좋다."],"a":4,"inc":false,"unit":"6-3"},{"id":"gwallisa-2010-09-05-113","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2010-09-05","num":113,"q":"이산화탄소 소화설비에 사용되는 고압식 이산화탄소 소화약제 저장용기의 충전비는 얼마인가?","c":["1.5이상 1.9이하","1.2이상 1.5이하","1.0이상 1.3이하","0.8이상 1.0이하"],"a":1,"inc":false,"unit":"6-2"},{"id":"gwallisa-2010-09-05-116","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2010-09-05","num":116,"q":"간이 스프링클러설비에 설치하는 간이형 스프링클러헤드 하나의 수평거리는 m 이하로 하는가?","c":["1.7","2.1","2.3","3.7"],"a":3,"inc":false,"unit":"4-7"},{"id":"gwallisa-2010-09-05-117","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2010-09-05","num":117,"q":"소화용수설비에 설치하는 소화수조의 소요수량이 50m3인 경우 가압송수장치의 1분당 송수량은 몇 m3/min 이상이어야 하는가?","c":["1.1","2.2","3.3","5.5"],"a":2,"inc":false,"unit":"4-6"},{"id":"gwallisa-2010-09-05-119","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2010-09-05","num":119,"q":"소방대상물의 설치장소가 지하층에 적응되는 피난기구는 어느 것인가?","c":["피난사다리","미끄럼대","구조대","피난교"],"a":1,"inc":false,"unit":"7-3"},{"id":"gwallisa-2010-09-05-121","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2010-09-05","num":121,"q":"스프링클러설비의 배관에 대한 설명으로 옳지 않은 것은?","c":["주차장의 스프링클러설비는 습식 이외의 방식으로 한다.","습식 스프링클러설비는 헤드를 향하여 상향으로 수평주행배관의 기울기를 1/500 이상으로 한다.","급수배관에 설치되는 탬퍼스위치는 감시제어반 또는 수신기에서 동작의 유무확인을 할 수 있어야 한다.","일제개방밸브를 사용하는 스프링클러설비에서는 일제개방밸브 2차측에 개폐표시형 밸브를 설치하여야 한다."],"a":2,"inc":false,"unit":"4-7"},{"id":"gwallisa-2010-09-05-122","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2010-09-05","num":122,"q":"할론1301 소화약제의 소화효과와 가장 거리가 먼 것은?","c":["냉각소화","질식소화","가연물 제거소화","연쇄반응의 억제소화"],"a":3,"inc":false,"unit":"1-5"},{"id":"gwallisa-2010-09-05-123","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2010-09-05","num":123,"q":"이산화탄소 소화설비의 자동식 기동장치의 설치 기준으로 적합하지 않은 것은?","c":["기동장치는 장동화재탐지설비의 감지기의 작동과 연동하여야 할 것","자동식 기동장치에는 수동으로도 가동할 수 있는 구조로 할 것","가스압력시 기동용 가스용기의 용적은 1ℓ 이상으로 할 것","기동용 가스용기에 저장하는 이산화탄소의 충전비는 1.3 이상으로 할 것"],"a":4,"inc":false,"unit":"6-2"},{"id":"gwallisa-2010-09-05-124","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2010-09-05","num":124,"q":"연결 살수설비에 관한 설명 중 맞지 않는 것은?","c":["송수구는 반드시 65mm의 쌍구형으로만 하여야 한다.","선택밸브는 화재시 연소의 우려가 없는 장소에 설치한다.","헤드는 천장 또는 반자의 실내에 면하는 부분에 설치한다.","개방형 헤드 사용시 주배관 중 물이 잘 빠질 수 있는 위치에 자동배수밸브를 설치한다."],"a":1,"inc":false,"unit":"4-11"},{"id":"gwallisa-2011-08-21-1","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":1,"q":"에너지 방출속도에 대한 설명으로 옳지않은 것은?","c":["기화면적에 비례한다.","연소속도에 비례한다.","유효연소열에 비례한다.","기화열에 비례한다."],"a":4,"inc":false,"unit":"1-10"},{"id":"gwallisa-2011-08-21-3","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":3,"q":"화재 가혹도에 대한 설명으로 틀린 것은?","c":["화재하중이 작으면 화재가혹도가 작다.","화재실 내 단위시간당 축적되는 열이 크면 화재 가혹도가 크다.","화재규모를 판단하는 척도로 주수시간을 결정하는 인자이다.","화재발생으로 건물 내부 수용재산 및 건물자체손상을 입히는 정도이다."],"a":3,"inc":false,"unit":"1-12"},{"id":"gwallisa-2011-08-21-6","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":6,"q":"가로1[m]⨉세로 1[m]의 개구부가 존재하는 구획실에 환기지배형 화재가 발생하여 플래시오버 이전에 개구부 높이가 2배 증가했다면 이 구획실의 환기인자는 약 몇 배 증가했는가?","c":["1.4","2.8","4.2","5.6"],"a":2,"inc":false,"unit":"1-12"},{"id":"gwallisa-2011-08-21-7","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":7,"q":"위험물화재의 연소확대시 위험성 중 이연성(易燃性)에 관한 설명 중 옳은 것은?","c":["연소열이 작다.","연소속도가 빠르다.","낮은 산소농도에서도 연소되기 쉽다.","연소점이 낮고, 연소가 계속되기 쉽다."],"a":2,"inc":false,"unit":"1-10"},{"id":"gwallisa-2011-08-21-9","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":9,"q":"건축방재계획 중 공간적 대응에서 회피성으로 옳은 것은?","c":["내화성능, 방연성능, 초기소화대응능력 등의 화재에 대응하여 저항하는 성능","화재가 발생한 경우 안전피난 시스템 동작","제연설비, 방화문, 방화셔터, 자동화재탐지설비, 스프링클러설비 등에 대한 대응이다.","불연화, 난연화, 내장재의 제한, 용도별 구획등으로 출화, 화재확대 등을 감소시키고자 하는 예방적 조치이다."],"a":4,"inc":false,"unit":"2-2"},{"id":"gwallisa-2011-08-21-10","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":10,"q":"할로겐청정소화약제의 ODP를 현저히 낮추기 위해 배제하는 원소는?","c":["F","Cl","Br","I"],"a":3,"inc":false,"unit":"6-4"},{"id":"gwallisa-2011-08-21-12","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":12,"q":"다음 섬유 중 발화온도가 가장 높은 것은?","c":["나일론","순 면","양 모","폴리에스테르"],"a":3,"inc":false,"unit":"1-1"},{"id":"gwallisa-2011-08-21-13","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":13,"q":"공기나 질소와 같이 불연성 가스를 용기 내부에 압입시켜 내부압력을 유지함으로서 외부의 폭발성 가스가 용기 내부에 침입하지 못하게 하는 구조는?","c":["본질안전방폭구조","압력방폭구조","내압방폭구조","유입방폭구조"],"a":2,"inc":false,"unit":"10-1"},{"id":"gwallisa-2011-08-21-14","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":14,"q":"고체표면의 화염확산으로 옳지 않은 것은?","c":["화염확산방향이 수평전파할 때 확산속도가 빠르다.","화염확산에서 중력과 바람영향은 중요변수가 된다.","화염확산속도는 화재 위험성 평가에서 중요한 역할을 한다.","바람과 같은 방향으로의 화염확산은 순풍에서의 화염확산이라 한다."],"a":1,"inc":false,"unit":"1-9"},{"id":"gwallisa-2011-08-21-15","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":15,"q":"소화기의 형식승인 및 제품검사의 기술기준에서 정한 대형소화기 기준으로 틀린 것은?","c":["강화액 60[ℓ]","이산화탄소 50[kg]","할로겐화합물 30[kg]","분말 30[kg]"],"a":4,"inc":false,"unit":"4-5"},{"id":"gwallisa-2011-08-21-16","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":16,"q":"구획실화재의 현상에 대한 설명 중 옳지 않은 것은?","c":["중성대가 개구부에 형성될 때 중성대 아래쪽은 공기가 유입되고 위쪽은 연기가 유출된다.","연기와 공기흐름은 주로 온도상승에 의한 부력때문이다.","백드래프트는 연료지배형 화재에서 발생한다.","벽면코너화염이 단일 벽면화염보다 화염전파 속도가 빠르다."],"a":3,"inc":false,"unit":"1-12"},{"id":"gwallisa-2011-08-21-17","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":17,"q":"다음 설명 중 틀린 것은?","c":["불연성 가스 등을 가연성 혼합기에 첨가하면 MOC(최소산소농도)는 증가한다.","MOC는 공기와 연료의 혼합기 중 산소의 부피를 나타내며 [%]의 단위로 나타낸다.","L.O.I(한계산소지수)는 가연물을 수직으로 하여 가장 윗부분에 착화하며 연소를 계속 유지시킬 수 있는 산소의 최저 체적농도[vol%]를 말한다.","가연성 가스의 조성이 완전연소조성 부근일경우 최소발화에너지(MIE)는 최대가 된다."],"a":4,"inc":false,"unit":"1-4"},{"id":"gwallisa-2011-08-21-20","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":20,"q":"건물에 익숙한 사람이 피난의 어려움을 겪기 시작하는 연기농도는?","c":["감광계수 0.1, 가시거리20~30[m]","감광계수 0.3, 가시거리5[m]","감광계수 1, 가시거리2[m]","감광계수 10, 가시거리 0.2~0.5[m]"],"a":2,"inc":false,"unit":"1-14"},{"id":"gwallisa-2011-08-21-21","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":21,"q":"인간의 심장에 영향을 주지 않는 최대농도의 의미를 가지고 있는 것은?","c":["LC50","LD50","LOAEL","NOAEL"],"a":4,"inc":false,"unit":"1-27"},{"id":"gwallisa-2011-08-21-22","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":22,"q":"소방대상물의 크기가 가로 8[m]⨉세로 10[m] ⨉높이5[m]인 9,000[kcal/kg]의 발열량을 갖는 특정가연물이 가득 차 있다면 이 건물 내의 화재하중은 몇[kg/m2]인가? (단,특정가연물의 비중은 0.8로 한다.)","c":["8,000","9,000","10,000","12,000"],"a":1,"inc":false,"unit":"1-12"},{"id":"gwallisa-2011-08-21-24","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":24,"q":"다음 설명 중 작열연소에 적합한 설명으로 맞는 것은?","c":["연소속도가 매우 빠르고 불꽃과 열을 내며 연소하는 것을 말한다.","고에너지화재이며 열가소성 합성수지류의 화재이다.","시간당 방출열량이 많다.","연료의 표면에서 불꽃을 발생하지 않고 연소하는 것을 말한다."],"a":4,"inc":false,"unit":"1-6"},{"id":"gwallisa-2011-08-21-26","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":26,"q":"베르누이 방정식 적용으로 틀린 것은?","c":["실제유체","비점성 유체","압축성 유체","정상류"],"a":3,"inc":false,"unit":"4-2"},{"id":"gwallisa-2011-08-21-34","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":34,"q":"3[%]의 포원액 6[ℓ]를 방출하였더니 방출한 포 의 체적이 20,000[ℓ]가 되었다. 이때 포약제의 팽창비는 얼마인가?","c":["10배","100배","1,000배","2,000배"],"a":2,"inc":false,"unit":"5-2"},{"id":"gwallisa-2011-08-21-35","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":35,"q":"성능이 같은 두 대의 소화펌프를 병렬로 연결하였을 때의 양정(H)은?","c":["0.5H[m]","1H[m]","1.5H[m]","2H[m]"],"a":2,"inc":false,"unit":"4-4"},{"id":"gwallisa-2011-08-21-37","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":37,"q":"소화펌프의 토출량이 520[ℓ/min], 전양정50[m]펌프 효율이 0.6인 경우 전동기 용량은 얼마가 적당한가? (전달계수는 1.1이다)","c":["5[kW]","7.8[kW]","10[kW]","15[kW]"],"a":2,"inc":false,"unit":"4-4"},{"id":"gwallisa-2011-08-21-47","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":47,"q":"다음 중 할로겐화합물 소화약제인 Halon1301과 Halon2402에 공통으로 없는 원소는?","c":["Br","Cl","F","C"],"a":2,"inc":false,"unit":"6-3"},{"id":"gwallisa-2011-08-21-48","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":48,"q":"제3종 분말소화약제가 열분해될 때 발생하는 물질이 아닌 것은?","c":["H3PO4","H4P2O7","HPO3","P2O5"],"a":4,"inc":false,"unit":"6-1"},{"id":"gwallisa-2011-08-21-51","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":51,"q":"소방시설 설치유지 및 안전관리에 관한 법령상 형식승인을 받는 소방용품에 포함되지 않는것은?","c":["옥내소화전함","송수구","예비전원이 내장된 비상조명등","소방호스"],"a":1,"inc":false,"unit":"8-7"},{"id":"gwallisa-2011-08-21-52","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":52,"q":"소방시설관리업의 등록기준 중 장비기준에 축전지설비 점검기구가 아닌 것은?","c":["조도계","절연저항계","전류전압측정계","스포이드"],"a":1,"inc":false,"unit":"9-6"},{"id":"gwallisa-2011-08-21-58","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":58,"q":"화재조사에 대한 설명 중 알맞은 것은?","c":["화재조사를 하는 관계공무원은 그 권한을 표시하는 증표를 지니고 이를 관계인에게 내보여야 한다.","화재조사를 하는 관계공무원은 관계인의 정당한 업무를 방해하거나 화재조사를 수행하면서 알게 된 비밀을 다른 사람에게 누설하여도 된다.","소방공무원과 일반공무원은 화재조사를 할 때에 서로 협력하여야 한다.","소방본부장이나 소방서장은 화재조사 결과 방화 또는 실화의 혐의가 있다고 인정하면 지체 없이 소방방재청장에게 그 사실을 알리고 필요한 증거를 수집, 보존하여 그 범죄수사에 협력하여야 한다."],"a":1,"inc":false,"unit":"1-17"},{"id":"gwallisa-2011-08-21-63","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":63,"q":"다음 소방시설의 분류로 맞게 연결된 것은?","c":["소화설비 - 연소방지설비","경보설비 - 비상조명등","피난설비 - 방열복","소화활동설비 - 통합감시시설"],"a":3,"inc":false,"unit":"8-7"},{"id":"gwallisa-2011-08-21-64","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":64,"q":"화재안전기준이 변경되어 그 기준이 강화되는 경우 기존의 특정소방대상물에 변경으로 강화된 기준을 적용하여야 하는 소방시설이 아닌 것은?","c":["소화기구","피난설비","비상경보설비","자동화재탐지설비"],"a":4,"inc":false,"unit":"3-10"},{"id":"gwallisa-2011-08-21-66","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":66,"q":"소방시설별 하자보수보증기간으로 맞는 것은?","c":["연소방지설비 - 2년","스프링클러설비 - 2년","무선통신보조설비 - 3년","자동화재탐지설비 - 3년"],"a":4,"inc":false,"unit":"8-7"},{"id":"gwallisa-2011-08-21-69","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":69,"q":"소방안전관리 대상물이 아닌 대상물에 대한 소방안전관리자의 업무가 아닌 것은?","c":["소방계획서 작성","피난시설, 방화구획 및 방화시설의 유지, 관리","소방시설이나 그 밖의 소방관련시설의 유지, 관리","화기취급의 감독"],"a":1,"inc":false,"unit":"2-1"},{"id":"gwallisa-2011-08-21-70","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":70,"q":"성능위주설계를 하여하 하는 특정소방대상물에 해당되는 것은?","c":["연면적 10만[m2]이상인 특정소방대상물","건축물의 높이가 70[m]이상인 특정소방대상물","연면적 2만[m2]이상인 철도역상에 5,000[m2]를 증축한 소방대상물","하나의 건축물에 영화상영관이 2개 있는데 9개를 추가로 증축한 소방대상물"],"a":4,"inc":false,"unit":"2-3"},{"id":"gwallisa-2011-08-21-73","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":73,"q":"위험물 안전 관리법에서 정하는 정기검사대상인 제조소 등에 해당되는 것은?","c":["지정수량의 200배 이상을 저장하는 옥외탱크저장소","지정수량의 150배 이상을 저장하는 옥내저장소","지정수량의 100만[ℓ]이상을 저장하는 옥외탱크저장소","지정수량의 100만[ℓ]이상을 저장하는 옥내저장소"],"a":3,"inc":false,"unit":"3-9"},{"id":"gwallisa-2011-08-21-80","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":80,"q":"질산의 성질에 대한 설명으로 맞는 것은?","c":["진한 질산을 가열하면 적갈색의 갈색증기인 SO2가 발생한다.","습한 공기 중에서 흡열반응을 하는 무색의 무거운 액체이다.","질산의 비중이 1.82 이상이면 위험물로 본다.","환원성 물질과 혼합시 발화한다."],"a":4,"inc":false,"unit":"1-1"},{"id":"gwallisa-2011-08-21-82","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":82,"q":"고형알코올에 대한 설명으로 맞는 것은?","c":["합성수지에 메탄올을 혼합 침투시켜 한천상(寒天狀)으로 만든 것이다.","50[℃]미만에서 가연성의 증기를 발생하기 쉽고 매우 인화되기 쉽다.","강산화제와 접촉을 하여도 무관하다.","가열 또는 화염에 의해 화재 위험성이 매우 낮다."],"a":1,"inc":false,"unit":"2-3"},{"id":"gwallisa-2011-08-21-84","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":84,"q":"다음 과산화벤조일에 대한 설명 중 틀린 것은?","c":["무색의 백색 결정으로 강산화성 물질이다.","물에는 녹지 않고 알코올에는 약간 녹는다.","발화되면 연소속도가 빠르고 습한 상태에서는 위험하다.","용기는 완전히 밀전 밀봉하고 환기는 잘되는 찬 곳에 저장한다."],"a":3,"inc":false,"unit":"1-10"},{"id":"gwallisa-2011-08-21-88","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":88,"q":"다음 중 위험물로 볼 수 없는 것은?","c":["유황은 순도가 50[%] 이상인 것을 말한다.","철분은 분말로서 53마이크로의 표준체를 통과하는 것이 50[wt%]미만인 것은 제외한다.","인화성 고체는 고형알코올 그 밖에 1기압에서 인화점이 40[℃]미만인 고체를 말한다.","제1석유류는 1기압에서 인화점이 21[℃]미만인 것을 말한다."],"a":1,"inc":false,"unit":"1-1"},{"id":"gwallisa-2011-08-21-93","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":93,"q":"제조소의 바닥 면적이 80[m3]일 때 환기설비의 급기구의 크기는 얼마 이상으로 하는가?","c":["150[cm2]이상","300[cm2]이상","450[cm2]이상","600[cm2]이상"],"a":2,"inc":false,"unit":"7-8"},{"id":"gwallisa-2011-08-21-95","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":95,"q":"위험물을 취급하는 제조소에는 화재예방을 위한 예방규정을 정하여야 하는데 대상으로 맞지 않는 것은?","c":["지정수량의 10배 이상의 위험물을 취급하는 제조소","지정수량의 10배 이상의 위험물을 저장하는 일반취급소","지정수량의 100배 이상의 위험물을 저장하는 옥내저장소","지정수량의 100배 이상의 위험물을 저장하는 옥외저장소"],"a":3,"inc":false,"unit":"3-9"},{"id":"gwallisa-2011-08-21-97","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":97,"q":"용량이 1,000만[ℓ]이상인 옥외저장탱크의 주위에 설치하는 방유제에는 해당 탱크마다 간막이 둑을 설치하여야 하는데 설치기준으로 틀린 것은?","c":["간막이 둑은 흙 또는 철근콘크리트로 할 것","간막이 둑의 용량은 간막이 둑 안에 설치된 탱크의 용량의 5[%] 이상일 것","간막이 둑의 높이는 0.3[m] 이상으로 하되, 방유제의 높이보다 0.2[m] 이상 낮게 할 것","방유제 내에 설치되는 옥외저장탱크의 용량의 합계가 2억[ℓ]를 넘는 방유제에 있어서는 1[m] 이상으로 하되, 방유제의 높이보다 0.2[m] 이상 낮게 할 것"],"a":2,"inc":false,"unit":"3-10"},{"id":"gwallisa-2011-08-21-99","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":99,"q":"이동탱크저장소의 구조에 대한 설명 중 맞는 것은?","c":["방파판은 두께 1.6[mm] 이상의 강철판으로 할 것","하나의 구획 부분에 2개 이상의 방파판을 이동 탱크저장소의 반대방향과 평행으로 설치하되, 각 방파판은 그 높이 및 칸막이로부터의 거리를 다르게 할 것","하나의 구획 부분에 설치하는 각 방파판의 면적의 합계는 해당 구획 부분의 최대 수직단면적의 40[%] 이상으로 할 것","방호틀의 두께는 3.2[mm] 이상의 강철판 또는 이와 동등 이상의 기계적 성질이 있는 재료로써 산모양의 형상으로 하거나 이와 동등 이상의 강도가 있는 형상으로 할 것"],"a":1,"inc":false,"unit":"3-9"},{"id":"gwallisa-2011-08-21-102","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":102,"q":"종합병원의 3층에 설치하는 피난기구로 적당하지 않은 것은?","c":["미끄럼대","완강기","구조대","피난교"],"a":2,"inc":false,"unit":"7-3"},{"id":"gwallisa-2011-08-21-105","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":105,"q":"고정포방출구 방식에서 고정포방출구에서 방출하기 위하여 필요한 양을 구하는 공식으로 옳은 것은?","c":["Q=N×S×8,000[ℓ]","Q=A×Q1×T×S","Q=N×S×6,000[ℓ]","Q=A×Q1×V×S"],"a":2,"inc":false,"unit":"5-2"},{"id":"gwallisa-2011-08-21-107","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":107,"q":"옥내소화전설비에서 가장 많이 설치된 소화전의 수는 4개일 때 유량계의 용량은 얼마 이상으로 하여야 하는가? (단, 명판에 기재된 펌프 토출량은 600[ℓ/min]이다)","c":["630[ℓ/min]","900[ℓ/min]","960[ℓ/min]","1,050[ℓ/min]"],"a":4,"inc":false,"unit":"4-6"},{"id":"gwallisa-2011-08-21-108","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":108,"q":"연결송수관설비의 설치기준으로 틀린 것은?","c":["송수구는 지면으로부터 높이가 0.5[m] 이상 1[m] 이하의 위치에 설치할 것","송수구는 연결송수관의 수직배관마다 1개 이상을 설치할 것. 다만, 하나의 건축물에 설치된 각 수직배관이 중간에 개폐밸브가 설치되지 아니한 배관으로 상호 연결되어 있는 경우에는 건축물마다 1개씩 설치할 수 있다.","건식의 경우에는 송수구, 자동배수밸부, 체크밸브, 자동배수밸브의 순으로 설치할 것","지면으로부터의 높이가 31[m] 이상인 소방대상물 또는 지상 16층 이상인 소방대상물에 있어서는 습식 설비로 할 것"],"a":4,"inc":false,"unit":"4-8"},{"id":"gwallisa-2011-08-21-109","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":109,"q":"바닥면적 2,000[m2], 부착높이 6[m], 내화구조가 아닌 기타구조인 소방대상물에 차동식스포트형감지기 (2종)을 설치하고자 한다. 몇 개 이상을 설치하여야 하는가?","c":["50개","60개","70개","80개"],"a":4,"inc":false,"unit":"2-3"},{"id":"gwallisa-2011-08-21-110","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":110,"q":"정온식감지선형감지기의 설치기준으로 틀린 것은?","c":["감지선형감지기의 굴곡반경은 5[cm] 이하로 할 것","단자부와 마감 고정금구와의 설치간격은 10[cm] 이내로 설치할 것","감지기와 감지구역의 각 부분과의 수평거리가 내화구조의 경우 1종 4.5[m] 이하, 2종 3[m] 이하로 할 것","지하구나 창고의 천장 등에 지지물이 적당하지 않는 장소에는 보조선을 설치하고 그 보조선에 설치할 것"],"a":1,"inc":false,"unit":"8-3"},{"id":"gwallisa-2011-08-21-111","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":111,"q":"광전식분리형감지기의 설치기준으로 맞는 것은?","c":["감지기의 송광면은 햇빛을 직접 받지 않도록 설치할 것","광축(송광면과 수광면의 중심을 연결한 선)은 나란한 벽으로부터 0.5[m] 이상 이격하여 설치할 것","감지기의 송광부와 수광부는 설치된 뒷벽으로부터 1[m] 이내 위치에 설치할 것","광축의 높이는 천장 등(천장의 실내에 면한 부분 또는 상층의 바닥하부면을 말한다)높이의 60[%] 이상일 것"],"a":3,"inc":false,"unit":"8-4"},{"id":"gwallisa-2011-08-21-112","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":112,"q":"이산화탄소 소화설비의 소화약제의 저장용기의 설치기준으로 틀린 것은?","c":["저압식 저장용기에는 내압시험압력의 0.64배부터 0.8배까지의 압력에서 작동하는 안전밸브를 설치할 것","저장용기의 충전비는 저압식은 1.5 이상 1.9이하로 할 것","저압식 저장용기에는 액면계 및 압력계와 2.3[MPa] 이상 1.9[MPa] 이하의 압력에서 작동하는 압력 경보장치를 설치할 것","저장용기는 고압식은 25[MPa] 이상, 저압식은 3.5[MPa] 이상의 내압시험압력에서 합격한 것으로 할 것"],"a":2,"inc":false,"unit":"6-2"},{"id":"gwallisa-2011-08-21-115","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":115,"q":"공동현상의 방지대책이 아닌 것은?","c":["펌프의 흡입측 수두를 크게 한다.","펌프의 흡입관경을 크게 한다.","펌프의 설치위치를 수원보다 낮게 한다.","펌프흡입측배관의 마찰손실을 적게 한다."],"a":1,"inc":false,"unit":"4-4"},{"id":"gwallisa-2011-08-21-116","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":116,"q":"유량이 0.52m3/min]일 때 옥내소화전설비의 주배관의 최소 관경은 얼마 이상으로 하여야 하는가?","c":["50","65","80","100"],"a":3,"inc":false,"unit":"4-6"},{"id":"gwallisa-2011-08-21-118","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":118,"q":"다음 중 유도등의 비상전원은 유효하게 작동시킬 수 있는 용량으로 하여야 하는데 시간이 가장 긴 것은?","c":["지하상가","공연장","숙박시설","노유자시설"],"a":1,"inc":false,"unit":"9-6"},{"id":"gwallisa-2011-08-21-119","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":119,"q":"옥내소화전설비의 전원에 대한 배선 기준으로 옳은 것은?","c":["저압수전일 경우에는 인입개폐기의 직후에서 분기하여 전용배선으로 한다.","고압수전일 경우에는 전력용 변압기 2차측에서 직접 분기하여 전용배선으로 한다.","특별고압수전일 경우에는 전력용 변압기 1차측의 주차단기 1차측에서 분기하여 전용배선으로 한다.","승강기전원 등 특수동력전원과 공용하여 사용한다."],"a":1,"inc":false,"unit":"4-6"},{"id":"gwallisa-2011-08-21-120","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":120,"q":"누전경보기를 설치할 수 있는 장소는?","c":["화약류를 제조하거나 저장 또는 취급하는 장소","온도의 변화가 급격한 장소","가연성의 증기, 먼지, 가스 등이나 부식성의 증기, 가스, 등이 다량으로 체류하는 장소","습도가 낮은 장소"],"a":4,"inc":false,"unit":"3-1"},{"id":"gwallisa-2011-08-21-121","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":121,"q":"8[m] 이상 15[m] 미만의 높이에는 부착할 수 없는 감지기는?","c":["이온화식 2종","광전식 1종","차동식분포형","보상식스포트형"],"a":4,"inc":false,"unit":"1-24"},{"id":"gwallisa-2011-08-21-122","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":122,"q":"특별피난계단의 계단실 및 부속실 제연설비의 화재안전기준에 관한 설명 중 틀린 것은?","c":["제연구역과 옥내와의 사이에 유지하여야 하는 최소차압은 40[Pa] 이상으로 하여야 한다.","제연구역과의 옥내와의 사이에 유지하여야 하는 최소차압은 옥내에 스프링클러설비가 설치된 경우에는 12.5[Pa] 이상으로 하여야 한다.","자동폐쇄장치란 제연구역의 출입문 등에 설치하는 것으로서 화재발생시 옥내에 설치된 발신기 작동과 연동하여 출입문을 자동적으로 닫게 하는 장치를 말한다.","계단실과 부속실을 동시에 제연하는 경우 부속실의 기압은 계단실과 같게 하거나 계단실의 기압보다 낮게 할 경우에는 부속실과 계단실의 압력차이는 5[Pa] 이하가 되도록 하 여야한다."],"a":3,"inc":false,"unit":"7-8"},{"id":"gwallisa-2011-08-21-123","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2011-08-21","num":123,"q":"통로유도등의 표시색깔은?","c":["백색바탕에 적색문자","적색바탕에 녹색문자","녹색바탕에 백색문자","백색바탕에 녹색문자"],"a":4,"inc":false,"unit":"7-4"},{"id":"gwallisa-2013-05-11-1","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":1,"q":"발화점(ignition point)이 가장 낮은 것은?","c":["메탄(methane)","프로판(propane)","부탄(butane)","헥산(hexane)"],"a":4,"inc":false,"unit":"1-1"},{"id":"gwallisa-2013-05-11-3","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":3,"q":"액체이산화탄소 20kg이 30℃의 대기 중으로 방출되었다. 대기 중에서 기체상태의 이산화탄소 체적(m3)은 약 얼마인가? (단, 대기압은 1atm, 기체상수는 0.082ℓㆍatm/molㆍK, 이산화탄소는 이상기체 거동을 한다고 가정한다.)","c":["1,118.2","11,293.6","17,145.5","18,263.6"],"a":2,"inc":false,"unit":"6-2"},{"id":"gwallisa-2013-05-11-4","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":4,"q":"가연성 액체탄화수소가 유출되어 화재가 발생한 경우 소화에 적합한 Twin Agent System의 약제성분은?","c":["단백포+제1종 분말소화약제","불화단백포+제2종 분말소화약제","수성막포+제3종 분말소화약제","합성계면활성제포+제4종 분말소화약제"],"a":3,"inc":false,"unit":"3-1"},{"id":"gwallisa-2013-05-11-6","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":6,"q":"화재의 분류에 관한 설명으로 옳지 않은 것은?","c":["A급화재는 액체탄화수소의 화재로, 발생되는 연기의 색은 흑색이다.","B급화재는 유류의 화재로, 이를 예방하기 위해서는 유증기의 체류를 방지해야 한다.","C급화재는 전기화재로, 화재발생의 주요인으로는 과전류에 의한 열과 단락에 의한 스파크가 있다.","D급화재는 금속화재로, 수계 소화약제로 소화할 경우 가연성 가스를 발생할 위험성이 있다."],"a":1,"inc":false,"unit":"1-17"},{"id":"gwallisa-2013-05-11-9","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":9,"q":"건축물의 화재안전에 대한 공간적 대응방법 중 대항성에 해당하지 않는 것은?","c":["건축물 내장재의 불연화 성능","건축물 내화 성능","건축물 방화구획 성능","건축물 방ㆍ배연 성능"],"a":1,"inc":false,"unit":"2-1"},{"id":"gwallisa-2013-05-11-11","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":11,"q":"목조 건축물의 화재에 관한 설명으로 옳지 않은 것은?","c":["목조 건축물 화재 시 플래시오버(flashover)에 도달하는 시간이 내화 건축물 화재보다 빠르다.","건조한 목재는 셀룰로오스(cellulose)가 주성분이다.","목재는 열전도도가 낮아 철보다 단열효과가 작다.","목재에 함유되어 있는 수분의 양은 연소속도에 큰 영향을 미친다."],"a":3,"inc":false,"unit":"1-10"},{"id":"gwallisa-2013-05-11-12","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":12,"q":"건축물의 피난ㆍ방화등의 기준에 관한 규칙에서 내화구조인 벽에 관한 기준으로 옳지 않은 것은?","c":["벽돌조로서 두께가 19cm 이상인 것","철근콘크리트조 또는 철골철근콘크리트조로서 두께가 10cm 이상인 것","골구를 철골조로 하고 그 양면을 두께 5cm 이상의 콘크리트블록ㆍ벽돌 또는 석재로 덮은 것","고온ㆍ고압의 증기로 양생된 경량기포 콘크리트패널 또는 경량기포 콘크리트블록조로서 두께가 20cm 이상인 것"],"a":4,"inc":false,"unit":"2-3"},{"id":"gwallisa-2013-05-11-17","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":17,"q":"가로 10m, 세로 10m, 높이 3m의 공간에 발열량이 9,000kcal/kg인 가연물 3,000kg과 발열량이 4,500kcal/kg인 가연물 2,000kg이 저장된 실의 화재하중(kg/m2)은? (단, 목재의 단위발열량은 4,500kcal/kg이다.)","c":["60","80","100","120"],"a":2,"inc":false,"unit":"1-12"},{"id":"gwallisa-2013-05-11-18","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":18,"q":"열전도율 1.4kcal/mㆍhㆍ℃, 두께 10cm, 면적 30m2인 콘크리트 벽체가 있다. 벽체의 내측온도는 30℃, 외측온도는 -5℃일 때, 벽체를 통한 손실열량(kcal/h)은? (단, 푸리에(Fourier)법칙을 이용하여 구한다.)","c":["14,700","15,400","16,200","17,500"],"a":1,"inc":false,"unit":"1-7"},{"id":"gwallisa-2013-05-11-22","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":22,"q":"발포 폴리스타이렌(expanded polystyrene)이 연소하였을 때 발생될 수 있는 연소가스로 옳지 않은 것은? (문제 오류로 실제 시험에서는 2, 3번이 정답처리 되었습니다. 여기서는 2번을 누르면 정답 처리 됩니다.)","c":["이산화탄소","물","시안화수소","아크로레인"],"a":2,"inc":false,"unit":"6-2"},{"id":"gwallisa-2013-05-11-23","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":23,"q":"가연물 연소 시 발생되는 연기의 농도와 가시거리에 관한 설명으로 옳지 않은 것은? (문제 오류로 실제 시험에서는 모두 정답처리 되었습니다. 여기서는 1번을 누르면 정답 처리 됩니다.)","c":["어두침침한 것을 느낄 정도의 감광계수는 0.5m-1이고 가시거리가 4m이다.","건물을 잘 아는 사람이 피난에 지장을 느낄 정도의 감광계수는 0.3m-1이고 가시거리가 5m이다.","건물을 잘 알지 못하는 사람의 경우 가시거리는 20~30m이고 감광계수는 0.07~0.13m-1이다.","감광계수로 표시한 연기의 농도와 가시거리는 반비례의 관계를 갖는다."],"a":1,"inc":false,"unit":"1-5"},{"id":"gwallisa-2013-05-11-24","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":24,"q":"건축물 내 연기유동과 확산에 관한 설명으로 옳지 않은 것은?","c":["연기가 수평으로 유동할 경우 속도는 약 0.5∼1m/s이다.","건물 내부의 온도가 건물 외부의 온도보다 높을 경우 굴뚝효과에 의한 연기의 흐름은 아래로 이동한다.","계단실 등 수직방향으로의 연기속도는 화재초기 약 1.5m/s, 농연 시 약 3~4m/s로 인간의 보행속도보다 빠르다.","연기의 비중은 공기보다 크지만 발생 직후의 연기는 온도가 높기 때문에 건물의 상층부로 이동한다."],"a":2,"inc":false,"unit":"1-15"},{"id":"gwallisa-2013-05-11-30","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":30,"q":"관성력과 표면장력의 비를 나타내는 무차원수는?","c":["그라쇼프(Grashof) 수","프루드(Froude) 수","오일러(Euler) 수","웨버(Weber) 수"],"a":4,"inc":false,"unit":"4-3"},{"id":"gwallisa-2013-05-11-32","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":32,"q":"내경이 D, 길이가 L인 직관으로 이루어진 소화배관에서 흐르는 물의 양이 200ℓ/min일 때 마찰손실압력은 0.02MPa이다. 이 소화배관에서 흐르는 물의 양이 400ℓ/min로 증가한다면 마찰손실압력(MPa)은 약 얼마인가? (단, 마찰손실계산은 Hazen-Williams의 식을 따르고, 소화배관의 조도계수는 일정하다.)","c":["0.062","0.072","0.082","0.092"],"a":2,"inc":false,"unit":"4-3"},{"id":"gwallisa-2013-05-11-33","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":33,"q":"옥내소화전설비에 사용하는 소화펌프의 토출량이 1,000ℓ/min, 전양정이 100m, 펌프 전효율이 65%일 때 전동기의 출력(kW)은 약 얼마인가? (단, 소화펌프와 전동기의 동력전달계수(K)는 1.1로 가정한다.)","c":["22.6","25.6","27.6","30.6"],"a":3,"inc":false,"unit":"4-6"},{"id":"gwallisa-2013-05-11-35","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":35,"q":"포소화약제의 유화효과(emulsion effect)를 이용하여 소화할 수 있는 방호대상물로 가장 적합한 장소는?","c":["전자제품창고","유류저장고","종이창고","귀금속상점"],"a":2,"inc":false,"unit":"5-1"},{"id":"gwallisa-2013-05-11-36","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":36,"q":"소화수에 사용되는 첨가제 중 침투제에 관한 설명으로 옳은 것은?","c":["물의 표면장력을 감소시켜 심부화재소화를 돕는 첨가제","가연물과의 유화층 형성을 돕는 첨가제","물의 동결을 방지하기 위한 첨가제","물의 점도를 증가시켜 쉽게 흘러 유실되는 것을 방지하는 첨가제"],"a":1,"inc":false,"unit":"4-5"},{"id":"gwallisa-2013-05-11-37","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":37,"q":"포노즐을 통하여 포수용액 80ℓ를 포팽창비 5.0으로 방출시킬 경우 방출된 포의 체적(ℓ)은?","c":["0.0625","16","80","400"],"a":4,"inc":false,"unit":"5-2"},{"id":"gwallisa-2013-05-11-38","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":38,"q":"질식소화를 위한 연소한계산소농도가14.7vol%인 가연물질의 소화에 필요한 CO2 가스의 최소소화농도(vol%)는? (단, 무유출(No efflux)방식을 전제로 한다.)","c":["28","30","34","36"],"a":2,"inc":false,"unit":"1-5"},{"id":"gwallisa-2013-05-11-56","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":56,"q":"소방시설공사업법령상 소방시설 공사에 관한 설명으로 옳지 않은 것은?","c":["하나의 건축물에 영화상영관이 10개 이상인 신축 특정소방대상물은 성능위주설계를 하여야 한다.","공사업자가 구조변경ㆍ용도변경되는 특정소방대상물에 연소방지설비의 살수구역을 증설하는 공사를 할 경우 소방서장에게 착공신고를 하여야 한다.","하자보수 대상 소방시설 중 자동식소화기의 하자보수 보증기간은 3년이다.","연면적이 1,000제곱미터 이상인 특정소방대상물에 비상경보설비를 설치하는 경우에는 공사감리자를 지정해야 한다."],"a":4,"inc":false,"unit":"2-3"},{"id":"gwallisa-2013-05-11-59","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":59,"q":"특정소방대상물에 설치하는 소방시설 등의 유지ㆍ관리에 관한 설명으로 옳지 않은 것은?","c":["소방방재청장이 정하는 내진설계기준에 맞게 설치하여야 하는 소방시설은 소화설비 및 경보설비를 말한다.","화재안전기준이 변경되어 그 기준이 강화되는 경우, 강화된 기준을 적용하여야 하는 소방시설에는 자동화재속보설비가 포함된다.","특정소방대상물이 증축되는 경우 기존 부분과 증축 부분이 내화구조로 된 바닥과 벽으로 구획되어 있으면 기존 부분에 대해서는 증축 당시의 화재안전기준을 적용하지 아니한다.","수용인원 100명 이상의 판매시설 중 대규모 점포는 보조마스크가 장착된 인명구조용 공기호흡기를 층마다 두 대 이상 갖추어 두어야 한다."],"a":1,"inc":false,"unit":"9-9"},{"id":"gwallisa-2013-05-11-62","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":62,"q":"소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 복도 또는 통로로 연결된 둘 이상의 특정소방대상물을 하나의 소방대상물로 보지 않는 경우는?","c":["내화구조로 된 연결통로가 벽이 없는 구조로서 길이가 10미터인 경우","내화구조가 아닌 연결통로로 연결된 경우","지하보도, 지하상가, 지하가로 연결된 경우","지하구로 연결된 경우"],"a":1,"inc":false,"unit":"2-3"},{"id":"gwallisa-2013-05-11-68","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":68,"q":"위험물안전관리법령상 산화성고체에 해당하는 것은?","c":["유기과산화물","질산에스테르류","중크롬산염류","히드록실아민염류"],"a":3,"inc":false,"unit":"3-2"},{"id":"gwallisa-2013-05-11-70","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":70,"q":"위험물안전관리법령상 제조소등의 관계인이 예방규정을 정하여야 하는 제조소등의 기준에 해당하는 것은?","c":["지정수량의 10배 이상의 위험물을 취급하는 제조소","지정수량의 50배 이상의 위험물을 저장하는 옥외저장소","지정수량의 100배 이상의 위험물을 저장하는 옥내저장소","지정수량의 150배 이상의 위험물을 저장하는 옥외탱크저장소"],"a":1,"inc":false,"unit":"3-9"},{"id":"gwallisa-2013-05-11-71","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":71,"q":"위험물안전관리법령상 시ㆍ도지사의 권한을 한국소방산업기술원에 위탁하는 업무에 해당하는 것은?","c":["제조소등의 설치허가 또는 변경허가","군사목적인 제조소등의 설치에 관한 군부대의 장과의 협의","위험물의 품명ㆍ수량 또는 지정수량 배수의 변경신고의 수리","저장용량이 70만리터인 옥외탱크저장소 설치에 따른 완공검사"],"a":4,"inc":false,"unit":"3-9"},{"id":"gwallisa-2013-05-11-73","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":73,"q":"다중이용업소의 영업장에 설치ㆍ유지하여야 하는 안전시설 등에 관한 설명으로 옳지 않은 것은?","c":["지하층에 설치된 영업장에는 간이스프링클러설비를 설치하여야 한다.","노래반주기 등 영상음향장치를 사용하는 영업장에는 비상벨설비를 설치하여야 한다.","가스시설을 사용하는 주방이나 난방시설이 있는 영업장에는 가스누설경보기를 설치하여야 한다.","단란주점영업과 유흥주점영업의 영업장에는 피난유도선을 설치하여야 한다."],"a":2,"inc":false,"unit":"4-7"},{"id":"gwallisa-2013-05-11-77","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":77,"q":"제1류 위험물에 관한 설명으로 옳은 것은?","c":["산화성 고체로서 모두 물보다 가벼운 고체물질이다.","브롬산염류, 과염소산, 과산화수소 등이 있다.","무기과산화물의 화재시 주수 소화해야 한다.","가열ㆍ충격ㆍ마찰에 의하여 폭발의 위험성이 있다."],"a":4,"inc":false,"unit":"3-2"},{"id":"gwallisa-2013-05-11-81","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":81,"q":"제3류 위험물의 성질에 관한 설명으로 옳지 않은 것은?","c":["인화칼슘은 물과 반응하여 PH3가 발생한다.","나트륨 화재시 주수 소화를 하는 것이 안전하다.","황린은 발화점이 매우 낮고 공기 중에서 자연발화하기 쉽다.","칼륨은 물과 반응하여 발열하고 H2가 발생한다."],"a":2,"inc":false,"unit":"1-1"},{"id":"gwallisa-2013-05-11-82","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":82,"q":"제4류 위험물의 인화점에 따른 구분과 종류를 연결한 것 중 옳지 않은 것은?","c":["인화점 영하 10℃이하 - 특수인화물 - 메탄올","인화점 200℃이상 250℃미만 - 제4석유류 - 기어유","인화점 21℃이상 70℃미만 - 제2석유류 - 경유","인화점 21℃미만 - 제1석유류 - 휘발유"],"a":1,"inc":false,"unit":"1-1"},{"id":"gwallisa-2013-05-11-83","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":83,"q":"제4류 위험물에 관한 설명으로 옳지 않은 것은?","c":["크레오소트유–나프탈렌과 안트라센이 주성분이며 금속에 대한 부식성이 있다.","아크로레인–중합반응을 일으킬 수 있으며 공기에 의해 산화되어 프로필알코올이 된다.","콜로디온–용제(에탄올과 에테르)가 증발하면 제5류 위험물과 같은 위험성이 있다.","글리세린–니트로글리세린의 원료이며 과망간산칼륨과 혼촉발화한다."],"a":2,"inc":false,"unit":"1-1"},{"id":"gwallisa-2013-05-11-84","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":84,"q":"제5류 위험물의 종류와 성질 및 취급에 관한 설명으로 옳지 않은 것은?","c":["유기과산화물의 지정수량은 10kg이다.","질산에스테르류는 외부로부터 산소의 공급이 없어도 자기연소하며 연소속도가 빠르다.","니트로글리세린, 알킬리튬, 알킬알루미늄 등이 있다.","위험물제조소에는 적색바탕에 백색문자로 “화기엄금”이라는 주의사항을 표시한 게시판을 설치해야 한다."],"a":3,"inc":false,"unit":"1-10"},{"id":"gwallisa-2013-05-11-88","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":88,"q":"위험물안전관리법령상 안전거리에 관하여 규제를 받지 않는 제조소등으로만 짝지어진 것은?","c":["옥내저장소, 암반탱크저장소","지하탱크저장소, 옥내탱크저장소","옥외탱크저장소, 제조소","일반취급소, 옥외저장소"],"a":2,"inc":false,"unit":"3-9"},{"id":"gwallisa-2013-05-11-89","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":89,"q":"위험물안전관리법령상 위험물제조소의 기준으로 옳은 것은?","c":["조명설비의 전선은 내화ㆍ내열전선으로 할 것","채광설비는 연소의 우려가 없는 장소에 설치하되 채광면적을 최대로 할 것","환기설비의 급기구는 높은 곳에 설치하고 구리망 등으로 인화방지망을 설치할 것","배출설비의 배풍기는 자연배기방식으로 할 것"],"a":1,"inc":false,"unit":"7-8"},{"id":"gwallisa-2013-05-11-90","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":90,"q":"위험물제조소의 하나의 방유제 안에 톨루엔 200m3와 경유 100m3를 저장한 옥외취급탱크가 각 1기씩 있다. 위험물안전관리법령상 탱크 주위에 설치하여야 할 방유제 용량은 최소 몇 m3 이상이 되어야 하는가?","c":["100","110","220","330"],"a":2,"inc":false,"unit":"3-10"},{"id":"gwallisa-2013-05-11-92","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":92,"q":"위험물안전관리법령상 위험물제조소에 설치하는 옥내소화전설비의 설치기준으로 옳지 않은 것은?","c":["비상전원의 용량은 그 설비를 유효하게 20분이상 작동시키는 것이 가능할 것","배선은 600V 2종 비닐전선 또는 이와 동등이상의 내열성을 갖는 전선을 사용할 것","각 소화전의 노즐선단 방수량은 260ℓ/min이상일 것","주배관 중 입상관은 관의 직경이 50mm이상인 것으로 할 것"],"a":1,"inc":false,"unit":"4-6"},{"id":"gwallisa-2013-05-11-94","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":94,"q":"위험물안전관리법령상 옥내저장소의 시설기준에 관한 내용으로 옳지 않은 것은? (단, 다층건물 및 복합용도 건축물의 옥내저장소는 제외) (문제 오류로 실제 시험에서는 2, 4번이 정답처리 되었습니다. 여기서는 2번을 누르면 정답 처리 됩니다.)","c":["저장창고는 위험물 저장을 전용으로 하는 독립된 건축물로 하여야 한다.","지붕은 내화구조로 하되 반자를 설치하여야 한다.","제1류 위험물을 저장할 경우 지면에서 처마까지의 높이가 6m미만의 단층 건물로 해야 한다.","내화구조로 된 옥내저장소에 적린 600kg을 저장할 경우 너비 2m이상의 공지를 확보해야 한다."],"a":2,"inc":false,"unit":"3-9"},{"id":"gwallisa-2013-05-11-95","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":95,"q":"위험물안전관리법령상 이황화탄소를 제외한 인화성 액체위험물을 저장하는 옥외탱크저장소의 방유제 시설기준에 관한 내용으로 옳지 않은 것은?","c":["방유제의 높이는 0.5m이상, 3m이하로 한다.","옥외저장탱크의 총용량이 20만ℓ초과인 경우 방유제 내에 설치하는 탱크수는 10이하로 한다.","방유제 안에 탱크가 1개 설치된 경우 방유제의 용량은 그 탱크 용량으로 한다.","높이가 1m를 넘는 방유제의 안팎에는 계단 또는 경사로를 약50m마다 설치해야 한다."],"a":3,"inc":false,"unit":"3-9"},{"id":"gwallisa-2013-05-11-96","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":96,"q":"위험물안전관리법령상 이동탱크저장소의 시설기준에 관한 내용으로 옳은 것은?","c":["옥외 상치장소로서 인근에 1층 건축물이 있는 경우에는 5m이상 거리를 두어야 한다.","압력탱크 외의 탱크는 70kPa의 압력으로 30분간 수압시험을 실시하여 새거나 변형되지 않아야 한다.","액체위험물의 탱크내부에는 4,000ℓ이하마다 3.2mm이상의 강철판 등으로 칸막이를 설치해야 한다.","차량의 전면 및 후면에는 사각형의 백색바탕에 적색의 반사도료로 “위험물”이라고 표시한 표지를 설치해야 한다."],"a":3,"inc":false,"unit":"3-9"},{"id":"gwallisa-2013-05-11-97","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":97,"q":"위험물안전관리법령상 과산화수소 5,000kg을 저장하는 옥외저장소에 설치하여야 할 경보설비의 종류에 해당되지 않는 것은?","c":["자동화재탐지설비","비상경보설비","확성장치","자동화재속보설비"],"a":4,"inc":false,"unit":"3-10"},{"id":"gwallisa-2013-05-11-101","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":101,"q":"내화구조의 건축물에 바닥면적이 310m2인 무도학원(실내마감재료는 불연재료)에 소화기구 설치시 필요한 최소능력단위는?","c":["3","6","8","11"],"a":2,"inc":false,"unit":"2-3"},{"id":"gwallisa-2013-05-11-105","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":105,"q":"간이스프링클러설비의 설치기준으로 옳지 않은 것은?","c":["간이헤드의 작동온도는 실내의 최대 주위 천장온도가 0℃ 이상 38℃ 이하인 경우 공칭작동온도가 57℃에서 77℃의 것을 사용할 것","상수도직결형의 상수도압력은 가장 먼 가지배관에서 2개의 간이헤드를 동시에 개방할 경우 각각의 간이헤드 선단 방수압력은 0.1MPa 이상으로 할 것","비상전원은 간이스프링클러설비를 유효하게 10분(근린생활시설의 경우 20분) 이상 작동될 수 있도록 할 것","송수구는 구경 65mm의 단구형 또는 쌍구형으로 하여야 하며, 송수배관의 안지름은 32mm 이상으로 할 것"],"a":4,"inc":false,"unit":"4-7"},{"id":"gwallisa-2013-05-11-106","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":106,"q":"물분무소화설비를 설치하는 차고 또는 주차장의 배수설비 설치기준으로 옳은 것은?","c":["차량이 주차하는 장소의 적당한 곳에 높이 15cm 이상의 경계턱으로 배수구를 설치할 것","길이 60m 이하마다 집수관ㆍ소화핏트 등 기름분리장치를 설치할 것","차량이 주차하는 바닥은 배수구를 향하여 100분의 1 이상의 기울기를 유지할 것","배수설비는 가압송수장치의 최대송수능력의 수량을 유효하게 배수할 수 있는 크기 및 기울기로 할 것"],"a":4,"inc":false,"unit":"4-10"},{"id":"gwallisa-2013-05-11-108","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":108,"q":"포소화설비의 화재안전기준에서 전역방출방식의 고발포용고정포방출구의 설치기준으로 옳지 않은 것은?","c":["차고 또는 주차장의 대상물에 포의 팽창비가 300인 고정포방출구는 당해 방호구역의 관포체적 1m3에 대하여 1분당 방출량이 0.28ℓ 이상의 양이 되도록 할 것","항공기 격납고의 대상물에 포의 팽창비가 300인 고정포방출구는 당해 방호구역의 관포체적 1m3에 대하여 1분당 방출량이 0.5ℓ 이상의 양이 되도록 할 것","고정포방출구는 바닥면적 500m2 마다 1개 이상으로 할 것","고정포방출구는 방호대상물의 최고부분보다 낮은 위치에 설치할 것"],"a":4,"inc":false,"unit":"5-2"},{"id":"gwallisa-2013-05-11-110","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":110,"q":"할로겐화합물소화설비의 화재안전기준에 의한 기동장치의 설치기준으로 옳은 것은?","c":["수동식 기동장치의 조작부는 바닥으로부터 높이 1m 이상 1.5m 이하의 위치에 설치할 것","가스압력식 기동장치의 기동용가스용기는 25MPa 이상의 압력에 견딜 수 있을 것","가스압력식 기동장치의 기동용가스용기에는 내압시험압력의 0.8배 내지 1.2배 사이에서 작동하는 안전장치를 설치할 것","수동식기동장치의 전역방출방식에 있어서는 방호대상물마다, 국소방출방식에 있어서는 방호구역마다 설치할 것"],"a":2,"inc":false,"unit":"6-3"},{"id":"gwallisa-2013-05-11-112","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":112,"q":"청정소화약제소화설비를 사람이 상주하는 곳에 설치시 소화약제량의 최대허용설계농도기준으로 옳지 않은 것은?","c":["HCFC BLEND A : 10%","HFC-23 : 40%","HFC-125 : 11.5%","IG-55 : 43%"],"a":2,"inc":false,"unit":"6-3"},{"id":"gwallisa-2013-05-11-113","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":113,"q":"분말소화설비의 화재안전기준에 따른 소화약제 저장용기의 설치기준으로 옳지 않은 것은?","c":["제3종 분말 저장용기의 내용적은 소화약제 1kg당 1ℓ로 할 것","저장용기의 충전비는 0.8 이상으로 할 것","축압식 저장용기에 내압시험압력의 1.8배 이하에서 작동하는 안전밸브를 설치할 것","저장용기 및 배관에 잔류 소화약제를 처리할 수 있는 청소장치를 설치할 것"],"a":3,"inc":false,"unit":"6-1"},{"id":"gwallisa-2013-05-11-115","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":115,"q":"자동화재속보설비의 화재안전기준에 의한 설치기준으로 옳지 않은 것은?","c":["노유자시설에 상시 근무인원이 10인 이하인 경우 자동화재속보설비를 설치하지 아니할 수 있다.","스위치는 바닥으로부터 0.8m 이상 1.5m 이하의 높이에 설치하여야 한다.","속보기는 소방관서에 통신망으로 통보하도록 하여야 한다.","자동화재탐지설비와 연동으로 작동하여 자동적으로 화재발생상황을 소방관서에 전달되는 것으로 하여야 한다."],"a":1,"inc":false,"unit":"9-9"},{"id":"gwallisa-2013-05-11-118","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":118,"q":"피난기구 설치시 피난 또는 소화활동상 유효한 개구부의 크기 기준으로 옳은 것은?","c":["가로 0.5m 이상, 세로 1m 이상","가로 및 세로가 각 0.6m 이상","가로 0.3m 이상, 세로 0.6m 이상","가로 0.5m 이상, 세로 0.8m 이상"],"a":1,"inc":false,"unit":"7-3"},{"id":"gwallisa-2013-05-11-122","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":122,"q":"연결살수설비의 화재안전기준에 의한 설치기준으로 옳지 않은 것은?","c":["교차배관에는 가지배관과 가지배관사이마다 1개 이상의 행가를 설치하되, 가지배관 사이의 거리가 4.5m를 초과하는 경우에는 4.5m 이내마다 1개 이상 설치할 것","개방형헤드를 사용하는 연결살수설비의 수평주행배관은 헤드를 향하여 상향으로 100분의 1 이상의 기울기로 설치할 것","천장 또는 반자의 각 부분으로부터 하나의 살수헤드까지의 수평거리가 연결살수설비전용헤드의 경우 2.3m 이하로 할 것","습식 연결살수설비의 배관은 동결방지조치를 하거나 동결의 우려가 없는 장소에 설치할 것"],"a":3,"inc":false,"unit":"4-11"},{"id":"gwallisa-2013-05-11-123","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":123,"q":"비상콘센트설비의 화재안전기준에 관한 설명으로 옳지 않은 것은?","c":["하나의 전용회로에 설치하는 비상콘센트는 10개 이하로 할 것","비상콘센트의 전원부와 외함 사이의 절연저항은 전원부와 외함 사이를 500V 절연저항계로 측정할 때 20MΩ 미만일 것","비상콘센트는 바닥으로부터 0.8m 이상 1.5m 이하의 위치에 설치할 것","전원회로는 각 층에 2 이상이 되도록 설치할 것. 다만, 설치하여야 할 층의 비상콘센트가 1개인 때에는 하나의 회로로 할 수 있다."],"a":2,"inc":false,"unit":"9-9"},{"id":"gwallisa-2013-05-11-124","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2013-05-11","num":124,"q":"무선통신보조설비를 구성하는 장치로서 두 개 이상의 입력신호를 원하는 비율로 조합한 출력이 발생하도록 하는 장치는?","c":["분배기","분파기","증폭기","혼합기"],"a":4,"inc":false,"unit":"8-7"},{"id":"gwallisa-2014-05-17-3","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":3,"q":"화재의 분류와 표시색의 연결이 옳은 것은?","c":["일반화재(A급) -무색","유류화재(B급) -황색","전기화재(C급) - 백색","금속화재(D급) - 청색"],"a":2,"inc":false,"unit":"1-17"},{"id":"gwallisa-2014-05-17-5","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":5,"q":"축압식 분말 소화기에 관한 설명으로 옳지 않은 것은?","c":["충전압력은 0.7∼ 0.98MPa 이다.","지시압력계가 적색을 지시하면 과충전 상태이다.","지시압력계가 황색을 지시하면 정상 상태이다.","소화약제와 불활성 기체를 하나의 용기에 충전시켜 사용한다."],"a":3,"inc":false,"unit":"4-5"},{"id":"gwallisa-2014-05-17-6","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":6,"q":"연소용어에 관한 설명으로 옳지 않은 것은?","c":["인화점은 액면에서 증발된 증기의 농도가 그 증기의 연소하한계에 도달한 때의 온도이다.","위험도는 연소하한계가 낮고 연소범위가 넓을수록 증가한다.","연소점은 연소상태에서 점화원을 제거하여도 자발적으로 연소가 지속되는 온도이다.","발화점은 파라핀계탄화수소 화합물의 경우 탄소수가 적을수록 낮아진다."],"a":4,"inc":false,"unit":"1-1"},{"id":"gwallisa-2014-05-17-7","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":7,"q":"연소의 개념과 형태에 관한 설명으로 옳은 것은?","c":["폭굉 발생 시 화염전파 속도는 음속보다 느리다.","목탄(숯), 코크스, 금속분 등은 분해연소를 한다.","기체연료의 연소형태는 확산연소, 예혼합연소, 증발연소가 있다.","열가소성 수지는 연소되면서 용융 액면이 넓어져 화재의 확산이 빨라진다."],"a":4,"inc":false,"unit":"1-6"},{"id":"gwallisa-2014-05-17-8","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":8,"q":"포소화약제의 주된 소화원리와 동일한 것은?","c":["식용유 화재 시 용기의 뚜껑을 덮어서 소화","촛불을 입으로 불어서 소화","산불의 진행방향 쪽을 벌목하여 소화","전기실 화재에 할로겐화합물 소화약제를 방사하여 소화"],"a":1,"inc":false,"unit":"5-1"},{"id":"gwallisa-2014-05-17-9","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":9,"q":"목재 500kg과 종이 박스 300kg이 쌓여 있는 컨테이너(폭: 2.4m, 길이: 6m, 높이:2.4m) 내부의 화재하중(kg/m2)은? (단, 목재의 단위발열량은 18,855 kJ/kg이며, 종이의 단위발열량은 16,760 kJ/kg 이다.)","c":["22.18","53.24","133.10","223.08"],"a":2,"inc":false,"unit":"1-12"},{"id":"gwallisa-2014-05-17-10","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":10,"q":"가연물의 연소 시 에너지 방출속도를 측정하는 콘 칼로리미터에 관한 설명으로 옳지 않은 것은?","c":["기기의 측정요소 중 가연물의 질량 감소를 측정한다.","가연물의 연소열에 따라 에너지 방출속도가 다를 수 있다.","동일한 가연물일지라도 점화방법, 점화위치에 따라 연소속도가 다를 수 있다.","가연물의 연소생성물 중 일산화탄소 농도를 측정하여 에너지 방출속도를 산출한다."],"a":4,"inc":false,"unit":"1-5"},{"id":"gwallisa-2014-05-17-11","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":11,"q":"열전달 형태에 관한 설명으로 옳지 않은 것은?","c":["전자기파의 형태로 열이 전달되는 것을 복사라 한다.","유체의 흐름에 의하여 열이 전달되는 것을 대류라 한다.","전도열량은 면적, 온도차, 열전도율에 비례하고 두께에 반비례한다.","전도는 뉴턴의 냉각법칙을 따른다."],"a":4,"inc":false,"unit":"1-7"},{"id":"gwallisa-2014-05-17-12","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":12,"q":"면적 0.8m2의 목재표면에서 연소가 일어날 때 에너지 방출속도(Q)는 몇 kW 인가? (단, 목재의 최대 질량연소유속(m)=11g/m2ㆍs, 기화열(L)=4 kJ/g, 유효 연소열(△Hc)=15 kJ/g이다.)","c":["35.2","96.8","132.0","167.2"],"a":3,"inc":false,"unit":"1-8"},{"id":"gwallisa-2014-05-17-20","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":20,"q":"다음 중 용어에 관한 설명으로 옳지 않은 것은?","c":["을종방화문은 비차열 1시간 이상 성능이 확보되어야 한다.","피난층이란 곧바로 지상으로 갈수 있는 출입구가 있는 층을 말한다.","무창층의 유효개구부는 도로 또는 차량이 진입할 수 있는 빈터로 향하여야 한다.","소방시설이란 소화설비, 경보설비, 피난설비, 소화용수설비, 그 밖에 소화활동설비로서 대통령령으로 정하는 것을 말한다."],"a":1,"inc":false,"unit":"8-7"},{"id":"gwallisa-2014-05-17-23","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":23,"q":"건축물에 설치하는 방화구획의 기준에 관한 설명으로 옳지 않은 것은?","c":["스프링클러 소화설비가 설치된 10층 이하의 층은 바닥면적 3,000m2 이내마다 구획한다.","3층 이상의 층과 지하층은 층마다 구획한다.","11층 이상의 층은 바닥면적 600m2 이내마다 구획한다.","벽 및 반자의 실내에 접하는 부분의 마감이 불연재료이고 스프링클러 소화설비가 설치된 11층 이상의 층은 1,500m2 이내마다 구획한다."],"a":3,"inc":false,"unit":"2-1"},{"id":"gwallisa-2014-05-17-24","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":24,"q":"건축물 화재에 대응한 피난계획의 일반적 원칙으로 옳지 않은 것은?","c":["2개 방향의 피난동선을 상시 확보한다.","피난수단은 전자기기나 기계장치로 조작하여 작동하는 것을 우선한다.","피난경로에 따라서 일정한 구획을 한정하여 피난구역을 설정한다.","‘fool proof’와 ‘fail safe’의 원칙을 중시한다."],"a":2,"inc":false,"unit":"7-1"},{"id":"gwallisa-2014-05-17-27","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":27,"q":"동일한 고도에서 베르누이 방정식을 만족하는 유동이 유선을 따라 흐를 때, 유선내에서 일정한 값을 갖는 것은?","c":["전압과 정체압","정압과 국소압력","내부에너지","동압과 속도압력"],"a":1,"inc":false,"unit":"4-2"},{"id":"gwallisa-2014-05-17-28","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":28,"q":"4단 소화펌프가 정격유량 2m3/min, 회전수 2,000rpm, 양정 60m일 경우 비속도는 약 얼마인가?","c":["351","361","371","381"],"a":3,"inc":false,"unit":"4-4"},{"id":"gwallisa-2014-05-17-29","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":29,"q":"레이놀즈수에 관한 설명으로 옳은 것은?","c":["등속류와 비등속류를 구분하는 기준이 된다.","레이놀즈수의 물리적 의미는 관성력과 점성력의 관계를 나타낸다.","정상류와 비정상류를 구분하는 기준이 된다.","하임계 레이놀즈수는 층류에서 난류로 변할 때의 레이놀즈수이다."],"a":2,"inc":false,"unit":"4-3"},{"id":"gwallisa-2014-05-17-30","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":30,"q":"압축공기용 탱크 내부의 온도는 20℃이고, 계기압력은 345kPa이다. 이때 이상기체의 가정 하에 탱크 내에 공기의 밀도는 약 몇 kg/m3 인가? (단, 대기압은 101.3kPa, 공기의 기체상수는 286.9J/kgㆍ이다.)","c":["0.08","4.10","5.31","77.78"],"a":3,"inc":false,"unit":"14-2"},{"id":"gwallisa-2014-05-17-34","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":34,"q":"일반화재, 유류화재, 전기화재에 모두 적응성이 있는 분말소화약제의 종류와 주성분의 연결로 옳은 것은?","c":["제2종 분말소화약제 - NaHCO3","제2종 분말소화약제 - (NH2)2CO","제3종 분말소화약제 - NH4H2PO4","제3종 분말소화약제 - Na2CO3"],"a":3,"inc":false,"unit":"6-1"},{"id":"gwallisa-2014-05-17-35","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":35,"q":"다음 중 부촉매효과가 없는 소화약제는?","c":["Halon 1301 소화약제","제1종 분말소화약제","HFC-125 청정소화약제","IG-100 청정소화약제"],"a":4,"inc":false,"unit":"6-1"},{"id":"gwallisa-2014-05-17-36","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":36,"q":"화재안전기준상 청정소화약제별 최대허용설계농도(%)로 옳지 않은 것은?","c":["HFC-227ea : 10.5%","HCFC BLEND A : 10%","FK-5-1-12 : 15%","IG-55 : 43%"],"a":3,"inc":false,"unit":"6-3"},{"id":"gwallisa-2014-05-17-37","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":37,"q":"탄화칼슘(CaC2) 화재 시 가장 적합한 소화방법은?","c":["물을 주수하여 냉각 소화한다.","이산화탄소를 방사하여 질식 소화한다.","마른모래로 질식 소화한다.","할로겐화합물 약제를 사용하여 부촉매 소화한다."],"a":3,"inc":false,"unit":"6-3"},{"id":"gwallisa-2014-05-17-38","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":38,"q":"다음 중 물소화약제에 관한 설명으로 옳지 않은 것은?","c":["침투제를 사용하여 물의 표면장력을 증가시키면 심부화재에 적용 가능하다.","다른 소화약제에 비해 비열 및 기화열이 크다.","무상주수를 통해 질식, 냉각이 가능하다.","희석소화를 통해 수용성 가연물질 화재에 적용 가능하다."],"a":1,"inc":false,"unit":"4-5"},{"id":"gwallisa-2014-05-17-39","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":39,"q":"화재안전기준상 청정소화약제인 IG-541의 혼합가스 체적 성분비는?","c":["N2 50[%], Ar 40[%], CO 10[%]","N2 52[%], Ar 40[%], CO2 8[%]","CO2 50[%], Ar 40[%], N2 10[%]","CO2 52[%], Ar 40[%], N2 8[%]"],"a":2,"inc":false,"unit":"6-3"},{"id":"gwallisa-2014-05-17-40","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":40,"q":"납축전지의 전해액으로 옳은 것은?","c":["Cd(OH)2","H2SO4","PbSO4","MnO2"],"a":2,"inc":false,"unit":"9-6"},{"id":"gwallisa-2014-05-17-41","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":41,"q":"전류가 흐르는 도체 주위의 자계 방향을 결정하는 법칙은?","c":["패러데이의 법칙","렌츠의 법칙","플레밍의 오른손 법칙","암페어의 오른나사 법칙"],"a":4,"inc":false,"unit":"9-1"},{"id":"gwallisa-2014-05-17-44",
