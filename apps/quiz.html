 것","수신기는 감지기, 중계기 또는 발신기가 작동하는 경계구역을 표시할 수 있는 것으로 설치할 것","하나의 경계구역은 여러 개 표시등으로 표시하여 공동감시가 가능토록 설치할 것","실내면적이 50m2 이상으로 열이나 연기 등으로 인하여 감지기가 일시적인 화재신호를 발신할 우려가 있는 경우에는 축적기능이 있는 수신기를 설치할 것"],"a":2,"inc":false,"unit":"8-7"},{"id":"gwallisa-2018-04-28-117","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":117,"q":"포소화설비의 화재안전기준상 포헤드 및 고정포방출구 설치기준으로 옳지 않은 것은?","c":["포헤드의 1분당 바닥면적 1 m2당 방사량으로 차고ㆍ주차장에 합성계면활성제포 소화약제 6.5ℓ 이상","포헤드 및 고정포방출구의 팽창비가 20 이하인 경우에는 포헤드 압축공기 포헤드를 사용한다","포워터스프링클러헤드는 특정소방대상물의 천장 또는 반자에 설치하되, 바닥면적 8m2마다 1개 이상으로 하여 해당 방호대상물의 화재를 유효하게 소화할 수 있도록 할 것","포헤드는 특정소방대상물의 천장 또는 반자에 설치하되, 바닥면적 9 m2 마다 1개 이상으로 하여 해당 방호대상물의 화재를 유효하게 소화할수 있도록 할 것"],"a":1,"inc":false,"unit":"5-2"},{"id":"gwallisa-2018-04-28-118","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":118,"q":"소방시설의 내진설계기준에서 규정하고 있는 배관의 내진설계 기준으로 옳지 않은 것은?","c":["건물의 지진분리이음이 설치된 위치의 배관에는 직경과 상관없이 지진분리장치를 설치하여야 한다","배관에 대한 내진설계를 실시할 경우 지진분리이음은 배관의 수량ㆍ수직 지진하중을 산정하여야 한다.","배관의 변형을 최소화하고 소화설비 주요 부품사이의 유연성을 증가시킬 수 있는 것으로 설치하여야 한다","버팀대와 고정장치는 소화설비의 동작 및 살수를 방해하지 않아야 한다"],"a":2,"inc":false,"unit":"13-1"},{"id":"gwallisa-2018-04-28-119","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":119,"q":"스프링클러설비의 화재안전기준상 폐쇄형스프링클러설비의 방호구역ㆍ유수검지장치의 기준으로 옳지 않은 것은?","c":["자연낙차에 따른 압력수가 흐르는 배관 상에 설치된 유수검지장치는 화재시 물의 흐름을 검지할 수 있는 최대한의 압력이 얻어질 수 있도록 수조의 상단으로부터 낙차를 두어 설치할 것","하나의 방호구역에는 1개 이상의 유수검지장치를 설치하되, 화재발생시 접근이 쉽고 점검하기 편리한 장소에 설치할 것","스프링클러헤드에 공급되는 물은 유수검지장치를 지나도록 할 것. 다만, 송수구를 퉁하여 공급되는 물은 그러하지 아니하다.","조기반응형 스프링클러헤드를 설치하는 경우에는 습식유수검지장치 또는 부압식 스프링클러설비를 설치할 것"],"a":1,"inc":false,"unit":"4-7"},{"id":"gwallisa-2018-04-28-120","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":120,"q":"미분무소화설비의 화재안전기준상 헤드의 설치기준으로 옳지 않은 것은?","c":["미분무헤드는 설계도면과 동일하게 설치하여야 한다.","미분무헤드는 소방대상물의 천장ㆍ반자ㆍ천장과 반자사이ㆍ덕트ㆍ선반 기타 이와 유사한 부분에 설계자의 의도에 적합하도록 설치하여야 한다","미분무소화설비에 사용되는 헤드는 개방형 헤드를 설치하여야 한다","미분무헤드는 배관, 행거 등으로부터 살수가 방해되지 아니하도록 설치하여야 한다."],"a":3,"inc":false,"unit":"4-10"},{"id":"gwallisa-2018-04-28-121","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":121,"q":"간이스프링클러설비의 화재안전기준상 상수도 직결형의 배관 및 밸브 설치순서로 옳은 것은?","c":["수도용계량기, 급수차단장치, 개폐표시형밸브, 압력계, 체크밸브, 유수검지장치, 2개의 시험밸브의 순으로 설치할 것","수도용계량기, 급수차단장치, 개폐표시형밸브, 체크밸브, 압력계, 유수검지장치, 2개의 시험밸브의 순으로 설치할 것","급수차단장치, 수도용계량기, 개폐표시형밸브, 체크밸브, 압력계, 유수검지장치, 2개의 시험밸브의 순으로 설치할 것","수도용계량기, 개폐표시형밸브, 급수차단장치, 체크밸브, 압력계, 유수검지장치, 2개의 시험밸브의 순으로 설치할 것"],"a":2,"inc":false,"unit":"4-7"},{"id":"gwallisa-2018-04-28-122","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":122,"q":"지상 5층 복합건축물 각층에 최대 옥내소화전 3개와 폐쇄형스프링클러헤드 60개가 설치되어 있을 경우, 필요한 수원의 양(m3)은?(2021년 04월 01일 개정된 규정 적용됨)","c":["101.2","57.8","53.2","52.6"],"a":3,"inc":false,"unit":"4-6"},{"id":"gwallisa-2018-04-28-123","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":123,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 옥외소화설비 설치 대상으로 옳은 것은?","c":["동일구내 각각의 건축물이 다른 건축물의 2층 외벽으로부터 수평거리가 10.5m 이며, 지상 1층 및 2층 바닥면적 합계가 5,000m2 인 건축물","가연성 액체류 1,000m3 이상을 저장하는 창고","국보로 지정된 석조건축물","볏짚류 750,000Kg 이상을 저장하는 창고"],"a":4,"inc":false,"unit":"3-1"},{"id":"gwallisa-2018-04-28-124","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":124,"q":"자동화재탐지설비 및 시각경보장치의 화재안전기준상 청각장애인용 시각경보장치의 설치기준으로 옳지 않은 것은?","c":["설치높이는 바닥으로부터 2m 이상 2.5m 이하의 장소에 설치할 것","천장의 높이가 2m 이하인 경우에는 천장으로부터 1 m 이내의 장소에 설치하여야 한다","복도ㆍ통로ㆍ청각장애인용 객실 및 공용으로 사용하는 거실에 설치하며, 각 부분으로 부터 유효하게 경보를 발할 수 있는 위치에 설치할 것","공연장ㆍ집회장ㆍ관람장 또는 이와 유사한 장소에 설치하는 경우에는 시선이 집중되는 무대부 부분 등에 설치할 것"],"a":2,"inc":false,"unit":"8-7"},{"id":"gwallisa-2019-05-11-1","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":1,"q":"공기 중의 산소농도가 증가할수록 화재 시 일어나는 현상으로 옳지 않은 것은?","c":["점화에너지가 커진다.","발화온도가 낮아진다.","폭발범위가 넓어진다.","연소속도가 빨라진다."],"a":1,"inc":false,"unit":"1-1"},{"id":"gwallisa-2019-05-11-2","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":2,"q":"물이 어는 온도(0℃)를 화씨온도(℉)와 절대온도(°R)로 나타낸 옳은 것은?","c":["0℉, 460°R","0℉, 492","32℉, 460°R","32℉, 492"],"a":4,"inc":false,"unit":"4-1"},{"id":"gwallisa-2019-05-11-3","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":3,"q":"가연물의 종류와 연소형태의 연결이 옳지 않은 것은?","c":["숯-표면연소","에틸벤젠-자기연소","가솔린-증발연소","종이-분해연소"],"a":2,"inc":false,"unit":"1-5"},{"id":"gwallisa-2019-05-11-9","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":9,"q":"화재의 종류별 특성에 관한 옳지 않은 것은?","c":["금속화재는 나트륨, 칼륨 등 금속가연물에 의한 화재로 물에 의한 냉각소화가 효과적이다.","유류화재는 인화성액체에 의한 화재로 (Foam)를 이용한 질식소화가 효과적이다.","전기화재는 통전 중인 전기기기에서 발생하는 화재로 이산화탄소에 의한 질식소화가 효과적이다.","일반화재는 종이, 목재에 의한 화재로 물에 의한 냉각소화가 효과적이다."],"a":1,"inc":false,"unit":"6-2"},{"id":"gwallisa-2019-05-11-10","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":10,"q":"두께 3cm인 내열판의 한 쪽 면의 온도는 500℃, 다른 쪽 면의 온도는 50℃일 때, 이 판을 통해 일어나는 열전달량(W/m2)은? (단, 내열판의 열전도도는 0.1W/mㆍ℃이다.)","c":["13.5","150.0","1350.0","1500.0"],"a":4,"inc":false,"unit":"1-7"},{"id":"gwallisa-2019-05-11-14","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":14,"q":"건축물의 피난ㆍ방화구조 등의 기준에 관한 규칙에서 정하고 있는 건축물의 피난안전구역의 설치기준 중 구조 및 설비기준으로 옳지 않은 것은?","c":["피난안전구역의 높이는 2.1미터 이상일 것","피난안전구역의 내부마감재료는 준불연재료로 설치할 것","비상용 승강기는 피난안전구역에서 승하차 할 수 있는 구조로 설치할 것","건축물의 내부에서 피난안전구역으로 통하는 계단은 특별피난계단의 구조로 설치할 것"],"a":2,"inc":false,"unit":"2-3"},{"id":"gwallisa-2019-05-11-16","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":16,"q":"내화건축물의 구획실내에서 가연물의 연소 시, 성장기의 지배적 열전달로 옳은 것은?","c":["복사","대류","전도","확산"],"a":2,"inc":false,"unit":"1-5"},{"id":"gwallisa-2019-05-11-17","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":17,"q":"화재로 인해 공장 벽체의 내부 표면온도가 450℃까지 상승하였으며, 벽체 외부의 공기온도는 15℃일 때 벽체 외부 표면온도(℃)는 약 얼마인가? (단, 벽체의 두께는 200mm이고, 벽체의 열전도계수는 0.69W/mㆍK, 대류열전달계수는 12W/m2ㆍK이다. 복사의 영향과 벽체 상ㆍ하부로의 열전달 및 기타의 손실은 무시하며, 0℃는 273K이고, 소수점 이하 셋째자리에서 반올림한다.)","c":["112.14","121.14","235.14","385.14"],"a":1,"inc":false,"unit":"1-7"},{"id":"gwallisa-2019-05-11-20","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":20,"q":"연기농도를 측정하는 감광계수, 중량농도법, 입자농도법의 단위를 순서대로 나열한 것으로 옳은 것은?","c":["m-1, 개/cm3, mg/m3","m-1, mg/m3, 개/cm3","m-3, mg/m3, 개/cm3","m-3, 개/cm3, mg/m3"],"a":2,"inc":false,"unit":"1-14"},{"id":"gwallisa-2019-05-11-22","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":22,"q":"면적이 0.15m2인 합판이 연소되면서 발생한 열방출량(Heat release rate)(kW)은 약 얼마인가? (단, 평균질량감소율은 0.03kg/m2ㆍs, 연소열은 25kJ/g, 연소효율은 55%이며, 소수점 이하 셋째자리에서 반올림한다.)","c":["0.06","0.20","61.88","204.50"],"a":3,"inc":false,"unit":"1-8"},{"id":"gwallisa-2019-05-11-26","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":26,"q":"이상기체의 부피변화와 관련된 것은?","c":["아르키메데스(Archimedes)의 원리","아보가드로(Avogadro)의 법칙","베르누이(Bernoulli)의 정리","하젠-윌리엄스(Hazen-Wiloliams)의 공식"],"a":2,"inc":false,"unit":"14-2"},{"id":"gwallisa-2019-05-11-27","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":27,"q":"모세관 현상으로 인해 물이 상승할 때, 그 상승높이에 관한 설명으로 옳지 않은 것은?","c":["관의 직경에 비례한다.","표면장력에 비례한다.","물의 비중량에 반비례한다.","수면과 관의 접촉각이 커질수록 감소한다."],"a":1,"inc":false,"unit":"4-5"},{"id":"gwallisa-2019-05-11-28","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":28,"q":"다시-바이스바하(Darcy-Weisbach) 공식에서 마찰손실수두에 관한 설명으로 옳지 않은 것은?","c":["관의 직경에 반비례한다.","관의 길이에 비례한다.","마찰손실계수에 비례한다.","유속에 반비례한다."],"a":4,"inc":false,"unit":"14-2"},{"id":"gwallisa-2019-05-11-30","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":30,"q":"전양정이 30m인 펀프가 물을 0.03m3/s로 수송할 때, 펌프의 축동력(kW)은 약 얼마인가? (단, 물의 비중량은 9,800N/m3, 중력가속도는 9.8m/s2, 펌프의 효율은 60%이다.)","c":["1.44","1.47","14.7","144"],"a":3,"inc":false,"unit":"4-1"},{"id":"gwallisa-2019-05-11-31","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":31,"q":"배관 내 평균유속 5m/s로 물이 흐르고 있다가 갑작스런 밸브의 잠김으로 발생되는 압력상승(MPa)은 약 얼마인가? (단, 물의 비중량은 9,800N/m3, 유체 내 압축파의 전달속도는 1,494m/s, 중력가속도는 9.8m/s2이다.)","c":["7.32","7.47","73.2","74.7"],"a":2,"inc":false,"unit":"4-1"},{"id":"gwallisa-2019-05-11-33","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":33,"q":"층류 상태로 직경 5cm인 원형관 내 흐를 수 있는 물의 최대 유량(m3/s)은 약 얼마인가? (단, 물의 비중량은 9,800N/m, 물의 점성계수는 10×10-3Nㆍs/m2, 층류의 상한계 레이놀즈(Reynolds)수는 2,000, 중력가속도는 9.8m/s2, 원주율은 3.0이다.) (문제 오류로 실제 시험에서는 모두 정답처리 되었습니다. 여기서는 1번을 누르면 정답 처리 됩니다.)","c":["7.35×10-5","7.50×10-5","7.35×10-2","7.50×10-2"],"a":1,"inc":false,"unit":"4-1"},{"id":"gwallisa-2019-05-11-35","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":35,"q":"분말소화약제에 관한 설명으로 옳지 않은 것은?","c":["분말의 안식각이 작을수록 유동성이 커진다.","제1종 분말소화약제를 저장하는 경우 분말소화약제 1kg 당 저장용기의 내용적은 0.8L이다.","제2종 분말소화약제의 주성분은 탄산수소나트륨(NaHCO3)이다.","제3종 분말소화약제의 주성분은 제1인산암모늄(NH4H2PO4이다."],"a":3,"inc":false,"unit":"6-1"},{"id":"gwallisa-2019-05-11-36","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":36,"q":"이산화탄소소화설비의 화재안전기준상 소화에 필요한 이산화탄소의 설계농도(%)가 가장 높은 것은?","c":["프로판","에틸렌","산화에텔렌","에탄"],"a":3,"inc":false,"unit":"6-2"},{"id":"gwallisa-2019-05-11-38","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":38,"q":"단백포소화약제 3%형 18L를 이용하여 팽창비가 5가 되도록 포를 방출할 때 발생된 포의 체적(m3)은?","c":["0.08","0.3","3.0","6.0"],"a":3,"inc":false,"unit":"5-1"},{"id":"gwallisa-2019-05-11-39","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":39,"q":"물에 관한 설명으로 옳지 않은 것은?","c":["압력이 감소함에 따라 비등점은 낮아진다.","물의 기화열은 융해열보다 크다.","물의 표면장력을 낮추는 경우 침투성이 강화된다.","온도가 상승할수록 물의 점도는 증가한다."],"a":4,"inc":false,"unit":"4-5"},{"id":"gwallisa-2019-05-11-40","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":40,"q":"연소에 관한 설명으로 옳지 않은 것은?","c":["자기반응성 물질은 외부에서 공급되는 산소가 없는 경우 연소하지 않는다.","연소는 산화반응의 일종이다.","메탄이 완전연소를 하는 경우 이산화탄소가 발생한다.","일산화탄소는 연소가 가능한 가연성물질이다."],"a":1,"inc":false,"unit":"6-2"},{"id":"gwallisa-2019-05-11-51","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":51,"q":"소방기본법령상 소방대의 생활안전활동에 해당하지 않는 것은?","c":["붕괴, 낙하 등이 우려되는 고드름, 나무, 위험 구조물 등의 제거 활동","위해동물, 벌 등의 포획 및 퇴치 활동","단전사고 시 비상전원 또는 조명의 공급","집회ㆍ공연 등 각종 행사 시 사고에 대비한 근접대기 등 지원활동"],"a":4,"inc":false,"unit":"9-6"},{"id":"gwallisa-2019-05-11-58","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":58,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 소방시설에 대한 설명으로 옳은 것은?","c":["수용인원 50명인 문화 및 집회시설 중 영화상영관은 공기호흡기를 설치하여야 한다.","비상경보설비는 소방시설의 내진설계기준에 맞게 설치하여야 한다.","분말형태의 소화약제를 사용하는 소화기의 내용연수는 5년으로 한다.","불연성물품을 저장하는 창고는 옥외소화전 및 연결살수설비를 설치하지 아니할 수 있다."],"a":4,"inc":false,"unit":"3-10"},{"id":"gwallisa-2019-05-11-61","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":61,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 연소방지설비는 어떤 소방시설에 속하는가?","c":["소화설비","소화용수설비","소화활동설비","피난구조설비"],"a":3,"inc":false,"unit":"8-7"},{"id":"gwallisa-2019-05-11-66","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":66,"q":"위험물안전관리법령상 시ㆍ도지사의 허가를 받아야 설치할 수 있는 제조소등은?","c":["주택의 난방시설을 위한 취급소","축산용으로 필요한 건조시설을 위한 지정수량 20배 이하의 저장소","공동주택의 중앙난방시설을 위한 저장소","농예용으로 필요한 난방시설을 위한 지정수량 20배 이하의 저장소"],"a":3,"inc":false,"unit":"3-9"},{"id":"gwallisa-2019-05-11-70","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":70,"q":"위험물안전관리법령상 정기점검의 대상인 제조소등의 아닌 것은?","c":["판매취급소","이동탱크저장소","이송취급소","지하탱크저장소"],"a":1,"inc":false,"unit":"3-9"},{"id":"gwallisa-2019-05-11-76","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":76,"q":"아염소산나트륨(NaClO2)에 관한 설명으로 옳지 않은 것은?","c":["매우 불안정하여 180℃ 이상 가열하면 발열 분해하여 O2를 발생한다.","가연성물질로서 가열, 충격, 마찰에 의해 발화, 폭발한다.","암모니아. 아민류와 반응하여 폭발성의 물질을 생성한다.","수용액 상태에서도 산화력을 가지고 있다."],"a":2,"inc":false,"unit":"3-1"},{"id":"gwallisa-2019-05-11-79","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":79,"q":"철분(Fe)에 관한 설명으로 옳지 않은 것은?","c":["절삭유와 같은 기름이 묻은 철분을 장기 방치하면 자연발화하기 쉽다.","용융 유황과 접촉하면 폭발하며 무기과산화물과 혼합한 것은 소량의 물에 의해 발화한다.","금속의 온도가 충분히 높을 때 수증기와 반응하면 O2를 발생한다.","발연질산에 넣었다가 꺼내면 산화 피막을 형성하여 부동태가 된다."],"a":3,"inc":false,"unit":"3-2"},{"id":"gwallisa-2019-05-11-80","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":80,"q":"디에틸에테르(C2H5OC2H5)에 관한 설명으로 옳지 않은 것은?","c":["물과 접촉 시 격렬하게 반응한다.","비점, 인화점, 발화점이 매우 낮고 연소범위가 넓다.","연소범위의 하한치가 낮아 약간의 증기가 누출되어도 폭발을 일으킨다.","증기압이 높아 저장용기가 가열되면 변형이나 파손되기 쉽다."],"a":1,"inc":false,"unit":"1-1"},{"id":"gwallisa-2019-05-11-82","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":82,"q":"히드라진(H2H4)에 관한 설명으로 옳지 않은 것은?","c":["공기 중에서 가열하면 약 180℃에서 다량의 NH3, H2, N2를 발생한다.","산소가 존재하지 않아도 폭발할 수 있다.","강알칼리, 강환원제와는 반응하지 않는다.","CuO, CaO, HgO, BaO과 접촉할 때 불꽃이 발생하여 혼촉발화한다."],"a":3,"inc":false,"unit":"1-1"},{"id":"gwallisa-2019-05-11-84","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":84,"q":"니트로소화합물에 관한 설명으로 옳은 것은?","c":["분해가 용이하고 가열 또는 충격ㆍ마찰에 안정하다.","연소속도가 느리다.","니트로소기(-NO)가 결합된 유기화합물이다.","질식소화가 효과적이다."],"a":3,"inc":false,"unit":"1-10"},{"id":"gwallisa-2019-05-11-86","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":86,"q":"제4류 위험물 중 제1석유류가 아닌 것은?","c":["벤젠","아세톤","에틸렌글리콜","메틸에틸케톤"],"a":3,"inc":false,"unit":"1-23"},{"id":"gwallisa-2019-05-11-88","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":88,"q":"다음 물질 중 발화점이 가장 낮은 것은?","c":["아크롤레인","톨루엔","메틸에틸케톤","초산에틸"],"a":1,"inc":false,"unit":"1-1"},{"id":"gwallisa-2019-05-11-91","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":91,"q":"위험물안전관리법령상 제조소의 위치ㆍ구조 및 설비의 기준에서 배관의 설치에 관한 설명으로 옳은 것은?","c":["배관의 재질은 폴리에틸렌(PE)관 그 밖에 이와 유사한 금속성으로 하여야 한다.","배관에 걸리는 최대상용압력의 1.2배 이상의 압력으로 수압시험을 실시하여야 한다.","지상에 설치하는 배관은 지진ㆍ풍압ㆍ지반침하 및 온도변화에 안전한 구조의 지지물에 설치하여야 한다.","지하에 매설하는 배관은 지면에 미치는 중량이 당해 배관에 미치도록 하여 안전하게 하여야 한다."],"a":3,"inc":false,"unit":"1-23"},{"id":"gwallisa-2019-05-11-94","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":94,"q":"위험물안전관리법령상 옥외탱크저장소의 위치ㆍ구조 및 설비의 기준에서 인화성 액체위험물(이황화탄소를 제외한다) 옥외탱크저장소의 탱크 주위에 설치하는 방유제의 설치높이 기준으로 옳은 것은?","c":["0.1m 이상 1m 이하","0.3m 이상 2m 이하","0.5m 이상 3m 이하","0.7m 이상 4m 이하"],"a":3,"inc":false,"unit":"3-9"},{"id":"gwallisa-2019-05-11-95","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":95,"q":"위험물안전관리법령상 옥외저장소의 위치ㆍ구조 및 설비의 기준에서 옥외저장소에 위험물을 저장하는 경우 저장장소 주위에 배수구 및 집유설비를 설치하여야 하는 위험물이 아닌 것은?","c":["에틸알코올","디에틸에테르","톨루엔","초산에틸"],"a":2,"inc":false,"unit":"3-9"},{"id":"gwallisa-2019-05-11-96","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":96,"q":"위험물안전관리법령상 옥외탱크저장소의 위치ㆍ구조 및 설비의 기준에서 무연가솔린 5,000리터를 저장하는 위험물 옥외탱크저장소에는 접지시설을 하거나 피회침을 설치하여야 한다. 이 경우 위험물 옥외탱크저장소에 피회침을 설치하지 아니할 수 있는 접지시설의 저항 값으로 옳은 것은?","c":["5Ω 이하","10Ω 이하","15Ω 이하","20Ω 이하"],"a":1,"inc":false,"unit":"3-9"},{"id":"gwallisa-2019-05-11-98","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":98,"q":"위험물안전관리법령상 제조소의 위치ㆍ구조 및 설비의 기준에서 위험물을 취급하는 건축물의 지분(작업공정상 제조기계시설 등이 2층 이상에 연결되어 설치된 경우에는 최상층의 지붕을 말한다.)을 내화구조로 할 수 없는 것은?","c":["제1류 위험물","제2류 위험물(분상의 것과 인화성고체 제외)","제4류 위험물 중 제4석유류ㆍ동식물유류","제6류 위험물을 취급하는 건축물"],"a":1,"inc":false,"unit":"2-3"},{"id":"gwallisa-2019-05-11-99","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":99,"q":"위험물안전관리법령상 옥내저장소의 위치ㆍ구조 및 설비의 기준에서 제4류 위험물 중 아세톤을 보관하는 하나의 옥내저장창고(2 이상의 구획된 실이 있는 때에는 각 실의 바닥 면적의 합계로 한다.)의 최대 바닥 면적(m2)은?","c":["500","1,000","1,500","2,000"],"a":2,"inc":false,"unit":"3-9"},{"id":"gwallisa-2019-05-11-104","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":104,"q":"국가화재안전기준상 배관의 기울기에 관한 내용으로 옳지 않은 것은?","c":["습식스프링클러설비 또는 부압식 스프링클러설비 외의 설비에는 헤드를 향하여 상향으로 수평주행배관의 기울기를 500분의 1이상, 가지배관의 기울기를 250분의 1 이상으로 할 것. 다만, 배관의 구조상 기울기를 줄 수 없는 경우에는 배수를 원활하게 할 수 있도록 배수밸브를 설치하여야 한다.","간이스프링클러설비의 배관을 수평으로 할 것. 다만, 배관의 구조상 소화수가 남아 있는 곳에는 배수밸브를 설치하여야 한다.","연소방지설비에 있어서의 수평주행배관의 구경은 100mm 이상의 것으로 하되, 연소방지설비전용헤드 및 스프링클러헤드를 향하여 상향으로 1,000분의 1 이상의 기울기로 설치하여야 한다.","개방형 미분무소화설비에는 헤드를 향하여 하향으로 수평주행배관의 기울기를 1,000분의 1 이상, 가지배관의 기울기를 500분의 1 이상으로 할 것. 다만, 배관의 구조상 기울기를 줄 수 없는 경우에는 배수를 원활하게 할 수 있도록 배수밸브를 설치하여야 한다."],"a":4,"inc":false,"unit":"4-9"},{"id":"gwallisa-2019-05-11-105","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":105,"q":"소방용 가압송수장치 전동기가 3상3선식 380V로 작동하고 있다. 전동기의용량이 85kW, 역률 90%, 전기공급설비로부터 100m 떨어져 있으며 전선에서의 전압강하를 10V까지 허용할 경우 전선의 최소 굵기(mm2)는 약 얼마인가?","c":["41.1","42.1","43.2","44.2"],"a":4,"inc":false,"unit":"4-6"},{"id":"gwallisa-2019-05-11-106","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":106,"q":"P형 1급 수신기와 감지기화의 배선회로에서 회로 종단저항은 10kΩ이고, 감지기 회로저항은 30Ω, 릴레리저항은 20Ω, 회로전압 DC 24V일 때, 평상시 수신반에서의 감시전류[mA]는 약 얼마인가?","c":["2.39","3.39","4.25","5.25"],"a":1,"inc":false,"unit":"9-4"},{"id":"gwallisa-2019-05-11-108","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":108,"q":"지상 30층 아파트에 스프링클러설비가 설치되어 있고 세대별 헤드 수는 12개 일 때, 옥상수조 수원의 양을 포함하여 확보하여야 할 스프링클러설비 최소 수원의 양(m3)은 약 얼마 이상인가?","c":["32.0","38.4","42.7","51.2"],"a":3,"inc":false,"unit":"4-7"},{"id":"gwallisa-2019-05-11-109","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":109,"q":"국가화재안전기준상 음향장치 및 음향경보장치 기준으로 옳지 않은 것은?","c":["비상벨설비 또는 자동식사이렌의 음향장치의 음량은 부착된 음향장치의 중심으로부터 1m 떨어진 위치에서 90dB 이상이 되는 것으로 하여야 한다.","화재조기진압용 스프링클러설비의 음향장치의 음량은 부착된 음향장치의 중심으로부터 1m 떨어진 위치에서 90폰 이상이 되는 것으로 한다.","이산화탄소소화설비의 음향경보장치는 소화약제의 방사개시 후 30초 이상 경보를 계속 할 수 있는 것으로 한다.","할로겐화합물 및 불활성기체소화설비의 음향경보장치는 소화약제의 방사개시 후 1분 이상 경보를 계속할 수 있는 것으로 한다."],"a":3,"inc":false,"unit":"6-3"},{"id":"gwallisa-2019-05-11-114","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":114,"q":"할로겐화합물 및 불활성기체소화설비의 화재안전기준상 배관의 설치기준으로 옳지 않은 것은?","c":["할로겐화합물 및 불활성기체소화설비의 배관은 전용으로 하여야 한다.","강관을 사용하는 경우의 배관은 압력배관용탄소강관(KS D 3562) 또는 이와 동등 이상의 강도를 가진 것으로서 아연도금 등에 따라 방식처리된 것을 사용하여야 한다.","배관과 배관, 배관과 배관부속 및 밸브류의 접속은 나사접합, 용접접한, 압축접한 또는 플랜지접합 등의 방법을 사용하여야 한다.","배관의 구경은 해당 방호구역에 할로겐화합물약제는 10초 이내에, 불활성기체소화약제는 AㆍC급 화재 1분, B급 화재 2분 이내에 방호구역 각 부분에 최소설계농도의 95% 이상 해당하는 약제량이 방출되도록 하여야 한다."],"a":4,"inc":false,"unit":"6-3"},{"id":"gwallisa-2019-05-11-115","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":115,"q":"자동화재속보설비의 화재안전기준상 설치기준으로 옳은 것은?","c":["조작스위치는 바닥으로부터 1.5m 이하의 높이에 설치한다.","속보기는 소방관서에 통신망으로 통보하도록 하며, 데이터 또는 코드전송방식을 부가적으로 설치할 수 없다.","노유자시설에 설치하는 자동화재속보설비는 속보기에 감지기를 직접 연결하는 방식으로 한다.","자동화재탐지설비와 연동으로 작동하여 자동적으로 화재발생 상황을 소방관서에 전달되는 것으로 한다."],"a":4,"inc":false,"unit":"9-9"},{"id":"gwallisa-2019-05-11-116","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":116,"q":"자동화재탐지설비 및 시각경보장치의 화재안전기준상 지상 15층, 지하 3층으로 연면적이 3,000m2를 초과하는 특정소방대상물에 화재가 발생하여 자동화재탐지설비를 통해 지하 1층, 지하 2층, 지하 3층, 지상 1층에 경보가 발하여진 경우, 발화층은?","c":["지하 3층","지하 2층","지하 1층","지상 2층"],"a":3,"inc":false,"unit":"8-7"},{"id":"gwallisa-2019-05-11-117","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":117,"q":"할로겐화합물 및 불활성기체소화설비의 화재안전기준상 소화약제의 최대허용 설계농도(%) 기준으로 옳은 것은?","c":["HCFC-124:2.0","HFC-227ea:10.5","HFC-236fa:13.5","IG-100:53"],"a":2,"inc":false,"unit":"6-3"},{"id":"gwallisa-2019-05-11-118","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":118,"q":"분말소화설비를 방호구역에 전역방출방식으로 설치하고자 한다. 소화약제는 제4종 분말이고, 방호구역의 체적이 150m3, 개구부의 면적이 3m2이며, 자동폐쇄장치를 설치하지 아니한 경우 분말소화약제의 최소 저장량(kg)은?","c":["41.4","49.5","59.4","67.5"],"a":1,"inc":false,"unit":"6-1"},{"id":"gwallisa-2019-05-11-119","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":119,"q":"자동화재탐지설비 및 시각경보장치의 화재안전기준상 부착높이가 8m 이상 15m 미만일 경우 적응성 있는 감지기의 종류로 옳지 않은 것은?","c":["차동식 스포트형","차동식 분포형","연기복합형","불꽃감지기"],"a":1,"inc":false,"unit":"8-7"},{"id":"gwallisa-2019-05-11-120","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":120,"q":"화재조기진압용 스프링클러설비의 화재안전기준상 헤드에 관한 기준으로 옳지 않은 것은?","c":["헤드의 작동온도는 74℃ 이하로 한다.","하향식 헤드의 반사판의 위치는 천장이나 반자 아래 115mm 이상 355mm 이하로 한다.","헤드의 반사판은 천장 또는 반자와 평행하게 설치하고, 저장물의 최상부와 914mm 이상 확보되도록 한다.","헤드 하나의 방호면적은 6.0m2이상 9.3m2이하로 한다."],"a":2,"inc":false,"unit":"4-7"},{"id":"gwallisa-2019-05-11-121","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":121,"q":"물분무소화설비의 화재안전기준상 물분무소화설비를 투영된 바닥면적이 50m2인 케이블트레이에 설치하는 경우 필요한 최소 수원의 양(m3)은 얼마 이상인가?","c":["10","12","20","24"],"a":2,"inc":false,"unit":"4-10"},{"id":"gwallisa-2019-05-11-124","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2019-05-11","num":124,"q":"피난기구의 화재안전기준상 숙박시설의 각 층의 바닥면적이 2.500m2 일 경우 층마다 설치하여야 하는 피난기구의 최소 개수는?","c":["3개","4개","5개","6개"],"a":3,"inc":false,"unit":"7-3"},{"id":"gwallisa-2020-05-16-1","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":1,"q":"K급 화재(주방화재)에 관한 설명으로 옳지 않은 것은?","c":["비누화현상을 일으키는 중탄산나트륨 성분의 소화약제가 적응성이 있다.","인화점과 발화점의 차이가 작아 재발화의 우려가 큰 식용유화재를 말한다.","주방에서 동식물유를 취급하는 조리기구에서 일어나는 화재를 말한다.","K급 화재용 소화기의 소화능력시험은 소화기의 B급 화재 소화능력시험에 따른다."],"a":4,"inc":false,"unit":"1-17"},{"id":"gwallisa-2020-05-16-4","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":4,"q":"제3종 분말소화약제가 열분해 될 때 생성되는 물질이 아닌 것은?","c":["NH3","CO2","HPO3","H2O"],"a":2,"inc":false,"unit":"6-1"},{"id":"gwallisa-2020-05-16-5","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":5,"q":"고체가연물의 점화 (발화)시간은 물체의 두께와 밀접한 관계가 있는데, 열적으로 얇은 고체가연물(두께가 약 2mm 미만)의 경우 점화시간 계산 시 주요 영향요소가 아닌 것은?","c":["열전도도(W/m∙K)","정압비열(J/kg∙K)","순열유속(W/m2)","밀도(kg/m3)"],"a":1,"inc":false,"unit":"1-5"},{"id":"gwallisa-2020-05-16-6","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":6,"q":"분진폭발의 특징으로 옳지 않은 것은?","c":["열분해에 의해 유독성 가스사 발생될 수 있다.","폭발과 관련된 연소속도 및 폭발압력이 가스폭발에 비해 낮다.","1차 폭발로 인해 2차폭발이 야기될 수 있어 피해 범위가 크다.","가스 폭발에 비해 발생 에너지가 적고 상대적으로 저온이다."],"a":4,"inc":false,"unit":"1-22"},{"id":"gwallisa-2020-05-16-7","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":7,"q":"가연성 액체의 화재발생 위험에 관한 설명으로 옳은 것은?","c":["인화점, 발화점이 높을 수록 위험하다.","연소범위가 좁을 수록 위험하다.","증기압이 높고 연소속도가 빠를수록 위험하다.","증발열, 비열이 클수록 위험하다."],"a":3,"inc":false,"unit":"3-1"},{"id":"gwallisa-2020-05-16-10","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":10,"q":"내화구조 건축물의 내화성능 요구조건에 해당하지 않은 것은?","c":["차연성","차열성","차염성","하중지지력"],"a":1,"inc":false,"unit":"2-3"},{"id":"gwallisa-2020-05-16-11","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":11,"q":"피난계획의 일반적인 원칙으로 옳지 않은 것은?","c":["건물내 임의의 지점에서 피난 시 한 방향이 화제로 사용이 불가능하면 다른 방향으로 사용되도록 한다.","피난수단은 보행에 의한 피난을 기본으로 하고 인간본능을 고려하여 설계한다.","피난경로는 굴곡부가 많거나 갈림길이 생기지 않도록 간단하고 명료하게 설계한다.","피난경로의 안전구획을 1차로 계단, 2차는 복도로 설정한다."],"a":4,"inc":false,"unit":"7-1"},{"id":"gwallisa-2020-05-16-12","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":12,"q":"건축물의 피난∙방화구조 등의 기준에 관한 규칙에서 소방관 진입창의 기준으로 옳지 않은 것은?","c":["2층 이상 11층 이하인 층에 각각 1개소 이상 설치 할 것","창문의 한쪽 모서리에 타격지점을 지름 3센티미터 이상의 원형으로 표시 할것","강화 유리 또는 배강도유리로서 그 두께가 6밀리미터 이상인 것","창문의 가운데에 지름 20센티미터 이상의 역삼각형을 야간에도 알아볼 수 있도록 빛반사 등으로 붉은색으로 표시할 것"],"a":3,"inc":false,"unit":"2-3"},{"id":"gwallisa-2020-05-16-13","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":13,"q":"다중이용업소의 안전관리에 관한 특별법령상 다중이용업소에 설치∙유지하여야 하는피난설비에서 피난기구가 아닌 것은?","c":["피난사다리","피난유도선","구조대","완강기"],"a":2,"inc":false,"unit":"7-3"},{"id":"gwallisa-2020-05-16-14","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":14,"q":"구획실 화재에서 화재가혹도에 관한 설명으로 옳지 않은 것은?","c":["화재가혹도는 최고온도의 지속시간으로 화재가 건물에 피해를 입히는 능력의 정도를 나타낸다.","화재가혹도는 화재하중과 화재강도로 구성되며, 화재강도는 단위면적당 가연물의 양으로 계산한다.","화재가혹도를 낮추기 위해서는 가연물을 최소단위로 저장하고 불연성 밀폐용기에 보관한다.","화재가혹도에 견디는 내력을 화재저항이라고 하며 건축물의 내화구조, 방화구조 등을 의미한다."],"a":2,"inc":false,"unit":"1-12"},{"id":"gwallisa-2020-05-16-15","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":15,"q":"바닥면적이 300m2인 창고에 목재 1,000kg과 기타 가연물 1,000kg이 적재되어 있는 경우 화재하중(kg/m2)은 얼마인가? (단, 목재의 단위발열량은 4,500kcal/kg, 기타 가연물의 단위발열량은 5,000kJ/kg이며, 소수점 이하 셋째자리레에서 반올림한다.)","c":["2.11","4.22","7.04","14.08"],"a":2,"inc":false,"unit":"1-12"},{"id":"gwallisa-2020-05-16-17","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":17,"q":"건축물의 피난∙방화구조 등의 기준에 관한 규칙에서 정한 건축물의내부에 설치하는 피난계단의 구조의 기준으로 옳지 않은 것은?","c":["계단실은 창문ㆍ출입구 기타 개구부를 제외한 당해 건축물의 다른 부분과 내화구조의 벽으로 구획할 것","건축물의 내부와 접하는 계단실의 창문등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 1제곱미터 이하로 할 것","건축물의 내부에서 계단실로 통하는 출입구의 류효너비는 0.9미터 이상으로 할 것","계단실의 바깥쪽과 접하는 창문등은 당해 건축물의 다른 부분에 설치하는 창문등으로 부터 1미터 이하의 거리를 두고 설치할 것"],"a":4,"inc":false,"unit":"2-3"},{"id":"gwallisa-2020-05-16-19","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":19,"q":"아레니우스(Arrhenius)의 반응속도식에 관한 설명으로 옳은 것은?","c":["활설화에너지가 클수록 반응속도는 증가한다.","기체상수가 클수록 반응속도는 증가한다.","온도가 높을수록 반응속도는 감소한다.","가연물의 밀도가 높을수록 반응속도는 증가한다."],"a":2,"inc":false,"unit":"1-5"},{"id":"gwallisa-2020-05-16-20","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":20,"q":"구획실에서 화재의 지속시간에 관한 설명으로 옳지 않은 것은?","c":["화재실 단위면적당 가연물의 양에 비례한다.","화재실 바닥 면적에 비례한다.","화재실 개구부 면적에 비례한다.","화재실 개구부 높이의 제곱근에 반비례한다."],"a":3,"inc":false,"unit":"1-5"},{"id":"gwallisa-2020-05-16-24","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":24,"q":"고층건묵물의 화재 시 굴뚝효과(Stack effect)에 의한 샤프트와 외기의 압력차에 관한 설명으로 옳은 것은?","c":["외기 온도가 높을수록 감소한다.","샤프트 내부 온도가 높을수록 감소한다.","중성대(면) 위의 거리가(높이)가 클수록 감소한다.","샤프트 내부와 외기의 온도차가 클수록 감소한다."],"a":1,"inc":false,"unit":"1-15"},{"id":"gwallisa-2020-05-16-31","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":31,"q":"유적선에 관한 설명으로 옳은 것은?","c":["어느 한순간에 주어진 유체입자의 흐름방향을 나타낸 것이다.","흐름을 직각으로 끊는 횡단면적을 말한다.","유체입자의 실제 운동 경로를 말하며, 경우에 따라 유선과 일치할 수 있다.","단위사간에 그 단면을 통과하는 물의 용적이다."],"a":3,"inc":false,"unit":"4-1"},{"id":"gwallisa-2020-05-16-33","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":33,"q":"베르누이 방정식에 관한 설명으로 옳지 않은 것은?","c":["에너지 방정식이라고도 한다.","에너지 보존법칙을 유체의 흐름에 적용한 것이다.","동수경사선은 위치수도와 압력수두를 합한 선을 연결한 것이다.","적용조건은 이상유체, 정상류, 비압축성 흐름, 점성 흐름이다."],"a":4,"inc":false,"unit":"4-2"},{"id":"gwallisa-2020-05-16-34","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":34,"q":"펌프의 비속도(Ns)에 관한 설명으로 옳지 않은 것은?","c":["토출량과 양정이 동일한 경우 회전수가(N) 낮을수록 비속도가 커진다.","임펠러의 상사성과 펌프의 특성 및 펌프의 형식을 결정하는데 이용되는 값이다.","양흡입 펌프의 경우 토출량의 1/2로 계산한다.","회전수와 양정이 알정할 때 토출량이 클수록 비속도가 커진다."],"a":1,"inc":false,"unit":"4-4"},{"id":"gwallisa-2020-05-16-35","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":35,"q":"포소화약제 포원액의 비중기준으로 옳은 것은?","c":["단백포소화약제: 0.90 이상 2.00 이하","합성계면활성제 포소화약제: 1.10 이상 1.20 이하","수성막포소화약제: 1.00 이상 1.15 이하","알콜형포소화약제: 0.60 이상 1.20 이하"],"a":3,"inc":false,"unit":"5-1"},{"id":"gwallisa-2020-05-16-36","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":36,"q":"소화약제에 관한 설명으로 옳지 않은 것은?","c":["제1종 분말소화약제에 탄산마그네슘 등의 분산제를 첨가해서 유동성을 향상시킨다.","포소화약제 중 수성막포의 팽창비는 6배 이상, 기타 포소화약제의 팽창비는 5배 이상이다.","물 소화제에 증점제를 첨가하여 가연물에 대한 물의 잔류시간을 길게 한다.","물의 증발잠열은 약 539kcal/kg이다."],"a":2,"inc":false,"unit":"5-1"},{"id":"gwallisa-2020-05-16-37","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":37,"q":"할로겐화합물 소화약제의 최대허용설계농도가 큰 순서대로 나열한 것은?","c":["HCFC-124 ＞ HFC-125 ＞ IG-100 ＞ HFC-23","HFC-23 ＞ HCFC-124 ＞ HFC-125 ＞ IG-100","IG-100 ＞ HFC-23 ＞ HFC-125 ＞ HCFC-124","IG-100 ＞ HFC-125 ＞ HCFC-124 ＞ HFC-23"],"a":3,"inc":false,"unit":"6-3"},{"id":"gwallisa-2020-05-16-38","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":38,"q":"표준상태에서 한계산소농도가 가장 큰 가연성 물질은?","c":["메탄","수소","에틸렌","일산화탄소"],"a":1,"inc":false,"unit":"3-1"},{"id":"gwallisa-2020-05-16-39","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":39,"q":"온도변화 없이 밀폐된 공간에 산소 22vol%, 질소 79vol%인 공기 353ft3이 가득 차 있다. 이 공간에 순수한 이산화탄소가 417ℓ가 방출될 때, 이산화탄소 농도(vol%)는? (단, 1ft=0.3048m이다.)","c":["2","3","4","6"],"a":3,"inc":false,"unit":"6-2"},{"id":"gwallisa-2020-05-16-40","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":40,"q":"분말소화약제에 관한 설명으로 옳지 않은 것은?","c":["제3종 분말소화약제는 제1종과 제2종에 비해 낮은 온도에서 열분해 한다.","제2종 분말소화약제의 구성성분이 제1종보다 반응성이 커서 소화능력이 우수하다.","분말소화약제는 작열연소보다 불꽃연소에 소화효과가 우수하다.","제1종 분말소화약제가 590℃이상에서 분해될 때 Na2O가 생성된다."],"a":4,"inc":false,"unit":"6-1"},{"id":"gwallisa-2020-05-16-41","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":41,"q":"할로겐화합물 및 불활성기체소화설비의 화재안전기준상 할로겐화합물 소화약제 저장용기의 설치 기준으로 옳은 것은?","c":["저장용기를 방호그역 내에 설치한 경우에는 방화문으로 구획된 실에 설치할 것","용기간의 간격은 점검에 지장이 없도록 3㎝이상의 간격을 유지할 것","온도가 65℃ 이하이고 ㄷ온도 변화가 작은 곳에 설치한 것","하나의 방호구역을 담당하는 경우에는 저장용기와 집합관을 연결하는 연결배관에는 체크밸브를 설치할 것"],"a":2,"inc":false,"unit":"6-3"},{"id":"gwallisa-2020-05-16-42","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":42,"q":"할로겐화합물 및 불활성기체소화설비의 화재안전기준상 저장용기의 최대충전밀도가 가장 큰 것은?","c":["FK-5-1-12","FC-3-1-10","HCFC BLEND A","HCFC-124"],"a":1,"inc":false,"unit":"6-3"},{"id":"gwallisa-2020-05-16-51","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":51,"q":"소방기본법령상 소방본부 화재조사전담부서에 갖추어야 할 장비 및 시설 중 감식∙감정용 기기에 속하지 않은 것은?","c":["클램프미터","검전기","슈미트해머","거리측정기"],"a":4,"inc":false,"unit":"1-17"},{"id":"gwallisa-2020-05-16-62","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":62,"q":"화재예방, 소방시설 설치∙유지 및 안전관리에 관한 법령상 특정소방대상물의 관계인이 특정소방대상물의 규모∙용도 및 수용인원 등을 고려하여 갖추어야 하는 소방시설에 관한 설명으로 옳은 것은?","c":["아파트등 및 16층 이상 로피스텔의 모든 층에는 주거용 주방자동소화장치를 설치하여야 한다.","창고시설(물류터미널은 제외한다)로서 바닥면적 합계가 5천제곱미터 이상인 경우에는 모든 층에 스프링클러설비를 설치하여야 한다.","기계장치에 의한 주차시설을 이용하여 15대 이상의 차량을 주차할 수 있는 것은 물분무등소화설비를 설치하여야 한다.","숙박시설로서 연면적 500제곱미터 이상인 것은 자동화재탐지설비를 설치하여야 한다."],"a":2,"inc":false,"unit":"4-7"},{"id":"gwallisa-2020-05-16-65","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":65,"q":"화재예방, 소방시설 설치∙유지 및 안전관리에 관한 법령상 소방안전관리자를 선임하여야 하는 2급 소방안전관리대상물이 아닌 것은? (단, 「공공기관의 소방안전관리에 관한 규정」을 적용받는 특정소방대상물은 제외함)","c":["가연성 가스를 1첨톤 이상 저장 ∙취급하는 시설","지하구","국보로 지정된 목조건축물","가스 제조설비를 갖추고 도시가스사업의 허가를 받아야 하는 시설"],"a":1,"inc":false,"unit":"3-1"},{"id":"gwallisa-2020-05-16-69","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":69,"q":"위험물안전관리법령상 1인의 안전관리자를 중복하여 선임할 수 있는 저장소에 해당하지 않는 것은? (단, 저장소는 동일구내에 있고 동일인이 설치함)","c":["30개 이하의 옥내저장소","30개 이하의 옥외탱크저장소","10개 이하의 옥외저장소","10개 이하의 암반탱크저장소"],"a":1,"inc":false,"unit":"3-9"},{"id":"gwallisa-2020-05-16-70","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":70,"q":"위험물안전관리법령상 시∙도지사가 한국소방산업기술원에 위탁하는 업무에 해당 하지 않은 것은?","c":["암반탱크안전성능검사","암반탱크저장소의 변경에 따른 완공검사","암반탱크저장소의 설치에 따른 완공검사","용량이 50만리터 이상인 액체위험물을 저장하는 탱크안전성능검사"],"a":4,"inc":false,"unit":"3-9"},{"id":"gwallisa-2020-05-16-76","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":76,"q":"과염소산암모늄과 알루미늄 분말이 반응하여 폭발사고가 발생하였다. 이에 관한 설명으로 옳은 것은?","c":["알루미늄은 급격히 환원되어 고온에서 염화알루미늄이 생성된다.","과염소산암모늄은 전자를 주는 물질을 발생하여 알루미늄 분말을 환원시키는 반응이다.","산화성 물질과 환원성 물질의 반응으로 많은 가스 발생을 수반하는 폭발 반응이다.","가연성 산화제와 알루미늄의 급격한 산화∙환원 반응으로 압력이 발화원으로 작용한 것이다."],"a":3,"inc":false,"unit":"3-1"},{"id":"gwallisa-2020-05-16-82","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":82,"q":"위험물안전관리법령상 옥외탱크저장소에서 보유공지를 단축할 수 있는 물분무설비 기준으로 옳은 것은?","c":["탱크에 보강링이 설치된 경우에는 보강링이 인접한 바로 위에 분무헤드를 설치한다.","탱크표면에 방사하는 물의 양은 탱크의 원주길이 1m에 대하여 분당 37L 이상으로 한다.","수원의 양은 15분 이상 방사할 수 있는 수량으로 한다.","화재 시 1m2당 10kW 이상의 복사열에 노출되는 포면을 갖는 인접한 옥외저장탱크에 설치한다."],"a":2,"inc":false,"unit":"3-9"},{"id":"gwallisa-2020-05-16-86","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":86,"q":"스티렌(C6H5CH=CH2)에 관한 설명으로 옳지 않은 것은?","c":["무색∙투명한 액체로서 마취성이 있으며 독성이 매우 강하다.","실온에서 인화의 위험이 있으며, 연소 시 폭발성 유기과산화물을 생성한다.","산화제와 중합잔응하여 생성된 폴리스티렌수지는 분해폭발성 물질이다.","강산성 물질과의 혼촉 시 발열∙발화한다."],"a":3,"inc":false,"unit":"3-2"},{"id":"gwallisa-2020-05-16-91","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":91,"q":"위험물안전관리법령상 옥외저장소에 저장 할 수 있는 것은? (단, 「국제해상위험물 규칙」등 예외규정은 적용하지 않는다.)","c":["염소산나트륨","과염소산","질산메틸","황린"],"a":2,"inc":false,"unit":"3-9"},{"id":"gwallisa-2020-05-16-92","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":92,"q":"위험물안전관리법령상 염소산칼륨을 1일 1,000kg 생상하고 있는 제조소의 소화기 비치량을 산정하기 위한 총 소요단위는? (단, 제조소의 연면적은 300m2이고, 제조소의 외벽은 내화구조이다.)","c":["5","6","7","8"],"a":1,"inc":false,"unit":"2-3"},{"id":"gwallisa-2020-05-16-93","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":93,"q":"위험물안전관리법령상 일반취급소 하나의 층에 옥내소화전 3개가 설치되어 있다. 확보해야 할 수원의 최소 양(m3)은?","c":["7.8","11.7","15.6","23.4"],"a":4,"inc":false,"unit":"4-6"},{"id":"gwallisa-2020-05-16-94","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":94,"q":"위험물안전관리법령상 제조소의 옥외 위험물 취급탱크가 메틸알코올 1m3와 아세톤 0.5m3가 있다. 이를 하나의 방유제 내에 설치하고자 할 때 방유제 기준에 관한 점토사항으로 옳은 것은?","c":["방유제 용량은 0.55m3 이상이 되도록 설치하여야 한다.","방유제 용량은 1.1m3 이상이 되도록 설치하여야 한다.","취급하는 위험물의 성상이 액체이므로 방유제를 설치하지 않아도 된다.","위험물 저장탱크의 용량이 지정수량 기준에 미달하여 방유제를 설치하지 않아도 된다."],"a":1,"inc":false,"unit":"3-10"},{"id":"gwallisa-2020-05-16-95","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":95,"q":"위험물안전관리법령상 주유취급소 내 건축물 등의 구조 기준으로 옳지 않은 것은? (단, 단서조항은 적용하지 않는다.)","c":["건축물의 벽∙기둥∙바닥∙보 및 지붕을 내화구조 또는 불연재료로 할 수 있다.","주거시설 용도로 사용하는 부분은 개구부가 없는 내화구조의 바닥 또는 벽으로 당해 건축물의 다른 부분과 구획하고 주유를 위한 작업장 등 위험물취급장소에 면한 쪽의 벽에는 출입구를 설치할 수 없다.","사무실 등의 창 및 출입구에 유리를 사용하는 경우에는 망입유리 또는 강화유리로 하여야 한다.","자동차 등의 점검∙정비를 행하는 설비는 고정주유설비로부터 2m 이상, 도로경계선으로부터 1 m 이상 떨어진 장소에 설치하여야 한다."],"a":4,"inc":false,"unit":"2-3"},{"id":"gwallisa-2020-05-16-97","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":97,"q":"위험물안전관리법령상 유별을 달리하는 위험물 상호간 1m 이상의 간격을 두더라도 동일한 옥내저장소에 저장할 수 없는 것은?","c":["제1류 위험물과 제6류 위험물","제2류 위험물 중 인화성고체와 제4류 위험물","제4류 위험물과 제5류 위험물(유기과산화물은 제외)","제1류 위험물(알칼리금속의 과산화물은 제외)과 제5류 위험물"],"a":3,"inc":false,"unit":"3-9"},{"id":"gwallisa-2020-05-16-98","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":98,"q":"위험물안전관리법령상 제조소 바닥면적이 110m2인 경우 환기설비 중 급기구의 면적 기준으로 옳은 것은?","c":["300cm2 이상","450cm2 이상","600cm2 이상","800cm2 이상"],"a":2,"inc":false,"unit":"7-8"},{"id":"gwallisa-2020-05-16-103","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":103,"q":"유도등 및 유도표지의 화재안전기준상 피난유도선 설치기준으로 옳은 것은?","c":["축광방식의 피난유도선은 바닥으로부터 높이 50㎝ 이하의 위치 또는 바닥 면에 설치할 것","축광방식의 피난유도 표시부는 60㎝ 이내의 간격으로 연속되도록 설치할 것","광원점등방식의 피난유도 표시부는 바닥으로부터 높이 1.5m 이하의 위치 또는 바닥면에 설치할 것","광원점등방식의 피난유도 표시부는 60㎝ 이내의 간격으로 연속되도록 설치하되 실내장식물 등으로 설치가 곤란할 경우 1.5m이내로 설치할 것"],"a":1,"inc":false,"unit":"7-4"},{"id":"gwallisa-2020-05-16-104","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":104,"q":"자동화재탐지설비 및 시각경보장치의 화재안전기준상 발신기 설치기준으로 옳지 않은 것은?","c":["지하구의 경우에는 발신기를 설치하지 아니할 수 있다.","조작이 쉬운 장소에 설치하고, 스위치는 바닥으로부터 0.8m 이상 1.5m 이하의 높이에 설치할 것","특정소방대상물의 층마다 설치하되, 해당 특정소방대상물의 각 부분으로부터 하나의 발신기까지 수평거리사 25m 이하가 되도록 할 것. 다만, 복도 또는 별도로 구획된 실로서 보행거리가 40m 이상일 경우에는 추가로 설치하여야 한다.","발신기의 위치를 표시하는 표시등은 함의 상부에 설치하되, 그 불빛은 부착면으로부터 10° 이상의 범위 안에서 부착지점으로부터 10m 이내의 어느곳에서도 쉽게 식별할 수 있는 적색등으로 하여야 한다."],"a":4,"inc":false,"unit":"8-7"},{"id":"gwallisa-2020-05-16-106","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":106,"q":"단상 2선식 220V로 수전하는 곳에 부하전력이 65kW, 역률이 85%, 구내배선의 길이가 100m 일 때 전압강하를 5V까지 허용하는 경우 배선의 최소 굵기 (mm2)는 약 얼마인가?","c":["121.46","142.89","210.36","247.49"],"a":4,"inc":false,"unit":"9-2"},{"id":"gwallisa-2020-05-16-107","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":107,"q":"서방펌프에 전기를 공급하는 전동기설비가 있을 때 모터의 전부하전류(A)는 약 얼마인가? (단, 전압은 단상 220V, 모터용량은 20kW, 역률은 90%, 효율은 70%이다.)","c":["58","83","101","144"],"a":4,"inc":false,"unit":"9-9"},{"id":"gwallisa-2020-05-16-109","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":109,"q":"간이스프링클러설비의 화재안전기준상 급수배관의 설치기준으로 옳지 않은 것은?","c":["상수도직경형의 경우에는 수도배관 호칭지름 25mm 이상의 배관이어야 한다.","배관과 연결되는 이음쇠 등의 부속품은 물이 고이는 현상을 방지하는 조치를 하여야 한다.","급수를 차단할 수 있는 개폐밸브는 개폐표시형으로 하여야 한다.","수리계산에 의하는 경우 가지배관의 유석은 6m/s, 그 밖의 배관의 유속은 10m/s를 초과할 수 없다."],"a":1,"inc":false,"unit":"4-7"},{"id":"gwallisa-2020-05-16-110","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":110,"q":"도로터널의 화재안전기준상 옥내소화전설비의 설치기준으로 옳은 것은?","c":["소화전함과 방수구는 편도 2차선 이상의 양방향 터널이나 4차로 이상의 일방향 터널의 경우에는 양쪽 측벽에 각각 60m 이내의 간격으로 엇갈리게 설치할 것","소화전함에는 옥내소화전 방수구 1개, 15m 이상의 소방호스 2본 이상 및 방수노즐을 비치 할 것","가압송수장치는 옥내소화전 2개(4차로 이상의 터널인 경우 3개)를 동시에 사용할 경우 각 옥내소화전의 노즐선단에서의 방수압력은 0.35MPa 이상이고 방수량은 190ℓ/min이상이 되는 성능의 것으로 할 것","방수구는 40mm 구경의 단구형을 옥내소화전이 설치된 도로의 바닥면으로 부터 1.5m이하의 높이에 설치할 것"],"a":3,"inc":false,"unit":"4-6"},{"id":"gwallisa-2020-05-16-113","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":113,"q":"지상 40층짜리 아파트에 스프링클러설비가 설치되어 있고 세대별 헤드수가 8개일 때 확보해야할 최소 수원의 양(m3)은? (단, 옥상수조 수원의 양은 고려하지 않는다.)","c":["12.8","16.0","25.6","32.0"],"a":3,"inc":false,"unit":"4-7"},{"id":"gwallisa-2020-05-16-114","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":114,"q":"옥외 소화전설비의 화재안전기준상 소화전함 설치기준으로 옳지 않은 것은?","c":["옥외소화전이 10개 이하 설치된 때에는 옥외소화전마다 5m 이내의 장소에 1개 이상의 소화전함을 설치하여야 한다.","옥외소화전이 11개 이상 30개 설치된 때에는 11개 이상의 소화전함을 각각 분산하여 설치하여야 한다.","옥외소화전이 31개 이상 설치된 때에는 옥외소화전 2개마다 1개 이상의 소화전함을 설치하여야 한다.","가압송수장치의 조작부 또는 그 부근에는 가압송수장치의 기동을 명시하는 적색등을 설치하여야 한다."],"a":3,"inc":false,"unit":"4-6"},{"id":"gwallisa-2020-05-16-115","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":115,"q":"물분무소화설비의 화재안전기준상 수원의 저수량 기준으로 옳은 것은?","c":["콘베이어 벨트 등은 벨트부분의 바닥면적 1m2에 대하여 8ℓ/min로 20분간 방수할 수 있는 양 이상으로 할 것","차고 또는 주차장은 그 바닥면적 1m2에 애하여 10ℓ/min로 20분간 방수 할 수 있는 양 이상으로 할 것","절연유 봉입 변압기는 바닥부분을 제외한 표면적을 합한 면적 1m2에 대하여 8ℓ/min로 20분간 방수 할 수 있는 양 이상으로 할 것","케이블트레이, 케이블덕트 등은 투영된 바닥면적 1m2에 대하여 12ℓ/min로 20분간 방수 할 수 있는 양 이상으로 할 것"],"a":4,"inc":false,"unit":"4-10"},{"id":"gwallisa-2020-05-16-117","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":117,"q":"할로겐화합물 및 불활성기체소화설비의 화재안전기준상 용어의 정의로 옳지 않은 것은?","c":["“할로겐화합물 및 불활성기체소화약제”란 할로겐화합물(할론 1301, 할론 2402, 할론 1211 제외) 및 불활성기체로서 전기적으로 전도성이며 휘발성이 있거나 증발 후 잔여 물을 남기지 않는 소화약제를 말한다.","“할로겐화합물 및 불활성기체소화약제”란 불소, 염소, 브롬 또는 요오드 중 하나 이상의 원소를 포함하고 있는 유기화합물을 기본성분으로 하는 소화약재를 말한다.","“불활성기체소화약제”란 혜륨, 네온, 아르곤 또는 질소가스 중 하나 이상의 원소를 기본 성분으로 하는 소화약제를 말한다","“충전밀도”란 용기의 단위용적당 소화약제의 중량의 비율을 말한다."],"a":1,"inc":false,"unit":"6-3"},{"id":"gwallisa-2020-05-16-118","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":118,"q":"이산화탄소 소화설비 화재안전기준상 호스릴이산화탄소 소화설비 설치 기준으로 옳지 않은 것은?","c":["방호대상물의 각 부분으로부터 하나의 호스접결구까지의 수평거리가 15m 이하가 되도록 할 것","노즐은 20℃에서 하나의 노즐마다 50kg/min 이상의 소화약제를 방사할 수 있는 것으로 할 것","소화약제 저장용기는 호스릴을 설치하는 장소마다 설치 할 것","화재시 현저하게 연기가 찰 우려가 없는 장소로서 지상 1층 및 피난층에 있는 부분으로서 지상에서 수동 또는 원격조작에 따라 개방할 수 있는 개구부의 유효면적의 합계가 바닥면적의 15% 이상이 되는 부분에 설치 할 수 있다."],"a":2,"inc":false,"unit":"6-2"},{"id":"gwallisa-2020-05-16-120","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":120,"q":"연결송수관설비의 화재안전기준상 송수구가 부설된 옥내소화전을 설치한 특정소방대상물 중 방수구를 설치하니 않아도 되는 층은?","c":["지하층의 층수가 2 이하인 숙박시설의 지하층","지하층의 층수가 2 이하인 창고시설의 지하층","지하층의 층수가 2 이하인 관람장의 지하층","지하층의 층수가 2 이하인 공장의 지하층"],"a":1,"inc":false,"unit":"4-6"},{"id":"gwallisa-2020-05-16-121","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":121,"q":"소방시설의 내진설계 기준상 수평배관 흔들림 방지 버팀대 설치기준으로 옳은 것은?(2022년 개정된 규정 적용됨)","c":["황방향 흔들림 방지 버팀대의 설계하중은 설치된 위치의 좌우 6m를 포함한 15m내의 배관에 작용하는 횡방향수평지진하중으로 산정한다.","황방향 흔들림 방지 버팀대는 대관구경에 관계없이 모든 주배관, 교차배관에 설치하여야 한다.","마지막 버팀대와배관 단부 사이의 거리는 1.8m를 초과하지 않아야 한다.","버팀대의 간격은 중심선 기준으로 최대간격이 12m를 초과하지 않아야 한다."],"a":2,"inc":false,"unit":"13-1"},{"id":"gwallisa-2020-05-16-122","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2020-05-16","num":122,"q":"특별피난계단의 계단실 및 부속실 제연설비의 화재안전기준상 수직풍도에 따른 배출기준으로 옳지 않은 것은?","c":["배출댐퍼는 두께 1.5mm 이상의 강판 또는 이와 동등 이상의 성능이 있는 것으로 설치하여야 하며 비 내식성 재료의 경우에는 부식방지 조치를 할 것","수직풍도의 내부면은 두께 0.5mm 이상의 아연도금가유ㅏ나 또는 동등이상의 내식성∙내열성이 있는 것으로 마감되는 접합부에 대하여는 통기성이 없도록 조치할 것","화재층의 옥내의 설치된 화재감지기의 동작에 따라 전층의 댐퍼가 개방될 것","열기류에 노출되는 송풍기 및 그 부품들은 250℃의 온도에서 1시간 이상 가동상태를 유지할 것"],"a":3,"inc":false,"unit":"7-8"},{"id":"gwallisa-2021-05-08-1","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":1,"q":"최소발화에너지(MITE)에 영향을 주는 요소에 관한 내용으로 옳지 않은 것은?","c":["MITE는 온도가 상승하면 작아진다.","MITE는 압력이 상승하면 작아진다.","MITE는 화학양론적 조성 부근에서 가장 크다.","MITE는 연소속도가 빠를수록 작아진다."],"a":3,"inc":false,"unit":"1-2"},{"id":"gwallisa-2021-05-08-3","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":3,"q":"분말소화약제의 종별에 따른 주성분 및 화재적응성을 나열한 것으로 옳지 않은 것은?","c":["제1종 - 중탄산나트륨 - B, C급","제2종 - 중탄산칼륨 - B, C급","제3종 - 제1인산암모늄 - A, B, C급","제4종 - 인산 + 요소 - A, B, C급"],"a":4,"inc":false,"unit":"6-1"},{"id":"gwallisa-2021-05-08-4","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":4,"q":"화재의 소화방법과 소화효과의 연결로 옳지 않은 것은?","c":["물리적소화 - 질식소화 - 산소차단","화학적소화 - 질식소화 - 점화에너지 차단","물리적소화 - 제거소화 - 가연물 차단","화학적소화 - 억제소화 - 연쇄반응 차단"],"a":2,"inc":false,"unit":"1-5"},{"id":"gwallisa-2021-05-08-5","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":5,"q":"폭발의 종류와 형식 중 응상폭발이 아닌 것은?","c":["가스폭발","전선폭발","수증기 폭발","액화가스의 증기폭발"],"a":1,"inc":false,"unit":"1-20"},{"id":"gwallisa-2021-05-08-6","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":6,"q":"소화기구 및 자동소화장치의 화재안전기준상 주방에서 동·식물유를 취급하는 조리기구에서 일어나는 화재를 나타내는 등급으로 옳은 것은?","c":["A급 화재","B급 화재","C급 화재","K급 화재"],"a":4,"inc":false,"unit":"4-5"},{"id":"gwallisa-2021-05-08-9","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":9,"q":"연소 매커니즘에서 확산연소와 예혼합연소에 관한 설명으로 옳지 않은 것은?","c":["확산연소는 열방출속도가 높고, 예혼합연소는 열방출속도가 낮다.","예혼합연소에서 화염면의 압력이 전파되면 충격파를 형성한다.","예혼합연소에서는 분젠버너 연소, 가정용 가스기기연소, 가스폭발 등이 있다.","확산연소에는 성냥연소, 양초연소, 액면연소 등이 있다."],"a":1,"inc":false,"unit":"1-6"},{"id":"gwallisa-2021-05-08-10","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":10,"q":"건축물의 피난·방화구조 등의 기준에 관한 규칙상 건축물에 설치하는 특별피난 계단 구조에 관한 기준으로 옳지 않은 것은?","c":["부속실에는 예비전원에 의한 조명설비를 할 것","계단은 내화구조로 하고 피난층 또는 지상까지 직접 연결되도록 할 것","계단실 실내에 접하는 부분의 마감은 불연재료로 할 것","계단실은 창문등을 제외하고 내화구조의 벽으로 구획할 것"],"a":1,"inc":false,"unit":"2-3"},{"id":"gwallisa-2021-05-08-11","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":11,"q":"건축법령상 아파트 48층의 거실 각 부분에서 가장 가까운 직통계단까지 최소 설치기준으로 옳은 것은? (단, 주요구조부가 내화구조이며, 아파트 전체 층수는 50층이다.)","c":["직통거리 30m 이하","보행거리 40m 이하","직통거리 50m 이하","보행거리 30m 이하"],"a":2,"inc":false,"unit":"7-2"},{"id":"gwallisa-2021-05-08-12","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":12,"q":"건축물의 피난·방화구조 등의 기준에 관한 규칙상 건축물의 주요구조부 중 계단의 내화구조 기준으로 옳지 않은 것은?","c":["철근콘크리트조","철재로 보강된 망입유리","콘크리트블록조","철재로 보강된 벽돌조"],"a":2,"inc":false,"unit":"2-3"},{"id":"gwallisa-2021-05-08-15","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":15,"q":"건축물 종합방재계획 중 평면계획 수립 시 유의사항으로 옳지 않은 것은?","c":["화재를 작은 범위로 한정하기 위한 유효한 피난구획으로 조닝(Zoning)화 할 필요가 있다.","계단은 보행거리를 기준으로 균등 배치하고, 계단으로 통하는 복도 등 피난로는 단순하게 설계하여야 한다.","소방활동상 필요한 층과 층을 연결하는 수직 피난로는 피난이 용이한 개방구조로 상호연결 되도록 하여야 한다.","지하가와 호텔, 차고 및 극장과 백화점 등은 용도별 구획 및 별도 경로의 피난로를 설치한다."],"a":3,"inc":false,"unit":"7-1"},{"id":"gwallisa-2021-05-08-19","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":19,"q":"유효연소열이 50kJ/g, 질량연소유속(mass burning flux)이 100g/m2·s인 액체 연료가 누출되어 직경 2m의 풀 전면에 화재가 발생한 경우 열방출속도(HRR)는? (단, π=3.14로 한다.)","c":["10,000kW","11,500kW","13,020kW","15,700kW"],"a":4,"inc":false,"unit":"1-11"},{"id":"gwallisa-2021-05-08-21","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":21,"q":"건축물 구획실 화재 시 화재실의 중성대에 관한 설명으로 옳지 않은 것은?","c":["중성대는 화재실 내부의 실온이 높아질수록 낮아지고, 실온이 낮아질수록 높아진다.","화재실의 중성대 상부 압력은 실외압력보다 높고 하부의 압력은 실외압력보다 낮다.","화재실 상부에 큰 개구부가 있다면 중성대는 올라간다.","중성대의 위치는 건축물의 높이와 건축물 내·외부의 온도차가 결정의 주요요인이다."],"a":4,"inc":false,"unit":"1-15"},{"id":"gwallisa-2021-05-08-29","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":29,"q":"지름 2mm인 유리관에 0.25cm3/s의 물이 흐를 때, 마찰손실계수는 약 얼마인가? (단, π는 3.14이고, 동점성계수는 1.12x10-2cm2/s이다.)","c":["0.02","0.13","0.45","0.66"],"a":3,"inc":false,"unit":"4-3"},{"id":"gwallisa-2021-05-08-32","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":32,"q":"베르누이 방정식을 물이 흐르는 관로에 적용할 때 제한조건으로 옳지 않은 것은?","c":["비정상류 흐름","비압축성 유체","비점성 유체","유선을 따르는 흐름"],"a":1,"inc":false,"unit":"4-2"},{"id":"gwallisa-2021-05-08-33","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":33,"q":"주요 물리량과 그 차원이 옳게 짝지어진 것은?","c":["표면장력: [FL-2]","점성계수: [L2T-1]","단위중량: [FL-4T2]","에너지: [FL]"],"a":4,"inc":false,"unit":"4-5"},{"id":"gwallisa-2021-05-08-34","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":34,"q":"원형 유리관 내에 모세관 현상으로 물이 상승할 때, 그 상승 높이에 관한 설명으로 옳은 것은?","c":["유리관의 지름에 반비례한다.","물의 밀도에 비례한다.","중력가속도에 비례한다.","물의 표면장력에 반비례한다."],"a":1,"inc":false,"unit":"4-5"},{"id":"gwallisa-2021-05-08-35","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":35,"q":"금속화재에 관한 설명으로 옳지 않은 것은?","c":["가연성금속에 의한 화재이다.","금속이 괴상이 아닌 고운 분말이나 가는 선의 형태로 존재하면 화재의 위험서은 더 커진다.","금속화재를 일으키는 Na, K 등은 물과 만나면 수소가스를 발생시키는 금수성 물질이다.","소화 시 강화액 소화약제를 사용한다."],"a":4,"inc":false,"unit":"1-17"},{"id":"gwallisa-2021-05-08-36","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":36,"q":"고발포 포소화약제의 발포배율과 환원시간에 관한 설명으로 옳지 않은 것은?","c":["발포배율이 커지면 환원시간은 짧아진다.","환원시간이 짧을수록 양호한 포소화약제이다.","포의 막이 두꺼울수록 환원시간은 길어진다.","발포배율이 작은 포는 포의 직경이 작아서 포의 막은 두껍다."],"a":2,"inc":false,"unit":"5-1"},{"id":"gwallisa-2021-05-08-37","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":37,"q":"이산화탄소소화설비의 화재안전기준상 배관 등에 관한 내용으로 옳은 것은?","c":["전역방출방식에 있어서 가연성액체 또는 가연성가스등 표면화제 방호대상물의 경우에는 1분 내에 방사될 수 있는 것으로 하여야 한다.","전역방출방식에 있어서 종이, 목재, 석탄, 섬유류, 합성수지류 등 심부화재 방호대상물의 경우에는 10분 내에 방사될 수 있는 것으로 하여야 한다.","국소방출 방식의 경우에는 1분 내에 방사될 수 있는 것으로 하여야 한다.","전역방출방식에 있어서 심부화재 방호대상물의 경우에는 설계농도가 3분 이내에 40%에 도달하여야 한다."],"a":1,"inc":false,"unit":"6-2"},{"id":"gwallisa-2021-05-08-38","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":38,"q":"불활성기체 소화약제 IG-541에 포함되어 있지 않은 성분은?","c":["Ar","CO2","He","N2"],"a":3,"inc":false,"unit":"6-3"},{"id":"gwallisa-2021-05-08-39","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":39,"q":"강화액 소화약제에 관한 설명으로 옳은 것은?","c":["알카리 금속염류 등을 주성분으로 하는 수용액이다.","소화약제의 용액은 약산성이다.","화염과 접촉 시 열분해에 의하여 질소가 발생하여 질식소화 한다.","전기화재 시 무상방사 하는 경우라도 소화약제로 사용할 수 없다."],"a":1,"inc":false,"unit":"6-4"},{"id":"gwallisa-2021-05-08-40","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":40,"q":"이산화탄소 소화약제 600kg을 내용적 68L의 이산화탄소 저장용기에 충전할 때 필요한 저장용기의 최소 개수는? (단, 충전비는 1.6L/kg으로 한다.)","c":["9","11","13","15"],"a":4,"inc":false,"unit":"6-2"},{"id":"gwallisa-2021-05-08-49","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":49,"q":"전동기 기동에 관한 설명으로 옳지 않은 것은?","c":["농형 유도전동기의 Y-△기동 시 기동전류는 △결선하여 기동한 경우의 1/3이 된다.","권선형 유도전동기 기동 시 기동전류를 제한하기 위하여 기동보상기법이 주로 사용된다.","분상 기동형 단상 유도전동기는 병렬로 연결되어 있는 주권선과 보조권선에 의해 회전자계를 만들어 기동한다.","콘덴서 기동형 단상 유도전동기는 기동권선에 직렬로 콘덴서를 연결하여 주권선과 기동권선 사이에 위상차를 만들어 기동한다."],"a":2,"inc":false,"unit":"9-9"},{"id":"gwallisa-2021-05-08-53","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":53,"q":"소방기본법령상 특수가연물에 해당하지 않는 것은?","c":["볏짚류 500킬로그램","면화류 200킬로그램","사류(絲類) 1,000킬로그램","넝마 및 종이부스러기 1,000킬로그램"],"a":1,"inc":false,"unit":"3-2"},{"id":"gwallisa-2021-05-08-54","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":54,"q":"소방기본법령상 벌칙 기준에 관한 설명으로 옳지 않은 것은?(2021년 11월 30일 개정된 규정 적용됨)","c":["화재조사를 수행하면서 알게 된 비밀을 다른 사람에게 누설한 화재조사 관계 공무원은 500만원 이항의 벌금에 처한다.","위력을 사용하여 출동한 소방대의 화재진압·인명구조 또는 구급활동을 방해하는 행위를 한 사람은 5년 이하의 징역 도는 5천만원 이하의 벌금에 처한다.","화재경계지구 안의 소방대상물에 대한 화재안전조사를 거부·방해 또는 기피한 자는 300만원 이하의 벌금에 처한다.","피난 명령을 위반한 사람은 100만원 이하의 벌금에 처한다."],"a":1,"inc":false,"unit":"1-17"},{"id":"gwallisa-2021-05-08-60","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":60,"q":"화재예방, 소방시설 설치 · 유지 및 안전관리에 관한 법령상 화재안전기준 또는 대통령령이 변경되어 그 기준이 강화되는 경우 기존의 특정소방대상물의 소방시설에 대하여 강화된 기준을 적용하는 소방시설로 옳지 않은 것은?","c":["소화기구","노유자시설에 설치하는 비상콘센트설비","의료시설에 설치하는 자동화재탐지설비","「국토의 계획 및 이용에 관한 법률」에 따른 공동구에 설치하여야 하는 소방시설"],"a":2,"inc":false,"unit":"9-9"},{"id":"gwallisa-2021-05-08-68","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":68,"q":"위험물안전관리법령상 지정수량 이상의 위험물을 저장하기 위한 저장소의 구분에 포함되지 않는 것은?","c":["옥내저장소","옥외저장소","지하저장소","이동탱크저장소"],"a":3,"inc":false,"unit":"3-9"},{"id":"gwallisa-2021-05-08-69","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":69,"q":"위험물안전관리법령상 제조소등에 대한 정기점검 및 정기검사에 관한 설명으로 옳지 않은 것은?","c":["이동탱크저장소는 정기점검의 대상이다.","액체위험물을 저장 또는 취급하는 50만리터 이상의 옥외탱크저장소는 정기검사의 대상이다.","소방본부장 또는 소방서장은 당해 제조소등에 대하여 연 1회 이상 정기점검을 실시하여야 한다.","정기점점의 내용 · 방법 등에 관한 기술상의 기준과 그 밖의 점검에 관하여 필요한 사항은 소방청장이 정하여 고시한다."],"a":3,"inc":false,"unit":"3-9"},{"id":"gwallisa-2021-05-08-77","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":77,"q":"위험물에 관한 설명으로 옳지 않은 것은?","c":["중크롬산암모늄은 융점 이상으로 가열하면 분해되어 Cr2O3가 생성된다.","적린은 독성이 강한 자연발화성물질로 황린의 동소체이다.","수소화나트퓸이 물과 반응하면 수산화나트륨이 생성된다.","니트로셀룰로오스는 물이나 알코올에 습윤하면 운반 시 위험성이 낮아진다."],"a":2,"inc":false,"unit":"1-1"},{"id":"gwallisa-2021-05-08-86","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":86,"q":"메틸알코올 32g을 공기 중에서 완전연소 시키기 위하여 필요한 공기량(g)은 약 얼마인가? (단, 공기 중에 산소는 20vol.%, 질소는 80 vol.%이다.)","c":["54","108","216","432"],"a":3,"inc":false,"unit":"6-3"},{"id":"gwallisa-2021-05-08-89","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":89,"q":"위험물안전관리법령상 옥내저장소의 위치 · 구조 및 설비의 기준에 따라 위험물 저장창고의 바닥을 물이 스며 나오거나 스며들지 아니하는 구조로 하여야 하는 위험물이 아닌 것은?","c":["과산화나트륨","철분","칼륨","니트로글리세린"],"a":4,"inc":false,"unit":"3-9"},{"id":"gwallisa-2021-05-08-92","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":92,"q":"제5류 위험물의 성질에 관한 설명으로 옳지 않은 것은?","c":["강산화제, 강산류와 혼합한 것은 발화를 촉진시키고 위험성도 증가한다.","디아조화합물은 위험등급Ⅰ로 고농도인 경우 충격에 민감하여 연소 시 순간적으로 폭발한다.","니트로화합물은 화기, 가열, 충격 등에 민감하여 폭발위험이 있다.","외부의 산소공급이 없어도 자기연소하므로 연소속도가 빠르다."],"a":2,"inc":false,"unit":"1-1"},{"id":"gwallisa-2021-05-08-95","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":95,"q":"위험물안전관리법령상 소화설비, 경보설비 및 피난설비의 기준에서 제조소들에 전기설비가 설치된 경우 당해 장소의 면적이 400m2일 때, 소형수동식소화기를 최소 몇 개 이상 설치해야 하는가? (단, 전기배선, 조명기구 등은 제외한다.)","c":["1","2","3","4"],"a":4,"inc":false,"unit":"3-10"},{"id":"gwallisa-2021-05-08-97","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":97,"q":"위험물안전관리법령상 제조소의 환기설비 시설기준에 관한 설명으로 옳지 않은 것은?","c":["바닥면적이 120m2인 경우, 급기구의 면적은 300cm2 이상으로 하여야 한다.","환기구는 지붕위 또는 지상 2m 이상의 높이에 회전식 고정벤티레이터 또는 루푸팬방식으로 설치할 것","급기구는 해당 급기구가 설치된 실의 바닥면적 150m2 마다 1개 이상으로 하여야 한다.","급기구는 낮은 곳에 설치하고 가는 눈의 구리망 등으로 인화방지망을 설치하여야 한다."],"a":1,"inc":false,"unit":"7-8"},{"id":"gwallisa-2021-05-08-102","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":102,"q":"분말소화설비의 화재안전기준상 가압용가스용기에 관한 가준으로 옳지 않은 것은?","c":["분말소화약제의 가스용기는 분말소화약제의 저장용기에 접속하여 설치하여야 한다.","가압용가스에 질소가스를 사용하는 것의 질소가스는 소화약제 1kg마다 10ℓ이상으로 할 것","분말소화약제의 가압용가스 용기를 3병 이상 설치한 경우에는 2개 이상의 용기에 전자개방밸브를 부착하여야 하낟.","가압용가스에 이산화탄소를 사용하는 것의 이산화탄소는 소화약제 1kg에 대하여 20g에 배관의 청소에 필요한 양을 가산한 양 이상으로 할 것"],"a":2,"inc":false,"unit":"6-1"},{"id":"gwallisa-2021-05-08-103","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":103,"q":"할로겐화합물 및 불활성기체소화설비의 화재안전기준에서 정하고 있는 할로겐화합물 및 불활성기체소화약제 최대허용설계농도 중 다음에서 최대허용설계농도(%)가 가장 낮은 소화약제는?","c":["IG-55","HFC-23","HFC-125","FK-5-1-12"],"a":4,"inc":false,"unit":"6-3"},{"id":"gwallisa-2021-05-08-104","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":104,"q":"지하구의 화재안전기준상 방화벽의 설치기준으로 옳지 않은 것은?","c":["내화구조로서 홀로 설 수 있는 구조일 것","방화벽의 출입문은 30분 방화문으로 설치할 것","방화벽은 분기구 및 국사·변전소 등의 건축물과 지하구가 연결되는 부위(건축물로부터 20m 이내)에 설치할 것","방화벽을 관통하는 케이블·전선 등에는 국토교통부 고시(내화구조의 인정 및 관리기준)에 따라 내화충전 구조로 마감할 것"],"a":2,"inc":false,"unit":"2-2"},{"id":"gwallisa-2021-05-08-107","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":107,"q":"무선통신보조설비의 화재안전기준상 누설동축케이블 설치기준으로 옳지 않은 것은?","c":["누설동축케이블과 이에 접속하는 안테나 또는 동축케이블과 이에 접속하는 안테나로 구성할 것","누설동축케이블의 끝부분에는 무반사 종단저항을 견고하게 설치할 것","해당 전로에 정전기 차폐장치를 유효하게 설치한 경우에도 누설동축케이블 및 안테나는 고압의 전로로부터 1m 이상 떨어진 위치에 설치할 것","누설동축케이블 및 동축케이블은 특성이 변질되지 아니하는 것으로 장애가 없도록 할 것"],"a":3,"inc":false,"unit":"8-7"},{"id":"gwallisa-2021-05-08-108","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":108,"q":"미분무소화설비의 화재안전기준에 관한 내용으로 옳지 않은 것은?","c":["중압미분무소화설비란 사용압력이 0.5 MPa을 초과하고 5.5MPa 이하인 미분무소화설비를 말한다.","사용되는 필터 또는 스트레이너의 메쉬는 헤드 오리피스 지름의 80% 이하가 되어야한다.","설비에 사용되는 구성요소는 STS 304 이상의 재료를 사용하여야 한다.","가압송수장치가 기동되는 경우에는 자동으로 정지되지 아니하도록 하여야 한다."],"a":1,"inc":false,"unit":"4-10"},{"id":"gwallisa-2021-05-08-109","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":109,"q":"포소화설비의 화재안전기준에서 정하고 있는 가압송수장치의 포워터스프링클러헤드 표준방사량으로 옳은 것은?","c":["50 L/min 이상","65 L/min 이상","70 L/min 이상","75 L/min 이상"],"a":4,"inc":false,"unit":"4-6"},{"id":"gwallisa-2021-05-08-113","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":113,"q":"스프링클러설비의 화재안전기준상 헤드에 관한 기준으로 옳은 것은?","c":["살수가 방해되지 아니하도록 벽과 스프링클러헤드간의 공간은 10cm 이상으로 한다.","스프링클러헤드와 그 부착면과의 거리는 60cm 이하로 한다.","상부에 설치된 헤드의 방출수에 따라 감열부에 영향을 받을 우려가 있는 헤드에는 방출수를 차단할 수 있는 유효한 반사판을 설치한다.","측벽형을 설치하는 경우 긴 변의 한쪽 벽에 일렬로 설치하고 4m 이내마다 설치한다."],"a":1,"inc":false,"unit":"4-7"},{"id":"gwallisa-2021-05-08-114","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":114,"q":"옥내소화전설비의 화재안전기준에 관한 내용으로 옳은 것은?","c":["물올림장치란 옥내소화전설비의 관창에서 압력변동을 검지하여 자동적으로 펌프를 기동시키는 것으로서 압력챔버 또는 기동용압력 위치 등을 말한다.","펌프의 토출 측에는 진공계를 체크밸브 이전에 펌프토출 측 플랜지에서 가까운 곳에 설치한다.","가압송수장치의 기동을 표시하는 표시등은 옥내소화전함의 내부에 설치하되 황색등으로 한다.","옥내소화전설비의 수원은 그 저수량이 옥내소화전의 설치개수가 가장 많은 층의 설치개수(2개 이상 설치된 경우에는 2개)에 2.6m3를 곱한 양 이상이 되도록 하여야 한다."],"a":4,"inc":false,"unit":"4-6"},{"id":"gwallisa-2021-05-08-115","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":115,"q":"건축물의 높이가 3.5m인 특수가연물을 저장 또는 취급하는 랙크식 창고에 스프링클러설비를 설치하고자 한다. 바닥면적 가로 40m x 세로 66m라고 한다면, 스프링클러헤드를 정방형으로 배치할 경우 헤드의 최소 설치개수는?","c":["322개","433개","476개","512개"],"a":3,"inc":false,"unit":"4-7"},{"id":"gwallisa-2021-05-08-116","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":116,"q":"옥내소화전설비의 화재안전기준상 가압송수장치의 내연기관에 관한 내용으로 옳지 않은 것은?","c":["내연기관의 기동은 소화전함의 위치에서 원격조작이 가능하고 기동을 명시하는 적색등을 설치할 것","제어반에 따라 내연기관의 자동기동 및 수동기동이 가능하고, 상시 충전되어 있는 축전지설비를 갖출 것","내연기관의 연료량은 펌프를 20분(층수가 30층 이상 49층 이하는 40분, 50층 이상은 60분) 이상 운전할 수 있는 용량일 것","내연기관의 충압펌프는 정격부하운전 시험 및 수온의 상승을 방지하기 위하여 순환배관을 설치할 것"],"a":4,"inc":false,"unit":"4-6"},{"id":"gwallisa-2021-05-08-118","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":118,"q":"피난기구의 화재안전기준의 설치장소별 피난기구 적응성에서 노유자시설의 층별 적응성이 있는 피난기구의 연결이 옳은 것은?","c":["지하 1층 - 피난교","지상 2층 - 완강기","지상 3층 - 승강식 피난기","지상 4층 - 미끄럼대"],"a":3,"inc":false,"unit":"7-3"},{"id":"gwallisa-2021-05-08-119","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":119,"q":"화재예방, 소방시설 설치 · 유지 및 안전관리에 관한 법령상 시각경보기를 설치하여야 하는 특정소방대상물이 아닌 것은?","c":["숙박시설로서 연면적이 700m2 인 특정소방대상물","문화 및 집회시설로서 연면적이 900m2 인 특정소방대상물","노유자시설로서 연면적이 800m2 인 특정소방대상물","업무시설로서 연면적이 1,200m2 인 특정소방대상물"],"a":2,"inc":false,"unit":"8-7"},{"id":"gwallisa-2021-05-08-120","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":120,"q":"소방시설의 내진설계 기준에 관한 내용으로 옳지 않은 것은?","c":["상쇄배관(offset)이란 영향구역 내의 직선배관이 방향전환 한 후 다시 같은 방향으로 연속될 경우, 중간에 방향전환 된 짧은 배관은 단부로 보지 않고 상쇄하여 직선으로 볼 수 있는 것을 말하며, 짧은 배관의 합산길이는 3.7m 이하여야 한다.","하나의 수평직선배관은 최소 2개의 횡방향 흔들림 방지 버팀대와 1개의 종방향 흔들림 방지 버팀대를 설치하여야 한다.","수평직선배관 횡방향 흔들림 방지 버팀대의 간격은 중심선을 기준으로 최대간격이 12m를 초과하지 않아야 한다.","수평직선배관 종방향 흔들림 방지 버팀대의 설계하중은 영향구역내의 수평주행배관, 교차배관, 가지배관의 하중을 포함하여 산정한다."],"a":4,"inc":false,"unit":"13-1"},{"id":"gwallisa-2021-05-08-121","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":121,"q":"자동화재탐지설비 및 시각경보장치의 화재안전기준상 감지기에 관한 내용으로 옳은것은?","c":["공기관식 차동식분포형감지기 공기관의 노출부분은 감지구역마다 10m 이상이 되도록 한다.","감지기는 실내로의 공기유입구로부터 0.6m 이상 떨어진 위치에 설치한다.","광전식분리형감지기의 광축은 나란한 벽으로부터 0.5m 이상 이격하여 설치한다.","파이프덕트 등 그 밖의 이와 비슷한 것으로서 2개층마다 방화구획된 것이나 수평단면적이 5m2 이하인 것은 감지기를 설치하지 아니한다."],"a":4,"inc":false,"unit":"8-7"},{"id":"gwallisa-2021-05-08-124","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2021-05-08","num":124,"q":"자동화재탐지설비 및 시각경보장치의 화재안전기준상 경계구역의 설정기준으로 옳지 않은 것은?","c":["하나의 경계구역의 면적은 600m2 이하로 하고 한변의 길이는 50m 이하로 할 것","외기에 면하여 상시 개방된 부분이 있는 차고 · 주차장 · 창고 등에 있어서는 외기에 면하는 각 부분으로부터 5m 미만의 범위안에 있는 부분은 경계구역의 면적에 산입하지 아니한다.","하나의 경계구역이 2개 이상의 건축물에 미치지 아니하도록 할 것","하나의 경계구역이 2개 이상의 층에 미치지 아니하도록 할 것. 다만, 600m2 이하의 범위 안에서는 2개의 층을 하나의 경계구역으로 할 수 있다."],"a":4,"inc":false,"unit":"8-7"},{"id":"gwallisa-2022-05-21-1","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":1,"q":"가연물이 점화원과 접촉했을 때 연소가 시작되는 최저온도는?","c":["발화점","연소점","인화점","산화점"],"a":3,"inc":false,"unit":"1-5"},{"id":"gwallisa-2022-05-21-4","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":4,"q":"연소속도보다 가스 분출속도가 클 때, 주위에 공기유동이 심하여 불꽃이 노즐에서 떨어진 후 꺼지는 현상은?","c":["백파이어(Back fire)","링파이어(Ring fire)","블로우오프(Blow off)","롤오버(Roll over)"],"a":3,"inc":false,"unit":"1-10"},{"id":"gwallisa-2022-05-21-9","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":9,"q":"플래시오버(Flash over)와 백드래프트(Back draft)에 관한 설명으로 옳지 않은 것은?","c":["플래시오버는 층 전체가 순식간에 화염에 휩싸이면서 모든 공간을 통하여 입체적으로 확대되는 현상이다.","백드래프트는 밀폐된 공간에서 화재가 발생하여 산소농도 저하로 불꽃을 내지 못하고 가연물질의 열분해에 의해 발생된 가연성 가스가 축적되면서 갑자기 유입된 신선한 공기로 급격히 연소가 활발해진다.","플래시오버의 방지대책으로 가연물의 양을 제한하는 방법이 있다.","백드래프트가 발생하는 주요 원인은 복사열이다."],"a":4,"inc":false,"unit":"1-13"},{"id":"gwallisa-2022-05-21-10","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":10,"q":"건축물의 피난ㆍ방화구조 등의 기준에 관한 규칙상 발코니의 바닥에 국토교통부령으로 정하는 하향식 피난구의 설치기준으로 옳지 않은 것은?","c":["피난구의 덮개는 품질시험을 실시한 결과 비차열 1시간 이상의 내화성능을 가져야 할 것","피난구의 유효 개구부 규격은 직경 50센티미터 이상일 것","상층ㆍ하층간 피난구의 수평거리는 15센티미터 이상 떨어져 있을 것","사다리는 바로 아래층의 바닥면으로부터 50센티미터 이하까지 내려오는 길이로 할 것"],"a":2,"inc":false,"unit":"2-3"},{"id":"gwallisa-2022-05-21-11","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":11,"q":"건축물의 피난ㆍ방화구조 등의 기준에 관한 규칙상 내화구조로 옳지 않은 것은?","c":["외벽 중 비내력벽인 경우에는 철근콘크리트조로서 두께가 7센티미터 이상인 것","기둥의 경우에는 그 작은 지름이 20센티미터 이상인 것으로서 철근콘크리트조인 것(고강도 콘크리트를 사용하는 경우가 아님)","바닥의 경우에는 철근콘크리트조로서 두께가 10센티미터 이상인 것","보의 경우에는 철근콘크리트조인 것(고강도 콘크리트를 사용하는 경우가 아님)"],"a":2,"inc":false,"unit":"2-3"},{"id":"gwallisa-2022-05-21-12","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":12,"q":"건축물의 피난ㆍ방화구조 등의 기준에 관한 규칙 및 건축법령상 피난 및 방화구조 등에 관한 내용으로 옳은 것은?","c":["시멘트모르타르 위에 타일을 붙인 것으로서 그 두께의 합계가 2센티미터 이상인 것은 방화구조이다.","초고층 건축물에는 피난층 또는 지상으로 통하는 직통계단과 직접 연결되는 피난안전구역을 지상층으로부터 최대 30개 층마다 1개소 이상 설치하여야 한다.","소방관 진입창의 기준은 창문의 가운데에 지름 20센티미터 이상의 사각형을 야간에도 알아볼 수 있도록 빛 반사 등으로 붉은 색으로 표시할 것","지하층의 비상탈출구는 지하층의 바닥으로부터 비상탈출구의 아랫부분까지의 높이가 1.2미터 이상이 되는 경우에는 벽체에 발판의 너비가 15센티미터 이상인 사다리를 설치할 것"],"a":2,"inc":false,"unit":"2-3"},{"id":"gwallisa-2022-05-21-13","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":13,"q":"건축물의 피난ㆍ방화구조 등의 기준에 관한 규칙상 특별피난계단의 구조에 관한 설명으로 옳지 않은 것은?","c":["계단실의 노대 또는 부속실에 접하는 창문 등(출입구를 제외한다)은 망이 들어 있는 유리의 붙박이창으로서 그 면적을 각각 2제곱미터 이하로 할 것","노대 및 부속실에는 계단실외의 건축물의 내부와 접하는 창문 등(출입구를 제외한다)을 설치하지 아니할 것","출입구의 유효너비는 0.9미터 이상으로 하고 피난의 방향으로 열 수 있을 것","계단은 내화구조로 하되, 피난층 또는 지상까지 직접 연결되도록 할 것"],"a":1,"inc":false,"unit":"2-3"},{"id":"gwallisa-2022-05-21-16","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":16,"q":"화재 시 인간의 피난행동 특성을 고려하여 혼란을 최소화하는 건축물 피난계획의 일반적인 원칙에 관한 설명으로 옳지 않은 것은?","c":["피난경로 중 한 방향이 화재 등의 재난으로 사용할 수 없을 경우에 다른 방향이 사용되도록 고려하는 페일 세이프(fail safe) 원칙이 필요하다.","피난설비는 이동식 기구와 이동식 장치(피난기구) 등이 원칙이며, 고정시설은 탈출에 늦은 소수 사람에 대한 극히 예외적인 보조 수단으로 고려한다.","피난경로에 따라 일정 구역을 한정하여 피난 존으로 설정하고, 최종 안전한 피난 장소 쪽으로 진행됨에 따라 각 존의 안전성을 높인다.","피난로에는 정전 시에도 피난방향을 명백히 확인 할 수 있는 표시를 한다."],"a":2,"inc":false,"unit":"7-1"},{"id":"gwallisa-2022-05-21-17","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":17,"q":"공간(가로 10 m, 세로 30 m, 높이 5 m)에 목재 1,000 kg과 가연성 A물질 2,000 kg이 적재되어 있는 경우 완전연소 하였을 때 화재하중은 약 몇 kg/m2인가? (단, 목재의 단위 발열량은 4,500 kcal/kg, 가연성 A물질의 단위 발열량은 3,000 kJ/kg이다.)","c":["0.88","2.60","4.40","6.32"],"a":3,"inc":false,"unit":"1-12"},{"id":"gwallisa-2022-05-21-18","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":18,"q":"목조건축물과 비교한 내화건축물의 화재 특성에 관한 설명으로 옳은 것은?","c":["화염의 분출면적이 크고, 복사열이 커서 접근하기 어렵다.","횡방향보다 종방향의 화재성장이 빠르다.","최성기에 도달하는 시간이 빠르다.","저온장기형의 특성을 갖는다."],"a":4,"inc":false,"unit":"1-11"},{"id":"gwallisa-2022-05-21-19","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":19,"q":"고체 가연물의 연소방식으로 옳지 않은 것은?","c":["분무연소","분해연소","작열연소","증발연소"],"a":1,"inc":false,"unit":"1-5"},{"id":"gwallisa-2022-05-21-20","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":20,"q":"연소속도를 결정하는 인자로 옳지 않은 것은?","c":["비중량","산소농도","촉매","온도"],"a":1,"inc":false,"unit":"1-10"},{"id":"gwallisa-2022-05-21-21","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":21,"q":"열전달 방법 중 복사에 관한 설명으로 옳지 않은 것은?","c":["물질에서 방사되는 에너지가 전자기적인 파동에 의해 전달되는 현상이다.","진공상태에서는 손실이 없으며, 공기 중에서도 거의 손실이 없다.","복사열은 절대온도 제곱에 비례하고, 열전달 면적에 반비례한다.","스테판-볼츠만 법칙이 적용된다."],"a":3,"inc":false,"unit":"1-7"},{"id":"gwallisa-2022-05-21-26","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":26,"q":"유체의 점성계수가 0.8 poise 이고 비중이 1.1일 때 동점성계수(ν) 는 약 몇 stokes 인가?","c":["0.088","0.727","0.880","7.270"],"a":2,"inc":false,"unit":"4-1"},{"id":"gwallisa-2022-05-21-28","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":28,"q":"베르누이 방정식의 가정조건으로 옳지 않은 것은?","c":["동일한 유선을 따르는 흐름이다.","압축성 유체의 흐름이다.","정상상태의 흐름이다.","마찰이 없는 흐름이다."],"a":2,"inc":false,"unit":"4-2"},{"id":"gwallisa-2022-05-21-30","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":30,"q":"수평면과 상방향으로 45° 경사를 갖는 지름 250 mm 인 원관에서 유출하는 물의 평균 유출속도가 9.8 m/s 이다. 원관의 출구로부터 물의 최대 수직상승 높이는 약 몇 m 인가?","c":["0.25","0.49","2.45","4.90"],"a":3,"inc":false,"unit":"1-9"},{"id":"gwallisa-2022-05-21-31","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":31,"q":"내경이 250 mm 인 원관을 통해 비압축성 유체가 흐르고 있다. 체적 유량이 40 ℓ/s 일 때, 레이놀즈수(Re)는 약 얼마인가? (단, 동점성계수는 0.120×10-3m2/s 이다.)","c":["1,698","2,084","3,396","4,168"],"a":1,"inc":false,"unit":"4-3"},{"id":"gwallisa-2022-05-21-32","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":32,"q":"유체가 원관을 층류로 흐를 때 발생하는 마찰손실계수에 관한 설명으로 옳은 것은?","c":["레이놀즈수의 함수이다.","레이놀즈수와 상대조도의 함수이다.","마하수와 코시수의 함수이다.","상대조도와 오일러수의 함수이다."],"a":1,"inc":false,"unit":"4-3"},{"id":"gwallisa-2022-05-21-35","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":35,"q":"화재 종류에 따른 소화약제의 적응성에 관한 내용으로 옳지 않은 것은?","c":["A 급 화재의 경우 수성막포를 사용하여 질식 효과로 소화할 수 있다.","B 급 화재의 경우 물을 사용하여 부촉매 효과로 소화할 수 있다.","C급 화재의 경우 ABC급 분말을 사용하여 부촉매 효과로 소화할 수 있다.","K 급 화재의 경우 강화액을 사용하여 냉각 효과로 소화할 수 있다."],"a":2,"inc":false,"unit":"1-17"},{"id":"gwallisa-2022-05-21-36","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":36,"q":"이산화탄소 소화약제의 저장용기 설치 기준으로 옳지 않은 것은?","c":["저장용기의 충전비는 고압식은 1.5이상 1.9이하로 할 것.","저장용기의 충전비는 저압식은 1.1이상 1.4이하로 할 것.","저압식 저장용기에는 액면계 및 압력계와 1.9 MPa 이상 1.5 MPa 이하의 압력에서 작동하는 압력경보장치를 설치할 것.","저장용기는 고압식은 25 MPa 이상, 저압식은 3.5 MPa 이상의 내압시험압력에 합격한 것으로 할 것."],"a":3,"inc":false,"unit":"6-2"},{"id":"gwallisa-2022-05-21-37","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":37,"q":"가연물질이 부탄(Butane)인 경우 이산화탄소의 최소소화농도(vol %)와 최소설계농도(vol %)를 순서대로 옳게 나열한 것은?","c":["24, 34","28, 34","34, 41","38, 41"],"a":2,"inc":false,"unit":"6-2"},{"id":"gwallisa-2022-05-21-38","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":38,"q":"할로겐화합물 및 불활성기체 소화약제의 종류 중 HFC 계열로 옳지 않은 것은?","c":["CHF3","CHF2CF3","CHClFCF3","CF3CHFCH3"],"a":3,"inc":false,"unit":"6-3"},{"id":"gwallisa-2022-05-21-39","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":39,"q":"포 소화약제의 혼합장치 설치 방식 중 펌프와 발포기의 중간에 설치된 벤추리관의 벤추리작용에 따라 포 소화약제를 흡입ㆍ혼합하는 방식으로 옳은 것은?","c":["라인 푸로포셔너방식","펌프 푸로포셔너방식","압축공기포 믹싱챔버방식","프레져사이드 푸로포셔너방식"],"a":1,"inc":false,"unit":"5-1"},{"id":"gwallisa-2022-05-21-41","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":41,"q":"할로겐화합물 및 불활성기체 소화약제의 최대허용설계농도로 옳지 않은 것은?","c":["HCFC-124 : 1.0%","HFC-236fa : 12.5%","IG-100 : 30%","HFC-23 : 30%"],"a":3,"inc":false,"unit":"6-3"},{"id":"gwallisa-2022-05-21-42","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":42,"q":"분말소화약제의 저장용기 설치 기준으로 옳은 것은?","c":["저장용기에는 가압식은 최고사용압력의 2.5배 이하, 축압식은 용기의 내압시험압력의 0.8배 이하의 압력에서 작동하는 안전밸브를 설치할 것.","제1종 분말 소화약제 1 kg당 저장용기의 내용적은 0.8ℓ로 하고 저장용기의 충전비는 0.8이상으로 할 것.","제2종 분말 소화약제 1 kg당 저장용기의 내용적은 1.25ℓ로 하고 저장용기의 충전비는 0.8이상으로 할 것.","제3종 분말 소화약제 1 kg 당 저장용기의 내용적은 1 ℓ로 하고 저장용기의 충전비는 1.1이상으로 할 것."],"a":2,"inc":false,"unit":"6-1"},{"id":"gwallisa-2022-05-21-45","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":45,"q":"자계에 관한 설명으로 옳지 않은 것은?","c":["도체의 운동에 의한 전자유도현상에 의해 발생되는 유도기전력의 방향은 플레밍의 왼손법칙에 따라 결정된다.","자계의 크기나 자성체 내부의 자기적인 상태를 나타내기 위하여 자속의 방향에 수직인 단위 면적을 통과하는 자속의 수를 자속밀도라 한다.","자석 사이에 작용하는 힘을 양적으로 취급하는데 전계에서와 같이 쿨롱의 법칙을 이용한다.","암페어의 주회법칙은 전류에 의한 자계의 세기를 구하는데 사용한다."],"a":1,"inc":false,"unit":"4-1"},{"id":"gwallisa-2022-05-21-52","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":52,"q":"소방기본법령상 소방지원활동으로 명시되지 않은 것은?","c":["산불에 대한 예방ㆍ진압 등 지원","단전사고 시 비상전원 또는 조명의 공급 지원","자연재해에 따른 급수ㆍ배수 및 제설 등 지원","집회ㆍ공연 등 각종 행사 시 사고에 대비한 근접대기 등 지원"],"a":2,"inc":false,"unit":"9-6"},{"id":"gwallisa-2022-05-21-59","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":59,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 임시소방시설에 해당하는 것은?","c":["간이완강기","공기호흡기","간이피난유도선","비상콘센트설비"],"a":3,"inc":false,"unit":"9-9"},{"id":"gwallisa-2022-05-21-62","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":62,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 특정소방대상물의 관계인이 간이스프링클러 설비를 설치하여야 하는 대상이 아닌 것은?","c":["입원실이 없는 의원으로서 연면적 600 m2 미만인 시설","조산원으로서 연면적 600 m2 미만인 시설","교육연구시설 내에 합숙소로서 연면적 100 m2 이상인 것","숙박시설 중 생활형 숙박시설로서 해당 용도로 사용되는 바닥면적의 합계가 600 m2 이상인 것"],"a":1,"inc":false,"unit":"4-7"},{"id":"gwallisa-2022-05-21-69","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":69,"q":"위험물안전관리법령상 위험물의 성질과 품명이 바르게 연결된 것은?","c":["산화성고체 - 과염소산염류","자연발화성물질 및 금수성물질 - 특수인화물","인화성액체 - 아조화합물","자기반응성물질 - 과산화수소"],"a":1,"inc":false,"unit":"1-1"},{"id":"gwallisa-2022-05-21-70","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":70,"q":"위험물안전관리법령상 동일구내에 있거나 상호 100미터 이내의 거리에 있는 다수의 저장소로서 동일인이 설치한 경우 1인의 안전관리자를 중복하여 선임할 수 없는 것은?","c":["10개의 옥내저장소","30개의 옥외저장소","10개의 암반탱크저장소","30개의 옥외탱크저장소"],"a":2,"inc":false,"unit":"3-9"},{"id":"gwallisa-2022-05-21-78","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":78,"q":"히드록실아민의 성상에 관한 설명으로 옳지 않은 것은?","c":["물, 메탄올에 녹는다.","금속과 접촉하면 가연성의 C2H2 가스가 발생한다.","암모니아에서 수소가 수산기로 치환되어 생성된 무색의 침상결정 물질이다.","습기와 이산화탄소가 존재하면 분해, 가열되면서 폭발할 수 있다."],"a":2,"inc":false,"unit":"6-2"},{"id":"gwallisa-2022-05-21-82","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":82,"q":"메틸알코올과 에틸알코올의 성상에 관한 설명으로 옳지 않은 것은?","c":["포화1가 알코올이다.","연소하한계는 메틸알코올이 에틸알코올보다 낮다.","인화점은 상온(20℃) 보다 낮고, 비점은 100 ℃ 미만이다.","연소 시 불꽃이 잘 보이지 않으므로 화상의 위험이 있다."],"a":2,"inc":false,"unit":"1-1"},{"id":"gwallisa-2022-05-21-88","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":88,"q":"위험물안전관리법령상 소화설비, 경보설비 및 피난설비의 기준에서 용량 190ℓ인 수조(소화전용물통 6개 포함)의 능력단위는?","c":["1.0","1.5","2.5","3.0"],"a":3,"inc":false,"unit":"3-10"},{"id":"gwallisa-2022-05-21-89","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":89,"q":"위험물안전관리법령상 제조소의 위치ㆍ구조 및 설비의 환기설비 기준에서 급기구가 설치된 실의 바닥면적이 60 m2 일 경우 급기구의 면적기준은?","c":["150 cm2 이상","300 cm2 이상","450 cm2 이상","600 cm2 이상"],"a":2,"inc":false,"unit":"7-8"},{"id":"gwallisa-2022-05-21-91","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":91,"q":"위험물안전관리법령상 소화설비, 경보설비 및 피난설비의 기준에서 연면적이 300 m2인 위험물제조소의 소요단위는? (단, 제조소의 건축물 외벽은 내화구조가 아니다.)","c":["3","4","5","6"],"a":4,"inc":false,"unit":"2-3"},{"id":"gwallisa-2022-05-21-93","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":93,"q":"위험물안전관리법령상 소화설비, 경보설비 및 피난설비의 기준에서 소화난이도 등급Ⅰ의 주유취급소 중 건축물에 한정하여 설치하는 소화설비는?","c":["옥내소화전설비","옥외소화전설비","스프링클러설비","연결송수관설비"],"a":3,"inc":false,"unit":"3-10"},{"id":"gwallisa-2022-05-21-94","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":94,"q":"위험물안전관리법령상 제4류 위험물중 이동탱크저장소에 저장하는 경우 접지도선을 설치하여야 하는 것으로 명시되어 있지 않은 것은?","c":["특수인화물","제1석유류","제2석유류","제3석유류"],"a":4,"inc":false,"unit":"3-9"},{"id":"gwallisa-2022-05-21-95","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":95,"q":"위험물안전관리법령상 이동탱크저장소의 이동저장탱크에 설치하는 안전장치 및 방파판의 기준으로 옳지 않은 것은?","c":["하나의 구획부분에 2개 이상의 방파판을 이동탱크저장소의 진행방향과 수직으로 설치하되, 각 방파판은 그 높이 및 칸막이로부터의 거리를 같게 할 것","방파판은 두께 1.6 mm 이상의 강철판 또는 이와 동등 이상의 강도ㆍ내열성 및 내식성이 있는 금속성의 것으로 할 것","상용압력이 20 kPa 이하인 탱크에 있어서는 20 kPa 이상 24 kPa 이하의 압력에서 안전장치가 작동하는 것으로 할 것","상용압력이 20 kPa를 초과하는 탱크에 있어서는 상용압력의 1.1배 이하의 압력에서 안전장치가 작동하는 것으로 할 것"],"a":1,"inc":false,"unit":"3-9"},{"id":"gwallisa-2022-05-21-97","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":97,"q":"위험물안전관리법령상 옥내탱크저장소 중 탱크전용실을 단층건물 외의 건축물에 설치하는 경우 탱크전용실을 건축물의 1층 또는 지하층에 설치하여야 하는 것은?","c":["질산의 탱크전용실","중유의 탱크전용실","실린더유의 탱크전용실","클레오소트유의 탱크전용실"],"a":1,"inc":false,"unit":"3-9"},{"id":"gwallisa-2022-05-21-99","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":99,"q":"위험물안전관리법령상 간이탱크저장소의 간이저장탱크에 설치하여야 하는 '밸브 없는 통기관'의 설비기준으로 옳지 않은 것은?","c":["통기관의 지름은 25 mm 이상으로 할 것","통기관은 옥외에 설치하되, 그 끝부분의 높이는 지상 1.5 m 이상으로 할 것","인화점 80 ℃ 이상의 위험물만을 해당 위험물의 인화점 미만의 온도로 저장 또는 취급하는 탱크에 설치하는 통기관에는 인화방지장치를 할 것","통기관의 끝부분은 수평면에 대하여 아래로 45˚ 이상 구부려 빗물 등이 침투하지 아니하도록 할 것"],"a":3,"inc":false,"unit":"3-9"},{"id":"gwallisa-2022-05-21-101","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":101,"q":"화재안전기준상 설치 높이 기준이 다른 것은?","c":["포소화설비의 송수구","옥내소화전설비의 방수구","연결송수관설비의 송수구","소화용수설비의 채수구"],"a":2,"inc":false,"unit":"4-6"},{"id":"gwallisa-2022-05-21-102","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":102,"q":"옥내소화전설비의 화재안전기준상 배관에 관한 내용으로 옳지 않은 것은?","c":["펌프의 흡입 측 배관은 공기 고임이 생기지 아니하는 구조로 하고 여과장치를 설치하여야 한다.","연결송수관설비의 배관과 겸용할 경우의 주배관은 구경 100 mm 이상, 방수구로 연결되는 배관의 구경은 65 mm 이상인 것으로 하여야 한다.","펌프의 흡입 측 배관은 수조가 펌프보다 낮게 설치된 경우에는 충압펌프를 제외한 각 펌프마다 수조로부터 별도로 설치하여야 한다.","펌프의 토출 측 주배관의 구경은 유속이 4 m/s 이하가 될 수 있는 크기 이상으로 하여야 한다."],"a":3,"inc":false,"unit":"4-6"},{"id":"gwallisa-2022-05-21-104","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":104,"q":"자동화재탐지설비 및 시각경보장치의 화재안전기준상 설치장소별 감지기 적응성에서 연기감지기를 설치할 수 있는 경우, 연기가 멀리 이동해서 감지기에 도달하는 계단, 경사로와 같은 장소에 적응성이 있는 감지기 종류로 묶인 것은?","c":["이온화식스포트형, 광전식분리형","이온아날로그식스포트형, 광전아날로그식분리형","광전아날로그식분리형, 광전식분리형","이온아날로그식스포트형, 이온화식스포트형"],"a":3,"inc":false,"unit":"7-2"},{"id":"gwallisa-2022-05-21-106","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":106,"q":"옥내소화전설비의 화재안전기준상 펌프의 정격토출량이 650 ℓ/min일 때 성능시험배관의 유량측정장치 용량은 몇 ℓ/min 이상으로 하여야 하는가?","c":["650.5","910.5","975.5","1,137.5"],"a":4,"inc":false,"unit":"4-6"},{"id":"gwallisa-2022-05-21-108","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":108,"q":"전양정 150 m, 토출량 20 m3/min, 회전수 1,800 rpm인 펌프가 있다. 이때 편흡입 2단 펌프와 양흡입 1단 펌프의 비속도는 약 얼마인가?","c":["315.9, 132.8","315.9, 143.6","354.1, 132.8","354.1, 143.6"],"a":1,"inc":false,"unit":"4-4"},{"id":"gwallisa-2022-05-21-109","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":109,"q":"공기관식 차동식분포형 감지기의 화재작동시험을 했을 경우 작동시간이 규정(기준)시간보다 늦은 경우가 아닌 것은?","c":["리크저항값이 규정치보다 작다.","접점수고값이 규정치보다 낮다.","주입한 공기량에 비해 공기관 길이가 길다.","공기관에 작은 구멍이 있다."],"a":2,"inc":false,"unit":"8-3"},{"id":"gwallisa-2022-05-21-112","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":112,"q":"소방시설의 내진설계 기준상 흔들림방지 버팀대의 설치기준으로 옳지 않은 것은?","c":["흔들림 방지 버팀대가 부착된 건축 구조부재는 소화배관에 의해 추가된 지진하중을 견딜 수 있어야 한다.","흔들림 방지 버팀대의 세장비(L/r)는 300을 초과하지 않아야 한다.","2방향 흔들림 방지 버팀대는 횡방향 및 종방향 흔들림 방지 버팀대의 역할을 동시에 할 수 있어야 한다.","흔들림 방지 버팀대는 내력을 충분히 발휘할 수 있도록 견고하게 설치하여야 한다."],"a":3,"inc":false,"unit":"13-1"},{"id":"gwallisa-2022-05-21-113","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":113,"q":"스프링클러설비의 화재안전기준상 폐쇄형 스프링클러헤드를 사용하는 경우 수원의 저수량 산정 시 스프링클러헤드 기준개수가 가장 많은 장소는? (단, 층이나 세대에 설치된 헤드 개수는 기준개수보다 많다.)","c":["지하역사","지하층을 제외한 층수가 10층인 의료시설로 헤드의 부착 높이가 8 m 이상인 것","지하층을 제외한 층수가 35층인 아파트","지하층을 제외한 층수가 10층인 판매시설이 설치되지 않은 복합건축물"],"a":1,"inc":false,"unit":"4-7"},{"id":"gwallisa-2022-05-21-114","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":114,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 물분무등소화설비를 설치하여야 하는 특정소방대상물은? (단, 위험물 저장 및 처리 시설 중 가스시설 또는 지하구는 제외한다.)","c":["항공기 및 자동차 관련 시설 중 자동차 정비공장","연면적 600 m2 이상인 차고, 주차용 건축물 또는 철골 조립식 주차시설","건축물 내부에 설치된 차고 또는 주차장으로서 차고 또는 주차의 용도로 사용되는 부분의 바닥면적이 200 m2 이상인 층","기계장치에 의한 주차시설을 이용하여 10대 이상의 차량을 주차할 수 있는 것"],"a":3,"inc":false,"unit":"4-10"},{"id":"gwallisa-2022-05-21-117","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":117,"q":"할론소화설비의 화재안전기준상 자동식 기동장치에 관한 기준으로 옳은 것은?","c":["기계식 기동장치로서 7병 이상의 저장용기를 동시에 개방하는 설비는 2병 이상의 저장용기에 전자개방밸브를 부착할 것","가스압력식 기동장치의 기동용가스용기에는 내압시험압력 0.6배부터 내압시험압력 이하에서 작동하는 안전장치를 설치할 것","가스압력식 기동장치에서 기동용가스용기의 용적은 1ℓ 이상으로 하고, 해당 용기에 저장하는 이산화탄소의 양은 0.6 kg 이상으로 하며, 충전비는 1.5 이상으로 할 것","가스압력식 기동장치의 기동용가스용기 및 해당 용기에 사용하는 밸브는 20 MPa 이상의 압력에 견딜 수 있는 것으로 할 것"],"a":3,"inc":false,"unit":"6-2"},{"id":"gwallisa-2022-05-21-118","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":118,"q":"연결송수관설비의 화재안전기준에 관한 내용으로 옳지 않은 것은?","c":["방수기구함은 피난층과 가장 가까운 층을 기준으로 3개층마다 설치하되, 그 층의 방수구마다 수평거리 5 m 이내에 설치할 것","송수구는 구경 65 mm의 쌍구형으로 할 것","충압펌프를 제외한 가압송수장치는 부식 등으로 인한 펌프의 고착을 방지할 수 있도록 펌프축은 스테인리스 등 부식에 강한 재질을 사용할 것","습식의 경우 송수구 부근에는 송수구ㆍ자동배수밸브ㆍ체크밸브의 순으로 설치할 것"],"a":1,"inc":false,"unit":"4-6"},{"id":"gwallisa-2022-05-21-120","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":120,"q":"피난기구의 화재안전기준상 승강식 피난기 및 하향식 피난구용 내림식 사다리 설치기준으로 옳지 않은 것은?","c":["대피실 내에는 비상조명등을 설치 할 것","대피실에는 층의 위치표시와 피난기구 사용설명서 및 주의사항 표지판을 부착 할 것","사용 시 기울거나 흔들리지 않도록 설치할 것","대피실 출입문이 개방되거나, 피난기구 작동 시 해당층 및 직상층 거실에 설치된 표시등 및 경보장치가 작동되고, 감시 제어반에서는 피난기구의 작동을 확인 할 수 있어야 할 것"],"a":4,"inc":false,"unit":"7-3"},{"id":"gwallisa-2022-05-21-124","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2022-05-21","num":124,"q":"무선통신보조설비의 화재안전기준에 관한 내용으로 옳지 않은 것은?","c":["누설동축케이블 또는 동축케이블과 이에 접속하는 안테나가 설치된 층은 계단실, 승강기, 별도 구획된 실을 제외한 모든 부분에서 유효하게 통신이 가능할 것","증폭기에는 비상전원이 부착된 것으로 하고 해당 비상전원 용량은 무선통신보조설비를 유효하게 30분 이상 작동시킬 수 있는 것으로 할 것","누설동축케이블의 끝부분에는 무반사 종단저항을 견고하게 설치할 것","분배기ㆍ분파기 및 혼합기 등의 임피던스는 50 Ω의 것으로 할 것"],"a":1,"inc":false,"unit":"8-7"},{"id":"gwallisa-2023-05-20-4","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":4,"q":"연소점, 인화점 및 발화점에 관한 내용으로 옳지 않은 것은?","c":["연소점, 인화점, 발화점 순으로 온도가 높다.","인화점은 외부에너지(점화원)에 의해 발화하기 시작되는 최저온도를 말한다.","발화점은 점화원 없이 스스로 발화할 수 있는 최저온도를 말한다.","연소점은 외부에너지(점화원)를 제거해도 연소가 지속되는 최저온도를 딛조한다."],"a":1,"inc":false,"unit":"1-1"},{"id":"gwallisa-2023-05-20-5","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":5,"q":"가연성기체의 폭발한계범위에서 위험도가 가장 높은 것은?","c":["수소","에틸렌","아세틸렌","에테인"],"a":3,"inc":false,"unit":"3-1"},{"id":"gwallisa-2023-05-20-7","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":7,"q":"폭발의 분류에서 기상폭발이 아닌 것은?","c":["가스폭발","분해폭발","수증기폭발","분진폭발"],"a":3,"inc":false,"unit":"1-20"},{"id":"gwallisa-2023-05-20-9","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":9,"q":"폭발의 종류와 해당 폭발이 일어날 수 있는 물질의 연결이 옳은 것은?","c":["산화폭발 - 가연성가스","분진폭발 - 시안화수소","중합폭발 - 아세틸렌","분해폭발 - 염화비닐"],"a":1,"inc":false,"unit":"1-22"},{"id":"gwallisa-2023-05-20-10","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":10,"q":"건축물의 피난·방화구조 등의 기준에 관한 규칙상 피난안전구역의 면적 산정기준에서 문화·집회 용도에서 고정좌석을 사용하지 않는 공간의 재실자 밀도 기준으로 옳은 것은?","c":["0.28","0.45","2.80","9.30"],"a":2,"inc":false,"unit":"2-3"},{"id":"gwallisa-2023-05-20-11","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":11,"q":"가로 10m, 세로 5m, 높이 10m 인 실내공간에 저장되어 있는 발열량 10,500 kcal/kg인 가연물 1,000 kg과 발열량 7,500 kcal/kg인 가연물 2,000 kg이 완전연소 하였을 때 화재하중(kg/m2)은 약 얼마인가? (단, 목재의 단위 발열량은 4,500 kcal/kg임)","c":["56.67","70.35","113.33","120.56"],"a":3,"inc":false,"unit":"1-12"},{"id":"gwallisa-2023-05-20-13","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":13,"q":"건축물의 피난·방화구조 등의 기준에 관한 규칙상 벽의 내화구조에 관한 내용으로 옳지 않은 것은?","c":["철근콘크리트조 또는 철골철근콘크리트조로서 두께가 10센티미터 이상인 것","철재로 보강된 콘크리트블록조·벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 5센티미터 이상인 것","벽돌조로서 두께가 15센티미터 이상인 것","고온·고압의 증기로 양생된 경량기포 콘크리트패널 또는 경량기포 콘크리트블록조로서 두께가 10센티미터 이상인 것"],"a":3,"inc":false,"unit":"2-3"},{"id":"gwallisa-2023-05-20-14","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":14,"q":"건축물의 피난·방화구조 등의 기준에 관한 규칙상 피난안전구역 설치기준에 관한 설명으로 옳은 것은?","c":["피난안전구역의 내부마감재료는 난연재료로 설치할 것","비상용 승강기는 피난안전구역에서 승하차 할 수 있는 구조로 설치할 것","건축물의 내부에서 피난안전구역으로 통하는 계단은 피난계단의 구조로 설치할 것","피난안전구역의 높이는 l.8미터 이상일 것"],"a":2,"inc":false,"unit":"2-3"},{"id":"gwallisa-2023-05-20-18","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":18,"q":"화재실 내부에 발생한 난류화염에 벽체가 노출되었다. 화염으로부터 벽체에 전달되는 대류 열유속(W/m2)은 얼마인가? (단, 대류열전달계수는 7W/m2·℃, 난류화염의 온도는 900℃, 벽체의 온도는 30℃, 벽체면적은 2m2 임)","c":["6,090","6,510","12,180","13,020"],"a":1,"inc":false,"unit":"1-7"},{"id":"gwallisa-2023-05-20-19","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":19,"q":"고체가연물의 한 쪽 면이 가열되고 있는 조건에서 점화시간에 관한 설명으로 옳지 않은 것은?","c":["얇은 가연물이 두꺼운 가연물보다 빨리 점화된다.","밀도가 높을수록 점화하기까지의 시간이 짧아진다.","가연물의 발화점이 낮을수록 점화하기까지의 시간이 짧아진다.","비열이 클수록 점화하기까지의 시간이 길어진다."],"a":2,"inc":false,"unit":"1-5"},{"id":"gwallisa-2023-05-20-20","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":20,"q":"화재성장속도 분류에서 약 1MW의 열량에 도달하는 시간이 300초에 해당하는 것은?","c":["Slow 화재","Medium 화재","Fast 화재","Ultrafast 화재"],"a":2,"inc":false,"unit":"1-11"},{"id":"gwallisa-2023-05-20-21","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":21,"q":"연소생성물 중 발생하는 연소가스에 관한 설명으로 옳지 않은 것은?","c":["시안화수소는 울, 실크, 나일론과 같이 질소를 함유하는 물질 등이 연소할 때 발생한다.","일산화탄소는 가연물이 불완전 연소할 때 발생하는 것으로 독성가스이며 연소가 가능한 물질이다.","이산화탄소는 흡입하면 호흡이 촉진되어 화재에 의해 발생하는 독성가스나 수증기를 흡입하는 양이 늘어난다.","황화수소는 폴리염화비닐(PVC)이 화재로 인해 분해됐을 때 다량 발생하며, 금속에 대한 강한 부식성이 있다."],"a":4,"inc":false,"unit":"6-2"},{"id":"gwallisa-2023-05-20-22","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":22,"q":"열방출속도가 2MW로 연소 중인 화재를 진압하는데 필요한 최소 방수량(g/s)은 약 얼마인가? (단, 물의 온도는 20℃, 기화온도는 100℃, 기화열은 2,260 J/g이며, 물의 냉각효과가 열방출속도보다 크면 소화됨)","c":["715.16","746.83","770.89","884.96"],"a":3,"inc":false,"unit":"1-10"},{"id":"gwallisa-2023-05-20-27","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":27,"q":"어떤 액체의 동점성계수가 0.002m2/s, 비중이 1.1일 때 이 액체의 점성계수(N·s/m2)는 얼마인가? (단, 중력가속도는 9.8m/s2, 물의 단위중량은 9.8kN/m3이다.)","c":["2.2","6.8","10.1","15.7"],"a":1,"inc":false,"unit":"4-1"},{"id":"gwallisa-2023-05-
