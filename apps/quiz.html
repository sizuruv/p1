"cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":44,"q":"정격용량 1,000kVA, 발전기 과도 리액턴스 0.2 인 자가발전기의 차단기 용량 (kVA)은?","c":["5,230","5,720","6,250","6,830"],"a":3,"inc":false,"unit":"9-5"},{"id":"gwallisa-2014-05-17-52","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":52,"q":"소방기본법령상 특수가연물에 관한 설명으로 옳은 것은?","c":["100킬로그램 이상의 면화류는 특수가연물로 분류된다.","800킬로그램 이상의 사류(絲類)는 특수가연물로 분류된다.","특수가연물을 저장 또는 취급하는 장소에는 품명ㆍ최대수량 및 화기취급의 금지표지를 설치해야 한다.","합성수지류에는 합성수지의 섬유ㆍ옷감ㆍ종이 및 실과 이들의 넝마와 부스러기가 포함된다."],"a":3,"inc":false,"unit":"3-2"},{"id":"gwallisa-2014-05-17-53","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":53,"q":"소방기본법을 위반하여 벌금에 처해지는 자는?","c":["화재경계지구 안의 소방대상물에 대한 소방특별조사를 거부ㆍ방해 또는 기피한 자","특수가연물의 저장 및 취급 기준을 위반한 자","화재경계지구에 대한 소방용수시설의 설치 명령을 위반한 자","시장지역에서 화재로 오인할 우려가 있는 연막소독을 하면서 관할소방서장에게 신고를 하지 아니하여 소방자동차를 출동하게 한 자"],"a":1,"inc":false,"unit":"3-2"},{"id":"gwallisa-2014-05-17-54","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":54,"q":"소방기본법령상 화재경계지구의 지정에 관한 설명으로 옳지 않은 것은?","c":["시ㆍ도지사는 도시의 건물 밀집지역 등 화재의 우려가 높거나 화재가 발생하는 경우로 인하여 피해가 클 것으로 예상되는 목조건물이 밀집한 지역을 화재경계지구로 지정할 수 있다.","시ㆍ도지사는 화재경계지구 안의 소방대상물의 위치ㆍ구조 및 설비 등에 대한 소방특별조사를 분기별 1회 이상 실시하여야 한다.","소방본부장 또는 소방서장은 화재경계지구 안의 관계인에 대하여 소방상 필요한 훈련 및 교육을 연 1회 이상 실시할 수 있다.","소방본부장 또는 소방서장은 소방특별조사를 한 결과 화재의 예방과 경계를 위하여 필요하다고 인정할 때에는 관계인에게 소방용수시설, 소화기구, 그 밖에 소방에 필요한 설비의 설치를 명할 수 있다."],"a":2,"inc":false,"unit":"4-5"},{"id":"gwallisa-2014-05-17-57","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":57,"q":"소방시설공사업법령상 하자보수 보증기간이 다른 소방시설은?","c":["피난기구","유도등","무선통신보조설비","옥외소화전설비"],"a":4,"inc":false,"unit":"8-7"},{"id":"gwallisa-2014-05-17-62","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":62,"q":"소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 소방안전관리자를 두어야 하는 특정소방대상물에 관한 설명으로 옳은 것은? (단, 공공기관의 소방안전관리에 관한 규정을 적용받는 특정소방대상물은 제외)","c":["층수에 상관없이 지상으로부터 높이가 100미터 이상인 것은 특급 소방안전관리대상물이다.","지하구는 2급 소방안전관리대상물이다.","가연성가스를 1천톤 이상 저장ㆍ취급하는 시설은 2급 소방안전관리대상물이다.","층수가 21층인 아파트는 1급 소방안전관리대상물이다."],"a":2,"inc":false,"unit":"3-1"},{"id":"gwallisa-2014-05-17-82","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":82,"q":"제3류 위험물에 관한 설명으로 옳지 않은 것은?","c":["황린은 공기와 접촉하면 자연발화할 수 있다.","칼륨, 나트륨은 등유, 경유 등에 넣어 보관한다.","지정수량 1/10을 초과하여 운반하는 경우, 제4류 위험물과 혼재할 수 없다.","알킬알루미늄은 운반용기 내용적의 90 % 이하로 수납하여야 한다."],"a":3,"inc":false,"unit":"1-1"},{"id":"gwallisa-2014-05-17-84","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":84,"q":"제5류 위험물에 관한 설명으로 옳지 않은 것은?","c":["불티ㆍ불꽃ㆍ고온체와의 접근이나 과열ㆍ충격 또는 마찰을 피해야 한다.","제조소의 게시판에 표시하는 주의사항은 “충격주의”이며 적색바탕에 백색문자로 기재한다.","운반용기의 외부에 표시하는 주의사항은 “화기엄금” 및 “충격주의”이다.","유기과산화물, 니트로화합물과 같은 자기반응성 물질은 제5류 위험물에 해당된다."],"a":2,"inc":false,"unit":"3-2"},{"id":"gwallisa-2014-05-17-86","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":86,"q":"디에틸에테르에 10 %-요오드화칼륨(KI) 용액을 첨가하였을 때 어떤 색상으로 변화하면 디에틸에테르 속에 과산화물이 생성되었다고 판정할 수 있는가?","c":["황색","청색","백색","흑색"],"a":1,"inc":false,"unit":"3-2"},{"id":"gwallisa-2014-05-17-89","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":89,"q":"위험물안전관리법령상 제조소의 환기설비 시설기준에 관한 설명으로 옳지 않은 것은?","c":["급기구는 해당 급기구가 설치된 실의 바닥면적 150m2 마다 1개 이상으로 하여야 한다.","환기구는 지붕 위 또는 지상 1m 이상의 높이에 설치하여야 한다.","바닥면적이 120m2 인 경우, 급기구의 크기를 600cm2 이상으로 하여야 한다.","급기구는 낮은 곳에 설치하고 가는 눈의 구리망 등으로 인화방지망을 설치하여야 한다."],"a":2,"inc":false,"unit":"7-8"},{"id":"gwallisa-2014-05-17-91","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":91,"q":"위험물안전관리법령상 제조소등의 시설 중 각종 턱에 관한 기준으로 옳지 않은 것은?","c":["액체위험물을 취급하는 제조소의 옥외설비는 바닥의 둘레에 높이 0.15m 이상의 턱을 설치하여야 한다.","판매취급소에서 위험물을 배합하는 실의 출입구 문턱 높이는 바닥 면으로부터 0.05m 이상이어야 한다.","옥외탱크저장소에서 옥외저장탱크 펌프실의 바닥 주위에는 높이 0.2m 이상의 턱을 만들어야 한다.","주유취급소의 펌프실 출입구에는 바닥으로부터 0.1m 이상의 턱을 설치하여야 한다."],"a":2,"inc":false,"unit":"3-9"},{"id":"gwallisa-2014-05-17-92","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":92,"q":"위험물안전관리법령상 제조소 내의 위험물을 취급하는 배관을 강관 이외의 재질로 하는 경우 사용할 수 없는 것은?","c":["폴리프로필렌","폴리우레탄","고밀도폴리에틸렌","유리섬유강화플라스틱"],"a":1,"inc":false,"unit":"1-23"},{"id":"gwallisa-2014-05-17-95","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":95,"q":"위험물안전관리법령상 옥내탱크저장소의 탱크전용실을 단층건물 외의 건축물에 설치할 수 없는 위험물은?","c":["적린","칼륨","경유","질산"],"a":2,"inc":false,"unit":"3-9"},{"id":"gwallisa-2014-05-17-96","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":96,"q":"위험물안전관리법령상 옥내저장소의 지붕 또는 천장에 관한 설명으로 옳지 않은 것은?","c":["황린만 저장하는 경우에는 지붕을 내화구조로 할 수 있다.","셀룰로이드만 저장하는 경우에는 불연재료로 된 천장을 설치할 수 있다.","할로겐간화합물만 저장하는 경우에는 지붕을 내화구조로 할 수 있다.","피크린산만 저장하는 경우에는 난연재료로 된 천장을 설치할 수 있다."],"a":1,"inc":false,"unit":"3-9"},{"id":"gwallisa-2014-05-17-97","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":97,"q":"위험물안전관리법령상 제조소 건축물의 외벽이 내화구조인 경우 2 소요단위에 해당하는 연면적은?","c":["100m2","150m2","200m2","300m2"],"a":3,"inc":false,"unit":"2-3"},{"id":"gwallisa-2014-05-17-101","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":101,"q":"화재안전기준상 전기실 및 전산실에 적응성이 있는 소화기구의 소화약제는?","c":["포소화약제","강화액소화약제","할로겐화합물 및 불활성기체소화약제","산알칼리소화약제"],"a":3,"inc":false,"unit":"4-5"},{"id":"gwallisa-2014-05-17-103","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":103,"q":"옥내소화전이 지상 29층에 2개, 지상 30층에 3개 설치되어 있는 지상 40층인 건축물에서 화재안전기준상 수원의 최소용량(m3)은? (단, 옥상수원 제외)","c":["7.8","15.6","23.4","39.0"],"a":2,"inc":false,"unit":"4-6"},{"id":"gwallisa-2014-05-17-105","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":105,"q":"화재조기진압용 스프링클러설비의 화재안전기준에 관한 설명으로 옳지 않은 것은?","c":["헤드 하나의 방호면적은 6.0m2 이상 9.3m2 이하로 한다.","교차배관은 가지배관 밑에 설치하고, 그 구경은 최소 40mm 이상으로 한다.","하향식 헤드의 반사판의 위치는 천장이나 반자 아래 125mm 이상 355mm 이하로 한다.","천장의 높이가 9.1m 이상 13.7m 이하인 경우 가지배관 사이의 거리는 2.4m 이상 3.7m 이하로 한다."],"a":4,"inc":false,"unit":"4-7"},{"id":"gwallisa-2014-05-17-106","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":106,"q":"물분무소화설비의 화재안전기준에 관한 설명으로 옳지 않은 것은?","c":["220kV 초과 275kV 이하인 전압의 전기기기가 있는 장소에 있어서는 전기기기와 물분무헤드 사이에 210cm 이상 거리를 두어야 한다.","물분무소화설비를 설치하는 차고 또는 주차장의 배수구에는 새어나온 기름을 모아 소화할수 있도록 길이 40m 이하마다 집수관ㆍ소화핏트 등 기름분리장치를 설치하여야 한다.","수원은 절연유 봉입 변압기에 있어서 바닥부분을 제외한 표면적을 합한 면적 1m2에 대하여 10ℓ/min로 20분간 방수할 수 있는 양 이상으로 하여야 한다.","운전시에 표면의 온도가 260℃ 이상으로 되는 등 직접 분무를 하는 경우 그 부분에 손상을 입힐 우려가 있는 기계장치 등이 있는 장소에는 물분무헤드를 설치하지 아니할수 있다."],"a":1,"inc":false,"unit":"4-10"},{"id":"gwallisa-2014-05-17-107","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":107,"q":"바닥면적 300m2인 주차장에 호스릴포소화설비를 설치하는 경우 화재안전기준상 포소화약제의 최소저장량(ℓ)은? (단, 호스접결구는 8개, 약제의 사용농도는 3%이다.)","c":["800","900","1,000","1,100"],"a":2,"inc":false,"unit":"5-1"},{"id":"gwallisa-2014-05-17-108","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":108,"q":"이산화탄소소화설비의 화재안전기준에 관한 설명으로 옳은 것은?","c":["저압식 저장용기의 충전비는 1.5 이상 1.9 이하로 한다.","소화약제의 저장용기는 온도가 50℃ 이하인 곳에 설치한다.","셀룰로이드제품 등 자기연소성물질을 저장ㆍ취급하는 장소에는 분사헤드를 설치하여야한다.","음향경보장치는 소화약제의 방사개시 후 1분 이상 경보를 계속할 수 있는 것으로 설치하여야 한다."],"a":4,"inc":false,"unit":"6-2"},{"id":"gwallisa-2014-05-17-109","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":109,"q":"화재시 연소면이 1면에 한정되고 가연물이 비산할 우려가 없는 표면적 100m2인 방호대상물에 국소방출방식 할로겐화합물 소화약제를 적용할 경우, 할론 1301의 최소저장량(kg)은?","c":["748","850","950","968"],"a":2,"inc":false,"unit":"6-3"},{"id":"gwallisa-2014-05-17-111","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":111,"q":"분말소화약제의 화재안전기준상 소화약제 1kg당 저장용기의 내용적(ℓ)으로 옳은 것은?","c":["제1종 분말: 0.8","제2종 분말: 0.9","제3종 분말: 0.9","제4종 분말: 1.0"],"a":1,"inc":false,"unit":"6-1"},{"id":"gwallisa-2014-05-17-112","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":112,"q":"자동화재탐지설비의 화재안전기준상 감지기의 부착높이가 8m 이상 15m 미만인 경우 설치하여야 하는 감지기가 아닌 것은?","c":["불꽃감지기","이온화식2종감지기","차동식스포트형감지기","광전식스포트형1종감지기"],"a":3,"inc":false,"unit":"8-5"},{"id":"gwallisa-2014-05-17-113","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":113,"q":"소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 자동화재속보설비를 설치하여야 하는 특정소방대상물에 해당하지 않는 것은?","c":["공장으로서 바닥면적이 1천5백m2 이상인 층이 있는 것","창고시설로서 바닥면적이 1천5백m2 이상인 층이 있는 것","문화재보호법상 보물로 지정된 목조건축물","숙박시설이 없는 청소년수련시설"],"a":4,"inc":false,"unit":"9-9"},{"id":"gwallisa-2014-05-17-116","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":116,"q":"화재안전기준상 각 층의 바닥면적이 3,000m2인 판매시설에서 층마다 설치하여야 하는 피난기구의 최소개수는?","c":["3","4","5","6"],"a":2,"inc":false,"unit":"7-3"},{"id":"gwallisa-2014-05-17-118","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":118,"q":"비상조명등의 화재안전기준에 관한 설명으로 옳은 것은?","c":["의료시설의 거실에는 비상조명등을 설치하지 아니한다.","휴대용비상조명등의 설치높이는 바닥으로부터 0.5m 이상 1.0m 이하의 높이에 설치 하여야 한다.","거실의 각 부분으로부터 하나의 출입구에 이르는 수평거리가 15m 이내인 부분에는 비상조명등을 설치하지 아니한다.","지하층을 포함한 층수가 11층 이상의 층은 비상조명등을 60분 이상 유효하게 작동시킬수 있는 용량으로 하여야 한다."],"a":1,"inc":false,"unit":"8-7"},{"id":"gwallisa-2014-05-17-121","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":121,"q":"지표면에서 최상층 방수구의 높이가 70m 이상인 특정소방대상물에 설치하는 연결송수관설비의 가압송수장치에 관한 화재안전기준으로 옳은 것은?","c":["충압펌프가 기동이 된 경우에는 자동으로 정지되지 아니하도록 하여야 한다.","펌프의 토출량은 계단식 아파트의 경우에는 1,200/min 이상이 되는 것으로 하여야 한다.","펌프의 양정은 최상층에 설치된 노즐선단의 압력이 0.25 MPa 이상의 압력이 되도록하여야 한다.","펌프의 토출측에는 압력계를 체크밸브 이후에 펌프토출측 플랜지에서 가까운 곳에 설치하여야 한다."],"a":2,"inc":false,"unit":"4-6"},{"id":"gwallisa-2014-05-17-123","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":123,"q":"비상콘센트설비의 화재안전기준상 전원회로 설치기준으로 옳지 않은 것은?","c":["하나의 전용회로에 설치하는 비상콘센트는 10개 이하로 할 것","콘센트마다 플러그접속 차단기를 설치하여야 하며, 충전부가 노출되지 아니하도록 할 것","전원으로부터 각 층의 비상콘센트에 분기되는 경우에는 분기배선용 차단기를 보호함 안에 설치할 것","비상콘센트설비의 전원회로는 단상교류 220V인 것으로서, 그 공급용량은 1.5 kVA이상인 것으로 할 것"],"a":2,"inc":false,"unit":"9-9"},{"id":"gwallisa-2014-05-17-124","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2014-05-17","num":124,"q":"무선통신보조설비의 화재안전기준에 관한 설명으로 옳은 것은?","c":["동축케이블의 임피던스는 45Ω으로 설치하여야 한다.","증폭기의 전면에는 주 회로의 전원이 정상인지의 여부를 표시할 수 있는 표시등 및 전류계를 설치하여야 한다.","지상에 설치하는 접속단자는 보행거리 300m 이내마다 설치하고, 다른 용도로 사용되는 접속단자에서 1.5m 이상의 거리를 두어야 한다.","“분배기”란 신호의 전송로가 분기되는 장소에 설치하는 것으로 임피던스 매칭과 신호균등분배를 위해 사용하는 장치를 말한다."],"a":4,"inc":false,"unit":"8-7"},{"id":"gwallisa-2015-05-02-1","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":1,"q":"연소에 관한 설명으로 옳지 않은 것은?","c":["화학적 활성도가 큰 가연물일수록 연소가 용이하다.","조연성 가스는 가연물이 탈 수 있도록 도와주는 기체이다.","열전도율이 작은 가연물일수록 연소가 용이하다.","흡착열은 가연물의 산화반응으로 발열 축적된 것이다."],"a":4,"inc":false,"unit":"1-7"},{"id":"gwallisa-2015-05-02-3","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":3,"q":"화재의 종류에 관한 설명으로 옳지 않은 것은?","c":["산소와 친화력이 강한 물질의 화재로 연기가 발생하고, 연소 후 재를 남기면 A급 화재이다.","유류에서 발생한 증기가 공기와 혼합하여 점화되면 B급 화재이다.","통전 중인 전기다리미에서 발생되는 화재는 C급 화재이다.","칼륨이나 나트륨 등 금속류에 의한 화재는 K급 화재이다."],"a":4,"inc":false,"unit":"1-17"},{"id":"gwallisa-2015-05-02-4","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":4,"q":"인화점과 발화점에 관한 설명으로 옳지 않은 것은?","c":["인화점은 가연성 액체의 위험성 기준이 된다.","발화점은 발열량과 열전도율이 클 때 낮아진다.","인화점은 점화원에 의하여 연소를 시작할 수 있는 최저온도이다.","고체 가연물의 발화점은 가열된 공기의 유량, 가열속도에 따라 달라질 수 있다."],"a":2,"inc":false,"unit":"1-1"},{"id":"gwallisa-2015-05-02-5","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":5,"q":"소화방법에 관한 설명으로 옳지 않은 것은?","c":["부촉매소화: 이산화탄소를 화원에 뿌렸다.","냉각소화: 가연물질에 물을 뿌려 연소온도를 낮추었다.","제거소화: 산불화재 시 주위 산림을 벌채하였다.","질식소화: 불연성 기체를 투입하여 산소농도를 떨어 뜨렸다."],"a":1,"inc":false,"unit":"6-2"},{"id":"gwallisa-2015-05-02-6","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":6,"q":"이산화탄소 1.2kg을 18℃ 대기중(1 atm)에 방출하면 몇 [ℓ]의 가스체로 변하는가? (기체상수가 0.082 [ℓ·atm/mol·K]인 이상기체이다. 단, 소수점 이하는 둘째자리에서 반올림함)","c":["0.6","40.3","610.5","650.8"],"a":4,"inc":false,"unit":"6-2"},{"id":"gwallisa-2015-05-02-7","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":7,"q":"폭발범위(연소범위)에 관한 설명으로 옳지 않은 것은?","c":["불활성 가스를 첨가할수록 연소범위는 넓어진다.","온도가 높아질수록 폭발범위는 넓어진다.","혼합기를 이루는 공기의 산소농도가 높을수록 연소범위는 넓어진다.","가연물의 양과 유동상태 및 방출속도 등에 따라 영향을 받는다."],"a":1,"inc":false,"unit":"1-3"},{"id":"gwallisa-2015-05-02-11","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":11,"q":"탄화수소계 가연물의 완전연소식으로 옳은 것은?","c":["에탄: C2H6 + 3O2 → 2CO2 + 3H2O","프로판: C3H8 + 5O2 → 3CO2 + 4H2O","부탄: C4H10 + 6O2 → 4CO2 + 5H2O","메탄: CH4 + O2 → CO2 + 2H2O"],"a":2,"inc":false,"unit":"1-5"},{"id":"gwallisa-2015-05-02-12","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":12,"q":"연소생성물 중 발생하는 연소가스에 관한 설명으로 옳지 않은 것은?","c":["일산화탄소는 가연물이 불완전 연소할 때 발생하는 것으로 유독성기체이며 연소가 가능한 물질이다.","시안화수소는 모직, 견직물 등의 불완전연소 시 발생하며 독성이 커서 인체에 치명적이다.","염화수소는 폴리염화비닐 등과 같이 염소가 함유된 수지류가 탈 때 주로 생성되며 금속에 대한 강한 부식성이 있다.","황화수소는 무색ㆍ무취의 기체이며 인화성과 독성이 강하여 살충제의 원료로 사용된다."],"a":4,"inc":false,"unit":"1-5"},{"id":"gwallisa-2015-05-02-14","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":14,"q":"건축물 내의 연기유동에 관한 설명으로 옳지 않은 것은?","c":["화재실의 내부온도가 상승하면 중성대의 위치는 높아지며 외부로부터의 공기유입이 많아져서 연기의 이동이 활발하게 진행된다.","고층 건축물에서 연기유동을 일으키는 주요한 요인으로는 온도에 의한 기체 팽창, 외부 풍압의 영향 등이 있다.","연기층 두께 증가속도는 연소속도에 좌우되며 연기 유동속도는 수평방향일 경우 0.5∼1 m/s, 계단실등 수직방향일 경우 3∼5 m/s이다.","연기는 부력에 의해 수직 상승하면서 확산되며 천장에서 꺾인 후 천장면을 따라 흐르다 벽과 같은 수직 장애물을 만날 경우 흐름이 정지되어 연기층을 형성한다."],"a":1,"inc":false,"unit":"1-15"},{"id":"gwallisa-2015-05-02-17","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":17,"q":"건축법에서 규정하는 방화구획에 관한 설명으로 옳지 않은 것은?","c":["안전구획의 크기와 배치에 대한 사항이 고려되어야 한다.","내화구조로 된 바닥, 벽 및 갑종방화문(자동방화셔터 포함)으로 구획해야 한다.","일체형셔터를 포함한 자동방화셔터는 내화시험결과 비차열 1시간 성능을 요구한다.","일체형셔터를 포함한 자동방화셔터는 피난상 유효한 갑종방화문으로부터 5 m 이내에 설치한다."],"a":4,"inc":false,"unit":"2-1"},{"id":"gwallisa-2015-05-02-24","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":24,"q":"직통계단 및 피난계단에 관한 설명으로 옳지 않은 것은?","c":["11층 이상인 공동주택의 직통계단은 거실의 각 부분으로부터 계단에 이르는 보행 거리가 60 m 이하로 설치한다.","5층 이상 판매시설 용도의 층에 설치되는 직통계단은 1개 이상을 특별피난계단으로 설치한다.","지하층으로서 거실의 바닥면적의 합계가 200m2 이상인 것은 직통계단을 2개 이상 설치한다.","주요구조부가 내화구조인 5층 이상인 층의 바닥면적의 합계가 200m2 이하인 경우에는 피난계단 또는 특별피난계단의 설치가 면제된다."],"a":1,"inc":false,"unit":"7-2"},{"id":"gwallisa-2015-05-02-29","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":29,"q":"다시-바이스바하(Darcy-Weisbach) 공식에서 수두손실에 관한 설명으로 옳지 않은 것은?","c":["관 길이에 비례한다.","마찰손실계수에 비례한다.","유속의 제곱에 비례한다.","중력가속도에 비례한다."],"a":4,"inc":false,"unit":"14-2"},{"id":"gwallisa-2015-05-02-31","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":31,"q":"저수조가 소화펌프보다 아래에 있으며, 펌프의 토출유량 520ℓ/min, 전양정 64m, 효율 55%, 전달계수 1.2 인 경우의 펌프의 축동력(kW)은?","c":["5.4","9.9","11.8","18.4"],"a":2,"inc":false,"unit":"4-4"},{"id":"gwallisa-2015-05-02-34","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":34,"q":"부촉매 효과로 화재를 소화하는 소화약제가 아닌 것은?","c":["할론 1301 소화약제","강화액 소화약제","이산화탄소 소화약제","제2종분말 소화약제"],"a":3,"inc":false,"unit":"6-4"},{"id":"gwallisa-2015-05-02-35","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":35,"q":"화재안전기준상 가연성 액체 또는 가연성 가스의 소화에 필요한 이산화탄소 소화약제의 설계농도에 관한 기준으로 옳지 않은 것은?","c":["아세틸렌: 66 %","에틸렌: 49 %","일산화탄소: 64 %","석탄가스, 천연가스: 75 %"],"a":4,"inc":false,"unit":"6-2"},{"id":"gwallisa-2015-05-02-36","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":36,"q":"강화액 소화약제에 관한 설명으로 옳지 않은 것은?","c":["수소이온지수(pH)는 5.5∼7.5이고, 응고점은 영하 16℃∼20℃ 이다.","물에 탄산칼륨, 황산암모늄, 인산암모늄 및 침투제 등을 첨가한 것이다.","용기 내부를 크롬 도금 또는 내식성 도료로 처리하여 저장한다.","사람의 피부에 닿으면 피부염, 피부모공 손상 등을 야기할 수 있다."],"a":1,"inc":false,"unit":"6-4"},{"id":"gwallisa-2015-05-02-37","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":37,"q":"분말소화약제에 요구되는 이상적 조건으로 옳지 않은 것은?","c":["분체의 안식각이 클수록 유동성이 좋아진다.","시간 경과에 따른 안정성이 높아야 한다.","분말소화약제로 사용되기 위한 겉보기비중 값은 0.82g/mL 이상 이어야 한다.","수분 침투에 대한 내습성이 높아야 한다."],"a":1,"inc":false,"unit":"6-1"},{"id":"gwallisa-2015-05-02-39","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":39,"q":"산ㆍ알칼리 소화기에 사용되는 소화약제의 주성분은?","c":["NH4H2PO4 - 진한 H2SO4","KHCO3 - 진한 H2SO4","Al2(SO4)3 - 진한 H2SO4","NaHCO3 - 진한 H2SO4"],"a":4,"inc":false,"unit":"4-5"},{"id":"gwallisa-2015-05-02-43","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":43,"q":"자속변화에 의한 유도기전력의 크기를 결정하는 법칙은?","c":["패러데이의 전자유도법칙","플레밍의 왼손법칙","렌츠의 법칙","플레밍의 오른손법칙"],"a":1,"inc":false,"unit":"9-1"},{"id":"gwallisa-2015-05-02-44","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":44,"q":"어떤 회로의 유효전력이 70W, 무효전력이 50Var 이면 역률은 약 얼마인가?","c":["0.58","0.71","0.81","0.98"],"a":3,"inc":false,"unit":"9-2"},{"id":"gwallisa-2015-05-02-48","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":48,"q":"소방설비 배선에서 내화배선 또는 내열배선으로 설치가 가능한 것은?","c":["옥내소화전설비의 비상전원에서 동력제어반 및 가압송수장치에 이르는 전원회로의 배선","비상콘센트설비 전원회로의 배선","자동화재탐지설비 전원회로의 배선","스프링클러설비의 상용전원으로부터 동력제어반에 이르는 배선"],"a":4,"inc":false,"unit":"8-6"},{"id":"gwallisa-2015-05-02-54","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":54,"q":"소방기본법령상 불을 사용하는 설비 등의 관리 기준과 특수가연물의 저장ㆍ취급 기준에 관한 설명으로 옳은 것은?","c":["불꽃을 사용하는 용접 또는 용단 작업자로부터 반경 10m 이내에 소화기를 갖추어야 한다.","특수가연물을 저장 또는 취급하는 장소에는 품명ㆍ최대수량 및 화기취급의 금지표지를 설치하여야 한다.","석탄ㆍ목탄류를 발전용으로 저장하는 경우에는 반드시 품명별로 구분하여 쌓고, 쌓는 부분의 바닥면적 사이는 1미터 이상이 되도록 하여야 한다.","화재예방을 위하여 불을 사용할 때 지켜야 하는 사항은 소방본부장이 정한다."],"a":2,"inc":false,"unit":"3-2"},{"id":"gwallisa-2015-05-02-55","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":55,"q":"소방시설공사업법령상 감리업자가 소방공사를 감리할 때 반드시 수행하여야 할 업무가 아닌 것은?","c":["완공된 소방시설등의 성능시험","공사업자가 한 소방시설등의 시공이 설계도서와 화재안전기준에 맞는지에 대한 지도ㆍ감독","소방시설등 설계 변경 사항의 도면수정","공사업자가 작성한 시공 상세 도면의 적합성 검토"],"a":3,"inc":false,"unit":"6-5"},{"id":"gwallisa-2015-05-02-57","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":57,"q":"소방시설공사업법령에 관한 설명으로 옳지 않은 것은?","c":["감리업자가 소방공사의 감리를 마쳤을 때에는 소방공사감리 결과보고(통보)서에 소방시설공사 완공검사신청서, 소방시설 성능시험조사표, 소방공사 감리일지를 첨부하여 소방본부장 또는 소방서장에게 알려야 한다.","특정소방대상물의 관계인은 공사감리자가 변경된 경우에는 변경일부터 30일 이내에 소방공사감리자 변경신고서를 소방본부장 또는 소방서장에게 제출하여야 한다.","소방공사감리업자는 감리원을 소방공사감리현장에 배치하는 경우에는 소방공사감리원 배치통보서를 감리원 배치일부터 7일 이내에 소방본부장 또는 소방서장에게 알려야한다.","소방시설공사업자는 해당 소방시설공사의 착공 전까지 소방시설공사 착공(변경)신고서를 소방본부장 또는 소방서장에게 신고하여야 한다."],"a":1,"inc":false,"unit":"6-5"},{"id":"gwallisa-2015-05-02-62","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":62,"q":"소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 특정소방대상물의 관계인이 특정소방대상물의 규모ㆍ용도 및 수용인원 등을 고려하여 갖추어야 하는 소방시설에 관한 설명으로 옳지 않은 것은?","c":["지하가 중 터널로서 길이가 1천m 이상인 터널에는 옥내소화전설비를 설치하여야 한다.","판매시설로서 바닥면적의 합계가 5천m2 이상인 경우에는 모든 층에 스프링클러설비를 설치하여야 한다.","위락시설로서 연면적 600m2 이상인 경우 자동화재탐지설비를 설치하여야 한다.","지하층을 포함하는 층수가 5층 이상인 관광호텔에는 방열복, 인공소생기 및 공기 호흡기를 설치하여야 한다."],"a":4,"inc":false,"unit":"4-6"},{"id":"gwallisa-2015-05-02-64","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":64,"q":"소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 소방시설별 장비기준에서 절연 저항계의 최고전압과 최소눈금의 연결이 옳은 것은?(관련 규정 개정전 문제로 여기서는 기존 정답인 3번을 누르면 정답 처리됩니다. 자세한 내용은 해설을 참고하세요.)","c":["DC 250 V 이상 - 0.1 MΩ 이하","DC 250 V 이상 - 0.2 MΩ 이하","DC 500 V 이상 - 0.1 MΩ 이하","DC 500 V 이상 - 0.2 MΩ 이하"],"a":3,"inc":false,"unit":"9-8"},{"id":"gwallisa-2015-05-02-70","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":70,"q":"위험물안전관리법령상 정기점검의 대상인 제조소등에 해당하지 않는 것은?","c":["지하탱크저장소","이동탱크저장소","간이탱크저장소","암반탱크저장소"],"a":3,"inc":false,"unit":"3-9"},{"id":"gwallisa-2015-05-02-71","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":71,"q":"위험물안전관리법령상 관계인이 예방규정을 정하여야 하는 제조소등이 아닌 것은?","c":["지정수량의 100배의 위험물을 저장하는 옥외저장소","지정수량의 10배의 위험물을 취급하는 제조소","지정수량의 100배의 위험물을 저장하는 옥외탱크저장소","지정수량의 150배의 위험물을 저장하는 옥내저장소"],"a":3,"inc":false,"unit":"3-9"},{"id":"gwallisa-2015-05-02-72","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":72,"q":"다중이용업소의 안전관리에 관한 특별법령상 다중이용업소의 영업장에 설치ㆍ유지하여야 하는 안전시설 등에 관한 설명으로 옳지 않은 것은?","c":["밀폐구조의 영업장에는 간이스프링클러설비를 설치하여야 한다.","노래반주기 등 영상음향장치를 사용하는 영업장에는 자동화재탐지설비를 설치하여야 한다.","구획된 실이 있는 노래연습장업의 영업장에는 영업장 내부 피난통로를 설치하여야 한다.","피난유도선은 모든 다중이용업소의 영업장에 설치하여야 한다."],"a":4,"inc":false,"unit":"4-7"},{"id":"gwallisa-2015-05-02-79","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":79,"q":"제5류 위험물에 관한 설명으로 옳지 않은 것은?","c":["외부의 산소 없이도 자기연소하고 연소속도가 빠르다.","니트로화합물은 니트로기가 많을수록 분해가 용이하다.","지정수량 이상의 제5류 위험물 운반ㆍ적재 시 제2류, 제4류, 제6류 위험물과 혼재가 가능하다.","일반적으로 다량의 물을 사용하여 냉각소화가 가능하다."],"a":3,"inc":false,"unit":"1-10"},{"id":"gwallisa-2015-05-02-80","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":80,"q":"제2류 위험물 마그네슘(Mg)에 관한 설명으로 옳지 않은 것은?","c":["공기 중 습기와 서서히 반응하여 열이 축적되면 자연발화의 위험성이 있다.","미세한 분말은 밀폐공간 내 부유(浮游)하면 분진폭발의 위험이 있다.","이산화탄소(CO2) 중에서 연소한다.","산이나 뜨거운 물에 반응하여 메탄(CH4)가스를 발생시킨다."],"a":4,"inc":false,"unit":"1-1"},{"id":"gwallisa-2015-05-02-81","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":81,"q":"제2류 위험물의 특성에 관한 설명으로 옳은 것은?","c":["철분은 절삭유와 같은 기름이 묻은 상태로 장기간 방치하면 자연발화하기 쉽다.","유황은 물이나 알코올에 잘 녹으며 고온에서 탄소와 반응하면 이황화탄소가 발생한다.","삼황화린은 찬 물에 잘 녹고 조해성이 있으며 연소 시 유독한 오산화인과 이산화황을 발생한다.","적린은 상온에서 공기 중에 방치하면 자연발화를 일으키므로 이를 방지하기 위하여 물속에 보관하여야 한다."],"a":1,"inc":false,"unit":"4-5"},{"id":"gwallisa-2015-05-02-83","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":83,"q":"옥내저장소에 아세톤 18ℓ 용기 100개와 초산 200ℓ 용기 10개를 저장하고 있다면이 저장소에는 지정수량의 몇 배를 저장하고 있는가? (단, 용기는 가득 차있다고 가정한다.)","c":["5","5.5","7","9.5"],"a":2,"inc":false,"unit":"3-9"},{"id":"gwallisa-2015-05-02-84","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":84,"q":"물과 반응하여 가연성 가스를 발생하는 위험물만으로 나열된 것은?","c":["CaC2, LiAlH4, Al4C3","K2O2, NaH, Zn(ClO3)2","Ba(ClO3)2, K2O2, CaC2","Zn(ClO3)2, Ba(ClO3)2, Al4C3"],"a":1,"inc":false,"unit":"3-1"},{"id":"gwallisa-2015-05-02-89","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":89,"q":"위험물안전관리법령상 제1류 위험물 중 알칼리금속의 과산화물 운반용기 외부에 표시해야 할 주의사항으로 옳지 않은 것은? (단, 국제해상위험물규칙(IMDG Code)에 정한 기준 또는 국민안전처장관이 정하여 고시하는 기준에 적합한 표시를 한 경우는 제외한다.)","c":["물기엄금","화기ㆍ충격주의","공기접촉엄금","가연물접촉주의"],"a":3,"inc":false,"unit":"3-2"},{"id":"gwallisa-2015-05-02-90","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":90,"q":"위험물안전관리법령상 위험물제조소의 채광 및 조명설비에 관한 기준으로 옳지 않는 것은?","c":["전선은 내화ㆍ내열전선으로 할 것","점멸스위치는 출입구 바깥부분에 설치할 것(다만, 스위치의 스파크로 인한 화재ㆍ폭발의 우려가 없을 경우에는 그러하지 아니한다.)","가연성가스 등이 체류할 우려가 있는 장소의 조명등은 방폭등으로 할 것","채광설비는 불연재료로 하고 연소의 우려가 없는 장소에 설치하되 채광 면적을 최대로 할 것"],"a":4,"inc":false,"unit":"3-1"},{"id":"gwallisa-2015-05-02-93","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":93,"q":"위험물안전관리법령상 제조소등의 소화난이도 I 등급 중 유황만을 저장취급하는 옥내탱크저장소에 설치하는 소화설비는?","c":["물분무소화설비","강화액소화설비","이산화탄소소화설비","청정소화약제소화설비"],"a":1,"inc":false,"unit":"3-9"},{"id":"gwallisa-2015-05-02-94","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":94,"q":"위험물안전관리법령상 옥내탱크저장소의 탱크전용실에 하나의 탱크를 설치하고 등유를 저장하려고 한다. 저장 할 수 있는 최대용량과 그 지정수량 배수는?","c":["20,000ℓ - 20배","20,000ℓ - 40배","40,000ℓ - 20배","40,000ℓ - 40배"],"a":1,"inc":false,"unit":"3-9"},{"id":"gwallisa-2015-05-02-95","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":95,"q":"위험물안전관리법령상 지하탱크저장소 하나의 전용실에 경유 20,000 ℓ와 휘발유 10,000 ℓ의 저장탱크를 인접해 설치하는 경우 탱크 상호간의 거리는 최소 몇 m를 유지하여야 하는가? (단, 지하저장탱크 사이에 탱크전용실의 벽이나 두께 20cm이상의 콘크리트 구조물이 있는 경우는 제외)","c":["0.3","0.5","0.6","1"],"a":2,"inc":false,"unit":"3-9"},{"id":"gwallisa-2015-05-02-96","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":96,"q":"위험물안전관리법령상 간이탱크저장소 설치 기준에 관한 내용으로 옳은 것은?","c":["간이저장탱크의 용량은 1,000ℓ 이하이어야 한다.","하나의 간이탱크저장소에 설치하는 간이저장탱크 수는 5이하로 한다.","간이저장탱크는 70 kPa의 압력으로 10분간의 수압시험을 실시하여 새거나 변형되지 아니하여야 한다.","간이저장탱크를 옥외에 설치하는 경우 그 탱크 주위에 너비 0.5m 이상의 공지를 둔다."],"a":3,"inc":false,"unit":"3-9"},{"id":"gwallisa-2015-05-02-101","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":101,"q":"바닥면적 530m2 특정소방대상물인 장례식장에 설치할 소화기구의 최소 능력 단위는? (단, 주요구조부는 비내화구조임)","c":["3","6","8","11"],"a":4,"inc":false,"unit":"2-3"},{"id":"gwallisa-2015-05-02-103","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":103,"q":"표시등의 성능인증 및 제품검사의 기술기준상 옥내소화전의 표시등은 사용전압의 몇 %인 전압을 24시간 연속하여 가하는 경우 단선이 발생하지 않아야 하는가?","c":["130","140","150","160"],"a":1,"inc":false,"unit":"4-6"},{"id":"gwallisa-2015-05-02-106","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":106,"q":"바닥면적이 30m2인 변압기실에 물분무소화설비를 설치하려고 한다. 바닥부분을 제외한 절연유 봉입 변압기의 표면적을 합한 면적이 3m2일 때, 수원의 최소 저수량(ℓ)은?","c":["450","600","900","1,200"],"a":2,"inc":false,"unit":"4-10"},{"id":"gwallisa-2015-05-02-107","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":107,"q":"펌프의 토출관과 흡입관 사이의 배관도중에 설치한 흡입기에 펌프에서 토출된 물의 일부를 보내고, 농도 조정밸브에서 조정된 포 소화약제의 필요량을 포 소화약제 탱크에서 펌프 흡입측으로 보내어 이를 혼합하는 방식은?","c":["라인 푸로포셔너방식","프레져 푸로포셔너방식","펌프 푸로포셔너방식","프레져사이드 푸로포셔너방식"],"a":3,"inc":false,"unit":"5-1"},{"id":"gwallisa-2015-05-02-108","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":108,"q":"이산화탄소소화설비의 자동식 기동장치 중 가스압력식 기동장치의 설치기준으로 옳지 않은 것은?","c":["기동용가스용기 및 해당 용기에 사용하는 밸브는 25 MPa 이상의 압력에 견딜 수 있는 것으로 할 것","기동용가스용기에는 내압시험압력의 0.8배부터 내압시험압력 이하에서 작동하는 안전장치를 설치할 것","기동용가스용기의 용적은 5ℓ 이상으로 하고, 해당 용기에 저장하는 비활성기체는 5.0MPa 이상(21 ℃ 기준)의 압력으로 충전할 것","기동용가스용기에는 충전여부를 확인할 수 있는 압력게이지를 설치할 것"],"a":3,"inc":false,"unit":"6-2"},{"id":"gwallisa-2015-05-02-109","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":109,"q":"할로겐화합물소화설비의 화재안전기준상 분사헤드의 방사압력의 최소기준으로 옳은 것은? (순서대로 할론 1301, 할론 1211, 할론 2402)","c":["0.9MPa 이상, 0.2MPa 이상, 0.1MPa 이상","0.8MPa 이상, 0.1MPa 이상, 0.3MPa 이상","0.7MPa 이상, 0.3MPa 이상, 0.4MPa 이상","1.0MPa 이상, 0.2MPa 이상, 0.2MPa 이상"],"a":1,"inc":false,"unit":"6-3"},{"id":"gwallisa-2015-05-02-110","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":110,"q":"청정소화약제소화설비의 화재안전기준상 사람이 상주하는 곳에 설치하는 청정 소화약제의 최대허용설계농도로 옳은 것은?","c":["HCFC BLEND A: 11 %","IG-100: 45 %","HFC-23: 55 %","HFC-227ea: 10.5 %"],"a":4,"inc":false,"unit":"6-3"},{"id":"gwallisa-2015-05-02-111","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":111,"q":"방호구역이 120m3인 공간에 전역방출방식의 분말소화설비를 설치할 때 최소 소화약제 저장량(kg)은? (단, 소화약제는 제2종 분말이며, 개구부의 면적은 2m2로 자동폐쇄장치가 설치되어 있지 않음)","c":["35.7","48.6","56.3","61.8"],"a":2,"inc":false,"unit":"6-1"},{"id":"gwallisa-2015-05-02-112","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":112,"q":"자동화재탐지설비 및 시각경보장치의 화재안전기준상의 내용으로 옳지 않은 것은?","c":["외기에 면하여 상시 개방된 부분이 있는 차고에 있어서는 외기에 면하는 각 부분으로부터 5m 미만의 범위안에 있는 부분은 경계구역의 면적에 산입하지 아니한다.","4층 이상의 특정소방대상물에는 발신기와 전화통화가 가능한 수신기를 설치할 것","중계기는 수신기에서 직접 감지기회로의 도통시험을 행하지 아니하는 것에 있어서는 수신기와 감지기 사이에 설치할 것","열전대식 차동식분포형감지기는 하나의 검출기에 접속하는 감지부는 2개 이상 15개 이하가 되도록 할 것"],"a":4,"inc":false,"unit":"8-7"},{"id":"gwallisa-2015-05-02-113","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":113,"q":"자동화재속보설비에 관한 설명으로 옳지 않은 것은?","c":["노유자 생활시설은 자동화재속보설비를 설치하여야 한다.","문화재에 설치하는 자동화재속보설비는 속보기에 감지기를 직접 연결하는 방식(자동화재탐지설비 1개의 경계구역에 한한다)으로 할 수 있다.","속보기는 연동 또는 수동 작동에 의한 다이얼링 후 소방관서와 전화접속이 이루어지지 않는 경우에는 최초 다이얼링을 포함하여 3회 이상 반복적으로 접속을 위한 다이얼링이 이루어져야 한다.","속보기는 음성속보방식 외에 데이터 또는 코드전송방식 등을 이용한 속보기능을 부가로 설치할 수 있다."],"a":3,"inc":false,"unit":"9-9"},{"id":"gwallisa-2015-05-02-116","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":116,"q":"피난기구의 화재안전기준상 피난기구의 설치기준으로 옳은 것은?","c":["층마다 설치하되, 노유자시설로 사용되는 층에 있어서는 그 층의 바닥면적 500m2마다 1개 이상 설치할 것","층마다 설치하되, 위락시설로 사용되는 층에 있어서는 그 층의 바닥면적 1,000m2마다 1개 이상 설치할 것","층마다 설치하되, 계단실형 아파트에 있어서는 각 세대마다, 그 밖의 용도의 층에 있어서는 그 층의 바닥면적 1,200m2마다 1개 이상 설치할 것","숙박시설(휴양콘도미니엄을 제외한다)의 경우에는 추가로 객실마다 완강기 또는 하나 이상의 간이완강기를 설치할 것"],"a":1,"inc":false,"unit":"7-3"},{"id":"gwallisa-2015-05-02-120","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":120,"q":"연결송수관설비의 설치기준으로 옳지 않은 것은?","c":["건식연결송수관설비의 송수구 부근의 자동배수밸브 및 체크밸브는 송수구ㆍ체크밸브ㆍ자동배수밸브 순으로 설치할 것","방수기구함은 피난층과 가장 가까운 층을 기준으로 3개층마다 설치하되, 그 층의 방수구마다 보행거리 5m 이내에 설치할 것","지표면에서 최상층 방수구의 높이가 70m 이상의 특정소방대상물에는 연결송수관 설비의 가압송수장치를 설치하여야 한다.","11층 이상의 아파트의 용도로 사용되는 층에 설치하는 방수구는 단구형으로 할 수 있다."],"a":1,"inc":false,"unit":"4-6"},{"id":"gwallisa-2015-05-02-122","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":122,"q":"비상콘센트설비의 화재안전기준상 전원회로의 설치기준으로 옳지 않은 것은?","c":["비상콘센트설비의 전원회로는 단상교류 220 V인 것으로서, 그 공급용량은 1.5 kVA 이상인 것으로 할 것","전원회로는 각층에 2 이상이 되도록 설치할 것(다만, 설치하여야 할 층의 비상콘센트가 1개인 때에는 하나의 회로로 할 수 있다.)","비상콘센트용의 풀박스 등은 방청도장을 한 것으로서, 두께 1.6mm 이상의 철판으로 할 것","하나의 전용회로에 설치하는 비상콘센트는 15개 이하로 할 것"],"a":4,"inc":false,"unit":"9-9"},{"id":"gwallisa-2015-05-02-123","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2015-05-02","num":123,"q":"무선통신보조설비의 설치기준으로 옳지 않은 것은?","c":["누설동축케이블의 끝부분에는 무반사 종단저항을 견고하게 설치할 것","분배기ㆍ분파기 및 혼합기 등의 임피던스는 100Ω의 것으로 할 것","증폭기에는 비상전원이 부착된 것으로 하고 해당 비상전원 용량은 무선통신보조설비를 유효하게 30분 이상 작동시킬 수 있는 것으로 할 것","누설동축케이블은 금속판 등에 따라 전파의 복사 또는 특성이 현저하게 저하되지 아니하는 위치에 설치할 것"],"a":2,"inc":false,"unit":"8-7"},{"id":"gwallisa-2016-04-30-1","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":1,"q":"표면연소(작열연소)에 관한 설명으로 옳지 않은 것은?","c":["흑연, 목탄 등과 같이 휘발분이 거의 포함되지 않은 고체연료에서 주로 발생한다.","불꽃연소에 비해 일산화탄소가 발생할 가능성이 크다.","화학적 소화만 소화 효과가 있다.","불꽃연소에 비해 연소속도가 느리고 단위시간당 방출열량이 적다."],"a":3,"inc":false,"unit":"1-6"},{"id":"gwallisa-2016-04-30-2","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":2,"q":"요오드값(아이오딘값)에 관한 설명으로 옳지 않은 것은?","c":["유지 100 g에 흡수된 요오드의 g 수로 표시한 값이다.","값이 클수록 불포화도가 낮고 반응성이 작다.","값이 클수록 공기 중에 노출되면 산화열 축적에 의해 자연발화하기 쉽다.","요오드값이 130 이상인 유지를 건성유라고 한다."],"a":2,"inc":false,"unit":"1-1"},{"id":"gwallisa-2016-04-30-3","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":3,"q":"연료가스의 분출속도가 연소속도보다 클 때, 주위 공기의 움직임에 따라 불꽃이 노즐에서 정착하지 않고 떨어져 꺼지는 현상은?","c":["불완전연소(Incomplete combustion)","리프팅(Lifting)","블로우오프(Blow off)","역화(Back fire)"],"a":3,"inc":false,"unit":"1-10"},{"id":"gwallisa-2016-04-30-4","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":4,"q":"액화가스 탱크폭발인 BLEVE(Boiling Liquid Expanding Vapor Explosion)의 방지대책으로 옳지 않은 것은?","c":["탱크가 화염에 의해 가열되지 않도록 고정식 살수설비를 설치한다.","입열을 위하여 탱크를 지상에 설치한다.","용기 내압강도를 유지할 수 있도록 견고하게 탱크를 제작한다.","탱크 내벽에 열전도도가 큰 알루미늄 합금박판을 설치한다."],"a":2,"inc":false,"unit":"1-21"},{"id":"gwallisa-2016-04-30-5","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":5,"q":"40톤의 프로판이 증기운 폭발했을 때, TNT당량모델에 따른 TNT당량과 환산거리(폭발지점으로부터 100 m 지점)에 관한 설명으로 옳지 않은 것은? (단, 프로판의 연소열은 47 MJ/톤, TNT의 연소열은 4.7 MJ/톤, 폭발효율은 0.1이다.)","c":["TNT당량은 어떤 물질이 폭발할 때 내는 에너지와 동일 에너지를 내는 TNT중량을 말한다.","환산거리는 폭발의 영향범위 산정 및 폭풍파의 특성을 결정하는 데 사용된다.","TNT당량값은 40,000 kg 이다.","환산거리값은 약 5.00 m/kg1/3 이다."],"a":4,"inc":false,"unit":"1-26"},{"id":"gwallisa-2016-04-30-6","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":6,"q":"건축물의 피난ㆍ방화구조 등의 기준에 관한 규칙상 고층건축물에 설치하는 피난용 승강기의 설치기준에 관한 설명으로 옳은 것은?","c":["승강로의 상부 및 승강장에는 배연설비를 설치할 것","승강장에는 상용전원에 의한 조명설비만을 설치할 것","예비전원은 전용으로 하고 30분 동안 작동할 수 있는 용량의 것으로 할 것","승강장의 바닥면적은 피난용승강기 1대에 대하여 4제곱미터로 할 것"],"a":1,"inc":false,"unit":"2-3"},{"id":"gwallisa-2016-04-30-7","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":7,"q":"초고층 및 지하연계 복합건축물 재난관리에 관한 특별법령상 종합방재실의 설치 기준에 관한 설명으로 옳지 않은 것은?","c":["종합방재실과 방화구획된 부속실을 설치할 것","재난 및 안전관리에 필요한 인력은 2명을 상주하도록 할 것","면적은 20제곱미터 이상으로 할 것","종합방재실을 피난층이 아닌 2층에 설치하는 경우 특별피난계단 출입구로부터 5미터이내에 위치할 것"],"a":2,"inc":false,"unit":"2-1"},{"id":"gwallisa-2016-04-30-10","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":10,"q":"소방시설 등의 성능위주설계 방법 및 기준상 화재 및 피난시뮬레이션의 시나리오 작성 시 국내 업무용도 건축물의 수용인원 산정기준은 1인당 몇 m2인가?","c":["4.6","9.3","18.6","22.3"],"a":2,"inc":false,"unit":"2-3"},{"id":"gwallisa-2016-04-30-11","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":11,"q":"1기압 상온에서 가연성 가스의 연소범위(vol %)로 옳지 않은 것은?","c":["수소 : 4 ∼75","메탄 : 5 ∼ 15","암모니아 : 15 ∼28","일산화탄소 : 3 ∼ 11.5"],"a":4,"inc":false,"unit":"1-3"},{"id":"gwallisa-2016-04-30-12","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":12,"q":"화재조사 용어 중 강소흔에 관한 설명으로 옳은 것은?","c":["목재 등의 표면이 타 들어가 구갑상(龜甲狀)을 이루면서 탄화된 부분의 총 깊이","통전 상태에 있던 전선이 화재시의 열기로 인해 전선 피복이 타버리는 과정에서 전선의 심선이 서로 접촉될 때의 방전으로 생기는 용흔","목재표면이 불의 영향을 강하게 받아 심하게 탄 흔적으로 약 900℃ 수준의 불에 탄목재 표면층에서 나타나는 균열흔","가연물이 탈 때 발생하는 그을음 등의 입자가 공간 속을 흘러가며 물체 또는 공간 내 표면에 연기가 접촉해서 남겨 놓은 흔적"],"a":3,"inc":false,"unit":"1-17"},{"id":"gwallisa-2016-04-30-13","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":13,"q":"1기압 상온에서 발화점(ignition point)이 가장 낮은 것은?","c":["황린","이황화탄소","셀룰로이드","아세트알데히드"],"a":1,"inc":false,"unit":"1-1"},{"id":"gwallisa-2016-04-30-15","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":15,"q":"화재성장속도 분류에서 약 1MW의 열량에 도달하는 시간이 600초인 것은?","c":["Slow 화재","Medium 화재","Fast 화재","Ultra Fast 화재"],"a":1,"inc":false,"unit":"1-11"},{"id":"gwallisa-2016-04-30-16","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":16,"q":"연소 시 발생하는 연소가스가 인체에 미치는 영향에 관한 설명으로 옳지 않은 것은?","c":["포스겐은 독성이 매우 강한 가스로서 공기 중에 25 ppm만 있어도 1시간 이내에 사망한다.","아크롤레인은 눈과 호흡기를 자극하며, 기도장애를 일으킨다.","이산화탄소는 그 자체의 독성은 거의 없으나 다량이 존재할 경우 사람의 호흡속도를 증가시켜 화재가스에 혼합된 유해가스의 흡입을 증가시킨다.","시안화수소는 달걀 썩는 냄새가 나는 특성이 있으며, 공기 중에 0.02%의 농도만으로도 치명적인 위험상태에 빠질 수가 있다."],"a":4,"inc":false,"unit":"6-2"},{"id":"gwallisa-2016-04-30-17","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":17,"q":"바닥으로부터 높이 0.2 m의 위치에 개구부(가로 2 m × 세로 2 m) 1개가 있는 창고(바닥면적 가로 3 m × 세로 4 m, 높이 3 m)에 화재가 발생하였을 때, Flash over 발생에 필요한 최소한의 열방출속도 Qfo는 몇 kW인가? (단, Thomas의 공식 Qfo(kW)=7.8AT+378A√H을 이용하며, 소수점 이하 셋째자리에서 반올림한다.)","c":["2528.29","2559.49","2621.89","2653.09"],"a":3,"inc":false,"unit":"1-13"},{"id":"gwallisa-2016-04-30-19","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":19,"q":"국내 화재 분류에서 A급화재에 해당하는 것은?","c":["일반화재","유류화재","전기화재","금속화재"],"a":1,"inc":false,"unit":"1-17"},{"id":"gwallisa-2016-04-30-21","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":21,"q":"정상상태에서 위험분위기가 지속적으로 또는 장기적으로 존재하는 배관 내부에 적합한 방폭구조는?","c":["내압방폭구조","본질안전방폭구조","압력방폭구조","안전증방폭구조"],"a":2,"inc":false,"unit":"10-1"},{"id":"gwallisa-2016-04-30-24","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":24,"q":"가로 10 m, 세로 10 m, 높이 5 m인 공간에 저장되어 있는 발열량 13,500 kcal/kg인 가연물 2,000 kg과 발열량 9,000 kcal/kg인 가연물 1,000 kg이 완전연소 하였을 때 화재하중은 몇 kg/m2인가? (단, 목재의 단위 발열량은 4,500 kcal/kg이다.)","c":["20","40","60","80"],"a":4,"inc":false,"unit":"1-12"},{"id":"gwallisa-2016-04-30-26","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":26,"q":"뉴턴의 점성법칙과 관계가 없는 것은?","c":["점성계수","속도기울기","전단응력","압력"],"a":4,"inc":false,"unit":"4-2"},{"id":"gwallisa-2016-04-30-30","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":30,"q":"온도가 35 ℃이고 절대압력이 6,000 kPa인 공기의 비중량은 약 몇 N/m3인가? (단, 공기의 기체상수는 R = 286.8 J/kgㆍK 이고, 중력가속도 g = 9.8 m/sec2 이다.)","c":["579","666","755","886"],"a":2,"inc":false,"unit":"4-1"},{"id":"gwallisa-2016-04-30-32","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":32,"q":"배관의 마찰손실압력을 계산할 수 있는 하이젠-윌리암스(Hazen-Williams)식에 관한 설명으로 옳지 않은 것은?","c":["마찰손실은 유량의 1.85승에 정비례한다.","마찰손실은 배관 내경의 4.87승에 반비례한다.","마찰손실은 관마찰손실계수의 1.85승에 정비례한다.","관경은 호칭경 보다 배관의 내경을 대입한다."],"a":3,"inc":false,"unit":"4-3"},{"id":"gwallisa-2016-04-30-33","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":33,"q":"원형배관 내부로 흐르는 유체의 레이놀드수가 1,000일 때 마찰손실계수는 얼마인가?","c":["0.024","0.064","0.076","0.098"],"a":2,"inc":false,"unit":"4-3"},{"id":"gwallisa-2016-04-30-34","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":34,"q":"펌프의 공동현상(cavitation)의 방지방법이 아닌 것은?","c":["수조의 밑 부분에 배수밸브 및 배수관을 설치해 둔다.","펌프의 설치위치를 수조의 수위보다 낮게 한다.","흡입 관로의 마찰손실을 줄인다.","양흡입 펌프를 선정한다."],"a":1,"inc":false,"unit":"4-4"},{"id":"gwallisa-2016-04-30-36","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":36,"q":"이산화탄소 소화약제에 관한 설명으로 옳지 않은 것은? (문제 오류로 실제 시험에서는 1, 4번이 정답처리 되었습니다. 여기서는 1번을 누르면 정답 처리 됩니다.)","c":["이온결합 물질이다.","기체의 비중은 약 1.52로 공기보다 무겁다.","1기압 상온에서 무색 기체이다.","삼중점은 1기압에서 약 - 56℃이다."],"a":1,"inc":false,"unit":"6-2"},{"id":"gwallisa-2016-04-30-37","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":37,"q":"포소화약제가 연소표면을 덮어 공기 접촉을 차단하는 소화원리는?","c":["냉각소화","질식소화","탈수소화","부촉매소화"],"a":2,"inc":false,"unit":"5-1"},{"id":"gwallisa-2016-04-30-40","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":40,"q":"농도가 6.5 wt%인 단백포 소화약제 수용액 1 kg에 물을 첨가하여 농도가 1.5 wt%인 단백포 소화약제 수용액으로 만들고자 한다. 이때 첨가해야 하는 물의 양은 약 몇 kg인가?","c":["2.22 kg","2.78 kg","3.33 kg","3.88 kg"],"a":3,"inc":false,"unit":"5-1"},{"id":"gwallisa-2016-04-30-47","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":47,"q":"교류전력에 관한 내용으로 옳지 않은 것은?","c":["저항 4Ω과 코일 3Ω이 직렬 연결되어 있고 100 V, 60 Hz인 전압을 공급하면 유효 전력은 1.6 kW 이다.","공진주파수에서 유효전력과 피상전력은 같다.","kvar는 무효전력의 단위이다.","kW는 피상전력의 단위이다."],"a":4,"inc":false,"unit":"9-2"},{"id":"gwallisa-2016-04-30-58","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":58,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 소화활동설비에 해당하지 않는 것은?","c":["상수도소화용수설비","무선통신보조설비","비상콘센트설비","연결살수설비"],"a":1,"inc":false,"unit":"8-7"},{"id":"gwallisa-2016-04-30-60","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":60,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 건축허가등을 할 때 미리 소방본부장 또는 소방서장의 동의를 받아야 하는 건축물의 범위로 옳지 않은 것은?","c":["지하층 또는 무창층이 있는 공연장으로서 바닥면적이 100제곱미터 이상인 층이 있는 것","연면적이 200제곱미터 이상인 노유자시설(老幼者施設) 및 수련시설","연면적이 300제곱미터 이상인 장애인 의료재활시설","주차용도로 사용되는 시설로 승강기 등 기계장치에 의한 주차시설로서 자동차 10대이상을 주차할 수 있는 시설"],"a":4,"inc":false,"unit":"7-2"},{"id":"gwallisa-2016-04-30-62","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":62,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 국민안전처장관이 정하는 내진설계기준에 맞게 설치하여야 하는 소방시설은? (단, 내진설계기준을 적용하여야 하는 소방시설을 설치하여야 하는 특정소방대상물의 경우에 한함)","c":["자동화재탐지설비","옥외소화전설비","물분무등소화설비","비상경보설비"],"a":3,"inc":false,"unit":"13-1"},{"id":"gwallisa-2016-04-30-68","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":68,"q":"위험물안전관리법령상 위험물시설의 안전관리에 관한 설명으로 옳지 않은 것은?(2021년 10월 19일 개정된 규정 적용됨)","c":["위험물안전관리자를 선임하여야 하는 제조소등의 경우, 안전관리자를 선임한 제조소등의 관계인은 그 안전관리자를 해임하거나 안전관리자가 퇴직한 때에는 해임하거나 퇴직한 날부터 30일 이내에 다시 안전관리자를 선임하여야 한다.","암반탱크저장소는 관계인이 예방규정을 정하여야 하는 제조소등에 포함된다.","정기검사의 대상인 제조소등이라 함은 액체위험물을 저장 또는 취급하는 50만리터 이상의 옥외탱크저장소를 말한다.","탱크안전성능시험자가 되고자 하는 자는 대통령령이 정하는 기술능력ㆍ시설 및 장비를 갖추어 국민안전처장관에게 등록하여야 한다."],"a":4,"inc":false,"unit":"6-5"},{"id":"gwallisa-2016-04-30-72","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":72,"q":"다중이용업소의 안전관리에 관한 특별법령상 안전시설등에 해당하지 않는 것은?","c":["옥내소화전설비","구조대","영업장 내부 피난통로","창문"],"a":1,"inc":false,"unit":"4-6"},{"id":"gwallisa-2016-04-30-76","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":76,"q":"니트로셀룰로오스에 관한 설명으로 옳지 않은 것은?","c":["질산에스테르류에 속하며 자기반응성물질이다.","직사광선에 의해 분해하여 자연발화할 수 있다.","질화도가 클수록 분해도, 폭발성, 위험도가 감소한다.","저장ㆍ운반 시에는 물 또는 알코올을 첨가하여 위험성을 감소시킨다."],"a":3,"inc":false,"unit":"1-1"},{"id":"gwallisa-2016-04-30-78","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":78,"q":"제2류 위험물에 관한 설명으로 옳지 않은 것은?","c":["철분, 마그네슘은 산과 반응하여 산소를 발생한다.","유황은 가연성고체로 푸른 불꽃을 내며 연소한다.","적린이 연소하면 유독성의 P2O5가 발생한다.","산화제와 혼합하면 가열, 충격, 마찰에 의해 발화ㆍ폭발의 위험이 있다."],"a":1,"inc":false,"unit":"1-1"},{"id":"gwallisa-2016-04-30-79","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":79,"q":"제3류 위험물인 황린에 관한 설명으로 옳은 것은?","c":["증기는 자극성과 독성이 없다.","환원력이 약해 산소농도가 높아야 연소한다.","갈색 또는 회색의 고체로 증기는 공기보다 가볍다.","공기 중에서 자연발화의 위험성이 있어 물 속에 저장한다."],"a":4,"inc":false,"unit":"1-1"},{"id":"gwallisa-2016-04-30-80","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":80,"q":"위험물안전관리법령상 제4류 위험물의 품명별 위험등급이 바르게 짝지어진 것은?","c":["알코올류 - Ⅰ등급","특수인화물 - Ⅰ등급","제2석유류 중 수용성액체 - Ⅱ등급","제3석유류 중 비수용성액체 - Ⅱ등급"],"a":2,"inc":false,"unit":"3-2"},{"id":"gwallisa-2016-04-30-81","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":81,"q":"제5류 위험물인 유기과산화물에 관한 설명으로 옳지 않은 것은?","c":["불티, 불꽃 등의 화기를 엄금한다.","직사광선을 피하고 냉암소에 저장한다.","누출 시 과산화수소로 혼합시켜 제거한다.","벤조일퍼옥사이드는 진한 황산과 혼촉 시 분해를 일으켜 폭발한다."],"a":3,"inc":false,"unit":"3-2"},{"id":"gwallisa-2016-04-30-84","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":84,"q":"위험물안전관리법령상 제2류 위험물에 관한 설명으로 옳지 않은 것은?","c":["유황은 순도가 60중량퍼센트 이상인 것을 말하며 지정수량은 100 kg이다.","마그네슘은 직경 2 mm 이상의 막대 모양의 것을 말하며 지정수량은 100 kg이다.","인화성고체라 함은 고형알코올 그 밖에 1기압에서 인화점이 섭씨 40도 미만인 고체를 말하며 지정수량은 1,000 kg이다.","철분이라 함은 철의 분말로서 53마이크로미터의 표준체를 통과하는 것이 50중량퍼센트 이상이어야 하며 지정수량은 500 kg이다."],"a":2,"inc":false,"unit":"1-1"},{"id":"gwallisa-2016-04-30-87","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":87,"q":"이황화탄소에 관한 설명으로 옳지 않은 것은?","c":["인화점이 낮고 휘발이 용이하여 화재위험성이 크다.","공기 중에서 연소하면 유독성의 이산화황을 발생한다.","증기는 공기보다 무겁고, 매우 유독하여 흡입 시 신경계통에 장애를 준다.","액체비중이 물보다 작고 물에 녹기 어렵기 때문에 수조탱크에 넣어 보관한다."],"a":4,"inc":false,"unit":"2-3"},{"id":"gwallisa-2016-04-30-90","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":90,"q":"위험물안전관리법령상 연면적 500 m2 이상인 제조소에 반드시 설치하여야 하는 경보 설비는?","c":["확성장치","비상경보설비","비상방송설비","자동화재탐지설비"],"a":4,"inc":false,"unit":"3-10"},{"id":"gwallisa-2016-04-30-95","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":95,"q":"옥외탱크저장소의 하나의 방유제 안에 3기의 아세톤 저장탱크가 있다. 위험물안전관리 법령상 탱크 주위에 설치하여야 할 방유제 용량은 최소 몇 L 이상이어야 하는가? (단, 아세톤 저장탱크의 용량은 각각 10,000 L, 20,000 L, 30,000 L이다.)","c":["10,000","22,000","33,000","60,000"],"a":3,"inc":false,"unit":"3-9"},{"id":"gwallisa-2016-04-30-97","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":97,"q":"위험물안전관리법령상 판매취급소의 위치ㆍ구조 및 설비의 기준으로 옳지 않은 것은?","c":["제1종 판매취급소는 건축물의 1층에 설치할 것","제1종 판매취급소의 용도로 사용하는 부분의 창 및 출입구에는 갑종방화문 또는 을종방화문을 설치할 것","제2종 판매취급소의 용도로 사용하는 부분은 벽ㆍ기둥ㆍ바닥 및 보를 내화구조로 할 것","제2종 판매취급소의 용도로 사용하는 부분에 천장이 있는 경우에는 이를 난연재료로 할 것"],"a":4,"inc":false,"unit":"1-24"},{"id":"gwallisa-2016-04-30-101","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":101,"q":"도로터널의 화재안전기준상 소화기 설치기준으로 옳은 것은?","c":["소화기의 총중량은 7 kg 이하로 할 것","B급 화재시 소화기의 능력단위는 3단위 이상으로 할 것","소화기는 바닥면으로부터 1.2m 이하의 높이에 설치할 것","편도 2차선 이상의 양방향 터널에는 한쪽 측벽에 50 m 이내의 간격으로 소화기 2개 이상을 설치할 것"],"a":1,"inc":false,"unit":"4-5"},{"id":"gwallisa-2016-04-30-102","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":102,"q":"가로 40 m, 세로 30 m의 특수가연물 저장소에 스프링클러설비를 하고자 한다. 정방형으로 헤드를 배치할 경우 필요한 헤드의 최소 설치개수는?","c":["130","140","181","221"],"a":4,"inc":false,"unit":"4-7"},{"id":"gwallisa-2016-04-30-103","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":103,"q":"스프링클러설비의 화재안전기준상 배관에 관한 기준으로 옳지 않은 것은?","c":["배관 내 사용압력이 1.2 MPa 이상일 경우에는 압력배관용탄소강관(KS D 3562)을 사용한다.","배관의 구경 계산시 수리계산에 따르는 경우 교차배관의 유속은 6 m/s를 초과할 수 없다.","펌프의 성능시험배관은 펌프의 토출측에 설치된 개폐밸브 이전에서 분기하여 설치하여야 한다.","가압송수장치의 체절운전 시 수온의 상승을 방지하기 위하여 체크밸브와 펌프사이에서 분기한 구경 20 mm 이상의 배관에 체절압력 미만에서 개방되는 릴리프밸브를 설치하여야 한다."],"a":2,"inc":false,"unit":"4-7"},{"id":"gwallisa-2016-04-30-104","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":104,"q":"바닥면적이 100m2인 지하주차장에 물분무소화설비를 설치하는 경우 필요한 수원의 최소량은?","c":["2,000 L","20,000 L","40,000 L","80,000 L"],"a":3,"inc":false,"unit":"4-10"},{"id":"gwallisa-2016-04-30-107","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":107,"q":"분말소화설비의 화재안전기준상 전역방출방식일 때 방호구역의 체적 1m3에 대한 소화약제량으로 옳은 것은?","c":["제1종 분말: 0.60 kg","제2종 분말: 0.24 kg","제3종 분말: 0.24 kg","제4종 분말: 0.36 kg"],"a":1,"inc":false,"unit":"6-1"},{"id":"gwallisa-2016-04-30-108","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":108,"q":"분말소화설비의 화재안전기준상 가압식 분말소화설비 소화약제 저장용기에 설치하는 안전밸브의 작동압력 기준은?","c":["최고사용압력의 1.8배 이하","최고사용압력의 0.8배 이하","내압시험압력의 1.8배 이하","내압시험압력의 0.8배 이하"],"a":1,"inc":false,"unit":"6-1"},{"id":"gwallisa-2016-04-30-109","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":109,"q":"자동화재탐지설비의 감지기 설치기준으로 옳은 것은?","c":["정온식감지기는 주방ㆍ보일러실 등으로서 다량의 화기를 취급하는 장소에 설치하되, 공칭작동온도가 최고주위온도보다 10 ℃ 이상 높은 것으로 설치할 것","감지기(차동식분포형의 것을 제외한다)는 실내로의 공기유입구로부터 0.8 m 이상 떨어진 위치에 설치할 것","스포트형감지기는 65° 이상 경사되지 아니하도록 부착할 것","감지기는 천장 또는 반자의 옥내에 면하는 부분에 설치할 것"],"a":4,"inc":false,"unit":"8-2"},{"id":"gwallisa-2016-04-30-111","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":111,"q":"청정소화약제소화설비 설치시 화재안전기준으로 옳지 않은 것은?","c":["저장용기는 온도가 65℃ 이상이고 온도의 변화가 작은 곳에 설치할 것","저장용기를 방호구역 외에 설치한 경우에는 방화문으로 구획된 실에 설치할 것","수동식 기동장치는 해당 방호구역의 출입구부근 등 조작을 하는 자가 쉽게 피난할 수 있는 장소에 설치할 것","수동식 기동장치는 5kg 이하의 힘을 가하여 기동할 수 있는 구조로 설치할 것"],"a":1,"inc":false,"unit":"2-2"},{"id":"gwallisa-2016-04-30-113","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":113,"q":"비상경보설비 및 단독경보형감지기의 화재안전기준상 용어의 정의로 옳지 않은 것은?","c":["“비상벨설비”란 화재발생 상황을 경종으로 경보하는 설비를 말한다.","“자동식사이렌설비”란 화재발생 상황을 사이렌으로 경보하는 설비를 말한다.","“발신기”란 화재발생 신호를 수신기에 자동으로 발신하는 장치를 말한다.","“단독경보형감지기”란 화재발생 상황을 단독으로 감지하여 자체에 내장된 음향장치로 경보하는 감지기를 말한다."],"a":3,"inc":false,"unit":"3-10"},{"id":"gwallisa-2016-04-30-114","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":114,"q":"자동화재속보설비의 화재안전기준에 관한 설명으로 옳지 않은 것은?","c":["문화재에 설치하는 자동화재속보설비는 속보기에 감지기를 직접 연결하는 방식(자동화재탐지설비 1개의 경계구역에 한한다)으로 할 수 있다.","조작스위치는 통상 1m 미만으로 설치하지만 특별한 높이 규정은 없으며 신속한 전달이 중요하다.","자동화재탐지설비와 연동으로 작동하여 자동적으로 화재발생 상황을 소방관서에 전달되는 것으로 하여야 한다.","속보기는 소방관서에 통신망으로 통보하도록 하며, 데이터 또는 코드전송 방식을 부가적으로 설치 할 수 있다."],"a":2,"inc":false,"unit":"9-9"},{"id":"gwallisa-2016-04-30-118","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":118,"q":"비상조명등의 화재안전기준에 따라 지하상가에 휴대용 비상조명등을 설치할 때 옳은 것은?","c":["보행거리 50m마다 3개를 설치하였다.","보행거리 50m마다 1개를 설치하였다.","보행거리 25m마다 3개를 설치하였다.","바닥으로부터 1.8m 높이에 설치하였다."],"a":3,"inc":false,"unit":"8-7"},{"id":"gwallisa-2016-04-30-119","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":119,"q":"비상콘센트설비의 전원부와 외함 사이의 정격전압이 250 V일 때 절연내력 시험 전압은?","c":["1,000 V","1,200 V","1,250 V","1,500 V"],"a":4,"inc":false,"unit":"9-9"},{"id":"gwallisa-2016-04-30-120","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":120,"q":"연소방지설비를 설치하는 지하구에 방화벽을 설치하려고 한다. 방화벽의 설치기준으로 옳지 않은 것은?","c":["내화구조로서 홀로 설 수 있는 구조일 것","방화벽에 출입문을 설치하는 경우에는 방화문으로 할 것","방화벽을 관통하는 케이블ㆍ전선 등에는 내열성이 있는 화재차단재로 마감할 것","방화벽의 위치는 분기구 및 환기구 등의 구조를 고려하여 설치할 것"],"a":3,"inc":false,"unit":"2-2"},{"id":"gwallisa-2016-04-30-121","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":121,"q":"연결송수관설비 방수구의 설치기준으로 옳지 않은 것은?","c":["아파트의 경우 계단으로부터 5m 이내에 설치한다.","바닥면적이 1,000m2 미만인 층에 있어서는 계단 부속실로부터 10m 이내에 설치한다.","방수구는 개폐기능을 가진 것으로 설치하여야 하며, 평상 시 닫힌 상태를 유지한다.","방수구는 연결송수관설비의 전용방수구 또는 옥내소화전방수구로서 구경 65mm의 것으로 설치한다."],"a":2,"inc":false,"unit":"4-6"},{"id":"gwallisa-2016-04-30-122","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2016-04-30","num":122,"q":"특별피난계단의 계단실 및 부속실 제연설비 화재안전기준상 급기송풍기의 설치기준으로 옳지 않은 것은?","c":["송풍기의 송풍능력은 송풍기가 담당하는 제연구역에 대한 급기량의 1.5배 이상으로 할 것","송풍기에는 풍량조절장치를 설치하여 풍량조절을 할 수 있도록 할 것","송풍기에는 풍량을 실측할 수 있는 유효한 조치를 할 것","송풍기는 옥내의 화재감지기의 동작에 따라 작동하도록 할 것"],"a":1,"inc":false,"unit":"7-8"},{"id":"gwallisa-2017-04-29-1","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":1,"q":"프로판(C3H8) 2몰과 산소(O2) 10몰이 반응할 경우 이산화탄소(CO2)는 몇 몰이 생성되는가?","c":["2","4","6","8"],"a":3,"inc":false,"unit":"6-2"},{"id":"gwallisa-2017-04-29-2","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":2,"q":"폭발성분위기 내에 표준용기의 접합면 틈새를 통하여 폭발화염이 내부에서 외부로 전파되지 않는 최대안전틈새(화염일주한계)가 가장 넓은 물질은?","c":["부탄","에틸렌","수소","아세틸렌"],"a":1,"inc":false,"unit":"1-2"},{"id":"gwallisa-2017-04-29-6","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":6,"q":"유류 저장탱크 내부의 물이 점성을 가진 뜨거운 기름의 표면 아래에서 끓을 때 화재를 수반하지 않고 기름이 넘치는 현상은?","c":["슬롭오버(Slop over)","플레임오버(Flame over)","보일오버(Boil over)","프로스오버(Froth over)"],"a":4,"inc":false,"unit":"1-19"},{"id":"gwallisa-2017-04-29-8","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":8,"q":"1기압 상온에서 인화점이 낮은 것에서 높은 것으로 옳게 나열한 것은?","c":["아세톤＜이황화탄소＜메틸알코올＜벤젠","이황화탄소＜아세톤＜벤젠＜메틸알코올","벤젠＜이황화탄소＜아세톤＜메틸알코올","아세톤＜벤젠＜메틸알코올＜이황화탄소"],"a":2,"inc":false,"unit":"1-1"},{"id":"gwallisa-2017-04-29-9","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":9,"q":"연소속도에 영향을 미치는 요인에 관한 설명으로 옳지 않은 것은?","c":["화염온도가 높을수록 연소속도는 증가한다.","미연소 가연성 기체의 비열이 클수록 연소속도는 증가한다.","미연소 가연성 기체의 열전도율이 클수록 연소속도는 증가한다.","미연소 가연성 기체의 밀도가 작을수록 연소속도는 증가한다."],"a":2,"inc":false,"unit":"1-10"},{"id":"gwallisa-2017-04-29-10","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":10,"q":"목재 300kg과 고무 500kg이 쌓여 있는 공간(가로 4m, 세로 8m, 높이 6m)의 내부 화재하중(kg/m2)은 약 얼마인가? (단, 목재의 단위발열량은 18,855kJ/kg, 고무의 단위발열량은 42,430kJ/kg이다.)","c":["44.54","46.62","48.22","50.62"],"a":1,"inc":false,"unit":"1-12"},{"id":"gwallisa-2017-04-29-11","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":11,"q":"건축물 피난계획 수립 시 fool proof를 적용한 사례로 옳지 않은 것은?","c":["소화ㆍ경보설비의 위치, 유도표지에 판별이 쉬운 색채를 사용한다.","피난방향으로 열리는 출입문을 설치한다.","도어노브는 회전식이 아닌 레버식을 사용한다.","정전 시를 대비한 비상조명등을 설치하며, 피난경로는 2방향 이상 피난로를 확보한다."],"a":4,"inc":false,"unit":"7-1"},{"id":"gwallisa-2017-04-29-13","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":13,"q":"건축물의 화재안전에 대한 공간적 대응방법에 해당되지 않는 것은?","c":["건축물 내장재의 난연ㆍ불연화성능","건축물의 내화성능","건축물의 방화구획성능","건축물의 제연설비성능"],"a":4,"inc":false,"unit":"2-1"},{"id":"gwallisa-2017-04-29-14","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":14,"q":"건축물의 피난ㆍ방화구조 등의 기준에 관한 규칙상 건축물의 내화구조로 옳지 않은 것은? (단, 특별건축구역 등 기타 사항은 고려하지 않는다.)","c":["외벽중 비내력벽의 경우 철골철근콘크리트조로서 두께가 5센티미터 이상인 것","보의 경우 철골을 두께 5센티미터 이상의 콘크리트로 덮은 것","벽의 경우 철재로 보강된 콘크리트블록조ㆍ벽돌조 또는 석조로서 철재에 덮은 콘크리트블록등의 두께가 5센티미터 이상인 것","기둥의 경우 그 작은 지름이 25센티미터 이상인 것으로서 철골을 두께 5센티미터 이상의 콘크리트로 덮은 것"],"a":1,"inc":false,"unit":"2-3"},{"id":"gwallisa-2017-04-29-15","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":15,"q":"건축법령상 방화구획 등의 설치 대상건축물 중 방화구획 설치를 적용하지 아니하거나 그 사용에 지장이 없는 범위에서 완화하여 적용할 수 있는 것이 아닌 것은? (단, 특별건축구역 등 기타 사항은 고려하지 않는다.)","c":["장례시설의 용도로 쓰는 거실로서 시선 및 활동공간의 확보를 위하여 불가피한 부분","승강기의 승강로 부분으로서 그 건축물의 다른 부분과 방화구획으로 구획된 부분","주요구조부가 난연재료로 된 주차장","복층형 공동주택의 세대별 층간 바닥 부분"],"a":3,"inc":false,"unit":"2-1"},{"id":"gwallisa-2017-04-29-16","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":16,"q":"굴뚝효과(stack effect)에 관한 설명으로 옳은 것은?","c":["건물 내부와 외부의 온도차가 클수록 발생가능성이 낮다.","일반적으로 고층 건물보다 저층 건물에서 더 크다.","층간 공기 누설과 관계가 없다.","건물 내부와 외부의 공기밀도차로 인해 발생한 압력차로 발생한다."],"a":4,"inc":false,"unit":"1-15"},{"id":"gwallisa-2017-04-29-19","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":19,"q":"공간 화재 특성에 관한 설명으로 옳지 않은 것은?","c":["플래시오버는 실내의 국소화재로부터 실내 모든 가연물 표면이 연소하는 현상을 말한다.","백드래프트는 신선한 공기가 유입되어 실내에 축적되었던 가연성 가스가 단시간에 폭발적으로 연소하는 현상이다.","환기지배형 화재란 환기가 충분한 상태에서 가연물의 양에 따라 제어되는 화재를 말한다.","공간 화재에서 연기와 공기의 유동은 주로 온도상승에 의한 부력의 영향 때문이다."],"a":3,"inc":false,"unit":"1-12"},{"id":"gwallisa-2017-04-29-23","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":23,"q":"표준대기압 조건에서 내부와 외부가 각각 25℃와 -10℃이고 높이가 170m인 건물에서 중성대가 건물의 중간 높이에 위치한다고 가정하면, 건물 샤프트의 최상부와 외부 사이의 굴뚝효과에 의한 압력차(Pa)는 약 얼마인가?","c":["94.76","113.24","131.34","150.16"],"a":3,"inc":false,"unit":"1-15"},{"id":"gwallisa-2017-04-29-24","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":24,"q":"난류화염으로부터 10℃의 벽으로 전달되는 대류 열유속(kW/m2)은? (단, 대류열전달계수 h값은 5 W/m2ㆍ℃을 사용하고, 시간 평균 최대화염온도는 약 900℃이다.)","c":["3.16","4.45","5.41","6.12"],"a":2,"inc":false,"unit":"1-7"},{"id":"gwallisa-2017-04-29-27","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":27,"q":"관성력과 점성력의 비를 나타내는 무차원수는?","c":["웨버(Weber) 수","프루드(Froude) 수","오일러(Euler) 수","레이놀즈(Reynolds) 수"],"a":4,"inc":false,"unit":"4-3"},{"id":"gwallisa-2017-04-29-31","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":31,"q":"물의 특성을 나타내는 식과 그에 대한 차원식이 모두 옳게 표현된 것은? (단, 물의 점성계수는 μ, 동점성계수는 v, 밀도는 ρ, 비중량은 γ, 중력가속도는 g, 질량은 M, 길이는 L, 시간은 T이다.)","c":["μ=ρ×v[ML-1T-1]","γ=ρ×g[ML-2T-1]","ρ=v×μ[ML-3]","γ=ρ×g[ML-3T-1]"],"a":1,"inc":false,"unit":"4-1"},{"id":"gwallisa-2017-04-29-32","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":32,"q":"개방된 물탱크 A의 수면으로부터 5m 아래에 지름 10 mm인 오리피스를 부착하였다. 그 아래쪽에 설치한 한 변의 길이가 75cm인 정사각형 수조안으로 물을 낙하시켜서 16분 40초 후에 수조의 수심이 0.8m 상승하였다면, 오리피스의 유량계수는? (단, 물탱크 A의 수심은 변화 없고, 수축계수는 1.0, 원주율은 3.0, 중력가속도는 10.0m/s2이다.)","c":["0.45","0.50","0.60","0.75"],"a":3,"inc":false,"unit":"4-12"},{"id":"gwallisa-2017-04-29-34","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":34,"q":"제1종 분말소화약제의 주성분인 탄산수소나트륨 10kg 전량이 850℃에서 2차 열분해될 때 생성되는 이산화탄소 발생량(kg)은 약 얼마인가? (단, 원자량은 Na: 23, H: 1, C: 12, O: 16으로 한다.)","c":["2.62","3.48","5.24","10.48"],"a":3,"inc":false,"unit":"6-1"},{"id":"gwallisa-2017-04-29-35","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":35,"q":"이산화탄소 소화약제에 관한 설명으로 옳지 않은 것은?","c":["무색, 무취이며 전기적으로 비전도성이고 공기보다 약 1.5배 무겁다.","임계온도는 약 31 ℃이고, 삼중점은 0.51 MPa에서 약 -56℃이다.","A급, B급, C급 화재에 모두 적응이 가능하나 주로 B급과 C급 화재에 사용된다.","한국산업규격에 따른 품질에 관한 액화이산화탄소 분류에서 제1종과 제2종을 소화약제로 사용한다."],"a":4,"inc":false,"unit":"6-2"},{"id":"gwallisa-2017-04-29-36","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":36,"q":"소화원액 15 L로 3 % 합성계면활성제포 수용액을 만들었다. 이 수용액을 이용하여 발생시킨 포의 총 부피가 325m3일 때, 팽창비는?","c":["450","550","650","750"],"a":3,"inc":false,"unit":"5-2"},{"id":"gwallisa-2017-04-29-37","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":37,"q":"화재안전기준(NFSC 107A)에서 정한 청정소화약제의 최대허용 설계농도 기준으로 옳지 않은 것은?","c":["HCFC-124 : 1.0 %","HFC-227ea : 10.5 %","HFC-125 : 12.5 %","FC-3-1-10 : 40 %"],"a":3,"inc":false,"unit":"6-3"},{"id":"gwallisa-2017-04-29-38","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":38,"q":"금속화재에 적응성이 없는 분말소화약제는?","c":["G-1","MET-L-X","Na-X","CDC(Compatible Dry Chemical)"],"a":4,"inc":false,"unit":"6-1"},{"id":"gwallisa-2017-04-29-39","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":39,"q":"질식소화를 위한 연소한계 산소농도가 15 vol%인 가연물질의 소화에 필요한 CO2가스의 최소소화농도(vol%)는? (단, 무유출(No efflux)방식을 전제로 하고, 공기 중 산소는 20 vol%이다.)","c":["20","25","33","40"],"a":2,"inc":false,"unit":"1-5"},{"id":"gwallisa-2017-04-29-41","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":41,"q":"열분해로 생성된 불연성의 용융물질에 의한 방진소화 효과를 발생시키는 분말 소화약제는?","c":["NH4H2PO4","KHCO3","NaHCO3","KHCO3 + CO(NH2)2"],"a":1,"inc":false,"unit":"6-1"},{"id":"gwallisa-2017-04-29-54","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":54,"q":"소방기본법령상 특수가연물의 저장 및 취급기준에 관한 설명으로 옳지 않은 것은?","c":["살수설비를 설치하는 경우에는 쌓는 높이는 15 m 이하가 되도록 할 것","발전용으로 저장하는 석탄ㆍ목탄류는 품명별로 구분하여 쌓을 것","쌓는 부분의 바닥면적 사이는 1 m 이상이 되도록 할 것","특수가연물을 저장 또는 취급하는 장소에는 품명ㆍ최대수량 및 화기취급의 금지표지를 설치할 것"],"a":2,"inc":false,"unit":"3-2"},{"id":"gwallisa-2017-04-29-57","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":57,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 특정소방대상물에 대하여 관계인이 소방시설 등을 정기적으로 자체점검할 때 소방시설별로 갖추어야 하는 점검 장비의 연결이 옳지 않은 것은?","c":["포소화설비 - 헤드결합렌치","청정소화약제소화설비 - 절연저항계","옥내소화전설비 - 차압계","제연설비 - 폐쇄력측정기"],"a":3,"inc":false,"unit":"4-6"},{"id":"gwallisa-2017-04-29-65","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":65,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 신축하는 특정소방대상물 중 성능위주설계를 하여야 하는 장소에 해당하지 않는 것은?","c":["높이가 120 m 인 업무시설","연면적 23만 m2 인 아파트","지하 5층이며 지상 29층인 의료시설","연면적 4만 m2 인 공항시설"],"a":2,"inc":false,"unit":"2-3"},{"id":"gwallisa-2017-04-29-76","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":76,"q":"제1류 위험물에 관한 설명으로 옳지 않은 것은?","c":["모두 불연성물질이며, 강력한 산화제로 열분해하여 산소를 발생시킨다.","브롬산염류, 질산염류, 요오드산염류는 지정수량이 300 kg이고 위험등급 Ⅱ에 해당된다.","물에 녹아 수용액 상태가 되면 산화성이 없어진다.","무기과산화물, 퍼옥소붕산염류, 삼산화크롬은 물과 반응하여 산소를 발생하고 발열한다."],"a":3,"inc":false,"unit":"3-2"},{"id":"gwallisa-2017-04-29-78","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":78,"q":"제2류 위험물인 황화린에 관한 설명으로 옳지 않은 것은?","c":["대표적으로 안정된 황화린은 P4S3, P2S5, P4S7 이 있다.","P4S3, P2S5, P4S7 의 연소생성물은 오산화인과 이산화황으로 동일하며 유독하다.","P4S3, P2S5, P4S7 는 찬물과 반응하여 가연성 가스인 황화수소가 발생된다.","가열에 의해 매우 쉽게 연소하며 때에 따라 폭발한다."],"a":3,"inc":false,"unit":"3-1"},{"id":"gwallisa-2017-04-29-81","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":81,"q":"특수인화물에 해당하지 않는 것은?","c":["C2H5OC2H5","CH3CHCH2O","CH3COCH3","CH3CHO"],"a":3,"inc":false,"unit":"3-2"},{"id":"gwallisa-2017-04-29-82","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":82,"q":"디에틸에테르를 장시간 저장할 때 폭발성의 불안정한 과산화물을 생성한다. 이러한 과산화물 생성방지를 위한 방법으로 옳은 것은?","c":["10 % KI 용액을 첨가한다.","40 mesh의 구리망을 넣어준다.","30 % 황산제일철을 넣어준다.","CaCl2를 넣어준다."],"a":2,"inc":false,"unit":"3-2"},{"id":"gwallisa-2017-04-29-85","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":85,"q":"옥내저장소에 질산칼륨 450 kg, 염소산칼륨 300 kg, 질산 600 L를 저장하고 있다. 이 저장소는 지정수량의 몇 배를 저장하고 있는가? (단, 저장 중인 질산의 비중은 1.5이다.)","c":["5.5","9.5","10.5","12.5"],"a":3,"inc":false,"unit":"3-9"},{"id":"gwallisa-2017-04-29-87","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":87,"q":"위험물안전관리법령상 위험물별 지정수량과 위험등급의 연결이 옳지 않은 것은? (문제 오류로 실제 시험에서는 1, 2번이 정답처리 되었습니다. 여기서는 1번을 누르면 정답 처리 됩니다.)","c":["에틸알코올, 메틸에틸케톤 - 400 L - Ⅱ등급","질산암모늄, 수소화리튬 - 300 kg - Ⅲ등급","알킬알루미늄, 유기과산화물 - 10 kg - Ⅰ등급","철분, 마그네슘 - 500 kg - Ⅲ등급"],"a":1,"inc":false,"unit":"3-2"},{"id":"gwallisa-2017-04-29-88","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":88,"q":"위험물안전관리법령상 옥외탱크저장소 주위에 확보하여야 하는 보유공지는 어느부분을 기준으로 너비를 확보하는가?","c":["방유제의 내벽","옥외저장탱크의 측면","옥외저장탱크 밑판의 중심","펌프시설의 중심"],"a":2,"inc":false,"unit":"3-9"},{"id":"gwallisa-2017-04-29-90","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":90,"q":"위험물안전관리법령상 제조소등에 설치하는 비상구 설치 기준으로 옳지 않은 것은?","c":["출입구와 같은 방향에 있지 아니하고, 출입구로부터 3미터 이상 떨어져 있을 것","작업장 각 부분으로부터 하나의 비상구까지 수평거리는 50 미터 이하가 되도록 할 것","비상구의 너비는 0.75미터 이상, 높이는 1.5미터 이상으로 할 것","피난 방향으로 열리는 구조이며, 항상 잠겨 있는 구조로 할 것"],"a":4,"inc":false,"unit":"7-2"},{"id":"gwallisa-2017-04-29-92","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":92,"q":"위험물안전관리법령상 옥외저장소에 저장 또는 취급할 수 없는 위험물은? (단, 국제해상위험물규칙에 적합한 용기에 수납된 경우, 보세구역 안에 저장하는 경우는 제외한다.)","c":["벤젠","톨루엔","피리딘","에틸알코올"],"a":1,"inc":false,"unit":"3-9"},{"id":"gwallisa-2017-04-29-95","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":95,"q":"위험물안전관리법령상 옥내탱크저장소의 저장탱크에 클레오소트유(Creosote Oil)를 저장하고자 할 때 최대용량(L)은?","c":["20,000","40,000","60,000","80,000"],"a":1,"inc":false,"unit":"3-9"},{"id":"gwallisa-2017-04-29-98","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":98,"q":"제4류 위험물 제1석유류인 아세톤 1,000 L를 사용하는 취급소의 살수기준면적이 465m2이라면, 소화설비 적응성을 갖기 위한 스프링클러설비의 최소 방사량 (m3/min)은? (단, 위험물을 취급하는 설비 또는 부분이 넓게 분산되어 있지 않다. 소수점 셋째자리에서 반올림한다.)","c":["3.77","4.05","5.67","6.10"],"a":3,"inc":false,"unit":"4-7"},{"id":"gwallisa-2017-04-29-101","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":101,"q":"특정소방대상물별 소화기구의 능력단위기준에 관한 설명으로 옳은 것은? (단, 주요 구조부는 내화구조가 아님)","c":["위락시설: 바닥면적 50m2마다 능력단위 1단위 이상","장례식장: 바닥면적 100m2 마다 능력단위 1단위 이상","관광휴게시설: 바닥면적 100m2 마다 능력단위 1단위 이상","창고시설: 바닥면적 200m2 마다 능력단위 1단위 이상"],"a":3,"inc":false,"unit":"2-3"},{"id":"gwallisa-2017-04-29-102","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":102,"q":"도로터널의 화재안전기준에 관한 내용으로 옳지 않은 것은?","c":["소화전함과 방수구는 주행차로 우측 측벽을 따라 50 m 이내의 간격으로 설치하며, 편도 2차선 이상의 양방향 터널이나 4차로 이상의 일방향 터널의 경우에는 양쪽 측벽에 각각 50 m 이내의 간격으로 엇갈리게 설치할 것","물분무설비의 하나의 방수구역은 25 m이상으로 하며, 4개 방수구역을 동시에 20분이상 방수할 수 있는 수량을 확보할 것","제연설비의 설계화재강도는 20 MW를 기준으로 하고, 이 때 연기발생률은 80m3/s로 할 것","연결송수관설비의 방수압력은 0.35 MPa 이상, 방수량은 400 L/min 이상을 유지할 수 있도록 할 것"],"a":2,"inc":false,"unit":"4-10"},{"id":"gwallisa-2017-04-29-103","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":103,"q":"미분무소화설비의 방수구역 내에 설치된 미분무헤드의 개수가 20개, 헤드 1개당 설계유량은 50ℓ/min, 방사시간 1시간, 배관의 총 체적 0.06m3 이며, 안전율은 1.2일 경우 본 소화설비에 필요한 최소 수원의 양(m3)은?","c":["72.06","74.06","76.06","78.06"],"a":1,"inc":false,"unit":"4-10"},{"id":"gwallisa-2017-04-29-104","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":104,"q":"경유를 저장한 직경 40 m인 플로팅루프 탱크에 고정포방출구를 설치하고 소화약제는 수성막포농도 3 %, 분당 방출량 10ℓ/m2, 방사시간 20분으로 설계할 경우 본 포소화설비의 고정포방출구에 필요한 소화약제량(ℓ)은 약 얼마인가? (단, 탱크내면과 굽도리판의 간격은 1.4 m, 원주율은 3.14, 기타 제시되지 않은 것은 고려하지 않음)","c":["1,018.11","1,108.11","1,058.11","1,208.11"],"a":1,"inc":false,"unit":"5-2"},{"id":"gwallisa-2017-04-29-105","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":105,"q":"소화수조 및 저수조의 화재안전기준에 관한 내용으로 옳지 않은 것은?","c":["지하에 설치하는 소화용수설비의 흡수관투입구는 그 한변이 0.6 m 이상이거나 직경이 0.6 m이상인 것, 소요수량이 80m3미만인 것은 1개 이상, 80m3 이상인 것은 2개 이상을 설치한다.","1층과 2층의 바닥면적의 합계가 32,000m2 인 경우 소화수조의 저수량은 100m3이상이어야 한다.","소화수조 또는 저수조가 지표면으로부터의 깊이가 4.5 m 이상인 지하에 있는 경우에 는 소요수량에 관계없이 가압송수장치의 분당 양수량은 1,100ℓ이상으로 설치한다.","소화용수설비를 설치하여야 할 특정소방대상물에 있어서 유수의 양이 0.8m3/min 이상인 유수를 사용할 수 있는 경우에는 소화수조를 설치하지 아니할 수 있다."],"a":3,"inc":false,"unit":"4-6"},{"id":"gwallisa-2017-04-29-106","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":106,"q":"스프링클러설비의 화재안전기준에 관한 내용으로 옳은 것은?","c":["50층인 초고층건축물에 스프링클러설비를 설치할 때 본 설비의 유효수량과 옥상에 설치한 수원의 양을 합한 수원의 양은 100m3이다.","소방펌프의 성능은 체절운전 시 정격토출압력의 150 %를 초과하지 아니하고, 정격토출량의 140 %로 운전 시 정격토출압력의 65 % 이상이 되어야 한다.","성능시험배관은 펌프의 토출측에 설치된 개폐밸브 이후에서 분기하여 설치하고, 유량 측정장치를 기준으로 전단 및 후단의 직관부에 개폐밸브를 설치한다.","가압송수장치에는 체절운전 시 수온의 상승을 방지하기 위한 순환배관을 설치할 것 다만, 충압펌프의 경우에는 그러하지 아니하다."],"a":4,"inc":false,"unit":"4-7"},{"id":"gwallisa-2017-04-29-110","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":110,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령에서 제시된 소방시설의 분류로 옳지 않은 것은?","c":["경보설비: 자동화재탐지설비, 비상경보설비, 비상방송설비, 가스누설경보기","피난설비: 피난기구, 인명구조기구, 유도등, 비상조명등, 제연설비","소화설비: 소화기구, 소화전설비(옥내, 옥외), 물분무소화설비, 미분무소화설비","소화활동설비: 연결살수설비, 연소방지설비, 무선통신보조설비, 비상콘센트설비"],"a":2,"inc":false,"unit":"8-7"},{"id":"gwallisa-2017-04-29-111","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":111,"q":"소방시설 종합정밀점검표에 따른 다중이용업 소방시설 등의 점검사항 중 기타 시설로 옳지 않은 것은?","c":["영상음향차단장치","방염물품","누전차단기","방화문"],"a":4,"inc":false,"unit":"9-8"},{"id":"gwallisa-2017-04-29-113","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":113,"q":"휴대용비상조명등 설치기준으로 옳지 않은 것은?","c":["숙박시설 또는 다중이용업소에는 객실 또는 영업장안의 구획된 실마다 잘 보이는 곳 (외부에 설치시 출입문 손잡이로부터 1 m 이내 부분)에 1개 이상 설치할 것","「유통산업발전법」에 따른 대규모점포(지하상가 및 지하역사는 제외한다)와 영화상영관에는 보행거리 50 m 이내마다 2개를 설치할 것","지하상가 및 지하역사에는 보행거리 25 m 이내마다 3개 이상 설치할 것","설치높이는 바닥으로부터 0.8 m 이상 1.5 m 이하의 높이에 설치할 것"],"a":2,"inc":false,"unit":"8-7"},{"id":"gwallisa-2017-04-29-114","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":114,"q":"소방시설의 내진설계 기준으로 옳은 것은?","c":["배관에 대한 내진설계를 실시할 경우 지진분리이음은 배관의 수직지진하중에 따라 산정하여야 한다.","배관의 변형을 최소화하기 위하여 소화설비 주요 부품과 벽체 상호간을 견고하게 고정하여야 한다.","건축 구조부재 상호간의 상대변위에 의한 배관의 응력을 최대화시키기 위하여 신축 배관을 사용하거나 적당한 이격 거리를 유지하여야 한다.","건물의 지진분리 이음이 설치된 위치의 배관에는 직경과 상관없이 지진분리장치를 설치하여야 한다."],"a":4,"inc":false,"unit":"13-1"},{"id":"gwallisa-2017-04-29-116","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":116,"q":"절연유 봉입 변압기 설비에 물분무소화설비를 설치한 경우 필요한 저수량(m3)은 얼마인가? (단, 바닥면적을 제외한 변압기의 표면적은 24m2)","c":["1.2","2.4","3.6","4.8"],"a":4,"inc":false,"unit":"4-10"},{"id":"gwallisa-2017-04-29-118","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":118,"q":"무선통신보조설비의 화재안전기준상 누설동축케이블 등의 설치기준으로 옳지 않은 것은?","c":["누설동축케이블은 화재에 따라 해당 케이블의 피복이 소실된 경우에 케이블 본체가 떨어지지 아니하도록 4 m 이내마다 금속제 또는 자기제등의 지지금구로 벽ㆍ천장ㆍ기둥 등에 견고하게 고정시킬 것","누설동축케이블의 중간부분에는 무반사 종단저항을 견고하게 설치할 것","누설동축케이블 및 공중선은 금속판 등에 따라 전파의 복사 또는 특성이 현저하게 저하되지 아니하는 위치에 설치할 것","누설동축케이블 및 공중선은 고압의 전로로부터 1.5 m이상 떨어진 위치에 설치할 것"],"a":2,"inc":false,"unit":"8-7"},{"id":"gwallisa-2017-04-29-119","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":119,"q":"스프링클러설비의 화재안전기준상 설치장소의 최고주위온도가 79 ℃인 경우, 표시 온도 몇 ℃의 폐쇄형스프링클러헤드를 설치해야 하는가? (단, 높이가 4 m 이상인 공장 및 창고는 제외한다.)","c":["64 ℃ 이상 106℃ 미만","79℃ 이상 121 ℃ 미만","121 ℃ 이상 162℃ 미만","162℃ 이상"],"a":3,"inc":false,"unit":"4-7"},{"id":"gwallisa-2017-04-29-120","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":120,"q":"자동화재탐지설비의 화재안전기준상 20 m 이상의 높이에 설치할 수 있는 감지기는?","c":["차동식 분포형 공기관식 감지기","광전식 스포트형 중 아나로그방식","이온화식 스포트형 중 아나로그방식","광전식 공기흡입형 중 아나로그방식"],"a":4,"inc":false,"unit":"8-4"},{"id":"gwallisa-2017-04-29-122","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2017-04-29","num":122,"q":"임시소방시설의 화재안전기준상 용어의 정의로 옳지 않은 것은?","c":["“소화기”란 소화약제를 압력에 따라 방사하는 기구로서 사람이 수동으로 조작하여 소화하는 것을 말한다.","“간이소화장치”란 공사현장에서 화재위험작업 시 신속한 화재 진압이 가능하도록 물을 방수하는 이동식 또는 고정식 형태의 소화장치를 말한다.","“비상경보장치”란 화재위험작업 공간 등에서 자동조작에 의해서 화재경보상황을 알려줄 수 있는 설비(비상벨, 사이렌, 휴대용확성기 등)를 말한다.","“간이피난유도선”이란 화재위험작업 시 작업자의 피난을 유도할 수 있는 케이블형태의 장치를 말한다."],"a":3,"inc":false,"unit":"4-5"},{"id":"gwallisa-2018-04-28-2","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":2,"q":"전기화재의 원인과 주된 방지대책의 연결이 옳지 않은 것은?","c":["낙뢰 - 피뢰설비","정전기 - 방진설비","스파크 - 방폭설비","과전류 - 적정용량의 배선 및 차단기 설치"],"a":2,"inc":false,"unit":"10-5"},{"id":"gwallisa-2018-04-28-3","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":3,"q":"연소현상에서 역화(Back fire)의 원인으로 옳지 않은 것은?","c":["분출 혼합가스의 압력이 비정상적으로 높을 때","분출 혼합가스의 양이 매우 적을 때","연소속도보다 혼합가스의 분출속도가 느릴 때","노즐의 부식 등으로 분출구가 커질 때"],"a":1,"inc":false,"unit":"1-10"},{"id":"gwallisa-2018-04-28-4","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":4,"q":"폭발의 종류와 해당 물질의 연결이 옳지 않은 것은?","c":["분해폭발 - 아세틸렌","증기폭발 - 염화비닐","분진폭발 - 석탄가루","중합폭발 - 시안화수소"],"a":2,"inc":false,"unit":"1-22"},{"id":"gwallisa-2018-04-28-6","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":6,"q":"국내의 A급화재, B급화재, C급화재, D급 화재를 표시색과 가연물에 따름 화재분류로 바르게 연결한 것은?","c":["A급화재 - 적색화재 - 일반화재","B급화재 - 백색화재 - 유류화재","C급화재 - 청색화재 - 전기화재","D급화재 - 황색화재 - 급속화재"],"a":3,"inc":false,"unit":"1-5"},{"id":"gwallisa-2018-04-28-10","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":10,"q":"건축물의 연소확대 방지를 위한 구획방법으로 옳지 않은 것은?","c":["일정한 면적마다 방화구획을 함으로써 화재규모를 가능한 한 작은 범위로 줄이고 피해를 최소한으로 한다","외벽의 개구부에는 내화구조의 차양, 발코니 등을 설치하지 않는 것이 바람직하며, 고온의 화기가 상부로 올라가도록 구획 한다","건축물을 수직으로 관통하는 부분은 다른 층으로 화재가 확산되지 않도록 구획 한다","복합건축물에서 화재위험을 많이 내포하고 있는 공간을 그 밖의 공간과 구획하여 화재 시 피해를 줄인다"],"a":2,"inc":false,"unit":"2-1"},{"id":"gwallisa-2018-04-28-12","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":12,"q":"건축물의 피난ㆍ방화구조 등의 기준에 관한 규칙상 건축물의 출입구에 설치하는 회전문의 설치기준으로 옳지 않은 것은?","c":["계단이나 에스컬레이터로부터 1.5미터 이상의 거리를 둘 것","출입에 지장이 없도록 일정한 방향으로 회전하는 구조로 할 것","회전문의 회전속도는 분당회전수가 8회를 넘지 아니하도록 할 것","자동회전문은 충격이 가하여지거나 사용자가 위험한 위치에 있는 경우에는 전자감지장치 등을 사용하여 정지하는 구조로 할 것"],"a":1,"inc":false,"unit":"2-3"},{"id":"gwallisa-2018-04-28-14","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":14,"q":"바닥 면적이 200m2인 창고에 의류 1,000㎏, 고무제품 2,000㎏이 적재되어 있는 경우 완전 연소되었을 때 화재하중은 약 몇 ㎏/m2 인가? (단, 의류, 고무, 목재의 단위발열량은 각각 5,000 ㎉/㎏, 9,000 ㎉/㎏, 4,500 ㎉/㎏이다.)","c":["15.56","20.56","25.56","30.56"],"a":3,"inc":false,"unit":"1-12"},{"id":"gwallisa-2018-04-28-15","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":15,"q":"열전달의 형태에 관한 설명으로 옳지 않은 것은?","c":["전도는 열이 직접 접촉하여 전달되는 것이다.","대류는 유체의 흐름으로 열이 이동하는 현상이다","비화는 화재의 이동경로, 연소 확산에 영향을 미치지 않는다.","복사는 진공상태에서 손실이 없으며, 복사열은 일직선으로 이동한다."],"a":3,"inc":false,"unit":"1-7"},{"id":"gwallisa-2018-04-28-17","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":17,"q":"분진폭발에 영향을 미치는 요소에 관한 설명으로 옳지 않은 것은?","c":["분진의 입자가 작고 밀도가 작을수록 표면적이 크고 폭발하기 쉽다","분진의 발열량이 크고 휘발성이 클수록 폭발하기 쉽다","분진의 부유성이 클수록 공기 중에 체류하는 시간이 긴 동시에 위험성도 커진다","분진의 형상과 표면의 상태에 관계없이 폭발성은 일정하다"],"a":4,"inc":false,"unit":"1-22"},{"id":"gwallisa-2018-04-28-19","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":19,"q":"거실제연설비의 소요배출량 27,000 m3/h, 송풍기 전압(全壓) 60mmAq, 효율 55％, 여유율 20％인 다익형 송풍기의 축동력(kW)과 본, 송풍기를 그대로 사용하고 배출량만 20％로 증가시킬 경우 회전수(rpm)는 약 얼마인가? (단, 다익형 송풍기의 초기회전수는 1,200 rpm이다)","c":["축동력 6.63, 회전수 1,350","축동력 6.63, 회전수 1,480","축동력 9.63, 회전수 1,440","축동력 9.63, 회전수 1,450"],"a":3,"inc":false,"unit":"7-7"},{"id":"gwallisa-2018-04-28-22","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":22,"q":"특별피난계단의 계단실 및 부속실 제연설비의 화재안전기준상 시험, 측정 및 조정 등의 기준으로 옳은 것은?","c":["제연구역의 모든 출입문등의 크기와 열리는 방향이 설계 시와 동일한지 여부를 확인하고, 동일하지 아니한 경우 급기량과 보충량 등을 다시 산출하여 조정가능여부 또는 재설계ㆍ개수의 여부를 결절할 것","제연구역의 출입문 및 복도와 거실(옥내가 복도와 거실로 되어 있는 경우에 한한다)사이의 출입문마다 제연설비가 작동하고 있는 상태에서 그 폐쇄력을 측정할 것","둘 이상의 특정소방대상물이 지하에 설치된 주차장으로 연결되어 있는 경우에는 주차장에서 둘 이상의 특정소방대상물의 제연구역으로 들어가는 출구에 설치된 제연용 연기감지기의 작동에 따라 특정소방대상물의 해당 수직풍도에 연결된 일부 제연구역의 댐퍼가 개방되도록 할 것","제연구역의 출입문이 일부 닫혀 있는 상태에서 제연설비를 가동시킨 후 출입문의 개방에 필요한 힘을 측정할 것"],"a":1,"inc":false,"unit":"7-8"},{"id":"gwallisa-2018-04-28-24","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":24,"q":"자연발화 방지방법으로 옳지 않은 것은?","c":["통풍을 잘 시킴","습도를 높게 유지","열의 축적을 방지","주위의 온도를 낮춤"],"a":2,"inc":false,"unit":"1-1"},{"id":"gwallisa-2018-04-28-26","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":26,"q":"합성계면활성제 포소화약제 2％현 원액 12L 를 사용하여 팽창율을 100이 되도록 포를 방출할 때 방출된 포의 부피(m3)는?","c":["24","60","240","600"],"a":2,"inc":false,"unit":"5-1"},{"id":"gwallisa-2018-04-28-32","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":32,"q":"이산화탄소 소화약제에 관한 설명으로 옳지 않은 것은?","c":["이산화탄소는 연소물 주변의 산소 농도를 저하시켜 질식소화한다.","심부화재의 경우 고농도의 이산화탄소를 장시간 방출시켜 재발화를 방지할 수 있다","통신기기실, 전산기기실, 변전실 화재에 적응성이 있다","마그네슘 화재에 적응성이 있다"],"a":4,"inc":false,"unit":"6-2"},{"id":"gwallisa-2018-04-28-33","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":33,"q":"제3종 분말소화약제의 열분해시 생성되는 오르토(ortho)인산의 화학식으로 옳은 것은?","c":["H3PO4","HPO3","H4P2O5","H4P2O7"],"a":1,"inc":false,"unit":"6-1"},{"id":"gwallisa-2018-04-28-38","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":38,"q":"전압 220V 저항부하 110 Ω 인 회로에 1시간 동안 전류를 흘렸을 때, 이 저항에서의 발열량(Kcal)은 약 얼마인가?","c":["26","380","440","1,584"],"a":2,"inc":false,"unit":"1-8"},{"id":"gwallisa-2018-04-28-44","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":44,"q":"물이 지름 0.5 m 관로에 유속 2 m/s 로 흐를 때, 100m 구간에서 발생하는 손실수두(m)는 약 얼마인가? (단, 마찰손실계수는 0.019 이다.)","c":["0.35","0.58","0.77","0.98"],"a":3,"inc":false,"unit":"4-3"},{"id":"gwallisa-2018-04-28-46","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":46,"q":"베르누이 방정식은 완전유체를 대상으로 하며 몇 가지 제한조건을 전제로 한다. 이 제한조건에 해당하는 것은?","c":["비정상 유체유동","압축성 유체유동","점성 유체유동","비회전성 유체유동"],"a":4,"inc":false,"unit":"4-2"},{"id":"gwallisa-2018-04-28-47","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":47,"q":"물이 지름 2mm 인 원형관에 0.25cm3/s로 흐르고 있을 때, 레이놀즈수는 약 얼마인가? (단, 동점성계수 0.0112cm2/s 이다.)","c":["106","142","206","206"],"a":2,"inc":false,"unit":"4-3"},{"id":"gwallisa-2018-04-28-49","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":49,"q":"유체의 압력 표시방법에 관한 설명으로 옳지 않은 것은?","c":["계기압은 대기압 0 으로 놓고 측정하는 압력이다.","해수면에서 표준대기압은 약 101.3kPa 이다.","계기압은 절대압과 대기압의 합이다","이상기체 방정식에서 부피는 절대압을 사용한다."],"a":3,"inc":false,"unit":"4-1"},{"id":"gwallisa-2018-04-28-52","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":52,"q":"소방기본법령상 200만원의 벌금에 처해질 수 있는 자는?","c":["화재조사를 위하여 관계 공부원이 관계 장소에 출입 시 정당한 사유 없이 출입을 방해한 자","정당한 사유 없이 소방대의 생활안전활동을 방해한 자","화재경계지구 안의 소방대상물에 대한 소방특별조사를 기피한 자","정당한 사유 없이 물의 사용을 방해한 자"],"a":1,"inc":false,"unit":"1-17"},{"id":"gwallisa-2018-04-28-57","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":57,"q":"소방시설공사업법령상 하자보수 대상 소방시설과 하자보수 보증기간의 연결이 옳지 않은 것은?","c":["피난기구 - 3년","자동화재탐지설비 - 3년","자동소화장치 - 3년","간이스프링클러설비 - 3년"],"a":1,"inc":false,"unit":"4-7"},{"id":"gwallisa-2018-04-28-59","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":59,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 특정소방대상물이 증축되는 경우는 기존 부분에 대해서는 증축 당시의 소방시설의 설치에 관한 대통령령 또는 화재안전기준을 적용하지 아니하는 경우가 있다. 이 경우에 해당하지 않는 것은?","c":["기존 부분과 증축 부분이 갑종 방화문으로 구획되어 있는 경우","기존 부분과 증축 부분이 국토교통부장관이 정하는 기준에 적합한 자동방화셔터로 구획되어 있는 경우","자동차 생산공장 내부에 연면적 50제곱미터의 직원 휴게실을 증축하는 경우","자동차 생산공장에 3면 이상에 벽이 없는 구조의 캐노피를 설치하는 경우"],"a":3,"inc":false,"unit":"2-2"},{"id":"gwallisa-2018-04-28-60","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":60,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 임시소방시설에 해당하지 않는 것은?","c":["비상경보장치","간이완강기","간이소화기","간이피난유도선"],"a":2,"inc":false,"unit":"4-5"},{"id":"gwallisa-2018-04-28-65","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":65,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 무선통신보조설비를 설치하여야 하는 특정소방대상물에 해당하지 않는 것은? (단, 위험물 저장 및 처리 시설중 가스시설은 제외함)","c":["공동구","지하가(터널은 제외)로서 연면적 1천 m2 이상인 것","층수가 30층 이상인 것으로서 11층 이상 부분의 모든 층","지하층의 층수가 3층 이상이고 지하층의 바닥면적의 합계가 1천 m2 이상인 것은 지하층의 모든층"],"a":3,"inc":false,"unit":"8-7"},{"id":"gwallisa-2018-04-28-68","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":68,"q":"위험물안전관리법령상 허가를 받지 아니하고 지정수랑 이사의 위험물을 저장 또는 취급하는 자에 대한 조치명령에 관한 설명으로 옳은 것은?","c":["소방서장은 수산용으로 필요한 난방시설을 위한 지정수량 20배의 저장소를 설치한 자에 대하여 제거 등 필요한 조치를 명할 수 있다","소방본부장은 주택의 난방시설(공동주택의 중앙난방시설은 제외한다)을 위한 취급소를 설치한 자에 대하여 제거 등 필요한 조치를 명할 수 있다.","시ㆍ도지사는 축산용으로 필요한 난방시설을 위한 지정수량 20배의 저장소를 설치한 자에 대하여 제거 등 필요한 조치를 명할 수 있다","소방서장은 농예용으로 필요한 건조시설을 위한 지정수량 30배의 저장소를 설치한 자에 대하여 제거 등 필요한 조치를 명할 수 있다"],"a":4,"inc":false,"unit":"3-9"},{"id":"gwallisa-2018-04-28-76","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":76,"q":"물과 반응하여 수산화나트륨을 발생하는 무기과산화물은?","c":["중크롬산나트륨","과망간산나트륨","과산화나트륨","과염소산나트륨"],"a":3,"inc":false,"unit":"3-2"},{"id":"gwallisa-2018-04-28-81","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":81,"q":"아세트알데히드에 관한 설명으로 옳지 않은 것은?","c":["공기 중에서 산화되면 에틸알코올이 생성된다","강산화제와 접촉 시 혼촉발화의 위험성이 있다","인화점이 낮아 상온에서 인화히기 쉬운 물질이다.","구리, 은, 마그네슘과 반응하여 폭발성 물질을 생성한다."],"a":1,"inc":false,"unit":"1-1"},{"id":"gwallisa-2018-04-28-83","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":83,"q":"제 4류 위험물에 관한 설명으로 옳지 않은 것은?","c":["클레오소트유는 콜타르를 증류하여 제조하며 나프탈렌과 안트라센을 포함한 혼합물이다.","콜로디온은 용제인 에탄올과 에테르가 증발하고 나면 제6류 위험물과 같은 산화성을 나타낸다.","이황화탄소는 액체비중이 물보다 크며 완전연소 시 이산화황과 이산화탄소가 생성된다.","이소프로필알코올은 25℃ 에서 인화의 위험이 있고 증기는 공기보다 무거워 낮은 곳에 체류한다."],"a":2,"inc":false,"unit":"6-2"},{"id":"gwallisa-2018-04-28-89","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":89,"q":"위험물안전관리법령상 위험물을 취급하는 제조소 건축물의 지붕을 내화구조로 할 수 있는 것은?","c":["과염소산","과망간산칼륨","부틸리튬","산화프로필렌"],"a":1,"inc":false,"unit":"2-3"},{"id":"gwallisa-2018-04-28-93","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":93,"q":"위험물안전관리법령상 지하탱크저장소의 기준에 관한 설명으로 옳은 것은? (단. 이중벽탱크와 특수누설방지구조는 제외한다.)","c":["지하저장탱크의 윗부분은 지면으로부터 0,5m 이상 아래에 있어야 한다.","지하저장탱크와 탱크전용실의 안쪽과의 사이는 5cm 이상의 간격을 유지하도록 한다.","지하저장탱크는 용량이 1,500 L 이하일 때 탱크의 최대 직경은 1,067mm, 강철판의 최소두께는 4.24mm로 한다.","철근콘크리트 구조인 탱크전용실의 벽. 바닥 및 뚜껑은 두께 0.3m 이상으로 하고 그 내부에는 직경 9mm부터 13mm까지의 철근을 가로 및 세로로 5cm 부터 20cm까지의 간격으로 배치한다."],"a":4,"inc":false,"unit":"3-9"},{"id":"gwallisa-2018-04-28-96","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":96,"q":"위험물안전관리법령상 위험물저장소의 전축물 외벽이 내화구조이고 연면적이 900 m2인 경우, 소화설비의 설치기준에 의한 소화설비 소요단위의 계산값은?","c":["6","9","12","18"],"a":1,"inc":false,"unit":"2-3"},{"id":"gwallisa-2018-04-28-101","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":101,"q":"소화기구 및 자동소화장치의 화재안전기준상 상업용 주방자동소화장치의 설치기준이 아닌 것은?","c":["소화장치는 조리기구의 종류 별로 성능인증 받은 설계 매뉴얼에 적합하게 설치 할 것","감지부는 성능인증 받는 유효높이 및 위치에 설치할 것","차단장치(전기 또는 가스)는 상시 확인 및 점검이 가능하도록 설치할 것","수신부는 주위의 열기류 또는 습기 등과 주위온도에 영향을 받지 아니하고 사용자가 상시 볼 수 있는 장소에 설치할 것"],"a":4,"inc":false,"unit":"4-5"},{"id":"gwallisa-2018-04-28-102","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":102,"q":"펌프의 제원이 전양정 50m, 유량 6 m3/min, 4극 유도전동기, 60 Hz, 슬립 3% 일 때, 비속도는 약 얼마인가?","c":["210.11","214.60","227.45","235.31"],"a":3,"inc":false,"unit":"4-4"},{"id":"gwallisa-2018-04-28-104","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":104,"q":"특별피난계단의 계단실 및 부속실 제연설비의 화재안전기준상 제연구획에 대한 급기 기준으로 옳지 않은 것은?","c":["계단실 및 부속실을 동시에 제연하는 경우 계단실에 대하여는 그 부속실의 수직풍도를 통해 급기할 수 있다","하나의 수직풍도마다 전용의 송풍기로 급기할 것","부속실을 제연하는 경우 동일수직선상에 2대 이상의 급기송풍기가 설치되는 경우에는 수직풍도를 분리하여 설치할 수 있다","계단실을 제연하는 경우 전용수직풍도 설치하거나 부속실에 급기풍도를 직접 연결하여 급기하는 방식으로 할 것"],"a":4,"inc":false,"unit":"7-8"},{"id":"gwallisa-2018-04-28-105","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":105,"q":"연결송수관설비의 화재안전기준상 배관 등의 설치기준으로 옳지 않은 것은?","c":["지상 11층 이상인 특정소방대상물에 있어서는 습식설비로 할 것","주배관의 구경은 100mm 이상의 것으로 할 것","연결송수관설비의 배관은 주배관의 구경이 100mm 이상인 옥내소화전설비ㆍ스프링클러설비 또는 물분무등소화설비의 배관과 겸용할 수 있다","배관 내 사용압력이 1.2MPa이상일 경우에는 일반배관용 스테인리스강관(KS D 3595) 또는 배관용 스테인리스강관(KS D 3576)을 사용한다."],"a":4,"inc":false,"unit":"4-6"},{"id":"gwallisa-2018-04-28-108","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":108,"q":"4단 펌프의 수평 회전축 소화펌프를 운전하면서 물의 압력을 측정하였더니 흡입측 압력이 0.09 MPa, 토출측 압력이 0.98MPa 이었다. 이 펌프 1단의 임펠러에 가해지는 토출압력은(MPa)은 약 얼마인가?","c":["0.13","0.16","0.19","0.21"],"a":2,"inc":false,"unit":"4-4"},{"id":"gwallisa-2018-04-28-109","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":109,"q":"피난기구의 화재안전기준의 설치장소별 피난기구 적응성에서 4층 이상 10층 이하의 노유자시설에 설치할 수 있는 피난기구로 묶인 것은?","c":["구조대, 미끄럼대","피난교, 승강식피난기","구조대, 승강식피난기","피난교, 완강기"],"a":2,"inc":false,"unit":"7-3"},{"id":"gwallisa-2018-04-28-110","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":110,"q":"유도등 및 유도표지의 화재안전기준상 축광식 피난유도선의 설치기준에 관한 설명으로 옳지 않은 것은?","c":["바닥으로부터 높이 50cm 이하의 위치 또는 바닥 면에 설치할 것","구획된 각 실로부터 주출입구 또는 비상구까지 설치할 것","피난유도 표시부는 1m 이내의 간격으로 연속되도록 설치 할 것","외광 또는 조명장치에 의하여 상시 조명이 제공되거나 비상조명등에 의한 조명이 제공되도록 설치 할 것"],"a":3,"inc":false,"unit":"7-4"},{"id":"gwallisa-2018-04-28-113","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":113,"q":"스프링클러설비가 설치된 복합건축물로서 배관 길이 80m, 관경 100 mm, 마찰손실계수 0.03인 배관을 통해 높이 60m 까지 소화수를 공급할 경우, 펌프의 이론 소요동력(kW)은 약 얼마인가? (단, 펌프효율 : 0.8.전달계수: 1.15, 중력가속도 : 9.8m/s2, 헤드의 방수압 : 10mAq, π : 3.14, 헤드는 표준형이다.)","c":["47.28","52.28","57.28","62.28"],"a":3,"inc":false,"unit":"4-7"},{"id":"gwallisa-2018-04-28-114","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":114,"q":"비상콘센트설비의 화재안전기준상 전원 및 콘센트 등 설치기준으로 옳지 않은 것은?","c":["지하층을 포함한 층수가 7층 이상으로 연면적 2,000m2 이상인 소방대상물에 설치하는 비상콘센트설비는 자가발전설비를 비상전원으로 설치한다.","하나의 전용회로에 설치하는 비상콘센트는 10개 이하로 할 것","비상콘센트용의 풀박스 등은 방청도장을 한 것으로서, 두께 1.6mm 이상의 철판으로 할 것","비상콘센트설비의 전원회로는 단상교류 220V 인 것으로서, 그 공급용량은 1.5kVA 이상인 것으로 할 것"],"a":1,"inc":false,"unit":"9-9"},{"id":"gwallisa-2018-04-28-115","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":115,"q":"자동화재탐지설비 및 시각경보장치의 화재안전기준상 광전식분리형감지기의 설치 기준으로 옳은 것은?","c":["광축은 나란한 벽으로부터 0.6m 이상 이격하여 설치할 것","광축의 높이는 천장 등 높이의 60% 이상으로 할 것","감지기의 송광부와 수광부는 설치된 뒷벽으로부터 30cm 이내 위치에 설치할 것","감지기의 수평면은 햇빛이 잘 비추는 곳으로 놓이도록 설치할 것"],"a":1,"inc":false,"unit":"8-7"},{"id":"gwallisa-2018-04-28-116","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2018-04-28","num":116,"q":"자동화재탐지설비 및 시각경보장치의 화재안전기준상 수신기 설치기준으로 옳은 것은?","c":["6층 이상의 소방대상물에는 발신기와 전화통화가 가능한 수신기를 설치할
