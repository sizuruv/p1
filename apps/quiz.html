catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":45,"q":"특정소방대상물의 증축 되는 경우 기존 부분에 대해서 증축 당시의 소방시설의 설치에 관한 대통령령 또는 화재안전기준을 적용하지 않는 경우가 아닌 것은?","c":["증축으로 인하여 천장∙바닥∙벽 등에 고정되어 있는 가연성 물질의 양이 줄어드는 경우","자동차 생산공장 등 화재 위험이 낮은 특정소방대상물 내부에 연면적 33m2이하의 직원 휴게실을 증축하는 경우","기존 부분과 증축 부분이 갑종 방화문(국토교통부장관이 정하는 기준에 적합한 자동방화셔터를 포함)으로 구획되어 있는 경우","자동차 생산공장 등 화재 위험이 낮은 특정소방대상물에 캐노피(3면 이상에 벽이 없는 구조의 캐노피)를 설치하는 경우"],"a":1,"inc":false,"unit":"2-2"},{"id":"gisa-2017-03-05-48","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":48,"q":"성능위주설계를 실시하여야 하는 특정소방대상물의 범위 기준으로 틀린 것은?(2022년 11월 29일 개정된 규정 적용됨)","c":["연면적 200000m2 이상인 특정소방대상물(아파트등은 제외)","지하층을 포함한 층수가 30층 이상인 특정소방대상물(아파트등은 제외)","건축물의 높이가 120m 이상인 특정소방대상물(아파트등은 제외)","하나의 건축물에 영화상영관이 5개 이상인 특정소방대상물"],"a":4,"inc":false,"unit":"2-3"},{"id":"gisa-2017-03-05-50","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":50,"q":"대통령령 또는 화재안전기준이 변경되어 그 기준이 강화되는 경우에 기존 특정소방 대상물의 소방시설에 대하여 변경으로 강화된 기준을 적용하여야 하는 소방시설은?","c":["비상경보설비","비상콘센트설비","비상방송설비","옥내소화전설비"],"a":1,"inc":false,"unit":"4-6"},{"id":"gisa-2017-03-05-53","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":53,"q":"대통령령으로 정하는 특정소방대상물 소방시설 공사의 완공검사를 위하여 소방본부장이나 소방서장의 현장확인 대상 범위가 아닌 것은?","c":["문화 및 집회시설","수계 소화설비가 설치되는 것","연면적 10000m2 이상이거나 11층 이상인 특정소방대상물(아파트는 제외)","가연성가스를 제조∙저장 또는 취급하는 시설 중 지상에 노출된 가연성가스탱크의 저장용량 합계가 1000톤 이상인 시설"],"a":2,"inc":false,"unit":"3-1"},{"id":"gisa-2017-03-05-54","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":54,"q":"관계인이 예방규정을 정하여야 하는 제조소등의 기준이 아닌 것은?","c":["지정수량의 10배 이상의 위험물을 취급하는 제조소","지정수량의 50배 이상의 위험물을 저장하는 옥외저장소","지정수량의 150배 이상의 위험물을 저장하는 옥내저장소","지정수량의 200배 이상의 위험물을 저장하는 옥외탱크저장소"],"a":2,"inc":false,"unit":"3-9"},{"id":"gisa-2017-03-05-56","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":56,"q":"소화난이도등급 Ⅲ인 지하탱크저장소에 설치 하여야 하는 소화설비의 설치기준으로 옳은 것은?","c":["능력단위 수치가 3 이상의 소형 수동식소화기등 1개 이상","능력단위 수치가 3 이상의 소형 수동식소화기등 2개 이상","능력단위 수치가 2 이상의 소형 수동식소화기등 1개 이상","능력단위 수치가 2 이상의 소형 수동식소화기등 2개 이상"],"a":2,"inc":false,"unit":"3-10"},{"id":"gisa-2017-03-05-59","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":59,"q":"소방시설기준 적용의 특례 중 특정소방대상물의 관계인이 소방시설을 갖추어야 함에도 불구하고 관련 소방시설을 설치하지 아니할 수 있는 소방시설의 범위로 옳은 것은?(단, 화재 위험도가 낮은 특정소방대상물로서 석재, 불연성금속, 불연성 건축재료 등의 가공공장∙기계조립공장∙주물공장 도는 불연성 물품을 저장하는 창고이다.)","c":["옥외소화전 및 연결살수설비","연결송수관설비 및 상수도소화용수설비","자동화재탐지설비, 상수도소화용수설비 및 연결살수설비","스프링클러설비, 상수도소화용수설비 및 연결살수설비"],"a":1,"inc":false,"unit":"4-7"},{"id":"gisa-2017-03-05-61","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":61,"q":"옥내소화전설비 수원을 산출된 유효수량 외에 유효수량의 1/3 이상을 옥상에 설치해야 하는 경우는?","c":["지하층만 있는 건축물","건축물의 높이가 지표면으로부터 15m인 경우","수원이 건축물의 최상층에 설치된 방수구보다 높은 위치에 설치된 경우","주펌프와 동등 이상의 성능이 있는 별도의 펌프로서 내연기관의 기동돠 연동하여 작동되거나 비상전원을 연결하여 설치한 경우"],"a":2,"inc":false,"unit":"4-6"},{"id":"gisa-2017-03-05-67","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":67,"q":"물분무소화설비를 설치하는 차고 또는 주차장의 배수설비 설치기준으로 틀린 것은?","c":["차량이 주차하는 바닥은 배수구를 향해 1/100 이상의 기울기를 유지할 것","배수구에서 새어나온 기름을 모아 소화할 수 있도록 길이 40m 이하마다 집수관, 소화핏트등 기름분리장치를 설치 할 것","차량이 주차하는 장소의 적당한 곳에 높이 10cm 이상의 경계턱으로 배수구를 설치할 것","배수설비는 가압송수장치의 최대송수능력의 수량을 유효하게 배수살 수 있는 크기 및 기울기로 할 것"],"a":1,"inc":false,"unit":"4-10"},{"id":"gisa-2017-03-05-68","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":68,"q":"스프링클러설비 배관의 설치기준으로 틀린 것은?","c":["급수배관의 구경은 수리계산에 따르는 경우 가지배관의 유속은 6m/s, 그 밖의 배관의 유속은 10m/s를 초과할 수 없다.","연결송수관설비의 배관과 겸용할 경우의 주배관은 구경 100mm 이상, 방수구로의 연결되는 배관의 구경은 65mm 이상의 것으로 하여야 한다.","수직배수배관의 구경은 50mm 이상으로 하여야 한다.","가지배관에는 헤드의 설치지점 사이마다 1개 이상의 행가를 설치하되, 헤드간의 거리가 4.5m를 초과하는 경우에는 4.5m 이내마다 1개 이상 설치해야 한다."],"a":4,"inc":false,"unit":"4-7"},{"id":"gisa-2017-03-05-74","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":74,"q":"110kV 초과 154kV 이하의 고압전기기기와 물분무헤드 사이에 최소 이격거리는 몇 cm 인가?","c":["110","150","180","210"],"a":2,"inc":false,"unit":"4-10"},{"id":"gisa-2017-03-05-75","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":75,"q":"특정소방대상물의 용도 및 장소별로 설치해야 할 인명구조기구의 기준으로 틀린 것은?","c":["지하가 중 지하상가는 인공소생기를 층마다 2개 이상 비치할 것","판매시설 중 대규모 점포는 공기호흡기를 층마다 2개 이상 비치할 것","지하층을 포함하는 층수가 7층 이상인 관광호텔은 방열복, 공기호흡기, 인공소생기를 각 2개 이상 비치할 것","물분무등소화설비 중 이산화탄소 소화설비를 설치해야 하는 특정소방대상물은 공기호흡기를 이산화탄소 소화설비가 설치된 장소의 출입구 인근에 1대 이상 비치할 것"],"a":1,"inc":false,"unit":"6-2"},{"id":"gisa-2017-03-05-77","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":77,"q":"물분무소화설비의 설치 장소별 1m2에 대한 수원의 최소 저수량으로 옳은 것은?","c":["케이블트레이: 12L/min×20분×투영된 바닥면적","절연유 봉입 변압기: 15L/min×20분×바닥 부분을 제외한 표면적을 합한 면적","차고: 30L/min×20분×바닥면적","콘베이어 벨트: 37L/min×20분×벨트부분의 바닥면적"],"a":1,"inc":false,"unit":"4-10"},{"id":"gisa-2017-03-05-78","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":78,"q":"개방형스프링클러설비의 일제개방밸브가 하나의 방수구역을 담당하는 헤드의 최대 개수는?(단, 2개 이상의 방수구역으로 나눌 경우는 제외한다.)","c":["60","50","30","25"],"a":2,"inc":false,"unit":"4-7"},{"id":"gisa-2017-03-05-79","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-03-05","num":79,"q":"분말소화설비의 저장용기에 설치된 밸브 중 잔압 방출 시 개방∙폐쇄 상태로 옳은 것은?","c":["가스도입밸브 – 폐쇄","주밸브(방출밸브) - 개방","배기밸브 – 폐쇄","클리닝밸브 – 개방"],"a":1,"inc":false,"unit":"6-1"},{"id":"gisa-2017-05-07-1","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":1,"q":"다음 중 열전도율이 가장 작은 것은?","c":["알루미늄","철재","은","암면(광물섬유)"],"a":4,"inc":false,"unit":"1-7"},{"id":"gisa-2017-05-07-3","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":3,"q":"건물화재의 표준시간-온도곡선에서 화재발생 후 1시간이 경과할 경우 내부 온도는 약 몇 ℃ 정도 되는가?","c":["225","625","840","925"],"a":4,"inc":false,"unit":"2-3"},{"id":"gisa-2017-05-07-4","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":4,"q":"건축물의 피난동선에 대한 설명으로 틀린 것은?","c":["피난동선은 가급적 단순한 형태가 좋다.","피난동선은 가급적 상호 반대방향으로 다수의 출구와 연결되는 것이 좋다.","피난동선은 수평동선과 수직동선으로 구분된다.","피난동선은 복도, 계단을 제외한 엘리베이터와 같은 피난전용의 통행구조를 말한다."],"a":4,"inc":false,"unit":"7-1"},{"id":"gisa-2017-05-07-6","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":6,"q":"내화구조의 기준 중 벽의 경우 벽돌조로서 두께가 최소 몇 cm 이상이어야 하는가?","c":["5","10","12","19"],"a":4,"inc":false,"unit":"2-3"},{"id":"gisa-2017-05-07-10","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":10,"q":"화재의 소화원리에 따른 소화방법의 적용으로 틀린 것은?","c":["냉각소화 : 스프링클러설비","질식소화 : 이산화탄소 소화설비","제거소화 : 포소화설비","억제소화 : 할로겐화합물 소화설비"],"a":3,"inc":false,"unit":"4-7"},{"id":"gisa-2017-05-07-13","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":13,"q":"동식물유류에서 “요오드값이 크다.” 라는 의미를 옳게 설명한 것은?","c":["불포화도가 높다.","불건성유이다.","자연발화성이 낮다.","산소와의 결합이 어렵다."],"a":1,"inc":false,"unit":"1-1"},{"id":"gisa-2017-05-07-15","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":15,"q":"에테르, 케톤. 에스테르, 알데히드, 카르복실산. 아민 등과 같은 가연성인 수용성 용매에 유효한포 소화약제는?","c":["단백포","수성막포","불화단백포","내알콜포"],"a":4,"inc":false,"unit":"5-1"},{"id":"gisa-2017-05-07-16","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":16,"q":"화재 시 이산화탄소를 사용하여 화재를 진압 하려고 할 때 산소의 농도를 13vol%로 낮추어 화재를 진압하려면 공기 중 이산화탄소의 농도는 약 몇 vol%가 되어야 하는가?","c":["18.1","28.1","38.1","48.1"],"a":3,"inc":false,"unit":"6-2"},{"id":"gisa-2017-05-07-17","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":17,"q":"유류탱크에 화재 시 발생하는 슬롭오버(Slop over)현상에 관한 설명으로 틀린 것은?","c":["소화 시 외부에서 방사하는 포에 의해 발생한다.","연소유가 비산되어 탱크 외부까지 화재가 확산된다.","탱크의 바닥에 고인 물의 비등 팽창에 의해 발생한다.","연소면의 온도가 100℃ 이상일 때 물을 주수하면 발생된다."],"a":3,"inc":false,"unit":"1-19"},{"id":"gisa-2017-05-07-18","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":18,"q":"가연물이 연소가 잘 되기 위한 구비조건으로 틀린 것은?","c":["열전도율이 클 것","산소와 화학적으로 친화력이 클 것","표면적이 클 것","활성화에너지가 작을 것"],"a":1,"inc":false,"unit":"1-5"},{"id":"gisa-2017-05-07-19","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":19,"q":"주성분이 인산염류인 제3종 분말소화약제가 다른 분말소화약제와 다르게 A급 화재에 적용할 수 있는 이유는?","c":["열분해 생성물인 CO2가 열을 흡수하므로 냉각에 의하여 소화된다.","열분해 생성물인 수증기가 산소를 차단하여 탈수작용 한다.","열분해 생성물인 메타인산(HPO3)이 산소의 차단 역할을 하므로 소화가 된다.","열분해 생성물인 암모니아가 부촉매 작용을 하므로 소화가 된다."],"a":3,"inc":false,"unit":"6-1"},{"id":"gisa-2017-05-07-22","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":22,"q":"압력의 변화가 없을 경우 0℃의 이상기체는 약 몇 ℃가 되면 부피가 2배로 되는가?","c":["273℃","373℃","546℃","646℃"],"a":1,"inc":false,"unit":"14-2"},{"id":"gisa-2017-05-07-35","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":35,"q":"온도가 37.5℃인 원유가 0.3m3/ s의 유량으로 원관에 흐르고 있다. 레이놀즈수가 2100일 때, 관의 지름은 약 몇 m인가? (단, 원유의 동점성계수는 6x10-5m2/s이다.)","c":["1.25","2.45","3.03","4.45"],"a":3,"inc":false,"unit":"4-3"},{"id":"gisa-2017-05-07-38","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":38,"q":"분당 토출량이 1600L, 전양정이100m인 물 펌프의 회전수를 1000rpm에서 1400rpm으로 증가하면 전동기 소요동력은 약 몇 kW가 되어야 하는가? (단, 펌프의 효율은 65%이고, 전달계수는 1.1이다.)","c":["441","82.1","121","142"],"a":3,"inc":false,"unit":"4-4"},{"id":"gisa-2017-05-07-39","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":39,"q":"펌프의 공동현상(cavitation)을 방지하기 위한 방법이 아닌 것은?","c":["펌프의 설치 위치를 되도록 낮게 하여 흡입 양정을 짧게 한다.","단흡입펌프보다는 양흡입펌프를 사용한다.","펌프의 흡입 관경을 크게 한다.","펌프의 회 전수를 크게 한다."],"a":4,"inc":false,"unit":"4-4"},{"id":"gisa-2017-05-07-44","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":44,"q":"위험물안전관리법령상 제조소등의 완공검사 신청 시기 기준으로 틀린 것은?","c":["지하탱크가 있는 제조소등의 경우에는 당해 지하탱크를 매설하기 전","이동탱크저장소의 경우에는 이동저장탱크를 완공하고 상치장소를 확보한 후","이송취급소의 경우에는 이송배관 공사의 전체 또는 일부 완료한 후","배관을 지하에 설치하는 경우에는 소방서장이 지정하는 부분을 매몰하고 난 직후"],"a":4,"inc":false,"unit":"3-9"},{"id":"gisa-2017-05-07-46","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":46,"q":"방시설공사업법령상 하자를 보수하여야 하는 소방시설과 소방시설별 하자보수 보증기간으로 옳은 것은?","c":["유도등 : 1년","자동소화장치 : 3년","자동화재탐지설비 : 2년","상수도소화용수설비 : 2년"],"a":2,"inc":false,"unit":"7-4"},{"id":"gisa-2017-05-07-51","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":51,"q":"화재위험도가 낮은 특정소방대상물 중 소방대가 조직되어 24시간 근무하고 있는 청사 및 차고에 설치하지 아니할 수 있는 소방시설이 아닌 것은?(관련 규정 개정전 문제로 여기서는 기존 정답인 1번을 누르면 정답 처리됩니다. 자세한 내용은 해설을 참고하세요.)","c":["자동화재탐지설비","연결송수관설비","피난기구","비상방송설비"],"a":1,"inc":false,"unit":"7-3"},{"id":"gisa-2017-05-07-53","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":53,"q":"소방시설공사업법령상 특정소방대상물에 설치된 소방시설등을 구성하는 것의 전부 또는 일부를 개설, 이전 또는 정비하는 공사의 경우 소방시설공사의 착공신고 대상이 아닌 것은? (단, 고장 또는 파손 등으로 인하여 작동시킬 수 없는 소방시설을 긴급히 교체하거나 보수하여야 하는 경우는 제외한다.)","c":["수신반","소화펌프","동력(감시)제어반","압력챔버"],"a":4,"inc":false,"unit":"4-4"},{"id":"gisa-2017-05-07-61","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":61,"q":"소방설비용헤드의 분류 중 수류를 살수판에 충돌하여 미세한 물방울을 만드는 물분무 헤드는?","c":["디프렉타형","충돌형","슬리트형","분사형"],"a":1,"inc":false,"unit":"4-10"},{"id":"gisa-2017-05-07-62","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":62,"q":"물분무소화설비의 가압송수장치의 설치기준 중 틀린 것은? (단, 전동기 또는 내연기관에 따른 펌프를 이용하는 가압송수장치이다.)","c":["기동용수압개폐장치를 기동장치로 사용할 경우에 설치하는 충압펌프의 토출압력은 가압송수장치의 정격 토출압력과 같게 한다.","가압송수장치가 기동된 경우에는 자동으로 정지되도록 한다.","기동용수압개폐장치(압력챔버)를 사용할 경우 그 용적은 100L 이상으로 한다.","수원의 수위가 펌프보다 낮은 위치에 있는 가압송수장치에는 물올림 장치를 설치한다."],"a":2,"inc":false,"unit":"4-10"},{"id":"gisa-2017-05-07-63","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":63,"q":"건축물의 층수가 40층인 특별피난계단의 계단실 및 부속실 제연설비의 비상전원은 몇 분 이상 유효하게 작동할 수 있어야 하는가?","c":["20","30","40","60"],"a":3,"inc":false,"unit":"7-8"},{"id":"gisa-2017-05-07-66","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":66,"q":"이산화탄소 소화설비 기동장치의 설치기준으로 옳은 것은?","c":["가스압력식 기동장치 기동용가스용기의 용적은 3L 이상으로 한다.","전기식 기동장치로서 5병의 저장용기를 동시에 개방하는 설비는 2병 이상의 저장 용기에 전자개방밸브를 부착해야 한다.","수동식 기동장치는 전역방출방식에 있어서 방호대상물마다 설치한다.","수동식 기동장치의 부근에는 방출지연을 위한 비상스위치를 설치해야 한다."],"a":4,"inc":false,"unit":"6-2"},{"id":"gisa-2017-05-07-67","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":67,"q":"연결살수설비의 배관에 관한 설치기준 중 옳은 것은?","c":["개방형헤드를 사용하는 연결살수설비의 수평주행배관은 헤드를 향하여 상향으로 100분의 5 이상의 기울기로 설치한다.","가지배관 또는 교차배관을 설치하는 경우에는 가지배관의 배열은 토너멘트 방식이어야 한다.","교차배관에는 가지배관과 가지배관사이마다 1개 이상의 행가를 설치하되, 가지배관 사이의 거리가 4.5m를 초과하는 경우에는 4.5m 이내마다 1개 이상 설치한다.","가지배관은 교차배관 또는 주배관에서 분기되는 지점을 기점으로 한 쪽 가지배관에 설치되는 헤드의 개수는 6개 이하로 하여야 한다."],"a":3,"inc":false,"unit":"4-11"},{"id":"gisa-2017-05-07-68","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":68,"q":"스프링클러설비의 교차배관에서 분기되는 지점을 기점으로 한쪽 가지배관에 설치되는 헤드의 개수는 최대 몇 개 이하인가? (단, 방호구역 안에서 칸막이 등으로 구획하여 헤드를 증설하는 경우와 격자형 배관방식을 채택하는 경우는 제외한다.)","c":["8","10","12","15"],"a":1,"inc":false,"unit":"4-11"},{"id":"gisa-2017-05-07-70","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":70,"q":"물분무소화설비 송수구의 설치기준 중 틀린 것은?","c":["구경 65㎜ 의 쌍구형으로 할 것","지면으로부터 높이가 0.5m 이상 1m 이하의 위치에 설치할 것","가연성가스의 저장·취급시설에 설치하는 송수구는 그 방호대상물로부터 20m 이상의 거리를 두거나 방호대상물에 면하는 부분이 높이 1.5m 이상, 폭 2.5m 이상의 철근콘크리트 벽으로 가려진 장소에 설치할 것","송수구는 하나의 층의 바닥면적이 1500m2를 넘을 때마다 1개(5개를 넘을 경우에는 5개로 한다.) 이상을 설치할 것"],"a":4,"inc":false,"unit":"4-10"},{"id":"gisa-2017-05-07-71","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":71,"q":"분말소화약제 저장용기의 설치기준으로 틀린 것은?","c":["설치장소의 온도가 40°C 이하이고, 온도변화가 적은 곳에 설치할 것","용기간의 간격은 점검에 지장이 없도록 5㎝ 이상의 간격을 유지할 것","저장용기의 충전비는 0.8 이상으로 할 것","저장용기에는 가압식은 최고사용압력의 1.8배 이하, 축압식은 용기의 내압시험압력의 0.8배 이하의 압력에서 작동하는 안전밸브를 설치 할 것"],"a":2,"inc":false,"unit":"6-1"},{"id":"gisa-2017-05-07-72","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":72,"q":"국소방출방식의 분말소화설비 분사해드는 기준저장량의 소화약제를 몇 초 이내에 방사할 수 있는 것이어야 하는가?","c":["60","30","20","10"],"a":2,"inc":false,"unit":"6-1"},{"id":"gisa-2017-05-07-73","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":73,"q":"축압식 분말소화기 지시압력계의 정상 사용압력 범위 중 상한 값은?","c":["0.68MPa","0.78MPa","0.88MPa","0.98MPa"],"a":4,"inc":false,"unit":"4-5"},{"id":"gisa-2017-05-07-74","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":74,"q":"노유자시설의 3층에 적응성을 가진 피난기구가 아닌 것은?","c":["미끄럼대","피난교","구조대","간이완강기"],"a":4,"inc":false,"unit":"7-3"},{"id":"gisa-2017-05-07-75","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":75,"q":"연소할 우려가 있는 개구부에 드렌처설비를 설치한 경우 해당 개구부에 한하여 스프링클러 헤드를 설치하지 아니할 수 있는 기준으로 틀린 것은?","c":["드렌처헤드는 개구부 위 측에 2.5m 이내마다 1개를 설치할 것","제어밸브는 특정소방대상물 층마다에 바닥면으로 부터 0.5 m 이상 1.5m 이하의 위치에 설치할 것","드렌처헤드가 가장 많이 설치된 제어밸브에 설치된 드렌처헤드를 동시에 사용하는 경우에 각 헤드선단의 방수량은 80L/min 이상이 되도록 할 것","드렌처헤드가 가장 많이 설치된 제어밸브에 설치된 드렌처헤드를 동시에 사용하는 경우에 각 헤드선단의 방수압력은 0.1MPa 이상이 되도록 할 것"],"a":2,"inc":false,"unit":"2-2"},{"id":"gisa-2017-05-07-79","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-05-07","num":79,"q":"연결송수관설비의 가압송수장치의 설치기준으로 틀린 것은? (단, 지표면에서 최상층 방수구의 높이가 70m 이상의 특정소방대상물이다.)","c":["펌프의 양정은 최상층에 설치된 노즐선단의 압력이 0.35MPa 이상의 압력이 되도록 할 것","계단식 아파트의 경우 펌프의 토출량은 1200L/min 이상이 되는 것으로 할 것","계단식 아파트의 경우 해당 층에 설치된 방수구가 3개를 초과하는 것은 1개마다 400L/min을 가산한 양이 펌프의 토출량이 되는 것으로 할 것","내연기관을 사용하는 경우(층수가 30층 이상 49층 이하) 내연기관의 연료량은 20분 이상 운전할 수 있는 용량일 것"],"a":4,"inc":false,"unit":"4-6"},{"id":"gisa-2017-09-23-1","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":1,"q":"건축물에 설치하는 방화벽의 구조에 대한 기준 중 틀린 것은?","c":["내화구조로서 홀로 설 수 있는 구조이어야 한다.","방화벽의 양쪽 끝은 지붕면으로부터 0.2m 이상 튀어 나오게 하여야 한다.","방화벽의 위쪽 끝은 지붕면으로부터 0.5m 이상 튀어 나오게 하여야 한다.","방화벽에 설치하는 출입문은 너비 및 높이가 각각 2.5m 이하인 갑종방화문을 설치하여야 한다."],"a":2,"inc":false,"unit":"2-2"},{"id":"gisa-2017-09-23-3","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":3,"q":"폭발의 형태 중 화학적 폭발이 아닌 것은?","c":["분해폭발","가스폭발","수증기폭발","분진폭발"],"a":3,"inc":false,"unit":"1-20"},{"id":"gisa-2017-09-23-4","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":4,"q":"이산화탄소 20g은 몇 mol인가?","c":["0.23","0.45","2.2","4.4"],"a":2,"inc":false,"unit":"6-2"},{"id":"gisa-2017-09-23-5","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":5,"q":"FM200이라는 상품명을 가지며 오존파괴 지수(ODP)가 0인 할론 대체 소화약제는 무슨 계열인가?","c":["HFC 계열","HCFC 계열","FC 계열","Blend 계열"],"a":1,"inc":false,"unit":"6-4"},{"id":"gisa-2017-09-23-6","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":6,"q":"포소화약제 중 고팽창포로 사용할 수 있는 것은?","c":["단백포","불화단백포","내알코올포","합성계면활성제포"],"a":4,"inc":false,"unit":"5-1"},{"id":"gisa-2017-09-23-7","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":7,"q":"공기 중에서 자연발화 위험성이 높은 물질은?","c":["벤젠","톨루엔","이황화탄소","트리 에틸알루미늄"],"a":4,"inc":false,"unit":"1-1"},{"id":"gisa-2017-09-23-8","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":8,"q":"분말소화약제에 관한 설명 중 틀린 것은?","c":["제1종 분말은 담홍색 또는 황색으로 착색되어 있다.","분말의 고화를 방지하기 위하여 실리콘 수지 등으로 방습처리 한다.","일반화재에도 사용할 수 있는 분말소화약제는 제3종 분말이다.","제2종 분말의 열분해식은 2KHCO3 → K2CO3＋CO2＋H2O이다."],"a":1,"inc":false,"unit":"6-1"},{"id":"gisa-2017-09-23-9","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":9,"q":"화재의 종류에 따른 분류가 틀린 것은?","c":["A 급 : 일반화재","B 급 : 유류화재","C 급 : 가스화재","D급 : 금속화재"],"a":3,"inc":false,"unit":"1-17"},{"id":"gisa-2017-09-23-10","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":10,"q":"연소확대 방지를 위한 방화구획과 관계없는 것은?","c":["일반 승강기의 승강장 구획","층 또는 면적별 구획","용도별 구획","방화댐퍼"],"a":1,"inc":false,"unit":"2-1"},{"id":"gisa-2017-09-23-12","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":12,"q":"제3류 위험물로서 자연발화성만 있고 금수성이 없기 때문에 물속에 보관하는 물질은?","c":["염소산암모늄","황린","칼륨","질산"],"a":2,"inc":false,"unit":"1-1"},{"id":"gisa-2017-09-23-13","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":13,"q":"화재 시 소화에 관한 설명으로 틀린 것은?","c":["내알코올포 소화약제는 수용성용제의 화재에 적합하다.","물은 불에 닿을 때 증발하면서 다량의 열을 흡수하여 소화한다.","제3종 분말소화약제는 식용유화재에 적합하다.","할로겐화합물 소화약제는 연쇄반응을 억제하여 소화한다."],"a":3,"inc":false,"unit":"6-1"},{"id":"gisa-2017-09-23-14","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":14,"q":"고비점 유류의 탱크화재 시 열유층에 의해 탱크 아래의 물이 비등·팽창하여 유류를 탱크 외부로 분출시켜 화재를 확대시키는 현상은?","c":["보일 오버(Boil over)","롤 오버 (Roll over)","백 드래프트(Back draft)","플래시 오버(Flash over)"],"a":1,"inc":false,"unit":"1-13"},{"id":"gisa-2017-09-23-16","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":16,"q":"공기 중에서 연소범위가 가장 넓은 물질은?","c":["수소","이황화탄소","아세틸렌","에테르"],"a":3,"inc":false,"unit":"1-3"},{"id":"gisa-2017-09-23-17","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":17,"q":"휘발유의 위험성에 관한 설명으로 틀린 것은?","c":["일반적인 고체 가연물에 비해 인화점이 낮다.","상온에서 가연성 증기가 발생한다.","증기는 공기보다 무거워 낮은 곳에 체류한다.","물보다 무거워 화재발생 시 물분무소화는 효과가 없다."],"a":4,"inc":false,"unit":"1-1"},{"id":"gisa-2017-09-23-19","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":19,"q":"전기불꽃, 아크 등이 발생하는 부분을 기름 속에 넣어 폭발을 방지하는 방폭구조는?","c":["내압방폭구조","유입방폭구조","안전증방폭구조","특수방폭구조"],"a":2,"inc":false,"unit":"10-1"},{"id":"gisa-2017-09-23-25","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":25,"q":"체적이 0.1m3인 탱크 안에 절대압력이 1000kPa인 공기가 6.5kg/m3의 밀도로 채워져 있다. 시간이 t=0일 때 단면적이 70mm2인 1차원 출구로 공기가 300m/s의 속도로 빠져나가기 시작 한다면 그 순간에서의 밀도 변화율 kg/ (m3·s)은 약 얼마인가? (단, 탱크 안의 유체의 특성량은 일정하다고 가정한다.)","c":["-1.365","-1.865","-2.365","-2.865"],"a":1,"inc":false,"unit":"4-1"},{"id":"gisa-2017-09-23-26","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":26,"q":"모세관에 일정한 압력차를 가함에 따라 발생하는 층류 유동의 유량을 측정함으로써 유체의 점도를 측정할 수 있다. 같은 압력차에서 두 유체의 유량의 비 Q2/Q1=2이고, 밀도비 Ρ2/Ρ1=2일 때, 점성계수비 μ2/μ1은?","c":["1/4","1/2","1","2"],"a":2,"inc":false,"unit":"4-1"},{"id":"gisa-2017-09-23-29","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":29,"q":"열전달 면적이 A이고 온도 차이가 10℃, 벽의 열전도율이 10W/(m·k), 두께 25㎝인 벽을 통한 열류량은 100W이다. 동일한 열전달 면적에서 온도 차이가 2배, 벽의 열전도율이 4배가 되고 벽의 두께가 2배가 되는 경우 열류량은 약 몇 W인가?","c":["50","200","400","800"],"a":3,"inc":false,"unit":"1-7"},{"id":"gisa-2017-09-23-33","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":33,"q":"안지름이 13mm인 옥내소화전의 노즐에서 방출되는 물의 압력(계기압력)이 230kPa이라면 10분 동안의 방수량은 약 몇 m3인가?","c":["1.7","3.6","5.2","7.4"],"a":1,"inc":false,"unit":"4-6"},{"id":"gisa-2017-09-23-35","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":35,"q":"펌프의 공동현상(cavitation)을 방지하기 위한 대책으로 옳지 않은 것은?","c":["펌프의 설치높이를 될 수 있는 대로 높여서 흡입양정을 길게 한다.","펌프의 회전수를 낮추어 흡입 비속도를 적게 한다.","단흡입펌프보다는 양흡입펌프를 사용한다.","밸브, 플랜지 등의 부속품 수를 줄여서 손실수두를 줄인다."],"a":1,"inc":false,"unit":"4-4"},{"id":"gisa-2017-09-23-38","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":38,"q":"전양정 80m, 토출량 500L/min인 물을 사용하는 소화펌프가 있다. 펌프효율 65%, 전달계수(K) 1.1인 경우 필요한 전동기의 최소 동력은 약 몇 kW인가?","c":["9 kW","11 kW","13 kW","15 kW"],"a":2,"inc":false,"unit":"4-4"},{"id":"gisa-2017-09-23-41","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":41,"q":"대통령령으로 정하는 특정소방대상물의 소방시설 중 내진설계 대상이 아닌 것은?","c":["옥내소화전설비","스프링클러설비","미분무소화설비","연결살수설비"],"a":4,"inc":false,"unit":"13-1"},{"id":"gisa-2017-09-23-44","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":44,"q":"정기점검의 대상이 되는 제조소등이 아닌 것은?","c":["옥내탱크저장소","지하탱크저장소","이동탱크저장소","이송취급소"],"a":1,"inc":false,"unit":"3-9"},{"id":"gisa-2017-09-23-47","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":47,"q":"건축허가 등을 함에 있어서 미리 소방본부장 또는 소방서장의 동의를 받아야 하는 건축물 등의 범위기준이 아닌 것은?","c":["노유자시설 및 수련시설로서 연면적 100m2 이상인 건축물","지하층 또는 무창층이 있는 건축물로서 바닥면적이 150m2 이상인 층이 있는 것","차고·주차장으로 사용되는 바닥면적이 200m2 이상인 층이 있는 건축물이나 주차시설","장애인 의료재활시설로서 연면적 300m2 이상인 건축물"],"a":1,"inc":false,"unit":"7-2"},{"id":"gisa-2017-09-23-51","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2017-09-23","num":51,"q":"건축물의 공사 현장에 설치하여야 하는 임시소방시설과 기능 및 성능이 유사하여 임시소방시설을 설치한 것으로 보는 소방시설로 연결이 틀린 것은? (단, ,"unit":"5-1"},{"id":"gisa-2018-03-04-1","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":1,"q":"다음의 가연성 물질 중 위험도가 가장 높은 것은?","c":["수소","에틸렌","아세틸렌","이황화탄소"],"a":4,"inc":false,"unit":"3-1"},{"id":"gisa-2018-03-04-5","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":5,"q":"포소화약제가 갖추어야 할 조건이 아닌 것은?","c":["부착성이 있을 것","유동성과 내열성이 있을 것","응집성과 안정성이 있을 것","소포성이 있고 기화가 용이할 것"],"a":4,"inc":false,"unit":"5-1"},{"id":"gisa-2018-03-04-6","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":6,"q":"건축물 내 방화벽에 설치하는 출입문의 너비 및 높이의 기준은 각각 몇 m 이하인가?","c":["2.5","3.0","3.5","4.0"],"a":1,"inc":false,"unit":"2-2"},{"id":"gisa-2018-03-04-9","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":9,"q":"MOC(Minimum Oxygen Concentration : 최소 산소 농도)가 가장 작은 물질은?","c":["메탄","에탄","프로판","부탄"],"a":1,"inc":false,"unit":"1-4"},{"id":"gisa-2018-03-04-10","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":10,"q":"소화의 방법으로 틀린 것은?","c":["가연성 물질을 제거한다.","불연성 가스의 공기 중 농도를 높인다.","산소의 공급을 원활히 한다.","가연성 물질을 냉각시킨다."],"a":3,"inc":false,"unit":"3-1"},{"id":"gisa-2018-03-04-11","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":11,"q":"다음 중 발화점이 가장 낮은 물질은?","c":["휘발유","이황화탄소","적린","황린"],"a":4,"inc":false,"unit":"1-1"},{"id":"gisa-2018-03-04-12","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":12,"q":"탄화칼슘이 물과 반응 시 발생하는 가연성 가스는?","c":["메탄","포스핀","아세틸렌","수소"],"a":3,"inc":false,"unit":"3-1"},{"id":"gisa-2018-03-04-13","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":13,"q":"수성막포 소화약제의 특성에 대한 설명으로 틀린 것은?","c":["내열성이 우수하여 고온에서 수성막의 형성이 용이하다.","기름에 의한 오염이 적다.","다른 소화약제와 병용하여 사용이 가능하다.","불소계 계면활성제가 주성분이다."],"a":1,"inc":false,"unit":"5-1"},{"id":"gisa-2018-03-04-15","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":15,"q":"대두유가 침적된 기름걸레를 쓰레기통에 장시간 방치한 결과 자연발화에 의하여 화재가 발생한 경우 그 이유로 옳은 것은?","c":["분해열 축적","산화열 축적","흡착열 축적","발효열 축적"],"a":2,"inc":false,"unit":"1-1"},{"id":"gisa-2018-03-04-16","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":16,"q":"분진폭발의 위험성이 가장 낮은 것은?","c":["알루미늄분","유황","팽창질석","소맥분"],"a":3,"inc":false,"unit":"1-22"},{"id":"gisa-2018-03-04-19","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":19,"q":"위험물안전관리법령에서 정하는 위험물의 한계에 대한 정의로 틀린 것은?","c":["유황은 순도가 60 중량퍼센트 이상인 것","인화성고체는 고형알코올 그 밖에 1기압에서 인화점이 섭씨 40도 미만인 고객","과산화수소는 그 농도가 35 중량퍼센트 이상인 것","제1석유류는 아세톤, 휘발유 그 밖에 1기압에서 인화점이 섭씨 21도 미만인 것"],"a":3,"inc":false,"unit":"1-1"},{"id":"gisa-2018-03-04-22","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":22,"q":"관내에 흐르는 유체의 흐름을 구분하는데 사용되는 레이놀즈 수의 물리적인 의미는?","c":["관성력/중력","관성력/탄성력","관성력/압축력","관성력/점성력"],"a":4,"inc":false,"unit":"4-3"},{"id":"gisa-2018-03-04-28","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":28,"q":"비압축성 유체의 2차원 정상 유동에서 x방향의 속도를 u, y방향의 속도를 v라고 할 때 다음에 주어진 식들 중에서 연속 방정식을 만족하는 것은 어느 것인가?","c":["u＝2x＋2y, v＝2x-2y","u＝a＋2y, v＝x2-2y","u＝2x＋y, v＝x2＋2y","u＝x＋2y, v＝2x-y2"],"a":1,"inc":false,"unit":"4-2"},{"id":"gisa-2018-03-04-30","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":30,"q":"지름 10㎝인 금속구가 대류에 의해 열을 외부공기로 방출한다. 이때 발생하는 열전달량이 40W이고, 구 표면과 공기 사이의 온도차가 50℃라면 공기와 구 사이의 대류 열전달 계수(W/(m2·K))는 약 얼마인가?","c":["25","50","75","100"],"a":1,"inc":false,"unit":"1-7"},{"id":"gisa-2018-03-04-32","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":32,"q":"체적이 10m3인 기름의 무게가 30000N이라면 이 기름의 비중은 얼마인가? (단, 물의 밀도는 1000kg/m3이다.)","c":["0.153","0.306","0.459","0.612"],"a":2,"inc":false,"unit":"4-1"},{"id":"gisa-2018-03-04-35","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":35,"q":"초기 상태에서 압력 100kPa, 온도 15℃인 공기가 있다. 공기의 부피가 초기 부피의 1/20이 될 때까지 단열압축할 때 압축 후의 온도는 약 몇 ℃인가? (단, 공기의 비열비는 1.4이다.)","c":["54","348","682","912"],"a":3,"inc":false,"unit":"10-5"},{"id":"gisa-2018-03-04-39","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":39,"q":"부피가 0.3m3으로 일정한 용기 내의 공기가 원래 300kPa(절대압력), 400K의 상태였으나, 일정 시간동안 출구가 개방되어 공기가 빠져나가 200kPa(절대압력), 350K의 상태가 되었다. 빠져나간 공기의 질량은 약 몇 g인가? (단, 공기는 이상기체로 가정하며 기체상수는 287[J/(kg·K)]이다.)","c":["74","187","295","388"],"a":2,"inc":false,"unit":"14-2"},{"id":"gisa-2018-03-04-41","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":41,"q":"화재예방, 소방시설 설치·유지 및 안전관리에 관한 법령상 화재안전기준을 달리 적용하여야 하는 특수한 용도 또는 구조를 가진 특정 소방 대상물인 원자력 발전소에 설치하지 아니할 수 있는 소방시설은?","c":["물분무등소화설비","스프링클러설비","상수도소화용수설비","연결살수설비"],"a":4,"inc":false,"unit":"4-7"},{"id":"gisa-2018-03-04-50","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":50,"q":"위험물안전관리법령상 인화성액체위험물(이황화탄소를 제외)의 옥외탱크저장소의 탱크 주위에 설치하여야 하는 방유제의 설치 기준 중 틀린 것은?","c":["방유제 내의 면적은 60000m2 이하로 하여야 한다.","방유제는 높이 0.5m 이상 3m 이하, 두께 0.2 이상, 지하매설깊이 1m 이상으로 할 것. 다만, 방유제와 옥외저장탱크 사이의 지반면 아래에 불침윤성 구조물을 설치하는 경우에는 지하매설깊이를 해당 불침윤성 구조물까지로 할 수 있다.","방유제의 용량은 방유제 안에 설치된 탱크가 하나인 때에는 그 탱크 용량의 110% 이상, 2기 이상인 때에는 그 탱크 중 용량이 최대인 것의 용량의 110% 이상으로 하여야 한다.","방유제는 철근콘크리트로 하고, 방유제와 옥외저장탱크 사이의 지표면은 불연성과 불침윤성이 있는 구조(철근콘크리트 등)로 할 것. 다만, 누출된 위험물을 수용할 수 있는 전용유조 및 펌프 등의 설비를 갖춘 경우에는 방유제와 옥외저장탱크 사이의 지표면을 흙으로 할 수 있다."],"a":1,"inc":false,"unit":"3-9"},{"id":"gisa-2018-03-04-51","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":51,"q":"소방기본법령상 특수가연물의 품명별 수량 기준으로 틀린 것은?","c":["합성수지류(발포시킨 것) : 20m3 이상","가연성액체류 : 2m3 이상","넝마 및 종이부스러기 : 400kg 이상","볏짚류 : 1000kg 이상"],"a":3,"inc":false,"unit":"3-2"},{"id":"gisa-2018-03-04-62","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":62,"q":"케이블트레이에 물분무소화설비를 설치하는 경우 저장하여야 할 수원의 최소 저수량은 몇 m3인가? (단, 케이블트레이의 투영된 바닥면적은 70m2이다.)","c":["12.4","14","16.8","28"],"a":3,"inc":false,"unit":"4-10"},{"id":"gisa-2018-03-04-63","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":63,"q":"호스릴 이산화탄소소화설비의 노즐은 20℃에서 하나의 노즐마다 몇 kg/min 이상의 소화약제를 방사할 수 있는 것이어야 하는가?","c":["40","50","60","80"],"a":3,"inc":false,"unit":"6-2"},{"id":"gisa-2018-03-04-64","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":64,"q":"차고·주차장의 부분에 호스릴포소화설비 또는 포소화전설비를 설치할 수 있는 기준 중 틀린 것은?(관련 규정 개정전 문제로 여기서는 기존 정답인 3번을 누르면 정답 처리됩니다. 자세한 내용은 해설을 참고하세요.)","c":["지상 1층으로서 방화구획 되거나 지붕이 없는 부분","지상에서 수동 또는 원격조작에 따라 개방이 가능한 개구부의 유효면적의 합계가 바닥면적의 20% 이상인 부분","옥외로 통하는 개구부가 상시 개방된 구조의 부분으로서 그 개방된 부분의 합계면적이 해당 차고 또는 주차장의 바닥면적의 20% 이상인 부분","완전 개방된 옥상주차장 또는 고가 밑의 주차장 등으로서 주된 벽이 없고 기둥뿐 이거나 주위가 위해방지용 철주 등으로 둘러싸인 부분"],"a":3,"inc":false,"unit":"2-1"},{"id":"gisa-2018-03-04-65","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":65,"q":"특별피난계단의 계단실 및 부속실 제연설비의 수직풍도에 따른 배출기준 중 각층의 옥내와 면하는 수직풍도의 관통부에 설치하여야 하는 배출댐퍼 설치기준으로 틀린 것은?","c":["화재층의 옥내에 설치된 화재감지기의 동작에 따라 당해층의 댐퍼가 개방될 것","풍도의 배출댐퍼는 이·탈착구조가 되지 않도록 설치할 것","개폐여부를 당해 장치 및 제어반에서 확인할 수 있는 감지기능을 내장하고 있을 것","배출댐퍼는 두께 1.5mm 이상의 강판 또는 이와 동등 이상의 성능이 있는 것으로 설치하여야 하며 비 내식성 재료의 경우에는 부식방지 조치를 할 것"],"a":2,"inc":false,"unit":"7-8"},{"id":"gisa-2018-03-04-67","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":67,"q":"분말소화약제의 가압용 가스용기의 설치기준 중 틀린 것은?","c":["분말 소화약제의 저장용기에 접속하여 설치하여야 한다.","가압용가스는 질소가스 또는 이산화탄소로 하여야 한다.","가압용 가스용기를 3병 이상 설치한 경우에 있어서는 2개 이상의 용기에 전자개방밸브를 부착하여야 한다.","가압용 가스용기에는 2.5 MPa 이상의 압력에서 압력 조정이 가능한 압력조정기를 설치하여야 한다."],"a":4,"inc":false,"unit":"6-1"},{"id":"gisa-2018-03-04-68","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":68,"q":"스프링클러헤드의 설치기준 중 옳은 것은?","c":["살수가 방해되지 아니하도록 스프링클러 헤드로부터 반경 30㎝ 이상의 공간을 보유할 것","스프링클러헤드와 그 부착면과의 거리는 60㎝ 이하로 할 것","측벽형스프링클러헤드를 설치하는 경우 긴 변의 한쪽 벽에 일렬로 설치하고 3.2 m 이내마다 설치할 것","연소할 우려가 있는 개구부에는 그 상하좌우에 2.5m 간격으로 스프링클러 헤드를 설치하되, 스프링클러헤드와 개구부의 내측 면으로부터 직선거리는 15㎝ 이하가 되도록 할 것"],"a":4,"inc":false,"unit":"2-2"},{"id":"gisa-2018-03-04-70","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":70,"q":"분말소화설비의 수동식 기동장치의 부근에 설치하는 비상스위치에 대한 설명으로 옳은 것은?","c":["자동복귀형 스위치로서 수동식 기동장치의 타이머를 순간정지 시키는 기능의 스위치를 말한다.","자동복귀형 스위치로서 수동식 기동장치가 수신기를 순간정지 시키는 기능의 스위치를 말한다.","수동복귀형 스위치로서 수동식 기동장치의 타이머를 순간정지 시키는 기능의 스위치를 말한다.","수동복귀형 스위치로서 수동식 기동장치가 수신기를 순간정지 시키는 기능의 스위치를 말한다."],"a":1,"inc":false,"unit":"6-1"},{"id":"gisa-2018-03-04-72","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":72,"q":"옥외소화전설비 설치 시 고가수조의 자연 낙차를 이용한 가압송수장치의 설치기준 중 고가수조의 최소 자연낙차수두 산출 공식으로 옳은 것은? (단, H : 필요한 낙차(m), h1 : 소방용 호스 마찰손실 수두(m) h2 : 배관의 마찰손실 수두(m)이다.)","c":["H＝h1＋h2＋25","H＝h1＋h2＋17","H＝h1＋h2＋12","H＝h1＋h2＋10"],"a":1,"inc":false,"unit":"4-6"},{"id":"gisa-2018-03-04-75","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":75,"q":"소화기에 호스를 부착하지 아니할 수 있는 기준 중 틀린 것은?","c":["소화약제의 중량이 2kg 미만인 분말소화기","소화약제의 중량이 3kg 미만인 이산화탄소 소화기","소화약제의 중량이 4kg 미만인 할로겐 화합물소화기","소화약제의 중량이 5kg 미만인 산알칼리 소화기"],"a":4,"inc":false,"unit":"4-5"},{"id":"gisa-2018-03-04-78","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":78,"q":"발전실의 용도로 사용되는 바닥면적이 280m2인 발전실에 부속용도별로 추가하여야 할 적응성이 있는 소화기의 최소 수량은 몇 개인가?","c":["2","4","6","12"],"a":3,"inc":false,"unit":"4-5"},{"id":"gisa-2018-03-04-79","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-03-04","num":79,"q":"습식유수검지장치를 사용하는 스프링클러 설비에 동장치를 시험할 수 있는 시험 장치의 설치위치 기준으로 옳은 것은?","c":["유수검지 장치에서 가장 먼 가지 배관의 끝으로부터 연결하여 설치할 것","교차관의 중간 부분에 연결하여 설치할 것","유수검지장치의 측면배관에 연결하여 설치할 것","유수검지장치에서 가장 먼 교차배관의 끝으로부터 연결하여 설치할 것"],"a":1,"inc":false,"unit":"4-7"},{"id":"gisa-2018-04-28-2","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-04-28","num":2,"q":"다음의 소화약제 중 오존 파괴 지수(ODP)가 가장 큰 것은?","c":["할론 104","할론 1301","할론 1211","할론 2402"],"a":2,"inc":false,"unit":"6-4"},{"id":"gisa-2018-04-28-3","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-04-28","num":3,"q":"건축물에 설치하는 방화구 um":41,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 비상경보설비를 설치하여야 할 특정소방대상물의 기준 중 옳은 것은?(단, 지하구, 모래ㆍ석재 등 불연재료 창고 및 위험물 저장ㆍ처리 시설 중 가스시설은 제외한다.)","c":["지하층 또는 무창층의 바닥면적이 50m2 상인 것","연면적 400m2 이상인 것","지하가 중 터널로서 길이가 300m 이상인 것","30명 이상의 근로자가 작업하는 옥내 작업장"],"a":2,"inc":false,"unit":"3-10"},{"id":"gisa-2018-04-28-43","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-04-28","num":43,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 스프링클러설비를 설치하여야 하는 특정소방대상물의 기준 중 틀린 것은?(단, 위험물 저장 및 처리 시설 중 가스시설 또는 지하구는 제외한다.)","c":["숙박이 가능한 수련시설 용도로 사용되는 시설의 바닥면적의 합계가 600m2 이상인 것은 모든 층","창고시설(물류터미널은 제외)로서 바닥면적 합계가 5000m2 이상인 경우에는 모든 층","판매시설, 운수시설 및 창고시설(물류터미널에 한정)로서 바닥면적의 합계가 5000m2 이상이거나 수용인원이 500명 이상인 경우에는 모든 층","복합건축물로서 연면적이 3000m2 이상인 경우에는 모든 층"],"a":4,"inc":false,"unit":"4-7"},{"id":"gisa-2018-04-28-50","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-04-28","num":50,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법상 소방안전관리대상물의 소방안전 관리자 업무가 아닌 것은?(문제 오류로 실제 시험장에서는 모두 정답 처리 되었습니다. 여기서는 가답안인 3번을 누르면 정답 처리 됩니다.)","c":["소방훈련 및 교육","자위소방대 및 초기대응체계의 구성·운영·교육","피난시설, 방화구획 및 방화시설의 유지·관리","피난계획에 관한 사항과 대통령령으로 정하는 사항이 포함된 소방계획서의 작성 및 시행"],"a":3,"inc":false,"unit":"2-1"},{"id":"gisa-2018-04-28-51","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-04-28","num":51,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 소방안전관리대상물의 소방계획서에 포함되어야 하는 사항이 아닌 것은?","c":["예방규정을 정하는 제조소등의 위험물 저장·취급에 관한 사항","소방시설·피난시설 및 방화시설의 점검·정비계획","특정소방대상물의 근무자 및 거주자의 자위소방대 조직과 대원의 임무에 관한 사항","방화구획, 제연구획, 건축물의 내부 마감 재료(불연재료·준불연재료 또는 난연재료로 사용된 것) 및 방염물품의 사용현황과 그 밖의 방화구조 및 설비의 유지·관리계획"],"a":1,"inc":false,"unit":"2-3"},{"id":"gisa-2018-04-28-54","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-04-28","num":54,"q":"소방기본법령상 소방본부 종합상황실 실장이 소방청의 종합상황실에 서면ㆍ모사전송 또는 컴퓨터통신 등으로 보고하여야 하는 화재의 기중 중 틀린 것은?","c":["항구에 매어둔 총 톤수가 1000톤 이상인 선박에서 발생한 화재","층수가 5층 이상이거나 병상이 30개 이상인 종합병원·정신병원·한방병원·요양소에서 발생한 화재","지정수량의 1000배 이상의 위험물의 제조소·저장소·취급소에서 발생한 화재","연면적 15000m2 이상인 공장 또는 화재경계지구에서 발생한 화재"],"a":3,"inc":false,"unit":"3-9"},{"id":"gisa-2018-04-28-56","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-04-28","num":56,"q":"소방공사업법령상 공사감리자 지정대상 특정 소방대상물의 범위가 아닌 것은?","c":["캐비닛형 간이스프링클러설비를 신설·개설하거나 방호·방수 구역을 증설할 때","물분무등소화설비(호스릴 방식의 소화설비는 제외)를 신설·개설하거나 방호·방수구역을 증설할 때","제연설비를 신설·개설하거나 제연구역을 증설할 때","연소방지설비를 신설·개설하거나 살수구역을 증설할 때"],"a":1,"inc":false,"unit":"4-7"},{"id":"gisa-2018-04-28-58","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-04-28","num":58,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법상 특정소방대상물의 피난시설, 방화 구획 또는 방화시설의 폐쇄ㆍ훼손ㆍ변경 등의 행위를 한 자에 대한 과태료 기준으로 옳은 것은?","c":["200만원의 이하의 과태료","300만원의 이하의 과태료","500만원의 이하의 과태료","600만원의 이하의 과태료"],"a":2,"inc":false,"unit":"2-1"},{"id":"gisa-2018-04-28-61","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-04-28","num":61,"q":"전역방출방식의 분말소화설비에 있어서 방호구역의 용적이 500m3일 때 적합한 분사헤드의 수는? (단, 제1종 분말이며, 체적 1m3당 소화약제의 양은 0.60kg이며, 분사헤드 1개의 분당 표준 방사량은 18kg이다.)","c":["17개","30개","34개","134개"],"a":3,"inc":false,"unit":"6-1"},{"id":"gisa-2018-04-28-62","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-04-28","num":62,"q":"이산화탄소 소화약제의 저장용기 설치기준 중 옳은 것은?","c":["저장용기의 충전비는 고압식은 1.9 이상 2.3 이하, 저압식은 1.5 이상 1.9 이하로 할 것","저압식 저장용기에는 액면계 및 압력계와 2.1MPa 이상 1.9MPa 이하의 압력에서 작동하는 압력경보장치를 설치할 것","저장용기 고압식은 25MPa 이상, 저압식은 3.5MPa 이상의 내압시험압력에 합격한 것으로 할 것","저압식 저장용기에는 내압시험압력의 1.8배의 압력에서 작동하는 안전밸브와 내압시험압력의 0.8배로부터 내압시험압력에서 작동하는 봉판을 설치할 것"],"a":3,"inc":false,"unit":"6-2"},{"id":"gisa-2018-04-28-67","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-04-28","num":67,"q":"스프링클러설비 가압송수장치의 설치기준 중 고가수조를 이용한 가압송수장치에 설치하지 않아도 되는 것은?","c":["수위계","배수관","오버플로우관","압력계"],"a":4,"inc":false,"unit":"4-7"},{"id":"gisa-2018-04-28-70","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-04-28","num":70,"q":"화재조기진압용 스프링클러설비 가지배관의 배열기준 중 천장의 높이가 9.1m 이상 13.7m 이하인 경우 가지배관 사이의 거리 기준으로 옳은 것은?","c":["2.4m 이상 3.1m 이하","2.4m 이상 3.7m 이하","6.0m 이상 8.5m 이하","6.0m 이상 9.3m 이하"],"a":1,"inc":false,"unit":"4-7"},{"id":"gisa-2018-04-28-72","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-04-28","num":72,"q":"포 소화약제의 혼합장치에 대한 설명 중 옳은 것은?","c":["라인 푸로포셔너방식 이란 펌프의 토출관과 흡입관 사이의 배관 도중에 설치한 흡입기에 펌프에서 토출된 물의 일부를 보내고, 농도 조절밸브에서 조정된 포 소화약제의 필요량을 포 소화약제 탱크에서 펌프 흡입측으로 보내어 이를 혼합하는 방식을 말한다.","프레져사이드 푸로포셔너방식 이란 펌프의 토출관에 압입기를 설치하여 포 소화약제 압입용펌프로 포 소화약제를 압입시켜 혼합하는 방식을 말한다.","프레져 푸로포셔너방식 이란 펌프와 발포기 중간에 설치된 벤추리관의 벤추리작용에 따라 포 소화약제를 흡입·혼합하는 방식을 말한다.","펌프 푸로포셔너방식 이란 펌프와 발포기의 중간에 설치된 벤추리관의 벤추리작용과 펌프 가압수의 포 소화약제 저장탱크에 대한 압력에 따라 포 소화약제를 흡입·혼합하는 방식을 말한다."],"a":2,"inc":false,"unit":"5-1"},{"id":"gisa-2018-04-28-75","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-04-28","num":75,"q":"소화기구의 소화약제별 적응성 중 C급 화재에 적응성이 없는 소화약제는?","c":["마른 모래","청정소화약제","이산화탄소 소화약제","중탄산염류 소화약제"],"a":1,"inc":false,"unit":"4-5"},{"id":"gisa-2018-09-15-1","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":1,"q":"갑종방화문과 을종방화문의 비차열 성능은 각각 최소 몇 분 이상이어야 하는가?","c":["갑종 : 90분, 을종 : 40분","갑종 : 60분, 을종 : 30분","갑종 : 45분, 을종 : 20분","갑종 : 30분, 을종 : 10분"],"a":2,"inc":false,"unit":"2-2"},{"id":"gisa-2018-09-15-2","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":2,"q":"염소산염류, 과염소산염류, 알칼리 금속의 과산화물, 질산염류, 과망간산염류의 특징과 화재 시 소화방법에 대한 설명 중 틀린 것은?","c":["가열 등에 의해 분해하여 산소를 발생하고 화재 시 산소의 공급원 역할을 한다.","가연물, 유기물, 기타 산화하기 쉬운 물질과 혼합물은 가열, 충격, 마찰 등에 의해 폭발하는 수도 있다.","알카리금속의 과산화물을 제외하고 다량의 물로 냉각소화한다.","그 자체가 가연성이며 폭발성을 지니고 있어 화약류 취급 시와 같이 주의를 요한다."],"a":4,"inc":false,"unit":"3-2"},{"id":"gisa-2018-09-15-4","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":4,"q":"건축물의 피난∙방화구조 등의 기준에 관한 규칙에 따른 철망모르타르로서 그 바름두께가 최소 몇 cm 이상인 것을 방화구조로 규정하는가?","c":["2","2.5","3","3.5"],"a":1,"inc":false,"unit":"2-3"},{"id":"gisa-2018-09-15-5","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":5,"q":"제3종 분말소화약제에 대한 설명으로 틀린 것은?","c":["A,B,C급 화재에 모두 적응한다.","주성분은 탄산수소칼륨과 요소이다.","열분해시 발생되는 불연성 가스에 의한 질식효과가 있다.","분말운무에 의한 열방사를 차단하는 효과가 있다."],"a":2,"inc":false,"unit":"6-1"},{"id":"gisa-2018-09-15-7","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":7,"q":"제4류 위험물의 물리∙화학적 특성에 대한 설명으로 틀린 것은?","c":["증기비중은 공기보다. 크다.","정전기에 의한 화재발생위험이 있다.","인화성 액체이다.","인화점이 높을수록 증기발생이 용이하다."],"a":4,"inc":false,"unit":"1-1"},{"id":"gisa-2018-09-15-8","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":8,"q":"유류 탱크의 화재 시 탱크 저부의 물이 뜨거운 열류층에 의하여 수증기로 변하면서 급작스런 부피 팽창을 일으켜 유류가 탱크 외부로 분출하는 현상은?","c":["슬롭 오버(Slop Over)","블레비(BLEVE)","보일 오버(Boil Over)","파이어 볼(Fire Ball)"],"a":3,"inc":false,"unit":"1-21"},{"id":"gisa-2018-09-15-11","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":11,"q":"어떤 기체가 0℃, 1기압에서 부피가 11.2L, 기체질량이 22g 이었다면 이 기체의 분자량은? (단, 이상기체로 가정한다.)","c":["22","35","44","56"],"a":3,"inc":false,"unit":"14-2"},{"id":"gisa-2018-09-15-12","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":12,"q":"다음 중 분진 폭발의 위험성이 가장 낮은 것은?","c":["소석회","알루미늄분","석탄분말","밀가루"],"a":1,"inc":false,"unit":"1-22"},{"id":"gisa-2018-09-15-14","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":14,"q":"연소의 4요소 중 자유활성기(free radical)의 생성을 저하시켜 연쇄반응을 중지시키는 소화방법은?","c":["제거소화","냉각소화","질식소화","억제소화"],"a":4,"inc":false,"unit":"1-5"},{"id":"gisa-2018-09-15-15","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":15,"q":"내화구조에 해당하지 않는 것은?","c":["철근콘크리트조로 두께가 10cm 이상인 벽","철근콘크리트조로 두께가 5cm 이상인 외벽 중 비 내력벽","벽돌조로서 두께가 19cm 이상인 벽","철골철근콘크리트조로서 두께가 10cm 이상인 벽"],"a":2,"inc":false,"unit":"2-3"},{"id":"gisa-2018-09-15-16","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":16,"q":"피난로의 안전구획 중 2차 안전구획에 속하는 것은?","c":["복도","계단부속실(계단전실)","계단","피난층에서 외부와 직면한 현관"],"a":2,"inc":false,"unit":"7-1"},{"id":"gisa-2018-09-15-17","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":17,"q":"경유화재가 발생했을 때 주수소화가 오히려 위험할 수 있는 이유는?","c":["경유는 물과 반응하여 유독가스를 발생하므로","경유의 연소열로 인하여 산소가 방출되어 연소를 돕기 때문에","경유는 물보다 비중이 가벼워 화재면의 확대 우려가 있으므로","경유가 연소할 때 수소가스를 발생하여 연소를 돕기 때문에"],"a":3,"inc":false,"unit":"1-8"},{"id":"gisa-2018-09-15-18","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":18,"q":"TLV(Threshold Limit Value)가 가장 높은 가스는?","c":["시안화수소","포스겐","일산화탄소","이산화탄소"],"a":4,"inc":false,"unit":"6-2"},{"id":"gisa-2018-09-15-19","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":19,"q":"할론계 소화약제의 주된 소화효과 및 방법에 대한 설명으로 옳은 것은?","c":["소화약제의 증발잠열에 의한 소화방법이다.","산소의 농도를 15% 이하로 낮게 하는 소화 방법이다.","소화약제의 열분해에 의해 발생하는 이산화탄소에 의한 소화방법이다.","자유활성기(free radical)의 생성을 억제하는 소화방법이다."],"a":4,"inc":false,"unit":"6-2"},{"id":"gisa-2018-09-15-21","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":21,"q":"이상기체의 등엔트로피 과정에 대한 설명 중 틀린 것은?","c":["폴리트로픽 과정의 일종이다.","가역단열과정에서 나타난다.","온도가 증가하면 압력이 증가한다.","온도가 증가하면 비체적이 증가한다."],"a":4,"inc":false,"unit":"14-2"},{"id":"gisa-2018-09-15-26","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":26,"q":"유체가 매끈한 원 관 속을 흐를 때 레이놀즈수가 1200이라면 관 마찰계수는 얼마인가?","c":["0.0254","0.00128","0.0059","0.053"],"a":4,"inc":false,"unit":"4-3"},{"id":"gisa-2018-09-15-29","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":29,"q":"다음 열역학적 용어에 대한 설명으로 틀린 것은?","c":["물질의 3중점(triple point)은 고체, 액체, 기체의 3상이 평형상태로 공존하는 상태의 지점을 말한다.","일정한 압력하에서 고체가 상변화를 일으켜 액체로 변화할 때 필요한 열을 융해열(융해 잠열)이라 한다.","고체가 일정한 압력하에서 액체를 거치지 않고 직접 기체로 변화하는데 필요한 열을 승화열이라 한다.","포화액체를 정압하에서 가열할 때 온도변화 없이 포화증기로 상변화를 일으키는데 사용 되는 열을 현열이라 한다."],"a":4,"inc":false,"unit":"1-8"},{"id":"gisa-2018-09-15-30","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":30,"q":"펌프를 이용하여 10m 높이 위에 있는 물탱크로 유량 0.3m3/min의 물을 퍼올리려고 한다. 관로 내 마찰손실수두가 3.8m이고, 펌프의 효율이 85%일 때 펌프에 공급해야 하는 동력은 약 몇 W인가?","c":["128","796","677","219"],"a":2,"inc":false,"unit":"4-4"},{"id":"gisa-2018-09-15-32","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":32,"q":"모세관 현상에 있어서 물이 모세관을 따라 올라가는 높이에 대한 설명으로 옳은 것은?","c":["표면장력이 클수록 높이 올라간다.","관의 지름이 클수록 높이 올라간다.","밀도가 클수록 높이 올라간다.","중력의 크기와는 무관하다."],"a":1,"inc":false,"unit":"4-5"},{"id":"gisa-2018-09-15-35","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":35,"q":"파이프 단면적이 2.5배로 급격하게 확대되는 구간을 지난 후의 유속이 1.2m/s이다. 부차적 손실 계수가 0.36이라면 급격확대로 인한 손실수두는 몇 m인가?","c":["0.0264","0.0661","0.165","0.331"],"a":3,"inc":false,"unit":"4-3"},{"id":"gisa-2018-09-15-38","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":38,"q":"지름 2cm의 금속 공은 선풍기를 켠 상태에서 냉각하고, 지름 4cm의 금속 공은 선풍기를 끄고 냉각할 때 동일 시간당 발생하는 대류 열전달량의 비(2cm 공 : 4cm 공)는? (단, 두 경우 온도차는 같고, 선풍기를 켜면 대류 열전달계수가 10배가 된다고 가정한다.)","c":["1 : 0.3375","1 : 0.4","1 : 5","1 : 10"],"a":2,"inc":false,"unit":"1-7"},{"id":"gisa-2018-09-15-41","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":41,"q":"소방기본법령에 따른 용접 또는 용단 작업장에서 불꽃을 사용하는 용접∙용단기구 사용에 있어서 작업자로부터 반경 몇 m 이내에 소화기를 갖추어야 하는가? (단, 산업안전보건법에 따른 안전조치의 적용을 받는 사업장의 경우는 제외한다.)","c":["1","3","5","7"],"a":3,"inc":false,"unit":"4-5"},{"id":"gisa-2018-09-15-44","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":44,"q":"소방시설공사업법령에 따른 소방시설공사 중 특정소방대상물에 설치된 소방시설등을 구성 하는 것의 전부 또는 일부를 개설, 이전 또는 정비하는 공사의 착공신고 대상이 아닌 것은?","c":["수신반","소화펌프","동력(감시)제어반","제연설비의 제연구역"],"a":4,"inc":false,"unit":"4-4"},{"id":"gisa-2018-09-15-46","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":46,"q":"화재예방, 소방시설 설치∙유지 및 안전관리에 관한 법령에 따른 화재안전기준을 달리 적용하여야 하는 특수한 용도 또는 구조를 가진 특정소방대상물 중 핵폐기물처리시설에 설치하지 아니할 수 있는 소방시설은?","c":["소화용수설비","옥외소화전설비","물분무등소화설비","연결송수관설비 및 연결살수설비"],"a":4,"inc":false,"unit":"4-10"},{"id":"gisa-2018-09-15-47","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":47,"q":"위험물안전관리법령에 따른 인화성액체 위험물(이황화탄소를 제외)의 옥외탱크 저장소의 탱크 주위에 설치하는 방유제의 설치기준 중 옳은 것은?","c":["방유제의 높이는 0.5m 이상 2.0m 이하로 할 것","방유제내의 면적은 100000m2 이하로 할 것","방유제의 용량은 방유제안에 설치된 탱크가 2기 이상인 때에는 그 탱크 중 용량이 최대인 것의 용량의 120% 이상으로 할 것","높이가 1m를 넘는 방유제 및 간막이 둑의 안팎에는 방유제내에 출입하기 위한 계단 또는 경사로를 약 50m마다 설치할 것"],"a":4,"inc":false,"unit":"3-9"},{"id":"gisa-2018-09-15-49","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":49,"q":"피난시설, 방화구획 또는 방화시설을 폐쇄∙훼손∙변경 등의 행위를 3차 이상 위반한 경우에 대한 과태료 부과기준으로 옳은 것은?","c":["200만원","300만원","500만원","1000만원"],"a":2,"inc":false,"unit":"2-1"},{"id":"gisa-2018-09-15-50","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":50,"q":"소방시설공사업법령에 따른 성능위주설계를 할 수 있는 자의 설계범위 기준 중 틀린 것은?","c":["연면적 30000m2 이상인 특정소방대상물로서 공항시설","연면적 100000m2 이상인 특정소방대상물(단, 아파트등은 제외)","지하층을 포함한 층수가 30층 이상인 특정소방대상물(단, 아파트 등은 제외)","하나의 건축물에 영화상영관이 10개 이상인 특정소방대상물"],"a":2,"inc":false,"unit":"2-3"},{"id":"gisa-2018-09-15-53","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":53,"q":"위험물안전관리법령에 따른 정기점검의 대상인 제조소등의 기준 중 틀린 것은?","c":["암반탱크저장소","지하탱크저장소","이동탱크저장소","지정수량의 150배 이상의 위험물을 저장하는 옥외탱크저장소"],"a":4,"inc":false,"unit":"3-9"},{"id":"gisa-2018-09-15-56","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":56,"q":"위험물안전관리법령에 따른 위험물제조소의 옥외에 있는 위험물취급탱크 용량이 100m3 및 180m3 인 2개의 취급탱크 주위에 하나의 방유제를 설치하는 경우 방유제의 최소 용량은 몇 m3 이어야 하는가?","c":["100","140","180","280"],"a":1,"inc":false,"unit":"3-10"},{"id":"gisa-2018-09-15-64","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":64,"q":"특별피난계단의 계단실 및 부속실 제연설비의 차압 등에 관한 기준 중 옳은 것은?","c":["제연설비가 가동되었을 경우 출입문의 개방에 필요한 힘은 130N 이하로 하여야 한다.","제연구역과 옥내와의 사이에 유지하여야 하는 최소차압은 40Pa(옥내에 스프링 클러설비가 설치된 경우에는 12.5Pa) 이상 으로 하여야 한다.","피난을 위하여 제연구역의 출입문이 일시적으로 개방되는 경우 개방되지 아니하는 제연구역과 옥내와의 차압은 기준 차압의 60% 미만이 되어서는 아니 된다.","계단실과 부속실을 동시에 제연 하는 경우 부속실의 기압은 계단실과 같게 하거나 계단실의 기압보다 낮게 할 경우에는 부속실과 계단실의 압력차이는 10Pa 이하가 되도록 하여야 한다."],"a":2,"inc":false,"unit":"7-8"},{"id":"gisa-2018-09-15-67","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":67,"q":"특정소방대상물에 따라 적응하는 포소화설비의 설치기준 중 특수가연물을 저장∙취급하는 공장 또는 창고에 적응성을 갖는 포소화설비가 아닌 것은?","c":["포헤드설비","고정포방출설비","압축공기포소화설비","호스릴포소화설비"],"a":4,"inc":false,"unit":"3-2"},{"id":"gisa-2018-09-15-68","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":68,"q":"포소화설비의 배관 등의 설치기준 중 옳은 것은?","c":["포워터스프링클러 설비 또는 포헤드설비의 가지배관의 배열은 토너먼트방식으로 한다.","송액관은 겸용으로 하여야 한다. 다만, 포소화전의 기동장치의 조작과 동시에 다른 설비의 용도에 사용하는 배관의 송수를 차단할 수 있거나, 포소화설비의 성능에 지장이 없는 경우에는 전용으로 할 수 있다.","송액관은 포의 방출 종료 후 배관안의 액을 배출하기 위하여 적당한 기울기를 유지하도록 하고 그 낮은 부분에 배액밸브를 설치하여야 한다.","연결송수관설비의 배관과 겸용할 경우의 주배관은 구경 65mm 이상, 방수구로 연결되는 배관의 구경은 100mm 이상의 것으로 하여야 한다."],"a":3,"inc":false,"unit":"4-7"},{"id":"gisa-2018-09-15-69","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":69,"q":"고압의 전기기기가 있는 장소에 있어서 전기의 절연을 위한 전기기기와 물분무헤드 사이의 최소 이격거리 기준 중 옳은 것은?","c":["66kV 이하 - 60cm 이상","66 kV 초과 77 kV 이하 - 80 cm 이상","77kV 초과 110kV 이하 - 100 cm 이상","110kV 초과 154 kV 이하 - 140 cm 이상"],"a":2,"inc":false,"unit":"4-10"},{"id":"gisa-2018-09-15-70","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":70,"q":"청정소화약제소화설비(할로겐화합물 및 불활성 기체소화설비)를 설치할 수 없는 장소의 기준 중 옳은 것은? (단, 소화성능이 인정되는 위험물은 제외한다.)","c":["제1류위험물 및 제2류위험물 사용","제2류위험물 및 제4류위험물 사용","제3류위험물 및 제5류위험물 사용","제4류위험물 및 제6류위험물 사용"],"a":3,"inc":false,"unit":"6-3"},{"id":"gisa-2018-09-15-71","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":71,"q":"스프링클러설비를 설치하여야 할 특정소방 대상물에 있어서 스프링클러헤드를 설치하지 아니할 수 있는 기준 중 틀린 것은?","c":["천장과 반자 양쪽이 불연재료로 되어 있고 천장과 반자사이의 거리가 2.5m 미만인 부분","천장 및 반자가 불연재료 외의 것으로 되어 있고 천장과 반자사이의 거리가 0.5m 미만인 부분","천장∙반자 중 한쪽이 불연재료로 되어 있고 천장과 반자사이의 거리가 1m 미만인 부분","현관 또는 로비 등으로서 바닥으로부터 높이가 20m 이상인 장소"],"a":1,"inc":false,"unit":"4-7"},{"id":"gisa-2018-09-15-78","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":78,"q":"분말소화설비 분말소화약제의 저장용기의 설치기준 중 옳은 것은?","c":["저장용기에는 가압식은 최고사용압력의 0.8배 이하, 축압식은 용기의 내압시험 압력의 1.8배 이하의 압력에서 작동하는 안전밸브를 설치할 것","저장용기의 충전비는 0.8 이상으로 할 것","저장용기간의 간격은 점검에 지장이 없도록 5cm 이상의 간격을 유지할 것","저장용기에는 저장용기의 내부압력이 설정 압력으로 되었을 때 주밸브를 개방하는 압력조정기를 설치할 것"],"a":2,"inc":false,"unit":"6-1"},{"id":"gisa-2018-09-15-79","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2018-09-15","num":79,"q":"바닥면적이 1300m2인 관람장에 소화기구를 설치할 경우 소화기구의 최소 능력단위는? (단, 주요구조부가 내화구조이고, 벽 및 반자의 실내와 면하는 부분이 불연재료로 된 특정 소방대상물이다.)","c":["7단위","13단위","22단위","26단위"],"a":2,"inc":false,"unit":"2-3"},{"id":"gisa-2019-03-03-1","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":1,"q":"공기와 접촉되었을 때 위험도(H)가 가장 큰 것은?","c":["에테르","수소","에틸렌","부탄"],"a":1,"inc":false,"unit":"1-23"},{"id":"gisa-2019-03-03-2","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":2,"q":"연면적이 1000m2 이상인 목조건축물은 그 외벽 및 처마 밑의 연소할 우려가 있는 부분을 방화구조로 하여야 하는데 이때 연소우려가 있는 부분은? (단, 동일한 대지 안에 2동 이상의 건물이 있는 경우이며, 공원·광장·하천의 공지나 수면 또는 내화구조의 벽 기타 이와 유사한 것에 접하는 부분을 제외한다.)","c":["상호의 외벽 간 중심선으로부터 1층은 3m 이내의 부분","상호의 외벽 간 중심선으로부터 2층은 7m 이내의 부분","상호의 외벽 간 중심선으로부터 3층은 11m 이내의 부분","상호의 외벽 간 중심선으로부터 4층은 13m 이내의 부분"],"a":1,"inc":false,"unit":"2-3"},{"id":"gisa-2019-03-03-3","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":3,"q":"주요구조부가 내화구조로된 건축물에서 거실 각 부분으로부터 하나의 직통계단에 이르는 보행거리는 피난자의 안전상 몇 m 이하이어야 하는가?","c":["50","60","70","80"],"a":1,"inc":false,"unit":"7-2"},{"id":"gisa-2019-03-03-5","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":5,"q":"화재에 관련된 국제적인 규정을 제정하는 단체는?","c":["IMO(International Matritime Organization)","SEPE(Society of Fire Protection Engineers)","NFPA(Nation Fire Protection Association)","ISO(International Organization for Standardization) TC 92"],"a":4,"inc":false,"unit":"3-1"},{"id":"gisa-2019-03-03-6","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":6,"q":"이산화탄소 소화약제의 임계온도로 옳은 것은?","c":["24.4 ℃","31.1 ℃","56.4 ℃","78.2 ℃"],"a":2,"inc":false,"unit":"6-2"},{"id":"gisa-2019-03-03-8","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":8,"q":"물질의 취급 또는 위험성에 대한 설명 중 틀린 것은?","c":["융해열은 점화원이다.","질산은 물과 반응시 발열 반응하므로 주의를 해야한다.","네온, 이산화탄소, 질소는 불연성 물질로 취급한다.","암모니아를 충전하는 공업용 용기의 색상은 백색이다."],"a":1,"inc":false,"unit":"6-2"},{"id":"gisa-2019-03-03-9","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":9,"q":"인화점이 40℃ 이하인 위험물을 저장, 취급하는 장소에 설치하는 전기설비는 방폭구조로 설치하는데, 용기의 내부에 기체를 압입하여 압력을 유지하도록 함으로써 폭발성가스가 침입하는 것을 방지하는 구조는?","c":["압력 방폭구조","유입 방폭구조","안전증 방폭구조","본질안전 방폭구조"],"a":1,"inc":false,"unit":"1-1"},{"id":"gisa-2019-03-03-11","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":11,"q":"마그네슘의 화재에 주수하였을 때 물과 마그네슘의 반응으로 인하여 생성되는 가스는?","c":["산소","수소","일산화탄소","이산화탄소"],"a":2,"inc":false,"unit":"6-2"},{"id":"gisa-2019-03-03-13","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":13,"q":"방화구획의 설치기준 중 스프링클러 기타 이와 유사한 자동식소화설비를 설치한 10층 이하의 층은 몇 m2 이내마다 구획하여야 하는가?","c":["1000","1500","2000","3000"],"a":4,"inc":false,"unit":"2-1"},{"id":"gisa-2019-03-03-15","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":15,"q":"이산화탄소의 질식 및 냉각 효과에 대한 설명 중 틀린 것은?","c":["이산화탄소의 증기비중이 산소보다 크기 때문에 가연물과 산소의 접촉을 방해한다.","액체 이산화탄소가 기화되는 과정에서 열을 흡수한다.","이산화탄소는 불연성 가스로서 가연물의 연소반응을 방해한다.","이산화탄소는 산소와 반응하며 이 과정에서 발생한 연소열을 흡수하므로 냉각효과를 나타낸다."],"a":4,"inc":false,"unit":"6-2"},{"id":"gisa-2019-03-03-16","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":16,"q":"분말 소화약제 분말입도의 소화성능에 관한 설명으로 옳은 것은?","c":["미세할수록 소화성능이 우수하다.","입도가 클수록 소화성능이 우수하다.","입도와 소화성능과는 관련이 없다.","입도가 너무 미세하거나 너무 커도 소화성능은 저하된다."],"a":4,"inc":false,"unit":"6-1"},{"id":"gisa-2019-03-03-17","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":17,"q":"화재하중에 대한 설명 중 틀린 것은?","c":["화재하중이 크면 단위면적당의 발열량이 크다.","화재하중이 크다는 것은 화재구획의 공간이 넓다는 것이다.","화재하중이 같더라도 물질의 상태에 따라 가혹도는 달라진다.","화재하중은 화재구획실내의 가연물 총량을 목재 중량당비로 환산하여 면적으로 나눈 수치이다."],"a":2,"inc":false,"unit":"1-12"},{"id":"gisa-2019-03-03-18","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":18,"q":"분말 소화약제 중 A급, B급, C급 화재에 모두 사용할 수 있는 것은?","c":["Na2CO3","NH4H2PO4","KHCO3","NaHCO3"],"a":2,"inc":false,"unit":"6-1"},{"id":"gisa-2019-03-03-19","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":19,"q":"증기비중의 정의로 옳은 것은? (단, 분자, 분모의 단위는 모두 g/mol 이다.)","c":["분자량 / 22.4","분자량 / 29","분자량 / 44.8","분자량 / 100"],"a":2,"inc":false,"unit":"4-1"},{"id":"gisa-2019-03-03-21","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":21,"q":"다음 중 열역학 제1법칙에 관한 설명으로 옳은 것은?","c":["열은 그 자신만으로 저온에서 고온으로 이동할 수 없다.","일은 열로 변환시킬 수 있고 열은 일로 변환시킬 수 있다.","사이클 과정에서 열이 모두 일로 변화할 수 없다.","열평형 상태에 있는 물체의 온도는 같다."],"a":2,"inc":false,"unit":"1-8"},{"id":"gisa-2019-03-03-26","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":26,"q":"30℃에서 부피가 10L인 이상기체를 일정한 압력으로 0℃로 냉각시키면 부피는 약 몇 L로 변하는가?","c":["3","9","12","18"],"a":2,"inc":false,"unit":"14-2"},{"id":"gisa-2019-03-03-27","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":27,"q":"이상적인 카르노사이클의 과정인 단열압축과 등온압축의 엔트로피 변화에 관한 설명으로 옳은 것은?","c":["등온압축의 경우 엔트로피 변화는 없고, 단열압축의 경우 엔트로피 변화는 감소한다.","등온압축의 경우 엔트로피 변화는 없고, 단열압축의 경우 엔트로피 변화는 증가한다.","단열압축의 경우 엔트로피 변화는 없고, 등온압축의 경우 엔트로피 변화는 감소한다.","단열압축의 경우 엔트로피 변화는 없고, 등온압축의 경우 엔트로피 변화는 증가한다."],"a":3,"inc":false,"unit":"10-5"},{"id":"gisa-2019-03-03-29","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":29,"q":"비중이 0.877인 기름이 단면적이 변하는 원관을 흐르고 있으며 체적유량은 0.146 m3/s 이다. A점에서는 안지름이 150mm, 압력이 91 kPa 이고, B점에서는 안지름이 450mm, 압력이 60.3 kPa 이다. 또한 B점은 A점보다 3.66m 높은 곳에 위치한다. 기름이 A점에서 B점까지 흐르는 동안의 손실수두는 약 몇 m 인가? (단, 물의 비중량은 9810 N/m3 이다.)","c":["3.3","7.2","10.7","14.1"],"a":1,"inc":false,"unit":"4-1"},{"id":"gisa-2019-03-03-33","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":33,"q":"안지름 10cm의 관로에서 마찰 손실 수두가 속도 수두와 같다면 그 관로의 길이는 약 몇 m 인가? (단, 관마찰계수는 0.03 이다.)","c":["1.58","2.54","3.33","4.52"],"a":3,"inc":false,"unit":"4-3"},{"id":"gisa-2019-03-03-37","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":37,"q":"일반적인 배관 시스템에서 발생되는 손실을 주손실과 부차적 손실로 구분할 때 다음 중 주손실에 속하는 것은?","c":["직관에서 발생하는 마찰 손실","파이프 입구와 출구에서의 손실","단면의 확대 및 축소에 의한 손실","배관부품(엘보, 리턴밴드, 티, 리듀서, 유니언, 밸브 등)에서 발생하는 손실"],"a":1,"inc":false,"unit":"4-3"},{"id":"gisa-2019-03-03-38","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":38,"q":"온도차이 20℃, 열전도율 5W/(m·K), 두께 20cm 인 벽을 통한 열유속(heat flux)과 온도차이 40℃, 열전도율 10W/(m·K), 두께 t인 같은 면적을 가진 벽을 통한 열유속이 같다면 두께 t는 약 몇 cm 인가?","c":["10","20","40","80"],"a":4,"inc":false,"unit":"1-7"},{"id":"gisa-2019-03-03-39","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":39,"q":"낙구식 점도계는 어떤 법칙을 이론적 근거로 하는가?","c":["Stokes의 법칙","열역학 제1법칙","Hagen-Poiseuille의 법칙","Boyle의 법칙"],"a":1,"inc":false,"unit":"1-8"},{"id":"gisa-2019-03-03-43","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":43,"q":"소방용수시설 중 소화전과 급수탑의 설치기준으로 틀린 것은?","c":["급수탑 급수배관의 구경은 100mm 이상으로 할 것","소화전은 상수도와 연결하여 지하식 또는 지상식의 구조로 할 것","소방용호스와 연결하는 소화전의 연결금속구의 구경은 65mm로 할 것","급수탑의 개폐밸브는 지상에서 1.5m 이상 1.8m 이하의 위치에 설치할 것"],"a":4,"inc":false,"unit":"4-11"},{"id":"gisa-2019-03-03-44","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":44,"q":"경유의 저장량이 2000리터, 중유의 저장량이 4000리터, 등유의 저장량이 2000리터인 저장소에 있어서 지정수량의 배수는?","c":["동일","6배","3배","2배"],"a":2,"inc":false,"unit":"3-9"},{"id":"gisa-2019-03-03-45","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":45,"q":"소방기본법상 명령권자가 소방본부장, 소방서장 또는 소방대장에게 있는 사항은?","c":["소방 활동을 할 때에 긴급한 경우에는 이웃한 소방본부장 또는 소방서장에게 소방업무의 응원을 요청할 수 있다.","화재, 재난·재해, 그 밖의 위급한 상황이 발생한 현장에서 소방활동을 위하여 필요할 때에는 그 관할구역에 사는 사람 또는 그 현장에 있는 사람으로 하여금 사람을 구출하는 일 또는 불을 끄거나 불이 번지지 아니하도록 하는 일을 하게 할 수 있다.","수사기관이 방화 또는 실화의 혐의가 있어서 이미 피의자를 체포하였거나 증거물을 압수하였을 때에 화재조사를 위하여 필요한 경우에는 수사에 지장을 주지 아니하는 범위에서 그 피의자 또는 압수된 증거물에 대한 조사를 할 수 있다.","화재, 재난·재해, 그밖의 위급한 상황이 발생하였을 때에는 소방대를 현장에 신속하게 출동시켜 화재진압과 인명구조·구급 등 소방에 필요한 활동을 하게 하여야 한다."],"a":2,"inc":false,"unit":"1-17"},{"id":"gisa-2019-03-03-48","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":48,"q":"아파트로 층수가 20층인 특정소방대상물에서 스프링클러 설비를 하여야 하는 층수는? (단, 아파트는 신축을 실시하는 경우이다.)","c":["전층","15층 이상","11층 이상","6층 이상"],"a":1,"inc":false,"unit":"4-7"},{"id":"gisa-2019-03-03-49","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":49,"q":"소방기본법령상 소방본부 종합상황실 실장이 소방청의 종합상황실에 서면·모사전송 또는 컴퓨터통신 등으로 보고하여야 하는 화재의 기준에 해당하지 않는 것은?","c":["항구에 매어둔 총 톤수가 1000톤 이상인 선박에서 발생한 화재","연면적 15000m2 이상인 공장 또는 화재경계지구에서 발생한 화재","지정수량의 1000배 이상의 위험물의 제조소·저장소·취급소에서 발생한 화재","층수가 5층 이상이거나 병상이 30개 이상인 종합병원·정신병원·한방병원·요양소에서 발생한 화재"],"a":3,"inc":false,"unit":"3-9"},{"id":"gisa-2019-03-03-51","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":51,"q":"소방기본법령상 특수가연물의 저장 및 취급기준 중 석탄·목탄류를 발전용으로 저장하는 경우 쌓는 부분의 바닥면적은 몇 m2 이하인가? (단, 살수설비를 설치하거나, 방사능력 범위에 해당 특수가연물이 포함되도록 대형수동식소화기를 설치하는 경우이다.)","c":["200","250","300","350"],"a":3,"inc":false,"unit":"3-2"},{"id":"gisa-2019-03-03-55","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":55,"q":"위험물운송자 자격을 취득하지 아니한 자가 위험물 이동탱크저장소 운전 시의 벌칙으로 옳은 것은?","c":["100만원 이하의 벌금","300만원 이하의 벌금","500만원 이하의 벌금","1000만원 이하의 벌금"],"a":4,"inc":false,"unit":"3-9"},{"id":"gisa-2019-03-03-56","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":56,"q":"1급 소방안전관리대상물이 아닌 것은?","c":["15층인 특정소방대상물(아파트는 제외)","가연성가스를 2000톤 저장·취급하는 시설","21층인 아파트로서 300세대인 것","연면적 20000m2 인 문화집회 및 운동시설"],"a":3,"inc":false,"unit":"3-1"},{"id":"gisa-2019-03-03-61","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":61,"q":"대형 이산화탄소 소화기의 소화약제 충전량은 얼마인가?","c":["20 kg 이상","30 kg 이상","50 kg 이상","70 kg 이상"],"a":3,"inc":false,"unit":"6-2"},{"id":"gisa-2019-03-03-62","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":62,"q":"개방형스프링클러설비에서 하나의 방수구역을 담당하는 헤드의 개수는 몇 개 이하로 해야 하는가? (단, 방수구역은 나누어져 있지 않고 하나의 구역으로 되어 있다.)","c":["50","40","30","20"],"a":1,"inc":false,"unit":"4-7"},{"id":"gisa-2019-03-03-63","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":63,"q":"분말소화설비의 가압용 가스용기에 대한 설명으로 틀린 것은?","c":["가압용가스 용기를 3병 이상 설치한 경우에는 2개 이상의 용기에 전자개방밸브를 부착할 것","가압용가스 용기에는 2.5 MPa 이하의 압력에서 조정이 가능한 압력조정기를 설치할 것","가압용가스에 질소가스를 사용하는 것의 질소가스는 소화약제 1kg 마다 20 L(35℃에서 1기압의 압력상태로 환산한 것) 이상으로 할 것","축압용가스에 질소가스를 사용하는 것의 질소가스는 소화약제 1kg 마다 10 L(35℃에서 1기압의 압력상태로 환산한 것) 이상으로 할 것"],"a":3,"inc":false,"unit":"6-1"},{"id":"gisa-2019-03-03-67","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":67,"q":"이산화탄소 소화약제의 저장용기 설치기준 중 옳은 것은?","c":["저장용기의 충전비는 고압식은 1.9 이상 2.3 이하, 저압식은 1.5 이상 1.9 이하로 할 것","저압식 저장용기에는 액면계 및 압력계와 2.1 MPa 이상 1.7 MPa 이하의 압력에서 작동하는 압력경보장치를 설치할 것","저장용기는 고압식은 25 MPa 이상, 저압식은 3.5 MPa 이상의 내압시헙압력에 합격한 것으로 할 것","저압식 저장용기에는 내압시험압력의 1.8배의 압력에서 작동하는 안전밸브와 내압시험압력의 0.8배부터 내압시험압력까지의 범위에서 작동하는 봉판을 설치할 것"],"a":3,"inc":false,"unit":"6-2"},{"id":"gisa-2019-03-03-72","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":72,"q":"다음 중 스프링클러설비와 비교하여 물분무 소화설비의 장점으로 옳지 않은 것은?","c":["소량의 물을 사용함으로써 물의 사용량 및 방사량을 줄일 수 있다.","운동에너지가 크므로 파괴주수 효과가 크다.","전기 절연성이 높아서 고압통전기기의 화재에도 안전하게 사용할 수 있다.","물의 방수과정에서 화재열에 따른 부피증가량이 커서 질식효과를 높일 수 있다."],"a":2,"inc":false,"unit":"4-10"},{"id":"gisa-2019-03-03-75","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":75,"q":"주차장에 분말소화약제 120kg을 저장하려고 한다. 이때 필요한 저장용기의 최소 내용적(L)은?","c":["96","120","150","180"],"a":2,"inc":false,"unit":"6-1"},{"id":"gisa-2019-03-03-76","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":76,"q":"다음 중 노유자 시설의 4층 이상 10층 이하에서 적응성이 있는 피난기구가 아닌 것은?","c":["피난교","다수인피난장비","승강식피난기","미끄럼대"],"a":4,"inc":false,"unit":"7-3"},{"id":"gisa-2019-03-03-77","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":77,"q":"물분소화설비를 설치하는 차고의 배수설비 설치기준 중 틀린 것은?","c":["차량이 주차하는 장소의 적당한 곳에 높이 10cm 이상의 경계턱으로 배수구를 설치할 것","길이 40m 이하마다 집수관, 소화핏트 등 기름분리장치를 설치할 것","차량이 주차하는 바닥은 배수구를 향하여 100분의 1 이상의 기울기를 유지할 것","배수설비는 가압송수장치의 최대 송수능력의 수량을 유효하게 배수할 수 있는 크기 및 기울기로 할 것"],"a":3,"inc":false,"unit":"4-6"},{"id":"gisa-2019-03-03-78","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":78,"q":"층수가 10층인 일반창고에 습식 폐쇄형 스프링클러헤드가 설치되어 있다면 이 설비에 필요한 수원의 양은 얼마 이상이어야 하는가? (단, 이 창고는 특수가연물을 저장·취급하지 않는 일반물품을 적용하고, 헤드가 가장 많이 설치된 층은 8층으로서 40개가 설치되어 있다.)","c":["16m3","32m3","48m3","64m3"],"a":2,"inc":false,"unit":"3-2"},{"id":"gisa-2019-03-03-79","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-03-03","num":79,"q":"포소화설비에서 펌프의 토출관에 압입기를 설치하여 포 소화약제 압입용 펌프로 포소화약제를 압입시켜 혼합하는 방식은?","c":["라인 프로포셔너방식","펌프 프로포셔너방식","프레져 프로포셔너방식","프레져사이드 프로포셔너방식"],"a":4,"inc":false,"unit":"5-1"},{"id":"gisa-2019-04-27-1","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":1,"q":"건축물의 화재를 확산시키는 요인이라 볼 수 없는 것은?","c":["비화(飛火)","복사열(輻射熱)","자연발화(自然發火)","접염(接炎)"],"a":3,"inc":false,"unit":"1-1"},{"id":"gisa-2019-04-27-3","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":3,"q":"다음 중 가연물의 제거를 통한 소화 방법과 무관한 것은?","c":["산불의 확산방지를 위하여 산림의 일부를 벌채한다.","화학반응기의 화재 시 원료 공급관의 밸브를 잠근다.","전기실 화재 시 1G-54 약재를 방출한다.","유류탱크 화재 시 주변에 있는 유류탱크의 유류를 다른 곳으로 이동시킨다."],"a":3,"inc":false,"unit":"1-5"},{"id":"gisa-2019-04-27-6","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":6,"q":"물 소화약제를 어떠한 상태로 주수할 경우 전기화재의 진압에서도 소화능력을 발휘할 수 있는가?","c":["물에 의한 봉상주수","물에 의한 적상주수","물에 의한 무상주수","어떤 상태의 주수에 의해서도 효과가 없다."],"a":3,"inc":false,"unit":"10-5"},{"id":"gisa-2019-04-27-8","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":8,"q":"분말 소화약제의 취급 시 주의사항으로 틀린 것은?","c":["습도가 높은 공기 중에 노출되면 고화되므로 항상 주의를 기울인다.","층진시 다른 소화약제와 혼합을 피하기 위하여 종별로 각각 다른 색으로 착색되어 있다.","실내에서 다량 방사하는 경우 분말을 흡입하지 않도록 한다.","분말 소화약제와 수성막포를 함께 사용할 경우 포의 소포 현상을 발생시키므로 병용해서는 안된다."],"a":4,"inc":false,"unit":"6-1"},{"id":"gisa-2019-04-27-10","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":10,"q":"다음 위험물 중 특수인화물이 아닌 것은?","c":["아세톤","디에틸에테르","산화프로필렌","아세트알데히드"],"a":1,"inc":false,"unit":"3-2"},{"id":"gisa-2019-04-27-13","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":13,"q":"다음 중 동일한 조건에서 증발잠열[kJ/kg]이 가장 큰 것은?","c":["질소","할론 1301","이산화탄소","물"],"a":4,"inc":false,"unit":"6-2"},{"id":"gisa-2019-04-27-15","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":15,"q":"연면적이 1,000[m2] 이상인 건축물에 설치하는 방화벽이 갖추어야 할 기준으로 틀린 것은?","c":["내화구조로서 설 수 있는 구조일 것","방화벽의 양쪽 끝과 위쪽 끝을 건축물의 외벽면 및 지붕면으로부터 0.1[m] 이상 튀어나오게 할 것","방화벽에 설치하는 출입문의 너비는 2.5[m] 이하로 할 것","방화벽에 설치하는 출입문의 높이는 2.5[m] 이하로 할 것"],"a":2,"inc":false,"unit":"2-2"},{"id":"gisa-2019-04-27-17","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":17,"q":"공기의 부피 비율이 질소 79[%], 산소 21[%]인 전기실에 화재가 발생하여 이산화탄소 소화약제를 방출하여 소화하였다. 이 때 산소의 부피농도가 14[%]이었다면 이 혼합 공기의 분자량은 약 얼마인가? (단, 화재시 발생한 연소가스는 무시한다.)","c":["28.9","30.9","33.9","35.9"],"a":3,"inc":false,"unit":"6-2"},{"id":"gisa-2019-04-27-26","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":26,"q":"비중병의 무게가 비었을 때는 2[N]이고, 액체로 충만되어 있을 때는 8[N]이다. 액체의 체적이 0.5[L]이면 이 액체의 비중량은 약 몇 [N/m3]인가?","c":["11,000","11,500","12,000","12,500"],"a":3,"inc":false,"unit":"4-1"},{"id":"gisa-2019-04-27-27","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":27,"q":"10[kg]의 수증기가 들어 있는 체적 2[m3]의 단단한 용기를 냉각하여 온도를 200[℃]에서 150[℃]로 낮추었다. 나중 상태에서 액체상태의 물은 약 몇 [kg]인가? (단, 150[℃]에서 물의 포화액 및 포화증기의 비체적은 각각 0.0011[m3/kg], 0.3925[m3/kg]이다.)","c":["0.508","1.24","4.92","7.86"],"a":3,"inc":false,"unit":"4-1"},{"id":"gisa-2019-04-27-34","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":34,"q":"수평관의 길이가 100[m]이고, 안지름이 100[mm]인 소화설비 배관 내를 평균유속 2[m/s]로 물이 흐를 때 마찰손실수두는 약 몇 [m]인가? (단, 관의 마찰계수는 0.05이다.)","c":["9.2","10.2","11.2","12.2"],"a":2,"inc":false,"unit":"4-3"},{"id":"gisa-2019-04-27-36","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":36,"q":"외부표면의 온도가 24[℃], 내부표면의 온도가 24.5[℃]일 때, 높이 1.5[m], 폭 1.5[m], 두께 0.5[cm]인 유리창을 총한 열전달률은 약 몇 [W]인가? (단, 유리창의 열전도계수는 0.8[w/mㆍK]이다.","c":["180","200","1,800","2,000"],"a":1,"inc":false,"unit":"1-7"},{"id":"gisa-2019-04-27-37","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":37,"q":"어떤 용기 내의 이산화탄소(45[kg])가 방호공간에 가스 상태로 방출되고 있다. 방출 온도가 압력이 15[℃], 101[kPa]일 때 방출가스의 체적은 약 몇 [m3]인가? (단, 일반 기체상수는 8,314[J/kmolㆍK]이다.)","c":["2.2","12.2","20.2","24.3"],"a":4,"inc":false,"unit":"6-2"},{"id":"gisa-2019-04-27-41","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":41,"q":"소방시설을 구분하는 경우 소화설비에 해당되지 않는 것은?","c":["스프링클러설비","제연설비","자동확산소화기","옥외소화전설비"],"a":2,"inc":false,"unit":"4-7"},{"id":"gisa-2019-04-27-43","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":43,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 둘 이상의 특정소방대상물이 내화구조로 된 연결통로가 벽이 없는 구조로서 그 길이가 몇 [m] 이하인 경우 하나의 소방대상물로 보는가?","c":["6","9","10","12"],"a":1,"inc":false,"unit":"2-3"},{"id":"gisa-2019-04-27-49","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":49,"q":"소방기본법령상 인접하고 있는 시ㆍ도간 소방업무의 상호응원협정을 체결하고자 할 때, 포함되어야 하는 사항으로 틀린 것은?","c":["소방교육ㆍ훈련의 종류에 관한 사항","화재의 경계ㆍ진압활동에 관한 사항","출동대원의 수당ㆍ식사 및 피복의 수선의 소요경비의 부담에 관한 사항","화재조사활동에 관한 사항"],"a":1,"inc":false,"unit":"1-17"},{"id":"gisa-2019-04-27-52","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":52,"q":"산화성고체인 제1류 위험물에 해당되는 것은?","c":["질산염류","특수인화물","과염소산","유기과산화물"],"a":1,"inc":false,"unit":"3-2"},{"id":"gisa-2019-04-27-61","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":61,"q":"작동전압이 22,900[V]의 고압의 전기기기가 있는 장소에 물분무설비를 설치할 때 전기기기와 물 분무 헤드 사이의 최소 이격 거리는 얼마로 해야 하는가?","c":["70[cm] 이상","80[cm] 이상","110[cm] 이상","150[cm] 이상"],"a":1,"inc":false,"unit":"4-10"},{"id":"gisa-2019-04-27-62","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":62,"q":"다음 중 일반화재(A급 화재)에 적응성을 만족하지 못한 소화약제는? (문제 오류로 가답안 발표시 4번으로 발표되었지만 확정답안 발표시 모두 정답처리 되었습니다. 여기서는 1번을 누르면 정답 처리 됩니다.)","c":["포 소화약제","강화액 소화약제","할론 소화약제","이산화탄소 소화약제"],"a":1,"inc":false,"unit":"6-4"},{"id":"gisa-2019-04-27-63","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":63,"q":"거실 제연설비 설계 중 배출량 선정에 있어서 고려하지 않아도 되는 사항은?","c":["예상제연구역의 수직거리","예상제연구역의 바닥면적","제연설비의 배출방식","자동식 소화설비 및 피난설비의 설치 유무"],"a":4,"inc":false,"unit":"7-7"},{"id":"gisa-2019-04-27-66","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":66,"q":"학교, 공장, 창고시설에 설치하는 옥내소화전에서 가압송수장치 및 기동장치가 동결의 우려가 있는 경우 일부 사항을 제외하고는 주펌프와 동등 이상의 성능이 있는 별도의 펌프로서 내연기관의 기동과연동하여 작동되거나 비상전원을 연결한 펌프를 추가 설치해야 한다. 다음 중 이러한 조치를취해야 하는 경우는?","c":["지하층이 없이 지상층만 있는 건축물","고가수조를 가압송수장치로 설치한 경우다.","수원이 건축물의 최상층에 설치된 방수구보다 높은 위치에 설치되 경우","건축물의 높이가 지표면으로부터 10[m] 이하인 경우"],"a":1,"inc":false,"unit":"4-6"},{"id":"gisa-2019-04-27-70","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":70,"q":"이산화탄소 소화약제의 저장용기에 관한 일반적인 설명으로 옳지 않은 것은?","c":["방호구역내의 장소에 설치하되 피난구 부근을 피하여 설치할 것","온도가 40[℃] 이하이고, 온도변화가 적은 곳에 설치할 것","직사광선 및 빗물이 침투할 우려가 없는 곳에 설치할 것","용기간의 간격은 점검에 지장이 없도록 3[cm] 이상의 간격을 유지할 것"],"a":1,"inc":false,"unit":"6-2"},{"id":"gisa-2019-04-27-72","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":72,"q":"포소화약제의 혼합장치 중 펌프의 토출관에 압입기를 설치하여 포 소화약제 압입용 펌프로 소화약제를 압입시켜 혼합하는 방식은?","c":["펌프 프로포셔너 방식","프레져사이드 프로포셔너 방식","라인 프로포셔너 방식","프레져 프로포셔너 방식"],"a":2,"inc":false,"unit":"5-1"},{"id":"gisa-2019-04-27-75","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":75,"q":"물분무소화설비 가압송수장치의 토출량에 대한 최소기준으로 옳은 것은? (단, 특수가연물을 저장 취급하는 특정 소방대상물 및 차고 주차장의 바닥면적은 50[m2]이하인 경우는 50[m2]를 기준으로 한다.)","c":["차고 또는 주차장의 바닥면적 1[m2]에 대해 10[L/min]로 20분간 방수할 수 있는 양 이상","특수가연물을 저장ㆍ취급하는 특정 소방대상물의 바닥면적 1[m2]에 대해 20[L/min]로 20분간 방수할 수 있는 양 이상","케이블 트레이, 케이블 덕트는 투영된 바닥면적 1[m2]에 대해 10[L/mim]로 20분간 방수할 수 있는 양 이상","절연유 봉입 변압기는 바닥면적을 제외한 표면적을 합한 면적1[m2]에 대해 10[L/min]로 20분간 방수할 수 있는 양 이상"],"a":4,"inc":false,"unit":"4-10"},{"id":"gisa-2019-04-27-76","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-04-27","num":76,"q":"피난기구 설치 기준으로 옳지 않은 것은?","c":["피난기구는 소방대상물의 기둥ㆍ바닥ㆍ보, 기타 구조상 견고한 부분에 볼트조임ㆍ매입ㆍ용접, 기타의 방법으로 견고하게 부착할 것","2층 이상의 층에 피난사다리(하향식 피난구용 내림식사다리는 제외한다.)를 설치하는 경우에는 금속성 고정사다리를 설치하고, 피난에 방해되지 않도록 노대는 설치되지 않아야 할 것","승강식피난기 및 하향식 피난구용 내림식사다리는 설치경로가 설치층에서 피난층까지 연계될 수 있는 구조로 설치할 것. 다만, 건축물의 구조 및 설치 여건 상 불가피한 경우에는 그러하지 아니한다.","승강식피난기 및 하향식 피난구용 내림식사다리의 하강식 내측에는 기구의 연결 금속구 등이 없어야 하며 전개된 피난기구는 하강수 수평투영면적 공간 내의 범위를 침범하지 않는 구조이어야 할 것. 단, 직경 60[cm] 크기의 범위를 벗어난 경우이거나, 직하층의 바닥 면으로부터 높이 50[cm] 이하의 범위는 제외한다."],"a":2,"inc":false,"unit":"7-3"},{"id":"gisa-2019-09-21-1","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":1,"q":"소화원리에 대한 설명으로 틀린 것은?","c":["냉각소화 : 물의 증발잠열에 의해서 가연물의 온도를 저하시키는 소화방법","제거효과 : 가연성 가스의 분출화재 시 연료공급을 차단시키는 소화방법","질식소화 : 포소화약제 또는 불연성가스를 이용해서 공기 중의 산소공급을 차단하여 소화하는 방법","억제소화 : 불활성기체를 방출하여 연소범위 이하로 낮추어 소화하는 방법"],"a":4,"inc":false,"unit":"5-1"},{"id":"gisa-2019-09-21-2","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":2,"q":"할로겐화합물 청정소화약제는 일반적으로 열을 받으면 할로겐족이 분해되어 가연물질의 연소 과정에서 발생하는 활성종과 화합하여 연소의 연쇄반응을 차단한다. 연쇄반응의 차단과 가장 거리가 먼 소화약제는?","c":["FC-3-1-10","HFC-125","IG-541","FIC-1311"],"a":3,"inc":false,"unit":"1-5"},{"id":"gisa-2019-09-21-4","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":4,"q":"화재 시 이산화탄소를 방출하여 산소농도를 13vol%로 낮추어 소화하기 위한 공기 중 이산화탄소의 농도는 약 몇 vol%인가?","c":["9.5","25.8","38.1","61.5"],"a":3,"inc":false,"unit":"6-2"},{"id":"gisa-2019-09-21-6","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":6,"q":"다음 중 인화점이 가장 낮은 물질은?","c":["산화프로필렌","이황화탄소","메틸알코올","등류"],"a":1,"inc":false,"unit":"1-1"},{"id":"gisa-2019-09-21-9","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":9,"q":"에테르, 케톤, 에스테르, 알데히드, 카르복실산, 아민 등과 같은 가연성인 수용성 용매에 유효한 포소화약제는?","c":["단백포","수성막포","불화단백포","내알코올포"],"a":4,"inc":false,"unit":"5-1"},{"id":"gisa-2019-09-21-10","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":10,"q":"특정소방대상물(소방안전관리대상물은 제외)의 관계인과 소방안전관리대상물의 소방안전관리자의 업무가 아닌 것은?","c":["화기 취급의 감독","자체소방대의 운용","소방 관련 시설의 유지ㆍ관리","피난시설, 방화구획 및 방화시설의 유지ㆍ관리"],"a":2,"inc":false,"unit":"2-1"},{"id":"gisa-2019-09-21-11","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":11,"q":"화재의 유형별 특성에 관한 설명으로 옳은 것은?","c":["A급 화재는 무색으로 표시하며, 감전의 위험이 있으므로 주수소화를 엄금한다.","B급 화재는 황색으로 표시하며, 질식소화를 통해 화재를 진압한다.","C급 화재는 백색으로 표시하며, 가연성이 강한 금속의 화재이다.","D급 화재는 청색으로 표시하며, 연소 후에 재를 남긴다."],"a":2,"inc":false,"unit":"3-1"},{"id":"gisa-2019-09-21-12","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":12,"q":"화재발생 시 인명피해 방지를 위한 건물로 적합한 것은?","c":["피난설비가 없는 건물","특별피난계단의 구조로 된 건물","피난기구가 관리되고 있지 않은 건물","피난구 폐쇄 및 피난구유도등이 미비되어 있는 건물"],"a":2,"inc":false,"unit":"7-3"},{"id":"gisa-2019-09-21-13","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":13,"q":"프로판가스의 연소범위(vol%)에 가장 가까운 것은?","c":["9.8~28.4","2.5~81","4.0~75","2.1~9.5"],"a":4,"inc":false,"unit":"1-3"},{"id":"gisa-2019-09-21-14","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":14,"q":"불포화 섬유지나 석탄에 자연발화를 일으키는 원인은?","c":["분해열","산화열","발효열","중합열"],"a":2,"inc":false,"unit":"1-1"},{"id":"gisa-2019-09-21-16","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":16,"q":"다음 중 전산실, 통신 기기실 등에서의 소화에 가장 적합한 것은?","c":["스프링클러설비","옥내소화전설비","분말소화설비","할로겐화합물 및 불활성기체 소화설비"],"a":4,"inc":false,"unit":"6-3"},{"id":"gisa-2019-09-21-17","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":17,"q":"가연물의 제거와 가장 관련이 없는 소화방법은?","c":["유류화재 시 유류공급 밸브를 잠근다.","산불화재 시 나무를 잘라 없앤다.","팽창 진주암을 사용하여 진화한다.","가스화재 시 중간밸브를 잠근다."],"a":3,"inc":false,"unit":"1-5"},{"id":"gisa-2019-09-21-19","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":19,"q":"BLEVE 현상을 설명한 것으로 가장 옳은 것은?","c":["물이 뜨거운 기름표면 아래에서 끓을 때 화재를 수반하지 않고 over flow 되는 현상","물이 연소유의 뜨거운 표면에 들어갈 때 발생되는 over flow 현상","탱크 바닥에 물과 기름의 에멀젼이 섞여있을 때 물의 비등으로 인하여 급격하게 over flow 되는 현상","탱크 주위 화재로 탱크 내 인화성 액체가 비등하고 가스부분의 압력이 상승하여 탱크가 파괴되고 폭발을 일으키는 현상"],"a":4,"inc":false,"unit":"1-21"},{"id":"gisa-2019-09-21-24","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":24,"q":"이상기체의 폴리트로픽 변화 'PVn=일정‘에서 n=1인 경우 어느 변화에 속하는가? (단, P는 압력, V는 부피, n은 폴리트로프 지수를 나타낸다.)","c":["단열변화","등온변화","정적변화","정압변화"],"a":2,"inc":false,"unit":"14-2"},{"id":"gisa-2019-09-21-26","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":26,"q":"초기에 비어 있는 체적이 0.1m3인 견고한 용기 안에 공기(이상기체)를 서서히 주입한다. 공기 1kg을 넣었을 때 용기 안의 온도가 300K가 되었다면 이 때 용기 안의 압력(kPa)은? (단, 공기의 기체상수는 0.287kJ/kgㆍK이다.)","c":["287","300","448","861"],"a":4,"inc":false,"unit":"14-2"},{"id":"gisa-2019-09-21-33","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":33,"q":"글로브 밸브에 의한 손실을 지름이 10cm이고 관 마찰계수가 0.025인 관의 길이로 환산하면 상당길이가 40m가 된다. 이 밸브의 부차적 손실계수는?","c":["0.25","1","2.5","10"],"a":4,"inc":false,"unit":"4-3"},{"id":"gisa-2019-09-21-35","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":35,"q":"물질의 열역학적 변화에 대한 설명으로 틀린 것은?","c":["마찰은 비가역성의 원인이 될 수 있다.","열역학 제1법칙은 에너지 보존에 대한 것이다.","이상기체는 이상기체 상태방정식을 만족한다.","가역단열과정은 엔트로피가 증가하는 과정이다."],"a":4,"inc":false,"unit":"1-8"},{"id":"gisa-2019-09-21-39","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":39,"q":"지름이 150mm인 원관에 비중이 0.85, 동점성계수가 1.33×10-4m2/s기름이 0.01m3/s의 유량으로 흐르고 있다. 이때 관 마찰계수는? (단, 임계 레이놀즈수는 2100이다.)","c":["0.10","0.14","0.18","0.22"],"a":1,"inc":false,"unit":"4-3"},{"id":"gisa-2019-09-21-52","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":52,"q":"화재예방, 소방시설 설치ㆍ유지 및 안전관리에 관한 법령상 간이스프링클러설비를 설치하여야 하는 특정소방대상물의 기준으로 옳은 것은?","c":["근린생활시설로 사용하는 부분의 바닥면적 합계가 1000m2 이상인 것은 모든 층","교육연구시설 내에 있는 합숙소로서 연면적 500m2 이상인 것","정신병원과 의료재활시설을 제외한 요양병원으로 사용되는 바닥면적의 합계가 300m2 이상 600m2 미만인 시설","정신의료기관 또는 의료재활시설로 사용되는 바닥면적의 합계가 600m2 미만인 시설"],"a":1,"inc":false,"unit":"4-7"},{"id":"gisa-2019-09-21-61","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":61,"q":"이산화탄소소화설비의 기동장치에 대한 기준으로 틀린 것은?","c":["자동식 기동장치에는 수동으로도 기동할 수 있는 구조이어야 한다.","가스압력식 기동장치에서 기동용가스용기 및 해당용기에 사용하는 밸브는 20 MPa이상의 압력에견딜 수 있어야 한다.","수동식 기동장치의 조작부는 바닥으로부터 높이 0.8m 이상 1.5m 이하의 위치에 설치한다.","전기식 기동장치로서 7병 이상의 저장용기를 동시에 개방하는 설비는 2병 이상의 저장용기에 전자 개방밸브를 부착해야 한다."],"a":2,"inc":false,"unit":"6-2"},{"id":"gisa-2019-09-21-63","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":63,"q":"주요 구조부가 내화구조이고 건널 복도가 설치된 층의 피난기구 수의 설치 감소 방법으로 적합한 것은?","c":["피난기구를 설치하지 아니할 수 있다.","피난기구의 수에서 1/2을 감소한 수로 한다.","원래의 수에서 건널 복도 수를 더한 수로 한다.","피난기구의 수에서 해당 건널 복도의 수의 2배의 수를 뺀 수로 한다."],"a":4,"inc":false,"unit":"7-3"},{"id":"gisa-2019-09-21-65","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":65,"q":"물분무소화설비의 가압송수장치로 압력수조의 필요압력을 산출할 때 필요한 것이 아닌 것은?","c":["낙차의 환산수두압","물분무헤드의 설계압력","배관의 마찰손실 수두압","소방용 호스의 마찰손실 수두압"],"a":4,"inc":false,"unit":"4-10"},{"id":"gisa-2019-09-21-67","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":67,"q":"물분무소화설비의 소화작용이 아닌 것은?","c":["부촉매작용","냉각작용","질식작용","희석작용"],"a":1,"inc":false,"unit":"4-10"},{"id":"gisa-2019-09-21-69","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":69,"q":"분말소화설비의 분말소화약제 1kg당 저장용기의 내용적 기준으로 틀린 것은?","c":["제1종 분말 : 0.8L","제2종 분말 : 1.0L","제3종 분말 : 1.0L","제4종 분말 : 1.8L"],"a":4,"inc":false,"unit":"6-1"},{"id":"gisa-2019-09-21-71","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":71,"q":"특별피난계단의 계단실 및 부속실 제연설비의 안전기준에 대한 내용으로 틀린 것은?","c":["제연구역과 옥내와의 사이에 유지하여야 하는 최소 차압은 40Pa 이상으로 하여야 한다.","제연설비가 가동되었을 경우 출입문의 개방에 필요한 힘은 110N 이상으로 하여야 한다.","계단실과 부속실을 동시에 제연하는 경우 부속실의 기압은 계단실과 같게 하거나 부속실과 계단실의 압력차이가 5Pa 이하가 되도록 하여야 한다.","계단실 및 그 부속실을 동시에 제연하거나 또는 계단실만 단독으로 제연할 때의 방연풍속은 0.5m/s 이상이어야 한다."],"a":2,"inc":false,"unit":"7-8"},{"id":"gisa-2019-09-21-72","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":72,"q":"스프링클러설비의 가압송수장치의 정격토출압력은 하나의 헤드선단에 얼마의 방수압력이 될 수 있는 크기이어야 하는가?","c":["0.01 MPa 이상 0.05 MPa 이하","0.1 MPa 이상 1.2 MPa 이하","1.5 MPa 이상 2.0 MPa 이하","2.5 MPa 이상 3.3 MPa 이하"],"a":2,"inc":false,"unit":"4-7"},{"id":"gisa-2019-09-21-73","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":73,"q":"스프링클러설비의 교차배관에서 분기되는 지점을 기점으로 한쪽 가지배관에 설치되는 헤드는 몇 개 이하로 설치하여야 하는가? (단, 수리학적 배관방식의 경우는 제외한다.)","c":["8","10","12","18"],"a":1,"inc":false,"unit":"4-11"},{"id":"gisa-2019-09-21-77","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":77,"q":"옥내소화전이 하나의 층에는 6개, 또 다른 층에는 3개, 나머지 모든 층에는 4개씩 설치되어 있다. 수원의 최소 수량(m3) 기준은?(2021년 04월 01일 개정된 규정 적용됨)","c":["5.2","10.4","13","15.6"],"a":1,"inc":false,"unit":"4-6"},{"id":"gisa-2019-09-21-78","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":78,"q":"스프링클러설비의 누수로 인한 유수검지장치의 오작동을 방지하기 위한 목적으로 설치하는 것은?","c":["솔레노이드 밸브","리타딩 챔버","물올림 장치","성능시험배관"],"a":2,"inc":false,"unit":"4-7"},{"id":"gisa-2019-09-21-79","cat":"gisa","catLabel":"소방설비기사 · 기계분야","catShort":"기사","round":"2019-09-21","num":79,"q":"전역방출방식 분말 소화설비에서 방호구역의 개구부에 자동폐쇄장치를 설치하지 아니한 경우, 개구부의 면적 1m2에 대한 분말소화약제의 가산량으로 잘못 연결된 것은?","c":["제1종 분말 – 4.5kg","제2종 분말 – 2.7kg","제3종 분말 – 2.5kg","제4종 분말 – 1.8kg"],"a":3,"inc":false,"unit":"6-1"},{"id":"gisa-2020-06-06-1","cat":"gisa","catLabel":"소방설비기사 · 기계분야","ca
