20-28","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":28,"q":"관수로 흐름에서 미소손실에 해당하지 않는 것은?","c":["단면 급확대손실","단면 급축소손실","밸브손실","마찰손실"],"a":4,"inc":false,"unit":"4-3"},{"id":"gwallisa-2023-05-20-29","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":29,"q":"이상유체 흐름에서 베르누이 방정식의 전수두(total head)를 구성하는 수두가 아닌 것은?","c":["위치수두","마찰손실수두","압력수두","속도수두"],"a":2,"inc":false,"unit":"4-2"},{"id":"gwallisa-2023-05-20-33","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":33,"q":"Darcy-Weisbach의 마찰손실공식에 관한 설명 중 옳지 않은 것은?","c":["마찰손실수두는 관경에 반비례한다.","마찰손실수두는 마찰손실계수에 비례한다.","마찰손실수두는 관의 길이에 비례한다.","마찰손실수두는 유속의 제곱에 반비례한다."],"a":4,"inc":false,"unit":"14-2"},{"id":"gwallisa-2023-05-20-38","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":38,"q":"소화약제원액 12L를 사용하여 3%의 수성막포소화약제 수용액을 만들었다. 이 수용액을 모두 사용하여 발생시킨 포의 총 부피가 4m3 일 때 포의 팽창비는 얼마인가?","c":["5","8","10","14"],"a":3,"inc":false,"unit":"5-1"},{"id":"gwallisa-2023-05-20-39","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":39,"q":"소화약제의 형식승인 및 제품검사의 기술기준상 포소화약제에 관한 내용으로 옳지 않은 것은? (단, 측정값은 기술기준의 시험방법에 따라 측정하며, 오차범위는 고려하지 않는다.)","c":["유동점은 사용 하한온도보다 2.5℃ 이하이어야 한다.","수성막포소화약제의 수소이온농도의 범위는 6.0 이상 8.5 이하이어야 한다.","알콜형포소화약제의 비중의 범위는 0.90 이상 1.20 이하이어야 한다.","고발포용포소화약제는 거품의 팽창율은 500배 이상이어야 하며, 발포전 포수용액 용량의 25%인 포수용액이 거품으로부터 환원되는데 필요한 시간이 1분 이하이어야 한다."],"a":4,"inc":false,"unit":"5-1"},{"id":"gwallisa-2023-05-20-40","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":40,"q":"할론소화약제의 특징에 관한 설명으로 옳은 것은?","c":["할론 1211의 화학식은 CF3ClBr이다.","할론 2402는 에테인(ethane)의 유도체이다.","오존파괴지수는 할론 1211이 할론 1301보다 크다.","할론 1301은 상온과 상압에서 액체이며, 주된 소화효과는 억제소화이다."],"a":2,"inc":false,"unit":"6-3"},{"id":"gwallisa-2023-05-20-42","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":42,"q":"분말소화약제에 관한 설명으로 옳은 것은?","c":["제1종 분말의 주성분은 KHCO3 이다.","차고 또는 주차장에 설치하는 분말소화설비의 소화약제는 제3종 분말을 사용한다.","칼륨의 중탄산염이 주성분인 소화약제는 황색, 인산염이 주성분인 소화약제는 담홍색으로 각각 착색하여야 한다.","분말상태의 소화약제는 굳거나 덩어리지거나 변질 등 그 밖의 이상이 생기지 아니하여야 하며 페네트로메타(penetrometer)시험기로 시험한 경우 10mm 이하 침투되어야 한다."],"a":2,"inc":false,"unit":"6-1"},{"id":"gwallisa-2023-05-20-56","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":56,"q":"소방시설공사업법령상 소방본부장이나 소방서장이 완공검사를 위해 현장확인을 할 수 있는 특정소방대상물로 옳지 않은 것은?","c":["스프링클러설비가 설치되는 특정소방대상물","가연성가스를 제조·저장 또는 취급하는 시설 중 지상에 노출된 가연성가스탱크의 저장용량 합계가 1백톤 이상인 시설","연면적 1만제곱미터 이상이거나 11층 이상인 특정소방대상물(아파트는 제외)","「다중이용업소의 안전관리에 관한 특별법」에 따른 다중이용업소"],"a":2,"inc":false,"unit":"4-7"},{"id":"gwallisa-2023-05-20-63","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":63,"q":"소방시설 설치 및 관리에 관한 법령상 내진설계를 하여야 하는 소방시설이 아닌 것은?","c":["옥내소화전설비","강화액소화설비","연결송수관설비","포소화설비"],"a":3,"inc":false,"unit":"13-1"},{"id":"gwallisa-2023-05-20-64","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":64,"q":"소방시설 설치 및 관리에 관한 법령상 지하가 중 길이가 750m인 터널에 설치해야 하는 소방시설은?","c":["옥외소화전설비","자동화재탐지설비","무선통신보조설비","연결살수설비"],"a":3,"inc":false,"unit":"8-7"},{"id":"gwallisa-2023-05-20-70","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":70,"q":"위험물안전관리법령상 소화난이도등급 Ⅰ에 해당하는 제조소등이 아닌 것은?","c":["옥내탱크저장소로 액표면적이 30m2 이상인 것(제6류 위험물을 저장하는 것 및 고인화점위험물만을 100℃ 미만의 온도에서 저장하는 것은 제외)","암반탱크저장소로 고체위험물만을 저장하는 것으로서 지정수량의 100배 이상인 것","옥내저장소로 처마높이가 6m 이상인 단층건물의 것","이송취급소"],"a":1,"inc":false,"unit":"3-10"},{"id":"gwallisa-2023-05-20-76","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":76,"q":"제1류 위험물인 산화성 고체에 관한 설명으로 옳은 것은?","c":["가연성 유기화합물과 혼합 시 연소 위험성이 증가한다.","무기과산화물 관련 대형화재인 경우 질식소화는 효과가 없으며 다량의 물을 사용하여 소화하는 것이 좋다.","제6류 위험물인 산화성 액체와 혼합하면 대부분 산화성이 감소한다.","물에 녹는 것이 많으며 수용액 상태에서는 산화성이 없어지고 환원제로 작용한다."],"a":1,"inc":false,"unit":"3-2"},{"id":"gwallisa-2023-05-20-78","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":78,"q":"제2류 위험물인 Mg에 관한 설명으로 옳지 않은 것은?","c":["상온에서는 비교적 안정하지만 뜨거운 물이나 과열 수증기와 접촉하면 격렬하게 H2를 발생한다.","황산과 반응하여 H2를 발생한다.","Mg분말 화재 발생 시 이산화탄소 소화약제를 사용한다.","Br2와 반응하여 금속 할로겐 화합물을 만든다."],"a":3,"inc":false,"unit":"6-3"},{"id":"gwallisa-2023-05-20-79","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":79,"q":"황린(P4)과 황화린(P2S5)에 관한 설명으로 옳지 않은 것은?","c":["황린은 공기 중에서 연소 시 유해가스인 백색의 P2O5가 발생되나 황화린은 연소 시 P2O5가 발생되지 않는다.","황린은 황화린보다 지정수량이 더 적다.","황린은 수산화칼륨 용액과 반응하여 유해한 PH3를 발생한다.","황화린은 물과 접촉 시 유해성, 가연성의 H2S를 발생시키므로 화재소화 시 CO2 등을 이용한 질식소화를 한다."],"a":1,"inc":false,"unit":"3-1"},{"id":"gwallisa-2023-05-20-81","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":81,"q":"C6H6 2몰을 공기 중에서 완전히 연소시킬 때 발생되는 이산화탄소의 양(g)은? (단, C의 원자량은 12, O의 원자량은 16, H의 원자량은 1로 한다.)","c":["66","132","264","528"],"a":4,"inc":false,"unit":"6-2"},{"id":"gwallisa-2023-05-20-82","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":82,"q":"제4류 위험물의 지정수량 크기를 작은 것부터 큰 것까지의 순서로 옳은 것은?","c":["경유 ＜ 아세트산 ＜ 이소프로필알코올 ＜ 에틸렌글리콜","이소프로필알코올 ＜ 경유 ＜ 아세트산 ＜ 에틸렌글리콜","이소프로필알코올 ＜ 에틸렌글리콜 ＜ 경유 ＜ 아세트산","경유 ＜ 이소프로필알코올 ＜ 에틸렌글리콜 ＜ 아세트산"],"a":2,"inc":false,"unit":"1-23"},{"id":"gwallisa-2023-05-20-83","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":83,"q":"제4류 위험물에 관한 설명으로 옳지 않은 것은?","c":["벤젠 증기는 공기보다 무거워서 낮은 곳에 체류하므로, 점화원에 의해 불이 일시에 번질 위험이 있다.","휘발유는 전기가 잘 통하므로 인화되기 쉽다.","시안화수소 기체는 공기보다 약간 가벼우며 맹독성 물질이다.","이황화탄소를 물을 채운 수조탱크 중에 저장하면 가연성 증기의 발생이 억제되어 안전하다."],"a":2,"inc":false,"unit":"3-1"},{"id":"gwallisa-2023-05-20-91","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":91,"q":"위험물안전관리법령상 위험물을 취급하는 건축물의 지붕(작업공정상 제조기계시설등이 2층 이상에 연결되어 설치된 경우에는 최상층의 지붕을 말한다)을 내화구조로 할 수 있는 건축물로 옳은 것은?","c":["제4석유류를 취급하는 건축물","질산염류를 취급하는 건축물","알킬알루미늄을 취급하는 건축물","히드록실아민을 취급하는 건축물"],"a":1,"inc":false,"unit":"2-3"},{"id":"gwallisa-2023-05-20-93","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":93,"q":"위험물안전관리법령상 제3석유류를 취급하는 설비가 집중되어 있는 위험물 취급장소의 살수기준면적이 300m2인 경우 스프링클러설비가 소화 적응성이 있기 위한 최소방사량(L/분)으로 옳은 것은? (단, 위험물의 취급을 주된 작업으로 한다.)","c":["2,940","3,540","4,650","4,890"],"a":2,"inc":false,"unit":"4-7"},{"id":"gwallisa-2023-05-20-96","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":96,"q":"이동탱크저장소 시설기준으로 옳지 않은 것은?","c":["옥내에 있는 상치장소는 지붕이 내화구조 또는 불연재료로 된 건축물의 1층에 설치하여야 한다.","이동저장탱크는 그 내부에 4,000L 이하마다 3.2mm 이상의 강철판으로 칸막이를 설치하여야 한다.","제4류 위험물 중 알코올류, 제1석유류 또는 제2석유류의 이동탱크저장소에는 접지도선을 설치하여야 한다.","이동저장탱크에 설치하는 안전장치는 상용압력이 20kPa를 초과하는 탱크에 있어서는 상용압력의 1.1배 이하의 압력에서 작동하도록 하여야 한다."],"a":3,"inc":false,"unit":"3-9"},{"id":"gwallisa-2023-05-20-97","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":97,"q":"알킬리튬을 취급하는 옥외탱크저장소 설치기준에 관한 설명으로 옳지 않은 것은?","c":["옥외저장탱크의 주위에는 누설범위를 국한하기 위한 설비를 설치하여야 한다.","옥외저장탱크에는 냉각장치 또는 수증기 봉입장치를 설치하여야 한다.","옥외저장탱크에는 헬륨, 네온 등 불활성 기체를 봉입하는 장치를 설치하여야 한다.","누설된 알킬리튬을 안전한 장소에 설치된 조에 이끌어 들일 수 있는 설비를 설치하여야 한다."],"a":2,"inc":false,"unit":"3-9"},{"id":"gwallisa-2023-05-20-98","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":98,"q":"경유 1,000 kL를 하나의 옥외저장탱크에 저장할 때, 지정수량의 배수와 보유공지의 너비로 옳은 것은?","c":["100배, 3m 이상","1,000배, 5m 이상","1,500배, 9m 이상","2,000배, 12m 이상"],"a":2,"inc":false,"unit":"3-9"},{"id":"gwallisa-2023-05-20-102","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":102,"q":"옥내소화전설비의 화재안전기술기준상 펌프를 이용하는 가압송수장치의 설치기준에 관한 내용으로 옳지 않은 것은?","c":["펌프는 전용으로 할 것(다만, 다른 소화설비와 겸용하는 경우 각각의 소화설비의 성능에 지장이 없을 때에는 그렇지 않음)","동결방지조치를 하거나 동결의 우려가 없는 장소에 설치할 것","펌프의 토출 측에는 압력계를 체크밸브 이후에 설치하고, 흡입 측에는 연성계 또는 진공계를 설치할 것","펌프축은 스테인리스 등 부식에 강한 재질을 사용할 것"],"a":3,"inc":false,"unit":"4-6"},{"id":"gwallisa-2023-05-20-103","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":103,"q":"옥내소화전설비의 화재안전기술기준상 배관 내 사용압력이 1.2MPa 이상일 경우에 사용할 수 있는 배관으로 옳은 것은?","c":["배관용 아크용접 탄소강 강관(KS D 3583)","배관용 스테인리스 강관(KS D 3576)","덕타일 주철관(KS D 4311)","일반배관용 스테인리스 강관(KS D 3595)"],"a":1,"inc":false,"unit":"4-6"},{"id":"gwallisa-2023-05-20-107","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":107,"q":"물분무소화설비의 화재안전기술기준상 물분무헤드의 설치제외 장소로 옳지 않은 것은?","c":["물에 심하게 반응하는 물질 또는 물과 반응하여 위험한 물질을 생성하는 물질을 저장 또는 취급하는 장소","고온의 물질 및 증류범위가 넓어 끓어 넘치는 위험이 있는 물질을 저장 또는 취급하는 장소","운전시에 표면의 온도가 260℃ 이상으로 되는 등 직접 분무를 하는 경우 그 부분에 손상을 입힐 우려가 있는 기계장치 등이 있는 장소","통신기기실·전자기기실·기타 이와 유사한 장소"],"a":4,"inc":false,"unit":"4-10"},{"id":"gwallisa-2023-05-20-108","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":108,"q":"포소화설비의 화재안전기술기준상 차고에 전역방출방식의 고발포용 고정포방출구를 설치하려고 한다. 팽창비가 500인 경우 관포체적 1m3에 대하여 1분당 최소 포수용액 방출량은?","c":["0.16L","0.18L","0.29L","0.31L"],"a":1,"inc":false,"unit":"5-2"},{"id":"gwallisa-2023-05-20-109","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":109,"q":"할로겐화합물 및 불활성기체소화설비의 화재안전기술기준상 음향경보장치의 설치기준으로 옳은 것은?","c":["수동식 기동장치 및 자동식 기동장치를 설치한 것은 화재감지기와 연동하여 자동으로 경보를 발하는 것으로 할 것","방호구역 또는 방호대상물이 있는 구획 외부에 있는 자에게 유효하게 경보할 수 있는 것으로 할 것","방호구역 또는 방호대상물이 있는 구획의 각 부분으로부터 하나의 확성기까지의 수평거리는 25m 이하가 되도록 할 것","제어반의 복구스위치를 조작할 경우 경보를 정지할 수 있는 것으로 할 것"],"a":3,"inc":false,"unit":"6-3"},{"id":"gwallisa-2023-05-20-110","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":110,"q":"이산화탄소소화설비의 화재안전성능기준에 관한 내용으로 옳은 것은?","c":["설계농도란 규정된 실험 조건의 화재를 소화하는데 필요한 소화약제의 농도(형식승인 대상의 소화약제는 형식승인된 소화농도)를 말한다.","방호구역에는 소화약제 방출 시 과압으로 인한 구조물 등의 손상을 방지하기 위하여 급기구를 설치해야 한다.","분사헤드는 사람이 상시 근무하거나 다수인이 출입·통행하는 곳과 자기연소성물질 또는 활성금속물질 등을 저장하는 장소에는 설치해서는 안 된다.","지하층, 무창층 및 밀폐된 거실 등에 방출된 소화약제를 배출하기 위한 자동폐쇄장치를 갖추어야 한다."],"a":3,"inc":false,"unit":"6-2"},{"id":"gwallisa-2023-05-20-117","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":117,"q":"유도등 및 유도표지의 화재안전기술기준상 설치기준에 관한 내용으로 옳은 것은?","c":["피난구유도등은 피난구의 바닥으로부터 높이 1.2m 이상으로서 출입구에 인접하도록 설치할 것","복도통로유도등은 구부러진 모퉁이를 기점으로 보행거리 25m마다 설치할 것","유도표지는 각 층마다 복도 및 통로의 각 부분으로부터 보행거리가 20m 이하가 되는 곳에 설치할 것","축광방식의 피난유도선은 바닥으로부터 높이 50cm 이하의 위치 또는 바닥 면에 설치할 것"],"a":4,"inc":false,"unit":"7-4"},{"id":"gwallisa-2023-05-20-118","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":118,"q":"비상경보설비 및 단독경보형감지기의 화재안전기술기준상 단독경보형감지기 설치기준에 관한 내용으로 옳지 않은 것은?","c":["각 실(이웃하는 실내의 바닥면적이 각각 30m2 미만이고 벽체의 상부의 전부 또는 일부가 개방되어 이웃하는 실내와 공기가 상호 유통되는 경우에는 이를 1개의 실로 본다)마다 설치하되 바닥면적이 150m2를 초과하는 경우에는 150m2 마다 1개 이상 설치할 것","계단실은 최상층의 계단실 천장(외기가 상통하는 계단실의 경우를 포함한다)에 설치할 것","건전지를 주전원으로 사용하는 단독경보형감지기는 정상적인 작동상태를 유지할 수 있도록 주기적으로 건전지를 교환할 것","상용전원을 주전원으로 사용하는 단독경보형감지기의 2차전지는 「소방시설 설치 및 관리에 관한 법률」 제40조에 따라 제품검사에 합격한 것을 사용할 것"],"a":2,"inc":false,"unit":"8-2"},{"id":"gwallisa-2023-05-20-119","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":119,"q":"연결송수관설비의 화재안전기술기준상 방수구는 특정소방대상물의 층마다 설치해야한다. 방수구 설치를 제외할 수 있는 것으로 옳지 않은 것은?","c":["아파트의 1층 및 2층","소방차의 접근이 가능하고 소방대원이 소방차로부터 각 부분에 쉽게 도달할 수 있는 피난층","송수구가 부설된 옥내소화전을 설치한 특정소방대상물(집회장·관람장·백화점·도매시장·소매시장·판매시설·공장·창고시설 또는 지하가를 제외한다)로서 지하층을 제외한 층수가 5층 이하이고 연면적이 6,000 m2 이하인 특정소방대상물의 지상층","송수구가 부설된 옥내소화전을 설치한 특정소방대상물(집회장·관람장·백화점·도매시장·소매시장·판매시설·공장·창고시설 또는 지하가를 제외한다)로서 지하층의 층수가 2 이하인 특정소방대상물의 지하층"],"a":3,"inc":false,"unit":"4-6"},{"id":"gwallisa-2023-05-20-121","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":121,"q":"소화수조 및 저수조의 화재안전기술기준상 설치기준에 관한 내용으로 옳지 않은 것은?","c":["소화수조 및 저수조의 채수구 또는 흡수관투입구는 소방차가 5m 이내의 지점까지 접근할 수 있는 위치에 설치해야 한다.","1층 및 2층의 바닥면적의 합계가 15,000m2 이상인 특정소방대상물은 7,500m2로 나누어 얻은 수(소수점이하의 수는 1로 본다)에 20m3를 곱한 양 이상이 되도록 해야 한다.","채수구의 수는 소요수량이 100m3 이상인 경우 3개 이상 설치해야 한다.","소화수조 또는 저수조가 지표면으로부터의 깊이(수조 내부바닥까지의 길이를 말한다)가 4.5m 이상인 지하에 있는 경우에는 가압송수장치를 설치해야 한다."],"a":1,"inc":false,"unit":"4-6"},{"id":"gwallisa-2023-05-20-122","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":122,"q":"화재안전기술기준에서 정하는 방화구획 등의 설치기준에 관한 내용으로 옳지 않은 것은?","c":["지하구 방화벽의 출입문은 「건축법 시행령」 제64조에 따른 방화문으로서 60분+ 방화문 또는 60분 방화문으로 설치할 것","소방시설용 비상전원수전설비를 고압으로 수전하는 경우 방화구획 하지 않을 수 있다.","전기저장장치 설치장소의 벽체, 바닥 및 천장은 「건축물의 피난·방화구조 등의 기준에 관한 규칙」에 따라 건축물의 다른 부분과 방화구획 해야 한다. 다만, 배터리실 외의 장소와 옥외형 전기저장장치 설비는 방화구획 하지 않을 수 있다.","제연설비 비상전원의 설치장소는 다른 장소와 방화구획할 것"],"a":2,"inc":false,"unit":"2-1"},{"id":"gwallisa-2023-05-20-124","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2023-05-20","num":124,"q":"무선통신보조설비의 화재안전기술기준상 설치기준으로 옳지 않은 것은?","c":["증폭기에는 비상전원이 부착된 것으로 하고 해당 비상전원 용량은 무선통신보조설비를 유효하게 20분 이상 작동시킬 수 있는 것으로 할 것","수신기가 설치된 장소 등 사람이 상시 근무하는 장소에는 옥외안테나의 위치가 모두 표시된 옥외안테나 위치표시도를 비치할 것","분배기·분파기 및 혼합기 등의 임피던스는 50Ω의 것으로 할 것","누설동축케이블 및 동축케이블의 임피던스는 50Ω으로 하고, 이에 접속하는 안테나·분배기 기타의 장치는 해당 임피던스에 적합한 것으로 할 것"],"a":1,"inc":false,"unit":"8-7"},{"id":"gwallisa-2024-05-11-1","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":1,"q":"고체 가연물의 연소방식이 아닌 것은?","c":["표면연소","예혼합연","분해연소","자기연소"],"a":2,"inc":false,"unit":"1-5"},{"id":"gwallisa-2024-05-11-2","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":2,"q":"면적이 0.12m2인 합판이 완전 연소 시 열방출량(kW)은? (단, 평균질량 감소율은 1,800g/m2·min, 연소열은 25kJ/g, 연소효율은 50%로 가정한다.)","c":["45","270","450","2,700"],"a":1,"inc":false,"unit":"1-8"},{"id":"gwallisa-2024-05-11-3","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":3,"q":"내화건축물의 구획실내에서 가연물의 연소 시, 최성기의 지배적 열전달로 옳은 것은?","c":["확산","전도","대류","복사"],"a":4,"inc":false,"unit":"1-5"},{"id":"gwallisa-2024-05-11-4","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":4,"q":"최소발화에너지(MIE)에 영향을 주는 요소에 관한 내용으로 옳은 것은? (단, 일반적인 경향성으로 예외는 적용하지 않는다.)","c":["온도가 낮을수록 MIE는 감소한다.","압력이 상승하면 MIE는 증가한다.","산소농도가 증가할수록 MIE는 감소한다.","MIE는 화학양론적 조성 부근에서 가장 크다."],"a":3,"inc":false,"unit":"1-2"},{"id":"gwallisa-2024-05-11-5","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":5,"q":"표준상태에서, 5몰(mol)의 프로페인가스(C3H8)가 완전연소를 하는데 발생하는 이산화탄소(CO2)의 부피(m3)는?","c":["0.336","0.560","336","560"],"a":1,"inc":false,"unit":"6-2"},{"id":"gwallisa-2024-05-11-11","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":11,"q":"건축물의 피난 · 방화구조 등의 기준에 관한 규칙상 내화구조로 옳지 않은 것은?","c":["벽의 경우에는 철골철근콘크리트조로서 두께가 10센티미터 이상인 것","기둥의 경우에는 철근콘크리트조로서 그 작은 지름이 15센티미터 이상인 것(다만, 고강도 콘크리트를 사용하는 경우가 아님)","바닥의 경우에는 철재의 양면을 두께 5센티미터 이상의 철망모르타르 또는 콘크리트로 덮은 것","지붕의 경우에는 철골철근콘크리트조"],"a":2,"inc":false,"unit":"2-3"},{"id":"gwallisa-2024-05-11-12","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":12,"q":"건축물의 피난 · 방화구조 등의 기준에 관한 규칙 및 건축법령상 소방관의 진입창의 기준으로 옳은 것은?","c":["3층 이상 11층 이하인 층에 각각 1개소 이상 설치할 것. 이 경우 소방관이 진입할 수 있는 창의 가운데에서 벽면 끝까지의 수평거리가 50미터 이상인 경우에는 50미터 이내마다 소방관이 진입할 수 있는 창을 추가로 설치해야 한다.","창문의 가운데에 지름 30센티미터 이상의 삼각형을 야간에도 알아볼 수 있도록 빛 반사 등으로 붉은색으로 표시할 것","창문의 한쪽 모서리에 타격지점을 지름 3센티미터 이상의 원형으로 표시할 것","창문의 크기는 폭 75센티미터 이상, 높이 1.1미터 이상으로 하고, 실내 바닥면으로부터 창의 아랫부분까지의 높이는 80센티미터 이내로 할 것"],"a":3,"inc":false,"unit":"2-3"},{"id":"gwallisa-2024-05-11-14","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":14,"q":"건축물의 피난 · 방화구조 등의 기준에 관한 규칙상 지하층의 비상탈출구의 기준으로 옳은 것은? (단, 주택의 경우에는 해당되지 않음)","c":["비상탈출구의 유효너비는 0.6미터 이상으로 하고, 유효높이는 1.2미터 이상으로 할 것","비상탈출구는 출입구로부터 2미터 이상 떨어진 곳에 설치할 것","지하층의 바닥으로부터 비상탈출구의 아랫부분까지의 높이가 1.1 미터 이상이 되는 경우에는 벽체에 발판의 너비가 26센티미터 이상인 사다리를 설치할 것","피난층 또는 지상으로 통하는 복도나 직통계단까지 이르는 피난통로의 유효너비는 0.75미터 이상으로 하고, 피난통로의 실내에 접하는 부분의 마감과 그 바탕은 불연재료로 할 것"],"a":4,"inc":false,"unit":"2-3"},{"id":"gwallisa-2024-05-11-15","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":15,"q":"건축물의 피난 · 방화구조 등의 기준에 관한 규칙상 피난안전구역의 구조 및 설비기준으로 옳지 않은 것은? (단, 초고층건축물과 준초고층건축물에 한함)","c":["피난안전구역의 내부마감재료는 불연재료로 설치할 것","건축물의 내부에서 피난안전구역으로 통하는 계단은 피난계단의 구조로 설치할 것","비상용 승강기는 피난안전구역에서 승하차 할 수 있는 구조로 설치할 것","피난안전구역의 높이는 2.1미터 이상일 것"],"a":2,"inc":false,"unit":"2-3"},{"id":"gwallisa-2024-05-11-18","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":18,"q":"제1인산암모늄의 열분해 생성물 중 부촉매 소화작용에 해당하는 것은?","c":["NH3","HPO3","H3PO4","NH4+"],"a":4,"inc":false,"unit":"6-1"},{"id":"gwallisa-2024-05-11-19","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":19,"q":"화재 시 발생하는 일산화탄소(CO)에 관한 설명으로 옳지 않은 것은?","c":["일산화탄소의 농도는 분해 생성물의 양에 반비례한다.","공기가 부족할 때 또는 환기량이 적을수록 증가한다.","셀룰로오스계 가연물 연소 시 또는 화재하중이 클수록 증가한다.","OH 라디칼은 일산화탄소의 산화에 결정적인 요소이다."],"a":1,"inc":false,"unit":"1-12"},{"id":"gwallisa-2024-05-11-20","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":20,"q":"가연성액화가스 저장탱크 주변 화재로 BLEVE 발생 시 FireBall 형성에 영향을 미치는 요인이 아닌 것은?","c":["높은 연소열","넓은 폭발범위","높은 증기밀도","연소 상한계에 가까운 조성"],"a":3,"inc":false,"unit":"1-21"},{"id":"gwallisa-2024-05-11-21","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":21,"q":"연소범위(폭발범위)에 관한 설명으로 옳지 않은 것은?","c":["불활성 가스를 첨가할수록 연소범위는 좁아진다.","온도가 높아질수록 폭발범위는 넓어진다.","혼합기를 이루는 공기의 산소농도가 높을수록 연소범위는 좁아진다.","가연물의 양과 유동상태 및 방출속도 등에 따라 영향을 받는다."],"a":3,"inc":false,"unit":"1-3"},{"id":"gwallisa-2024-05-11-22","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":22,"q":"연소 시 산소공급원의 역할에 관한 설명으로 옳은 것은?","c":["염소(Cl2)는 조연성 가스로서 산소공급원의 역할을 할 수 있다.","일산화탄소(CO)는 불연성 가스로서 산소공급원의 역할을 할 수 없다.","이산화질소(NO2)는 가연성 가스로서 산소공급원의 역할을 할 수 있다.","수소(H2)는 인화성 가스로서 산소공급원의 역할을 할 수 있다."],"a":1,"inc":false,"unit":"1-5"},{"id":"gwallisa-2024-05-11-23","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":23,"q":"분말소화약제인 탄산수소나트륨 84g이 1기압(atm), 270℃에서 분해되었다. 이 때, 분해 생성된 이산화탄소의 부피(L)는 약 얼마인가?","c":["11.1","22.3","28.6","44.6"],"a":2,"inc":false,"unit":"6-1"},{"id":"gwallisa-2024-05-11-28","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":28,"q":"Darcy-Weisbach 공식에서 마찰손실수두에 관한 설명으로 옳은 것은?","c":["관의 직경에 반비례한다.","관의 길이에 반비례한다.","마찰손실계수에 반비례한다.","유속의 제곱에 반비례한다"],"a":1,"inc":false,"unit":"14-2"},{"id":"gwallisa-2024-05-11-31","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":31,"q":"관수로 흐름의 손실 중 미소손실이 아닌 것은?","c":["관 마찰손실","급확대손실","점차확대손실","밸브에 의한 손실"],"a":1,"inc":false,"unit":"4-3"},{"id":"gwallisa-2024-05-11-33","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":33,"q":"직경 0.5m의 수평관에 1m3/s의 유량과 2.2kgf/cm2의 압력으로 송수하기 위한 펌프의 소요동력(kW)은 약 얼마인가? (단, 펌프 효율은 85%이며, 관내 마찰손실은 무시한다.)","c":["15.2","253.6","268.9","283.6"],"a":3,"inc":false,"unit":"4-3"},{"id":"gwallisa-2024-05-11-38","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":38,"q":"소화약제로 사용된 4℃의 물이 모두 200℃ 과열수증기로 변화하였다면, 물은 약 몇 배 팽창하였는가? (단, 화재실은 대기압상태로 화재발생 전·후 압력의 변화는 없으며, 과열수증기는 이상기체로 가정한다. 4℃에서의 물의 밀도 = 1g/cm3, H 및 O의 원자량은 각각 1과 16 이다.)","c":["1,700","1,928","2,156","2,383"],"a":3,"inc":false,"unit":"14-2"},{"id":"gwallisa-2024-05-11-41","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":41,"q":"충전비가 1.6인 고압식 이산화탄소소화설비에 필요한 약제량이 230kg일 때, 68L 표준용기는 몇 개가 필요한가?","c":["4","5","6","7"],"a":3,"inc":false,"unit":"6-2"},{"id":"gwallisa-2024-05-11-42","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":42,"q":"할로겐화합물소화약제 중 오존파괴지수(ODP)가 0인 소화약제가 아닌 것은?","c":["HCFC-124","HFC-23","FC-3-1-10","FK-5-1-12"],"a":1,"inc":false,"unit":"6-3"},{"id":"gwallisa-2024-05-11-46","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":46,"q":"자기장 내에 존재하는 도체에 전류를 흘릴 때 도체가 받는 전자력의 방향을 결정하는 법칙은?","c":["렌츠의 법칙","플레밍의 왼손 법칙","플레밍의 오른손 법칙","암페어의 오른나사 법칙"],"a":2,"inc":false,"unit":"9-1"},{"id":"gwallisa-2024-05-11-54","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":54,"q":"소방시설공사업법령상 소방시설공사 분리 도급의 예외로 명시되지 않은 것은? (단, 다른 조건은 고려하지 않음)","c":["연소방지설비의 살수구역을 증설하는 공사인 경우","연면적이 1천제곱미터 이하인 특정소방대상물에 비상경보설비를 설치하는 공사인 경우","국방 및 국가안보 등과 관련하여 기밀을 유지해야 하는 공사인 경우","｢재난 및 안전관리 기본법｣에 따른 재난의 발생으로 긴급하게 착공해야 하는 공사인 경우"],"a":1,"inc":false,"unit":"3-10"},{"id":"gwallisa-2024-05-11-61","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":61,"q":"소방시설 설치 및 관리에 관한 법령상 성능위주설계를 해야 하는 특정소방대상물(신축하는 것만 해당)로 옳지 않은 것은?","c":["연면적 3만제곱미터 이상인 철도 및 도시철도 시설","길이가 5천미터 이상인 터널","30층 이상(지하층을 포함)이거나 지상으로부터 높이가 120미터 이상인 아파트등","연면적 10만제곱미터 이상인 창고시설"],"a":3,"inc":false,"unit":"2-3"},{"id":"gwallisa-2024-05-11-66","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":66,"q":"화재의 예방 및 안전관리에 관한 법령상 특수가연물에 관한 설명으로 옳지 않은 것은?","c":["10,000킬로그램 이상의 석탄 · 목탄류는 특수가연물에 해당한다.","특수가연물인 가연성 고체류 또는 가연성 액체류를 저장하는 장소에는 특수가연물 표지에 품명과 인화점을 표시하여야 한다.","살수설비를 설치한 경우 특수가연물(발전용 석탄·목탄류 제외)은 15미터 이하의 높이로 쌓아야 한다.","특수가연물(발전용 석탄·목탄류 제외)을 실외에 쌓는 경우, 쌓는 부분 바닥 면적의 사이는 3미터 또는 쌓는 높이 중 큰 값 이상으로 간격을 두어야 한다."],"a":2,"inc":false,"unit":"3-2"},{"id":"gwallisa-2024-05-11-67","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":67,"q":"위험물안전관리법령상 탱크안전성능시험자가 30일 이내에 시 · 도지사에게 변경 신고를 해야 하는 경우가 아닌 것은?","c":["영업소 소재지의 변경","보유장비의 변경","대표자의 변경","상호 또는 명칭의 변경"],"a":2,"inc":false,"unit":"6-5"},{"id":"gwallisa-2024-05-11-68","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":68,"q":"위험물안전관리법령상 옥외저장소에 관한 설명으로 옳지 않은 것은?","c":["옥외저장소를 설치하는 경우, 그 설치장소를 관할하는 시 · 도지사의 허가를 받아야 한다.","옥외저장소에는 제2류 위험물 및 제5류 위험물을 저장할 수 있다.","옥외저장소에 선반을 설치하는 경우 선반의 높이는 6m를 초과하지 않아야 한다.","알코올류를 저장하는 옥외저장소에는 살수설비 등을 설치하여야 한다."],"a":2,"inc":false,"unit":"3-9"},{"id":"gwallisa-2024-05-11-78","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":78,"q":"제2류 위험물 중 황에 관한 설명으로 옳지 않은 것은?","c":["물에 불용이고, 알코올에 난용이다.","공기 중에서 연소하기 쉽다.","미세한 분말상태로 공기 중에 부유하면 분진폭발을 일으킨다.","전기의 도체로 마찰에 의해 정전기가 발생할 우려가 있다."],"a":4,"inc":false,"unit":"1-22"},{"id":"gwallisa-2024-05-11-79","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":79,"q":"제2류 위험물 중 주석분에 관한 설명으로 옳은 것은?","c":["뜨겁고 진한 염산과 반응하여 수소가 발생된다.","염기와 서서히 반응하여 산소가 발생된다.","미세한 조각이 대량으로 쌓여 있더라도 자연발화 위험이 없다.","공기나 물속에서 녹이 슬기 쉽다."],"a":1,"inc":false,"unit":"1-1"},{"id":"gwallisa-2024-05-11-81","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":81,"q":"제3류 위험물 중 알킬알루미늄에 관한 설명으로 옳은 것은?","c":["물, 산과 반응하지 않는다,","탄소 수가 C1~C4까지 공기 중에 노줄되면 자연발화한다.","저장탱크에 희석안정제로 핵산, 벤젠, 톨루엔, 알코올 등을 넣어둔다,","무색의 투명한 액체 또는 고체로 독성이 없다."],"a":2,"inc":false,"unit":"1-1"},{"id":"gwallisa-2024-05-11-85","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":85,"q":"제5류 위험물 중 유기과산화물에 포함되는 물질은?","c":["벤조일퍼옥사이드 - (C6H5CO)2O2","질산에틸 - C2H5ONO2","나이트로글라이콜 – C2H4(ONO2)2","트라이나이트로페놀 – C6H2(NO2)3OH"],"a":1,"inc":false,"unit":"3-2"},{"id":"gwallisa-2024-05-11-89","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":89,"q":"위험물안전관리법령상 제조소의 위치 · 구조 및 설비의 기준 중 위험물을 취급하는 건축물에 설치하는 환기설비의 기준으로 옳은 것은?","c":["환기는 강제배기방식으로 할 것","환기구는 지붕위 또는 지상 1.8m 이상의 높이에 설치할 것","급기구는 높은 곳에 설치하고 가는 눈의 구리망 등으로 인화방지망을 설치할 것","급기구가 설치된 실의 바닥면적이 115m2인 경우 급기구의 면적은 450cm2 이상으로 할 것"],"a":4,"inc":false,"unit":"7-8"},{"id":"gwallisa-2024-05-11-95","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":95,"q":"위험물안전관리법령상 1인의 안전관리자를 중복하여 선임할 수 있는 경우, 행정안전부령이 정하는 저장소의 기준으로 옳은 것은? (단, 동일구내에 있거나 상호 100m 이내의 거리에 있는 저장소로서 저장소의 규모, 저장하는 위험물의 종류 등을 고려하여 동일인이 설치한 경우이다.)","c":["10개 이하의 암반탱크저장소","35개 이하의 옥외탱크저장소","30개 이하의 옥내저장소","30개 이하의 옥외저장소"],"a":1,"inc":false,"unit":"3-9"},{"id":"gwallisa-2024-05-11-97","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":97,"q":"위험물안전관리법령상 옥내저장소에 벤젠 20L 용기 200개와 포름산 200L 용기 20개를 저장하고 있다면, 이 저장소에는 지정수량 몇 배를 저장하고 있는가? (단, 용기에 가득 차 있다고 가정한다.)","c":["12","21","22","26"],"a":3,"inc":false,"unit":"3-9"},{"id":"gwallisa-2024-05-11-98","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":98,"q":"위험물안전관리법령상 판매취급소의 위치 · 구조 및 설비의 기준으로 옳지 않은 것은?","c":["제1종 판매취급소는 건축물의 1층에 설치할 것","제1종 판매취급소의 위험물을 배합하는 실의 바닥면적은 5m2 이상 15m2 이하로 할 것","제2종 판매취급소의 용도로 사용하는 부분은 벽 · 기둥 · 바닥 및 보를 내화구조로 할 것","제2종 판매취급소의 용도로 사용하는 부분에 상층이 있는 경우에 있어서는 상층의 바닥을 내화구조로 하는 동시에 상층으로의 연소를 방지하기 위한 조치를 강구할 것"],"a":2,"inc":false,"unit":"1-24"},{"id":"gwallisa-2024-05-11-103","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":103,"q":"옥내소화전설비의 화재안전기술기준상 옥상수조를 설치하지 않아도 되는 기준으로 옳은 것은?","c":["압력수조를 가압송수장치로 설치한 경우","수원이 건축물의 최하층에 설치된 방수구보다 높은 위치에 설치된 경우","건축물의 높이가 지표면으로부터 10m를 초과하는 경우","고가수조를 가압송수장치로 설치한 경우"],"a":4,"inc":false,"unit":"4-6"},{"id":"gwallisa-2024-05-11-104","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":104,"q":"내화구조이고 물품보관용 랙이 설치되지 않은 가로 50m, 세로 30m인 창고에 라지드롭형 스프링클러헤드를 정방형으로 배치하는 경우 필요한 헤드의 최소 설치개수는? (단, 특수가연물을 저장 또는 취급하지 않음)","c":["84개","160개","187개","273개"],"a":2,"inc":false,"unit":"3-2"},{"id":"gwallisa-2024-05-11-105","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":105,"q":"물분무소화설비의 화재안전기술기준상 고압의 전기기기가 있는 장소는 전기의 절연을 위하여 전기기기와 물분무헤드 사이에 거리를 두어야 한다. 전기기기의 전압(kV)에 따라 이격한 거리(cm)로 옳은 것은?","c":["66 kV - 60 cm","120 kV - 130 cm","150 kV - 160 cm","200 kV - 190 cm"],"a":3,"inc":false,"unit":"4-10"},{"id":"gwallisa-2024-05-11-106","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":106,"q":"포소화설비의 화재안전기술기준상 용어의 정의로 옳지 않은 것은?","c":["\"비확관형 분기배관\"이란 배관의 측면에 분기호칭내경 이상의 구멍을 뚫고 배관이음쇠를 용접 이음한 배관을 말한다.","\"포소화전설비\"란 포소화전방수구 · 호스 및 이동식포노즐을 사용하는 설비를 말한다.","\"주펌프\"란 구동장치의 회전 또는 왕복운동으로 소화용수를 가압하여 그 압력으로 급수하는 주된 펌프를 말한다.","\"프레셔 프로포셔너방식\"이란 펌프의 토출관에 압입기를 설치하여 포 소화약제 압입용 펌프로 포 소화약제를 압입시켜 혼합하는 방식을 말한다."],"a":4,"inc":false,"unit":"5-1"},{"id":"gwallisa-2024-05-11-107","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":107,"q":"포소화설비의 화재안전성능기준상 특수가연물을 저장 · 취급하는 특정소방대상물 중 바닥면적이 200m2인 부분에 포헤드방식으로 포소화설비를 설치하는 경우 1분당 최소 방사량(L)은? (단, 포소화약제의 종류는 합성계면활성제포로 함)","c":["740","1,300","1,600","1,700"],"a":2,"inc":false,"unit":"3-2"},{"id":"gwallisa-2024-05-11-112","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":112,"q":"비상조명등의 화재안전기술기준상 휴대용비상조명등의 설치기준으로 옳지 않은 것은?","c":["사용시 자동으로 점등되는 구조일 것","건전지 및 충전식 배터리의 용량은 20분 이상 유효하게 사용할 수 있는 것으로 할 것","외함은 난연성능이 있을 것","지하상가 및 지하역사에는 수평거리 50m 이내마다 3개 이상 설치"],"a":4,"inc":false,"unit":"8-7"},{"id":"gwallisa-2024-05-11-113","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":113,"q":"자동화재탐지설비 및 시각경보장치의 화재안전기술기준에 관한 설명으로 옳지 않은 것은?","c":["광전식분리형감지기의 광축(송광면과 수광면의 중심을 연결한 선)은 나란한 벽으로부터 0.5m 이상 이격하여 설치할 것","청각장애인용 시각경보장치의 설치 높이는 천장의 높이가 2m 이하인 경우에는 천장으로부터 0.15m 이내의 장소에 설치해야 한다.","수신기는 화재로 인하여 하나의 층의 지구음향장치 또는 배선이 단락되어도 다른 층의 화재통보에 지장이 없도록 각 층 배선 상에 유효한 조치를 할 것","외기에 면하여 상시 개방된 부분이 있는 차고·주차장·창고 등에 있어서는 외기에 면하는 각 부분으로부터 5m 미만의 범위 안에 있는 부분은 경계구역의 면적에 산입하지 않는다."],"a":1,"inc":false,"unit":"8-7"},{"id":"gwallisa-2024-05-11-115","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":115,"q":"자동화재탐지설비 및 시각경보장치의 화재안전기술기준상 배선의 기준으로 옳은 것은?","c":["P형 수신기 및 G.P형 수신기의 감지기 회로의 배선에 있어서 하나의 공통선에 접속할 수 있는 경계구역은 6개 이하로 할 것","감지기회로 및 부속회로의 전로와 대지 사이 및 배선 상호간의 절연저항은 1경계구역마다 직류 250V의 절연저항측정기를 사용하여 측정한 절연저항이 0.1MΩ 이상이 되도록 할 것","감지기회로의 전로저항은 30Ω 이하가 되도록 할 것","감지기회로의 도통시험을 위한 종단저항의 전용함을 설치하는 경우 그 설치 높이는 바닥으로부터 2.0m 이내로 할 것"],"a":2,"inc":false,"unit":"8-7"},{"id":"gwallisa-2024-05-11-116","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":116,"q":"건설현장의 화재안전기술기준에 관한 설명으로 옳지 않은 것은?","c":["용접·용단 작업 시 11m 이내에 가연물이 있는 경우 해당 가연물을 방화포로 보호할 것","비상경보장치는 피난층 또는 지상으로 통하는 각 층 직통계단의 출입구마다 설치할 것","비상조명등이 설치된 장소의 조도는 각 부분의 바닥에서 1 lx 이상이 되도록 할 것","가스누설경보기는 지하층에 가연성가스를 발생시키는 작업을 하는 부분으로부터 수평거리 15m 이내에 바닥으로부터 탐지부 상단까지의 거리가 0.3m 이하인 위치에 설치할 것"],"a":4,"inc":false,"unit":"8-7"},{"id":"gwallisa-2024-05-11-117","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":117,"q":"이산화탄소소화설비의 화재안전성능기준 및 화재안전기술기준에 관한 설명으로 옳은 것은?","c":["\"전역방출방식\"이란 소화약제 공급장치에 배관 및 분사헤드 등을 고정 설치하여 직접 화점에 소화약제를 방출하는 방식을 말한다.","\"설계농도\"란 규정된 실험 조건의 화재를 소화하는데 필요한 소화약제의 농도를 말한다.","저장용기의 충전비는 고압식은 1.1 이상 1.4 이하로 한다.","소화약제 저장용기는 온도가 40℃ 이하이고, 온도변화가 작은 곳에 설치하여야 한다."],"a":4,"inc":false,"unit":"6-2"},{"id":"gwallisa-2024-05-11-124","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2024-05-11","num":124,"q":"비상콘센트설비의 화재안전성능기준상 전원 및 콘센트에 관한 기준이 아닌 것은?","c":["절연저항은 전원부와 외함 사이를 500볼트 절연저항계로 측정할 때 20메가옴 이상일 것","비상전원의 설치장소는 다른 장소와 방화구획 할 것","비상전원은 비상콘센트설비를 유효하게 30분 이상 작동시킬 수 있는 용량으로 할 것","비상콘센트용의 풀박스 등은 방청도장을 한 것으로서, 두께 1.6밀리미터 이상의 철판으로 할 것"],"a":3,"inc":false,"unit":"9-9"},{"id":"gwallisa-2025-05-03-4","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":4,"q":"소화설비의 종류 중 물분무등소화설비에 해당하지 않는 것은?","c":["포소화설비","할로겐화합물 및 불활성기체소화설비","스프링클러설비","미분무소화설비"],"a":3,"inc":false,"unit":"4-10"},{"id":"gwallisa-2025-05-03-6","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":6,"q":"화재가 진행됨에 따라 실내 천장 부근에 있던 열분해 가연성 기체들이 착화되어, 천장에 화염덩어리가 굴러다니는 현상은?","c":["플래시오버(flash over)","보일오버(boil over)","롤오버(roll over)","슬롭오버(slop over)"],"a":3,"inc":false,"unit":"3-1"},{"id":"gwallisa-2025-05-03-8","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":8,"q":"가연성 물질의 화재 위험성에 관한 설명으로 옳지 않은 것은?","c":["연소범위가 넓을수록 위험하다.","연소열이 클수록 위험하다.","인화점이 높을수록 위험하다.","증발열, 비열이 작을수록 위험하다."],"a":3,"inc":false,"unit":"2-3"},{"id":"gwallisa-2025-05-03-10","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":10,"q":"목조건축물의 화재 특성에 관한 설명으로 옳은 것은?","c":["저온장기형의 특성을 갖는다.","목조건축물의 화재는 무염착화, 발염착화의 순으로 진행한다.","종방향보다 횡방향의 화재성장이 빠르다.","습도가 높을수록 연소확대가 빠르다."],"a":2,"inc":false,"unit":"1-11"},{"id":"gwallisa-2025-05-03-12","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":12,"q":"분진폭발에 관한 설명으로 옳지 않은 것은? (단, 금속분은 제외한다.)","c":["가연성 분진의 수분이 적을수록 발생 가능성이 높다.","환원반응으로 생성하는 가연성 기체의 반응이 크다.","난류는 화염의 전파속도를 증가시켜 폭발 위력이 커진다.","분체 중에 휘발성이 크고, 발화온도가 낮을수록 폭발이 잘 발생한다."],"a":2,"inc":false,"unit":"1-22"},{"id":"gwallisa-2025-05-03-15","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":15,"q":"건축물의 피난·방화구조 등의 기준에 관한 규칙상 교육연구시설 중 학교에 설치 하는 회전문의 설치기준으로 옳은 것은?","c":["계단이나 에스컬레이터로부터 2미터 미만의 거리를 둘 것","회전문과 문틀 사이는 5센티미터 미만으로 할 것","회전문의 중심축에서 회전문과 문틀 사이의 간격을 포함한 회전문날개 끝부분까지의 길이는 140센티미터 이상이 되도록 할 것","회전문의 회전속도는 분당회전수가 10회 이상으로 할 것"],"a":3,"inc":false,"unit":"2-3"},{"id":"gwallisa-2025-05-03-16","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":16,"q":"건축물의 피난·방화구조 등의 기준에 관한 규칙상 피난안전구역의 설치기준으로 옳은 것은?","c":["피난안전구역의 높이는 1.8미터 이상일 것","피난안전구역으로 통하는 계단은 일반계단의 구조로 할 것","피난안전구역에는 식수공급을 위한 급수전을 1개소 이상 설치하고 예비전원에 의한 조명설비를 설치할 것","비상용 승강기는 피난안전구역에 승하차 할 수 없는 구조로 설치할 것"],"a":3,"inc":false,"unit":"2-3"},{"id":"gwallisa-2025-05-03-17","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":17,"q":"화재 발생 시 건축물 내의 중성대에 관한 설명으로 옳지 않은 것은?","c":["건축물 실내 상부 압력은 높아지고 하부 압력은 낮아져 압력차가 발생하는데 실내의 중간지점에 실내와 실외의 압력이 같아지는 면을 중성대라고 한다.","공기의 밀도가 감소되면 부력이 생겨 공기가 하강하게 되고 무거워진 실내의 기체는 압력이 높은 실외로 빠져 나간다.","중성대 위쪽은 실외의 압력보다 높아서 기체가 외부로 유출된다.","중성대 아래쪽은 실외의 압력보다 낮아서 외부의 공기가 들어오게 된다."],"a":2,"inc":false,"unit":"1-15"},{"id":"gwallisa-2025-05-03-18","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":18,"q":"가연물의 연소 시 필요한 공기량·산소량에 관한 설명으로 옳지 않은 것은?","c":["이론공기량은 가연물이 완전연소하기 위해서 이론으로 계산해서 산출한 공기량이다.","실제공기량은 가연물이 실제로 연소하기 위해서 사용되는 공기 량으로 이론공기량보다 크다.","과잉공기량은 실제공기량을 이론공기량으로 나누어 산출한 값이다.","이론산소량은 가연물이 연소하기 위해서 필요한 최소의 산소량이다."],"a":3,"inc":false,"unit":"1-5"},{"id":"gwallisa-2025-05-03-19","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":19,"q":"연기농도를 측정하는 중량농도법의 단위로 옳은 것은?","c":["mg/m3","m-1","개/m3","%/m2"],"a":1,"inc":false,"unit":"1-14"},{"id":"gwallisa-2025-05-03-24","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":24,"q":"화재성장속도 분류에서 약 1MW의 열량에 도달하는 시간이 75초에 해당하는 것은?","c":["Slow 화재","Medium 화재","Fast 화재","Ultra Fast 화재"],"a":4,"inc":false,"unit":"1-11"},{"id":"gwallisa-2025-05-03-30","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":30,"q":"원형관로에 설치한 피토관에 수은이 든 U자형 관을 연결하여 전압과 정압을 측정하였다. 액면차가 500mm가 발생하였다면 피토관 위치에서 관로 내 물의 유속(m/s)은 약 얼마인가? (단, 수은의 밀도는 13,600 kg/m3, 중력가속도는 9.81 m/s2, 물의 단위중량은 9.81 kN/m3 이며 모든 손실은 무시한다.)","c":["1.112","3.132","11.118","31.321"],"a":3,"inc":false,"unit":"4-1"},{"id":"gwallisa-2025-05-03-35","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":35,"q":"금속화재(D급)에 관한 설명으로 옳지 않은 것은?","c":["D급 소화약제는 염화나트륨, 흑연, 구리 등을 주성분으로 하는 분말 또는 과립형태의 혼합물이다.","K급 소화약제는 가연성 금속화재에 적응성이 좋다.","리튬 및 나트륨에 수계소화약제를 사용하면 폭발성이 강한 수소를 발생시킨다.","염화나트륨 주제에 고분자물질의 혼합물 소화약제인 Met-L-X는 나트륨 및 칼륨 화재에 적응성이 있다."],"a":2,"inc":false,"unit":"1-17"},{"id":"gwallisa-2025-05-03-38","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":38,"q":"1기압 0℃에서 44.8m3의 이산화탄소가스가 모두 액화되었을 때 질량(kg)은 약 얼마인가? (단, 이산화탄소의 분자량은 44이다.)","c":["12","22","44","88"],"a":4,"inc":false,"unit":"6-2"},{"id":"gwallisa-2025-05-03-39","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":39,"q":"FK-5-1-12의 특성에 관한 설명으로 옳지 않은 것은?","c":["플루오르화수소(HF)의 발생량은 화염의 크기, 소화농도, 화재진압시간에 비례한다.","소화약제는 1분 이내에 95% 이상 해당하는 약제량이 방출되도록 하여야한다.","오존층 파괴 등 환경오염에 미치는 영향이 적다.","플루오르, 탄소, 산소로 구성되어 있으며, 물보다 빨리 기화되어 연쇄반응 차단 및 냉각 소화를 한다."],"a":2,"inc":false,"unit":"6-4"},{"id":"gwallisa-2025-05-03-41","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":41,"q":"이산화탄소(CO2) 소화약제에 관한 설명으로 옳지 않은 것은?","c":["불연성 가스로서 무색·무취이며, 공기에 대한 비중은 약 1.5 이다.","약제 방출시 인체에 관한 동상·질식의 우려가 있다.","금속분화재에 사용 시 질식·냉각소화의 효과가 있다.","전기 절연성이 우수하여 전기화재에 적응성이 있다."],"a":3,"inc":false,"unit":"6-2"},{"id":"gwallisa-2025-05-03-42","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":42,"q":"축압식 분말소화기의 충압가스 종류가 아닌 것은?","c":["질소","헬륨","일산화탄소","이산화탄소"],"a":3,"inc":false,"unit":"4-5"},{"id":"gwallisa-2025-05-03-46","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":46,"q":"부하의 피상전력이 10kVA이고, 무효전력이 6kVar일 때 유효전력(W)은?","c":["4","6","8","10"],"a":3,"inc":false,"unit":"9-2"},{"id":"gwallisa-2025-05-03-51","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":51,"q":"소방기본법령상 소방대의 생활안전활동에 해당하지 않는 것은?","c":["붕괴, 낙하 등이 우려되는 고드름, 나무, 위험 구조물 등의 제거활동","산불에 대한 예방·진압 등 지원활동","위해동물, 벌 등의 포획 및 퇴치 활동","단전사고 시 비상전원 또는 조명의 공급"],"a":2,"inc":false,"unit":"9-6"},{"id":"gwallisa-2025-05-03-55","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":55,"q":"화재의 예방 및 안전관리에 관한 법령상 특수가연물 중 가연성 고체류에 해당하지 않는 것은? (단, 고체만 해당됨)","c":["인화점이 섭씨 40도 미만인 것","인화점이 섭씨 40도 이상 100도 미만인 것","인화점이 섭씨 100도 이상 200도 미만이고, 연소열량이 1그램당 8킬로칼로리 이상인 것","인화점이 섭씨 200도 이상이고 연소열량이 1그램당 8킬로칼로리 이상인 것으로서 녹는점(융점)이 100도 미만인 것"],"a":1,"inc":false,"unit":"3-2"},{"id":"gwallisa-2025-05-03-65","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":65,"q":"소방시설 설치 및 관리에 관한 법령상 건축허가등을 할 때 미리 소방본부장 또는 소방서장의 동의를 받아야 하는 건축물 등의 범위에 해당하는 것은? (단, 다른 조건은 고려하지 않음)","c":["연면적이 200제곱미터 이상인 의료재활시설","가스시설로서 지하저장탱크의 저장용량의 합계가 50톤 이상인 것","차고·주차장으로 사용되는 바닥면적이 200제곱미터 이상인 층이 있는 건축물이나 주차시설","지하층 또는 무창층이 있는 건축물로서 연면적이 100제곱미터(공연장의 경우에는 50제곱미터) 이상인 층이 있는 것"],"a":3,"inc":false,"unit":"7-2"},{"id":"gwallisa-2025-05-03-67","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":67,"q":"소방시설 설치 및 관리에 관한 법령상 소방시설 중 소화활동설비에 해당하는 것은?","c":["방열복","비상벨설비","통합감시시설","연결송수관설비"],"a":4,"inc":false,"unit":"8-7"},{"id":"gwallisa-2025-05-03-68","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":68,"q":"위험물안전관리법령상 옥내저장소 설치허가 수수료의 연결로 옳은 것은?","c":["지정수량의 10배 이하인 것 - 1만원","지정수량의 50배 초과 100배 이하인 것 - 4만원","지정수량의 100배 초과 200배 이하인 것 - 6만원","지정수량의 200배 초과하는 것 - 9만원"],"a":2,"inc":false,"unit":"3-9"},{"id":"gwallisa-2025-05-03-80","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":80,"q":"칼륨과 나트륨에 관한 비교설명으로 옳지 않은 것은?","c":["비중은 나트륨이 크다.","융점은 칼륨이 낮다.","비점은 칼륨이 낮다.","모두 이온화 경향이 작은 가연성 금속이다."],"a":4,"inc":false,"unit":"3-1"},{"id":"gwallisa-2025-05-03-86","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":86,"q":"제4류 위험물에 관한 설명으로 옳지 않은 것은?","c":["n-부틸알코올(narmal butyl alcohol)은 제2석유류에 속하는 인화성액체이다.","아크롤레인(acrolein)은 제1석유류에 속하며 증기비중이 1보다 크고 독성이 강하다.","글리세린(glycerine)은 나이트로글리세린의 원료이며 KMnO4와 혼촉발화한다.","콜로디온(collodion)은 제조 시 사용한 용제가 모두 증발하면 제3류 위험물과 같은 위험성이 나타난다."],"a":4,"inc":false,"unit":"1-1"},{"id":"gwallisa-2025-05-03-92","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":92,"q":"위험물안전관리법령상 위험물을 취급하는 건축물에 설치하는 채광·조명 및 환기설비에 관한 설명으로 옳지 않은 것은?","c":["환기설비의 급기구는 낮은 곳에 설치한다.","채광설비는 채광면적이 최대가 되도록 한다.","바닥면적이 100m2인 경우 환기설비의 급기구의 면적은 450cm2로 할 수 있다.","스위치의 스파크로 인해 화재·폭발의 우려가 있는 경우에는 조명설비의 점멸스위치를 출입구 바깥부분에 설치한다."],"a":2,"inc":false,"unit":"7-8"},{"id":"gwallisa-2025-05-03-94","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":94,"q":"위험물안전관리법령상 이동탱크저장소에 저장할 수 있는 제4류 위험물 중 접지도선을 설치해야 하는 위험물은?","c":["특수인화물","동식물유류","알코올류","제3석유류"],"a":1,"inc":false,"unit":"3-9"},{"id":"gwallisa-2025-05-03-95","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":95,"q":"위험물안전관리 법령상 휘발유를 옥외탱크저장소에 저장할 경우 옥외탱크저장소의 위치·구조 및 설비의 기준에서 방유제의 설치에 관한 설명으로 옳지 않은 것은?","c":["방유제의 높이는 0.5m 이상 3m 이하로 한다.","방유제내의 면적은 8만m2 이하로 한다.","방유제에는 그 내부에 고인 물을 외부로 배출하기 위한 배수구를 설치하고 이를 개폐하는 밸브 등을 방유제의 내부에 설치한다.","높이가 1m를 넘는 방유제 및 간막이 둑의 안팎에는 방유제내에 출입하기 위한 계단 또는 경사로를 약 50m마다 설치한다."],"a":3,"inc":false,"unit":"3-9"},{"id":"gwallisa-2025-05-03-97","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":97,"q":"위험물안전관리법령상 소화설비의 설치기준에서 외벽이 내화구조가 아닌 연면적 450m2인 저장소의 소요단위는?","c":["3","5","6","9"],"a":3,"inc":false,"unit":"2-3"},{"id":"gwallisa-2025-05-03-98","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":98,"q":"위험물안전관리법령상 위험물의 저장 및 취급 기준에 관한 설명으로 옳지 않은 것은?","c":["수상구조물에 설치하는 고정주유설비를 이용하여 주유작업을 할 때에는 6m 이내에 다른 선박의 정박 또는 계류를 금지한다.","철도 또는 궤도에 의하여 운행하는 차량에 주유하는 때에는 콘크리트 등으로 포장된 부분에서 주유한다.","이동저장탱크에 알킬알루미늄등을 저장하는 경우에는 20kPa 이하의 압력으로 불활성의 기체를 봉입하여 둔다.","옥내저장소에서는 용기에 수납하여 저장하는 위험물의 온도가 55℃를 넘지 아니하도록 필요한 조치를 강구하여야 한다."],"a":1,"inc":false,"unit":"3-9"},{"id":"gwallisa-2025-05-03-101","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":101,"q":"소화기구 및 자동소화장치의 화재안전기술기준상 간이소화용구의 능력단위로 옳은 것은?","c":["마른 모래로 삽을 상비한 80L 이상의 것으로 1포의 능력단위는 1 단위이다.","마른 모래로 삽을 상비한 50L 이상의 것으로 1포의 능력 단위는 0.5단위이다.","팽창질석 또는 팽창진주암으로 삽을 상비한 80L 이상의 것으로 1포의 능력단위는 1 단위이다.","팽창질석 또는 팽창진주암으로 삽을 상비한 50L 이상의 것으로 1포의 능력단위는 0.5 단위이다."],"a":2,"inc":false,"unit":"4-5"},{"id":"gwallisa-2025-05-03-102","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":102,"q":"포소화설비의 화재안전성능기준상 펌프와 발포기의 중간에 설치된 벤추리관의 벤추리작용과 펌프 가압수의 포 소화약제 저장탱크에 대한 압력에 따라 포 소화약제를 흡입·혼합하는 방식은?","c":["프레셔 프로포셔너방식","펌프 프로포셔너방식","라인 프로포셔너방식","프레셔사이드 프로포셔너방식"],"a":1,"inc":false,"unit":"5-1"},{"id":"gwallisa-2025-05-03-105","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":105,"q":"화재안전기술기준상 48 층인 건축물에서, 옥내 소화전의 설치 개수는 층당 6 개일 때 옥내소화전설비의 수원의 최소 저수량(m3)은? (단, 옥상수조는 제외한다.)","c":["5.2","10.4","26","39"],"a":3,"inc":false,"unit":"4-6"},{"id":"gwallisa-2025-05-03-107","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":107,"q":"옥내소화전설비의 화재안전성능기준상 송수구에 관한 내용으로 옳지 않은 것은?","c":["송수구는 송수 및 그 밖의 소화작업에 지장을 주지 않도록 설치할 것","송수구로부터 주배관에 이르는 연결배관에는 개폐밸브를 설치하지 않을 것","지면으로부터 높이가 0.5 미터 이상 1 미터 이하의 위치에 설치할 것","구경 50밀리미터의 쌍구형 또는 단구형으로 할 것"],"a":4,"inc":false,"unit":"4-6"},{"id":"gwallisa-2025-05-03-112","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":112,"q":"할로겐화합물 및 불활성기체소화설비의 화재안전기술기준상 소화약제의 종류 및 화학식이 옳은 것은?","c":["HFC-236fa: CF3CH2CF3","HFC-227ea: CHClFCF3","HCFC-124: CF3CHFCF3","HCFC-23: C4F10"],"a":1,"inc":false,"unit":"6-3"},{"id":"gwallisa-2025-05-03-113","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":113,"q":"화재안전기술기준상 「축광표지의 성능인증 및 제품검사의 기술기준」에 적합한 축광식 표지를 설치하지 않아도 되는 것은?","c":["피난기구의 위치를 표시하는 표지","소화기 및 투척용소화용구의 표지","연결송수관설비의 방수기구함 표지","비상콘센트 보호함 표면의 비상콘센트 표지"],"a":4,"inc":false,"unit":"7-3"},{"id":"gwallisa-2025-05-03-114","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":114,"q":"도로터널의 화재안전기술기준상 제연설비의 기준으로 옳지 않은 것은?","c":["비상전원은 제연설비를 유효하게 60분 이상 작동할 수 있도록 해야 한다.","횡류환기방식의 경우 제트팬의 소손을 고려하여 예비용 제트팬을 설치하도록 할 것","화재에 노출이 우려되는 제연설비와 전원공급선 및 제트팬 사이의 전원공급장치 등은 250℃의 온도에서 60분 이상 운전상태를 유지할 수 있도록 할 것","대배기구의 개폐용 전동모터는 정전 등 전원이 차단되는 경우에도 조작상태를 유지할 수 있도록 할 것"],"a":2,"inc":false,"unit":"9-6"},{"id":"gwallisa-2025-05-03-115","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":115,"q":"소방시설의 내진설계기준상 가스계 및 분말소화설비의 내진 설치 기준에 관한 설명으로 옳지 않은 것은?","c":["제어반등은 건물의 구조부재인 비내력벽, 바닥 또는 기둥에 고정하여야 한다.","제어반등의 하중이 450N 이하이고 내력벽 또는 기둥에 설치하는 경우 직경 8mm 이상의 고정용 볼트 4개 이상으로 고정할 수 있다.","저장용기는 지진하중에 의해 전도가 발생하지 않도록 설치할 것","기동장치 및 비상전원은 지진으로 인한 오동작이 발생하지 않도록 설치하여야 한다."],"a":1,"inc":false,"unit":"6-1"},{"id":"gwallisa-2025-05-03-119","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":119,"q":"소방시설설치 및 관리에 관한 법령에서 정하는 자동화재속보설비의 설치대상으로 옳지 않은 것은? (단, 방재실 등 화재 수신기가 설치된 장소에 24시간 화재를 감시할 수 있는 사람이 근무하지 않는다.)","c":["숙박시설이 없는 수련시설로서 바닥면적 500m2 이상인 층이 있는 것","근린생활시설 중 의원, 치과의원 및 한의원으로서 입원실이 있는 시설","노유자 생활시설","의료시설 중 정신병원 및 의료재활시설로 사용되는 바닥면적 합계가 500m2 이상인 층이 있는 것"],"a":1,"inc":false,"unit":"9-9"},{"id":"gwallisa-2025-05-03-120","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":120,"q":"피난기구의 화재안전성능기준상 승강식 피난기 및 하향식 피난구용 내림식사다리의 설치기준이 아닌 것은?","c":["대피실 내에는 “대피실” 표지판을 부착할 것","착지점과 하강구는 상호 수평거리 15센티미터 이상의 간격을 둘 것","승강식 피난기 및 하향식 피난구용 내림식사다리는 설치경로가 설치층에서 피난층까지 연계될 수 있는 구조로 설치할 것","하강구 내측에는 기구의 연결 금속구 등이 없어야 하며 전개된 피난기구는 하강구 수평투영면적 공간 내의 범위를 침범하지 않는 구조이어야 할 것"],"a":1,"inc":false,"unit":"7-3"},{"id":"gwallisa-2025-05-03-121","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2025-05-03","num":121,"q":"옥내소화전설비의 화재안전성능기준상 감시제어반의 전용실의 설치기준이 아닌 것은?","c":["다른 부분과 방화구획을 할 것","피난층 또는 지하 1층에 설치할 것","비상조명등 및 비상콘센트를 설치할 것","바닥면적은 감시제어반의 설치에 필요한 면적 외에 화재 시 소방대원이 그 감시제어반의 조작에 필요한 최소면적 이상으로 할 것"],"a":3,"inc":false,"unit":"4-6"},{"id":"gwallisa-2026-05-02-4","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":4,"q":"다음 중 인화점이 가장 높은 것은?","c":["경유","휘발유","아세톤","산화프로필렌"],"a":1,"inc":false,"unit":"1-1"},{"id":"gwallisa-2026-05-02-5","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":5,"q":"화재의 분류에서 B급 화재에 해당하는 것은?","c":["일반화재","유류화재","금속화재","전기화재"],"a":2,"inc":false,"unit":"1-17"},{"id":"gwallisa-2026-05-02-6","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":6,"q":"폭발에 관한 설명으로 옳지 않은 것은?","c":["폭발은 물적조건인 폭발범위와 발화온도 등의 에너지 조건을 충족해야 한다.","화염전파는 파동의 형태로 전파하므로 연소파라고 하고 그 파면을 화염면이라 한다.","화염전파속도는 연소속도에 연소가스 팽창에 의해 전방으로 이동하는 속도가 가산되는 것을 말한다.","화염전파속도가 미반응 매질속에서 음속 이하의 속도로 이동하는 폭발 현상을 폭굉이라 한다."],"a":4,"inc":false,"unit":"1-10"},{"id":"gwallisa-2026-05-02-8","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":8,"q":"중합폭발이 일어나는 물질로 옳은 것은?","c":["사이안화수소","무기과산화물","프로판","암모니아"],"a":1,"inc":false,"unit":"3-2"},{"id":"gwallisa-2026-05-02-16","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":16,"q":"페일 세이프(Fail safe)에 관한 설명으로 옳지 않은 것은?","c":["정전 시를 대비한 비상조명을 설치한다.","피난기구를 설치한다.","피난방향으로 열리는 출입문을 설치한다.","자동장치의 동작 실패 시에 대비하여 수동기동장치를 설치한다."],"a":3,"inc":false,"unit":"7-3"},{"id":"gwallisa-2026-05-02-17","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":17,"q":"목조건축물의 화재 특성으로 옳지 않은 것은?","c":["화염의 분출면적이 크고 복사열 또한 강하다.","횡방향보다 종방향의 화재성장이 빠르다.","습도가 낮을수록 연소확대가 빠르다.","화재 최성기 때의 온도는 내화건축물 화재 때보다 낮다."],"a":4,"inc":false,"unit":"1-11"},{"id":"gwallisa-2026-05-02-20","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":20,"q":"Thomas의 실험식에 의하면 플래시오버(Flashover)가 발생하기 위한 최소 열방출율은 환기요소와 화재실 내부 표면적에 의존한다. 이때 내부 표면적의 열적 특성이 미치는 영향으로 옳은 것은?","c":["내장재의 비열이 클수록 실내온도가 급격히 상승한다.","표면적이 넓을수록 열기가 집중되어 플래시오버가 더 빨리 일어난다.","벽체의 열전도율이 높을수록 플래시오버에 필요한 에너지는 줄어든다.","내부 벽면의 단열 성능이 우수할수록 플래시오버의 도달 시간은 단축된다."],"a":4,"inc":false,"unit":"1-13"},{"id":"gwallisa-2026-05-02-22","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":22,"q":"창고 건축물에서 원형 풀(Pool) 화재가 발생하여 화원의 직경이 2 m, 열방출율(Q)이 5,000 kW로 측정되었다. 이때 Heskestad 공식을 이용하여 평균 화염 높이(m)를 계산하면 약 얼마인가?","c":["5","6","7","8"],"a":1,"inc":false,"unit":"1-18"},{"id":"gwallisa-2026-05-02-26","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":26,"q":"어떤 액체의 체적이 5 m3, 중량이 98,000 N이다. 액체의 비중은 얼마인가? (단, 물의 비중량은 9,800 N/m3 이다.)","c":["0.5","1.0","1.5","2.0"],"a":4,"inc":false,"unit":"4-1"},{"id":"gwallisa-2026-05-02-27","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":27,"q":"물 속에 평행한 유리판을 연직으로 세웠을 때 모세관의 높이(cm)는 약 얼마인가? (단, 유리판의 간격은 5 mm, 접촉각은 0°, 물의 비중량은 9,800 N/m3, 물의 표면장력은 7.5 × 10-2 N/m이다.)","c":["0.3","1.3","2.3","3.3"],"a":1,"inc":false,"unit":"4-1"},{"id":"gwallisa-2026-05-02-28","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":28,"q":"베르누이 방정식에 관한 설명으로 옳지 않은 것은?","c":["적용조건은 비압축성 흐름, 비점성 흐름이다.","동수경사선은 압력수두와 위치수두의 합을 연결한 선이다.","질량보존법칙을 유체의 흐름에 적용한 것이다.","전수두(total head)는 압력수두와 위치수두, 속도수두의 합이다."],"a":3,"inc":false,"unit":"4-2"},{"id":"gwallisa-2026-05-02-29","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":29,"q":"원형관에서 레이놀즈수(Re)로 알 수 있는 흐름이 아닌 것은?","c":["층류","난류","천이류","사류"],"a":4,"inc":false,"unit":"4-3"},{"id":"gwallisa-2026-05-02-30","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":30,"q":"관수로 흐름에서 주손실에 해당하는 것은?","c":["유입손실","유출손실","밸브손실","마찰손실"],"a":4,"inc":false,"unit":"4-3"},{"id":"gwallisa-2026-05-02-32","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":32,"q":"길이 30 m, 내경 50 cm인 원형관을 통하여, 유량 0.5 m3/s의 물을 높이 20 m까지 양수하려고 한다. 이때 필요한 동력(HP)은 약 얼마인가? (단, 펌프와 모터의 합성효율은 80 %, 물의 비중량은 9,800 N/m3, 마찰손실계수는 0.02, 기타손실은 무시한다.)","c":["70","170","270","370" 800W와 600W를 지시할 때, 부하에 공급되는 유효전력(W)은 얼마인가?","c":["345","1,400","1,745","2,425"],"a":2,"inc":false,"unit":"9-2"},{"id":"gwallisa-2026-05-02-51","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":51,"q":"소방기본법령상 소방지원활동에 해당하는 것은?","c":["붕괴, 낙하 등이 우려되는 고드름, 나무, 위험 구조물 등의 제거활동","위해동물, 벌 등의 포획 및 퇴치 활동","집회ㆍ공연 등 각종 행사 시 사고에 대비한 근접대기 등 지원활동","단전사고 시 비상전원 또는 조명의 공급"],"a":3,"inc":false,"unit":"9-6"},{"id":"gwallisa-2026-05-02-54","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":54,"q":"소방기본법령상 소방용수시설의 설치기준으로 옳지 않은 것은?","c":["저수조는 소방펌프자동차가 쉽게 접근할 수 있도록 할 것","공업지역에 소방용수시설을 설치하는 경우 소방대상물과의 수평거리를 140미터 이하가되도록 할 것","소화전은 상수도와 연결하여 지하식 또는 지상식의 구조로 하고, 소방용호스와 연결하는 소화전의 연결금속구의 구경은 65밀리미터로 할 것","급수탑의 급수배관 구경은 100밀리미터 이상으로 하고, 개폐밸브는 지상에서 1.5미터 이상 1.7미터 이하의 위치에 설치하도록 할 것"],"a":2,"inc":false,"unit":"4-11"},{"id":"gwallisa-2026-05-02-55","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":55,"q":"소방시설공사업법령상 행정안전부령으로 정하는 초급기술자 이상의 소방기술자(기계분야 및 전기분야)를 배치할 수 있는 소방시설공사 현장의 기준으로 옳은 것은?","c":["연면적 20만제곱미터 이상인 특정소방대상물의 공사 현장","지하층을 포함한 층수가 16층 이상 40층 미만인 특정소방대상물의 공사현장","연면적 1천제곱미터 이상 1만제곱미터 미만인 아파트의 공사 현장","물분무등소화설비(호스릴 방식의 소화설비는 제외한다) 또는 제연설비가 설치되는 특정소방대상물의 공사현장"],"a":3,"inc":false,"unit":"4-10"},{"id":"gwallisa-2026-05-02-60","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":60,"q":"화재의 예방 및 안전관리에 관한 법령상 특수가연물의 지정수량이 다른 하나는?","c":["석탄ㆍ목탄류","사류(絲類)","볏집류","넝마 및 종이 부스러기"],"a":1,"inc":false,"unit":"3-2"},{"id":"gwallisa-2026-05-02-62","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":62,"q":"소방시설 설치 및 관리에 관한 법령상 소방시설등 자체점검 시 소방시설별 점검장비의 연결이 옳지 않은 것은?","c":["할론소화설비 - 기동관누설시험기","자동화재탐지설비 - 공기주입시험기","할로겐화합물 및 불활성기체 소화설비 - 검량계","스프링클러설비 - 소화전밸브압력계"],"a":4,"inc":false,"unit":"6-3"},{"id":"gwallisa-2026-05-02-63","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":63,"q":"소방시설 설치 및 관리에 관한 법령상 자체소방대가 설치된 제조소등에 부속된 사무실의 경우 설치하지 않을 수 있는 소방시설은?","c":["옥내소화전설비","자동화재탐지설비","비상방송설비","스프링클러설비"],"a":1,"inc":false,"unit":"4-6"},{"id":"gwallisa-2026-05-02-65","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":65,"q":"소방시설 설치 및 관리에 관한 법령상 소방시설등의 자체점검 결과의 조치 등에 관한 설명으로 옳지 않은 것은?","c":["특정소방대상물의 관계인은 자체점검 결과 소화펌프 고장 등 대통령령으로 정하는 중 대위반사항이 발견된 경우에는 지체 없이 수리 등 필요한 조치를 하여야 한다.","관리업자등은 자체점검 결과 중대위반사항을 발견한 경우 즉시 소방관서에 알려야 한다.","화재 수신기의 고장으로 화재경보음이 자동으로 울리지 않거나 화재 수신기와 연동된 소방시설의 작동이 불가능한 경우는 중대위반사항에 해당된다.","소화배관 등이 폐쇄ㆍ차단되어 소화수(消火水) 또는 소화약제가 자동 방출되지 않는 경우는 중대위반사항에 해당된다."],"a":2,"inc":false,"unit":"4-4"},{"id":"gwallisa-2026-05-02-79","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":79,"q":"다음 제2류 위험물 중 표준상태에서의 발화온도가 가장 낮은 것은?","c":["P","S","P4S3","Mg"],"a":3,"inc":false,"unit":"1-1"},{"id":"gwallisa-2026-05-02-83","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":83,"q":"제4류 위험물에 관한 설명으로 옳지 않은 것은?","c":["피리딘은 제1석유류 비수용성액체이다.","합성고무의 원료인 아이소프렌은 특수인화물이다.","아세트산은 질산과 반응하여 폭발의 위험이 있다.","에틸렌글라이콜은 무색의 끈적끈적한 수용성 액체로 제3석유류이다."],"a":1,"inc":false,"unit":"3-2"},{"id":"gwallisa-2026-05-02-86","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":86,"q":"2,4,6-트리나이트로톨루엔 1몰이 완전 열분해되었을 때 발생하는 모든 가연성가스를 표준상태로 환산하면 부피(ℓ)는 약 얼마인가?","c":["56.0","112.0","190.4","380.8"],"a":3,"inc":false,"unit":"3-1"},{"id":"gwallisa-2026-05-02-90","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":90,"q":"위험물안전관리법령상 제조소의 위치ㆍ구조 및 설비의 기준에서 위험물을 취급하는 건축물의 지붕을 내화구조로 할 수 있는 경우에 해당하지 않는 것은? (단, 밀폐형 구조의 건축물은 제외한다.)","c":["제6류 위험물을 취급하는 건축물인 경우","제4류 위험물 중 제4석유류ㆍ동식물유류를 취급하는 건축물인 경우","제5류 위험물 중 유기과산화물을 취급하는 건축물인 경우","제2류 위험물(분말상태의 것과 인화성고체를 제외한다)을 취급하는 건축물인 경우"],"a":3,"inc":false,"unit":"2-3"},{"id":"gwallisa-2026-05-02-91","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":91,"q":"위험물안전관리법령상 제조소의 위치ㆍ구조 및 설비의 기준에서 배출설비의 설치기준으로 옳지 않은 것은?","c":["위험물취급설비가 배관이음 등으로만 된 경우에는 전역방식으로 할 수 있다.","급기구는 높은 곳에 설치하고, 가는 눈의 구리망 등으로 인화방지망을 설치할 것","배풍기는 강제배기방식으로 하고, 옥내 덕트의 내압이 대기압 이상이 되지 아니하는 위치에 설치하여야 한다.","배출능력은 전역방식의 경우에는 바닥면적 1 m2당 15 m3/hr 이상으로 하여야 한다."],"a":4,"inc":false,"unit":"7-8"},{"id":"gwallisa-2026-05-02-92","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":92,"q":"위험물안전관리법령상 제조소의 위치ㆍ구조 및 설비의 기준에서 환기설비의 급기구가 설치된 실의 바닥면적이 100 m2인 경우 급기구의 최소면적(cm2)은?","c":["150","300","450","600"],"a":3,"inc":false,"unit":"7-8"},{"id":"gwallisa-2026-05-02-94","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":94,"q":"위험물안전관리법령상 소화설비의 설치기준에서 외벽이 내화구조이고, 연면적이 1,000 m2인 공장에서 벤젠을 하루에 10,000ℓ를 제조하고 있다. 이 공장의 소요단위는? (단, 공장은 제조소 용도로만 사용되며, 옥외에 설치된 공작물은 없다.)","c":["5","10","15","20"],"a":3,"inc":false,"unit":"2-3"},{"id":"gwallisa-2026-05-02-96","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":96,"q":"위험물안전관리법령상 옥내탱크저장소의 옥내저장탱크에 저장할 수 있는 등유의 최대 수량(ℓ)과 그 수량의 지정수량 배수로 옳은 것은?","c":["20,000 – 10배","20,000 – 20배","40,000 – 20배","40,000 - 40배"],"a":2,"inc":false,"unit":"3-9"},{"id":"gwallisa-2026-05-02-97","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":97,"q":"위험물안전관리법령상 안전거리와 보유공지 기준이 적용되는 저장소는?","c":["암반탱크저장소","지하탱크저장소","옥내탱크저장소","옥외저장소"],"a":4,"inc":false,"unit":"3-9"},{"id":"gwallisa-2026-05-02-98","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":98,"q":"위험물안전관리법령상 주유취급소의 위치ㆍ구조 및 설비의 기준에서 고정주유설비 등에 관한 기준으로 옳지 않은 것은?","c":["고정주유설비와 고정급유설비의 사이에는 4 m 이상의 거리를 유지할 것","고정주유설비 또는 고정급유설비의 본체 또는 노즐 손잡이에 주유작업자의 인체에 축적되는 정전기를 유효하게 제거할 수 있는 장치를 설치할 것","이동저장탱크의 상부를 통하여 주입하는 고정급유설비의 주유관에는 당해 탱크의 밑부분에 달하는 주입관을 설치하고, 그 배출량이 분당 80ℓ를 초과하는 것은 이동저장탱크에 주입하는 용도로만 사용할 것","고정급유설비의 중심선을 기점으로 하여 도로경계선까지 3 m 이상, 부지경계선 및 담까지 0.5 m 이상, 건축물의 벽까지 2 m(개구부가 없는 벽까지는 1 m) 이상의 거리를 유지할 것"],"a":4,"inc":false,"unit":"10-5"},{"id":"gwallisa-2026-05-02-99","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":99,"q":"위험물안전관리법령상 판매취급소의 위치ㆍ구조 및 설비의 기준에서 판매취급소의 기준으로 옳지 않은 것은?","c":["제1종 판매취급소의 용도로 사용하는 부분의 창 및 출입구에는 60분+방화문ㆍ60분방화문 또는 30분방화문을 설치할 것","제1종 판매취급소의 용도로 사용하는 부분의 창 또는 출입구에 유리를 이용하는 경우에는 망입유리로 할 것","위험물을 배합하는 실의 바닥면적은 6 m2 이상 15 m2 이하로 할 것","제1종 판매취급소의 용도로 사용하는 부분의 벽ㆍ기둥ㆍ바닥 및 보를 내화구조로 하고, 천장이 있는 경우에는 이를 난연재료로 할 것"],"a":4,"inc":false,"unit":"2-3"},{"id":"gwallisa-2026-05-02-101","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":101,"q":"소화기구 및 자동소화장치의 화재안전기술기준상 전기화재에 대하여 적응성이 없는 소화약제는?","c":["고체에어로졸화합물","중탄산염류소화약제","팽창질석ㆍ팽창진주암","할론소화약제"],"a":3,"inc":false,"unit":"10-5"},{"id":"gwallisa-2026-05-02-103","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":103,"q":"소방시설 설치 및 관리에 관한 법령상 옥내소화전설비를 설치해야 하는 특정소방대상물에 해당하는 것은?","c":["연면적 1천 m2 이상인 모든 층(터널은 제외한다)","4층 이상인 층 중에서 바닥면적이 200 m2 이상인 층이 있는 것","길이가 5백 m 이상인 터널","건축물의 옥상에 설치된 차고ㆍ주차장으로서 사용되는 면적이 200 m2 이상인 경우 해당 부분"],"a":4,"inc":false,"unit":"4-6"},{"id":"gwallisa-2026-05-02-104","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":104,"q":"옥외소화전설비의 화재안전기술기준상 옥외소화전 설치기준으로 옳지 않은 것은?","c":["특정소방대상물의 각 부분으로부터 하나의 옥외소화전까지의 수평거리가 40 m 이하가 되도록 할 것","옥외소화전의 호스는 40 mm로 하며, 호스접결구는 제조사에서 검증받은 것으로 사용할 것","공장 또는 창고시설로서 750배 이상의 특수가연물을 저장ㆍ취급하는 경우에는 각 옥외소화전 5 m 이내에 방수총을 별도로 설치하거나 옥외소화전과 방수총이 겸용으로 된 것으로 설치할 것","옥외소화전의 호스접결구가 지면으로부터 0.5 m 이상 1 m 이하의 높이에 위치하도록 설치할 것"],"a":2,"inc":false,"unit":"3-2"},{"id":"gwallisa-2026-05-02-105","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":105,"q":"스프링클러설비의 화재안전기술기준상 스프링클러헤드 설치 방법으로 옳은 것은?","c":["살수가 방해되지 않도록 스프링클러헤드로부터 반경 40 cm 이상의 공간을 보유할 것","스프링클러헤드의 반사판은 그 천장면과 경사되게 설치할 것","상부에 설치된 헤드의 방출수에 따라 감열부에 영향을 받을 우려가 있는 헤드에는 방출수를 차단할 수 있는 유효한 차폐판을 설치할 것","측벽형스프링클러헤드를 설치하는 경우 긴 변의 한쪽 벽에 일렬로 설치하고 5.6 m 이내마다 설치할 것"],"a":3,"inc":false,"unit":"4-7"},{"id":"gwallisa-2026-05-02-107","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":107,"q":"미분무소화설비의 화재안전기술기준상 헤드에 관한 내용으로 옳은 것은?","c":["미분무헤드는 소방대상물의 천장ㆍ반자ㆍ천장과 반자 사이ㆍ덕트ㆍ선반 기타 이와 유사한 부분에 설계자의 의도에 적합하도록 설치해야 한다.","하나의 헤드까지의 수평거리 산정은 제조사가 제시해야 한다.","미분무소화설비에 사용되는 헤드는 표준형헤드를 설치해야 한다.","미분무헤드는 배관, 행거 등으로부터 방수시간과 방수량에 방해되지 아니하도록 설치해야 한다."],"a":1,"inc":false,"unit":"4-10"},{"id":"gwallisa-2026-05-02-108","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":108,"q":"포소화약제의 농도가 6 %, 최종 발생한 포 체적이 200 m3, 팽창비가 400일 때 포소화약제의 양(L)은 얼마인가?","c":["60","50","40","30"],"a":4,"inc":false,"unit":"5-1"},{"id":"gwallisa-2026-05-02-110","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":110,"q":"이산화탄소소화설비의 화재안전기술기준상 부취발생기에 관한 설치기준으로 옳지 않은 것은?","c":["소화약제 저장용기실 내의 소화배관에 설치해야 한다.","점검 및 관리가 쉬운 위치에 설치해야 한다.","방호구역별로 선택밸브 직후 2차측 배관에 설치해야 한다.","선택밸브가 없는 경우에는 저장용기에 설치해야 한다."],"a":4,"inc":false,"unit":"6-2"},{"id":"gwallisa-2026-05-02-111","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":111,"q":"할론소화설비의 화재안전기술기준상 가스압력식 기동장치에 관한 내용으로 옳은 것은?","c":["기동용가스용기 및 해당 용기에 사용하는 밸브는 25MPa 이상의 압력에 견딜 수 있는 것으로 설치해야 한다.","기동용가스용기에는 내압시험압력의 0.5배부터 내압시험압력 이하에서 작동하는 안전장치를 설치해야 한다.","기동용가스용기의 체적은 0.5 L 이상으로 하고, 해당 용기에 저장하는 질소 등의 비활성 기체는 6.0MPa 이상(21℃ 기준)의 압력으로 충전할 수 있는 것으로 설치해야 한다.","기동용가스용기의 체적을 0.5 L 이상으로 하고, 해당 용기에 저장하는 이산화탄소의 양은 0.6 kg 이상으로 하며, 충전비는 1.5 이상 1.9 이하의 기동용가스용기로 설치할 수 있다."],"a":1,"inc":false,"unit":"6-2"},{"id":"gwallisa-2026-05-02-114","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":114,"q":"분말소화설비의 화재안전기술기준상 분말소화약제의 저장용기 설치기준 내용으로 옳은 것은?","c":["방호구역 외의 장소에 설치할 것. 다만, 방호구역 내에 설치할 경우에는 피난 및 조작이용이하도록 피난구 부근에 설치해야 한다.","온도가 50℃ 이하이고, 온도 변화가 작은 곳에 설치해야 한다.","용기 간의 간격은 점검에 지장이 없도록 1 cm 이상의 간격을 유지하도록 설치해야 한다.","저장용기와 집합관을 연결하는 연결배관에는 개폐밸브를 설치할 것. 다만, 저장용기가 하나의 방호구역만을 담당하는 경우에는 그렇지 않다."],"a":1,"inc":false,"unit":"6-1"},{"id":"gwallisa-2026-05-02-116","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":116,"q":"자동화재탐지설비 및 시각경보장치의 화재안전기술기준상 감지기에 관한 내용으로 옳지 않은 것은?","c":["전기자동차 충전구역(지하주차장에 한함)의 연기감지기는 아날로그 방식으로 한다.","감지기(차동식분포형 제외)는 실내로의 공기유입구로부터 0.8 m 이상 떨어진 위치에 설치해야 한다.","감지기는 천장 또는 반자의 옥내에 면하는 부분에 설치할 것. 다만, 지하주차장에 설치하는 감지기의 경우에는 지하주차장의 보의 깊이가 30 cm 이상이고, 보와 보 사이의 내측면 간의 거리가 바닥으로부터 보가 설치된 천장까지의 수직 높이의 40 % 이상인 때에는 보로 구획된 부분마다 1개 이상의 감지기를 설치해야 한다.","정온식감지기는 주방ㆍ보일러실 등으로서 다량의 화기를 취급하는 장소에 설치하되, 공칭작동온도가 최고주위온도보다 20℃ 이상 높은 것으로 설치해야 한다."],"a":2,"inc":false,"unit":"8-7"},{"id":"gwallisa-2026-05-02-117","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":117,"q":"비상경보설비 및 단독경보형감지기의 화재안전기술기준상 발신기에 관한 내용으로 옳지 않은 것은?","c":["조작이 쉬운 장소에 설치하고, 조작스위치는 바닥으로부터 0.8 m 이상 1.5 m 이하의 높이에 설치해야 한다.","특정소방대상물의 층마다 설치하되, 해당 층의 각 부분으로부터 하나의 발신기까지의 수평거리가 25m 이하가 되도록 설치해야 한다.","복도 또는 별도로 구획된 실로서 보행거리가 25m 이상일 경우에는 추가로 발신기를 설치해야 한다.","발신기의 위치표시등은 함의 상부에 설치하되, 그 불빛은 부착 면으로부터 15° 이상의 범위 안에서 부착지점으로부터 10 m 이내의 어느 곳에서도 쉽게 식별할 수 있는 적색등으로 설치해야 한다."],"a":3,"inc":false,"unit":"3-10"},{"id":"gwallisa-2026-05-02-121","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":121,"q":"특별피난계단의 계단실 및 부속실 제연설비의 화재안전기술기준상 유입공기 배출방식 중 수직풍도에 따른 배출 기준으로 옳은 것은?","c":["화재 층에 설치된 화재감지기의 동작에 따라 모든 층의 댐퍼가 개방될 것","배출댐퍼는 두께 1.0 mm 이상의 강판 또는 이와 동등 이상의 성능이 있는 것으로 설치해야 하며 비 내식성 재료의 경우에는 부식방지 조치를 할 것","송풍기를 이용한 기계배출식의 경우 풍도 내의 풍속을 20 m/s 이하로 할 것","수직풍도의 내부면은 두께 0.5 mm 이상의 아연도금강판 또는 동등 이상의 내식성ㆍ내열성이 있는 것으로 마감하되, 접합부에 대하여는 통기성이 없도록 조치할 것"],"a":4,"inc":false,"unit":"7-8"},{"id":"gwallisa-2026-05-02-123","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":123,"q":"비상콘센트설비의 화재안전기술기준상 비상콘센트설비의 전원회로 설치기준으로 옳은 것은?","c":["비상콘센트설비의 전원회로는 단상교류 220 V인 것으로서, 그 공급용량은 1.0 kVA 이상인 것으로 할 것","전원회로는 각층에 2이상이 되도록 설치할 것. 다만, 설치해야 할 층의 비상콘센트가 2개인 때에는 하나의 회로로 할 수 있다.","하나의 전용회로에 설치하는 비상콘센트는 10개 이하로 할 것","비상콘센트용의 풀박스 등은 방청도장을 한 것으로서, 두께 1.5 mm 이상의 철판으로 할 것"],"a":3,"inc":false,"unit":"9-9"},{"id":"gwallisa-2026-05-02-124","cat":"gwallisa","catLabel":"소방시설관리사","catShort":"관리사","round":"2026-05-02","num":124,"q":"지하구의 화재안전기술기준상 연소방지설비의 헤드 설치기준으로 옳지 않은 것은?","c":["헤드간의 수평거리는 연소방지설비 전용헤드의 경우에는 3 m 이하로 할 것","헤드간의 수평거리는 개방형스프링클러헤드의 경우에는 1.5 m 이하로 할 것","소방대원의 출입이 가능한 환기구ㆍ작업구마다 지하구의 양쪽방향으로 살수헤드를 설정하되, 한쪽 방향의 살수구역의 길이는 3 m 이상으로 할 것","환기구 사이의 간격이 700 m를 초과할 경우에는 700 m 이내마다 살수구역을 설정하되, 지하구의 구조를 고려하여 방화벽을 설치한 경우에는 그렇지 않다."],"a":1,"inc":false,"unit":"2-2"}];

var STORAGE_KEY = 'fireDynamicsStudyV1';
var state = loadState();

function defaultState(){
  return {
    records:{},
    history:[],
    settings:{
      cats:{gongmuwon:true,gisa:true,gwallisa:true},
      status:'all',
      order:'seq',
      excludeIncomplete:false,
      search:'',
      navCollapsed:false,
      unit:null
    }
  };
}
function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    var d = defaultState();
    parsed.records = parsed.records || {};
    parsed.history = parsed.history || [];
    parsed.settings = Object.assign(d.settings, parsed.settings||{});
    parsed.settings.cats = Object.assign(d.settings.cats, (parsed.settings&&parsed.settings.cats)||{});
    return parsed;
  }catch(e){ return defaultState(); }
}
var saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }, 120);
}
function getRecord(id){
  if(!state.records[id]) state.records[id] = {status:'unseen', attempts:0, everWrong:false, chosen:null, lastAt:null, star:false};
  return state.records[id];
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtPct(n){ return (isFinite(n)? n.toFixed(0) : '0') + '%'; }
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t=arr[i]; arr[i]=arr[j]; arr[j]=t;
  }
  return arr;
}

/* ---------- aggregate stats ---------- */
function computeOverall(){
  var total=DATA.length, correct=0, wrong=0, unseen=0;
  DATA.forEach(function(q){
    var r = state.records[q.id];
    var st = r ? r.status : 'unseen';
    if(st==='correct') correct++;
    else if(st==='wrong') wrong++;
    else unseen++;
  });
  var answered = correct+wrong;
  return {total:total, correct:correct, wrong:wrong, unseen:unseen, answered:answered,
    acc: answered? (correct/answered*100) : 0};
}
function computeList(list){
  var total=list.length, correct=0, wrong=0;
  list.forEach(function(q){
    var r = state.records[q.id];
    var st = r? r.status:'unseen';
    if(st==='correct') correct++; else if(st==='wrong') wrong++;
  });
  var answered=correct+wrong;
  return {total:total, correct:correct, wrong:wrong, unseen:total-answered, answered:answered,
    acc: answered? (correct/answered*100):0};
}
function computeCat(cat){ return computeList(DATA_BY_CAT[cat]); }
function computeUnit(uid){ return computeList(DATA_BY_UNIT[uid] || []); }
function wrongList(){
  return DATA.filter(function(q){ var r=state.records[q.id]; return r && r.status==='wrong'; });
}
function starList(){
  return DATA.filter(function(q){ var r=state.records[q.id]; return r && r.star; });
}

/* ---------- routing ---------- */
var view = 'home';
var queue = [];
var qIndex = 0;

function setView(v){
  view = v;
  if(v==='study') startQueue(state.settings);
  if(v==='wrong') startWrongQueue();
  render();
  document.getElementById('main').scrollTop = 0;
  window.scrollTo(0,0);
}
function startQueue(settings){
  var kw = (settings.search||'').trim().toLowerCase();
  var list = DATA.filter(function(q){
    if(!settings.cats[q.cat]) return false;
    if(settings.unit && q.unit!==settings.unit) return false;
    if(settings.excludeIncomplete && q.inc) return false;
    if(settings.status==='wrong'){ var r=state.records[q.id]; if(!(r && r.status==='wrong')) return false; }
    if(settings.status==='unseen'){ var r2=state.records[q.id]; if(!(!r2 || r2.status==='unseen')) return false; }
    if(settings.status==='star'){ var r3=state.records[q.id]; if(!(r3 && r3.star)) return false; }
    if(kw){
      var hay = q.q.toLowerCase();
      var hit = hay.indexOf(kw)>=0;
      if(!hit){ for(var i=0;i<q.c.length;i++){ if(q.c[i].toLowerCase().indexOf(kw)>=0){ hit=true; break; } } }
      if(!hit) return false;
    }
    return true;
  });
  if(settings.order==='random') list = shuffle(list.slice());
  queue = list.map(function(q){return q.id;});
  qIndex = 0;
}
function startWrongQueue(){
  var list = wrongList();
  queue = list.map(function(q){return q.id;});
  qIndex = 0;
}

/* ---------- render root ---------- */
function render(){
  document.body.classList.toggle('study-mode', view==='study' || view==='wrong');
  document.querySelectorAll('.nav-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.view===view);
  });
  document.getElementById('navWrongCount').textContent = wrongList().length;

  var ae = document.activeElement;
  var focusId = (ae && ae.id) ? ae.id : null;
  var selStart = null, selEnd = null;
  if(focusId && typeof ae.selectionStart === 'number'){ selStart = ae.selectionStart; selEnd = ae.selectionEnd; }

  var main = document.getElementById('main');
  if(view==='home') main.innerHTML = renderHome();
  else if(view==='study') main.innerHTML = renderStudy(false);
  else if(view==='wrong') main.innerHTML = renderStudy(true);
  else if(view==='units') main.innerHTML = renderUnits();
  else if(view==='stats') main.innerHTML = renderStats();
  else if(view==='settings') main.innerHTML = renderSettings();
  bindView();
  syncPad();

  if(focusId){
    var el = document.getElementById(focusId);
    if(el){
      el.focus({preventScroll:true});
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

function renderUnits(){

/* ---------- STUDY / WRONG ---------- */
function renderStudy(isWrong){
  var settings = state.settings;
  var total = queue.length;

  if(total===0){
    var msg = isWrong ? '오답노트가 비어 있어요. 학습을 시작하면 틀린 문제가 이곳에 자동으로 모여요.' : '조건에 맞는 문제가 없어요. 필터를 조정해보세요.';
    return (isWrong? '' : unitChipHtml(settings)+filterToggleHtml(settings)+filterPanelHtml(settings))+
      '<div class="card empty-note">'+esc(msg)+'</div>';
  }
  if(qIndex>=total) qIndex = total-1;
  if(qIndex<0) qIndex = 0;

  var q = DATA_BY_ID[queue[qIndex]];
  var rec = getRecord(q.id);
  var answered = rec.chosen!=null;

  var choicesHtml = q.c.map(function(ctext, i){
    var idx = i+1;
    var cls = 'choice';
    if(answered){
      cls += ' disabled';
      if(idx===q.a) cls += ' is-correct';
      else if(idx===rec.chosen) cls += ' is-wrong';
      else cls += ' dim';
    }
    return '<button class="'+cls+'" data-choice="'+idx+'" '+(answered?'disabled':'')+'>'+
      '<span class="cnum">'+idx+'</span><span>'+esc(ctext)+'</span></button>';
  }).join('');

  var resultHtml = '';
  if(answered){
    var ok = rec.status==='correct';
    resultHtml = '<div class="result-row">'+
      '<span class="result-badge '+(ok?'ok':'no')+'">'+
        (ok? '✓ 정답입니다' : '✕ 오답 — 정답은 '+q.a+'번')+
      '</span>'+
      '<span class="spacer"></span>'+
      '<button class="btn btn-ghost btn-sm" id="btnRetry">다시 풀어보기</button>'+
    '</div>';
  }

  var warnHtml = q.inc ? '<div class="warn-box">⚠ 이 문항은 원본 자료에 &lt;보기&gt;(ㄱㄴㄷㄹ) 항목의 원문이 누락되어 있어요. 회차·문제번호를 참고해 원 출처에서 확인해주세요.</div>' : '';

  var progressPct = total? Math.round(((qIndex)/total)*100) : 0;

  return ''+
    '<div class="progress-row">'+
      '<span class="ptext">'+(qIndex+1)+' / '+total+'</span>'+
      '<div class="ptrack"><div class="pfill" style="width:'+progressPct+'%"></div></div>'+
      (isWrong? '' : unitChipHtml(settings))+
      (isWrong? '' : filterToggleHtml(settings))+
    '</div>'+
    (isWrong? '' : filterPanelHtml(settings))+
    '<div class="study-grid single">'+
      '<div class="card qcard">'+

/* ---------- STATS ---------- */
function roundStats(){
  var map = {};
  DATA.forEach(function(q){
    var key = q.cat+'|'+q.round;
    if(!map[key]) map[key] = {cat:q.cat, round:q.round, total:0, correct:0, wrong:0};
    map[key].total++;
    var r = state.records[q.id];
    var st = r? r.status:'unseen';
    if(st==='correct') map[key].correct++;
    else if(st==='wrong') map[key].wrong++;
  });
  return Object.keys(map).map(function(k){
    var m = map[k];
    var answered = m.correct+m.wrong;
    m.answered = answered;
    m.acc = answered? m.correct/answered*100 : null;
    return m;
  });
}

function renderStats(){
  var o = computeOverall();
  var rs = roundStats().filter(function(r){ return r.answered>=3; });
  rs.sort(function(a,b){ return a.acc-b.acc; });
  var weak = rs.slice(0,8);

  var weakHtml = weak.length? weak.map(function(r){
    return '<span class="weak-chip"><span class="cat-tag '+r.cat+'" style="width:auto;padding:3px 8px;">'+CAT_SHORT[r.cat]+'</span> '+esc(r.round)+' &nbsp;<b>'+fmtPct(r.acc)+'</b> ('+r.correct+'/'+r.answered+')</span>';
  }).join('') : '<div class="empty-note">3문항 이상 푼 회차가 쌓이면 취약 회차가 여기에 표시돼요.</div>';

  var catRowsHtml = CAT_ORDER.map(function(cat){
    var c = computeCat(cat);
    return '<tr><td><span class="cat-tag '+cat+'" style="width:auto;padding:3px 9px;">'+CAT_SHORT[cat]+'</span></td>'+
      '<td class="num">'+c.total+'</td><td class="num">'+c.answered+'</td>'+
      '<td class="num" style="color:var(--correct)">'+c.correct+'</td>'+
      '<td class="num" style="color:var(--wrong)">'+c.wrong+'</td>'+
      '<td class="num">'+(c.answered? fmtPct(c.acc):'—')+'</td></tr>';
  }).join('');

  var hist = state.history.slice(-30).reverse();
  var histHtml = hist.length? hist.map(function(h){
    var q = DATA_BY_ID[h.id];
    var title = q? (CAT_SHORT[q.cat]+' '+q.round+' #'+q.num) : h.id;
    return '<div class="hist-dot '+(h.correct?'correct':'wrong')+'" title="'+esc(title)+'"></div>';
  }).join('') : '';

  return ''+
  '<div class="view-head"><div><h1>통계 · 분석</h1><p>맞은 문제와 틀린 문제를 회차·시험별로 분석해요.</p></div></div>'+
  '<div class="stat-grid">'+
    '<div class="card stat-card"><div class="num">'+o.answered+' / '+o.total+'</div><div class="label">학습 진행</div></div>'+
    '<div class="card stat-card good"><div class="num">'+o.correct+'</div><div class="label">정답</div></div>'+
    '<div class="card stat-card bad"><div class="num">'+o.wrong+'</div><div class="label">오답</div></div>'+
    '<div class="card stat-card accent"><div class="num">'+fmtPct(o.acc)+'</div><div class="label">누적 정답률</div></div>'+
  '</div>'+
  '<div class="section-title">시험별 정답률</div>'+
  '<div class="table-wrap"><table><thead><tr><th>시험</th><th class="num">전체</th><th class="num">학습</th><th class="num">정답</th><th class="num">오답</th><th class="num">정답률</th></tr></thead><tbody>'+catRowsHtml+'</tbody></table></div>'+
  '<div class="section-title">취약 회차 Top 8 <span style="font-weight:500;color:var(--ink-soft);font-size:.78rem;">(3문항 이상 시도 기준, 정답률 낮은 순)</span></div>'+
  '<div>'+weakHtml+'</div>'+
  '<div class="section-title">최근 풀이 기록</div>'+
  (hist.length? '<div class="card pad-md"><div class="history-row">'+histHtml+'</div><div class="bar-legend" style="margin-top:12px;"><span><i class="dot correct"></i>정답</span><span><i class="dot wrong"></i>오답</span><span style="color:var(--ink-soft)">최근 순 · 최대 30개</span></div></div>' : '<div class="card empty-note">아직 풀이 기록이 없어요.</div>');
}

/* ---------- event binding ---------- */
function bindView(){
  if(view==='home'){
    var c1=document.getElementById('ctaContinue');
    if(c1) c1.onclick=function(){ setView('study'); };
    var c2=document.getElementById('ctaWrong');
    if(c2) c2.onclick=function(){ setView('wrong'); };
    var c3=document.getElementById('ctaRandom');
    if(c3) c3.onclick=function(){
      state.settings.order='random'; state.settings.status='all'; state.settings.unit=null;
      state.settings.cats={gongmuwon:true,gisa:true,gwallisa:true};
      saveState(); setView('study');
    };
    var c4=document.getElementById('ctaUnits');
    if(c4) c4.onclick=function(){ setView('units'); };
  }
  if(view==='units'){
    document.querySelectorAll('.unit-row').forEach(function(btn){
      btn.onclick=function(){
        var uid = btn.dataset.unit;
        state.settings.unit = uid;
        state.settings.cats = {gongmuwon:true,gisa:true,gwallisa:true};
        state.settings.status = 'all';
        state.settings.order = 'seq';
        state.settings.excludeIncomplete = false;
        state.settings.search = '';
        var navSearchEl = document.getElementById('navSearchInput');
        if(navSearchEl) navSearchEl.value = '';
        var navSearchClearEl = document.getElementById('navSearchClear');
        if(navSearchClearEl) navSearchClearEl.classList.remove('show');
        saveState();
        setView('study');
      };
    });
  }
  if(view==='study' || view==='wrong'){
    var unitChipClear=document.getElementById('unitChipClear');
    if(unitChipClear) unitChipClear.onclick=function(){
      state.settings.unit = null;
      saveState();
      startQueue(state.settings);
      render();
    };
    var ft=document.getElementById('filterToggle');
    if(ft) ft.onclick=function(){ document.getElementById('filterPanel').classList.toggle('open'); };
    document.querySelectorAll('.chip').forEach(function(chipEl){
      chipEl.onclick=function(){
        var g=chipEl.dataset.group, k=chipEl.dataset.key;
        if(g==='cat'){
          var onCount = CAT_ORDER.filter(function(c){return state.settings.cats[c];}).length;
          if(state.settings.cats[k] && onCount<=1) return;
          state.settings.cats[k] = !state.settings.cats[k];
        } else if(g==='status'){ state.settings.status = k; }
        else if(g==='order'){ state.settings.order = k; }
        else if(g==='inc'){ state.settings.excludeIncomplete = !state.settings.excludeIncomplete; }
        saveState();
        startQueue(state.settings);
        render();
        var panel=document.getElementById('filterPanel');
        if(panel) panel.classList.add('open');
      };
    });
    document.querySelectorAll('.choice').forEach(function(btn){
      btn.onclick=function(){
        var q = DATA_BY_ID[queue[qIndex]];
        var rec = getRecord(q.id);
        if(rec.chosen!=null) return;
        var idx = parseInt(btn.dataset.choice,10);
        rec.chosen = idx;
        rec.attempts += 1;
        rec.lastAt = Date.now();
        var ok = idx===q.a;
        rec.status = ok ? 'correct' : 'wrong';
        if(!ok) rec.everWrong = true;
        state.history.push({id:q.id, cat:q.cat, correct:ok, ts:rec.lastAt});
        if(state.history.length>500) state.history = state.history.slice(-500);
        saveState();
        render();
      };
    });
    var retry=document.getElementById('btnRetry');
    if(retry) retry.onclick=function(){
      var q = DATA_BY_ID[queue[qIndex]];
      var rec = getRecord(q.id);
      rec.chosen = null;
      saveState();
      render();
    };
    var star=document.getElementById('btnStar');
    if(star) star.onclick=function(){
      var q = DATA_BY_ID[queue[qIndex]];
      var rec = getRecord(q.id);
      rec.star = !rec.star;
      saveState();
      render();
    };
    var prev=document.getElementById('btnPrev');
    if(prev) prev.onclick=function(){ if(qIndex>0){ qIndex--; render(); } };
    var next=document.getElementById('btnNext');
    if(next) next.onclick=function(){ if(qIndex<queue.length-1){ qIndex++; render(); } };
  }
  if(view==='settings'){
    var be=document.getElementById('btnExport');
    if(be) be.onclick=function(){
      var blob = new Blob([JSON.stringify(state)], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var d = new Date();
      var stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
      a.href = url; a.download = 'fire-study-progress-'+stamp+'.json';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };
    var fi=document.getElementById('fileImport');
    if(fi) fi.onchange=function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        try{
          var parsed = JSON.parse(ev.target.result);
          if(!parsed || typeof parsed!=='object' || !parsed.records) throw new Error('invalid');
          if(!confirm('현재 학습 기록을 불러온 파일 내용으로 덮어쓸까요?')) return;
          state = Object.assign(defaultState(), parsed);
          saveState();
          render();
          alert('불러오기가 완료됐어요.');
        }catch(err){ alert('올바른 백업 파일이 아니에요.'); }
      };
      reader.readAsText(file);
    };
    var brp=document.getElementById('btnResetProgress');
    if(brp) brp.onclick=function(){
      if(!confirm('모든 문항의 정답/오답 기록을 초기화할까요? 즐겨찾기는 유지됩니다.')) return;
      Object.keys(state.records).forEach(function(id){
        state.records[id].status='unseen';
        state.records[id].chosen=null;
        state.records[id].attempts=0;
        state.records[id].everWrong=false;
      });
      state.history=[];
      saveState(); render();
    };
    var bra=document.getElementById('btnResetAll');
    if(bra) bra.onclick=function(){
      if(!confirm('학습 기록, 오답노트, 즐겨찾기를 모두 삭제할까요? 되돌릴 수 없어요.')) return;
      state = defaultState();
      saveState(); render();
    };
  }
}

/* ---------- Calc memo pad ---------- */
/* Lives outside #main so choosing an answer / starring / filtering
   (all of which re-render #main) never wipes what's on the canvas.
   Only switching to a different question clears it. */
var padCtx = null;
var padMode = 'pen';
var padQId = null;

function syncPad(){
  var show = (view==='study' || view==='wrong') && queue.length>0;
  document.body.classList.toggle('has-pad', show);
  if(!show) return;
  var q = DATA_BY_ID[queue[qIndex]];
  if(q && q.id !== padQId){
    padQId = q.id;
    clearPad();
  }
  resizePadCanvas();
}

function resizePadCanvas(){
  var canvas = document.getElementById('padCanvas');
  var wrap = document.getElementById('padWrap');
  if(!canvas || !wrap) return;
  var rect = wrap.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(1, Math.round(rect.width * dpr));
  var h = Math.max(1, Math.round(rect.height * dpr));
  if(canvas.width===w && canvas.height===h) return;
  canvas.width = w;
  canvas.height = h;
  padCtx = canvas.getContext('2d');
  padCtx.scale(dpr, dpr);
}

function clearPad(){
  var canvas = document.getElementById('padCanvas');
  var placeholder = document.getElementById('padPlaceholder');
  if(!canvas) return;
  resizePadCanvas();
  if(padCtx) padCtx.clearRect(0, 0, canvas.width, canvas.height);
  if(placeholder) placeholder.style.display = 'flex';
}

function strokeSeg(x0,y0,x1,y1){
  if(!padCtx) return;
  padCtx.lineJoin = 'round';
  padCtx.lineCap = 'round';
  if(padMode==='eraser'){
    padCtx.globalCompositeOperation = 'destination-out';
    padCtx.lineWidth = 22;
  } else {
    padCtx.globalCompositeOperation = 'source-over';
    padCtx.lineWidth = 2.4;
    padCtx.strokeStyle = (getComputedStyle(document.documentElement).getPropertyValue('--ink') || '#eceeec').trim();
  }
  padCtx.beginPath();
  padCtx.moveTo(x0, y0);
  padCtx.lineTo(x1, y1);
  padCtx.stroke();
}

function initPad(){
  var canvas = document.getElementById('padCanvas');
  var wrap = document.getElementById('padWrap');
  var placeholder = document.getElementById('padPlaceholder');
  var pen = document.getElementById('padPen');
  var eraser = document.getElementById('padEraser');
  var expand = document.getElementById('padExpand');
  var clearBtn = document.getElementById('padClear');
  if(!canvas) return;
  padCtx = canvas.getContext('2d');

  function setMode(m){
    padMode = m;
    pen.classList.toggle('on', m==='pen');
    eraser.classList.toggle('on', m==='eraser');
  }
  pen.onclick = function(){ setMode('pen'); };
  eraser.onclick = function(){ setMode('eraser'); };
  expand.onclick = function(){
    wrap.classList.toggle('expanded');
    expand.classList.toggle('on', wrap.classList.contains('expanded'));
    resizePadCanvas();
  };
  clearBtn.onclick = function(){ clearPad(); };

  var drawing = false, lastX = 0, lastY = 0;
  function pos(e){
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  canvas.addEventListener('pointerdown', function(e){
    drawing = true;
    if(placeholder) placeholder.style.display = 'none';
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    var p = pos(e);
    lastX = p.x; lastY = p.y;
    strokeSeg(p.x, p.y, p.x, p.y);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', function(e){
    if(!drawing) return;
    var p = pos(e);
    strokeSeg(lastX, lastY, p.x, p.y);
    lastX = p.x; lastY = p.y;
    e.preventDefault();
  });
  function endStroke(){ drawing = false; }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  canvas.addEventListener('pointerleave', endStroke);

  window.addEventListener('resize', function(){ resizePadCanvas(); });
}

initPad();
render();
})();
</script>
