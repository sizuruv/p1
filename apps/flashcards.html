<!DOCTYPE html>
<html lang="ko">
<head>
<script src="../shell.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>플래시카드</title>
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#bd431c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="플래시카드" />
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="../icons/icon-512.png" />
<style>
  :root{
    --bg:#eef0ec; --surface:#ffffff; --surface-2:#e3e7e1;
    --ink:#1b201d; --ink-soft:#5b655e; --border:#d4d9d0;
    --ember:#bd431c; --ember-ink:#ffffff; --ember-soft:#f6ded2;
    --wrong:#ab3535; --wrong-soft:#f6dcdc;
    --correct:#2e7a49; --correct-soft:#dcefe1;
    --shadow:0 1px 2px rgba(20,20,15,.06),0 6px 20px -8px rgba(20,20,15,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;touch-action:manipulation;}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    min-height:100vh;min-height:100dvh;
  }
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header{
    padding:calc(22px + env(safe-area-inset-top,0px)) 20px 16px;
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:8px;color:var(--ember);font-size:11px;font-weight:800;
    letter-spacing:.14em;text-transform:uppercase;}
  h1{margin:6px 0 2px;font-size:22px;font-weight:800;letter-spacing:-.01em;}
  .subtitle{margin:0;color:var(--ink-soft);font-size:13px;}

  main{flex:1;padding:16px 20px 40px;}

  .toprow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .toprow .count{font-size:13px;color:var(--ink-soft);font-weight:600;flex:1;}
  .btn{
    appearance:none;border:1px solid var(--border);background:var(--surface);
    color:var(--ink);font-weight:700;font-size:.86rem;
    padding:9px 14px;border-radius:10px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{background:var(--surface-2);}
  .btn-primary{background:var(--ember);border-color:var(--ember);color:var(--ember-ink);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:none;border-color:transparent;color:var(--ink-soft);}
  .btn-ghost:hover{background:var(--surface-2);color:var(--ink);}
  .btn-danger{color:var(--wrong);}
  .btn-sm{padding:6px 10px;font-size:.78rem;border-radius:8px;}

  .empty{
    text-align:center;color:var(--ink-soft);font-size:.9rem;line-height:1.7;
    padding:60px 20px;border:1px dashed var(--border);border-radius:16px;
  }

  .card-row{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:14px 16px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);
  }
  .card-row:hover{background:var(--surface-2);}
  .card-row .num{
    flex:none;width:28px;height:28px;border-radius:50%;background:var(--ember-soft);color:var(--ember);
    display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;
  }
  .card-row .preview{flex:1;min-width:0;}
  .card-row .q{font-size:.92rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-row .a{font-size:.78rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .card-row .chev{flex:none;color:var(--ink-soft);}
  .card-row .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:middle;}
  .card-row .dot.know{background:var(--correct);}
  .card-row .dot.wrong{background:var(--wrong);}

  .stats-row{display:flex;gap:10px;margin-bottom:12px;}
  .stat-pill{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:10px 12px;text-align:center;}
  .stat-pill .n{font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums;}
  .stat-pill .l{font-size:.68rem;color:var(--ink-soft);margin-top:2px;}
  .stat-pill.correct .n{color:var(--correct);}
  .stat-pill.wrong .n{color:var(--wrong);}

  .study-actions{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;}
  .study-actions .btn{width:100%;justify-content:center;padding:12px;}

  .progress-track{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-bottom:12px;}
  .progress-fill{height:100%;background:var(--ember);}

  .grade-row{display:flex;gap:10px;margin-bottom:14px;}
  .grade-btn{flex:1;padding:14px;border-radius:14px;border:none;font-weight:800;font-size:.95rem;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
  .grade-btn.wrong{background:var(--wrong-soft);color:var(--wrong);}
  .grade-btn.know{background:var(--correct-soft);color:var(--correct);}
  .grade-btn:hover{filter:brightness(.97);}

  .summary{text-align:center;padding:36px 20px 10px;}
  .summary .big{font-size:2.2rem;font-weight:800;margin-bottom:4px;font-variant-numeric:tabular-nums;}
  .summary .sub{color:var(--ink-soft);font-size:.88rem;margin-bottom:24px;}

  .study-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .study-nav .pos{flex:1;text-align:center;font-size:.82rem;color:var(--ink-soft);font-weight:700;}

  .field{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow);
  }
  .field .label{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .field .label span{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);}
  .field textarea{
    width:100%;border:none;background:none;color:var(--ink);
    font-family:inherit;font-size:1rem;line-height:1.6;resize:none;outline:none;
    min-height:80px;padding:0;
  }
  .field textarea::placeholder{color:var(--ink-soft);opacity:.7;}
  .field .text{font-size:1rem;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
  .field.answer{background:var(--ember-soft);border-color:rgba(189,67,28,.3);}

  .reveal-btn{
    display:flex;width:100%;justify-content:center;align-items:center;gap:6px;
    padding:13px;border-radius:14px;border:1.5px dashed var(--border);background:none;
    color:var(--ink-soft);font-weight:700;font-size:.9rem;cursor:pointer;margin-bottom:14px;
  }
  .reveal-btn:hover{background:var(--surface-2);color:var(--ink);}

  .save-hint{
    text-align:center;font-size:.74rem;color:var(--ink-soft);margin-top:2px;min-height:1.4em;
    transition:opacity .3s ease;
  }

  .bottom-actions{display:flex;gap:10px;margin-top:6px;}
  .bottom-actions .btn{flex:1;justify-content:center;}

  .note-box{
    font-size:.78rem;color:var(--ink-soft);line-height:1.6;
    background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-bottom:16px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  var STORAGE_KEY = 'sobangFlashcards';
  var cards = [];
  var view = 'list'; // 'list' | 'card' | 'study' | 'summary'
  var currentId = null;
  var revealed = false;
  var studyQueue = null; // array of ids while a study session is active
  var studyPos = 0;
  var sessionCorrect = 0;
  var sessionWrong = 0;

  function loadCards(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){ return []; }
  }
  function saveCards(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(cards)); }catch(e){}
  }
  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function findCard(id){
    for(var i=0;i<cards.length;i++){ if(cards[i].id===id) return cards[i]; }
    return null;
  }
  function indexOfCard(id){
    for(var i=0;i<cards.length;i++){ if(cards[i].id===id) return i; }
    return -1;
  }
  function newId(){ return Date.now()+'-'+Math.random().toString(36).slice(2,7); }

  function addCard(){
    var card = { id: newId(), q:'', a:'' };
    cards.unshift(card);
    saveCards();
    currentId = card.id;
    revealed = true;
    view = 'card';
    render();
  }
  function deleteCard(id){
    if(!confirm('이 카드를 삭제할까요? 되돌릴 수 없습니다.')) return;
    var idx = indexOfCard(id);
    if(idx===-1) return;
    cards.splice(idx,1);
    saveCards();
    view = 'list';
    currentId = null;
    render();
  }
  function openCard(id){
    currentId = id;
    revealed = false;
    view = 'card';
    render();
  }
  function goList(){ view='list'; currentId=null; studyQueue=null; render(); }
  function goAdjacent(dir){
    var idx = indexOfCard(currentId);
    if(idx===-1) return;
    var next = idx + dir;
    if(next<0 || next>=cards.length) return;
    currentId = cards[next].id;
    revealed = false;
    render();
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function startStudy(opts){
    var pool = opts.onlyWrong ? cards.filter(function(c){ return c.status==='wrong'; }) : cards;
    if(pool.length===0) return;
    var ids = pool.map(function(c){ return c.id; });
    if(opts.random) ids = shuffle(ids);
    studyQueue = ids;
    studyPos = 0;
    sessionCorrect = 0;
    sessionWrong = 0;
    revealed = false;
    view = 'study';
    render();
  }
  function currentStudyCard(){
    if(!studyQueue || studyPos>=studyQueue.length) return null;
    return findCard(studyQueue[studyPos]);
  }
  function gradeCurrent(status){
    var c = currentStudyCard();
    if(!c) return;
    c.status = status;
    if(status==='know') sessionCorrect++; else sessionWrong++;
    saveCards();
    studyPos++;
    revealed = false;
    view = (studyPos>=studyQueue.length) ? 'summary' : 'study';
    render();
  }

  function exportCards(){
    var blob = new Blob([JSON.stringify(cards, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date();
    var stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    a.href = url; a.download = 'flashcards-backup-'+stamp+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function importCardsFromFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var incoming;
      try{ incoming = JSON.parse(reader.result); }catch(e){
        alert('파일을 읽을 수 없어요. 올바른 백업 파일인지 확인해주세요.');
        return;
      }
      if(!Array.isArray(incoming)){
        alert('올바른 백업 파일 형식이 아니에요.');
        return;
      }
      var added = 0;
      incoming.forEach(function(item){
        if(item && typeof item==='object' && ('q' in item || 'a' in item)){
          cards.push({ id:newId(), q:item.q||'', a:item.a||'' });
          added++;
        }
      });
      saveCards();
      alert(added+'개 카드를 가져왔어요 (기존 카드에 추가됨).');
      view='list'; currentId=null; render();
    };
    reader.readAsText(file);
  }

  function renderList(){
    var html = '';
    if(cards.length>0){
      var known = cards.filter(function(c){ return c.status==='know'; }).length;
      var wrong = cards.filter(function(c){ return c.status==='wrong'; }).length;
      html += '<div class="stats-row">'+
        '<div class="stat-pill"><div class="n">'+cards.length+'</div><div class="l">전체</div></div>'+
        '<div class="stat-pill correct"><div class="n">'+known+'</div><div class="l">맞음</div></div>'+
        '<div class="stat-pill wrong"><div class="n">'+wrong+'</div><div class="l">틀림</div></div>'+
      '</div>';
      html += '<div class="study-actions">'+
        '<button type="button" class="btn btn-primary" id="btnStudyAll">▶ 학습 시작 (순서대로)</button>'+
        '<button type="button" class="btn" id="btnStudyRandom">🔀 랜덤 학습</button>'+
        (wrong>0 ? '<button type="button" class="btn btn-ghost" id="btnStudyWrong" style="color:var(--wrong);">🔁 틀린 카드만 복습 ('+wrong+'개)</button>' : '')+
      '</div>';
    }
    if(cards.length===0){
      html += '<div class="empty">아직 카드가 없어요.<br>위쪽 "+ 새 카드"로 첫 카드를 만들어보세요.</div>';
      return html;
    }
    html += cards.map(function(c, i){
      var qPreview = c.q ? esc(c.q).slice(0,60) : '<span style="opacity:.6">(빈 문제)</span>';
      var aPreview = c.a ? esc(c.a).slice(0,60) : '(빈 정답)';
      var dot = c.status==='know' ? '<span class="dot know"></span>' : (c.status==='wrong' ? '<span class="dot wrong"></span>' : '');
      return '<button type="button" class="card-row" data-open="'+c.id+'">'+
        '<span class="num">'+(i+1)+'</span>'+
        '<span class="preview">'+
          '<div class="q">'+qPreview+dot+'</div>'+
          '<div class="a">'+aPreview+'</div>'+
        '</span>'+
        '<span class="chev">›</span>'+
      '</button>';
    }).join('');
    return html;
  }

  function renderStudy(){
    var c = currentStudyCard();
    if(!c){ view='summary'; return renderSummary(); }
    var pct = Math.round((studyPos/studyQueue.length)*100);
    var html = '';
    html += '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>';
    html += '<div class="study-nav"><span class="pos">'+(studyPos+1)+' / '+studyQueue.length+'</span></div>';
    html += '<div class="field">'+
      '<div class="label"><span>문제</span></div>'+
      '<div class="text">'+(esc(c.q)||'<span style="opacity:.6">(빈 문제)</span>')+'</div>'+
    '</div>';
    if(!revealed){
      html += '<button type="button" class="reveal-btn" id="btnReveal">👁 정답 보기</button>';
    } else {
      html += '<div class="field answer">'+
        '<div class="label"><span>정답</span></div>'+
        '<div class="text">'+(esc(c.a)||'(빈 정답)')+'</div>'+
      '</div>';
      html += '<div class="grade-row">'+
        '<button type="button" class="grade-btn wrong" id="btnGradeWrong">✕ 틀렸어요</button>'+
        '<button type="button" class="grade-btn know" id="btnGradeKnow">⭕ 맞았어요</button>'+
      '</div>';
    }
    html += '<div class="bottom-actions"><button type="button" class="btn btn-ghost" id="btnExitStudy">학습 종료</button></div>';
    return html;
  }

  function renderSummary(){
    var total = sessionCorrect + sessionWrong;
    var html = '<div class="summary">';
    html += '<div class="big">'+sessionCorrect+' / '+total+'</div>';
    html += '<div class="sub">이번 학습에서 맞힌 개수예요</div>';
    html += '</div>';
    html += '<div class="study-actions">';
    if(sessionWrong>0){
      html += '<button type="button" class="btn btn-primary" id="btnReviewWrongAgain">🔁 틀린 '+sessionWrong+'개만 다시 학습</button>';
    }
    html += '<button type="button" class="btn" id="btnBackList">목록으로</button>';
    html += '</div>';
    return html;
  }

  function renderCard(){
    var c = findCard(currentId);
    if(!c){ view='list'; return renderList(); }
    var idx = indexOfCard(currentId);
    var html = '';
    html += '<div class="study-nav">'+
      '<button type="button" class="btn btn-ghost btn-sm" id="btnPrev" '+(idx<=0?'disabled':'')+'>← 이전</button>'+
      '<span class="pos">'+(idx+1)+' / '+cards.length+'</span>'+
      '<button type="button" class="btn btn-ghost btn-sm" id="btnNext" '+(idx>=cards.length-1?'disabled':'')+'>다음 →</button>'+
    '</div>';
    html += '<div class="field">'+
      '<div class="label"><span>문제</span></div>'+
      '<textarea id="qInput" placeholder="문제를 입력하세요...">'+esc(c.q)+'</textarea>'+
    '</div>';
    if(!revealed){
      html += '<button type="button" class="reveal-btn" id="btnReveal">👁 정답 보기 / 쓰기</button>';
    } else {
      html += '<div class="field answer">'+
        '<div class="label"><span>정답</span></div>'+
        '<textarea id="aInput" placeholder="정답을 입력하세요...">'+esc(c.a)+'</textarea>'+
      '</div>';
    }
    html += '<div class="save-hint" id="saveHint">&nbsp;</div>';
    html += '<div class="bottom-actions">'+
      '<button type="button" class="btn btn-ghost btn-danger" id="btnDelete">🗑 카드 삭제</button>'+
    '</div>';
    return html;
  }

  function render(){
    var main = document.getElementById('main');
    if(view==='list') main.innerHTML = renderList();
    else if(view==='card') main.innerHTML = renderCard();
    else if(view==='study') main.innerHTML = renderStudy();
    else if(view==='summary') main.innerHTML = renderSummary();
    updateTopRow();
    bind();
  }

  var saveTimer = null;
  function scheduleSave(){
    var hint = document.getElementById('saveHint');
    if(hint) hint.textContent = '저장 중...';
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      saveTimer = null;
      saveCards();
      var h = document.getElementById('saveHint');
      if(h) h.textContent = '✓ 저장됨';
    }, 400);
  }
  // If the app gets backgrounded (switching apps, phone call, locking the
  // screen) mid-edit, the 400ms debounce above might not have fired yet —
  // flush immediately so nothing typed is ever lost.
  function flushSave(){
    if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
    saveCards();
  }
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='hidden') flushSave();
  });
  window.addEventListener('pagehide', flushSave);
  window.addEventListener('beforeunload', flushSave);
  function autoResize(el){
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight + 2) + 'px';
  }

  function bind(){
    if(view==='list'){
      document.querySelectorAll('[data-open]').forEach(function(btn){
        btn.onclick = function(){ openCard(btn.getAttribute('data-open')); };
      });
      var btnStudyAll = document.getElementById('btnStudyAll');
      var btnStudyRandom = document.getElementById('btnStudyRandom');
      var btnStudyWrong = document.getElementById('btnStudyWrong');
      if(btnStudyAll) btnStudyAll.onclick = function(){ startStudy({onlyWrong:false, random:false}); };
      if(btnStudyRandom) btnStudyRandom.onclick = function(){ startStudy({onlyWrong:false, random:true}); };
      if(btnStudyWrong) btnStudyWrong.onclick = function(){ startStudy({onlyWrong:true, random:false}); };
      return;
    }
    if(view==='study'){
      var btnReveal2 = document.getElementById('btnReveal');
      var btnGradeWrong = document.getElementById('btnGradeWrong');
      var btnGradeKnow = document.getElementById('btnGradeKnow');
      var btnExitStudy = document.getElementById('btnExitStudy');
      if(btnReveal2) btnReveal2.onclick = function(){ revealed = true; render(); };
      if(btnGradeWrong) btnGradeWrong.onclick = function(){ gradeCurrent('wrong'); };
      if(btnGradeKnow) btnGradeKnow.onclick = function(){ gradeCurrent('know'); };
      if(btnExitStudy) btnExitStudy.onclick = goList;
      return;
    }
    if(view==='summary'){
      var btnReviewWrongAgain = document.getElementById('btnReviewWrongAgain');
      var btnBackList = document.getElementById('btnBackList');
      if(btnReviewWrongAgain) btnReviewWrongAgain.onclick = function(){ startStudy({onlyWrong:true, random:false}); };
      if(btnBackList) btnBackList.onclick = goList;
      return;
    }
    var qInput = document.getElementById('qInput');
    var aInput = document.getElementById('aInput');
    var btnPrev = document.getElementById('btnPrev');
    var btnNext = document.getElementById('btnNext');
    var btnReveal = document.getElementById('btnReveal');
    var btnDelete = document.getElementById('btnDelete');

    if(qInput){
      autoResize(qInput);
      qInput.oninput = function(){
        var c = findCard(currentId);
        if(c){ c.q = qInput.value; scheduleSave(); }
        autoResize(qInput);
      };
    }
    if(aInput){
      autoResize(aInput);
      aInput.oninput = function(){
        var c = findCard(currentId);
        if(c){ c.a = aInput.value; scheduleSave(); }
        autoResize(aInput);
      };
    }
    if(btnPrev) btnPrev.onclick = function(){ goAdjacent(-1); };
    if(btnNext) btnNext.onclick = function(){ goAdjacent(1); };
    if(btnReveal) btnReveal.onclick = function(){ revealed = true; render(); if(document.getElementById('aInput')) document.getElementById('aInput').focus(); };
    if(btnDelete) btnDelete.onclick = function(){ deleteCard(currentId); };
  }

  function updateTopRow(){
    var topCount = document.getElementById('topCount');
    var btnList = document.getElementById('btnList');
    var btnAdd = document.getElementById('btnAdd');
    var btnExport = document.getElementById('btnExport');
    var btnImport = document.getElementById('btnImport');
    if(view==='list'){
      topCount.textContent = cards.length+'개의 카드';
      btnList.style.display = 'none';
      btnAdd.style.display = '';
      btnExport.style.display = '';
      btnImport.style.display = '';
    } else {
      topCount.textContent = '';
      btnList.style.display = (view==='card') ? '' : 'none';
      btnAdd.style.display = 'none';
      btnExport.style.display = 'none';
      btnImport.style.display = 'none';
    }
  }

  function renderShell(){
    var app = document.getElementById('app');
    app.innerHTML =
      '<header>'+
        '<div class="brand">🔥 FIRE ENGINEER</div>'+
        '<h1>플래시카드</h1>'+
        '<p class="subtitle">직접 만드는 문제·정답 카드</p>'+
      '</header>'+
      '<main>'+
        '<div class="toprow">'+
          '<span class="count" id="topCount"></span>'+
          '<button type="button" class="btn btn-ghost btn-sm" id="btnList" style="display:none;">← 목록</button>'+
          '<button type="button" class="btn btn-ghost btn-sm" id="btnImport">가져오기</button>'+
          '<button type="button" class="btn btn-ghost btn-sm" id="btnExport">내보내기</button>'+
          '<input type="file" id="fileImport" accept="application/json" style="display:none;" />'+
          '<button type="button" class="btn btn-primary btn-sm" id="btnAdd">+ 새 카드</button>'+
        '</div>'+
        '<div class="note-box">이 기기(브라우저)에 자동 저장돼요. 다른 기기와는 공유되지 않으니, 다른 폰·PC로 옮기고 싶으면 "내보내기"로 파일을 저장한 뒤 그쪽에서 "가져오기"로 불러오세요.</div>'+
        '<div id="main"></div>'+
      '</main>';
    document.getElementById('btnAdd').onclick = addCard;
    document.getElementById('btnList').onclick = goList;
    document.getElementById('btnExport').onclick = exportCards;
    var fileInput = document.getElementById('fileImport');
    document.getElementById('btnImport').onclick = function(){ fileInput.click(); };
    fileInput.onchange = function(){
      if(fileInput.files && fileInput.files[0]) importCardsFromFile(fileInput.files[0]);
      fileInput.value = '';
    };
    render();
  }

  cards = loadCards();
  renderShell();
})();
</script>
</body>
</html>
